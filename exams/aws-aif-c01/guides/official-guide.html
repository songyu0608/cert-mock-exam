lth Dashboard<\/li><li>AWS Launch Wizard<\/li><li>AWS License Manager<\/li><li>Amazon Managed Grafana<\/li><li>Amazon Managed Service for Prometheus<\/li><li>AWS OpsWorks<\/li><li>AWS Organizations<\/li><li>AWS Proton<\/li><li>AWS Resilience Hub<\/li><li>AWS Resource Explorer<\/li><li>AWS Resource Groups<\/li><li>AWS Systems Manager Incident Manager<\/li><li>AWS Service Catalog<\/li><li>Service Quotas<\/li><li>AWS Telco Network Builder<\/li><li>AWS User Notifications<\/li><\/ul>", "<h3>メディア<\/h3>\n<ul><li>Amazon Elastic Transcoder<\/li><li>AWS Elemental MediaConnect<\/li><li>AWS Elemental MediaConvert<\/li><li>AWS Elemental MediaLive<\/li><li>AWS Elemental MediaPackage<\/li><li>AWS Elemental MediaStore<\/li><li>AWS Elemental MediaTailor<\/li><li>Amazon Interactive Video Service (Amazon IVS)<\/li><li>Amazon Nimble Studio<\/li><\/ul>", "<h3>移行と転送<\/h3>\n<ul><li>AWS Application Discovery Service<\/li><li>AWS Application Migration Service<\/li><li>AWS Database Migration Service (AWS DMS)<\/li><li>AWS DataSync<\/li><li>AWS Mainframe Modernization<\/li><li>AWS Migration Hub<\/li><li>AWS Transfer Family<\/li><\/ul>", "<h3>ネットワークとコンテンツ配信<\/h3>\n<ul><li>AWS App Mesh<\/li><li>AWS Cloud Map<\/li><li>AWS Direct Connect<\/li><li>AWS Global Accelerator<\/li><li>AWS Private 5G<\/li><li>Amazon Route 53<\/li><li>Amazon Route 53 Application Recovery Controller<\/li><li>Amazon VPC IP Address Manager (IPAM)<\/li><\/ul>", "<h3>セキュリティ、アイデンティティ、コンプライアンス<\/h3>\n<ul><li>AWS Certificate Manager (ACM)<\/li><li>AWS CloudHSM<\/li><li>Amazon Cognito<\/li><li>Amazon Detective<\/li><li>AWS Directory Service<\/li><li>AWS Firewall Manager<\/li><li>Amazon GuardDuty<\/li><li>AWS IAM アイデンティティセンター<\/li><li>AWS Payment Cryptography<\/li><li>AWS Private Certificate Authority<\/li><li>AWS Resource Access Manager (AWS RAM)<\/li><li>AWS Security Hub<\/li><li>Amazon Security Lake<\/li><li>AWS Shield<\/li><li>AWS Signer<\/li><li>Amazon Verified Permissions<\/li><li>AWS WAF<\/li><\/ul>", "<h3>ストレージ<\/h3>\n<ul><li>AWS Backup<\/li><li>AWS Elastic Disaster Recovery<\/li><\/ul>"]}, {"n": "13", "title": "改訂", "secs": ["<p>AWS 試験ガイドは、各認定試験において認定対象となる職務に関連する AWS のサービスおよび機能を確認し、スキルをテストするために、定期的に見直され、更新されています。試験ガイドの更新版は、更新内容が試験に反映される約 1 か月前に公開されます。<\/p><h3>変更履歴<\/h3>\n<table><thead><tr><th>バージョン<\/th><th>公開日<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>2026 年 3 月 26 日<\/td><\/tr><tr><td>1.1<\/td><td>2026 年 4 月 30 日<\/td><\/tr><\/tbody><\/table><h3>変更された対象<\/h3>\n<table><thead><tr><th><strong>バージョン 1.0<\/strong><\/th><th><strong>バージョン 1.1<\/strong><\/th><\/tr><\/thead><tbody><tr><td>対象 1.1.1: 基本的な AI 用語 [AI、ML、深層学習、ニューラルネットワーク、コンピュータビジョン、自然言語処理 (NLP)、モデル、アルゴリズム、トレーニングと推論、バイアス、公平性、フィット、大規模言語モデル (LLM) など] を定義する。<\/td><td>対象 1.1.1: 基本的な AI 用語 [AI、ML、深層学習、ニューラルネットワーク、コンピュータビジョン、自然言語処理 (NLP)、モデル、アルゴリズム、トレーニングと推論、バイアス、公平性、フィット、大規模言語モデル (LLM)、生成 AI (GenAI)、エージェンティック AI など] を定義する。<\/td><\/tr><tr><td>対象 1.1.2: AI、ML、GenAI、深層学習の類似点と相違点を説明する。<\/td><td>対象 1.1.2: AI、ML、GenAI、深層学習、エージェンティック AI の類似点と相違点を説明する。<\/td><\/tr><tr><td>対象 1.1.3: さまざまな種類の推論 (バッチ、リアルタイムなど) について説明する。<\/td><td>対象 1.1.3: さまざまな種類の推論 (バッチ、リアルタイム、非同期、サーバーレスなど) について説明する。<\/td><\/tr><tr><td>対象 1.1.5: 教師あり学習、教師なし学習、強化学習について説明する。<\/td><td>対象 1.1.5: さまざまな種類の AI/ML 学習 (教師あり学習、教師なし学習、強化学習の方法など) について説明する。<\/td><\/tr><tr><td>対象 1.2.4: 実際の AI 応用例 (コンピュータビジョン、NLP、音声認識、レコメンデーションシステム、不正検出、予測など) を特定する。<\/td><td>対象 1.2.4: 実際の AI 応用例 (コンピュータビジョン、NLP、音声認識、レコメンデーションシステム、不正検出、予測、ナレッジベース、エージェンティック AI など) を特定する。<\/td><\/tr><tr><td>対象 1.3.1: ML パイプラインの構成要素 [データ収集、探索的データ分析 (EDA)、データ前処理、特徴量エンジニアリング、モデルトレーニング、ハイパーパラメータのチューニング、評価、デプロイ、モニタリングなど] について説明する。<\/td><td>対象 1.3.1: AI/ML パイプラインのコンポーネントを説明し、区別する。<\/td><\/tr><tr><td>対象 1.3.4: ML パイプラインの各ステージに関連する AWS のサービスと機能 (SageMaker AI、SageMaker Data Wrangler、SageMaker Feature Store、SageMaker Model Monitor など) を特定する。<\/td><td>対象 1.3.4: AI/ML パイプラインの各ステージに関連する AWS のサービスと機能 (Amazon Bedrock、Amazon Q、Amazon Quick、Kiro、SageMaker AI など) を特定する。<\/td><\/tr><tr><td>対象 1.3.6: ML モデルを評価するためのモデルパフォーマンスメトリクス [正解率、曲線下面積 (AUC)、F1 スコアなど] とビジネスメトリクス [ユーザーあたりのコスト、開発コスト、顧客からのフィードバック、投資収益率 (ROI) など] を説明する。<\/td><td>対象 1.3.6: ML モデルを評価するためのモデルパフォーマンスメトリクス (正解率、適合率、再現率、F1 スコアなど) とビジネスメトリクス [ユーザーあたりのコスト、開発コスト、顧客からのフィードバック、投資収益率 (ROI) など] を説明する。<\/td><\/tr><tr><td>対象 2.2.1: GenAI の利点 (適応性、応答性、シンプルさなど) を説明する。<\/td><td>対象 2.2.1: GenAI の利点 (適応性、応答性、会話能力、コンテンツ生成能力など) を説明する。<\/td><\/tr><tr><td>対象 2.2.3: GenAI モデルを選択する際に考慮すべき要素 (モデルタイプ、パフォーマンス要件、機能、制約、コンプライアンスなど) を特定する。<\/td><td>対象 2.2.3: GenAI モデルを選択する際に考慮すべき要素 (モデルタイプ、パフォーマンス要件、機能、制約、コンプライアンス、コスト、レイテンシー、モデルの複雑さなど) を特定する。<\/td><\/tr><tr><td>対象 2.2.4: GenAI アプリケーションのビジネス価値とメトリクス (クロスドメインのパフォーマンス、効率性、コンバージョン率、ユーザーあたりの平均収益、正解率、顧客生涯価値など) を見極める。<\/td><td>対象 2.2.4: GenAI アプリケーションのビジネス価値とメトリクス (クロスドメインのパフォーマンス、ROI、効率性、コンバージョン率、ユーザーあたりの平均収益、正解率、顧客生涯価値など) を見極める。<\/td><\/tr><tr><td>対象 2.3.1: GenAI アプリケーションを開発するための AWS のサービスと機能 (Amazon SageMaker Jumpstart、Amazon Bedrock PartyRock、Amazon Q、Amazon Bedrock Data Automation など) を特定する。<\/td><td>対象 2.3.1: GenAI アプリケーションを開発するための AWS のサービスと機能 (Amazon Bedrock、Amazon SageMaker AI、SageMaker JumpStart、Amazon Quick、Kiro、Strands Agents、Amazon Bedrock AgentCore など) を特定する。<\/td><\/tr><tr><td>対象 3.1.5: FM をカスタマイズするためのさまざまなアプローチ (事前トレーニング、ファインチューニング、コンテキスト内学習、RAG など) のコスト面でのトレードオフを説明する。<\/td><td>対象 3.1.5: FM をカスタマイズするためのさまざまなアプローチ (事前トレーニング、ファインチューニング、コンテキスト内学習、RAG、モデル蒸留など) のコスト面でのトレードオフを説明する。<\/td><\/tr><tr><td>対象 3.1.6: マルチステップのタスクにおけるエージェントのロール (Amazon Bedrock エージェント、エージェンティック AI、モデルコンテキストプロトコルなど) を説明する。<\/td><td>対象 3.1.6: AI エージェントの役割を定義し、ビジネスにおける AI エージェントの活用方法を説明する。<\/td><\/tr><tr><td>対象 3.4.1: FM のパフォーマンスを評価する手法 (人間による評価、ベンチマークデータセット、Amazon Bedrock のモデル評価など) を特定する。<\/td><td>対象 3.4.1: FM のパフォーマンスを評価する手法 (ヒューマンインザループによる評価、ベンチマークデータセット、Amazon Bedrock のモデル評価など) を特定する。<\/td><\/tr><tr><td>対象 3.4.2: FM のパフォーマンスを評価するための関連メトリクス [Recall-Oriented Understudy for Gisting Evaluation (ROUGE)、Bilingual Evaluation Understudy (BLEU)、BERTScore など] を特定する。<\/td><td>対象 3.4.2: FM のパフォーマンスを評価するための関連メトリクス [Recall-Oriented Understudy for Gisting Evaluation (ROUGE)、Bilingual Evaluation Understudy (BLEU)、BERTScore、LLM-as-a-judge など] を特定する。<\/td><\/tr><tr><td>対象 4.2.2: 透明で説明可能なモデルを識別するためのツール (Amazon SageMaker Model Cards、オープンソースモデル、データ、ライセンスなど) を説明する。<\/td><td>対象 4.2.2: 透明性の高い説明可能なモデルを識別するためのツール (Amazon SageMaker Model Cards、SageMaker Clarify、Amazon Bedrock のモデル評価、オープンソースモデル、データ、ライセンスなど) を説明する。<\/td><\/tr><tr><td>対象 4.2.4: 説明可能な AI のための人間中心設計の原則を説明する。<\/td><td>対象 4.2.4: 説明可能な AI のための人間中心設計の原則 (ユーザーフィードバックメカニズム、AI 意思決定の透明性など) を説明する。<\/td><\/tr><tr><td>対象 5.1.1: AI システムを保護するための AWS のサービスと機能 (IAM ロール・ポリシー・アクセス許可、暗号化、Amazon Macie、AWS PrivateLink、AWS 責任共有モデルなど) を特定する。<\/td><td>対象 5.1.1: AI システムを保護するための AWS のサービスと機能 (IAM ロール・ポリシー・アクセス許可、暗号化、Amazon Macie、AWS PrivateLink、AWS 責任共有モデル、Amazon Bedrock AgentCore Identity、AgentCore のポリシー、Amazon Bedrock Guardrails など) を特定する。<\/td><\/tr><tr><td>対象 5.1.4: AI システムのセキュリティとプライバシーに関する考慮事項 (アプリケーションセキュリティ、脅威検出、脆弱性管理、インフラストラクチャ保護、プロンプトインジェクション、保管中および転送中の暗号化など) を説明する。<\/td><td>対象 5.1.4: AI システムのセキュリティとプライバシーに関する考慮事項 (アプリケーションセキュリティ、脅威検出、脆弱性管理、インフラストラクチャ保護、プロンプトインジェクション、保管中および転送中の暗号化、データリークの防止、出力のフィルタリングと検証、AI インタラクションの監査証跡とログ要件、毒性など) を説明する。<\/td><\/tr><\/tbody><\/table>\n<p><strong>追加された対象<\/strong><\/p>\n<ul><li>対象 1.2.6: 従来の ML モデルまたは基盤モデル (FM) が特定のユースケースに適する場合を (規制上の懸念、説明可能性の要件、運用上の制約などに基づいて) 特定する。<\/li><li>対象 2.1.4: トークンベースの価格設定モデルと、推論のコストとパフォーマンスに及ぼすその影響を説明する。<\/li><li>対象 2.1.5: FM アプリケーションにおけるコンテキストエンジニアリングの役割を説明する。<\/li><li>対象 2.1.6: エージェンティック AI の基本的な概念 [複雑な AI アプリケーションのマルチエージェントシステムパターン、エージェントを外部システムに接続する際のモデルコンテキストプロトコル (MCP) とその役割、マルチエージェント通信パターン、メモリ管理、ツールの使用、ワークフローオーケストレーションなど] を定義する。<\/li><li>対象 3.2.5: Amazon Bedrock Prompt Management を使用するプロンプトのバージョン管理と管理戦略を説明する。<\/li><li>対象 3.4.5: AI アプリケーションのビジネス目標整合指標 (タスク完了率、ユーザー満足度、インタラクションあたりのコストなど) を特定する。<\/li><li>対象 5.1.5: 出力精度を向上させるためのハルシネーション検出方法とグラウンディング手法 [検索拡張生成 (RAG) グラウンディング、出力検証、信頼度スコアリングなど] を説明する。<\/li><\/ul><h3>対象および対象外のサービスの変更点<\/h3><h4>対象リストに追加されたサービス<\/h4>\n<ul><li>Amazon Aurora<\/li><li>Amazon Bedrock AgentCore<\/li><li>Kiro<\/li><li>Strands Agents<\/li><li>Amazon Q<\/li><li>Amazon SageMaker JumpStart<\/li><li>AWS Transform<\/li><\/ul><h4>対象リストから削除されたサービス<\/h4>\n<ul><li>Amazon MemoryDB<\/li><\/ul><h4>対象外リストから削除されたサービス<\/h4>\n<ul><li>AWS DeepComposer<\/li><li>Amazon FinSpace<\/li><li>Amazon Honeycode<\/li><li>AWS IAM アイデンティティセンター<\/li><li>AWS Marketplace<\/li><li>AWS Organizations<\/li><li>Amazon WorkDocs<\/li><\/ul>"]}, {"n": "14", "title": "アンケート", "secs": ["<p>この試験ガイドはどの程度役に立ちましたか。ご意見をお待ちしています。<a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=AI-Foundational&amp;course_id=AIF-C01&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">アンケートへの回答<\/a>にご協力ください。<\/p>"]}]}, "en": {"title": "AWS Certified AI Practitioner (AIF-C01)", "note": ["Source: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01.html (retrieved 2026-11-06)"], "ch": [{"n": "1", "title": "AWS Certified AI Practitioner (AIF-C01)", "secs": ["<p>The AWS Certified AI Practitioner (AIF-C01) exam is designed for individuals who want to demonstrate a foundational understanding of AI concepts and AWS AI tools. This certification focuses on practical business applications of AI.<\/p>"]}, {"n": "2", "title": "Introduction", "secs": ["<p>The <a href=\"https://aws.amazon.com/certification/certified-ai-practitioner/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Certified AI Practitioner (AIF-C01)<\/a> exam is designed for individuals who want to demonstrate a foundational understanding of AI concepts and AWS AI tools. This certification focuses on practical business applications of AI.<\/p>\n<p>The exam also validates a candidate's ability to complete the following tasks:<\/p>\n<ul><li>Describe AI, ML, and generative AI (GenAI) concepts, methods, and strategies in general and on AWS.<\/li><li>Identify the appropriate use of AI/ML and GenAI technologies to solve business problems.<\/li><li>Determine the correct types of AI/ML technologies to apply to specific use cases.<\/li><li>Use AI, ML, and GenAI technologies responsibly.<\/li><\/ul>"]}, {"n": "3", "title": "Target candidate description", "secs": ["<p>The target candidate should have up to 6 months of exposure to AI/ML technologies on AWS. The target candidate uses but does not necessarily build AI/ML solutions on AWS.<\/p>", "<h3>Recommended AWS knowledge<\/h3>\n<p>The target candidate should have the following AWS knowledge:<\/p>\n<ul><li>Familiarity with the core AWS services (for example, Amazon EC2, Amazon S3, AWS Lambda, Amazon Bedrock, and Amazon SageMaker AI) and AWS core services use cases<\/li><li>Familiarity with the AWS shared responsibility model for security and compliance in the AWS Cloud<\/li><li>Familiarity with AWS Identity and Access Management (IAM) for securing and controlling access to AWS resources<\/li><li>Familiarity with AWS service pricing models<\/li><\/ul>", "<h3>Job tasks that are out of scope for the target candidate<\/h3>\n<p>The following list contains job tasks that the target candidate is not expected to be able to perform. This list is non-exhaustive. These tasks are out of scope for the exam:<\/p>\n<ul><li>Developing or coding AI/ML models or algorithms<\/li><li>Implementing data engineering or feature engineering techniques<\/li><li>Performing hyperparameter tuning or model optimization<\/li><li>Building and deploying AI/ML pipelines or infrastructure<\/li><li>Conducting mathematical or statistical analysis of AI/ML models<\/li><li>Implementing security or compliance protocols for AI/ML systems<\/li><li>Developing and implementing governance frameworks and policies for AI/ML solutions<\/li><\/ul>"]}, {"n": "4", "title": "Exam content", "secs": ["", "<h3>Question types<\/h3>\n<p>The exam contains one or more of the following question types:<\/p>\n<ul><li><strong>Multiple choice:<\/strong> Has one correct response and three incorrect responses (distractors).<\/li><li><strong>Multiple response:<\/strong> Has two or more correct responses out of five or more response options. You must select all the correct responses to receive credit for the question.<\/li><li><strong>Ordering:<\/strong> Has a list of 3–5 responses to complete a specified task. You must select the correct responses and place the responses in the correct order to receive credit for the question.<\/li><li><strong>Matching:<\/strong> Has a list of responses to match with a list of 3–7 prompts. You must match all the pairs correctly to receive credit for the question.<\/li><\/ul>\n<p>Unanswered questions are scored as incorrect. There is no penalty for guessing. The exam includes 50 questions that affect your score.<\/p>", "<h3>Unscored content<\/h3>\n<p>The exam includes 15 unscored questions that do not affect your score. AWS collects information about performance on these unscored questions to evaluate them for future use as scored questions. The unscored questions are not identified on the exam.<\/p>", "<h3>Exam results<\/h3>\n<p>The AWS Certified AI Practitioner (AIF-C01) exam has a pass or fail designation. The exam is scored against a minimum standard established by AWS professionals who follow certification industry best practices and guidelines.<\/p>\n<p>Your results for the exam are reported as a scaled score of 100–1,000. The minimum passing score is 700. Your score shows how you performed on the exam as a whole and whether you passed. Scaled scoring models help equate scores across multiple exam forms that might have slightly different difficulty levels.<\/p>\n<p>Your score report could contain a table of classifications of your performance at each section level. The exam uses a compensatory scoring model, which means that you do not need to achieve a passing score in each section. You need to pass only the overall exam.<\/p>\n<p>Each section of the exam has a specific weighting, so some sections have more questions than other sections have. The table of classifications contains general information that highlights your strengths and weaknesses. Use caution when you interpret section-level feedback.<\/p>"]}, {"n": "5", "title": "Content outline", "secs": ["<p>This exam guide includes weightings, content domains, tasks, and skills for the exam. This guide does not provide a comprehensive list of the content on the exam.<\/p>\n<p>The exam has the following content domains and weightings:<\/p>\n<ul><li>Content Domain 1: Fundamentals of AI and ML (20% of scored content)<\/li><li>Content Domain 2: Fundamentals of GenAI (24% of scored content)<\/li><li>Content Domain 3: Applications of Foundation Models (28% of scored content)<\/li><li>Content Domain 4: Guidelines for Responsible AI (14% of scored content)<\/li><li>Content Domain 5: Security, Compliance, and Governance for AI Solutions (14% of scored content)<\/li><\/ul>"]}, {"n": "6", "title": "Content Domain 1: Fundamentals of AI and ML", "secs": ["<p>Domain 1 covers the fundamentals of AI and ML and represents 20% of the scored content on the exam.<\/p>", "<h3>Task Statement 1.1: Explain basic AI concepts and terminologies.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Define basic AI terms (for example, AI, ML, deep learning, neural networks, computer vision, natural language processing [NLP], model, algorithm, training and inferencing, bias, fairness, fit, large language model [LLM], generative AI [GenAI], agentic AI).<\/li><li>Describe the similarities and differences between AI, ML, GenAI, deep learning, and agentic AI.<\/li><li>Describe various types of inferencing (for example, batch, real-time, asynchronous, serverless).<\/li><li>Describe the different types of data in AI models (for example, labeled and unlabeled, tabular, time-series, image, text, structured and unstructured).<\/li><li>Describe different types of AI/ML learning (for example, supervised learning, unsupervised learning, reinforcement learning methods).<\/li><\/ul>", "<h3>Task Statement 1.2: Identify practical use cases for AI.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Recognize applications where AI/ML can provide value (for example, assist human decision making, solution scalability, automation).<\/li><li>Determine when AI/ML solutions are not appropriate (for example, cost-benefit analyses, situations when a specific outcome is needed instead of a prediction).<\/li><li>Select the appropriate AI/ML techniques for specific use cases (for example, regression, classification, clustering).<\/li><li>Identify examples of real-world AI applications (for example, computer vision, NLP, speech recognition, recommendation systems, fraud detection, forecasting, knowledge bases, agentic AI).<\/li><li>Explain the capabilities of AWS managed AI/ML services (for example, Amazon SageMaker AI, Amazon Transcribe, Amazon Translate, Amazon Comprehend, Amazon Lex, Amazon Polly).<\/li><li>Identify when traditional ML models or foundation models (FMs) are appropriate for a specific use case (for example, based on regulatory concerns, explainability requirements, operational constraints).<\/li><\/ul>", "<h3>Task Statement 1.3: Describe the AI/ML development lifecycle.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Describe and differentiate components of an AI/ML pipeline.<\/li><li>Describe sources of FM models (for example, open source pre-trained models, training custom models).<\/li><li>Describe methods to use a model in production (for example, managed API service, self-hosted API).<\/li><li>Identify relevant AWS services and features for each stage of an AI/ML pipeline (for example, Amazon Bedrock, Amazon Quick, Kiro, SageMaker AI).<\/li><li>Describe fundamental concepts of ML operations (MLOps) (for example, experimentation, repeatable processes, scalable systems, managing technical debt, achieving production readiness, model monitoring, model re-training).<\/li><li>Describe model performance metrics (for example, accuracy, precision, recall, F1 score) and business metrics (for example, cost per user, development costs, customer feedback, return on investment [ROI]) to evaluate ML models.<\/li><\/ul>"]}, {"n": "7", "title": "Content Domain 2: Fundamentals of GenAI", "secs": ["<p>Domain 2 covers the fundamentals of GenAI and represents 24% of the scored content on the exam.<\/p>", "<h3>Task Statement 2.1: Explain the basic concepts of generative AI (GenAI).<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Define foundational GenAI concepts (for example, tokens, chunking, embeddings, vectors, prompt engineering, transformer-based large language models [LLMs], foundation models [FMs], multi-modal models, diffusion models).<\/li><li>Identify potential use cases for GenAI models (for example, image, video, and audio generation; summarization; AI assistants; translation; code generation; customer service agents; search; recommendation engines).<\/li><li>Describe the FM lifecycle (for example, data selection, model selection, pre-training, fine-tuning, evaluation, deployment, feedback).<\/li><li>Describe the token-based pricing model and its effect on cost and performance for inference.<\/li><li>Describe the role of context engineering in FM applications.<\/li><li>Define foundational agentic AI concepts (for example, multi-agent system patterns for complex AI applications, Model Context Protocol [MCP] and its role in connecting agents to external systems, multi-agent communication patterns, memory management, tool usage, and workflow orchestration).<\/li><\/ul>", "<h3>Task Statement 2.2: Understand the capabilities and limitations of GenAI for solving business problems.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Describe the advantages of GenAI (for example, adaptability, responsiveness, conversational capabilities, ability to generate content).<\/li><li>Identify disadvantages of GenAI solutions (for example, hallucinations, interpretability, inaccuracy, nondeterminism).<\/li><li>Identify factors to consider when selecting GenAI models (for example, model types, performance requirements, capabilities, constraints, compliance, cost, latency, model complexity).<\/li><li>Determine business value and metrics for GenAI applications (for example, cross-domain performance, ROI, efficiency, conversion rate, average revenue per user, accuracy, customer lifetime value).<\/li><\/ul>", "<h3>Task Statement 2.3: Describe AWS infrastructure and technologies for building GenAI applications.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Identify AWS services and features to develop GenAI applications (for example, Amazon Bedrock, Amazon SageMaker AI, SageMaker JumpStart, Amazon Quick, Kiro, Strands Agents, Amazon Bedrock AgentCore).<\/li><li>Describe the advantages of using AWS GenAI services to build applications (for example, accessibility, lower barrier to entry, efficiency, cost-effectiveness, speed to market, ability to meet business objectives).<\/li><li>Describe the benefits of AWS infrastructure for GenAI applications (for example, security, compliance, responsibility, safety).<\/li><li>Describe cost tradeoffs of AWS GenAI services (for example, responsiveness, availability, redundancy, performance, regional coverage, token-based pricing, provision throughput, custom models).<\/li><\/ul>"]}, {"n": "8", "title": "Content Domain 3: Applications of Foundation Models", "secs": ["<p>Domain 3 covers applications of foundation models and represents 28% of the scored content on the exam.<\/p>", "<h3>Task Statement 3.1: Describe design considerations for applications that use foundation models (FMs).<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Identify selection criteria to choose FMs (for example, cost, modality, latency, multi-lingual, model size, model complexity, customization, input/output length, prompt caching).<\/li><li>Describe the effect of inference parameters on model responses (for example, temperature, input/output length).<\/li><li>Define Retrieval Augmented Generation (RAG) and describe its business applications (for example, Amazon Bedrock Knowledge Bases).<\/li><li>Identify AWS services that help store embeddings within vector databases (for example, Amazon OpenSearch Service, Amazon Aurora, Amazon Neptune, Amazon RDS for PostgreSQL).<\/li><li>Explain the cost tradeoffs of various approaches to FM customization (for example, pre-training, fine-tuning, in-context learning, RAG, model distillation).<\/li><li>Define the role of AI agents and describe AI agents' business applications.<\/li><\/ul>", "<h3>Task Statement 3.2: Choose effective prompt engineering techniques.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Define the concepts and constructs of prompt engineering (for example, context, instruction, negative prompts).<\/li><li>Define techniques for prompt engineering (for example, chain-of-thought, zero-shot, single-shot, few-shot, prompt templates).<\/li><li>Identify and describe the benefits and best practices for prompt engineering (for example, response quality improvement, experimentation, guardrails, discovery, specificity and concision, using multiple comments).<\/li><li>Define potential risks and limitations of prompt engineering (for example, exposure, poisoning, hijacking, jailbreaking).<\/li><li>Describe prompt versioning and management strategies that use Amazon Bedrock Prompt Management.<\/li><\/ul>", "<h3>Task Statement 3.3: Describe the training and fine-tuning process for FMs.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Describe the key elements of training an FM (for example, pre-training, fine-tuning, continuous pre-training, distillation).<\/li><li>Define methods for fine-tuning an FM (for example, instruction tuning, adapting models for specific domains, transfer learning, continuous pre-training).<\/li><li>Describe how to prepare data to fine-tune an FM (for example, data curation, governance, size, labeling, representativeness, reinforcement learning from human feedback [RLHF]).<\/li><\/ul>", "<h3>Task Statement 3.4: Describe methods to evaluate FM performance.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Determine approaches to evaluate FM performance (for example, human-in-the-loop evaluation, benchmark datasets, Amazon Bedrock Model Evaluation).<\/li><li>Identify relevant metrics to assess FM performance (for example, Recall-Oriented Understudy for Gisting Evaluation [ROUGE], Bilingual Evaluation Understudy [BLEU], BERTScore, LLM-as-a-judge).<\/li><li>Determine whether an FM effectively meets business objectives (for example, productivity, user engagement, task engineering).<\/li><li>Identify approaches to evaluate the performance of applications built with FM (for example, RAG, agents, workflows).<\/li><li>Identify business objective alignment metrics for AI applications (for example, task completion rate, user satisfaction, cost per interaction).<\/li><\/ul>"]}, {"n": "9", "title": "Content Domain 4: Guidelines for Responsible AI", "secs": ["<p>Domain 4 covers guidelines for responsible AI and represents 14% of the scored content on the exam.<\/p>", "<h3>Task Statement 4.1: Explain the development of AI systems that are responsible.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Identify features of responsible AI (for example, bias, fairness, inclusivity, robustness, safety, veracity).<\/li><li>Explain how to use tools to identify features of responsible AI (for example, Amazon Bedrock Guardrails).<\/li><li>Define responsible practices to select a model (for example, environmental considerations, sustainability).<\/li><li>Identify legal risks of working with generative AI (GenAI) (for example, intellectual property infringement claims, biased model outputs, loss of customer trust, end user risk, hallucinations).<\/li><li>Identify characteristics of datasets (for example, inclusivity, diversity, curated data sources, balanced datasets).<\/li><li>Describe effects of bias and variance (for example, effects on demographic groups, inaccuracy, overfitting, underfitting).<\/li><li>Describe tools to detect and monitor bias, trustworthiness, and truthfulness (for example, analyzing label quality, human audits, subgroup analysis).<\/li><\/ul>", "<h3>Task Statement 4.2: Recognize the importance of transparent and explainable models.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Describe the differences between models that are transparent and explainable and models that are not transparent and explainable.<\/li><li>Describe tools to identify transparent and explainable models (for example, Amazon SageMaker Model Cards, Amazon Bedrock Model Evaluations, open source models, data, licensing).<\/li><li>Identify tradeoffs between model safety and transparency (for example, measure interpretability and performance).<\/li><li>Describe principles of human-centered design for explainable AI (for example, user-feedback mechanisms, AI decision transparency).<\/li><\/ul>"]}, {"n": "10", "title": "Content Domain 5: Security, Compliance, and Governance for AI Solutions", "secs": ["<p>Domain 5 covers security, compliance, and governance for AI solutions and represents 14% of the scored content on the exam.<\/p>", "<h3>Task Statement 5.1: Explain methods to secure AI systems.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Identify AWS services and features to secure AI systems (for example, IAM roles, policies, and permissions; encryption; Amazon Macie; AWS PrivateLink; AWS shared responsibility model; Amazon Bedrock AgentCore Identity; Policy in AgentCore; Amazon Bedrock Guardrails).<\/li><li>Describe the concept of source citation and documenting data origins (for example, data lineage, data cataloging, Amazon SageMaker Model Cards).<\/li><li>Describe best practices for secure data engineering (for example, assessing data quality, implementing privacy-enhancing technologies, data access control, data integrity).<\/li><li>Describe security and privacy considerations for AI systems (for example, application security, threat detection, vulnerability management, infrastructure protection, prompt injection, encryption at rest and in transit, data leakage prevention, output filtering and validation, audit trail and logging requirements for AI interactions, toxicity).<\/li><li>Describe hallucination detection methods and grounding techniques to improve output accuracy (for example, Retrieval Augmented Generation [RAG] grounding, output validation, confidence scoring).<\/li><\/ul>", "<h3>Task Statement 5.2: Recognize governance and compliance regulations for AI systems.<\/h3>\n<p>Objectives:<\/p>\n<ul><li>Identify AWS services and features to assist with governance and regulation compliance (for example, AWS Config, Amazon Inspector, AWS Artifact, AWS CloudTrail, AWS Trusted Advisor).<\/li><li>Describe data governance strategies (for example, data lifecycles, logging, residency, monitoring, observation, retention).<\/li><li>Describe processes to follow governance protocols (for example, policies, review cadence, review strategies, governance frameworks such as the Generative AI Security Scoping Matrix, transparency standards, team training requirements).<\/li><\/ul>"]}, {"n": "11", "title": "In-Scope AWS Services", "secs": ["<p>The following list contains AWS services and features that are in scope for the AWS Certified AI Practitioner (AIF-C01) exam. This list is non-exhaustive and is subject to change. AWS offerings appear in categories that align with the offerings' primary functions.<\/p>", "<h3>Analytics<\/h3>\n<ul><li>AWS Data Exchange<\/li><li>Amazon EMR<\/li><li>AWS Glue<\/li><li>AWS Glue DataBrew<\/li><li>AWS Lake Formation<\/li><li>Amazon OpenSearch Service<\/li><li>Amazon Quick<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>Cloud Financial Management<\/h3>\n<ul><li>AWS Budgets<\/li><li>AWS Cost Explorer<\/li><\/ul>", "<h3>Compute<\/h3>\n<ul><li>Amazon EC2<\/li><li>AWS Lambda<\/li><\/ul>", "<h3>Containers<\/h3>\n<ul><li>Amazon Elastic Container Service (Amazon ECS)<\/li><li>Amazon Elastic Kubernetes Service (Amazon EKS)<\/li><\/ul>", "<h3>Database<\/h3>\n<ul><li>Amazon Aurora<\/li><li>Amazon DocumentDB (with MongoDB compatibility)<\/li><li>Amazon DynamoDB<\/li><li>Amazon ElastiCache<\/li><li>Amazon Neptune<\/li><li>Amazon RDS<\/li><\/ul>", "<h3>Developer Tools<\/h3>\n<ul><li>Kiro<\/li><li>Strands Agents<\/li><\/ul>", "<h3>Machine Learning<\/h3>\n<ul><li>Amazon Bedrock<\/li><li>Amazon Bedrock AgentCore<\/li><li>Amazon Comprehend<\/li><li>Amazon Lex<\/li><li>Amazon Nova<\/li><li>Amazon Personalize<\/li><li>Amazon Polly<\/li><li>Amazon Rekognition<\/li><li>Amazon SageMaker AI<\/li><li>Amazon SageMaker JumpStart<\/li><li>Amazon Textract<\/li><li>Amazon Transcribe<\/li><li>Amazon Translate<\/li><li>AWS Transform<\/li><\/ul>", "<h3>Management and Governance<\/h3>\n<ul><li>AWS CloudTrail<\/li><li>Amazon CloudWatch<\/li><li>AWS Config<\/li><li>AWS Trusted Advisor<\/li><li>AWS Well-Architected Tool<\/li><\/ul>", "<h3>Networking and Content Delivery<\/h3>\n<ul><li>Amazon CloudFront<\/li><li>Amazon VPC<\/li><\/ul>", "<h3>Security, Identity, and Compliance<\/h3>\n<ul><li>AWS Artifact<\/li><li>AWS Identity and Access Management (IAM)<\/li><li>Amazon Inspector<\/li><li>AWS Key Management Service (AWS KMS)<\/li><li>Amazon Macie<\/li><li>AWS Secrets Manager<\/li><\/ul>", "<h3>Storage<\/h3>\n<ul><li>Amazon S3<\/li><li>Amazon S3 Glacier<\/li><\/ul>"]}, {"n": "12", "title": "Out-of-Scope AWS Services", "secs": ["<p>The following list contains AWS services and features that are out of scope for the exam. This list is non-exhaustive and is subject to change. AWS offerings that are entirely unrelated to the target job roles for the exam are excluded from this list:<\/p>", "<h3>Analytics<\/h3>\n<ul><li>AWS Clean Rooms<\/li><li>Amazon CloudSearch<\/li><li>Amazon Managed Streaming for Apache Kafka (Amazon MSK)<\/li><\/ul>", "<h3>Application Integration<\/h3>\n<ul><li>Amazon AppFlow<\/li><li>Amazon MQ<\/li><li>Amazon Simple Workflow Service (Amazon SWF)<\/li><\/ul>", "<h3>Business Applications<\/h3>\n<ul><li>Amazon Simple Email Service (Amazon SES)<\/li><li>AWS Supply Chain<\/li><li>AWS Wickr<\/li><\/ul>", "<h3>Cloud Financial Management<\/h3>\n<ul><li>AWS Application Cost Profiler<\/li><li>AWS Billing Conductor<\/li><\/ul>", "<h3>Compute<\/h3>\n<ul><li>AWS Elastic Beanstalk<\/li><li>EC2 Image Builder<\/li><li>Amazon Lightsail<\/li><\/ul>", "<h3>Containers<\/h3>\n<ul><li>Red Hat OpenShift Service on AWS (ROSA)<\/li><\/ul>", "<h3>Customer Enablement<\/h3>\n<ul><li>AWS Managed Services (AMS)<\/li><li>AWS re:Post Private<\/li><li>AWS Support<\/li><\/ul>", "<h3>Database<\/h3>\n<ul><li>Amazon Keyspaces (for Apache Cassandra)<\/li><li>Amazon Timestream<\/li><\/ul>", "<h3>Developer Tools<\/h3>\n<ul><li>AWS AppConfig<\/li><li>AWS Application Composer<\/li><li>AWS CloudShell<\/li><li>AWS Fault Injection Service<\/li><li>AWS X-Ray<\/li><\/ul>", "<h3>End User Computing<\/h3>\n<ul><li>Amazon AppStream 2.0<\/li><li>Amazon WorkSpaces<\/li><li>Amazon WorkSpaces Thin Client<\/li><li>Amazon WorkSpaces Secure Browser<\/li><\/ul>", "<h3>Frontend Web and Mobile<\/h3>\n<ul><li>AWS Amplify<\/li><li>AWS Device Farm<\/li><li>Amazon Location Service<\/li><\/ul>", "<h3>Internet of Things (IoT)<\/h3>\n<ul><li>AWS IoT Core<\/li><li>AWS IoT Device Defender<\/li><li>AWS IoT Device Management<\/li><li>AWS IoT FleetWise<\/li><li>FreeRTOS<\/li><li>AWS IoT Greengrass<\/li><li>AWS IoT SiteWise<\/li><li>AWS IoT TwinMaker<\/li><\/ul>", "<h3>Machine Learning<\/h3>\n<ul><li>AWS HealthImaging<\/li><li>AWS HealthOmics<\/li><\/ul>", "<h3>Management and Governance<\/h3>\n<ul><li>AWS Control Tower<\/li><li>AWS Health Dashboard<\/li><li>AWS Launch Wizard<\/li><li>AWS License Manager<\/li><li>Amazon Managed Grafana<\/li><li>Amazon Managed Service for Prometheus<\/li><li>AWS Resilience Hub<\/li><li>AWS Resource Explorer<\/li><li>AWS Resource Groups<\/li><li>AWS Systems Manager Incident Manager<\/li><li>AWS Service Catalog<\/li><li>Service Quotas<\/li><li>AWS Telco Network Builder<\/li><li>AWS User Notifications<\/li><\/ul>", "<h3>Media<\/h3>\n<ul><li>AWS Elemental MediaConnect<\/li><li>AWS Elemental MediaConvert<\/li><li>AWS Elemental MediaLive<\/li><li>AWS Elemental MediaPackage<\/li><li>AWS Elemental MediaTailor<\/li><li>Amazon Interactive Video Service (Amazon IVS)<\/li><\/ul>", "<h3>Migration and Transfer<\/h3>\n<ul><li>AWS Application Discovery Service<\/li><li>AWS Application Migration Service<\/li><li>AWS Database Migration Service (AWS DMS)<\/li><li>AWS DataSync<\/li><li>AWS Mainframe Modernization<\/li><li>AWS Migration Hub<\/li><li>AWS Transfer Family<\/li><\/ul>", "<h3>Networking and Content Delivery<\/h3>\n<ul><li>AWS Cloud Map<\/li><li>AWS Direct Connect<\/li><li>AWS Global Accelerator<\/li><li>Amazon Route 53<\/li><li>Amazon Route 53 Application Recovery Controller<\/li><li>Amazon VPC IP Address Manager (IPAM)<\/li><\/ul>", "<h3>Security, Identity, and Compliance<\/h3>\n<ul><li>AWS Certificate Manager (ACM)<\/li><li>AWS CloudHSM<\/li><li>Amazon Cognito<\/li><li>Amazon Detective<\/li><li>AWS Directory Service<\/li><li>AWS Firewall Manager<\/li><li>Amazon GuardDuty<\/li><li>AWS Payment Cryptography<\/li><li>AWS Private Certificate Authority<\/li><li>AWS Resource Access Manager (AWS RAM)<\/li><li>AWS Security Hub<\/li><li>Amazon Security Lake<\/li><li>AWS Shield<\/li><li>AWS Signer<\/li><li>Amazon Verified Permissions<\/li><li>AWS WAF<\/li><\/ul>", "<h3>Storage<\/h3>\n<ul><li>AWS Backup<\/li><li>AWS Elastic Disaster Recovery<\/li><\/ul>"]}, {"n": "13", "title": "Revisions", "secs": ["<p>AWS exam guides are periodically reviewed and updated to ensure that our certification exams test skills and AWS services and features that are relevant for the job role(s) that a certification is designed to target. Exam guide updates will be published approximately one month before updates will be reflected on your exam.<\/p><h3>Change History<\/h3>\n<table><thead><tr><th>Version<\/th><th>Publication date<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>March 26, 2026<\/td><\/tr><tr><td>1.1<\/td><td>April 30, 2026<\/td><\/tr><tr><td>1.2<\/td><td>October 29, 2026<\/td><\/tr><\/tbody><\/table><h3>Changes to in- and out-of-scope services<\/h3><h4>Services removed from the out-of-scope list<\/h4>\n<ul><li>Amazon Elastic Transcoder<\/li><li>AWS Elemental MediaStore<\/li><li>AWS IoT 1-Click<\/li><li>AWS IoT Analytics<\/li><li>AWS IoT Events<\/li><li>Amazon Nimble Studio<\/li><\/ul>"]}, {"n": "14", "title": "Survey", "secs": ["<p>How useful was this exam guide? Let us know by <a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=AI-Foundational&amp;course_id=AIF-C01&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">taking our survey<\/a>.<\/p>"]}]}};
const out=document.getElementById('out'), nav=document.getElementById('chaps'), noteEl=document.getElementById('note');
const N=DATA.ko.ch.length;
const NOTES={
 ko:['<p><strong>한국어판</strong>: AWS 공식 한국어판 시험 안내서(AIF-C01) 본문을 그대로 옮겼습니다. 출처: docs.aws.amazon.com, 2026-11-06 확인.</p>','<p><strong>버전 차이</strong>: 한국어판·일본어판은 <strong>1.1</strong>(2026-04-30), 영어판은 <strong>1.2</strong>(2026-10-29)입니다. 비교해 보면 12장 \'범위 외 AWS 서비스\' 목록(영어 93개, 한·일 117개)과 13장 \'개정\' 내용만 다르고, 나머지 장은 구성과 항목 수가 같습니다.</p>'],
 ja:['<p><strong>日本語版</strong>：AWS 公式の日本語版試験ガイド (AIF-C01) の本文をそのまま転記しています。出典：docs.aws.amazon.com（2026-11-06 時点）。</p>','<p><strong>版の違い</strong>：日本語版・韓国語版はバージョン <strong>1.1</strong>（2026-04-30）、英語版は <strong>1.2</strong>（2026-10-29）です。異なるのは第12章「対象外の AWS サービス」と第13章「改訂」のみです。</p>'],
 dual:['<p><strong>한·日 대조</strong>: 왼쪽은 공식 한국어판, 오른쪽은 공식 일본어판입니다(둘 다 버전 1.1). 같은 항목끼리 줄을 맞췄습니다. 13장 \'개정\'은 두 언어의 소제목 구성이 달라 장 전체를 나란히 놓았습니다.</p>'],
 en:['<p><strong>English</strong>: official AWS exam guide (AIF-C01), <strong>version 1.2</strong> (October 29, 2026), transcribed from docs.aws.amazon.com as of 2026-11-06. The Korean and Japanese editions are still version 1.1; they differ in chapter 12 (out-of-scope services) and chapter 13 (revisions).</p>']
};
let view='ko', openAll=false;
try{const s=localStorage.getItem('aif-guide-view'); if(s&&NOTES[s]) view=s;}catch(e){}
function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');}
function prep(h){h=wrapTables(h); return openAll?h.replace(/<details class="ans">/g,'<details class="ans" open>'):h;}
function render(){
  document.body.classList.toggle('dual',view==='dual');
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  noteEl.innerHTML=NOTES[view].join('');
  let h='';
  for(let i=0;i<N;i++){
    const ko=DATA.ko.ch[i], ja=DATA.ja.ch[i], en=DATA.en.ch[i], n=ko.n;
    h+=`<section class="chap" id="c${n}">`;
    if(view==='dual'){
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1>${ko.title}<span class="sub ja" lang="ja">${ja.title}</span></h1></div>`;
      h+=`<div class="colhead"><span>한국어</span><span>日本語</span></div>`;
      ko.secs.forEach((s,j)=>{h+=`<div class="pair"><div class="sec">${prep(s)}</div><div class="sec ja" lang="ja">${prep(ja.secs[j])}</div></div>`;});
    }else{
      const L=view, c=DATA[L].ch[i];
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1 class="${L}" lang="${L}">${c.title}</h1></div>`;
      h+=`<div class="sec ${L}" lang="${L}">${c.secs.map(prep).join('')}</div>`;
    }
    h+='</section>';
  }
  out.innerHTML=h;
  const L=view==='dual'?'ko':view;
  nav.innerHTML=DATA[L].ch.map(c=>`<button data-c="${c.n}" title="${c.title}">${c.n}</button>`).join('');
  spy();
}
document.querySelector('.langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const cur=current();
  view=b.dataset.v; try{localStorage.setItem('aif-guide-view',view);}catch(e){}
  render(); jump(cur,false);
});
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) jump(b.dataset.c,true);});
function off(){return document.querySelector('header.top').getBoundingClientRect().bottom;}
function jump(n,smooth){
  const el=document.getElementById('c'+n); if(!el) return;
  window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off()-8,behavior:smooth?'smooth':'auto'});
}
function current(){
  const o=off()+20; let c=DATA.ko.ch[0].n;
  DATA.ko.ch.forEach(x=>{const el=document.getElementById('c'+x.n); if(el&&el.getBoundingClientRect().top<=o) c=x.n;}); return c;
}
function spy(){const c=current(); nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));}
addEventListener('scroll',spy,{passive:true});
render();
</script>

</body>
</html>

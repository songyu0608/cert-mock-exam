<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>AIF-C01 공식 시험 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: sticky bar (language tabs + chapter chips 1–18), one reading column; "대조" view = section-aligned two-column grid */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b1f2a; --muted:#5b6475; --line:#dde1e8;
  --accent:#2f4bb8; --accent-soft:#e7ebfa; --code-bg:#eef0f5; --quote:#f0f3fb; --ok:#1d7a52; --ok-soft:#e5f4ec;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-display:"Fraunces",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ko);font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.dual .wrap{max-width:1260px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto;letter-spacing:.01em}
.brand small{font-family:var(--f-ko);color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:4px 10px;font-size:13px;line-height:1.5}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chaps button{font-family:var(--f-mono);font-size:12px;padding:1px 0;min-width:30px;text-align:center}
.chaps button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding-block:24px 80px}
.note{font-size:13px;color:var(--muted);line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:36px;background:var(--surface)}
.note p{margin:0}
.chap{margin-bottom:56px}
.chap-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:8px}
.chap-no{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.2em}
.chap-head h1{font-size:22px;line-height:1.4;margin:0;text-wrap:balance}
.chap-head .sub{font-size:13px;color:var(--muted);display:block;font-weight:400}
.sec h3{font-size:18px;margin:34px 0 8px;text-wrap:balance}
.sec a{color:var(--accent);text-underline-offset:2px}
.sec h4{font-size:15.5px;margin:28px 0 6px;color:var(--accent);line-height:1.55;text-wrap:balance}
.sec p{margin:0 0 14px}
.sec ul,.sec ol{margin:0 0 14px;padding-left:1.4em}
.sec li{margin:3px 0}
.sec ul.opts{list-style:none;padding-left:0}
.sec ul.opts li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;background:var(--surface)}
.sec blockquote{margin:16px 0;padding:10px 16px;background:var(--quote);border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.sec blockquote p:last-child{margin-bottom:0}
details.ans{margin:4px 0 26px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.ans summary{cursor:pointer;padding:7px 12px;font-size:13.5px;color:var(--ok);font-weight:600}
details.ans[open]{background:var(--ok-soft);border-color:var(--ok)}
details.ans p{margin:0;padding:0 14px 12px}
.sec code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:6px 0 18px}
.sec table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.sec th,.sec td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sec th{background:var(--code-bg)}
.ja{font-family:var(--f-ja)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0}
.pair>div{min-width:0}
.colhead{display:grid;grid-template-columns:1fr 1fr;gap:36px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:820px){.pair{grid-template-columns:1fr}.pair>div.ja{border-top:1px dotted var(--line);padding-top:4px}.colhead{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <span class="brand">AIF-C01 시험 가이드<small>AWS 공식 · 전문</small></span>
    <div class="row langs" role="group" aria-label="언어">
      <button id="v-ko" data-v="ko">한국어</button>
      <button id="v-ja" data-v="ja">日本語</button>
      <button id="v-dual" data-v="dual">한·日 대조</button>
      <button id="v-en" data-v="en">English</button>
    </div>
  </div>
  <div class="row chaps" role="group" aria-label="장 이동" id="chaps"></div>
</div></header>
<main><div class="wrap">
  <div class="note" id="note"></div>
  <div id="out"></div>
</div></main>

<script>
const DATA={"ko": {"title": "AWS Certified AI Practitioner(AIF-C01)", "note": ["Source: https://docs.aws.amazon.com/ko_kr/aws-certification/latest/ai-practitioner-01/ai-practitioner-01.html (retrieved 2026-11-06)"], "ch": [{"n": "1", "title": "AWS Certified AI Practitioner(AIF-C01)", "secs": ["<p>AWS Certified AI Practitioner(AIF-C01) 시험은 AI 개념 및 AWS AI 도구에 대한 기본적인 이해를 입증하고자 하는 개인을 대상으로 합니다. 이 자격증은 AI를 실제 비즈니스에 적용하는 능력에 중점을 둡니다.<\/p>"]}, {"n": "2", "title": "서론", "secs": ["<p><a href=\"https://aws.amazon.com/certification/certified-ai-practitioner/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Certified AI Practitioner(AIF-C01)<\/a> 시험은 AI 개념 및 AWS AI 도구에 대한 기본적인 이해를 입증하고자 하는 개인을 위해 설계되었습니다. 이 자격증은 AI를 실제 비즈니스에 적용하는 능력에 중점을 둡니다.<\/p>\n<p>또한 이 시험에서는 응시자의 다음 작업을 완료하는 능력을 확인합니다.<\/p>\n<ul><li>AI, ML 및 생성형 AI(GenAI)에 대한 일반적인 개념, 방법, 전략과 AWS에서의 개념, 방법, 전략 설명<\/li><li>비즈니스 문제를 해결하기 위해 사용해야 하는 적절한 AI/ML 및 GenAI 기술 식별<\/li><li>특정 사용 사례에 적용할 올바른 유형의 AI/ML 기술 결정<\/li><li>AI, ML 및 GenAI 기술을 책임 있게 사용<\/li><\/ul>"]}, {"n": "3", "title": "대상 응시자 설명", "secs": ["<p>대상 응시자는 최대 6개월 동안 AWS의 AI/ML 기술을 접한 경험을 보유하고 있어야 합니다. 대상 응시자는 AWS에서 AI/ML 솔루션을 사용해야 하지만, 반드시 구축할 필요는 없습니다.<\/p>", "<h3>권장하는 AWS 지식<\/h3>\n<p>대상 응시자는 다음과 같은 AWS 지식을 보유하고 있어야 합니다.<\/p>\n<ul><li>핵심 AWS 서비스(예: Amazon EC2, Amazon S3, AWS Lambda, Amazon Bedrock, Amazon SageMaker AI) 및 AWS 핵심 서비스 사용 사례에 대한 지식<\/li><li>AWS 클라우드의 보안 및 규정 준수와 관련한 AWS 공동 책임 모델에 대한 지식<\/li><li>AWS 리소스에 대한 액세스를 보호하고 제어하기 위한 AWS Identity and Access Management(AWS IAM)에 대한 지식<\/li><li>AWS 서비스 요금 모델에 대한 지식<\/li><\/ul>", "<h3>대상 응시자의 시험 범위에 해당하지 않는 작업<\/h3>\n<p>다음 목록에는 대상 응시자가 수행할 수 있을 것으로 예상되지 않는 작업이 나와 있습니다. 이 목록에 모든 사항이 포함된 것은 아닙니다. 다음 작업은 시험 범위에 해당하지 않습니다.<\/p>\n<ul><li>AI/ML 모델 또는 알고리즘 개발 또는 코딩<\/li><li>데이터 엔지니어링 또는 특성 추출 기법 구현<\/li><li>하이퍼파라미터 튜닝 또는 모델 최적화 수행<\/li><li>AI/ML 파이프라인 또는 인프라 구축 및 배포<\/li><li>AI/ML 모델의 수학적 또는 통계적 분석 수행<\/li><li>AI/ML 시스템을 위한 보안 또는 규정 준수 프로토콜 구현<\/li><li>AI/ML 솔루션을 위한 거버넌스 프레임워크와 정책 개발 및 구현<\/li><\/ul>"]}, {"n": "4", "title": "시험 콘텐츠", "secs": ["", "<h3>문항 유형<\/h3>\n<p>시험에는 다음 문항 유형 중 1개 이상이 포함됩니다.<\/p>\n<ul><li><strong>선다형:<\/strong> 정답 1개와 오답 3개(정답 이외의 답)가 있습니다.<\/li><li><strong>복수 응답형:<\/strong> 5개 이상의 응답 중에 2개 이상의 정답이 있습니다. 문항에 배정된 점수를 받으려면 정답을 모두 선택해야 합니다.<\/li><li><strong>순서 배열:<\/strong> 지정된 작업을 완료하기 위한 3~5개의 응답 목록이 있습니다. 정답을 선택하고 정답을 올바른 순서로 배열해야 문항에 배정된 점수를 받을 수 있습니다.<\/li><li><strong>매칭형:<\/strong> 3~7개의 프롬프트 목록과 일치하는 응답 목록이 있습니다. 문항에 배정된 점수를 받으려면 모든 쌍을 정확하게 매칭해야 합니다.<\/li><\/ul>\n<p>답을 하지 않은 문항은 오답으로 채점됩니다. 추측에 따른 불이익은 없습니다. 시험에는 점수에 반영되는 50개의 문항이 포함되어 있습니다.<\/p>", "<h3>채점되지 않는 콘텐츠<\/h3>\n<p>시험에는 점수에 영향을 주지 않는 15개의 채점되지 않는 문제가 포함됩니다. AWS는 채점되지 않은 문제의 성과에 대한 정보를 수집하여 나중에 채점 문제로 사용할 수 있도록 해당 문항을 평가합니다. 채점되지 않는 문항은 시험에서 식별되지 않습니다.<\/p>", "<h3>시험 결과<\/h3>\n<p>AWS Certified AI Practitioner(AIF-C01) 시험은 합격 또는 불합격이 결정되는 시험입니다. AWS 전문가가 자격증 분야 모범 사례 및 가이드라인에 따라 설정한 최소 표준을 기준으로 시험 점수를 매깁니다.<\/p>\n<p>시험 결과는 100~1,000점의 변환 점수로 보고됩니다. 합격 최소 점수는 700점입니다. 응시자는 점수를 통해 전반적인 시험 성적과 합격 여부를 알 수 있습니다. 변환 점수 모델은 난이도가 조금씩 다를 수 있는 여러 시험 형식에 걸쳐 점수를 균등하게 조정하는 데 도움이 됩니다.<\/p>\n<p>점수 보고서에는 섹션 수준별로 성적 분류표가 포함될 수 있습니다. 시험은 보상 점수 모델을 사용하므로 각 섹션에서 합격 점수를 얻을 필요는 없으며, 전체 시험에만 합격하면 됩니다.<\/p>\n<p>시험의 섹션마다 특정 가중치가 적용되므로 일부 섹션은 다른 섹션보다 문항 수가 많습니다. 분류표에는 응시자의 장단점을 강조하여 보여주는 일반 정보가 포함되어 있습니다. 섹션별 피드백을 파악할 때 주의하시기 바랍니다.<\/p>"]}, {"n": "5", "title": "내용 개요", "secs": ["<p>이 시험 안내서에서는 시험의 가중치, 콘텐츠 도메인, 작업 및 기술에 관한 내용을 제공합니다. 이 안내서는 시험 내용의 전체 목록을 제공하지 않습니다.<\/p>\n<p>시험의 콘텐츠 도메인과 가중치는 다음과 같습니다.<\/p>\n<ul><li>콘텐츠 도메인 1: AI 및 ML의 기초(채점되는 콘텐츠의 20%)<\/li><li>콘텐츠 도메인 2: GenAI의 기초(채점되는 콘텐츠의 24%)<\/li><li>콘텐츠 도메인 3: 파운데이션 모델 적용(채점되는 콘텐츠의 28%)<\/li><li>콘텐츠 도메인 4: 책임 있는 AI에 대한 가이드라인(채점되는 콘텐츠의 14%)<\/li><li>콘텐츠 도메인 5: AI 솔루션의 보안, 규정 준수 및 거버넌스(채점되는 콘텐츠의 14%)<\/li><\/ul>"]}, {"n": "6", "title": "콘텐츠 도메인 1: AI 및 ML의 기초", "secs": ["<p>도메인 1은 AI 및 ML의 기초를 다루며 시험에서 채점되는 콘텐츠의 20%를 차지합니다.<\/p>", "<h3>작업 설명 1.1: 기본 AI 개념과 용어 설명<\/h3>\n<p>목표:<\/p>\n<ul><li>기본 AI 용어(예: AI, ML, 딥 러닝, 신경망, 컴퓨터 비전, 자연어 처리(NLP), 모델, 알고리즘, 훈련 및 추론, 편향, 공정성, 적합성, 대규모 언어 모델(LLM), 생성형 AI(GenAI), 에이전틱 AI) 정의<\/li><li>AI, ML, GenAI, 딥 러닝, 에이전틱 AI 간의 유사점과 차이점 설명<\/li><li>다양한 유형의 추론을 설명(예: 배치, 실시간, 비동기, 서버리스)<\/li><li>AI 모델의 다양한 데이터 유형 설명(예: 레이블이 지정된 데이터와 레이블이 지정되지 않은 데이터, 테이블 형식, 시계열, 이미지, 텍스트, 정형 및 비정형)<\/li><li>다양한 유형의 AI/ML 학습 설명(예: 지도 학습, 비지도 학습, 강화 학습 방법)<\/li><\/ul>", "<h3>작업 설명 1.2: AI의 실제 사용 사례 파악<\/h3>\n<p>목표:<\/p>\n<ul><li>AI/ML이 가치를 제공할 수 있는 적용 사례 이해(예: 인간의 의사 결정 지원, 솔루션 확장성, 자동화)<\/li><li>AI/ML 솔루션이 적절하지 않은 경우 판단(예: 비용-이점 분석, 예측 대신 특정 결과가 필요한 상황)<\/li><li>특정 사용 사례에 적합한 AI/ML 기법 선택(예: 회귀, 분류, 클러스터링)<\/li><li>실제 AI 애플리케이션의 예시 식별(예: 컴퓨터 비전, NLP, 음성 인식, 추천 시스템, 사기 행위 탐지, 예측, 지식 기반, 에이전틱 AI)<\/li><li>AWS 관리형 AI/ML 서비스의 기능 설명(예: Amazon SageMaker AI, Amazon Transcribe, Amazon Translate, Amazon Comprehend, Amazon Lex, Amazon Polly)<\/li><li>기존 ML 모델 또는 파운데이션 모델(FM)이 특정 사용 사례에 적합한 경우 식별(예: 규제 문제, 설명 가능성 요구 사항, 운영 제약 조건)<\/li><\/ul>", "<h3>작업 설명 1.3: ML 개발 수명 주기 설명<\/h3>\n<p>목표:<\/p>\n<ul><li>AI/ML 파이프라인의 구성 요소 설명 및 구분<\/li><li>ML 모델의 소스 설명(예: 사전 훈련된 오픈 소스 모델, 사용자 지정 모델 훈련)<\/li><li>프로덕션 환경에서 모델을 사용하는 방법 설명(예: 관리형 API 서비스, 자체 호스팅 API)<\/li><li>AI/ML 파이프라인의 각 단계에 대한 관련 AWS 서비스 및 기능 식별(예: Amazon Bedrock, Amazon Quick, Kiro, SageMaker AI)<\/li><li>ML 운영(MLOps)의 기본 개념 설명(예: 실험, 반복 가능한 프로세스, 확장 가능한 시스템, 기술 부채 관리, 프로덕션 준비 상태 달성, 모델 모니터링, 모델 재훈련)<\/li><li>모델을 평가하기 위한 모델 성능 지표 설명(예: 정확도, 정밀도, 재현율, F1 점수) 및 비즈니스 지표(예: 사용자당 비용, 개발 비용, 고객 피드백, 투자 수익률(ROI))<\/li><\/ul>"]}, {"n": "7", "title": "콘텐츠 도메인 2: GenAI의 기초", "secs": ["<p>도메인 2는 GenAI의 기초를 다루며 시험에서 채점되는 콘텐츠의 24%를 차지합니다.<\/p>", "<h3>작업 설명 2.1: 생성형 AI(Gen AI)의 기본 개념을 설명합니다.<\/h3>\n<p>목표:<\/p>\n<ul><li>GenAI의 기본적인 개념(예: 토큰, 청킹, 임베딩, 벡터, 프롬프트 엔지니어링, 트랜스포머 기반 LLM, 파운데이션 모델(FM), 멀티모달 모델, 확산 모델)을 설명<\/li><li>GenAI 모델의 잠재적 사용 사례를 파악(예: 이미지, 비디오 및 오디오 생성, 요약, AI 어시스턴트, 번역, 코드 생성, 고객 서비스 에이전트, 검색, 추천 엔진)<\/li><li>파운데이션 모델 수명 주기 설명(예: 데이터 선택, 모델 선택, 사전 훈련, 미세 조정, 평가, 배포, 피드백)<\/li><li>추론을 위해 토큰 기반 가격 책정 모델과 비용 및 성능에 미치는 영향을 설명<\/li><li>FM 애플리케이션에서 컨텍스트 엔지니어링의 역할을 설명<\/li><li>기본 에이전트 AI 개념 (예: 복잡한 AI 애플리케이션을 위한 다중 에이전트 시스템 패턴, 모델 컨텍스트 프로토콜 (MCP) 및 에이전트를 외부 시스템에 연결하는 역할, 다중 에이전트 통신 패턴, 메모리 관리, 도구 사용, 워크플로 오케스트레이션)을 정의<\/li><\/ul>", "<h3>작업 설명 2.2: 비즈니스 문제 해결을 위한 GenAI의 기능과 한계 이해<\/h3>\n<p>목표:<\/p>\n<ul><li>GenAI의 장점(예: 적응성, 반응성, 대화 기능, 콘텐츠 생성 능력) 을 설명<\/li><li>GenAI 솔루션의 단점 파악(예: 할루시네이션, 해석 가능성, 부정확성, 비결정성)<\/li><li>GenAI 모델을 선택할 때 고려할 요소 파악(예: 모델 유형, 성능 요구 사항, 기능, 제약 조건, 규정 준수)<\/li><li>GenAI 애플리케이션의 비즈니스 가치와 지표 결정(예: 크로스 도메인 성능, 효율성, 전환율, 사용자당 평균 수익, 정확도, 고객 평생 가치)<\/li><\/ul>", "<h3>작업 설명 2.3: GenAI 애플리케이션을 구축하기 위한 AWS 인프라 및 기술 설명<\/h3>\n<p>목표:<\/p>\n<ul><li>GenAI 애플리케이션 개발을 위한 AWS 서비스 및 기능 식별(예: Amazon Bedrock, Amazon SageMaker AI, SageMaker JumpStart, Amazon Quick, Kiro, Strands Agents, Amazon Bedrock AgentCore).<\/li><li>AWS GenAI 서비스를 사용하여 애플리케이션을 구축할 때의 이점 설명(예: 접근성, 낮은 진입 장벽, 효율성, 비용 효과, 출시 소요 시간, 비즈니스 목표 달성 능력)<\/li><li>GenAI 애플리케이션을 위한 AWS 인프라의 이점 설명(예: 보안, 규정 준수, 책임, 안전)<\/li><li>AWS GenAI 서비스의 비용 절충점 설명(예: 응답성, 가용성, 중복성, 성능, 리전 적용 범위, 토큰 기반 요금, 프로비저닝 처리량, 사용자 지정 모델)<\/li><\/ul>"]}, {"n": "8", "title": "콘텐츠 도메인 3: 파운데이션 모델의 적용", "secs": ["<p>도메인 3은 파운데이션 모델의 적용을 다루며 시험에서 채점되는 콘텐츠의 28%를 차지합니다.<\/p>", "<h3>작업 설명 3.1: 파운데이션 모델(FM)을 사용하는 애플리케이션의 설계 고려 사항 설명<\/h3>\n<p>목표:<\/p>\n<ul><li>사전 훈련된 모델을 선택하기 위한 선택 기준 설명(예: 비용, 모달리티, 지연 시간, 다국어, 모델 크기, 모델 복잡도, 사용자 지정, 입력/출력 길이, 프롬프트 캐싱)<\/li><li>추론 파라미터가 모델 응답에 미치는 영향 설명(예: 온도, 입력/출력 길이)<\/li><li>검색 증강 생성(RAG)을 정의하고 비즈니스에서의 RAG 적용 사례 설명(예: Amazon Bedrock Knowledge Base)<\/li><li>벡터 데이터베이스 내에 임베딩을 저장하는 데 도움이 되는 AWS 서비스 파악(예: Amazon OpenSearch Service, Amazon Aurora, Amazon Neptune, Amazon RDS for PostgreSQL)<\/li><li>FM 사용자 지정에 대한 다양한 접근 방식의 비용 절충점 설명(예: 사전 훈련, 미세 조정, 컨텍스트 내 학습, RAG, 모델 증류)<\/li><li>AI 에이전트의 역할을 정의하고 AI 에이전트의 비즈니스 애플리케이션을 설명<\/li><\/ul>", "<h3>작업 설명 3.2: 효과적인 프롬프트 엔지니어링 기법 선택<\/h3>\n<p>목표:<\/p>\n<ul><li>프롬프트 엔지니어링의 개념과 구성(예: 컨텍스트, 명령, 네거티브 프롬프트, 모델 잠재 공간)을 설명<\/li><li>프롬프트 엔지니어링을 위한 기법을 정의(예: 생각의 사슬, 제로샷, 싱글샷, 퓨샷, 프롬프트 템플릿)<\/li><li>프롬프트 엔지니어링의 이점과 모범 사례 파악 및 설명(예: 응답 품질 개선, 실험, 가드레일, 발견, 구체성 및 간결성, 여러 코멘트 사용)<\/li><li>프롬프트 엔지니어링의 잠재적 위험과 한계 정의(예: 노출, 중독, 하이재킹, 탈옥)<\/li><li>Amazon Bedrock 프롬프트 관리를 사용하는 프롬프트 버전 관리 및 관리 전략을 설명<\/li><\/ul>", "<h3>작업 설명 3.3: 파운데이션 모델의 훈련과 미세 조정 프로세스 설명<\/h3>\n<p>목표:<\/p>\n<ul><li>FM 훈련의 주요 요소 설명(예: 사전 훈련, 미세 조정, 지속적인 사전 훈련, 증류)<\/li><li>FM을 미세 조정하는 방법 정의(예: 명령 튜닝, 특정 도메인에 맞춰 모델 조정, 전이 학습, 지속적인 사전 훈련)<\/li><li>FM을 미세 조정하기 위해 데이터를 준비하는 방법 설명(예: 데이터 큐레이션, 거버넌스, 크기, 레이블 지정, 대표성, 사용자 피드백을 통한 강화 학습(RL))<\/li><\/ul>", "<h3>작업 설명 3.4: FM 성능을 평가하는 방법 설명<\/h3>\n<p>목표:<\/p>\n<ul><li>FM 성능을 평가하기 위한 접근 방식 결정(예: 인간 평가, 벤치마크 데이터세트, Amazon Bedrock 모델 평가)<\/li><li>FM 성과를 평가하기 위한 관련 지표 파악(예: Recall-Oriented Understudy for Gisting Evaluation(ROUGE), Bilingual Evaluation Understudy(BLEU), BERTScore, LLM-as-a-judge)<\/li><li>FM이 비즈니스 목표에 효과적으로 부합하는지 판단(예: 생산성, 사용자 참여, 태스크 엔지니어링)<\/li><li>FM(예: RAG, 에이전트, 워크플로)로 구축된 애플리케이션의 성능을 평가하는 접근 방식 파악<\/li><li>AI 애플리케이션의 비즈니스 목표 조정 지표(예: 작업 완료율, 사용자 만족도, 상호 작용당 비용)를 식별<\/li><\/ul>"]}, {"n": "9", "title": "콘텐츠 도메인 4: 책임 있는 AI에 대한 가이드라인", "secs": ["<p>도메인 4는 책임 있는 AI에 대한 가이드라인을 다루며 시험에서 채점되는 콘텐츠의 14%를 차지합니다.<\/p>", "<h3>작업 설명 4.1: 책임감 있는 AI 시스템 개발 설명<\/h3>\n<p>목표:<\/p>\n<ul><li>책임 있는 AI의 특징 파악(예: 편향성, 공정성, 포용성, 견고성, 안전성, 진실성)<\/li><li>도구(예: Amazon Bedrock Guardrails)를 사용하여 책임 있는 AI의 특징을 파악하는 방법 설명<\/li><li>모델을 선택할 때의 책임 있는 관행 정의(예: 환경적 고려 사항, 지속 가능성)<\/li><li>생성형 AI(GenAI) 사용에 따른 법적 위험 식별(예: 지적 재산권 침해 클레임, 편향된 모델 출력, 고객 신뢰 상실, 최종 사용자 위험, 할루시네이션)<\/li><li>데이터세트의 특징 파악(예: 포용성, 다양성, 큐레이팅된 데이터 소스, 균형 잡힌 데이터세트)<\/li><li>편향과 변동의 영향 설명(예: 인구통계학적 그룹에 미치는 영향, 부정확성, 과적합, 과소적합)<\/li><li>편향, 신뢰성 및 진실성을 감지하고 모니터링하는 도구 설명(예: 라벨 품질 분석, 인간 감사, 하위 그룹 분석)<\/li><\/ul>", "<h3>작업 설명 4.2: 투명하고 설명 가능한 모델의 중요성 이해<\/h3>\n<p>목표:<\/p>\n<ul><li>투명하고 설명 가능한 모델과 투명하지 않고 설명 불가능한 모델의 차이점 설명<\/li><li>투명하고 설명 가능한 모델을 식별하는 도구를 설명(예: Amazon SageMaker Model Cards, Amazon Bedrock 모델 평가, 오픈 소스 모델, 데이터, 라이선스).<\/li><li>모델 안전성과 투명성 간의 절충점 파악(예: 해석 가능성과 성능 측정)<\/li><li>설명 가능한 AI를 위한 인간 중심 설계 원칙 설명(예: 사용자 피드백 메커니즘, AI 의사 결정 투명성)<\/li><\/ul>"]}, {"n": "10", "title": "콘텐츠 도메인 5: AI 솔루션의 보안, 규정 준수 및 거버넌스", "secs": ["<p>도메인 5는 AI 솔루션의 보안, 규정 준수 및 거버넌스를 다루며 시험에서 채점되는 콘텐츠의 14%를 차지합니다.<\/p>", "<h3>작업 설명 5.1: AI 시스템의 보안 방법 설명<\/h3>\n<p>목표:<\/p>\n<ul><li>AI 시스템 보안을 위한 AWS 서비스 및 기능 식별(예: IAM 역할, 정책 및 권한, 암호화, Amazon Macie, AWS PrivateLink, AWS 공동 책임 모델, Amazon Bedrock AgentCore Identity, AgentCore의 정책, Amazon Bedrock Guardrails).<\/li><li>소스 인용의 개념과 데이터 출처 문서화 설명(예: 데이터 계보, 데이터 카탈로그화, Amazon SageMaker Model Cards)<\/li><li>보안 데이터 엔지니어링의 모범 사례 설명(예: 데이터 품질 평가, 프라이버시 강화 기술 구현, 데이터 액세스 제어, 데이터 무결성)<\/li><li>AI 시스템의 보안 및 개인 정보 보호 고려 사항 설명(예: 애플리케이션 보안, 위협 탐지, 취약성 관리, 인프라 보호, 프롬프트 인젝션, 저장 및 전송 중 암호화, 데이터 유출 방지, 출력 필터링 및 검증, AI 상호 작용에 대한 감사 추적 및 로깅 요구 사항, 독성)<\/li><li>출력 정확도를 개선하기 위한 할루시네이션 감지 방법 및 접지 기법 설명(예: 검색 증강 생성(RAG) 근거 기반, 출력 유효성 검사, 신뢰도 점수)<\/li><\/ul>", "<h3>작업 설명 5.2: AI 시스템의 거버넌스 및 규정 준수 이해<\/h3>\n<p>목표:<\/p>\n<ul><li>거버넌스 및 규정 준수를 지원하는 AWS 서비스 및 기능 파악(예: AWS Config, Amazon Inspector, AWS Artifact, AWS CloudTrail, AWS Trusted Advisor)<\/li><li>데이터 거버넌스 전략 설명(예: 데이터 수명 주기, 로깅, 레지던시, 모니터링, 관찰, 보존)<\/li><li>거버넌스 프로토콜을 준수하기 위한 프로세스 설명(예: 정책, 검토 주기, 검토 전략, 생성형 AI Security Scoping Matrix와 같은 거버넌스 프레임워크, 투명성 표준, 팀 교육 요구 사항)<\/li><\/ul>"]}, {"n": "11", "title": "범위 내 AWS 서비스", "secs": ["<p>다음 목록은 AWS Certified AI Practitioner(AIF-C01) 시험 범위에 포함되는 AWS 서비스 및 기능입니다. 이 목록은 전체 목록이 아니며 변경될 수 있습니다. AWS 제품 및 서비스는 해당 제품 및 서비스의 주요 기능에 맞는 카테고리로 표시됩니다.<\/p>", "<h3>분석<\/h3>\n<ul><li>AWS Data Exchange<\/li><li>Amazon EMR<\/li><li>AWS Glue<\/li><li>AWS Glue DataBrew<\/li><li>AWS Lake Formation<\/li><li>Amazon OpenSearch Service<\/li><li>Amazon Quick<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>클라우드 재무 관리<\/h3>\n<ul><li>AWS Budgets<\/li><li>AWS Cost Explorer<\/li><\/ul>", "<h3>컴퓨팅<\/h3>\n<ul><li>Amazon EC2<\/li><li>AWS Lambda<\/li><\/ul>", "<h3>컨테이너<\/h3>\n<ul><li>Amazon Elastic Container Service(Amazon ECS)<\/li><li>Amazon Elastic Kubernetes Service(Amazon EKS)<\/li><\/ul>", "<h3>데이터베이스<\/h3>\n<ul><li>Amazon Aurora<\/li><li>Amazon DocumentDB(MongoDB 호환)<\/li><li>Amazon DynamoDB<\/li><li>Amazon ElastiCache<\/li><li>Amazon Neptune<\/li><li>Amazon RDS<\/li><\/ul>", "<h3>개발자 도구<\/h3>\n<ul><li>Kiro<\/li><li>Strands Agents<\/li><\/ul>", "<h3>기계 학습<\/h3>\n<ul><li>Amazon Bedrock<\/li><li>Amazon Bedrock AgentCore<\/li><li>Amazon Comprehend<\/li><li>Amazon Lex<\/li><li>Amazon Nova<\/li><li>Amazon Personalize<\/li><li>Amazon Polly<\/li><li>Amazon Rekognition<\/li><li>Amazon SageMaker AI<\/li><li>Amazon SageMaker JumpStart<\/li><li>Amazon Textract<\/li><li>Amazon Transcribe<\/li><li>Amazon Translate<\/li><li>AWS Transform<\/li><\/ul>", "<h3>AWS의 관리 및 거버넌스<\/h3>\n<ul><li>AWS CloudTrail<\/li><li>Amazon CloudWatch<\/li><li>AWS Config<\/li><li>AWS Trusted Advisor<\/li><li>AWS Well-Architected Tool<\/li><\/ul>", "<h3>네트워킹 및 콘텐츠 전송<\/h3>\n<ul><li>Amazon CloudFront<\/li><li>Amazon VPC<\/li><\/ul>", "<h3>보안, ID 및 규정 준수<\/h3>\n<ul><li>AWS Artifact<\/li><li>AWS Identity and Access Management(AWS IAM)<\/li><li>Amazon Inspector<\/li><li>AWS Key Management Service(AWS KMS)<\/li><li>Amazon Macie<\/li><li>AWS Secrets Manager<\/li><\/ul>", "<h3>스토리지<\/h3>\n<ul><li>Amazon S3<\/li><li>Amazon S3 Glacier<\/li><\/ul>"]}, {"n": "12", "title": "범위 외 AWS 서비스", "secs": ["<p>다음 목록은 시험 범위에 포함되지 않는 AWS 서비스 및 기능입니다. 이 목록은 전체 목록이 아니며 변경될 수 있습니다. 시험의 대상 작업 역할과 전혀 관련이 없는 AWS 제품 및 서비스는 다음 목록에서 제외됩니다.<\/p>", "<h3>분석<\/h3>\n<ul><li>AWS Clean Rooms<\/li><li>Amazon CloudSearch<\/li><li>Amazon Managed Streaming for Apache Kafka(Amazon MSK)<\/li><\/ul>", "<h3>애플리케이션 통합<\/h3>\n<ul><li>Amazon AppFlow<\/li><li>Amazon MQ<\/li><li>Amazon Simple Workflow Service(SWF)<\/li><\/ul>", "<h3>비즈니스 애플리케이션<\/h3>\n<ul><li>Amazon Chime<\/li><li>Amazon Pinpoint<\/li><li>Amazon Simple Email Service(Amazon SES)<\/li><li>AWS Supply Chain<\/li><li>AWS Wickr<\/li><\/ul>", "<h3>클라우드 재무 관리<\/h3>\n<ul><li>AWS Application Cost Profiler<\/li><li>AWS Billing Conductor<\/li><li>AWS Marketplace<\/li><\/ul>", "<h3>컴퓨팅<\/h3>\n<ul><li>AWS App Runner<\/li><li>AWS Elastic Beanstalk<\/li><li>EC2 Image Builder<\/li><li>Amazon Lightsail<\/li><\/ul>", "<h3>컨테이너<\/h3>\n<ul><li>Red Hat OpenShift Service on AWS(ROSA)<\/li><\/ul>", "<h3>고객 지원<\/h3>\n<ul><li>AWS IQ<\/li><li>AWS Managed Services(AMS)<\/li><li>AWS re:Post Private<\/li><li>AWS Support<\/li><\/ul>", "<h3>데이터베이스<\/h3>\n<ul><li>Amazon Keyspaces(Apache Cassandra용)<\/li><li>Amazon Quantum Ledger Database(QLDB)<\/li><li>Amazon Timestream<\/li><\/ul>", "<h3>개발자 도구<\/h3>\n<ul><li>AWS AppConfig<\/li><li>AWS Application Composer<\/li><li>AWS CloudShell<\/li><li>Amazon CodeCatalyst<\/li><li>AWS CodeStar<\/li><li>AWS Fault Injection Service<\/li><li>AWS X-Ray<\/li><\/ul>", "<h3>최종 사용자 컴퓨팅<\/h3>\n<ul><li>Amazon AppStream 2.0<\/li><li>Amazon WorkSpaces<\/li><li>Amazon WorkSpaces Thin Client<\/li><li>Amazon WorkSpaces Web<\/li><\/ul>", "<h3>프런트엔드 웹 및 모바일<\/h3>\n<ul><li>AWS Amplify<\/li><li>AWS Device Farm<\/li><li>Amazon Location Service<\/li><\/ul>", "<h3>사물 인터넷(IoT)<\/h3>\n<ul><li>AWS IoT Analytics<\/li><li>AWS IoT Core<\/li><li>AWS IoT Device Defender<\/li><li>AWS IoT Device Management<\/li><li>AWS IoT Events<\/li><li>AWS IoT FleetWise<\/li><li>FreeRTOS<\/li><li>AWS IoT Greengrass<\/li><li>AWS IoT 1-Click<\/li><li>AWS IoT RoboRunner<\/li><li>AWS IoT SiteWise<\/li><li>AWS IoT TwinMaker<\/li><\/ul>", "<h3>기계 학습<\/h3>\n<ul><li>AWS DeepComposer<\/li><li>AWS HealthImaging<\/li><li>AWS HealthOmics<\/li><li>Amazon Monitron<\/li><li>AWS Panorama<\/li><\/ul>", "<h3>AWS의 관리 및 거버넌스<\/h3>\n<ul><li>AWS Control Tower<\/li><li>AWS Health Dashboard<\/li><li>AWS Launch Wizard<\/li><li>AWS License Manager<\/li><li>Amazon Managed Grafana<\/li><li>Amazon Managed Service for Prometheus<\/li><li>AWS OpsWorks<\/li><li>AWS Organizations<\/li><li>AWS Proton<\/li><li>AWS Resilience Hub<\/li><li>AWS Resource Explorer<\/li><li>AWS Resource Groups<\/li><li>AWS Systems Manager Incident Manager<\/li><li>AWS Service Catalog<\/li><li>Service Quotas<\/li><li>AWS Telco Network Builder<\/li><li>AWS User Notifications<\/li><\/ul>", "<h3>미디어<\/h3>\n<ul><li>Amazon Elastic Transcoder<\/li><li>AWS Elemental MediaConnect<\/li><li>AWS Elemental MediaConvert<\/li><li>AWS Elemental MediaLive<\/li><li>AWS Elemental MediaPackage<\/li><li>AWS Elemental MediaStore<\/li><li>AWS Elemental MediaTailor<\/li><li>Amazon Interactive Video Service(Amazon IVS)<\/li><li>Amazon Nimble Studio<\/li><\/ul>", "<h3>마이그레이션 및 전송<\/h3>\n<ul><li>AWS Application Discovery Service<\/li><li>AWS Application Migration Service<\/li><li>AWS Database Migration Service(AWS DMS)<\/li><li>AWS DataSync<\/li><li>AWS Mainframe Modernization<\/li><li>AWS Migration Hub<\/li><li>AWS Transfer Family<\/li><\/ul>", "<h3>네트워킹 및 콘텐츠 전송<\/h3>\n<ul><li>AWS App Mesh<\/li><li>AWS Cloud Map<\/li><li>AWS Direct Connect<\/li><li>AWS Global Accelerator<\/li><li>AWS Private 5G<\/li><li>Amazon Route 53<\/li><li>Amazon Route 53 Application Recovery Controller<\/li><li>Amazon VPC IP Address Manager(IPAM)<\/li><\/ul>", "<h3>보안, ID 및 규정 준수<\/h3>\n<ul><li>AWS Certificate Manager(ACM)<\/li><li>AWS CloudHSM<\/li><li>Amazon Cognito<\/li><li>Amazon Detective<\/li><li>AWS Directory Service<\/li><li>AWS Firewall Manager<\/li><li>Amazon GuardDuty<\/li><li>AWS IAM Identity Center<\/li><li>AWS Payment Cryptography<\/li><li>AWS Private Certificate Authority<\/li><li>AWS Resource Access Manager(AWS RAM)<\/li><li>AWS Security Hub<\/li><li>Amazon Security Lake<\/li><li>AWS Shield<\/li><li>AWS Signer<\/li><li>Amazon Verified Permissions<\/li><li>AWS WAF<\/li><\/ul>", "<h3>스토리지<\/h3>\n<ul><li>AWS Backup<\/li><li>AWS Elastic Disaster Recovery<\/li><\/ul>"]}, {"n": "13", "title": "개정", "secs": ["<p>AWS시험 가이드는 정기적으로 검토 및 업데이트되어 인증 시험이 인증 대상 직무와 관련된 기술, AWS 서비스 및 기능을 테스트할 수 있도록 합니다. 시험 안내서 업데이트는 업데이트가 시험에 반영되기 약 1개월 전에 게시됩니다.<\/p><h3>변경 기록<\/h3>\n<table><thead><tr><th>버전<\/th><th>게시 날짜<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>2026년 3월 26일<\/td><\/tr><tr><td>1.1<\/td><td>2026년 4월 30일<\/td><\/tr><\/tbody><\/table><h3>목표 변경 사항<\/h3>\n<table><thead><tr><th><strong>버전 1. 인 간 성능, 효율성, 전환율, 사용자당 평균 수익, 정확도, 고객 평생 가치).<\/td><td>목표 2.2.4: GenAI 애플리케이션의 비즈니스 가치와 지표 결정(예: 도메인 간 성능, ROI, 효율성, 전환율, 사용자당 평균 수익, 정확도, 고객 평생 가치).<\/td><\/tr><tr><td>목표 2.3.1: GenAI 애플리케이션 개발을 위한 AWS 서비스 및 기능 파악(예: Amazon SageMaker JumpStart, Amazon Bedrock PartyRock, Amazon Q, Amazon Bedrock Data Automation)<\/td><td>목표 2.3.1: GenAI 애플리케이션 개발을 위한 AWS 서비스 및 기능 식별(예: Amazon Bedrock, Amazon SageMaker AI, SageMaker JumpStart, Amazon Quick, Kiro, Strands Agents, Amazon Bedrock AgentCore).<\/td><\/tr><tr><td>목표 3.1.5: FM 사용자 지정에 대한 다양한 접근 방식의 비용 절충점 설명(예: 사전 훈련, 미세 조정, 컨텍스트 내 학습, RAG)<\/td><td>목표 3.1.5: FM 사용자 지정에 대한 다양한 접근 방식의 비용 절충점 설명(예: 사전 훈련, 미세 조정, 컨텍스트 내 학습, RAG, 모델 증류)<\/td><\/tr><tr><td>목표 3.1.6: 다단계 작업에서 에이전트의 역할 설명(예: Amazon Bedrock Agent, 에이전틱 AI, 모델 컨텍스트 프로토콜)<\/td><td>목표 3.1.6: AI 에이전트의 역할을 정의하고 AI 에이전트의 비즈니스 애플리케이션을 설명<\/td><\/tr><tr><td>목표 3.4.1: FM 성능을 평가하기 위한 접근 방식 결정(예: 인간 평가, 벤치마크 데이터세트, Amazon Bedrock 모델 평가)<\/td><td>목표 3.4.1: FM 성능을 평가하기 위한 접근 방식 결정(예: 인간 평가, 벤치마크 데이터세트, Amazon Bedrock 모델 평가)<\/td><\/tr><tr><td>목표 3.4.2: FM 성과를 평가하기 위한 관련 지표 파악(예: Recall-Oriented Understudy for Gisting Evaluation(ROUGE), Bilingual Evaluation Understudy(BLEU), BERTScore)<\/td><td>목표 3.4.2: FM 성과를 평가하기 위한 관련 지표 파악(예: Recall-Oriented Understudy for Gisting Evaluation(ROUGE), Bilingual Evaluation Understudy(BLEU), BERTScore, LLM-as-a-judge)<\/td><\/tr><tr><td>목표 4.2.2: 투명하고 설명 가능한 모델(예: Amazon SageMaker Model Cards, 오픈 소스 모델, 데이터, 라이선싱)을 식별하는 도구를 설명<\/td><td>목표 4.2.2: 투명하고 설명 가능한 모델을 식별하는 도구를 설명(예: Amazon SageMaker 모델 카드, SageMaker Cartify, Amazon 기반 모델 평가, 오픈 소스 모델, 데이터, 라이선스).<\/td><\/tr><tr><td>목표 4.2.4: 설명 가능한 AI를 위한 인간 중심 설계 원칙 설명<\/td><td>목표 4.2.4: 설명 가능한 AI를 위한 인간 중심 설계 원칙(예: 사용자 피드백 메커니즘, AI 의사 결정 투명성)을 설명<\/td><\/tr><tr><td>목표 5.1.1: AI 시스템의 보안을 위한 AWS 서비스 및 기능 파악(예: IAM 역할, 정책 및 권한, 암호화, Amazon Macie, AWS PrivateLink, AWS 공동 책임 모델)<\/td><td>목표 5.1.1: AI 시스템 보안을 위한 AWS 서비스 및 기능을 식별(예: IAM 역할, 정책 및 권한, 암호화, Amazon Macie, AWS PrivateLink, AWS 공동 책임 모델, Amazon Bedrock AgentCore Identity, AgentCore의 정책, Amazon BedRock Guardrail).<\/td><\/tr><tr><td>목표 5.1.4: AI 시스템의 보안 및 프라이버시에 대한 고려 사항 설명(예: 애플리케이션 보안, 위협 탐지, 취약성 관리, 인프라 보호, 프롬프트 인젝션, 저장 시 및 전송 중 암호화)<\/td><td>목표 5.1.4: AI 시스템의 보안 및 개인 정보 보호 고려 사항 설명(예: 애플리케이션 보안, 위협 탐지, 취약성 관리, 인프라 보호, 신속한 삽입, 저장 및 전송 중 암호화, 데이터 유출 방지, 출력 필터링 및 검증, AI 상호 작용에 대한 감사 추적 및 로깅 요구 사항, 독성)<\/td><\/tr><\/tbody><\/table>\n<p><strong>목표 추가됨<\/strong><\/p>\n<ul><li>목표 1.2.6: 기존 ML 모델 또는 파운데이션 모델(FM)이 특정 사용 사례 (예: 규제 문제, 설명 가능성 요구 사항, 운영 제약 조건)에 적합한 경우를 식별<\/li><li>목표 2.1.4: 추론을 위해 토큰 기반 가격 책정 모델과 비용 및 성능에 미치는 영향을 설명<\/li><li>목표 2.1.5: FM 애플리케이션에서 컨텍스트 엔지니어링의 역할을 설명<\/li><li>목표 2.1.6: 기본 에이전트 AI 개념(예: 복잡한 AI 애플리케이션을 위한 다중 에이전트 시스템 패턴, 모델 컨텍스트 프로토콜 (MCP) 및 에이전트를 외부 시스템에 연결하는 역할, 다중 에이전트 통신 패턴, 메모리 관리, 도구 사용, 워크플로 오케스트레이션)을 정의<\/li><li>목표 3.2.5: Amazon Bedrock 프롬프트 관리를 사용하는 프롬프트 버전 관리 및 관리 전략을 설명<\/li><li>목표 3.4.5: AI 애플리케이션의 비즈니스 목표 조정 지표(예: 작업 완료율, 사용자 만족도, 상호 작용당 비용)를 식별<\/li><li>목표 5.1.5: 출력 정확도를 개선하기 위한 환각 감지 방법 및 접지 기법(예: 검색 증강 생성(RAG) 접지, 출력 검증, 신뢰도 점수)에 대해 설명<\/li><\/ul><h3>범위 내 및 범위 외 서비스 변경 사항<\/h3><h4>범위 내 목록에 추가된 서비스<\/h4>\n<ul><li>Amazon Aurora<\/li><li>Amazon Bedrock AgentCore<\/li><li>Kiro<\/li><li>Strands Agents<\/li><li>Amazon Q<\/li><li>Amazon SageMaker JumpStart<\/li><li>AWS Transform<\/li><\/ul><h4>범위 내 목록에서 제거된 서비스<\/h4>\n<ul><li>Amazon MemoryDB<\/li><\/ul><h4>범위 외 목록에서 제거된 서비스<\/h4>\n<ul><li>AWS DeepComposer<\/li><li>Amazon FinSpace<\/li><li>Amazon Honeycode<\/li><li>AWS IAM Identity Center<\/li><li>AWS Marketplace<\/li><li>AWS Organizations<\/li><li>Amazon WorkDocs<\/li><\/ul>"]}, {"n": "14", "title": "설문 조사", "secs": ["<p>이 시험 안내서가 도움이 되었습니까? 설문 조사에 <a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=AI-Foundational&amp;course_id=AIF-C01&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">참여하여<\/a> 알려 주시기 바랍니다.<\/p>"]}]}, "ja": {"title": "AWS Certified AI Practitioner (AIF-C01)", "note": ["Source: https://docs.aws.amazon.com/ja_jp/aws-certification/latest/ai-practitioner-01/ai-practitioner-01.html (retrieved 2026-11-06)"], "ch": [{"n": "1", "title": "AWS Certified AI Practitioner (AIF-C01)", "secs": ["<p>AWS Certified AI Practitioner (AIF-C01) 試験は、AI の概念と AWS AI ツールの基本的な知識を実証したい方を対象としています。この認定は、実務的なビジネスへの AI の活用に重点を置いています。<\/p>"]}, {"n": "2", "title": "はじめに", "secs": ["<p><a href=\"https://aws.amazon.com/certification/certified-ai-practitioner/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Certified AI Practitioner (AIF-C01)<\/a> 試験は、AI の概念と AWS AI ツールの基本的な知識を実証したい方を対象としています。この認定は、実務的なビジネスへの AI の活用に重点を置いています。<\/p>\n<p>また、次のタスクについての受験者の能力も検証します。<\/p>\n<ul><li>一般的な、また AWS 上での AI、ML、生成 AI (GenAI) の概念、手法、戦略を説明する。<\/li><li>ビジネス上の問題を解決するための AI/ML と GenAI テクノロジーの適切な使用方法を特定する。<\/li><li>特定のユースケースへの適用に適した AI/ML テクノロジーの種類を見極める。<\/li><li>AI、ML、GenAI テクノロジーを、責任を持って使用する。<\/li><\/ul>"]}, {"n": "3", "title": "受験対象者について", "secs": ["<p>本認定は、AWS の AI/ML テクノロジーに携わった経験が 6 か月以下の方を対象としています。AWS で AI/ML ソリューションを使用しますが、必ずしも構築している必要はありません。<\/p>", "<h3>推奨される AWS の知識<\/h3>\n<p>受験対象者は、次の AWS の知識を有している必要があります。<\/p>\n<ul><li>AWS の主要なサービス (Amazon EC2、Amazon S3、AWS Lambda、Amazon Bedrock、Amazon SageMaker AI など) と AWS の主要なサービスのユースケースに精通している。<\/li><li>AWS クラウドのセキュリティとコンプライアンスに関する AWS 責任共有モデルに精通している。<\/li><li>AWS リソースへのアクセスをセキュリティ保護および制御するための AWS Identity and Access Management (AWS IAM) に精通している。<\/li><li>AWS のサービス料金モデルに精通している。<\/li><\/ul>", "<h3>受験対象者にとって試験対象外となるジョブタスク<\/h3>\n<p>受験対象者が実施できることが想定されていないジョブタスクは、次のリストのとおりです。このリストはすべてを網羅しているわけではありません。次のタスクは、本試験の範囲外です。<\/p>\n<ul><li>AI/ML モデルまたはアルゴリズムの開発またはコーディング<\/li><li>データエンジニアリング手法や特徴量エンジニアリング手法の実装<\/li><li>ハイパーパラメータのチューニングまたはモデル最適化の実行<\/li><li>AI/ML パイプラインまたはインフラストラクチャの構築とデプロイ<\/li><li>AI/ML モデルの数学的または統計的分析の実施<\/li><li>AI/ML システムのセキュリティまたはコンプライアンスプロトコルの実装<\/li><li>AI/ML ソリューションのガバナンスフレームワークとポリシーの開発と実装<\/li><\/ul>"]}, {"n": "4", "title": "試験内容", "secs": ["", "<h3>設問の種類<\/h3>\n<p>試験には、次の出題形式が 1 つ以上含まれています。<\/p>\n<ul><li><strong>択一選択問題:<\/strong> 正しい選択肢が 1 つ、誤った選択肢 (不正解) が 3 つ提示される。<\/li><li><strong>複数選択問題:<\/strong> 5 つ以上の選択肢のうち、正解が 2 つ以上ある。設問に対する点数を得るには、正解をすべて選択する必要がある。<\/li><li><strong>並べ替え:<\/strong> 指定されたタスクを完了することを目的とした 3～5 つの答えのリストが提示される。設問に対する点数を得るには、正解を選択し、正しい順序に並べる必要がある。<\/li><li><strong>内容一致:<\/strong> 3～7 つのプロンプトのリストと一致する答えのリストが提示される。設問に対する点数を得るには、すべてのペアを正しく一致させる必要がある。<\/li><\/ul>\n<p>未解答の設問は不正解とみなされます。推測による解答にペナルティはありません。試験には、スコアに影響する設問が 50 問含まれています。<\/p>", "<h3>採点対象外の設問<\/h3>\n<p>試験には、スコアに影響しない採点対象外の設問が 15 問含まれています。AWS では、これら採点対象外の設問における成績情報を収集し、これらを今後採点対象の設問として使用できるかどうかを評価します。試験では、どの設問が採点対象外かは受験者にわからないようになっています。<\/p>", "<h3>試験の結果<\/h3>\n<p>AWS Certified AI Practitioner (AIF-C01) 試験は、合否判定方式です。試験の採点は、認定業界のベストプラクティスおよびガイドラインに基づいた、AWS の専門家によって定められる最低基準に照らして行われます。<\/p>\n<p>試験の結果は、100～1,000 の換算スコアとして報告されます。合格スコアは 700 です。このスコアにより、試験全体の成績と合否がわかります。複数の試験間で難易度がわずかに異なる可能性があるため、スコアを均等化するために換算スコアが使用されます。<\/p>\n<p>スコアレポートには、各セクションの成績を示す分類表が含まれる場合があります。試験には補整スコアリングモデルが使用されるため、セクションごとに合否ラインは設定されておらず、試験全体のスコアで合否が判定されます。<\/p>\n<p>試験の各セクションには特定の重みが設定されているため、各セクションに割り当てられる設問数が異なる場合があります。分類表には、受験者の得意分野と不得意分野を示す全般的な情報が含まれます。セクションごとのフィードバックを解釈する際は注意してください。<\/p>"]}, {"n": "5", "title": "試験内容の概要", "secs": ["<p>この試験ガイドには、試験に設定された重み、コンテンツ分野、タスク、スキルについての説明が含まれています。本ガイドは、試験内容の包括的なリストを提供するものではありません。<\/p>\n<p>本試験のコンテンツ分野と重み設定は、次のとおりです。<\/p>\n<ul><li>コンテンツ分野 1: AI と ML の基礎 (採点対象の設問の 20%)<\/li><li>コンテンツ分野 2: GenAI の基礎 (採点対象の設問の 24%)<\/li><li>コンテンツ分野 3: 基盤モデルの応用 (採点対象の設問の 28%)<\/li><li>コンテンツ分野 4: 責任ある AI に関するガイドライン (採点対象の設問の 14%)<\/li><li>コンテンツ分野 5: AI ソリューションのセキュリティ、コンプライアンス、ガバナンス (採点対象の設問の 14%)<\/li><\/ul>"]}, {"n": "6", "title": "コンテンツ分野 1: AI と ML の基礎", "secs": ["<p>第 1 分野は、AI と ML の基礎に関する設問で構成されており、試験の採点対象コンテンツの 20% を占めています。<\/p>", "<h3>タスクステートメント 1.1: AI の基本的な概念と用語を説明する。<\/h3>\n<p>対象:<\/p>\n<ul><li>基本的な AI 用語 [AI、ML、深層学習、ニューラルネットワーク、コンピュータビジョン、自然言語処理 (NLP)、モデル、アルゴリズム、トレーニングと推論、バイアス、公平性、フィット、大規模言語モデル (LLM)、生成 AI (GenAI)、エージェンティック AI など] を定義する。<\/li><li>AI、ML、GenAI、深層学習、エージェンティック AI の類似点と相違点を説明する。<\/li><li>さまざまな種類の推論 (バッチ、リアルタイム、非同期、サーバーレスなど) について説明する。<\/li><li>AI モデルに含まれるさまざまな種類のデータ (ラベル付きとラベルなし、表形式、時系列、画像、テキスト、構造化データと非構造化データなど) について説明する。<\/li><li>さまざまな種類の AI/ML 学習 (教師あり学習、教師なし学習、強化学習の方法など) について説明する。<\/li><\/ul>", "<h3>タスクステートメント 1.2: AI の実用的なユースケースを特定する。<\/h3>\n<p>対象:<\/p>\n<ul><li>AI/ML が価値を提供できる応用分野 (人間の意思決定の支援、ソリューションのスケーラビリティ、オートメーションなど) を認識する。<\/li><li>AI/ML ソリューションが適切でない場合 (費用対効果の分析、予測ではなく特定の結果が必要な状況など) を特定する。<\/li><li>特定のユースケース (回帰、分類、クラスタリングなど) に適した AI/ML 手法を選択する。<\/li><li>実際の AI 応用例 (コンピュータビジョン、NLP、音声認識、レコメンデーションシステム、不正検出、予測、ナレッジベース、エージェンティック AI など) を特定する。<\/li><li>AWS のマネージド AI/ML サービス (Amazon SageMaker AI、Amazon Transcribe、Amazon Translate、Amazon Comprehend、Amazon Lex、Amazon Polly など) の機能を説明する。<\/li><li>従来の ML モデルまたは基盤モデル (FM) が特定のユースケースに適する場合を (規制上の懸念、説明可能性の要件、運用上の制約などに基づいて) 特定する。<\/li><\/ul>", "<h3>タスクステートメント 1.3: AI/ML 開発ライフサイクルについて説明する。<\/h3>\n<p>対象:<\/p>\n<ul><li>AI/ML パイプラインのコンポーネントを説明し、区別する。<\/li><li>FM モデルのソース (オープンソースの事前トレーニング済みモデル、トレーニング用のカスタムモデルなど) について説明する。<\/li><li>本番環境でモデルを使用する方法 (マネージド API サービス、セルフホスト API など) を説明する。<\/li><li>AI/ML パイプラインの各ステージに関連する AWS のサービスと機能 (Amazon Bedrock、Amazon Quick、Kiro、SageMaker AI など) を特定する。<\/li><li>ML 運用 (MLOps) の基本概念 (実験、反復可能なプロセス、スケーラブルなシステム、技術的負債の管理、本番稼働の準備、モデルモニタリング、モデルの再トレーニングなど) を説明する。<\/li><li>ML モデルを評価するためのモデルパフォーマンスメトリクス (正解率、適合率、再現率、F1 スコアなど) とビジネスメトリクス [ユーザーあたりのコスト、開発コスト、顧客からのフィードバック、投資収益率 (ROI) など] を説明する。<\/li><\/ul>"]}, {"n": "7", "title": "コンテンツ分野 2: GenAI の基礎", "secs": ["<p>第 2 分野は、GenAI の基礎に関する設問で構成されており、試験の採点対象コンテンツの 24% を占めています。<\/p>", "<h3>タスクステートメント 2.1: 生成 AI (GenAI) の基本概念を説明する。<\/h3>\n<p>対象:<\/p>\n<ul><li>GenAI の基本概念 [トークン、チャンク化、埋め込み、ベクトル、プロンプトエンジニアリング、トランスフォーマーベースの大規模言語モデル (LLM)、基盤モデル (FM)、マルチモーダルモデル、拡散モデルなど] を定義する。<\/li><li>GenAI モデルの潜在的なユースケース (画像・動画・音声の生成、要約、AI アシスタント、翻訳、コード生成、カスタマーサービスエージェント、検索、レコメンデーションエンジンなど) を特定する。<\/li><li>FM のライフサイクル (データ選択、モデル選択、事前トレーニング、ファインチューニング、評価、デプロイ、フィードバックなど) を説明する。<\/li><li>トークンベースの価格設定モデルと、推論のコストとパフォーマンスに及ぼすその影響を説明する。<\/li><li>FM アプリケーションにおけるコンテキストエンジニアリングの役割を説明する。<\/li><li>エージェンティック AI の基本的な概念 [複雑な AI アプリケーションのマルチエージェントシステムパターン、エージェントを外部システムに接続する際のモデルコンテキストプロトコル (MCP) とその役割、マルチエージェント通信パターン、メモリ管理、ツールの使用、ワークフローオーケストレーションなど] を定義する。<\/li><\/ul>", "<h3>タスクステートメント 2.2: ビジネス上の問題の解決に GenAI を使用する場合の可能性と制限を理解する。<\/h3>\n<p>対象:<\/p>\n<ul><li>GenAI の利点 (適応性、応答性、会話能力、コンテンツ生成能力など) を説明する。<\/li><li>GenAI ソリューションのデメリット (ハルシネーション、解釈可能性、不正確さ、非決定性など) を特定する。<\/li><li>GenAI モデルを選択する際に考慮すべき要素 (モデルタイプ、パフォーマンス要件、機能、制約、コンプライアンス、コスト、レイテンシー、モデルの複雑さなど) を特定する。<\/li><li>GenAI アプリケーションのビジネス価値とメトリクス (クロスドメインのパフォーマンス、ROI、効率性、コンバージョン率、ユーザーあたりの平均収益、正解率、顧客生涯価値など) を見極める。<\/li><\/ul>", "<h3>タスクステートメント 2.3: GenAI アプリケーションを構築するための AWS インフラストラクチャとテクノロジーについて説明する。<\/h3>\n<p>対象:<\/p>\n<ul><li>GenAI アプリケーションを開発するための AWS のサービスと機能 (Amazon Bedrock、Amazon SageMaker AI、SageMaker JumpStart、Amazon Quick、Kiro、Strands Agents、Amazon Bedrock AgentCore など) を特定する。<\/li><li>AWS の GenAI サービスを使用してアプリケーションを構築するメリット (アクセシビリティ、参入障壁の低さ、効率性、費用対効果、市場投入までのスピード、ビジネス目標の達成能力など) を説明する。<\/li><li>GenAI アプリケーションの AWS インフラストラクチャの利点 (セキュリティ、コンプライアンス、責任、安全性など) を説明する。<\/li><li>AWS の GenAI サービスの、コストに対するトレードオフ (応答性、可用性、冗長性、パフォーマンス、リージョン展開、トークンベースの料金設定、プロビジョンスループット、カスタムモデルなど) を説明する。<\/li><\/ul>"]}, {"n": "8", "title": "コンテンツ分野 3: 基盤モデルの応用", "secs": ["<p>第 3 分野は、基礎モデルの応用に関する設問で構成されており、試験の採点対象コンテンツの 28% を占めています。<\/p>", "<h3>タスクステートメント 3.1: 基盤モデル (FM) を使用するアプリケーションの設計上の考慮事項を説明する。<\/h3>\n<p>対象:<\/p>\n<ul><li>FM を選ぶための選択基準 (コスト、モダリティ、レイテンシー、多言語、モデルサイズ、モデルの複雑さ、カスタマイズ、入力/出力の長さ、プロンプトキャッシュなど) を特定する。<\/li><li>推論パラメータがモデルの応答に与える影響 [温度 (Temperature)、入力/出力の長さなど] を説明する。<\/li><li>検索拡張生成 (RAG) を定義し、ビジネスにおける活用方法 (Amazon Bedrock ナレッジベースなど) を説明する。<\/li><li>ベクトルデータベースへの埋め込みの保存に役立つ AWS のサービス (Amazon OpenSearch Service、Amazon Aurora、Amazon Neptune、Amazon RDS for PostgreSQL など) を特定する。<\/li><li>FM をカスタマイズするためのさまざまなアプローチ (事前トレーニング、ファインチューニング、コンテキスト内学習、RAG、モデル蒸留など) のコスト面でのトレードオフを説明する。<\/li><li>AI エージェントの役割を定義し、ビジネスにおける AI エージェントの活用方法を説明する。<\/li><\/ul>", "<h3>タスクステートメント 3.2: 効果的なプロンプトエンジニアリング手法を選択する。<\/h3>\n<p>対象:<\/p>\n<ul><li>プロンプトエンジニアリングの概念と構成 (コンテキスト、指示、ネガティブプロンプトなど) を定義する。<\/li><li>プロンプトエンジニアリングの手法 (思考の連鎖、ゼロショット、シングルショット、フューショット、プロンプトテンプレート) を定義する。<\/li><li>プロンプトエンジニアリングの利点とベストプラクティス (応答品質の向上、実験、ガードレール、発見、具体性と簡潔さ、複数のコメントの使用) を特定し、説明する。<\/li><li>プロンプトエンジニアリングの潜在的なリスクと制限 (露出、ポイズニング、ハイジャック、ジェイルブレイクなど) を定義する。<\/li><li>Amazon Bedrock Prompt Management を使用するプロンプトのバージョン管理と管理戦略を説明する。<\/li><\/ul>", "<h3>タスクステートメント 3.3: FM のトレーニングとファインチューニングのプロセスを説明する。<\/h3>\n<p>対象:<\/p>\n<ul><li>FM のトレーニングの重要な要素 (事前トレーニング、ファインチューニング、継続的な事前チューニング、蒸留など) を説明する。<\/li><li>FM をファインチューニングするための方法 (指示のチューニング、特定分野へのモデルの適応、転移学習、継続的な事前トレーニングなど) を定義する。<\/li><li>FM をファインチューニングするためのデータの準備方法 [データキュレーション、ガバナンス、サイズ、ラベル付け、代表性、人間からのフィードバックによる強化学習 (RLHF) など] を説明する。<\/li><\/ul>", "<h3>タスクステートメント 3.4: FM のパフォーマンスを評価する方法を説明する。<\/h3>\n<p>対象:<\/p>\n<ul><li>FM のパフォーマンスを評価する手法 (ヒューマンインザループによる評価、ベンチマークデータセット、Amazon Bedrock のモデル評価など) を特定する。<\/li><li>FM のパフォーマンスを評価するための関連メトリクス [Recall-Oriented Understudy for Gisting Evaluation (ROUGE)、Bilingual Evaluation Understudy (BLEU)、BERTScore、LLM-as-a-judge など] を特定する。<\/li><li>FM がビジネス目標 (生産性、ユーザーエンゲージメント、タスクエンジニアリングなど) を効果的に満たしているかどうかを判断する。<\/li><li>FM を使用して構築されたアプリケーションのパフォーマンスを評価するためのアプローチ (RAG、エージェント、ワークフローなど) を特定する。<\/li><li>AI アプリケーションのビジネス目標整合指標 (タスク完了率、ユーザー満足度、インタラクションあたりのコストなど) を特定する。<\/li><\/ul>"]}, {"n": "9", "title": "コンテンツ分野 4: 責任ある AI に関するガイドライン", "secs": ["<p>第 4 分野は、責任ある AI のガイドラインに関する設問で構成されており、試験の採点対象コンテンツの 14% を占めています。<\/p>", "<h3>タスクステートメント 4.1: 責任ある AI システムの開発について説明する。<\/h3>\n<p>対象:<\/p>\n<ul><li>責任ある AI の特徴 (バイアス、公平性、包括性、堅牢性、安全性、信憑性など) を特定する。<\/li><li>責任ある AI の特徴を特定するためのツール (Amazon Bedrock のガードレールなど) の使用方法を説明する。<\/li><li>モデルを選択するうえでの責任ある慣行 (環境への配慮、持続可能性など) を定義する。<\/li><li>生成 AI (GenAI) を使用する際の法的リスク (知的財産権侵害の申し立て、偏ったモデル出力、顧客の信頼喪失、エンドユーザーリスク、ハルシネーションなど) を特定する。<\/li><li>データセットの特徴 (包括性、多様性、キュレートされたデータソース、バランスの取れたデータセットなど) を特定する。<\/li><li>バイアスと分散の影響 (人口統計グループへの影響、不正確さ、オーバーフィット、アンダーフィットなど) を説明する。<\/li><li>バイアス、信頼性、真実性を検出およびモニタリングするためのツール (ラベル品質の分析、人間による監査、サブグループ分析など) について説明する。<\/li><\/ul>", "<h3>タスクステートメント 4.2: 透明性の高い説明可能なモデルの重要性を認識する。<\/h3>\n<p>対象:<\/p>\n<ul><li>透明性の高い説明可能なモデルと、透明性の低い説明不可能なモデルの違いを説明する。<\/li><li>透明性の高い説明可能なモデルを識別するためのツール (Amazon SageMaker Model Cards、Amazon Bedrock のモデル評価、オープンソースモデル、データ、ライセンスなど) を説明する。<\/li><li>モデルの安全性と透明性の間のトレードオフ (解釈可能性とパフォーマンスを測定するなど) を特定する。<\/li><li>説明可能な AI のための人間中心設計の原則 (ユーザーフィードバックメカニズム、AI 意思決定の透明性など) を説明する。<\/li><\/ul>"]}, {"n": "10", "title": "コンテンツ分野 5: AI ソリューションのセキュリティ、コンプライアンス、ガバナンス", "secs": ["<p>第 5 分野は、AI ソリューションのセキュリティ、コンプライアンス、ガバナンスに関する設問で構成されており、試験の採点対象コンテンツの 14% を占めています。<\/p>", "<h3>タスクステートメント 5.1: AI システムを保護する方法を説明する。<\/h3>\n<p>対象:<\/p>\n<ul><li>AI システムを保護するための AWS のサービスと機能 (IAM ロール・ポリシー・アクセス許可、暗号化、Amazon Macie、AWS PrivateLink、AWS 責任共有モデル、Amazon Bedrock AgentCore Identity、AgentCore のポリシー、Amazon Bedrock Guardrails など) を特定する。<\/li><li>ソース引用とデータ出典の文書化の概念 (データリネージュ、データのカタログ化、Amazon SageMaker Model Cards など) を説明する。<\/li><li>セキュアなデータエンジニアリングのベストプラクティス (データ品質の評価、プライバシー強化技術の実装、データアクセス制御、データの完全性など) を説明する。<\/li><li>AI システムのセキュリティとプライバシーに関する考慮事項 (アプリケーションセキュリティ、脅威検出、脆弱性管理、インフラストラクチャ保護、プロンプトインジェクション、保管中および転送中の暗号化、データリークの防止、出力のフィルタリングと検証、AI インタラクションの監査証跡とログ要件、毒性など) を説明する。<\/li><li>出力精度を向上させるためのハルシネーション検出方法とグラウンディング手法 [検索拡張生成 (RAG) グラウンディング、出力検証、信頼度スコアリングなど] を説明する。<\/li><\/ul>", "<h3>タスクステートメント 5.2: AI システムのガバナンスとコンプライアンス規制を認識する。<\/h3>\n<p>対象:<\/p>\n<ul><li>ガバナンスと規制コンプライアンスを支援する AWS のサービスと機能 (AWS Config、Amazon Inspector、AWS Artifact、AWS CloudTrail、AWS Trusted Advisor など) を特定する。<\/li><li>データガバナンス戦略 (データライフサイクル、ログ記録、レジデンシー、モニタリング、観察、保持など) を説明する。<\/li><li>ガバナンスプロトコル (ポリシー、レビューサイクル、レビュー戦略、生成 AI セキュリティスコーピングマトリックスなどのガバナンスフレームワーク、透明性基準、チームトレーニング要件など) に従うためのプロセスを説明する。<\/li><\/ul>"]}, {"n": "11", "title": "対象の AWS サービス", "secs": ["<p>以下に、AWS Certified AI Practitioner (AIF-C01) 試験の対象となる AWS のサービスと機能のリストを示します。このリストはすべてを網羅しているわけではなく、また、変更される場合もあります。AWS のサービスは、サービスの主要機能に沿ったカテゴリに分類されています。<\/p>", "<h3>分析<\/h3>\n<ul><li>AWS Data Exchange<\/li><li>Amazon EMR<\/li><li>AWS Glue<\/li><li>AWS Glue DataBrew<\/li><li>AWS Lake Formation<\/li><li>Amazon OpenSearch Service<\/li><li>Amazon Quick<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>クラウド財務管理<\/h3>\n<ul><li>AWS Budgets<\/li><li>AWS Cost Explorer<\/li><\/ul>", "<h3>コンピューティング<\/h3>\n<ul><li>Amazon EC2<\/li><li>AWS Lambda<\/li><\/ul>", "<h3>コンテナ<\/h3>\n<ul><li>Amazon Elastic Container Service (Amazon ECS)<\/li><li>Amazon Elastic Kubernetes Service (Amazon EKS)<\/li><\/ul>", "<h3>データベース<\/h3>\n<ul><li>Amazon Aurora<\/li><li>Amazon DocumentDB (MongoDB 互換)<\/li><li>Amazon DynamoDB<\/li><li>Amazon ElastiCache<\/li><li>Amazon Neptune<\/li><li>Amazon RDS<\/li><\/ul>", "<h3>デベロッパーツール<\/h3>\n<ul><li>Kiro<\/li><li>Strands Agents<\/li><\/ul>", "<h3>機械学習<\/h3>\n<ul><li>Amazon Bedrock<\/li><li>Amazon Bedrock AgentCore<\/li><li>Amazon Comprehend<\/li><li>Amazon Lex<\/li><li>Amazon Nova<\/li><li>Amazon Personalize<\/li><li>Amazon Polly<\/li><li>Amazon Rekognition<\/li><li>Amazon SageMaker AI<\/li><li>Amazon SageMaker JumpStart<\/li><li>Amazon Textract<\/li><li>Amazon Transcribe<\/li><li>Amazon Translate<\/li><li>AWS Transform<\/li><\/ul>", "<h3>マネジメントとガバナンス<\/h3>\n<ul><li>AWS CloudTrail<\/li><li>Amazon CloudWatch<\/li><li>AWS Config<\/li><li>AWS Trusted Advisor<\/li><li>AWS Well-Architected Tool<\/li><\/ul>", "<h3>ネットワークとコンテンツ配信<\/h3>\n<ul><li>Amazon CloudFront<\/li><li>Amazon VPC<\/li><\/ul>", "<h3>セキュリティ、アイデンティティ、コンプライアンス<\/h3>\n<ul><li>AWS Artifact<\/li><li>AWS Identity and Access Management (IAM)<\/li><li>Amazon Inspector<\/li><li>AWS Key Management Service (AWS KMS)<\/li><li>Amazon Macie<\/li><li>AWS Secrets Manager<\/li><\/ul>", "<h3>ストレージ<\/h3>\n<ul><li>Amazon S3<\/li><li>Amazon S3 Glacier<\/li><\/ul>"]}, {"n": "12", "title": "対象外の AWS サービス", "secs": ["<p>以下に、試験対象外の AWS のサービスと機能のリストを示します。このリストはすべてを網羅しているわけではなく、また、変更される場合もあります。試験の対象となる職種内容にまったく関係のない AWS のサービスは、このリストから除外されています。<\/p>", "<h3>分析<\/h3>\n<ul><li>AWS Clean Rooms<\/li><li>Amazon CloudSearch<\/li><li>Amazon Managed Streaming for Apache Kafka (Amazon MSK)<\/li><\/ul>", "<h3>アプリケーション統合<\/h3>\n<ul><li>Amazon AppFlow<\/li><li>Amaz

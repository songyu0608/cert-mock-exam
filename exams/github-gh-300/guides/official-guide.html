<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>GH-300 공식 시험 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: sticky bar (language tabs + chapter chips 1–18), one reading column; "대조" view = section-aligned two-column grid */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b1f2a; --muted:#5b6475; --line:#dde1e8;
  --accent:#2f4bb8; --accent-soft:#e7ebfa; --code-bg:#eef0f5; --quote:#f0f3fb; --ok:#1d7a52; --ok-soft:#e5f4ec;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-display:"Fraunces",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ko);font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.dual .wrap{max-width:1260px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto;letter-spacing:.01em}
.brand small{font-family:var(--f-ko);color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:4px 10px;font-size:13px;line-height:1.5}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chaps button{font-family:var(--f-mono);font-size:12px;padding:1px 0;min-width:30px;text-align:center}
.chaps button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding-block:24px 80px}
.note{font-size:13px;color:var(--muted);line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:36px;background:var(--surface)}
.note p{margin:0}
.chap{margin-bottom:56px}
.chap-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:8px}
.chap-no{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.2em}
.chap-head h1{font-size:22px;line-height:1.4;margin:0;text-wrap:balance}
.chap-head .sub{font-size:13px;color:var(--muted);display:block;font-weight:400}
.sec h3{font-size:18px;margin:34px 0 8px;text-wrap:balance}
.sec a{color:var(--accent);text-underline-offset:2px}
.sec h4{font-size:15.5px;margin:28px 0 6px;color:var(--accent);line-height:1.55;text-wrap:balance}
.sec p{margin:0 0 14px}
.sec ul,.sec ol{margin:0 0 14px;padding-left:1.4em}
.sec li{margin:3px 0}
.sec ul.opts{list-style:none;padding-left:0}
.sec ul.opts li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;background:var(--surface)}
.sec blockquote{margin:16px 0;padding:10px 16px;background:var(--quote);border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.sec blockquote p:last-child{margin-bottom:0}
details.ans{margin:4px 0 26px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.ans summary{cursor:pointer;padding:7px 12px;font-size:13.5px;color:var(--ok);font-weight:600}
details.ans[open]{background:var(--ok-soft);border-color:var(--ok)}
details.ans p{margin:0;padding:0 14px 12px}
.sec code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:6px 0 18px}
.sec table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.sec th,.sec td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sec th{background:var(--code-bg)}
.ja{font-family:var(--f-ja)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0}
.pair>div{min-width:0}
.colhead{display:grid;grid-template-columns:1fr 1fr;gap:36px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:820px){.pair{grid-template-columns:1fr}.pair>div.ja{border-top:1px dotted var(--line);padding-top:4px}.colhead{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <span class="brand">GH-300 시험 가이드<small>Microsoft Learn 공식 · 전문</small></span>
    <div class="row langs" role="group" aria-label="언어">
      <button id="v-ko" data-v="ko">한국어</button>
      <button id="v-ja" data-v="ja">日本語</button>
      <button id="v-dual" data-v="dual">한·日 대조</button>
      <button id="v-en" data-v="en">English</button>
    </div>
  </div>
  <div class="row chaps" role="group" aria-label="장 이동" id="chaps"></div>
</div></header>
<main><div class="wrap">
  <div class="note" id="note"></div>
  <div id="out"></div>
</div></main>

<script>
const DATA={"ko": {"title": "GH-300 시험을 위한 공부 가이드: GitHub Copilot", "note": ["Source: https://learn.microsoft.com/ko-kr/credentials/certifications/resources/study-guides/gh-300 (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "이 문서의 용도", "secs": ["<p>이 연구 가이드는 시험에서 무엇을 기대해야 하는지 이해하는 데 도움이 되며 시험에서 다룰 수 있는 항목의 요약과 추가 리소스에 대한 링크를 포함합니다. 이 문서의 정보 및 자료는 시험을 준비할 때 연구에 집중하는 데 도움이 됩니다.<\/p>\n<table><thead><tr><th>유용한 링크<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://learn.microsoft.com/ko-kr/credentials/certifications/renew-your-microsoft-certification\" target=\"_blank\" rel=\"noopener noreferrer\">인증 갱신<\/a><\/td><td>Microsoft 동료, 전문가 및 전문 인증은 매년 만료됩니다. Microsoft Learn에서 무료 온라인 평가를 통과하면 인증을 갱신할 수 있습니다.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ko-kr/users\" target=\"_blank\" rel=\"noopener noreferrer\">귀하의 Microsoft Learn 프로필<\/a><\/td><td>인증 프로필을 Microsoft Learn에 연결하면 시험을 예약 및 갱신하고 인증서를 공유하고 인쇄할 수 있습니다.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ko-kr/credentials/certifications/exam-scoring-reports\" target=\"_blank\" rel=\"noopener noreferrer\">시험 점수 매기기 및 점수 매기기 보고서<\/a><\/td><td>통과하려면 700점 이상의 점수가 필요합니다.<\/td><\/tr><tr><td><a href=\"https://aka.ms/examdemo\" target=\"_blank\" rel=\"noopener noreferrer\">시험 샌드박스<\/a><\/td><td>시험 샌드박스를 방문하여 시험 환경을 탐색할 수 있습니다.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ko-kr/credentials/certifications/request-accommodations\" target=\"_blank\" rel=\"noopener noreferrer\">숙박 시설 요청<\/a><\/td><td>보조 장치를 사용하거나, 추가 시간이 필요하거나, 시험 경험의 일부를 수정해야 하는 경우 숙박 시설을 요청할 수 있습니다.<\/td><\/tr><\/tbody><\/table>"]}, {"n": "2", "title": "시험 정보", "secs": ["<p>일부 시험은 다른 언어로 지역화되며 영어 버전이 업데이트된 후 약 8주 후에 업데이트됩니다. Microsoft는 앞에서 설명한 대로 현지화된 버전을 업데이트하기 위해 모든 노력을 기울이고 있지만 시험의 현지화된 버전이 이 일정에 따라 업데이트되지 않는 경우가 있을 수 있습니다. 사용 가능한 다른 언어는 <strong>시험 세부 정보<\/strong> 웹 페이지의 <strong>시험 일정<\/strong> 섹션에 나열됩니다. 원하는 언어로 시험을 사용할 수 없는 경우 시험을 완료하기 위해 30분 더 요청할 수 있습니다.<\/p>", "<h3>비고<\/h3>\n<p>측정된 각 기술을 따르는 각주는 해당 기술을 평가하는 방법을 설명하기 위한 것입니다. 관련 항목은 시험에서 다룰 수 있습니다.<\/p>", "<h3>비고<\/h3>\n<p>일반 공급(GA) 상태인 기능을 다루는 질문이 대부분입니다. 이러한 기능이 일반적으로 사용되는 경우 시험에서 미리 보기 기능에 대한 질문이 포함될 수 있습니다.<\/p>"]}, {"n": "3", "title": "청중 프로필", "secs": ["<p>이 시험 응시자는 GitHub Copilot를 사용하여 소프트웨어 개발 생산성, 품질 및 보안을 개선하는 데 대한 전문 지식을 보유해야 합니다. 여기에는 책임 있는 AI 사용, 프롬프트 엔지니어링, 다양한 계획의 코필로트 기능 및 개인 정보 보호 기능이 포함됩니다. 또한 후보자는 GitHub 기본 사항을 잘 알고 있어야 하며 하나 이상의 프로그래밍 언어에 대한 경험이 있어야 합니다.<\/p>"]}, {"n": "4", "title": "기술 한눈에 보기", "secs": ["<ul><li>책임감 있게 GitHub Copilot 사용(15-20%)<\/li><li>GitHub Copilot 기능 사용(25-30%)<\/li><li>GitHub Copilot 기능(25-30%)<\/li><li>GitHub Copilot 데이터 및 아키텍처 이해(10-15%)<\/li><li>프롬프트 엔지니어링 및 컨텍스트 제작 적용(10-15%)<\/li><li>GitHub Copilot를 사용하여 개발자 생산성 향상(10-15%)<\/li><li>개인 정보 보호, 콘텐츠 제외 및 보호 구성(10-15%)<\/li><\/ul>"]}, {"n": "5", "title": "책임감 있게 GitHub Copilot 사용(15-20%)", "secs": ["", "<h3>책임 있는 AI 원칙 이해<\/h3>\n<ul><li>생성 AI 도구의 위험 및 제한 사항 설명<\/li><li>윤리적이고 책임 있는 AI 사용량 설명<\/li><li>AI 사용의 잠재적 피해 및 완화 전략 식별<\/li><\/ul>", "<h3>AI 도구 유효성 검사 및 운영<\/h3>\n<ul><li>AI 출력의 유효성을 검사해야 하는 필요성 설명<\/li><li>책임감 있게 GitHub Copilot를 작동하는 방법 식별<\/li><\/ul>"]}, {"n": "6", "title": "GitHub Copilot 기능 사용(25-30%)", "secs": ["", "<h3>IDE에서 GitHub Copilot 사용<\/h3>\n<ul><li>IDE에서 Copilot 사용<\/li><li>인라인 제안, 채팅, CLI 및 에이전트 모드를 통해 Copilot을 실행<\/li><li>특정 파일 또는 리포지토리에 대한 콘텐츠 제외 구성(앱 지식)<\/li><\/ul>", "<h3>GitHub Copilot CLI 사용<\/h3>\n<ul><li>GitHub Copilot CLI 및 개발자에게 혜택 제공 방법 정의<\/li><li>GitHub Copilot CLI 설치 단계 식별<\/li><li>주요 GitHub Copilot CLI 기능 및 명령 설명<\/li><li>대화형 및 세션에서 GitHub Copilot CLI 사용<\/li><li>GitHub Copilot CLI를 사용하여 스크립트 생성 및 파일 관리<\/li><\/ul>", "<h3>GitHub Copilot 기능 및 기능 사용<\/h3>\n<ul><li>향상된 개발 및 워크플로를 위해 에이전트 모드, Copilot 편집 및 MCP를 사용하고, 에이전트 세션을 관리하고, 최적화된 컨텍스트 사용을 위해 하위 에이전트에 작업을 위임합니다.<\/li><li>코드 검토 및 코딩 지원을 위해 Copilot 사용<\/li><li>지침 파일을 통해 Spaces, Spark, Pull Request 요약 및 사용자 정의 가능한 검토 기준을 활용합니다.<\/li><li>GitHub Copilot 채팅의 제한, 옵션, 피드백 및 명령을 이해합니다. 일관된 응답에 대한 프롬프트 파일 재사용 포함<\/li><\/ul>", "<h3>조직 전체 설정 및 정책 관리<\/h3>\n<ul><li>조직 전체 정책 관리 구성; Copilot 코드 검토 정책을 사용하도록 설정하고 IDE 및 github.com 기능 가용성을 관리합니다.<\/li><li>감사 로그 이벤트 활용<\/li><li>REST API를 사용하여 구독 관리<\/li><\/ul>"]}, {"n": "7", "title": "GitHub Copilot 데이터 및 아키텍처 이해(10-15%)", "secs": ["", "<h3>데이터 처리 및 흐름 설명<\/h3>\n<ul><li>데이터 사용량, 흐름 및 공유 설명<\/li><li>입력 처리 및 프롬프트 빌드 설명<\/li><li>프록시 필터링 및 후처리 설명<\/li><\/ul>", "<h3>수명 주기 및 제한 사항 이해<\/h3>\n<ul><li>코드 제안 수명 주기 시각화<\/li><li>LLM 및 부조종사에 대한 제한 사항 설명<\/li><\/ul>"]}, {"n": "8", "title": "프롬프트 엔지니어링 및 컨텍스트 제작 적용(10-15%)", "secs": ["", "<h3>효과적인 프롬프트 작성<\/h3>\n<ul><li>프롬프트 구조 및 컨텍스트 설명<\/li><li>컨텍스트가 결정되는 방식 이해<\/li><li>제로 샷 및 몇 샷 프롬프트 사용<\/li><li>프롬프트 작성에 대한 모범 사례 적용<\/li><\/ul>", "<h3>엔지니어의 성능 관련 요청<\/h3>\n<ul><li>프롬프트 엔지니어링 원칙 설명<\/li><li>프롬프트 프로세스 흐름 및 채팅 기록 사용 설명<\/li><\/ul>"]}, {"n": "9", "title": "GitHub Copilot를 사용하여 개발자 생산성 향상(10-15%)", "secs": ["", "<h3>생산성 및 코드 품질 향상<\/h3>\n<ul><li>코드 생성, 리팩터링 및 설명서에 Copilot 사용<\/li><li>학습 가속화 및 컨텍스트 전환 감소<\/li><li>샘플 데이터 생성 및 레거시 코드 현대화<\/li><\/ul>", "<h3>테스트 및 보안 지원<\/h3>\n<ul><li>단위 및 통합 테스트 생성<\/li><li>극한 사례 식별 및 어설션 작성<\/li><li>보안 향상 및 성능 최적화 제안<\/li><\/ul>"]}, {"n": "10", "title": "개인 정보 보호, 콘텐츠 제외 및 보호 구성(10-15%)", "secs": ["", "<h3>개인 정보 설정 및 제외 관리<\/h3>\n<ul><li>콘텐츠 제외 및 편집기 설정 구성<\/li><li>출력의 소유권 및 제한 사항 설명<\/li><\/ul>", "<h3>세이프가드 적용 및 문제 해결<\/h3>\n<ul><li>공개 코드 필터링과 일치하는 제안 활성화<\/li><li>제안 및 콘텐츠 제외 관련 문제 해결<\/li><\/ul>"]}, {"n": "11", "title": "학습 리소스", "secs": ["<p>시험에 응시하기 전에 학습하고 실습 경험을 얻는 것이 좋습니다. 자가 학습 옵션 및 교실 교육뿐만 아니라 설명서, 커뮤니티 사이트 및 비디오에 대한 링크를 제공합니다.<\/p>\n<table><thead><tr><th>학습 리소스<\/th><th>학습 및 설명서 링크<\/th><\/tr><\/thead><tbody><tr><td>교육 받기<\/td><td>자기 주도 학습 경로 및 모듈 중에서 선택하거나 Microsoft Learn – <a href=\"https://learn.microsoft.com/ko-kr/training/paths/copilot/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot 기본 사항 1부 및 GitHub<\/a><a href=\"https://learn.microsoft.com/ko-kr/training/paths/gh-copilot-2/\" target=\"_blank\" rel=\"noopener noreferrer\">Copilot 기본 사항 2부<\/a>에서 강사 주도 과정을 수강합니다.<\/td><\/tr><tr><td>설명서 찾기<\/td><td>책임 있는 AI <a href=\"https://docs.github.com/copilot/about-github-copilot/plans-for-github-copilot\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot 계획 및 기능<\/a> <a href=\"https://github.com/trust-center\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot의 작동 방식 및 데이터 처리 방법<\/a> <a href=\"https://docs.github.com/copilot/using-github-copilot/copilot-chat/prompt-engineering-for-copilot-chat\" target=\"_blank\" rel=\"noopener noreferrer\">프롬프트 제작 및 프롬프트 엔지니어링<\/a> <a href=\"https://learn.microsoft.com/ko-kr/training/modules/developer-use-cases-for-ai-with-github-copilot/\" target=\"_blank\" rel=\"noopener noreferrer\">AI에 대한 개발자 사용 사례<\/a> <a href=\"https://learn.microsoft.com/ko-kr/training/modules/develop-unit-tests-using-github-copilot-tools/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot를 사용하여 테스트<\/a> <a href=\"https://docs.github.com/copilot/managing-copilot/configuring-and-auditing-content-exclusion\" target=\"_blank\" rel=\"noopener noreferrer\">개인 정보 보호 기본 사항 및 콘텐츠 제외<\/a><\/td><\/tr><tr><td>질문하기<\/td><td><a href=\"https://github.community/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 커뮤니티 토론<\/a><\/td><\/tr><tr><td>커뮤니티 지원 받기<\/td><td><a href=\"https://github.blog/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 블로그<\/a><\/td><\/tr><tr><td>GitHub 팔로우<\/td><td><a href=\"https://twitter.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">트위터<\/a> <a href=\"https://www.linkedin.com/company/github\" target=\"_blank\" rel=\"noopener noreferrer\">LinkedIn<\/a> <a href=\"https://www.instagram.com/github/\" target=\"_blank\" rel=\"noopener noreferrer\">인스타그램<\/a><\/td><\/tr><tr><td>비디오 찾기<\/td><td><a href=\"https://www.youtube.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube<\/a><\/td><\/tr><\/tbody><\/table>"]}, {"n": "12", "title": "변경사항 기록", "secs": ["<p>아래 표는 측정된 기술의 현재 버전과 이전 버전 사이의 변화를 요약한 것입니다. 기능 그룹은 굵은 글씨로 표시되어 있고 그 뒤에 각 그룹 내의 목표가 표시됩니다. 이 표는 이전 버전과 현재 버전의 시험 기술을 비교한 것이고, 세 번째 열은 변화의 범위를 설명합니다.<\/p>\n<table><thead><tr><th>2026년 8월 7일 이전의 기술 영역<\/th><th>2026년 8월 7일 현재 기술 영역<\/th><th>Change<\/th><\/tr><\/thead><tbody><tr><td>청중 프로필<\/td><td><\/td><td>변경 없음<\/td><\/tr><tr><td><strong>GitHub Copilot 기능 사용<\/strong><\/td><td><strong>GitHub Copilot 기능 사용<\/strong><\/td><td>변경 없음<\/td><\/tr><tr><td>IDE에서 GitHub Copilot 사용<\/td><td>IDE에서 GitHub Copilot 사용<\/td><td>경미함<\/td><\/tr><tr><td>GitHub Copilot 기능 및 기능 사용<\/td><td>GitHub Copilot 기능 및 기능 사용<\/td><td>경미함<\/td><\/tr><tr><td><strong>개인 정보, 콘텐츠 제외 및 보호 구성<\/strong><\/td><td><strong>개인 정보, 콘텐츠 제외 및 보호 구성<\/strong><\/td><td>변경 없음<\/td><\/tr><tr><td>세이프가드 적용 및 문제 해결<\/td><td>세이프가드 적용 및 문제 해결<\/td><td>경미함<\/td><\/tr><\/tbody><\/table>"]}]}, "ja": {"title": "試験 GH-300 の学習ガイド: GitHub Copilot", "note": ["Source: https://learn.microsoft.com/ja-jp/credentials/certifications/resources/study-guides/gh-300 (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "このドキュメントの目的", "secs": ["<p>この学習ガイドは、試験で期待される内容を理解するのに役立ち、試験で取り上げる可能性のあるトピックの概要と、追加のリソースへのリンクを含める必要があります。 このドキュメントの情報と資料は、試験の準備をする際に研究に集中するのに役立ちます。<\/p>\n<table><thead><tr><th>便利なリンク<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://learn.microsoft.com/ja-jp/credentials/certifications/renew-your-microsoft-certification\" target=\"_blank\" rel=\"noopener noreferrer\">認定資格の更新<\/a><\/td><td>Microsoft のアソシエイト、エキスパート、および専門認定資格は、毎年有効期限が切れます。 資格所有者は、Microsoft Learn で無料のオンライン評価に合格するだけで更新できます。<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ja-jp/users\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft Learn のプロフィール<\/a><\/td><td>認定プロファイルを Microsoft Learn に接続すると、試験のスケジュールと更新、証明書の共有と印刷を行うことができます。<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ja-jp/credentials/certifications/exam-scoring-reports\" target=\"_blank\" rel=\"noopener noreferrer\">試験の採点と採点報告<\/a><\/td><td>合格するには、700 以上のスコアが必要です。<\/td><\/tr><tr><td><a href=\"https://aka.ms/examdemo\" target=\"_blank\" rel=\"noopener noreferrer\">試験サンドボックス<\/a><\/td><td>試験のサンドボックスにアクセスして、試験環境を探索できます。<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ja-jp/credentials/certifications/request-accommodations\" target=\"_blank\" rel=\"noopener noreferrer\"> <\/a> の宿泊施設をリクエストする<\/td><td>支援デバイスを使用する場合、余分な時間が必要な場合、または試験エクスペリエンスの任意の部分に変更が必要な場合は、宿泊施設を要求できます。<\/td><\/tr><\/tbody><\/table>"]}, {"n": "2", "title": "試験について", "secs": ["<p>一部の試験は他の言語にローカライズされ、英語版が更新されてから約 8 週間後に更新されます。 Microsoft では、前述のようにローカライズ版を更新するためにあらゆる努力を行いますが、場合によっては、予定どおりに試験のローカライズ版が更新されないことがあります。 その他の利用可能な言語は、<strong>試験の詳細<\/strong> Web ページの「<strong>試験のスケジュール設定<\/strong>」セクションに表示されます。 お好みの言語で試験を利用できない場合は、30 分を追加で要求して試験を完了できます。<\/p>", "<h3>注<\/h3>\n<p>測定された各スキルに従う箇条書きは、そのスキルを評価する方法を示すことを目的としています。 関連するトピックについては、試験で取り上げる場合があります。<\/p>", "<h3>注<\/h3>\n<p>ほとんどの質問では、一般提供 (GA) の機能について説明します。 これらの機能が一般的に使用されている場合、試験にはプレビュー機能に関する質問が含まれる場合があります。<\/p>"]}, {"n": "3", "title": "対象ユーザープロファイル", "secs": ["<p>この試験の受験者は、GitHub Copilot を使用してソフトウェア開発の生産性、品質、セキュリティを向上させる専門知識を持っている必要があります。 これには、責任ある AI の使用、プロンプト エンジニアリング、さまざまなプランにわたる Copilot 機能、プライバシー保護が含まれます。 また、候補者は GitHub の基礎に精通し、1 つ以上のプログラミング言語の経験を持っている必要があります。<\/p>"]}, {"n": "4", "title": "スキルの概要", "secs": ["<ul><li>GitHub Copilot を責任を持って使用する (15 ~ 20%)<\/li><li>GitHub Copilot 機能の使用 (25 ~ 30%)<\/li><li>GitHub Copilot の機能 (25 ~ 30%)<\/li><li>GitHub Copilot のデータとアーキテクチャについて (10 から 15%)<\/li><li>迅速なエンジニアリングとコンテキスト作成の適用 (10 ~ 15%)<\/li><li>GitHub Copilot を使用して開発者の生産性を向上させる (10 から 15%)<\/li><li>プライバシー、コンテンツの除外、セーフガードを構成する (10 ~ 15%)<\/li><\/ul>"]}, {"n": "5", "title": "GitHub Copilot を責任を持って使用する (15 ~ 20%)", "secs": ["", "<h3>責任ある AI の原則を理解する<\/h3>\n<ul><li>ジェネレーティブ AI ツールのリスクと制限事項について説明する<\/li><li>倫理的で責任ある AI の使用状況について説明する<\/li><li>AI の使用に関する潜在的な損害と軽減戦略を特定する<\/li><\/ul>", "<h3>AI ツールの検証と運用<\/h3>\n<ul><li>AI 出力を検証する必要性について説明する<\/li><li>GitHub Copilot を責任を持って運用する方法を特定する<\/li><\/ul>"]}, {"n": "6", "title": "GitHub Copilot 機能の使用 (25 ~ 30%)", "secs": ["", "<h3>IDE で GitHub Copilot を使用する<\/h3>\n<ul><li>IDE で Copilot を有効にする<\/li><li>インライン提案、チャット、CLI、エージェント モードを使用してCopilotをトリガーする<\/li><li>特定のファイルまたはリポジトリのコンテンツの除外を構成する (アプリの知識)<\/li><\/ul>", "<h3>GitHub Copilot CLI を使用する<\/h3>\n<ul><li>GitHub Copilot CLI を定義し、開発者にメリットを提供する方法<\/li><li>GitHub Copilot CLI をインストールするための手順を特定する<\/li><li>GitHub Copilot CLI の主な機能とコマンドについて説明する<\/li><li>GitHub Copilot CLI を対話形式でセッションで使用する<\/li><li>GitHub Copilot CLI を使用してスクリプトを生成し、ファイルを管理する<\/li><\/ul>", "<h3>GitHub Copilot の機能を使用する<\/h3>\n<ul><li>エージェント モード、Copilot編集、MCP を使用して開発とワークフローを強化します。エージェント セッションを管理し、タスクをサブエージェントに委任してコンテキストの使用を最適化する<\/li><li>コード レビューとコーディング支援に Copilot を使用する<\/li><li>命令ファイルを使用して、Spaces、Spark、Pull Request の概要、およびカスタマイズ可能なレビュー標準を利用する<\/li><li>GitHub Copilot Chat の制限、オプション、フィードバック、コマンドについて説明します。一貫性のある応答のためのプロンプト ファイルの再利用を含める<\/li><\/ul>", "<h3>組織全体の設定とポリシーを管理する<\/h3>\n<ul><li>組織全体のポリシー管理を構成する。Copilot コード レビュー ポリシーを有効にし、IDE と github.com 全体で機能の可用性を管理する<\/li><li>監査ログ イベントを利用する<\/li><li>REST API を使用してサブスクリプションを管理する<\/li><\/ul>"]}, {"n": "7", "title": "GitHub Copilot のデータとアーキテクチャについて (10 から 15%)", "secs": ["", "<h3>データの処理とフローについて説明する<\/h3>\n<ul><li>データの使用状況、フロー、および共有について説明する<\/li><li>入力処理とプロンプトの作成について説明する<\/li><li>プロキシのフィルター処理と後処理について説明する<\/li><\/ul>", "<h3>ライフサイクルと制限事項を理解する<\/h3>\n<ul><li>コード提案のライフサイクルを視覚化する<\/li><li>LLM と Copilot の制限事項について説明する<\/li><\/ul>"]}, {"n": "8", "title": "迅速なエンジニアリングとコンテキスト作成の適用 (10 ~ 15%)", "secs": ["", "<h3>効果的なプロンプトを作成する<\/h3>\n<ul><li>プロンプトの構造とコンテキストについて説明する<\/li><li>コンテキストの決定方法を理解する<\/li><li>ゼロショットおよび少ショットのプロンプトを使用する<\/li><li>プロンプト作成のベスト プラクティスを適用する<\/li><\/ul>", "<h3>パフォーマンスを向上させるためのプロンプトを設計する<\/h3>\n<ul><li>プロンプトエンジニアリングの原則を解説する<\/li><li>プロンプト プロセス フローとチャット履歴の使用状況について説明する<\/li><\/ul>"]}, {"n": "9", "title": "GitHub Copilot を使用して開発者の生産性を向上させる (10 から 15%)", "secs": ["", "<h3>生産性とコード品質の向上<\/h3>\n<ul><li>コードの生成、リファクタリング、およびドキュメントに Copilot を使用する<\/li><li>学習を高速化し、コンテキストの切り替えを減らす<\/li><li>サンプル データを生成し、レガシ コードを最新化する<\/li><\/ul>", "<h3>テストとセキュリティのサポート<\/h3>\n<ul><li>単体テストと統合テストを生成する<\/li><li>エッジ ケースを特定し、アサーションを記述する<\/li><li>セキュリティの向上とパフォーマンスの最適化を提案する<\/li><\/ul>"]}, {"n": "10", "title": "プライバシー、コンテンツの除外、セーフガードを構成する (10 ~ 15%)", "secs": ["", "<h3>プライバシー設定と除外を管理する<\/h3>\n<ul><li>コンテンツの除外とエディターの設定を構成する<\/li><li>出力の所有権と制限事項について説明する<\/li><\/ul>", "<h3>セーフガードの適用とトラブルシューティング<\/h3>\n<ul><li>パブリック コードのフィルター処理に一致する候補を有効にする<\/li><li>提案とコンテンツの除外に関する問題を解決する<\/li><\/ul>"]}, {"n": "11", "title": "学習用リソース", "secs": ["<p>試験を受ける前に、トレーニングを行い、実践的な体験をすることをお勧めします。 私たちは、自己学習のオプションと教室のトレーニングだけでなく、ドキュメント、コミュニティサイト、ビデオへのリンクを提供しています。<\/p>\n<table><thead><tr><th>学習用リソース<\/th><th>学習とドキュメントへのリンク<\/th><\/tr><\/thead><tbody><tr><td>トレーニングを受ける<\/td><td>マイペースのラーニング パスとモジュールから選択するか、Microsoft Learn でインストラクター主導のコースを受講する – <a href=\"https://learn.microsoft.com/ja-jp/training/paths/copilot/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot Fundamentals Part 1<\/a> と <a href=\"https://learn.microsoft.com/ja-jp/training/paths/gh-copilot-2/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot Fundamentals Part 2<\/a><\/td><\/tr><tr><td>ドキュメントを見つける<\/td><td><a href=\"https://learn.microsoft.com/ja-jp/training/modules/responsible-ai-with-github-copilot/\" target=\"_blank\" rel=\"noopener noreferrer\">責任ある AI<\/a> <a href=\"https://docs.github.com/copilot/about-github-copilot/plans-for-github-copilot\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot のプランと機能<\/a> <a href=\"https://github.com/trust-center\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot のしくみとデータの処理方法<\/a> <a href=\"https://docs.github.com/copilot/using-github-copilot/copilot-chat/prompt-engineering-for-copilot-chat\" target=\"_blank\" rel=\"noopener noreferrer\">プロンプトの作成とプロンプトエンジニアリング<\/a> <a href=\"https://learn.microsoft.com/ja-jp/training/modules/developer-use-cases-for-ai-with-github-copilot/\" target=\"_blank\" rel=\"noopener noreferrer\">AI の開発者ユース ケース<\/a> <a href=\"https://learn.microsoft.com/ja-jp/training/modules/develop-unit-tests-using-github-copilot-tools/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot を使用したテスト<\/a> <a href=\"https://docs.github.com/copilot/managing-copilot/configuring-and-auditing-content-exclusion\" target=\"_blank\" rel=\"noopener noreferrer\">プライバシーの基礎とコンテンツの除外<\/a><\/td><\/tr><tr><td>質問する<\/td><td><a href=\"https://github.community/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub コミュニティディスカッション<\/a><\/td><\/tr><tr><td>コミュニティ サポートを受ける<\/td><td><a href=\"https://github.blog/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub ブログ<\/a><\/td><\/tr><tr><td>GitHub をフォローする<\/td><td><a href=\"https://twitter.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">ツイッター<\/a> <a href=\"https://www.linkedin.com/company/github\" target=\"_blank\" rel=\"noopener noreferrer\">LinkedIn<\/a> <a href=\"https://www.instagram.com/github/\" target=\"_blank\" rel=\"noopener noreferrer\">Instagram<\/a><\/td><\/tr><tr><td>ビデオを見つける<\/td><td><a href=\"https://www.youtube.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube<\/a><\/td><\/tr><\/tbody><\/table>"]}, {"n": "12", "title": "変更ログ", "secs": ["<p>次の表は、評価されるスキルの現在のバージョンと以前のバージョン間の変更をまとめたものです。 機能グループは太字の書体で示され、各グループの目標がその後に続きます。 表は、この試験で評価されるスキルの以前と現在のバージョンを比較したもので、3 番目の列は変更の程度を示しています。<\/p>\n<table><thead><tr><th>2026 年 8 月 7 日より前のスキル領域<\/th><th>2026年8月7日現在のスキル領域<\/th><th>変更<\/th><\/tr><\/thead><tbody><tr><td>対象ユーザープロファイル<\/td><td><\/td><td>変更なし<\/td><\/tr><tr><td><strong>GitHub Copilot機能を使用する<\/strong><\/td><td><strong>GitHub Copilot機能を使用する<\/strong><\/td><td>変更なし<\/td><\/tr><tr><td>IDE で GitHub Copilot を使用する<\/td><td>IDE で GitHub Copilot を使用する<\/td><td>軽微<\/td><\/tr><tr><td>GitHub Copilot の機能を使用する<\/td><td>GitHub Copilot の機能を使用する<\/td><td>軽微<\/td><\/tr><tr><td><strong>プライバシー、コンテンツの除外、セーフガードを構成する<\/strong><\/td><td><strong>プライバシー、コンテンツの除外、セーフガードを構成する<\/strong><\/td><td>変更なし<\/td><\/tr><tr><td>セーフガードの適用とトラブルシューティング<\/td><td>セーフガードの適用とトラブルシューティング<\/td><td>軽微<\/td><\/tr><\/tbody><\/table>"]}]}, "en": {"title": "Study guide for Exam GH-300: GitHub Copilot", "note": ["Source: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/gh-300 (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "Purpose of this document", "secs": ["<p>This study guide should help you understand what to expect on the exam and includes a summary of the topics the exam might cover and links to additional resources. The information and materials in this document should help you focus your studies as you prepare for the exam.<\/p>\n<table><thead><tr><th>Useful links<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://learn.microsoft.com/en-us/credentials/certifications/renew-your-microsoft-certification\" target=\"_blank\" rel=\"noopener noreferrer\">Certification renewal<\/a><\/td><td>Microsoft associate, expert, and specialty certifications expire annually. You can renew by passing a free online assessment on Microsoft Learn.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/en-us/users\" target=\"_blank\" rel=\"noopener noreferrer\">Your Microsoft Learn profile<\/a><\/td><td>Connecting your certification profile to Microsoft Learn allows you to schedule and renew exams and share and print certificates.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/en-us/credentials/certifications/exam-scoring-reports\" target=\"_blank\" rel=\"noopener noreferrer\">Exam scoring and score reports<\/a><\/td><td>A score of 700 or greater is required to pass.<\/td><\/tr><tr><td><a href=\"https://aka.ms/examdemo\" target=\"_blank\" rel=\"noopener noreferrer\">Exam sandbox<\/a><\/td><td>You can explore the exam environment by visiting our exam sandbox.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/en-us/credentials/certifications/request-accommodations\" target=\"_blank\" rel=\"noopener noreferrer\">Request accommodations<\/a><\/td><td>If you use assistive devices, require extra time, or need modification to any part of the exam experience, you can request an accommodation.<\/td><\/tr><\/tbody><\/table>"]}, {"n": "2", "title": "About the exam", "secs": ["<p>Some exams are localized into other languages, and those are updated approximately eight weeks after the English version is updated. While Microsoft makes every effort to update localized versions as noted, there may be times when the localized versions of an exam are not updated on this schedule. Other available languages are listed in the <strong>Schedule Exam<\/strong> section of the <strong>Exam Details<\/strong> webpage. If the exam isn't available in your preferred language, you can request an additional 30 minutes to complete the exam.<\/p>", "<h3>Note<\/h3>\n<p>The bullets that follow each of the skills measured are intended to illustrate how we are assessing that skill. Related topics may be covered in the exam.<\/p>", "<h3>Note<\/h3>\n<p>Most questions cover features that are general availability (GA). The exam may contain questions on Preview features if those features are commonly used.<\/p>"]}, {"n": "3", "title": "Audience profile", "secs": ["<p>Candidates for this exam should possess expertise in using GitHub Copilot to improve software development productivity, quality, and security. This includes responsible AI use, prompt engineering, Copilot features across various plans, and privacy safeguards. Candidates should also be familiar with GitHub fundamentals and have experience with one or more programming languages.<\/p>"]}, {"n": "4", "title": "Skills at a glance", "secs": ["<ul><li>Use GitHub Copilot responsibly (15–20%)<\/li><li>Use GitHub Copilot features (25–30%)<\/li><li>GitHub Copilot features (25–30%)<\/li><li>Understand GitHub Copilot data and architecture (10–15%)<\/li><li>Apply prompt engineering and context crafting (10–15%)<\/li><li>Improve developer productivity with GitHub Copilot (10–15%)<\/li><li>Configure privacy, content exclusions, and safeguards (10–15%)<\/li><\/ul>"]}, {"n": "5", "title": "Use GitHub Copilot responsibly (15–20%)", "secs": ["", "<h3>Understand responsible AI principles<\/h3>\n<ul><li>Describe risks and limitations of Generative AI tools<\/li><li>Describe ethical and responsible AI usage<\/li><li>Identify potential harms and mitigation strategies of AI usage<\/li><\/ul>", "<h3>Validate and operate AI tools<\/h3>\n<ul><li>Explain the need to validate AI output<\/li><li>Identify how to operate GitHub Copilot responsibly<\/li><\/ul>"]}, {"n": "6", "title": "Use GitHub Copilot features (25–30%)", "secs": ["", "<h3>Use GitHub Copilot in the IDE<\/h3>\n<ul><li>Enable Copilot in the IDE<\/li><li>Trigger Copilot through inline suggestions, chat, CLI, and agent mode<\/li><li>Configure content exclusions for specific files or repositories (app knowledge)<\/li><\/ul>", "<h3>Use GitHub Copilot CLI<\/h3>\n<ul><li>Define GitHub Copilot CLI and how it benefits developers<\/li><li>Identify the steps for installing GitHub Copilot CLI<\/li><li>Describe key GitHub Copilot CLI features and commands<\/li><li>Use GitHub Copilot CLI interactively and in sessions<\/li><li>Generate scripts and manage files with GitHub Copilot CLI<\/li><\/ul>", "<h3>Use GitHub Copilot features and capabilities<\/h3>\n<ul><li>Use Agent Mode, Copilot Edits, and MCP for enhanced development and workflows; manage Agent Sessions and delegate tasks to Sub‑Agents for optimized context usage<\/li><li>Use Copilot for code review and coding assistance<\/li><li>Utilize Spaces, Spark, Pull Request summaries, and customizable review standards via instructions files<\/li><li>Understand the limits, options, feedback, and commands of GitHub Copilot Chat; include prompt file reuse for consistent responses<\/li><\/ul>", "<h3>Manage organization-wide settings and policies<\/h3>\n<ul><li>Configure organization-wide policy management; enable Copilot Code Review policies and manage feature availability across IDEs and github.com<\/li><li>Utilize audit log events<\/li><li>Manage subscriptions using the REST API<\/li><\/ul>"]}, {"n": "7", "title": "Understand GitHub Copilot data and architecture (10–15%)", "secs": ["", "<h3>Describe data handling and flow<\/h3>\n<ul><li>Explain data usage, flow, and sharing<\/li><li>Describe input processing and prompt building<\/li><li>Explain proxy filtering and post-processing<\/li><\/ul>", "<h3>Understand lifecycle and limitations<\/h3>\n<ul><li>Visualize code suggestion lifecycle<\/li><li>Describe limitations of LLMs and Copilot<\/li><\/ul>"]}, {"n": "8", "title": "Apply prompt engineering and context crafting (10–15%)", "secs": ["", "<h3>Craft effective prompts<\/h3>\n<ul><li>Describe prompt structure and context<\/li><li>Understand how context is determined<\/li><li>Use zero-shot and few-shot prompting<\/li><li>Apply best practices for prompt crafting<\/li><\/ul>", "<h3>Engineer prompts for performance<\/h3>\n<ul><li>Explain prompt engineering principles<\/li><li>Describe prompt process flow and chat history usage<\/li><\/ul>"]}, {"n": "9", "title": "Improve developer productivity with GitHub Copilot (10–15%)", "secs": ["", "<h3>Enhance productivity and code quality<\/h3>\n<ul><li>Use Copilot for code generation, refactoring, and documentation<\/li><li>Accelerate learning and reduce context switching<\/li><li>Generate sample data and modernize legacy code<\/li><\/ul>", "<h3>Support testing and security<\/h3>\n<ul><li>Generate unit and integration tests<\/li><li>Identify edge cases and write assertions<\/li><li>Suggest security improvements and performance optimizations<\/li><\/ul>"]}, {"n": "10", "title": "Configure privacy, content exclusions, and safeguards (10–15%)", "secs": ["", "<h3>Manage privacy settings and exclusions<\/h3>\n<ul><li>Configure content exclusions and editor settings<\/li><li>Describe ownership and limitations of outputs<\/li><\/ul>", "<h3>Apply safeguards and troubleshoot<\/h3>\n<ul><li>Enable suggestions matching public code filtering<\/li><li>Resolve issues with suggestions and content exclusions<\/li><\/ul>"]}, {"n": "11", "title": "Study resources", "secs": ["<p>We recommend that you train and get hands-on experience before you take the exam. We offer self-study options and classroom training as well as links to documentation, community sites, and videos.<\/p>\n<table><thead><tr><th>Study resources<\/th><th>Links to learning and documentation<\/th><\/tr><\/thead><tbody><tr><td>Get trained<\/td><td>Choose from self-paced learning paths and modules or take an instructor-led course on Microsoft Learn – <a href=\"https://learn.microsoft.com/en-us/training/paths/copilot/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot Fundamentals Part 1<\/a> and <a href=\"https://learn.microsoft.com/en-us/training/paths/gh-copilot-2/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot Fundamentals Part 2<\/a><\/td><\/tr><tr><td>Find documentation<\/td><td><a href=\"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/\" target=\"_blank\" rel=\"noopener noreferrer\">Responsible AI<\/a> <a href=\"https://docs.github.com/copilot/about-github-copilot/plans-for-github-copilot\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Copilot plans and features<\/a> <a href=\"https://github.com/trust-center\" target=\"_blank\" rel=\"noopener noreferrer\">How GitHub Copilot works and handles data<\/a> <a href=\"https://docs.github.com/copilot/using-github-copilot/copilot-chat/prompt-engineering-for-copilot-chat\" target=\"_blank\" rel=\"noopener noreferrer\">Prompt crafting and prompt engineering<\/a> <a href=\"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/\" target=\"_blank\" rel=\"noopener noreferrer\">Developer use cases for AI<\/a> <a href=\"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/\" target=\"_blank\" rel=\"noopener noreferrer\">Testing with GitHub Copilot<\/a> <a href=\"https://docs.github.com/copilot/managing-copilot/configuring-and-auditing-content-exclusion\" target=\"_blank\" rel=\"noopener noreferrer\">Privacy fundamentals and content exclusions<\/a><\/td><\/tr><tr><td>Ask a question<\/td><td><a href=\"https://github.community/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Community Discussions<\/a><\/td><\/tr><tr><td>Get community support<\/td><td><a href=\"https://github.blog/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Blog<\/a><\/td><\/tr><tr><td>Follow GitHub<\/td><td><a href=\"https://twitter.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">Twitter<\/a> <a href=\"https://www.linkedin.com/company/github\" target=\"_blank\" rel=\"noopener noreferrer\">LinkedIn<\/a> <a href=\"https://www.instagram.com/github/\" target=\"_blank\" rel=\"noopener noreferrer\">Instagram<\/a><\/td><\/tr><tr><td>Find a video<\/td><td><a href=\"https://www.youtube.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube<\/a><\/td><\/tr><\/tbody><\/table>"]}, {"n": "12", "title": "Change log", "secs": ["<p>The table below summarizes the changes between the current and previous version of the skills measured. The functional groups are in bold typeface followed by the objectives within each group. The table is a comparison between the previous and current version of the exam skills measured and the third column describes the extent of the changes.<\/p>\n<table><thead><tr><th>Skill area prior to August 7, 2026<\/th><th>Skill area as of August 7, 2026<\/th><th>Change<\/th><\/tr><\/thead><tbody><tr><td>Audience profile<\/td><td><\/td><td>No change<\/td><\/tr><tr><td><strong>Use GitHub Copilot features<\/strong><\/td><td><strong>Use GitHub Copilot features<\/strong><\/td><td>No change<\/td><\/tr><tr><td>Use GitHub Copilot in the IDE<\/td><td>Use GitHub Copilot in the IDE<\/td><td>Minor<\/td><\/tr><tr><td>Use GitHub Copilot features and capabilities<\/td><td>Use GitHub Copilot features and capabilities<\/td><td>Minor<\/td><\/tr><tr><td><strong>Configure privacy, content exclusions, and safeguards<\/strong><\/td><td><strong>Configure privacy, content exclusions, and safeguards<\/strong><\/td><td>No change<\/td><\/tr><tr><td>Apply safeguards and troubleshoot<\/td><td>Apply safeguards and troubleshoot<\/td><td>Minor<\/td><\/tr><\/tbody><\/table>"]}]}};
const out=document.getElementById('out'), nav=document.getElementById('chaps'), noteEl=document.getElementById('note');
const N=DATA.ko.ch.length;
const NOTES={
 ko:['<p><strong>한국어판</strong>: Microsoft Learn의 공식 한국어 페이지(GH-300 스터디 가이드) 본문을 그대로 옮겼습니다. 출처: learn.microsoft.com, 2026-11-07 확인. 기술 목록은 2026년 8월 7일 기준입니다.</p>','<p><strong>주의</strong>: 한국어·일본어 페이지 모두 Microsoft가 제공하는 <strong>기계 번역본</strong>입니다(페이지 메타데이터 ms.translationtype=MT). Copilot 용어가 어색하게 번역된 곳이 있으니 의미가 애매하면 영어판을 확인하세요. 4장 목록에서 \'GitHub Copilot 기능(25-30%)\'이 두 번 나오는 것은 영어 원문도 같습니다.</p>'],
 ja:['<p><strong>日本語版</strong>：Microsoft Learn 公式の日本語ページ (GH-300 学習ガイド) の本文をそのまま転記しています。出典：learn.microsoft.com（2026-11-07 時点）。日本語ページは Microsoft による機械翻訳 (ms.translationtype=MT) です。</p>'],
 dual:['<p><strong>한·日 대조</strong>: 왼쪽은 공식 한국어 페이지, 오른쪽은 공식 일본어 페이지입니다(둘 다 기계 번역). 같은 항목끼리 줄을 맞췄습니다.</p>'],
 en:['<p><strong>English</strong>: official Microsoft Learn study guide for Exam GH-300 (skills measured as of August 7, 2026), transcribed from learn.microsoft.com as of 2026-11-07.</p>']
};
let view='ko', openAll=false;
try{const s=localStorage.getItem('gh300-guide-view'); if(s&&NOTES[s]) view=s;}catch(e){}
function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');}
function prep(h){h=wrapTables(h); return openAll?h.replace(/<details class="ans">/g,'<details class="ans" open>'):h;}
function render(){
  document.body.classList.toggle('dual',view==='dual');
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  noteEl.innerHTML=NOTES[view].join('');
  let h='';
  for(let i=0;i<N;i++){
    const ko=DATA.ko.ch[i], ja=DATA.ja.ch[i], en=DATA.en.ch[i], n=ko.n;
    h+=`<section class="chap" id="c${n}">`;
    if(view==='dual'){
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1>${ko.title}<span class="sub ja" lang="ja">${ja.title}</span></h1></div>`;
      h+=`<div class="colhead"><span>한국어</span><span>日本語</span></div>`;
      ko.secs.forEach((s,j)=>{h+=`<div class="pair"><div class="sec">${prep(s)}</div><div class="sec ja" lang="ja">${prep(ja.secs[j])}</div></div>`;});
    }else{
      const L=view, c=DATA[L].ch[i];
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1 class="${L}" lang="${L}">${c.title}</h1></div>`;
      h+=`<div class="sec ${L}" lang="${L}">${c.secs.map(prep).join('')}</div>`;
    }
    h+='</section>';
  }
  out.innerHTML=h;
  const L=view==='dual'?'ko':view;
  nav.innerHTML=DATA[L].ch.map(c=>`<button data-c="${c.n}" title="${c.title}">${c.n}</button>`).join('');
  spy();
}
document.querySelector('.langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const cur=current();
  view=b.dataset.v; try{localStorage.setItem('gh300-guide-view',view);}catch(e){}
  render(); jump(cur,false);
});
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) jump(b.dataset.c,true);});
function off(){return document.querySelector('header.top').getBoundingClientRect().bottom;}
function jump(n,smooth){
  const el=document.getElementById('c'+n); if(!el) return;
  window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off()-8,behavior:smooth?'smooth':'auto'});
}
function current(){
  const o=off()+20; let c=DATA.ko.ch[0].n;
  DATA.ko.ch.forEach(x=>{const el=document.getElementById('c'+x.n); if(el&&el.getBoundingClientRect().top<=o) c=x.n;}); return c;
}
function spy(){const c=current(); nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));}
addEventListener('scroll',spy,{passive:true});
render();
</script>

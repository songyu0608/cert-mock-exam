<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>CCAO-F 공식 시험 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: sticky bar (language tabs + chapter chips), one reading column; "대조" view = section-aligned two-column grid */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b1f2a; --muted:#5b6475; --line:#dde1e8;
  --accent:#2f4bb8; --accent-soft:#e7ebfa; --code-bg:#eef0f5; --quote:#f0f3fb; --ok:#1d7a52; --ok-soft:#e5f4ec;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-display:"Fraunces",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ko);font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.dual .wrap{max-width:1260px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto;letter-spacing:.01em}
.brand small{font-family:var(--f-ko);color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:4px 10px;font-size:13px;line-height:1.5}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chaps button{font-family:var(--f-mono);font-size:12px;padding:1px 0;min-width:30px;text-align:center}
.chaps button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding-block:24px 80px}
.note{font-size:13px;color:var(--muted);line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:36px;background:var(--surface)}
.note p{margin:0}
.chap{margin-bottom:56px}
.chap-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:8px}
.chap-no{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.2em}
.chap-head h1{font-size:22px;line-height:1.4;margin:0;text-wrap:balance}
.chap-head .sub{font-size:13px;color:var(--muted);display:block;font-weight:400}
.sec h3{font-size:18px;margin:34px 0 8px;text-wrap:balance}
.sec h4{font-size:15.5px;margin:28px 0 6px;color:var(--accent);line-height:1.55;text-wrap:balance}
.sec p{margin:0 0 14px}
.sec ul,.sec ol{margin:0 0 14px;padding-left:1.4em}
.sec li{margin:3px 0}
.sec ul.opts{list-style:none;padding-left:0}
.sec ul.opts li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;background:var(--surface)}
.sec blockquote{margin:16px 0;padding:10px 16px;background:var(--quote);border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.sec blockquote p:last-child{margin-bottom:0}
details.ans{margin:4px 0 26px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.ans summary{cursor:pointer;padding:7px 12px;font-size:13.5px;color:var(--ok);font-weight:600}
details.ans[open]{background:var(--ok-soft);border-color:var(--ok)}
details.ans p{margin:0;padding:0 14px 12px}
.sec code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:6px 0 18px}
.sec table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.sec th,.sec td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sec th{background:var(--code-bg)}
.ja{font-family:var(--f-ja)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0}
.pair>div{min-width:0}
.colhead{display:grid;grid-template-columns:1fr 1fr;gap:36px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:820px){.pair{grid-template-columns:1fr}.pair>div.ja{border-top:1px dotted var(--line);padding-top:4px}.colhead{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <span class="brand">CCAO-F 시험 가이드<small>v1.0 · 전문</small></span>
    <div class="row langs" role="group" aria-label="언어">
      <button id="v-ko" data-v="ko">한국어</button>
      <button id="v-ja" data-v="ja">日本語</button>
      <button id="v-dual" data-v="dual">한·日 대조</button>
    </div>
  </div>
  <div class="row chaps" role="group" aria-label="장 이동" id="chaps"></div>
</div></header>
<main><div class="wrap">
  <div class="note" id="note"></div>
  <div class="row" style="margin:-24px 0 24px"><span class="tools"><button id="openAll">샘플 문제 정답 모두 펼치기</button></span></div>
  <div id="out"></div>
</div></main>

<script>
const DATA={"ko": {"title": "Claude Certified Associate – Foundations 시험 가이드 — 한국어판(비공식 번역)", "note": ["원문: Anthropic 공식 「Claude Certified Associate – Foundations 試験ガイド」 일본어판 PDF(버전 1.0 · 2026년 7월 발효 · 시험 코드 CCAO-F).", "일본어 공식판을 요약 없이 옮긴 비공식 번역입니다. 해석이 갈리면 일본어 공식판이 기준입니다. 제품명·기능명은 원어를 그대로 두거나 병기했습니다.", "원문 서두 문구: 「本ガイドは予告なく変更されることがあります。」(이 가이드는 예고 없이 변경될 수 있습니다.)"], "ch": [{"n": "1", "title": "이 자격증에 대하여", "secs": ["<p>Claude Certified Associate – Foundations 자격증은 최소한의 지원만으로 Claude를 활용해 비즈니스 및 생산성 향상 업무를 완수할 수 있음을 증명합니다. 여기에는 플랫폼에 내장된 기능, 능력, 도구로 워크플로를 효율화하는 것, Claude로 프로세스를 개선할 기회를 찾는 것, 품질·효율·비용의 균형이 잡힌 접근 방식을 선택하는 것, 그리고 한계를 인식하고 더 복잡하거나 기술적인 작업을 Claude 아키텍트나 개발자에게 에스컬레이션하는 것이 포함됩니다.<\/p>\n<p>이 자격증은 운영, 마케팅, 프로젝트 관리, 교육, 커뮤니케이션 등의 직무에서 Claude를 생산성 도구로 사용하는 실무자를 대상으로 합니다. 이 가이드는 응시를 준비하는 응시자를 위한 공식 참고 자료입니다. 자격의 목적, 대상자, 시험 형식과 블루프린트, 채점, 정책, 응시 규칙을 설명합니다. 예약하기 전에 전체를 읽어 주십시오.<\/p>"]}, {"n": "2", "title": "자격의 목적과 가치", "secs": ["<p>Claude Certified Associate – Foundations 자격증의 주된 목적은 실제 비즈니스 워크플로에서 Claude를 효과적이고 책임 있게 사용하는 데 필요한 지식과 기술을 독립적인 입장에서 평가하는 것입니다. 이 자격을 취득했다는 것은 보유자가 시험 블루프린트에 정해진 지식과 기술을 입증했음을 뜻합니다.<\/p>\n<p>이 자격을 취득한 응시자는 다음을 할 수 있음을 보여 줄 수 있습니다.<\/p>\n<ul><li>최소한의 지원만으로 구조화된 비즈니스 업무를 완수하는 데 Claude를 적용한다<\/li><li>플랫폼에 내장된 기능과 도구로 워크플로를 효율화한다<\/li><li>Claude로 프로세스를 개선할 수 있는 기회를 찾는다<\/li><li>품질, 효율, 비용의 균형을 맞추기 위해 적절한 접근 방식을 선택한다<\/li><li>한계를 인식하고, 더 복잡하거나 기술적인 구현은 에스컬레이션한다<\/li><\/ul>"]}, {"n": "3", "title": "대상자", "secs": ["<p>이 자격증은 일상 업무에서 Claude를 생산성 도구로 사용하고, Claude의 프로젝트 기능으로 프로젝트를 구축하는 실무자를 대상으로 합니다. 대상자는 운영, 마케팅, 프로젝트 관리, 교육, 커뮤니케이션, 일반적인 지식 노동 등의 직능에 걸쳐 일하며, 효율, 의사결정, 콘텐츠 개발을 개선하기 위해 AI를 활용합니다. 대상자에는 AI를 활용한 지속적인 워크플로를 유지·최적화하는 사내 직원과, 도입·유스케이스 발굴·프로세스 재설계를 지원하는 외부 컨설턴트가 모두 포함됩니다.<\/p>\n<p>응시자의 기술적 전문 지식은 대체로 제한적인 수준에서 중간 수준입니다. 응시자는 AI 프롬프트를 가볍게 쓰는 사용자와 기술적인 AI 실무자의 중간에 위치합니다. 그 특징은 비즈니스 목표를 효과적인 AI와의 상호작용으로 옮기고, 적절한 도구와 기능을 선택하고, 구조화된 프롬프트를 작성하고, AI가 생성한 콘텐츠를 비판적으로 평가하고, 다양한 대상 독자에 맞게 출력을 조정하며, 사람의 전문 지식·검증·에스컬레이션이 필요한 상황을 알아보는 능력에 있습니다.<\/p>\n<p>이 자격증은 API를 이용해 개발하거나 에이전트 시스템을 설계하는 소프트웨어 개발자, 또는 머신러닝, 소프트웨어 엔지니어링, 고급 AI 시스템 설계의 전문가를 대상으로 하지 않습니다. 응시자에게 엔터프라이즈 규모의 AI 아키텍처나 통합을 설계하는 일은 요구되지 않습니다. 그 범위는 Claude Architect와 Claude Developer 자격에 속하며, 어소시에이트는 더 복잡하거나 기술적인 작업을 그 자격 보유자에게 에스컬레이션합니다.<\/p>"]}, {"n": "4", "title": "최소 역량 응시자 프로필", "secs": ["<p>이 시험은 합격 기준을 최소한으로 충족하는 응시자상(MQC)을 기준으로 설계되었습니다. MQC는 Claude를 핵심 생산성 도구로 사용하고, 실제 워크플로 안에서 효과적으로 적용해 효율, 품질, 성과를 개선할 수 있는 실무자입니다. MQC는 프롬프트 구조화, 작업 오케스트레이션, 프로젝트·아티팩트·워크플로 기반 상호작용 같은 기능에 대한 숙련 등 Claude의 능력에 관한 기초적이고 실천적인 지식을 갖추고 있으며, 기본적인 질의응답 사용에 그치지 않고 프로세스 재구상, 작업 자동화, 프로젝트 개발로 나아가 있습니다.<\/p>\n<p>MQC는 조직의 상황을 이해합니다. 즉, Claude가 어떻게 가치를 만드는지, 도입 리스크가 어디에 있는지, 사용을 비즈니스 요구와 책임 있는 AI 실천에 어떻게 맞출지를 파악하고 있습니다. 업무 현장에서 Claude를 일상적으로 실제 사용한 경험이 있으며, 플랫폼에서 일반적인 생산성 업무와 워크플로 업무를 혼자서 완수할 수 있습니다.<\/p>", "<h3>권장 경험<\/h3>\n<ul><li>업무 현장에서 Claude를 일상적으로 실제 사용한 경험<\/li><li>구조화된 문제 해결, 워크플로 설계, 디지털 도구 활용에 관한 기초적인 이해<\/li><li>비즈니스 분석가, 프로젝트 매니저, 운영 리드, 마케팅/커뮤니케이션/인사/교육 실무자, 컨설턴트, 지식 노동자 등의 직무 경험<\/li><li>할루시네이션, 컨텍스트 제약, 데이터 기밀성 등 AI의 한계에 관한 실천적인 이해<\/li><\/ul>\n<p><strong>전제 조건:<\/strong> 필수 전제 조건이나 필수 과정은 없습니다. 소프트웨어 개발이나 API 경험도 필요하지 않습니다. 위의 경험은 권장 사항이며 필수가 아닙니다. 자격은 시험 성적만으로 수여됩니다.<\/p>"]}, {"n": "5", "title": "시험 개요", "secs": ["<table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>자격<\/td><td>Claude Certified Associate – Foundations<\/td><\/tr><tr><td>시험 코드<\/td><td>CCAO-F<\/td><\/tr><tr><td>문항 수<\/td><td>60<\/td><\/tr><tr><td>출제 형식<\/td><td>단일 선택형과 복수 선택형 문제. 문제마다 골라야 할 답의 개수가 명시되어 있습니다<\/td><\/tr><tr><td>시험 시간<\/td><td>120분<\/td><\/tr><tr><td>시행 방식<\/td><td>감독 시험: 프로그램 정책에 따라 온라인 감독 또는 시험 센터, 혹은 둘 다<\/td><\/tr><tr><td>합격 점수<\/td><td>100~1,000 척도에서 환산 점수 720<\/td><\/tr><tr><td>응시료<\/td><td>$99 USD<\/td><\/tr><tr><td>유효 기간<\/td><td>자격 수여일로부터 12개월<\/td><\/tr><tr><td>결과 통지<\/td><td>합격/불합격과 환산 점수(100~1,000). 성적표에는 분야별 정답률도 표시됩니다<\/td><\/tr><\/tbody><\/table>"]}, {"n": "6", "title": "시험 내용 개요(블루프린트)", "secs": ["<p>시험 블루프린트는 측정 대상인 내용 분야와 시험에서 각 분야가 차지하는 대략적인 배점 비율을 정합니다. 배점 비율은 직무 작업 분석으로 정해진, 충분한 역량으로 업무를 수행하는 데 대한 각 분야의 상대적 중요도를 반영합니다. 백분율은 채점 대상 문제 가운데 각 분야에서 출제되는 대략적인 비율을 나타냅니다.<\/p>\n<table><thead><tr><th>분야<\/th><th>내용 분야<\/th><th>배점 비율<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>프롬프트 작성과 작업 수행<\/td><td>14%<\/td><\/tr><tr><td>2<\/td><td>출력 평가와 검증<\/td><td>21%<\/td><\/tr><tr><td>3<\/td><td>제품과 모델 선택<\/td><td>12%<\/td><\/tr><tr><td>4<\/td><td>워크플로 통합과 솔루션 설계<\/td><td>16%<\/td><\/tr><tr><td>5<\/td><td>구성과 지식 관리<\/td><td>12%<\/td><\/tr><tr><td>6<\/td><td>거버넌스, 리스크, 책임 있는 사용<\/td><td>15%<\/td><\/tr><tr><td>7<\/td><td>문제 해결과 최적화<\/td><td>10%<\/td><\/tr><tr><td>합계<\/td><td><\/td><td>100%<\/td><\/tr><\/tbody><\/table>", "<h3>분야별 세부 목표<\/h3>\n<p>아래 각 분야에는 응시자가 수행할 수 있어야 하는 작업을 적었습니다. 시험 문제는 이 목표를 바탕으로 만들어집니다.<\/p>", "<h4>분야 1: 프롬프트 작성과 작업 수행(14%)<\/h4>\n<ul><li>비즈니스 작업과 기술 작업을 위한 효과적인 프롬프트를 작성한다<\/li><li>작업 분해 기법을 적용해 복잡한 요청을 구조화한다<\/li><li>프롬프트를 반복적으로 개선해 출력 품질을 높인다<\/li><li>작업 종류(분석, 조사, 초안 작성, 브레인스토밍)에 따라 프롬프트 작성 전략을 조정한다<\/li><\/ul>", "<h4>분야 2: 출력 평가와 검증(21%)<\/h4>\n<ul><li>Claude가 생성한 출력의 정확성과 완전성을 평가한다<\/li><li>응답에 포함된 할루시네이션, 불일치, 편향을 찾아낸다<\/li><li>팩트체크와 검증 기법을 적용한다<\/li><li>사람의 검토나 추가 검증이 필요한 상황을 판단한다<\/li><li>대상 독자에 맞게 출력을 편집, 조정, 개선, 비교한다<\/li><li>정보를 정리·선별하고 적절한 출력 형식(아티팩트, 인라인, 구조화 데이터)을 선택한다<\/li><\/ul>", "<h4>분야 3: 제품과 모델 선택(12%)<\/h4>\n<ul><li>Claude의 적절한 제품 기능(프로젝트, 리서치, 채팅, 아티팩트)을 선택한다<\/li><li>Claude 모델 종류(Haiku, Sonnet, Opus)를 구별한다<\/li><li>모델 선택을 작업 요구 사항(비용, 속도, 품질)에 맞춘다<\/li><li>컨텍스트 한도와 메모리에 관한 고려 사항(다시 시작할 때, 요약할 때, 유지할 때)을 이해하고 관리한다<\/li><\/ul>", "<h4>분야 4: 워크플로 통합과 솔루션 설계(16%)<\/h4>\n<ul><li>요구 사항과 유스케이스 분석에 Claude를 적용한다<\/li><li>조사, 계획, 프로세스 최적화에 Claude를 활용한다<\/li><li>솔루션의 설계, 개발, 반복 개선을 지원하는 데 Claude를 사용한다<\/li><li>기존 워크플로에 Claude를 통합해 워크플로를 강화하거나 재설계한다<\/li><li>Claude의 가치와 한계를 이해관계자에게 전달한다<\/li><\/ul>", "<h4>분야 5: 구성과 지식 관리(12%)<\/h4>\n<ul><li>지시와 지식 소스로 Claude 프로젝트를 설정한다<\/li><li>업로드한 지식과 커넥터(Google Drive, Gmail 등)를 관리한다<\/li><li>효과적인 시스템 수준 지시를 작성한다<\/li><li>Claude의 설정, 지식 소스, 지시에 정보를 반영하고 유지·업데이트한다<\/li><\/ul>", "<h4>분야 6: 거버넌스, 리스크, 책임 있는 사용(15%)<\/h4>\n<ul><li>적절한 유스케이스와 부적절한 유스케이스를 구별한다<\/li><li>데이터 기밀성, 규제, 개인정보에 관한 고려 사항을 적용한다<\/li><li>조직의 AI 정책과 거버넌스 기준을 따른다<\/li><li>AI 사용의 윤리적 영향을 이해한다<\/li><\/ul>", "<h4>분야 7: 문제 해결과 최적화(10%)<\/h4>\n<ul><li>기대대로 작동하지 않는 프롬프트나 품질이 낮은 출력의 문제를 찾아내고, 진단하고, 해결한다<\/li><li>피드백과 결과를 바탕으로 접근 방식을 조정한다<\/li><li>효율과 효과를 높이기 위해 워크플로를 최적화한다<\/li><\/ul>"]}, {"n": "7", "title": "준비 방법", "secs": ["<p>필수 과정은 없습니다. Anthropic은 특정 자료가 합격을 보장한다고 약속하지 않습니다. 응시자에게는 실무 경험과 아래 자료를 함께 활용하기를 권합니다.<\/p>\n<ul><li>6장의 시험 블루프린트를 공부하고 각 목표에 비추어 자가 평가한다<\/li><li>프로젝트, 아티팩트, 메모리, 스킬, 코드 실행 등 Claude의 기능에 관한 Anthropic 공식 문서와 도움말 문서를 확인한다<\/li><li>프롬프트 구조화, 작업 분해, 출력 개선을 위한 반복을 연습한다<\/li><li>실제 워크플로를 구축한다: 지시와 지식 소스로 프로젝트를 설정하고, 출력의 정확성과 편향을 평가한다<\/li><li>책임 있는 사용의 판단을 연습한다: 데이터 기밀성, 적절한 유스케이스, 에스컬레이션이나 사람의 검토를 요청할 시점<\/li><li>8장의 샘플 문제를 풀며 출제 스타일에 익숙해진다<\/li><\/ul>"]}, {"n": "8", "title": "샘플 문제", "secs": ["<p>이 예제는 시험의 출제 스타일과 인지 수준을 보여 주기 위한 것입니다. 실제 시험 문제 은행에서 뽑은 것이 아닙니다. 정답과 해설은 문제 뒤에 있습니다.<\/p>", "<h3>샘플 1 · 분야 2: 출력 평가와 검증<\/h3>\n<p>한 어소시에이트가 Claude에게 새 규제의 요약을 요청했더니, Claude가 특정 조항 번호를 인용한 확신에 찬 요약을 만들었습니다. 이 요약을 컴플라이언스 팀에 보내기 전에 취해야 할 가장 적절한 행동은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. Claude가 높은 확신을 보이고 있으므로 그대로 보낸다.<\/li><li>B. 공유하기 전에, 인용된 조항을 규제의 공식 조문과 대조해 확인한다.<\/li><li>C. Claude에게 자신의 확신도를 평가하게 하고, 평가가 높으면 보낸다.<\/li><li>D. 더 격식 있게 들리도록 요약을 고쳐 쓴 뒤 보낸다.<\/li><\/ul>", "<h3>샘플 2 · 분야 3: 제품과 모델 선택<\/h3>\n<p>한 어소시에이트는 짧은 고객 답신 초안을 대량으로 생성해야 하며, 깊은 추론보다 속도와 비용이 중요합니다. 이 작업에 가장 적합한 선택지는 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 품질을 극대화하기 위해 모든 답신에 가장 성능이 높고 가장 비싼 모델을 사용한다.<\/li><li>B. 단순하고 양이 많은 작업에 적합한, 더 빠르고 저렴한 모델을 사용한다.<\/li><li>C. 비용을 줄이기 위해 모든 제품 기능을 끈다.<\/li><li>D. 다른 AI 플랫폼으로 바꾼다.<\/li><\/ul>", "<h3>샘플 3 · 분야 6: 거버넌스, 리스크, 책임 있는 사용<\/h3>\n<p>한 프로젝트 매니저가 Claude에게 추세를 분석시키려고 고객 이름과 계좌 번호가 들어 있는 스프레드시트를 업로드하려 합니다. 조직의 정책은 규제 대상 개인 데이터의 공유를 제한합니다. 가장 적절한 행동은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 분석은 사내용이므로 파일을 그대로 업로드한다.<\/li><li>B. 정책에 따라, 업로드하기 전에 개인을 식별하는 정보를 삭제하거나 익명화한다.<\/li><li>C. 파일을 업로드하되, Claude에게 보관하지 말라고 지시한다.<\/li><li>D. 분석 자체를 그만둔다.<\/li><\/ul>", "<h3>정답과 해설<\/h3>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>샘플 1: B.<\/strong> 언어 모델은 인용 번호처럼 구체적으로 보이는 세부 사항을 지어낼 수 있으며, 이것이 할루시네이션입니다. 사실에 관한 주장, 특히 컴플라이언스 담당자에게 보내는 인용을 신뢰할 수 있는 출처와 대조해 검증하는 것이 윤리적 책임으로서 요구되는 절차입니다. 자기 신고식 확신도(A, C)는 정확성의 믿을 만한 지표가 아니며, 형식을 바꾸는 것(D)은 정확성 문제를 해결하지 않습니다.<\/p><\/details>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>샘플 2: B.<\/strong> 모델 선택을 작업 요구 사항에 맞춘다는 것은, 단순하고 양이 많은 작업에는 더 빠르고 저렴한 모델을 배정하고 가장 성능이 높은 모델은 복잡한 추론을 위해 남겨 둔다는 뜻입니다. 항상 최상위 모델을 쓰는 것(A)은 비용과 지연 시간 예산을 낭비합니다. 기능을 끄는 것(C)이나 플랫폼을 바꾸는 것(D)은 이 트레이드오프를 해결하지 않습니다.<\/p><\/details>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>샘플 3: B.<\/strong> 데이터 기밀성과 개인정보 보호 조치를 적용한다는 것은 규제 대상 식별 정보를 사용 전에 삭제하거나 익명화한다는 뜻이며, 이렇게 하면 보호 대상 데이터를 노출하지 않고 분석을 진행할 수 있습니다. 그대로 업로드하는 것(A)은 정책 위반입니다. 모델에게 데이터를 보관하지 말라고 지시하는 것(C)은 정책상 관리 요구 사항을 충족하지 못합니다. 익명화로 분석이 가능하다면 작업을 포기하는 것(D)은 필요하지 않습니다.<\/p><\/details>"]}, {"n": "9", "title": "시험 채점 방식", "secs": ["<p>Claude Certified Associate – Foundations 시험은 준거 참조형(基準準拠型) 평가입니다. 각 응시자는 다른 응시자와의 비교가 아니라 고정된 도달 기준에 따라 측정됩니다. 합격하려면 다른 응시자의 일정 비율보다 좋은 성적을 거두는 것이 아니라, 블루프린트에 정해진 지식과 기술을 입증해야 합니다.<\/p>\n<p><strong>합격 기준.<\/strong> 합격 점수는 공식적인 기준 설정 연구를 통해 정해졌습니다. 이 연구에서는 훈련받은 해당 분야 전문가들이 최소 역량을 갖춘 응시자에게 기대되는 성적 수준을 판정했습니다. 점수는 100~1,000 척도로 보고되며 합격선(컷 스코어)은 720입니다.<\/p>\n<p><strong>결과 통지.<\/strong> 결과는 합격 또는 불합격 상태와 100~1,000의 환산 점수로 보고됩니다. 성적표에는 각 내용 분야에서 정답을 맞힌 문제의 비율도 표시됩니다. 섹션별 백분율은 자신의 성적을 이해하는 데 도움을 주기 위해 제공되며, 합격 여부 판정에는 사용되지 않습니다. 합격 여부는 총 환산 점수로 판정됩니다.<\/p>"]}, {"n": "10", "title": "등록 및 일정 예약", "secs": ["<p>등록과 일정 예약은 Anthropic Partner Academy와 Pearson VUE를 통해 진행합니다.<\/p>\n<ol><li>Anthropic Partner Academy에서 응시할 시험의 자격증 페이지로 이동해 시험 정보를 확인합니다.<\/li><li>등록 전에 시험 가이드를 다운로드하고 「자격증 이용 약관」(Certification Terms and Conditions)과 「자격 시험 정책」(Certification Exam Policy)을 확인합니다.<\/li><li>시험에 등록하고 결제를 완료합니다. 결제 화면에 표시되는 응시료에는 본인의 파트너 등급에 적용되는 할인이 반영되어 있습니다.<\/li><li>확인 안내에 따라 Pearson VUE 계정을 만들고, 로그인해 시험 세션을 예약합니다.<\/li><li>가능한 날짜를 고르고 온라인 감독 또는 Pearson 시험 센터 중 하나를 선택합니다. 시험은 Pearson VUE가 시행합니다.<\/li><li>예약 시각 24시간 전까지는 취소하거나 일정을 변경할 수 있습니다. 24시간 이내에 한 변경은 응시료가 환불되지 않습니다.<\/li><\/ol>"]}, {"n": "11", "title": "시험 정책", "secs": ["", "<h3>신분증<\/h3>\n<p>시험 당일에는 유효 기간 내의 정부 발급 사진 신분증을 제시해야 합니다. 신분증의 이름은 등록할 때의 이름과 정확히 일치해야 합니다. 등록한 이름을 수정해야 하면 시험을 예약하기 전에 certifications-support@anthropic.com으로 연락하십시오.<\/p>", "<h3>응시 편의 제공<\/h3>\n<p>장애나 필요를 증명하는 서류가 있는 응시자는 관련 법률에 따라 합리적인 응시 편의를 받을 수 있습니다. 응시 편의는 시험을 예약하기 전에 신청해 Pearson VUE의 승인을 받아야 합니다. 신청이 승인될 때까지 예약하지 마십시오. 응시 편의는 pearsonvue.com/us/en/test-takers/accommodations에서 신청하십시오.<\/p>", "<h3>재응시 정책<\/h3>\n<p>합격하지 못한 응시자는 정해진 대기 기간 후에 재응시할 수 있습니다. 대기 기간은 불합격 횟수가 늘수록 길어져, 첫 번째 후 14일, 두 번째 후 30일, 세 번째 후 90일입니다. 같은 시험은 연속된 임의의 12개월 기간 안에 4회까지 응시할 수 있습니다. 상한은 시험별로 적용되므로, 한 시험에 불합격했다고 해서 다른 시험에 등록하지 못하게 되지는 않습니다. 응시료는 응시할 때마다 필요합니다.<\/p>", "<h3>미응시 및 지각<\/h3>\n<p>예약한 시험에 나타나지 않거나 허용된 지각 시간을 넘겨 도착한 응시자는 응시료가 환불되지 않으며 다시 등록해야 합니다. 취소 및 일정 변경 기한은 10장에 나와 있습니다.<\/p>"]}, {"n": "12", "title": "시험 당일 진행과 응시 규칙", "secs": ["<p>시험은 표준화되고 보안이 확보된 감독 환경에서 시행됩니다. 온라인으로 응시하든 Pearson VUE 시험 센터에서 응시하든, 자격을 보유한 모든 사람을 위해 자격의 신뢰성을 지키고자 다음 규칙이 적용됩니다.<\/p>\n<p>시험 중에는 다음을 지켜야 합니다.<\/p>\n<ul><li>온라인 응시 시, 세션 내내 감독관과 웹캠의 시야 안에 머문다<\/li><li>작업 공간에 메모, 책, 전화, 보조 모니터, 기타 물품을 두지 않는다<\/li><li>시험 중 다른 누구와도 연락하거나 대화하지 않는다<\/li><li>어떤 형태로든 시험 내용을 기록, 복사, 촬영, 복제하지 않는다<\/li><\/ul>\n<p>반입 금지 물품에는 휴대전화, 스마트워치, 헤드폰, 학습 자료, 모든 녹음·녹화 장치가 포함됩니다. 감독관이 제공하는 메모지처럼 반입이 허용되는 물품이 있다면 Pearson VUE가 지정합니다.<\/p>\n<p><strong>부정행위의 결과.<\/strong> 커닝, 금지된 자료에 접근하려는 시도, 시험 내용 공개가 있으면 결과 무효화, 자격 취소, 향후 시험 응시 금지로 이어질 수 있습니다.<\/p>"]}, {"n": "13", "title": "기밀 유지 및 비밀유지 계약", "secs": ["<p>시험이 시작되기 전에 기밀 유지 및 비밀유지 계약에 동의해야 합니다. 동의하면 문제, 선택지, 시나리오를 포함한 모든 시험 내용이 Anthropic의 기밀 정보이자 독점 재산이며, 그 어떤 부분도 공개, 복제, 배포하지 않겠다는 데 동의한 것이 됩니다. 계약에 동의하지 않으면 시험 세션이 종료되며 환불되지 않습니다.<\/p>"]}, {"n": "14", "title": "자격 유지와 재인증", "secs": ["<p>Claude Certified Associate – Foundations 자격은 수여일로부터 12개월간 유효합니다. 기반 기술이 빠르게 발전하기 때문에, 자격 보유자가 최신 지식을 유지할 수 있도록 자격에 기한을 두었습니다.<\/p>\n<p>기한 안에 갱신하려면 인증 이후의 변경 사항을 확인하고 Anthropic Partner Academy에서 무료 비감독 평가를 완료합니다. 기한 내 갱신에는 비용이 들지 않습니다. 자격이 만료되면 인증 상태를 되찾기 위해 정가 응시료로 전체 시험을 다시 응시해야 합니다.<\/p>\n<p>시험 내용이 크게 바뀐 경우, Anthropic은 자격 보유자에게 재인증을 위해 갱신 평가 대신 전체 시험 재응시를 요구할 수 있습니다.<\/p>\n<p>자격 보유자에게는 12장에 설명된 응시 규칙이 계속 적용됩니다.<\/p>"]}, {"n": "15", "title": "응시자 지원, 이의 제기, 개인정보", "secs": ["", "<h3>지원<\/h3>\n<p>등록한 이름을 수정하려면 certifications-support@anthropic.com으로 연락하십시오. 등록, 예약, 응시 편의, 결과 등 그 밖의 모든 문의는 Pearson VUE 지원(pearsonvue.com/us/en/anthropic.html)으로 하십시오.<\/p>", "<h3>이의 제기 및 불만<\/h3>\n<p>결정에 대해서는 통지를 받은 날로부터 14일 이내에 이의를 제기할 수 있습니다. 시험 결과에 관한 우려는 시험일로부터 14일 이내입니다. 이의 제기는 위 링크의 Pearson VUE 지원으로 제출하십시오. 이의 제기는 프로그램의 이의 제기 정책에 따라 심사됩니다. 기준 설정 결과와 개별 시험 문제의 내용은 이의 제기 대상이 아닙니다.<\/p>", "<h3>개인정보<\/h3>\n<p>등록 및 응시 과정에서 수집되는 개인 데이터는 Anthropic의 개인정보 처리방침, Pearson VUE의 개인정보 처리방침, 관련 데이터 보호 법률에 따라 처리됩니다.<\/p>"]}, {"n": "16", "title": "문서 관리", "secs": ["<table><thead><tr><th>버전<\/th><th>변경 요약<\/th><th>날짜<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>초판 발행<\/td><td>2026년 7월<\/td><\/tr><\/tbody><\/table>"]}]}, "ja": {"title": "Claude Certified Associate – Foundations 試験ガイド — 日本語版（公式）", "note": ["出典：Anthropic公式「Claude Certified Associate – Foundations 試験ガイド」日本語版PDF（バージョン1.0 · 発効：2026年7月 · 試験コード：CCAO-F）。PDFから本文をそのまま転記し、見出しと表のみMarkdownに整形しています。", "原文冒頭：「本ガイドは予告なく変更されることがあります。」"], "ch": [{"n": "1", "title": "この認定資格について", "secs": ["<p>Claude Certified Associate – Foundations認定資格は、最小限のサポートのもとで、Claudeを活用してビジネスや生産性向上のタスクを完了できることを証明するものです。これには、プラットフォームに組み込まれた機能、能力、ツールを使ってワークフローを効率化すること、Claudeでプロセスを改善できる機会を見つけること、品質、効率、コストのバランスが取れたアプローチを選択すること、そして限界を認識し、より複雑または技術的な作業をClaudeのアーキテクトやデベロッパーにエスカレーションすることが含まれます。<\/p>\n<p>この認定資格は、オペレーション、マーケティング、プロジェクト管理、教育、コミュニケーションなどの職務で、Claudeを生産性向上ツールとして使用する実務者を対象としています。本ガイドは、受験の準備をする受験者にとっての正式な参照資料です。資格の目的、対象者、試験の形式とブループリント、採点、ポリシー、受験規則について説明しています。予約の前に全文をお読みください。<\/p>"]}, {"n": "2", "title": "資格の目的と価値", "secs": ["<p>Claude Certified Associate – Foundations認定資格の主な目的は、実際のビジネスワークフローでClaudeを効果的かつ責任をもって使用するために必要な知識とスキルを、独立した立場で評価することです。この資格の取得は、資格保有者が試験ブループリントに定められた知識とスキルを実証したことを示します。<\/p>\n<p>この資格を取得した受験者は、次のことができると示せます。<\/p>\n<ul><li>最小限のサポートのもとで、構造化されたビジネスタスクの完了にClaudeを適用する<\/li><li>プラットフォームに組み込まれた機能とツールを使ってワークフローを効率化する<\/li><li>Claudeを使ってプロセスを改善できる機会を特定する<\/li><li>品質、効率、コストのバランスを取るために適切なアプローチを選択する<\/li><li>限界を認識し、より複雑または技術的な実装をエスカレーションする<\/li><\/ul>"]}, {"n": "3", "title": "対象者", "secs": ["<p>この認定資格は、日々の職務でClaudeを生産性向上ツールとして使用し、Claudeのプロジェクト機能でプロジェクトを構築する実務者を対象としています。対象者は、オペレーション、マーケティング、プロジェクト管理、教育、コミュニケーション、一般的なナレッジワークなどの職能にわたって業務を行い、効率、意思決定、コンテンツ開発を改善するためにAIを活用しています。対象者には、AIを活用した継続的なワークフローを維持、最適化する社内スタッフと、導入、ユースケースの特定、プロセスの再設計を支援する社外コンサルタントの両方が含まれます。<\/p>\n<p>受験者の技術的な専門知識は、一般に限定的から中程度です。受験者は、AIのプロンプトを気軽に使うユーザーと技術的なAI実務者の中間に位置します。その特徴は、ビジネス目標を効果的なAIとのやり取りに落とし込む、適切なツールと機能を選択する、構造化されたプロンプトを作成する、AIが生成したコンテンツを批判的に評価する、さまざまな対象者に合わせて出力を調整する、そして人間の専門知識、検証、エスカレーションが必要な場面を認識する能力にあります。<\/p>\n<p>この認定資格は、APIを利用して開発を行ったりエージェントシステムを設計したりするソフトウェア開発者や、機械学習、ソフトウェアエンジニアリング、高度なAIシステム設計の専門家を対象としたものではありません。受験者には、エンタープライズ規模のAIアーキテクチャや統合を設計することは求められません。その範囲はClaude ArchitectおよびClaude Developerの資格に属し、アソシエイトはより複雑または技術的な作業をそれらの資格保有者にエスカレーションします。<\/p>"]}, {"n": "4", "title": "最低限の能力を備えた受験者のプロファイル", "secs": ["<p>この試験は、合格基準を最低限満たす受験者像（MQC）を基準に設計されています。MQCとは、Claudeを中核的な生産性向上ツールとして使用し、実際のワークフローの中で効果的に適用して、効率、品質、成果を改善できる実務者です。MQCは、プロンプトの構造化、タスクのオーケストレーション、プロジェクト、アーティファクト、ワークフローベースのやり取りといった機能への習熟など、Claudeの能力に関する基礎的かつ実践的な知識を持ち、基本的な質疑応答の使い方にとどまらず、プロセスの再構想、タスクの自動化、プロジェクトの開発へと進んでいます。<\/p>\n<p>MQCは、組織の状況を理解しています。つまり、Claudeがどのように価値を生み出すか、導入のリスクがどこにあるか、利用をビジネスニーズや責任あるAIの実践とどのように整合させるかを把握しています。業務の場でClaudeを日常的に実際に使用した経験があり、プラットフォーム上で一般的な生産性向上タスクやワークフロータスクを独力で完了できます。<\/p>", "<h3>推奨される経験<\/h3>\n<ul><li>業務の場でClaudeを日常的に実際に使用した経験<\/li><li>構造化された問題解決、ワークフロー設計、デジタルツールの活用に関する基礎的な理解<\/li><li>ビジネスアナリスト、プロジェクトマネージャー、オペレーションリード、マーケティング／コミュニケーション／人事／教育の実務者、コンサルタント、ナレッジワーカーなどの職務での経験<\/li><li>ハルシネーション、コンテキストの制約、データの機密性など、AIの限界に関する実践的な理解<\/li><\/ul>\n<p><strong>前提条件：<\/strong>必須の前提条件や必修コースはありません。ソフトウェア開発やAPIの経験も不要です。上記の経験は推奨されるものであり、必須ではありません。資格は試験の成績のみに基づいて授与されます。<\/p>"]}, {"n": "5", "title": "試験の概要", "secs": ["<table><thead><tr><th>項目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>資格<\/td><td>Claude Certified Associate – Foundations<\/td><\/tr><tr><td>試験コード<\/td><td>CCAO-F<\/td><\/tr><tr><td>問題数<\/td><td>60<\/td><\/tr><tr><td>出題形式<\/td><td>択一式および複数選択式の問題。各問題に、選択する解答の数が明記されています<\/td><\/tr><tr><td>制限時間<\/td><td>120分<\/td><\/tr><tr><td>実施方法<\/td><td>監督付き：プログラムのポリシーに従い、オンライン監督付きまたはテストセンター、あるいはその両方<\/td><\/tr><tr><td>合格点<\/td><td>100–1,000のスケールでスケールスコア720<\/td><\/tr><tr><td>受験料<\/td><td>$99 USD<\/td><\/tr><tr><td>有効期間<\/td><td>資格が授与された日から12か月<\/td><\/tr><tr><td>結果の通知<\/td><td>合格／不合格とスケールスコア（100–1,000）。スコアレポートには分野別の正答率も記載されます<\/td><\/tr><\/tbody><\/table>"]}, {"n": "6", "title": "試験内容の概要（ブループリント）", "secs": ["<p>試験ブループリントは、測定対象となる内容分野と、試験における各分野のおおよその配点比率を定めています。配点比率は、職務タスク分析によって決定された、十分な能力での業務遂行に対する各分野の相対的な重要度を反映しています。パーセンテージは、採点対象の問題のうち各分野から出題されるおおよその割合を示します。<\/p>\n<table><thead><tr><th>分野<\/th><th>内容分野<\/th><th>配点比率<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>プロンプト作成とタスク実行<\/td><td>14%<\/td><\/tr><tr><td>2<\/td><td>出力の評価と検証<\/td><td>21%<\/td><\/tr><tr><td>3<\/td><td>製品とモデルの選択<\/td><td>12%<\/td><\/tr><tr><td>4<\/td><td>ワークフロー統合とソリューション設計<\/td><td>16%<\/td><\/tr><tr><td>5<\/td><td>設定とナレッジ管理<\/td><td>12%<\/td><\/tr><tr><td>6<\/td><td>ガバナンス、リスク、責任ある利用<\/td><td>15%<\/td><\/tr><tr><td>7<\/td><td>トラブルシューティングと最適化<\/td><td>10%<\/td><\/tr><tr><td>合計<\/td><td><\/td><td>100%<\/td><\/tr><\/tbody><\/table>", "<h3>分野別の詳細な目標<\/h3>\n<p>以下の各分野には、受験者が実行できることを期待されるタスクを示しています。試験問題はこれらの目標に基づいて作成されます。<\/p>", "<h4>分野1：プロンプト作成とタスク実行（14%）<\/h4>\n<ul><li>ビジネスタスクおよび技術タスクのための効果的なプロンプトを作成する<\/li><li>タスク分解の手法を適用して、複雑な依頼を構造化する<\/li><li>プロンプトを反復的に改良して出力の品質を高める<\/li><li>タスクの種類（分析、調査、下書き、ブレインストーミング）に応じてプロンプト作成の戦略を調整する<\/li><\/ul>", "<h4>分野2：出力の評価と検証（21%）<\/h4>\n<ul><li>Claudeが生成した出力の正確性と網羅性を評価する<\/li><li>応答に含まれるハルシネーション、不整合、バイアスを特定する<\/li><li>ファクトチェックと検証の手法を適用する<\/li><li>人間によるレビューや追加の検証が必要な場面を判断する<\/li><li>想定する対象者に合わせて出力を編集、調整、改良、比較する<\/li><li>情報を整理、選別し、適切な出力形式（アーティファクト、インライン、構造化データ）を選択する<\/li><\/ul>", "<h4>分野3：製品とモデルの選択（12%）<\/h4>\n<ul><li>Claudeの適切な製品機能（プロジェクト、リサーチ、チャット、アーティファクト）を選択する<\/li><li>Claudeのモデルの種類（Haiku、Sonnet、Opus）を区別する<\/li><li>モデルの選択をタスクの要件（コスト、速度、品質）に合わせる<\/li><li>コンテキストの制限とメモリに関する考慮事項（やり直す、要約する、保持するタイミング）を理解し、管理する<\/li><\/ul>", "<h4>分野4：ワークフロー統合とソリューション設計（16%）<\/h4>\n<ul><li>要件とユースケースの分析にClaudeを適用する<\/li><li>調査、計画、プロセスの最適化にClaudeを活用する<\/li><li>ソリューションの設計、開発、反復的な改善を支援するためにClaudeを使用する<\/li><li>既存のワークフローにClaudeを統合し、ワークフローを強化または再設計する<\/li><li>Claudeの価値と限界をステークホルダーに伝える<\/li><\/ul>", "<h4>分野5：設定とナレッジ管理（12%）<\/h4>\n<ul><li>指示とナレッジソースを使ってClaudeのプロジェクトを設定する<\/li><li>アップロードしたナレッジとコネクタ（Google Drive、Gmailなど）を管理する<\/li><li>効果的なシステムレベルの指示を作成する<\/li><li>Claudeの設定、ナレッジソース、指示に情報を反映し、維持、更新する<\/li><\/ul>", "<h4>分野6：ガバナンス、リスク、責任ある利用（15%）<\/h4>\n<ul><li>適切なユースケースと不適切なユースケースを特定する<\/li><li>データの機密性、規制、プライバシーに関する考慮事項を適用する<\/li><li>組織のAIポリシーとガバナンス基準に従う<\/li><li>AI利用の倫理的な影響を理解する<\/li><\/ul>", "<h4>分野7：トラブルシューティングと最適化（10%）<\/h4>\n<ul><li>期待どおりに機能しないプロンプトや質の低い出力の問題を特定、診断、解決する<\/li><li>フィードバックと結果に基づいてアプローチを調整する<\/li><li>効率と効果を高めるためにワークフローを最適化する<\/li><\/ul>"]}, {"n": "7", "title": "準備の方法", "secs": ["<p>必修のコースはありません。Anthropicは、特定のリソースが合格を保証するものであるとは約束しません。受験者には、実践的な経験と以下のリソースを組み合わせることをお勧めします。<\/p>\n<ul><li>セクション6の試験ブループリントを学習し、各目標に照らして自己評価する<\/li><li>プロジェクト、アーティファクト、メモリ、スキル、コード実行などのClaudeの機能について、Anthropicの公式ドキュメントとヘルプ記事を確認する<\/li><li>プロンプトの構造化、タスクの分解、出力を改善するための反復を練習する<\/li><li>実際のワークフローを構築する：指示とナレッジソースを使ってプロジェクトを設定し、出力の正確性とバイアスを評価する<\/li><li>責任ある利用の判断を練習する：データの機密性、適切なユースケース、エスカレーションや人間によるレビューを求めるタイミング<\/li><li>セクション8のサンプル問題を解き、出題スタイルに慣れる<\/li><\/ul>"]}, {"n": "8", "title": "サンプル問題", "secs": ["<p>これらの例題は、試験の出題スタイルと認知レベルを示すものです。実際の試験の問題バンクから抜粋したものではありません。正解と解説は問題の後に記載しています。<\/p>", "<h3>サンプル1 · 分野2：出力の評価と検証<\/h3>\n<p>あるアソシエイトがClaudeに新しい規制の要約を依頼したところ、Claudeは特定の項番号を引用した、確信に満ちた要約を作成しました。この要約をコンプライアンスチームに送る前に取るべき最も適切な行動はどれですか。<\/p>\n<ul class=\"opts\"><li>A. Claudeが高い確信を示しているので、そのまま送る。<\/li><li>B. 共有する前に、引用された項を規制の公式な条文と照合して確認する。<\/li><li>C. Claudeに自身の確信度を評価させ、評価が高ければ送る。<\/li><li>D. よりフォーマルに聞こえるように要約を書き換えてから送る。<\/li><\/ul>", "<h3>サンプル2 · 分野3：製品とモデルの選択<\/h3>\n<p>あるアソシエイトは、短い顧客返信の下書きを大量に生成する必要があり、深い推論よりも速度とコストが重要です。このタスクに最も適した選択肢はどれですか。<\/p>\n<ul class=\"opts\"><li>A. 品質を最大化するために、すべての返信に最も高性能で最もコストの高いモデルを使用する。<\/li><li>B. 単純で大量のタスクに適した、より高速で低コストのモデルを使用する。<\/li><li>C. コストを削減するために、すべての製品機能を無効にする。<\/li><li>D. 別のAIプラットフォームに切り替える。<\/li><\/ul>", "<h3>サンプル3 · 分野6：ガバナンス、リスク、責任ある利用<\/h3>\n<p>あるプロジェクトマネージャーが、Claudeに傾向を分析させるために、顧客名と口座番号を含むスプレッドシートをアップロードしたいと考えています。組織のポリシーでは、規制対象の個人データの共有が制限されています。最も適切な行動はどれですか。<\/p>\n<ul class=\"opts\"><li>A. 分析は社内向けなので、ファイルをそのままアップロードする。<\/li><li>B. ポリシーに従い、アップロードする前に個人を識別する情報を削除または匿名化する。<\/li><li>C. ファイルをアップロードするが、Claudeに保持しないよう指示する。<\/li><li>D. 分析そのものをやめる。<\/li><\/ul>", "<h3>正解と解説<\/h3>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>サンプル1：B。<\/strong> 言語モデルは、引用番号のような具体的に見える詳細を捏造することがあり、これがハルシネーションです。事実に関する主張、特にコンプライアンス担当者に向けた引用を、信頼できる情報源と照合して検証することが、倫理的責任として求められる手順です。自己申告の確信度（A、C）は正確性の信頼できる指標ではなく、体裁の変更（D）は正しさの問題に対処しません。<\/p><\/details>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>サンプル2：B。<\/strong> モデルの選択をタスクの要件に合わせるとは、単純で大量の作業にはより高速で低コストのモデルを割り当て、最も高性能なモデルは複雑な推論のために取っておくことを意味します。常に最上位のモデルを使用すること（A）は、コストとレイテンシの予算を無駄にします。機能を無効にすること（C）やプラットフォームを切り替えること（D）は、このトレードオフに対処しません。<\/p><\/details>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>サンプル3：B。<\/strong> データの機密性とプライバシーの保護措置を適用するとは、規制対象の識別情報を使用前に削除または匿名化することを意味し、これにより保護対象のデータをさらすことなく分析を進められます。そのままアップロードすること（A）はポリシーに違反します。モデルにデータを保持しないよう指示すること（C）は、ポリシー上の管理要件を満たしません。匿名化によって分析が可能になるのであれば、タスクを断念すること（D）は不要です。<\/p><\/details>"]}, {"n": "9", "title": "試験の採点方法", "secs": ["<p>Claude Certified Associate – Foundations試験は、基準準拠型の評価です。各受験者は、他の受験者との比較ではなく、固定された到達基準に照らして測定されます。合格するには、他の受験者の一定割合を上回る成績を収めるのではなく、ブループリントに定められた知識とスキルを実証します。<\/p>\n<p><strong>合格基準。<\/strong>合格点は、正式な基準設定調査を通じて定められました。この調査では、トレーニングを受けた対象領域の専門家が、最低限の能力を備えた受験者に期待される成績の水準を判定しました。スコアは100–1,000のスケールで報告され、カットスコアは720です。<\/p>\n<p><strong>結果の通知。<\/strong>結果は、合格または不合格のステータスと、100から1,000までのスケールスコアで報告されます。スコアレポートには、各内容分野であなたが正解した問題の割合も記載されます。セクション別のパーセンテージは、ご自身の成績を理解するために提供されるものであり、合否の判定には使用されません。合否は総合のスケールスコアに基づいて判定されます。<\/p>"]}, {"n": "10", "title": "申し込みと予約", "secs": ["<p>申し込みと予約は、Anthropic Partner AcademyとPearson VUEを通じて行います。<\/p>\n<ol><li>Anthropic Partner Academyで受験する試験の認定資格ページにアクセスし、試験の詳細を確認します。<\/li><li>申し込む前に、試験ガイドをダウンロードし、「認定資格利用規約」（Certification Terms and Conditions）と「認定試験ポリシー」（Certification Exam Policy）を確認します。<\/li><li>試験に申し込み、支払い手続きを完了します。支払い手続きの画面に表示される受験料には、ご自身のパートナーティアに適用される割引が反映されています。<\/li><li>確認の案内に従ってPearson VUEアカウントを作成し、サインインして試験セッションを予約します。<\/li><li>空いている日程を選び、オンライン監督付きまたはPearsonのテストセンターのいずれかを選択します。試験はPearson VUEによって実施されます。<\/li><li>予約時刻の24時間前までは、キャンセルまたは予約変更ができます。24時間以内に行った変更では、受験料は返金されません。<\/li><\/ol>"]}, {"n": "11", "title": "試験ポリシー", "secs": ["", "<h3>本人確認書類<\/h3>\n<p>試験当日は、有効期限内の、政府発行の有効な写真付き本人確認書類を提示する必要があります。本人確認書類の氏名は、申し込み時の氏名と完全に一致していなければなりません。申し込み時の氏名を訂正する必要がある場合は、試験を予約する前にcertifications-support@anthropic.comまでご連絡ください。<\/p>", "<h3>受験上の配慮<\/h3>\n<p>障害またはニーズを証明する書類のある受験者は、適用される法律に従い、合理的な受験上の配慮を受けられます。受験上の配慮は、試験を予約する前に申請し、Pearson VUEの承認を受ける必要があります。申請が承認されるまで、予約をしないでください。受験上の配慮はpearsonvue.com/us/en/test-takers/accommodationsで申請してください。<\/p>", "<h3>再受験ポリシー<\/h3>\n<p>合格しなかった受験者は、所定の待機期間の後に再受験できます。待機期間は不合格の回数が増えるごとに長くなり、初回の後は14日、2回目の後は30日、3回目の後は90日です。同じ試験は、任意の連続する12か月の期間内に4回まで受験できます。上限は試験ごとに適用されるため、ある試験に合格しなかったことで、別の試験に申し込めなくなることはありません。受験料は受験のたびに必要です。<\/p>", "<h3>無断欠席と遅刻<\/h3>\n<p>予約した試験に現れなかった受験者、または許容される遅刻の時間枠を過ぎて到着した受験者は、受験料が返金されず、あらためて申し込む必要があります。キャンセルと予約変更の期限はセクション10に記載されています。<\/p>"]}, {"n": "12", "title": "試験当日の流れと受験規則", "secs": ["<p>試験は、標準化され、安全が確保された、監督付きの環境で実施されます。オンラインで受験する場合も、Pearson VUEのテストセンターで受験する場合も、資格を保有するすべての人のために資格の信頼性を守る目的で、以下の規則が適用されます。<\/p>\n<p>試験中は、次のことを守る必要があります。<\/p>\n<ul><li>オンラインで受験する場合、セッションの間ずっと試験監督者とウェブカメラの視界内にとどまる<\/li><li>作業スペースにメモ、書籍、電話、サブモニター、その他の物品を置かない<\/li><li>試験中、他のいかなる人とも連絡や会話をしない<\/li><li>試験内容を、いかなる形式でも記録、複写、撮影、複製しない<\/li><\/ul>\n<p>持ち込みが禁止されている物品には、携帯電話、スマートウォッチ、ヘッドホン、学習教材、あらゆる録音・録画機器が含まれます。試験監督者が提供するメモ用紙など、持ち込みが許可される物品がある場合は、Pearson VUEが指定します。<\/p>\n<p><strong>不正行為の結果。<\/strong>カンニング、禁止されているリソースへのアクセスの試み、試験内容の開示があった場合、結果の無効化、資格の取り消し、今後の試験の受験禁止となることがあります。<\/p>"]}, {"n": "13", "title": "機密保持と秘密保持契約", "secs": ["<p>試験が始まる前に、機密保持および秘密保持契約に同意する必要があります。同意することにより、問題、解答の選択肢、シナリオを含むすべての試験内容がAnthropicの機密情報であり専有財産であること、およびそのいかなる部分も開示、複製、配布しないことに同意したことになります。契約に同意しない場合、試験セッションは終了し、返金は行われません。<\/p>"]}, {"n": "14", "title": "資格の維持と再認定", "secs": ["<p>Claude Certified Associate – Foundations資格は、授与された日から12か月間有効です。基盤となる技術は急速に進化するため、資格保有者が最新の知識を維持できるよう、資格には期限が設けられています。<\/p>\n<p>期限内に更新するには、認定を受けてからの変更点を確認し、Anthropic Partner Academyで無料の監督なしのアセスメントを完了します。期限内の更新に費用はかかりません。資格が失効した場合、認定されたステータスを取り戻すには、正規の受験料で試験全体を再受験する必要があります。<\/p>\n<p>試験内容が大幅に変更された場合、Anthropicは資格保有者に対し、再認定のために、更新アセスメントの完了ではなく試験全体の再受験を求めることがあります。<\/p>\n<p>資格保有者には、セクション12に記載された受験規則が引き続き適用されます。<\/p>"]}, {"n": "15", "title": "受験者サポート、異議申し立て、プライバシー", "secs": ["", "<h3>サポート<\/h3>\n<p>申し込み時の氏名を訂正するには、certifications-support@anthropic.comまでご連絡ください。申し込み、予約、受験上の配慮、結果など、その他すべての質問については、Pearson VUEのサポート（pearsonvue.com/us/en/anthropic.html）にお問い合わせください。<\/p>", "<h3>異議申し立てと苦情<\/h3>\n<p>決定に対しては、その通知を受けた日から14日以内に異議申し立てができます。試験結果に関する懸念の場合は、試験日から14日以内です。異議申し立ては、上記のリンクからPearson VUEのサポートに提出してください。異議申し立ては、プログラムの異議申し立てポリシーに基づいて審査されます。基準設定の結果および個々の試験問題の内容は、異議申し立ての対象になりません。<\/p>", "<h3>プライバシー<\/h3>\n<p>申し込みおよび受験の際に収集される個人データは、Anthropicのプライバシーポリシー、Pearson VUEのプライバシーポリシー、および適用されるデータ保護法に従って取り扱われます。<\/p>"]}, {"n": "16", "title": "文書管理", "secs": ["<table><thead><tr><th>バージョン<\/th><th>変更の概要<\/th><th>日付<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>初版発行<\/td><td>2026年7月<\/td><\/tr><\/tbody><\/table>"]}]}};
const out=document.getElementById('out'), nav=document.getElementById('chaps'), noteEl=document.getElementById('note');
const N=DATA.ko.ch.length;
const NOTES={
 ko:['<p><strong>한국어판</strong>: 일본어 공식 가이드(v1.0, 2026년 7월 발효) 전문을 요약 없이 옮긴 비공식 번역입니다. 해석이 갈리면 일본어 공식판이 기준입니다.</p>'],
 ja:['<p><strong>日本語版</strong>：Anthropic公式の日本語版試験ガイドPDF（バージョン1.0）の本文をそのまま転記しています。見出しと表のみ整形しました。</p>'],
 dual:['<p><strong>한·日 대조</strong>: 왼쪽은 한국어 번역, 오른쪽은 일본어 공식판입니다. 같은 항목(분야·샘플 문제)끼리 줄을 맞췄습니다.</p>']
};
let view='ko', openAll=false;
try{const s=localStorage.getItem('ccao-f-guide-view'); if(s&&NOTES[s]) view=s;}catch(e){}
function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');}
function prep(h){h=wrapTables(h); return openAll?h.replace(/<details class="ans">/g,'<details class="ans" open>'):h;}
function render(){
  document.body.classList.toggle('dual',view==='dual');
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  noteEl.innerHTML=NOTES[view].join('');
  document.getElementById('openAll').textContent=openAll?(view==='ja'?'正解をすべて閉じる':view==='en'?'Hide all answers':'샘플 문제 정답 모두 접기'):(view==='ja'?'正解をすべて開く':view==='en'?'Show all answers':'샘플 문제 정답 모두 펼치기');
  let h='';
  for(let i=0;i<N;i++){
    const ko=DATA.ko.ch[i], ja=DATA.ja.ch[i], n=ko.n;
    h+=`<section class="chap" id="c${n}">`;
    if(view==='dual'){
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1>${ko.title}<span class="sub ja" lang="ja">${ja.title}</span></h1></div>`;
      h+=`<div class="colhead"><span>한국어</span><span>日本語</span></div>`;
      ko.secs.forEach((s,j)=>{h+=`<div class="pair"><div class="sec">${prep(s)}</div><div class="sec ja" lang="ja">${prep(ja.secs[j])}</div></div>`;});
    }else{
      const L=view, c=DATA[L].ch[i];
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1 class="${L}" lang="${L}">${c.title}</h1></div>`;
      h+=`<div class="sec ${L}" lang="${L}">${c.secs.map(prep).join('')}</div>`;
    }
    h+='</section>';
  }
  out.innerHTML=h;
  const L=view==='dual'?'ko':view;
  nav.innerHTML=DATA[L].ch.map(c=>`<button data-c="${c.n}" title="${c.title}">${c.n}</button>`).join('');
  spy();
}
document.querySelector('.langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const cur=current();
  view=b.dataset.v; try{localStorage.setItem('ccao-f-guide-view',view);}catch(e){}
  render(); jump(cur,false);
});
document.getElementById('openAll').addEventListener('click',()=>{const cur=current(); openAll=!openAll; render(); jump(cur,false);});
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) jump(b.dataset.c,true);});
function off(){return document.querySelector('header.top').getBoundingClientRect().bottom;}
function jump(n,smooth){
  const el=document.getElementById('c'+n); if(!el) return;
  window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off()-8,behavior:smooth?'smooth':'auto'});
}
function current(){
  const o=off()+20; let c=DATA.ko.ch[0].n;
  DATA.ko.ch.forEach(x=>{const el=document.getElementById('c'+x.n); if(el&&el.getBoundingClientRect().top<=o) c=x.n;}); return c;
}
function spy(){const c=current(); nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));}
addEventListener('scroll',spy,{passive:true});
render();
</script>

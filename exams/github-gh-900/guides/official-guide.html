<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>GH-900 공식 시험 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: sticky bar (language tabs + chapter chips 1–18), one reading column; "대조" view = section-aligned two-column grid */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b1f2a; --muted:#5b6475; --line:#dde1e8;
  --accent:#2f4bb8; --accent-soft:#e7ebfa; --code-bg:#eef0f5; --quote:#f0f3fb; --ok:#1d7a52; --ok-soft:#e5f4ec;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-display:"Fraunces",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ko);font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.dual .wrap{max-width:1260px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto;letter-spacing:.01em}
.brand small{font-family:var(--f-ko);color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:4px 10px;font-size:13px;line-height:1.5}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chaps button{font-family:var(--f-mono);font-size:12px;padding:1px 0;min-width:30px;text-align:center}
.chaps button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding-block:24px 80px}
.note{font-size:13px;color:var(--muted);line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:36px;background:var(--surface)}
.note p{margin:0}
.chap{margin-bottom:56px}
.chap-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:8px}
.chap-no{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.2em}
.chap-head h1{font-size:22px;line-height:1.4;margin:0;text-wrap:balance}
.chap-head .sub{font-size:13px;color:var(--muted);display:block;font-weight:400}
.sec h3{font-size:18px;margin:34px 0 8px;text-wrap:balance}
.sec a{color:var(--accent);text-underline-offset:2px}
.sec h4{font-size:15.5px;margin:28px 0 6px;color:var(--accent);line-height:1.55;text-wrap:balance}
.sec p{margin:0 0 14px}
.sec ul,.sec ol{margin:0 0 14px;padding-left:1.4em}
.sec li{margin:3px 0}
.sec ul.opts{list-style:none;padding-left:0}
.sec ul.opts li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;background:var(--surface)}
.sec blockquote{margin:16px 0;padding:10px 16px;background:var(--quote);border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.sec blockquote p:last-child{margin-bottom:0}
details.ans{margin:4px 0 26px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.ans summary{cursor:pointer;padding:7px 12px;font-size:13.5px;color:var(--ok);font-weight:600}
details.ans[open]{background:var(--ok-soft);border-color:var(--ok)}
details.ans p{margin:0;padding:0 14px 12px}
.sec code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:6px 0 18px}
.sec table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.sec th,.sec td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sec th{background:var(--code-bg)}
.ja{font-family:var(--f-ja)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0}
.pair>div{min-width:0}
.colhead{display:grid;grid-template-columns:1fr 1fr;gap:36px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:820px){.pair{grid-template-columns:1fr}.pair>div.ja{border-top:1px dotted var(--line);padding-top:4px}.colhead{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <span class="brand">GH-900 시험 가이드<small>Microsoft Learn 공식 · 전문</small></span>
    <div class="row langs" role="group" aria-label="언어">
      <button id="v-ko" data-v="ko">한국어</button>
      <button id="v-ja" data-v="ja">日本語</button>
      <button id="v-dual" data-v="dual">한·日 대조</button>
      <button id="v-en" data-v="en">English</button>
    </div>
  </div>
  <div class="row chaps" role="group" aria-label="장 이동" id="chaps"></div>
</div></header>
<main><div class="wrap">
  <div class="note" id="note"></div>
  <div id="out"></div>
</div></main>

<script>
const DATA={"ko": {"title": "시험 GH-900에 대한 연구 가이드: GitHub Foundations", "note": ["Source: https://learn.microsoft.com/ko-kr/credentials/certifications/resources/study-guides/gh-900 (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "이 문서의 용도", "secs": ["<p>이 연구 가이드는 시험에서 무엇을 기대해야 하는지 이해하는 데 도움이 되며 시험에서 다룰 수 있는 항목의 요약과 추가 리소스에 대한 링크를 포함합니다. 이 문서의 정보 및 자료는 시험을 준비할 때 연구에 집중하는 데 도움이 됩니다.<\/p>\n<table><thead><tr><th>유용한 링크<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://learn.microsoft.com/ko-kr/credentials/certifications/github-foundations/?practice-assessment-type=certification\" target=\"_blank\" rel=\"noopener noreferrer\">인증<\/a> 획득하는 방법<\/td><td>일부 인증은 하나의 시험만 통과해야 하는 반면, 다른 인증은 여러 시험을 통과해야 합니다.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ko-kr/credentials/certifications/renew-your-microsoft-certification\" target=\"_blank\" rel=\"noopener noreferrer\">인증 갱신<\/a><\/td><td>Microsoft 동료, 전문가 및 전문 인증은 매년 만료됩니다. Microsoft Learn에서 무료 온라인 평가를 통과하면 인증을 갱신할 수 있습니다.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ko-kr/users\" target=\"_blank\" rel=\"noopener noreferrer\">귀하의 Microsoft Learn 프로필<\/a><\/td><td>인증 프로필을 Microsoft Learn에 연결하면 시험을 예약 및 갱신하고 인증서를 공유하고 인쇄할 수 있습니다.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ko-kr/credentials/certifications/exam-scoring-reports\" target=\"_blank\" rel=\"noopener noreferrer\">시험 점수 매기기 및 점수 매기기 보고서<\/a><\/td><td>통과하려면 700점 이상의 점수가 필요합니다.<\/td><\/tr><tr><td><a href=\"https://aka.ms/examdemo\" target=\"_blank\" rel=\"noopener noreferrer\">시험 샌드박스<\/a><\/td><td>시험 샌드박스를 방문하여 시험 환경을 탐색할 수 있습니다.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ko-kr/credentials/certifications/request-accommodations\" target=\"_blank\" rel=\"noopener noreferrer\">숙박 시설 요청<\/a><\/td><td>보조 장치를 사용하거나, 추가 시간이 필요하거나, 시험 경험의 일부를 수정해야 하는 경우 숙박 시설을 요청할 수 있습니다.<\/td><\/tr><\/tbody><\/table>"]}, {"n": "2", "title": "시험 정보", "secs": ["<p>일부 시험은 다른 언어로 지역화되며 영어 버전이 업데이트된 후 약 8주 후에 업데이트됩니다. Microsoft는 앞에서 설명한 대로 현지화된 버전을 업데이트하기 위해 모든 노력을 기울이고 있지만 시험의 현지화된 버전이 이 일정에 따라 업데이트되지 않는 경우가 있을 수 있습니다. 사용 가능한 다른 언어는 <strong>시험 세부 정보<\/strong> 웹 페이지의 <strong>시험 일정<\/strong> 섹션에 나열됩니다. 원하는 언어로 시험을 사용할 수 없는 경우 시험을 완료하기 위해 30분 더 요청할 수 있습니다.<\/p>", "<h3>비고<\/h3>\n<p>측정된 각 기술을 따르는 각주는 해당 기술을 평가하는 방법을 설명하기 위한 것입니다. 관련 항목은 시험에서 다룰 수 있습니다.<\/p>", "<h3>비고<\/h3>\n<p>일반 공급(GA) 상태인 기능을 다루는 질문이 대부분입니다. 이러한 기능이 일반적으로 사용되는 경우 시험에서 미리 보기 기능에 대한 질문이 포함될 수 있습니다.<\/p>"]}, {"n": "3", "title": "청중 프로필", "secs": ["<p>이 시험 응시자는 GitHub 및 핵심 기능에 대한 기본적인 지식을 갖추어야 합니다. 여기에는 Git, 리포지토리, 공동 작업 도구, 프로젝트 관리 및 최신 개발 사례 이해가 포함됩니다. 이 시험은 비 개발자, 개발자 및 GitHub 기본 사항으로 숙련도를 개선하려는 모든 GitHub 사용자를 위해 설계되었습니다.<\/p>"]}, {"n": "4", "title": "2026년 1월 현재 기술 한눈에 보기", "secs": ["<ul><li>Git 및 GitHub 기본 사항 이해(25-30%)<\/li><li>GitHub 리포지토리 작업(10~15개%)<\/li><li>GitHub를 사용하여 공동 작업(10-15%)<\/li><li>최신 개발 방법 적용(10~15%)<\/li><li>GitHub를 사용하여 프로젝트 관리(5-10%)<\/li><li>개인 정보 보호, 보안 및 관리 이해(10-15%)<\/li><li>GitHub 커뮤니티 살펴보기(5-10%)<\/li><\/ul>"]}, {"n": "5", "title": "Git 및 GitHub 기본 사항 이해(25-30%)", "secs": ["", "<h3>버전 제어 기본 사항<\/h3>\n<ul><li>버전 제어의 목적 및 이점 설명<\/li><li>Git과 GitHub의 차이점 설명<\/li><li>리포지토리, 커밋 및 분기와 같은 주요 Git 개념 식별<\/li><\/ul>", "<h3>GitHub와 함께 작업하기<\/h3>\n<ul><li>GitHub 계정, 조직 및 엔터프라이즈 옵션 설명<\/li><li>공동 작업을 위한 GitHub Flow 설명<\/li><li>문제 및 끌어오기 요청에서 명확한 통신을 위해 Markdown의 사용 식별<\/li><li>GitHub Desktop 및 GitHub Mobile을 사용하는 경우 인식<\/li><\/ul>"]}, {"n": "6", "title": "GitHub 리포지토리 작업(10~15개%)", "secs": ["", "<h3>리포지토리 관리<\/h3>\n<ul><li>GitHub 리포지토리의 구조 및 키 파일 설명(추가 정보, 라이선스, 기여, CODEOWNERS, SECURITY)<\/li><li>템플릿 및 분기를 사용하여 리포지토리를 만들고 구성하고 유지 관리하는 방법을 식별합니다.<\/li><li>리포지토리 내에서 파일을 추가하고 관리하는 방법 설명<\/li><li>향상된 가시성을 위해 리포지토리 인사이트, 별, 기능 미리 보기, 리포지토리 메트릭 대시보드 및 종속성 인사이트 설명<\/li><li>리포지토리 유지 관리 및 공동 작업에 대한 모범 사례 인식<\/li><\/ul>"]}, {"n": "7", "title": "GitHub를 사용하여 공동 작업(10-15%)", "secs": ["", "<h3>공동 작업 도구<\/h3>\n<ul><li>협업을 위해 문제, 끌어오기 요청 및 토론을 사용하는 방법 설명<\/li><li>끌어오기 요청을 문제에 연결하고 템플릿, 필터 및 할당을 관리하는 방법을 설명합니다.<\/li><li>알림의 목적 및 워크플로 관리를 위해 알림 구성 방법 식별<\/li><li>Gists, Wikis 및 GitHub Pages를 사용하여 정보를 문서화하고 공유하는 방법을 설명합니다.<\/li><\/ul>"]}, {"n": "8", "title": "최신 개발 방법 적용(10~15%)", "secs": ["", "<h3>자동화 및 AI 도구<\/h3>\n<ul><li>GitHub Actions의 목적 및 기능 설명<\/li><li>GitHub Copilot가 코필로트 에이전트, 에이전트 모드 및 다중 모델 지원을 비롯한 AI 기반 코드 제안을 지원하는 방법 식별<\/li><li>개인, 비즈니스 및 엔터프라이즈용 GitHub Copilot의 차이점 설명<\/li><li>GitHub Codespaces 및 개발 컨테이너 설정, 사용자 지정 및 사용 방법 설명<\/li><li>github.dev 편집기를 사용하는 시기와 Codespaces와 어떻게 다른지 설명합니다.<\/li><\/ul>"]}, {"n": "9", "title": "GitHub를 사용하여 프로젝트 관리(5-10%)", "secs": ["", "<h3>프로젝트 추적 및 조직<\/h3>\n<ul><li>GitHub 프로젝트 및 레이아웃 옵션 설명<\/li><li>프로젝트, 레이블, 중요 시점 및 워크플로를 구성하는 방법 설명<\/li><li>저장된 회신 및 담당자를 사용하여 통신을 간소화하는 방법 식별<\/li><li>프로젝트 인사이트를 사용하여 진행률 및 생산성을 추적하는 방법 설명<\/li><\/ul>"]}, {"n": "10", "title": "개인 정보 보호, 보안 및 관리 이해(10-15%)", "secs": ["", "<h3>보안 및 액세스 관리<\/h3>\n<ul><li>2FA(2단계 인증) 및 암호로 계정을 보호하는 방법 설명<\/li><li>리포지토리 및 조직에 대한 액세스 권한 및 역할 식별<\/li><li>EMU(Enterprise Managed Users) 및 조직 전체의 Copilot 정책 관리의 목적 설명<\/li><li>리포지토리 개인 정보 옵션, 표시 유형 설정 및 분기 보호 규칙 설명<\/li><li>조직 설정, 팀 및 역할을 관리하는 방법 인식<\/li><\/ul>"]}, {"n": "11", "title": "GitHub 커뮤니티 살펴보기(5-10%)", "secs": ["", "<h3>오픈 소스 참여<\/h3>\n<ul><li>오픈 소스 및 GitHub 스폰서의 이점 설명<\/li><li>GitHub가 오픈 소스 프로젝트를 지원하고 발전시키는 방법을 설명합니다.<\/li><li>사용자 및 조직을 따라 활동에 대한 정보를 유지하는 방법을 식별합니다.<\/li><li>GitHub Marketplace 및 해당 용도에 대해 설명합니다.<\/li><li>InnerSource가 조직 내에서 오픈 소스 원칙을 적용하는 방법을 설명합니다.<\/li><li>포크, 템플릿 및 검색 가능한 리포지토리를 사용하여 협업을 촉진하는 시기를 인식합니다.<\/li><\/ul>"]}, {"n": "12", "title": "학습 리소스", "secs": ["", "<h3>Recommendations<\/h3>\n<p>GitHub Foundations 시험을 통과하여 성공할 가능성을 높이려면 GitHub에서 기본적인 경험, 노출 및 숙련도의 견고한 기반부터 시작해야 합니다. 이 시험의 권장 학습 경로는 학습 콘텐츠에 대한 심층적인 연구와 인증 시험에 대한 지식과 준비 상태를 미세 조정할 수 있도록 만들어진 실습 연습 및 준비 평가 질문을 제공합니다.<\/p>\n<p>GitHub Foundations 시험을 위해 각 도메인의 학습 목표를 다루는 권장 콘텐츠로 GitHub와 공동으로 만든 리소스는 다음과 같습니다.<\/p>\n<table><thead><tr><th>학습 리소스<\/th><th>학습 및 설명서 링크<\/th><\/tr><\/thead><tbody><tr><td>교육 받기<\/td><td>자가 진행 학습 경로 및 모듈 중에서 선택하거나 Microsoft Learn – <a href=\"https://learn.microsoft.com/ko-kr/training/paths/github-foundations/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Foundations 1부 및 GitHub Foundations<\/a><a href=\"https://learn.microsoft.com/ko-kr/training/paths/github-foundations-2/\" target=\"_blank\" rel=\"noopener noreferrer\">2부<\/a>에서 강사 주도 과정을 수강합니다.<\/td><\/tr><tr><td>Microsoft Learn<\/td><td><a href=\"https://learn.microsoft.com/ko-kr/collections/o1njfe825p602p\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Foundations 학습 경로<\/a><\/td><\/tr><tr><td>설명서 찾기<\/td><td><a href=\"https://docs.github.com/get-started\" target=\"_blank\" rel=\"noopener noreferrer\">Git 및 GitHub 소개<\/a> <a href=\"https://docs.github.com/repositories\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 리포지토리 작업<\/a> 공동 작업 기능: <a href=\"https://docs.github.com/issues\" target=\"_blank\" rel=\"noopener noreferrer\">문제<\/a>, <a href=\"https://docs.github.com/pull-requests\" target=\"_blank\" rel=\"noopener noreferrer\">끌어오기 요청<\/a>, <a href=\"https://docs.github.com/discussions\" target=\"_blank\" rel=\"noopener noreferrer\">토론<\/a>, <a href=\"https://docs.github.com/account-and-profile/managing-subscriptions-and-notifications-on-github\" target=\"_blank\" rel=\"noopener noreferrer\">알림<\/a> 및 <a href=\"https://docs.github.com/get-started/writing-on-github/editing-and-sharing-content-with-gists\" target=\"_blank\" rel=\"noopener noreferrer\">Gists<\/a>, <a href=\"https://docs.github.com/communities/documenting-your-project-with-wikis\" target=\"_blank\" rel=\"noopener noreferrer\">Wikis<\/a> 및 <a href=\"https://docs.github.com/pages\" target=\"_blank\" rel=\"noopener noreferrer\">페이지<\/a> 최신 개발: <a href=\"https://docs.github.com/actions\" target=\"_blank\" rel=\"noopener noreferrer\">액션<\/a>, <a href=\"https://docs.github.com/copilot\" target=\"_blank\" rel=\"noopener noreferrer\">코파일럿<\/a> 및 <a href=\"https://docs.github.com/codespaces\" target=\"_blank\" rel=\"noopener noreferrer\">코드스페이스<\/a> <a href=\"https://docs.github.com/issues/planning-and-tracking-with-projects\" target=\"_blank\" rel=\"noopener noreferrer\">프로젝트 관리<\/a> <a href=\"https://docs.github.com/site-policy/privacy-policies\" target=\"_blank\" rel=\"noopener noreferrer\">개인 정보<\/a>, <a href=\"https://docs.github.com/get-started/learning-about-github/about-github-advanced-security\" target=\"_blank\" rel=\"noopener noreferrer\">보안<\/a> 및 <a href=\"https://docs.github.com/authentication\" target=\"_blank\" rel=\"noopener noreferrer\">관리<\/a> <a href=\"https://docs.github.com/get-started/exploring-projects-on-github\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 커뮤니티의 이점<\/a><\/td><\/tr><tr><td>질문하기<\/td><td><a href=\"https://github.community/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 커뮤니티 토론<\/a><\/td><\/tr><tr><td>커뮤니티 지원 받기<\/td><td><a href=\"https://github.blog/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 블로그<\/a><\/td><\/tr><tr><td>GitHub 팔로우<\/td><td><a href=\"https://twitter.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">트위터<\/a> <a href=\"https://www.linkedin.com/company/github\" target=\"_blank\" rel=\"noopener noreferrer\">LinkedIn<\/a> <a href=\"https://www.instagram.com/github/\" target=\"_blank\" rel=\"noopener noreferrer\">인스타그램<\/a><\/td><\/tr><tr><td>비디오 찾기<\/td><td><a href=\"https://www.youtube.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube<\/a><\/td><\/tr><\/tbody><\/table>"]}, {"n": "13", "title": "변경사항 기록", "secs": ["<p>이 시험은 2026년 1월에 크게 변경되었습니다(예: 새로운 목표가 추가되고, 일부는 제거되고, 기존 목표가 다른 기능 그룹으로 이동했을 수 있으며, 모두 다시 작성됨).<\/p>"]}]}, "ja": {"title": "試験 GH-900 の学習ガイド: GitHub Foundations", "note": ["Source: https://learn.microsoft.com/ja-jp/credentials/certifications/resources/study-guides/gh-900 (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "このドキュメントの目的", "secs": ["<p>この学習ガイドは、試験で期待される内容を理解するのに役立ち、試験で取り上げる可能性のあるトピックの概要と、追加のリソースへのリンクを含める必要があります。 このドキュメントの情報と資料は、試験の準備をする際に研究に集中するのに役立ちます。<\/p>\n<table><thead><tr><th>便利なリンク<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://learn.microsoft.com/ja-jp/credentials/certifications/github-foundations/?practice-assessment-type=certification\" target=\"_blank\" rel=\"noopener noreferrer\">認定<\/a> を取得する方法<\/td><td>認定資格の中には、1 つの試験に合格するだけで済むものもあれば、複数の試験に合格する必要があるものもあります。<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ja-jp/credentials/certifications/renew-your-microsoft-certification\" target=\"_blank\" rel=\"noopener noreferrer\">認定資格の更新<\/a><\/td><td>Microsoft のアソシエイト、エキスパート、および専門認定資格は、毎年有効期限が切れます。 資格所有者は、Microsoft Learn で無料のオンライン評価に合格するだけで更新できます。<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ja-jp/users\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft Learn のプロフィール<\/a><\/td><td>認定プロファイルを Microsoft Learn に接続すると、試験のスケジュールと更新、証明書の共有と印刷を行うことができます。<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ja-jp/credentials/certifications/exam-scoring-reports\" target=\"_blank\" rel=\"noopener noreferrer\">試験の採点と採点報告<\/a><\/td><td>合格するには、700 以上のスコアが必要です。<\/td><\/tr><tr><td><a href=\"https://aka.ms/examdemo\" target=\"_blank\" rel=\"noopener noreferrer\">試験サンドボックス<\/a><\/td><td>試験のサンドボックスにアクセスして、試験環境を探索できます。<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/ja-jp/credentials/certifications/request-accommodations\" target=\"_blank\" rel=\"noopener noreferrer\"> <\/a> の宿泊施設をリクエストする<\/td><td>支援デバイスを使用する場合、余分な時間が必要な場合、または試験エクスペリエンスの任意の部分に変更が必要な場合は、宿泊施設を要求できます。<\/td><\/tr><\/tbody><\/table>"]}, {"n": "2", "title": "試験について", "secs": ["<p>一部の試験は他の言語にローカライズされ、英語版が更新されてから約 8 週間後に更新されます。 Microsoft では、前述のようにローカライズ版を更新するためにあらゆる努力を行いますが、場合によっては、予定どおりに試験のローカライズ版が更新されないことがあります。 その他の利用可能な言語は、<strong>試験の詳細<\/strong> Web ページの「<strong>試験のスケジュール設定<\/strong>」セクションに表示されます。 お好みの言語で試験を利用できない場合は、30 分を追加で要求して試験を完了できます。<\/p>", "<h3>注<\/h3>\n<p>測定された各スキルに従う箇条書きは、そのスキルを評価する方法を示すことを目的としています。 関連するトピックについては、試験で取り上げる場合があります。<\/p>", "<h3>注<\/h3>\n<p>ほとんどの質問では、一般提供 (GA) の機能について説明します。 これらの機能が一般的に使用されている場合、試験にはプレビュー機能に関する質問が含まれる場合があります。<\/p>"]}, {"n": "3", "title": "対象ユーザープロファイル", "secs": ["<p>この試験の受験者は、GitHub とそのコア機能に関する基礎知識を持っている必要があります。 これには、Git、リポジトリ、コラボレーション ツール、プロジェクト管理、最新の開発プラクティスの理解が含まれます。 この試験は、開発者以外、開発者、および GitHub の基礎に対する能力向上を目指すすべての GitHub ユーザー向けに設計されています。<\/p>"]}, {"n": "4", "title": "2026 年 1 月時点でのスキルの概要", "secs": ["<ul><li>Git と GitHub の基本を理解する (25 ~ 30%)<\/li><li>GitHub リポジトリを操作する (10 から 15%)<\/li><li>GitHub を使用した共同作業 (10 ~ 15%)<\/li><li>最新の開発プラクティスを適用する (10 ~ 15%)<\/li><li>GitHub を使用してプロジェクトを管理する (5 ~ 10%)<\/li><li>プライバシー、セキュリティ、管理について理解する (10 ~ 15%)<\/li><li>GitHub コミュニティを探索する (5 ~ 10%)<\/li><\/ul>"]}, {"n": "5", "title": "Git と GitHub の基本を理解する (25 ~ 30%)", "secs": ["", "<h3>バージョン 管理の基礎<\/h3>\n<ul><li>バージョン管理の目的と利点について説明する<\/li><li>Git と GitHub の違いについて説明する<\/li><li>リポジトリ、コミット、ブランチなどの主要な Git の概念を特定する<\/li><\/ul>", "<h3>GitHub の使用<\/h3>\n<ul><li>GitHub アカウント、組織、エンタープライズ オプションについて説明する<\/li><li>コラボレーションのための GitHub Flow について説明する<\/li><li>問題とプル要求での明確な通信のための Markdown の使用を特定する<\/li><li>GitHub Desktop と GitHub Mobile を使用するタイミングを認識する<\/li><\/ul>"]}, {"n": "6", "title": "GitHub リポジトリを操作する (10 から 15%)", "secs": ["", "<h3>リポジトリ管理<\/h3>\n<ul><li>GitHub リポジトリ (README、LICENSE、CONTRIBUTING、CODEOWNERS、SECURITY) の構造とキー ファイルについて説明する<\/li><li>テンプレートとブランチを使用してリポジトリを作成、整理、管理する方法を特定します。<\/li><li>リポジトリ内でファイルを追加および管理する方法を説明する<\/li><li>リポジトリの分析情報、星、機能プレビュー、リポジトリ メトリック ダッシュボード、依存関係の分析情報を説明して可視性を向上させる<\/li><li>リポジトリのメンテナンスとコラボレーションのベスト プラクティスを認識する<\/li><\/ul>"]}, {"n": "7", "title": "GitHub を使用した共同作業 (10 ~ 15%)", "secs": ["", "<h3>コラボレーション ツール<\/h3>\n<ul><li>コラボレーション用に、問題、プルリクエスト、ディスカッションを使用する方法について説明する。<\/li><li>プル要求を問題にリンクし、テンプレート、フィルター、割り当てを管理する方法を説明する<\/li><li>通知の目的と、それらをワークフロー管理用に構成する方法を特定する<\/li><li>Gists、Wiki、GitHub Pages を使用して情報を文書化および共有する方法について説明する<\/li><\/ul>"]}, {"n": "8", "title": "最新の開発プラクティスを適用する (10 ~ 15%)", "secs": ["", "<h3>自動化と AI ツール<\/h3>\n<ul><li>GitHub Actions の目的と機能について説明する<\/li><li>GitHub Copilot が、Copilot エージェント、エージェント モード、マルチモデルのサポートなど、AI を利用したコード提案を支援する方法を特定する<\/li><li>個人、ビジネス、エンタープライズ向けの GitHub Copilot の違いについて説明する<\/li><li>GitHub Codespaces と、開発コンテナーを設定、カスタマイズ、使用する方法について説明する<\/li><li>github.dev エディターを使用するタイミングと、それが Codespaces とどのように異なるかを説明する<\/li><\/ul>"]}, {"n": "9", "title": "GitHub を使用してプロジェクトを管理する (5 ~ 10%)", "secs": ["", "<h3>プロジェクトの追跡と組織<\/h3>\n<ul><li>GitHub プロジェクトとレイアウト オプションについて説明する<\/li><li>プロジェクト、ラベル、マイルストーン、ワークフローを構成する方法を説明する<\/li><li>保存された返信と担当者を使用してコミュニケーションを効率化する方法を特定する<\/li><li>プロジェクトの分析情報を使用して進行状況と生産性を追跡する方法について説明する<\/li><\/ul>"]}, {"n": "10", "title": "プライバシー、セキュリティ、管理について (10 ~ 15%)", "secs": ["", "<h3>セキュリティとアクセスの管理<\/h3>\n<ul><li>2 要素認証 (2FA) とパスキーを使用してアカウントをセキュリティで保護する方法について説明する<\/li><li>リポジトリと組織のアクセス許可とロールを特定する<\/li><li>Enterprise Managed Users (ETU) と組織全体の Copilot ポリシー管理の目的について説明する<\/li><li>リポジトリのプライバシー オプション、可視性の設定、ブランチ保護規則について説明する<\/li><li>組織の設定、チーム、ロールを管理する方法を認識する<\/li><\/ul>"]}, {"n": "11", "title": "GitHub コミュニティを探索する (5 ~ 10%)", "secs": ["", "<h3>オープン ソースエンゲージメント<\/h3>\n<ul><li>オープン ソースと GitHub スポンサーの利点について説明する<\/li><li>GitHub がオープンソース プロジェクトをサポートし、進化する方法について説明します。<\/li><li>ユーザーと組織をフォローしてアクティビティに関する最新情報を得る方法を特定します。<\/li><li>GitHub Marketplace とその目的について説明します。<\/li><li>InnerSource が組織内でオープンソースの原則を適用する方法について説明します。<\/li><li>フォーク、テンプレート、検出可能なリポジトリを使用してコラボレーションを促進するタイミングを認識します。<\/li><\/ul>"]}, {"n": "12", "title": "学習用リソース", "secs": ["", "<h3>レコメンデーション<\/h3>\n<p>GitHub Foundations 試験に合格する機会を増やすには、GitHub の基本的な経験、露出、能力の強固な基盤から始めることが不可欠です。 この試験の推奨されるラーニング パスでは、学習コンテンツの詳細な調査を行い、その後、認定試験の知識と準備を微調整できるように作成された実践的な演習と準備評価の質問を提供します。<\/p>\n<p>GitHub Foundations 試験の各ドメインの学習目標をカバーする推奨コンテンツとして、次のリソースが GitHub と共同で作成されています。<\/p>\n<table><thead><tr><th>学習用リソース<\/th><th>学習とドキュメントへのリンク<\/th><\/tr><\/thead><tbody><tr><td>トレーニングを受ける<\/td><td>マイペースのラーニング パスとモジュールから選択するか、Microsoft Learn でインストラクター主導のコースを受講する – <a href=\"https://learn.microsoft.com/ja-jp/training/paths/github-foundations/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Foundations パート 1<\/a> と <a href=\"https://learn.microsoft.com/ja-jp/training/paths/github-foundations-2/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Foundations パート 2<\/a><\/td><\/tr><tr><td>Microsoft Learn<\/td><td><a href=\"https://learn.microsoft.com/ja-jp/collections/o1njfe825p602p\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Foundations ラーニング パス<\/a><\/td><\/tr><tr><td>ドキュメントを見つける<\/td><td><a href=\"https://docs.github.com/get-started\" target=\"_blank\" rel=\"noopener noreferrer\">Git と GitHub の概要<\/a> <a href=\"https://docs.github.com/repositories\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub リポジトリの操作<\/a> コラボレーション機能: <a href=\"https://docs.github.com/issues\" target=\"_blank\" rel=\"noopener noreferrer\">問題<\/a>、 <a href=\"https://docs.github.com/pull-requests\" target=\"_blank\" rel=\"noopener noreferrer\">Pull Requests<\/a>、 <a href=\"https://docs.github.com/discussions\" target=\"_blank\" rel=\"noopener noreferrer\">ディスカッション<\/a>、 <a href=\"https://docs.github.com/account-and-profile/managing-subscriptions-and-notifications-on-github\" target=\"_blank\" rel=\"noopener noreferrer\">通知<\/a>、 <a href=\"https://docs.github.com/get-started/writing-on-github/editing-and-sharing-content-with-gists\" target=\"_blank\" rel=\"noopener noreferrer\">Gists<\/a>、 <a href=\"https://docs.github.com/communities/documenting-your-project-with-wikis\" target=\"_blank\" rel=\"noopener noreferrer\">Wiki<\/a>、 <a href=\"https://docs.github.com/pages\" target=\"_blank\" rel=\"noopener noreferrer\">ページ<\/a> 先進開発: <a href=\"https://docs.github.com/actions\" target=\"_blank\" rel=\"noopener noreferrer\">アクション<\/a>、 <a href=\"https://docs.github.com/copilot\" target=\"_blank\" rel=\"noopener noreferrer\">コピロット<\/a>、 <a href=\"https://docs.github.com/codespaces\" target=\"_blank\" rel=\"noopener noreferrer\">およびコードスペース<\/a> <a href=\"https://docs.github.com/issues/planning-and-tracking-with-projects\" target=\"_blank\" rel=\"noopener noreferrer\">プロジェクト管理<\/a> <a href=\"https://docs.github.com/site-policy/privacy-policies\" target=\"_blank\" rel=\"noopener noreferrer\">プライバシー<\/a>、 <a href=\"https://docs.github.com/get-started/learning-about-github/about-github-advanced-security\" target=\"_blank\" rel=\"noopener noreferrer\">セキュリティ<\/a>、 <a href=\"https://docs.github.com/authentication\" target=\"_blank\" rel=\"noopener noreferrer\">管理<\/a> <a href=\"https://docs.github.com/get-started/exploring-projects-on-github\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub コミュニティの利点<\/a><\/td><\/tr><tr><td>質問する<\/td><td><a href=\"https://github.community/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub コミュニティディスカッション<\/a><\/td><\/tr><tr><td>コミュニティ サポートを受ける<\/td><td><a href=\"https://github.blog/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub ブログ<\/a><\/td><\/tr><tr><td>GitHub をフォローする<\/td><td><a href=\"https://twitter.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">ツイッター<\/a> <a href=\"https://www.linkedin.com/company/github\" target=\"_blank\" rel=\"noopener noreferrer\">LinkedIn<\/a> <a href=\"https://www.instagram.com/github/\" target=\"_blank\" rel=\"noopener noreferrer\">Instagram<\/a><\/td><\/tr><tr><td>ビデオを見つける<\/td><td><a href=\"https://www.youtube.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube<\/a><\/td><\/tr><\/tbody><\/table>"]}, {"n": "13", "title": "変更ログ", "secs": ["<p>この試験は、2026 年 1 月に大幅に変更されました (たとえば、新しい目標が追加され、一部が削除され、既存の目標が異なる機能グループに移動され、すべてが言い換えられました)。<\/p>"]}]}, "en": {"title": "Study guide for Exam GH-900: GitHub Foundations", "note": ["Source: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/gh-900 (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "Purpose of this document", "secs": ["<p>This study guide should help you understand what to expect on the exam and includes a summary of the topics the exam might cover and links to additional resources. The information and materials in this document should help you focus your studies as you prepare for the exam.<\/p>\n<table><thead><tr><th>Useful links<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td><a href=\"https://learn.microsoft.com/en-us/credentials/certifications/github-foundations/?practice-assessment-type=certification\" target=\"_blank\" rel=\"noopener noreferrer\">How to earn the certification<\/a><\/td><td>Some certifications only require passing one exam, while others require passing multiple exams.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/en-us/credentials/certifications/renew-your-microsoft-certification\" target=\"_blank\" rel=\"noopener noreferrer\">Certification renewal<\/a><\/td><td>Microsoft associate, expert, and specialty certifications expire annually. You can renew by passing a free online assessment on Microsoft Learn.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/en-us/users\" target=\"_blank\" rel=\"noopener noreferrer\">Your Microsoft Learn profile<\/a><\/td><td>Connecting your certification profile to Microsoft Learn allows you to schedule and renew exams and share and print certificates.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/en-us/credentials/certifications/exam-scoring-reports\" target=\"_blank\" rel=\"noopener noreferrer\">Exam scoring and score reports<\/a><\/td><td>A score of 700 or greater is required to pass.<\/td><\/tr><tr><td><a href=\"https://aka.ms/examdemo\" target=\"_blank\" rel=\"noopener noreferrer\">Exam sandbox<\/a><\/td><td>You can explore the exam environment by visiting our exam sandbox.<\/td><\/tr><tr><td><a href=\"https://learn.microsoft.com/en-us/credentials/certifications/request-accommodations\" target=\"_blank\" rel=\"noopener noreferrer\">Request accommodations<\/a><\/td><td>If you use assistive devices, require extra time, or need modification to any part of the exam experience, you can request an accommodation.<\/td><\/tr><\/tbody><\/table>"]}, {"n": "2", "title": "About the exam", "secs": ["<p>Some exams are localized into other languages, and those are updated approximately eight weeks after the English version is updated. While Microsoft makes every effort to update localized versions as noted, there may be times when the localized versions of an exam are not updated on this schedule. Other available languages are listed in the <strong>Schedule Exam<\/strong> section of the <strong>Exam Details<\/strong> webpage. If the exam isn't available in your preferred language, you can request an additional 30 minutes to complete the exam.<\/p>", "<h3>Note<\/h3>\n<p>The bullets that follow each of the skills measured are intended to illustrate how we are assessing that skill. Related topics may be covered in the exam.<\/p>", "<h3>Note<\/h3>\n<p>Most questions cover features that are general availability (GA). The exam may contain questions on Preview features if those features are commonly used.<\/p>"]}, {"n": "3", "title": "Audience profile", "secs": ["<p>Candidates for this exam should have foundational knowledge of GitHub and its core features. This includes understanding Git, repositories, collaboration tools, project management, and modern development practices. The exam is designed for non-developers, developers, and all GitHub users seeking to improve their proficiency with GitHub fundamentals.<\/p>"]}, {"n": "4", "title": "Skills at a glance as of January 2026", "secs": ["<ul><li>Understand Git and GitHub basics (25–30%)<\/li><li>Work with GitHub repositories (10–15%)<\/li><li>Collaborate using GitHub (10–15%)<\/li><li>Apply modern development practices (10–15%)<\/li><li>Manage projects with GitHub (5–10%)<\/li><li>Understand privacy, security, and administration (10–15%)<\/li><li>Explore the GitHub community (5–10%)<\/li><\/ul>"]}, {"n": "5", "title": "Understand Git and GitHub basics (25–30%)", "secs": ["", "<h3>Version control fundamentals<\/h3>\n<ul><li>Describe the purpose and benefits of version control<\/li><li>Explain the difference between Git and GitHub<\/li><li>Identify key Git concepts such as repositories, commits, and branches<\/li><\/ul>", "<h3>Working with GitHub<\/h3>\n<ul><li>Describe GitHub accounts, organizations, and enterprise options<\/li><li>Explain the GitHub Flow for collaboration<\/li><li>Identify uses of Markdown for clear communication in issues and pull requests<\/li><li>Recognize when to use GitHub Desktop and GitHub Mobile<\/li><\/ul>"]}, {"n": "6", "title": "Work with GitHub repositories (10–15%)", "secs": ["", "<h3>Repository management<\/h3>\n<ul><li>Describe the structure and key files of a GitHub repository (README, LICENSE, CONTRIBUTING, CODEOWNERS, SECURITY)<\/li><li>Identify how to create, organize, and maintain repositories using templates and branches.<\/li><li>Explain how to add and manage files within a repository<\/li><li>Describe repository insights, stars, feature previews, repository metrics dashboards, and dependency insights for improved visibility<\/li><li>Recognize best practices for repository maintenance and collaboration<\/li><\/ul>"]}, {"n": "7", "title": "Collaborate using GitHub (10–15%)", "secs": ["", "<h3>Collaboration tools<\/h3>\n<ul><li>Describe how to use issues, pull requests, and discussions for collaboration<\/li><li>Explain how to link pull requests to issues and manage templates, filters, and assignments<\/li><li>Identify the purpose of notifications and how to configure them for workflow management<\/li><li>Describe how to use Gists, Wikis, and GitHub Pages to document and share information<\/li><\/ul>"]}, {"n": "8", "title": "Apply modern development practices (10–15%)", "secs": ["", "<h3>Automation and AI tools<\/h3>\n<ul><li>Describe the purpose and capabilities of GitHub Actions<\/li><li>Identify how GitHub Copilot assists with AI-powered code suggestions, including Copilot agents, Agent Mode, and multi‑model support<\/li><li>Explain the differences between GitHub Copilot for Individuals, Business, and Enterprise<\/li><li>Describe GitHub Codespaces and how to set up, customize, and use dev containers<\/li><li>Explain when to use the github.dev editor and how it differs from Codespaces<\/li><\/ul>"]}, {"n": "9", "title": "Manage projects with GitHub (5–10%)", "secs": ["", "<h3>Project Tracking and organization<\/h3>\n<ul><li>Describe GitHub Projects and layout options<\/li><li>Explain how to configure projects, labels, milestones, and workflows<\/li><li>Identify how to use saved replies and assignees to streamline communication<\/li><li>Describe how project insights can be used to track progress and productivity<\/li><\/ul>"]}, {"n": "10", "title": "Understand Privacy, security, and administration (10–15%)", "secs": ["", "<h3>Security and access management<\/h3>\n<ul><li>Describe how to secure accounts with two-factor authentication (2FA) and passkeys<\/li><li>Identify access permissions and roles for repositories and organizations<\/li><li>Explain the purpose of Enterprise Managed Users (EMUs) and organization-wide Copilot policy management<\/li><li>Describe repository privacy options, visibility settings, and branch protection rules<\/li><li>Recognize how to manage organization settings, teams, and roles<\/li><\/ul>"]}, {"n": "11", "title": "Explore the GitHub community (5–10%)", "secs": ["", "<h3>Open-source engagement<\/h3>\n<ul><li>Describe the benefits of open source and GitHub Sponsors<\/li><li>Explain how GitHub supports and advances open-source projects.<\/li><li>Identify how to follow users and organizations to stay informed about activity.<\/li><li>Describe the GitHub Marketplace and its purpose.<\/li><li>Explain how InnerSource applies open-source principles within organizations.<\/li><li>Recognize when to use forks, templates, and discoverable repositories to promote collaboration.<\/li><\/ul>"]}, {"n": "12", "title": "Study resources", "secs": ["", "<h3>Recommendations<\/h3>\n<p>To increase your chances of success in passing the GitHub Foundations exam, it’s essential to start with a solid foundation of basic experience, exposure, and proficiency on GitHub. The recommended learning paths for this exam provide you with an in-depth study of the learning content, followed by hands-on exercises and preparation assessment questions that were created to enable you to fine-tune your knowledge and readiness for the certification exam.<\/p>\n<p>The following resources have been created in collaboration with GitHub as recommended content that covers the learning objectives in each domain for the GitHub Foundations exam.<\/p>\n<table><thead><tr><th>Study resources<\/th><th>Links to learning and documentation<\/th><\/tr><\/thead><tbody><tr><td>Get trained<\/td><td>Choose from self-paced learning paths and modules or take an instructor-led course on Microsoft Learn – <a href=\"https://learn.microsoft.com/en-us/training/paths/github-foundations/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Foundations Part 1<\/a> and <a href=\"https://learn.microsoft.com/en-us/training/paths/github-foundations-2/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Foundations Part 2<\/a><\/td><\/tr><tr><td>Microsoft Learn<\/td><td><a href=\"https://learn.microsoft.com/en-us/collections/o1njfe825p602p\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Foundations learning path<\/a><\/td><\/tr><tr><td>Find documentation<\/td><td><a href=\"https://docs.github.com/get-started\" target=\"_blank\" rel=\"noopener noreferrer\">Introduction to Git and GitHub<\/a> <a href=\"https://docs.github.com/repositories\" target=\"_blank\" rel=\"noopener noreferrer\">Working with GitHub Repositories<\/a> Collaboration Features: <a href=\"https://docs.github.com/issues\" target=\"_blank\" rel=\"noopener noreferrer\">Issues<\/a>, <a href=\"https://docs.github.com/pull-requests\" target=\"_blank\" rel=\"noopener noreferrer\">Pull Requests<\/a>, <a href=\"https://docs.github.com/discussions\" target=\"_blank\" rel=\"noopener noreferrer\">Discussions<\/a>, <a href=\"https://docs.github.com/account-and-profile/managing-subscriptions-and-notifications-on-github\" target=\"_blank\" rel=\"noopener noreferrer\">Notifications<\/a>, and <a href=\"https://docs.github.com/get-started/writing-on-github/editing-and-sharing-content-with-gists\" target=\"_blank\" rel=\"noopener noreferrer\">Gists<\/a>, <a href=\"https://docs.github.com/communities/documenting-your-project-with-wikis\" target=\"_blank\" rel=\"noopener noreferrer\">Wikis<\/a>, and <a href=\"https://docs.github.com/pages\" target=\"_blank\" rel=\"noopener noreferrer\">Pages<\/a> Modern Development: <a href=\"https://docs.github.com/actions\" target=\"_blank\" rel=\"noopener noreferrer\">Actions<\/a>, <a href=\"https://docs.github.com/copilot\" target=\"_blank\" rel=\"noopener noreferrer\">Copilot<\/a>, and <a href=\"https://docs.github.com/codespaces\" target=\"_blank\" rel=\"noopener noreferrer\">Codespaces<\/a> <a href=\"https://docs.github.com/issues/planning-and-tracking-with-projects\" target=\"_blank\" rel=\"noopener noreferrer\">Project Management<\/a> <a href=\"https://docs.github.com/site-policy/privacy-policies\" target=\"_blank\" rel=\"noopener noreferrer\">Privacy<\/a>, <a href=\"https://docs.github.com/get-started/learning-about-github/about-github-advanced-security\" target=\"_blank\" rel=\"noopener noreferrer\">Security<\/a>, and <a href=\"https://docs.github.com/authentication\" target=\"_blank\" rel=\"noopener noreferrer\">Administration<\/a> <a href=\"https://docs.github.com/get-started/exploring-projects-on-github\" target=\"_blank\" rel=\"noopener noreferrer\">Benefits of the GitHub Community<\/a><\/td><\/tr><tr><td>Ask a question<\/td><td><a href=\"https://github.community/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Community Discussions<\/a><\/td><\/tr><tr><td>Get community support<\/td><td><a href=\"https://github.blog/\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Blog<\/a><\/td><\/tr><tr><td>Follow GitHub<\/td><td><a href=\"https://twitter.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">Twitter<\/a> <a href=\"https://www.linkedin.com/company/github\" target=\"_blank\" rel=\"noopener noreferrer\">LinkedIn<\/a> <a href=\"https://www.instagram.com/github/\" target=\"_blank\" rel=\"noopener noreferrer\">Instagram<\/a><\/td><\/tr><tr><td>Find a video<\/td><td><a href=\"https://www.youtube.com/github\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube<\/a><\/td><\/tr><\/tbody><\/table>"]}, {"n": "13", "title": "Change log", "secs": ["<p>This exam has changed significantly (e.g., new objectives were added, some were removed, existing objectives may have moved to different functional groups, and all were reworded) on January, 2026.<\/p>"]}]}};
const out=document.getElementById('out'), nav=document.getElementById('chaps'), noteEl=document.getElementById('note');
const N=DATA.ko.ch.length;
const NOTES={
 ko:['<p><strong>한국어판</strong>: Microsoft Learn의 공식 한국어 페이지(GH-900 스터디 가이드) 본문을 그대로 옮겼습니다. 출처: learn.microsoft.com, 2026-11-07 확인.</p>','<p><strong>주의</strong>: 이 한국어 페이지는 Microsoft가 제공하는 <strong>기계 번역본</strong>입니다(페이지 메타데이터 ms.translationtype=MT). 어색한 표현이나 오역이 있을 수 있으니 의미가 애매하면 영어판이나 일본어판(사람 번역)을 확인하세요. 세 언어 모두 2026-02-19 영어 원문 기준입니다.</p>'],
 ja:['<p><strong>日本語版</strong>：Microsoft Learn 公式の日本語ページ (GH-900 学習ガイド) の本文をそのまま転記しています。出典：learn.microsoft.com（2026-11-07 時点）。日本語版は人による翻訳 (ms.translationtype=HT) で、2026-02-19 の英語版に基づいています。</p>'],
 dual:['<p><strong>한·日 대조</strong>: 왼쪽은 공식 한국어 페이지(기계 번역), 오른쪽은 공식 일본어 페이지(사람 번역)입니다. 같은 항목끼리 줄을 맞췄습니다.</p>'],
 en:['<p><strong>English</strong>: official Microsoft Learn study guide for Exam GH-900 (last updated 2026-02-19), transcribed from learn.microsoft.com as of 2026-11-07.</p>']
};
let view='ko', openAll=false;
try{const s=localStorage.getItem('gh900-guide-view'); if(s&&NOTES[s]) view=s;}catch(e){}
function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');}
function prep(h){h=wrapTables(h); return openAll?h.replace(/<details class="ans">/g,'<details class="ans" open>'):h;}
function render(){
  document.body.classList.toggle('dual',view==='dual');
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  noteEl.innerHTML=NOTES[view].join('');
  let h='';
  for(let i=0;i<N;i++){
    const ko=DATA.ko.ch[i], ja=DATA.ja.ch[i], en=DATA.en.ch[i], n=ko.n;
    h+=`<section class="chap" id="c${n}">`;
    if(view==='dual'){
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1>${ko.title}<span class="sub ja" lang="ja">${ja.title}</span></h1></div>`;
      h+=`<div class="colhead"><span>한국어</span><span>日本語</span></div>`;
      ko.secs.forEach((s,j)=>{h+=`<div class="pair"><div class="sec">${prep(s)}</div><div class="sec ja" lang="ja">${prep(ja.secs[j])}</div></div>`;});
    }else{
      const L=view, c=DATA[L].ch[i];
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1 class="${L}" lang="${L}">${c.title}</h1></div>`;
      h+=`<div class="sec ${L}" lang="${L}">${c.secs.map(prep).join('')}</div>`;
    }
    h+='</section>';
  }
  out.innerHTML=h;
  const L=view==='dual'?'ko':view;
  nav.innerHTML=DATA[L].ch.map(c=>`<button data-c="${c.n}" title="${c.title}">${c.n}</button>`).join('');
  spy();
}
document.querySelector('.langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const cur=current();
  view=b.dataset.v; try{localStorage.setItem('gh900-guide-view',view);}catch(e){}
  render(); jump(cur,false);
});
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) jump(b.dataset.c,true);});
function off(){return document.querySelector('header.top').getBoundingClientRect().bottom;}
function jump(n,smooth){
  const el=document.getElementById('c'+n); if(!el) return;
  window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off()-8,behavior:smooth?'smooth':'auto'});
}
function current(){
  const o=off()+20; let c=DATA.ko.ch[0].n;
  DATA.ko.ch.forEach(x=>{const el=document.getElementById('c'+x.n); if(el&&el.getBoundingClientRect().top<=o) c=x.n;}); return c;
}
function spy(){const c=current(); nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));}
addEventListener('scroll',spy,{passive:true});
render();
</script>

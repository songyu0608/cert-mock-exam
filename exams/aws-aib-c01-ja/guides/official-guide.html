<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>AIB-C01 공식 시험 가이드</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: sticky bar (language tabs + chapter chips 1–18), one reading column; "대조" view = section-aligned two-column grid */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b1f2a; --muted:#5b6475; --line:#dde1e8;
  --accent:#2f4bb8; --accent-soft:#e7ebfa; --code-bg:#eef0f5; --quote:#f0f3fb; --ok:#1d7a52; --ok-soft:#e5f4ec;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-display:"Fraunces",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ko);font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.dual .wrap{max-width:1260px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto;letter-spacing:.01em}
.brand small{font-family:var(--f-ko);color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:4px 10px;font-size:13px;line-height:1.5}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chaps button{font-family:var(--f-mono);font-size:12px;padding:1px 0;min-width:30px;text-align:center}
.chaps button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding-block:24px 80px}
.note{font-size:13px;color:var(--muted);line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:36px;background:var(--surface)}
.note p{margin:0}
.chap{margin-bottom:56px}
.chap-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:8px}
.chap-no{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.2em}
.chap-head h1{font-size:22px;line-height:1.4;margin:0;text-wrap:balance}
.chap-head .sub{font-size:13px;color:var(--muted);display:block;font-weight:400}
.sec h3{font-size:18px;margin:34px 0 8px;text-wrap:balance}
.sec a{color:var(--accent);text-underline-offset:2px}
.sec h4{font-size:15.5px;margin:28px 0 6px;color:var(--accent);line-height:1.55;text-wrap:balance}
.sec p{margin:0 0 14px}
.sec ul,.sec ol{margin:0 0 14px;padding-left:1.4em}
.sec li{margin:3px 0}
.sec ul.opts{list-style:none;padding-left:0}
.sec ul.opts li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;background:var(--surface)}
.sec blockquote{margin:16px 0;padding:10px 16px;background:var(--quote);border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.sec blockquote p:last-child{margin-bottom:0}
details.ans{margin:4px 0 26px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.ans summary{cursor:pointer;padding:7px 12px;font-size:13.5px;color:var(--ok);font-weight:600}
details.ans[open]{background:var(--ok-soft);border-color:var(--ok)}
details.ans p{margin:0;padding:0 14px 12px}
.sec code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:6px 0 18px}
.sec table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.sec th,.sec td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sec th{background:var(--code-bg)}
.ja{font-family:var(--f-ja)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0}
.pair>div{min-width:0}
.colhead{display:grid;grid-template-columns:1fr 1fr;gap:36px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:820px){.pair{grid-template-columns:1fr}.pair>div.ja{border-top:1px dotted var(--line);padding-top:4px}.colhead{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <span class="brand">AIB-C01 시험 가이드<small>AWS 공식 · 전문</small></span>
    <div class="row langs" role="group" aria-label="언어">
      <button id="v-ko" data-v="ko">한국어</button>
      <button id="v-ja" data-v="ja">日本語</button>
      <button id="v-dual" data-v="dual">한·日 대조</button>
      <button id="v-en" data-v="en">English</button>
    </div>
  </div>
  <div class="row chaps" role="group" aria-label="장 이동" id="chaps"></div>
</div></header>
<main><div class="wrap">
  <div class="note" id="note"></div>
  <div id="out"></div>
</div></main>

<script>
const DATA={"ko": {"title": "AWS Certified AI Business Strategist: 시험 안내서(AIB-C01)", "note": ["Source: https://docs.aws.amazon.com/ko_kr/aws-certification/latest/ai-business-strategist-01/ai-business-strategist-01.html (retrieved 2026-11-06)"], "ch": [{"n": "1", "title": "AWS Certified AI Business Strategist(AIB-C01)", "secs": ["<p>AWS Certified AI Business Strategist(AIB-C01) 시험은 조직 또는 고객을 대상으로 AI 이니셔티브를 평가, 주도 또는 확장하는 개인을 대상으로 합니다. 시험은 응시자가 AI 역량을 비즈니스 성과로 전환하고, 책임 있는 AI 사례를 수립하고, 대규모 AI 도입을 주도하는 능력을 검증합니다.<\/p>"]}, {"n": "2", "title": "서론", "secs": ["<p>AWS Certified AI Business Strategist(AIB-C01) 시험은 AI 기능을 비즈니스 성과로 전환하고, 책임 있는 AI 사례를 수립하고, AI 솔루션을 최적화할 기회를 평가하고, 대규모 AI 도입을 주도하는 비즈니스 전문가의 능력을 검증합니다. 시험은 기본 AI 활용 능력을 기반으로 하는 AI 전략, 거버넌스 및 조직 혁신을 다룹니다. 시험은 기술적 구현보다 전략적 의사 결정을 우선시합니다.<\/p>\n<p>또한 이 시험에서는 응시자의 다음 작업을 완료하는 능력을 확인합니다.<\/p>\n<ul><li>기본 AI 개념과 용어를 비즈니스 컨텍스트에 적용합니다.<\/li><li>비즈니스 요구 사항 및 제약 조건에 따라 적절한 AI 솔루션 유형을 선택합니다.<\/li><li>프롬프트 엔지니어링 및 모델 적응을 포함한 생성형 AI(GenAI) 기술을 사용하여 비즈니스 성과를 달성합니다.<\/li><li>조직 목표에 맞는 AI 전략을 개발하고 우선 순위를 지정합니다.<\/li><li>핵심 성과 지표(KPI), 투자 수익률(ROI) 프레임워크 및 기준 지표를 사용하여 AI 비즈니스 가치를 측정합니다.<\/li><li>경쟁 우위 및 비즈니스 모델 혁신을 위해 AI 이니셔티브를 포지셔닝합니다.<\/li><li>절충이 필요한 비즈니스 결정을 내릴 때 책임 있는 AI 원칙을 적용합니다.<\/li><li>거버넌스 구조를 수립하고 AI 이니셔티브에 대한 규정 준수를 보장합니다.<\/li><li>엔터프라이즈 AI 위험을 파악하고 적절한 완화 전략을 지시합니다.<\/li><li>사람, 프로세스, 기술 및 거버넌스 전반에서 조직의 AI 준비 상태와 성숙도를 평가합니다.<\/li><li>AI 이니셔티브를 지원하는 데 필요한 데이터 및 인프라 기반을 평가합니다.<\/li><li>전사적 변화 관리를 주도하고 AI에 대해 준비된 인력 역량을 구축합니다.<\/li><li>반복적인 접근 방식을 사용하여 파일럿부터 전사적 배포까지 AI 이니셔티브를 확장합니다.<\/li><\/ul>"]}, {"n": "3", "title": "대상 응시자 설명", "secs": ["<p>대상 응시자는 조직 또는 고객을 위해 AI 이니셔티브를 평가, 주도 또는 확장하는 비즈니스 전문가입니다. 대상 응시자는 기술 팀과 함께 일하지만 AI 솔루션을 직접 구축하지는 않습니다. 일반적인 직무에는 제품 관리자, 프로그램 관리자, 영업 전문가, 사업부 관리자, 컨설턴트, 마케터 및 비즈니스 분석가가 포함됩니다. 코딩 또는 실무 AWS 구현 경험이 필요하지는 않습니다. 대상 응시자는 AI 개념에 대한 기본적인 지식을 갖추고 있어야 하며, AWS AI 서비스가 비즈니스 수준에서 제공하는 것에 대한 일반적인 인식이 있어야 합니다(서비스에 대한 실무 경험 필요 없음). 최소 6개월 동안 AI를 도입한 경험 또는 도입하는 팀과 함께 작업한 경험을 권장합니다. 이러한 전문가는 솔루션을 구성하거나 구축할 필요 없이 추천 엔진, 자연어 처리(NLP), 컴퓨터 비전, 문서 추출, 고객 운영을 위한 AI와 같은 AI 도구 및 비즈니스 애플리케이션의 공통 범주를 인식해야 합니다.<\/p>", "<h3>권장하는 AWS 지식<\/h3>\n<p>대상 응시자는 비즈니스 애플리케이션을 포함하여 전략적 수준에서 AWS AI 및 기계 학습(ML) 서비스 제공에 익숙해야 합니다. 기술 구현 전문 지식이 필요하지는 않습니다.<\/p>\n<p>다음 서비스에 대한 전반적인 지식:<\/p>\n<ul><li><a href=\"https://docs.aws.amazon.com/ko_kr/bedrock/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Bedrock<\/a>(생성형 AI(GenAI) 플랫폼, 가격 책정 계층, 가드레일, 지식 기반)<\/li><li><a href=\"https://docs.aws.amazon.com/ko_kr/sagemaker/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon SageMaker AI<\/a>(사용자 지정 ML 및 관리형 또는 사용자 지정 솔루션을 사용하는 경우)<\/li><li><a href=\"https://docs.aws.amazon.com/ko_kr/quick/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Quick<\/a>(AI 기반 비즈니스 어시스턴트)<\/li><\/ul>\n<p>책임 있고 확장 가능한 AI 도입을 지원하는 AWS 프레임워크 및 가이드라인에 대한 지식:<\/p>\n<ul><li>조직 전반에서 AI 이니셔티브를 계획하고 확장하기 위한 AWS Cloud Adoption Framework(AWS CAF)<\/li><li>거버넌스 수준의 데이터 보안 및 규정 준수를 포함한 AI 워크로드에 대한 AWS 공동 책임 모델<\/li><li>거버넌스 모범 사례에 대한 AWS Well-Architected Framework(책임 있는 AI Lens)<\/li><\/ul>\n<p>비즈니스 사례 개발 및 투자 수익률(ROI) 분석을 지원하는 AWS 도구에 대한 지식:<\/p>\n<ul><li>AWS AI 서비스 가격 책정 구조(예: 사용량 기반, 인스턴스 기반, 사용자 기반)<\/li><li>비용 최적화 전략(예: <a href=\"https://docs.aws.amazon.com/ko_kr/savingsplans/\" target=\"_blank\" rel=\"noopener noreferrer\">절감형 플랜<\/a>)<\/li><li>비용 계획을 위한 <a href=\"https://docs.aws.amazon.com/ko_kr/pricing-calculator/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS 요금 계산기<\/a> 및 <a href=\"https://docs.aws.amazon.com/ko_kr/cost-management/latest/userguide/ce-what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Cost Explorer<\/a><\/li><li>빌드-구매-파트너 결정을 평가하기 위한 <a href=\"https://docs.aws.amazon.com/ko_kr/marketplace/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Marketplace<\/a><\/li><\/ul>", "<h3>대상 응시자의 시험 범위에 해당하지 않는 작업<\/h3>\n<p>다음 목록에는 대상 응시자가 수행할 수 있을 것으로 예상되지 않는 작업이 포함되어 있습니다. 이 목록에 모든 사항이 포함된 것은 아닙니다. 다음 항목은 시험 범위에 포함되지 않습니다.<\/p>\n<ul><li>AI 및 ML 모델 또는 알고리즘 개발 또는 코딩<\/li><li>데이터 엔지니어링 또는 특성 추출 기법 구현<\/li><li>하이퍼파라미터 튜닝 또는 모델 최적화 수행<\/li><li>AI 및 ML 파이프라인 또는 인프라 구축 및 배포<\/li><li>AI 및 ML 모델의 수학적 또는 통계적 분석 수행<\/li><li>AI 및 ML 시스템을 위한 보안 또는 규정 준수 프로토콜 구현<\/li><li>AWS 서비스 또는 클라우드 인프라 구성, 배포 또는 관리<\/li><li>AI 솔루션을 위한 특정 알고리즘, 프레임워크 또는 기술 아키텍처 선택 또는 튜닝<\/li><li>실무 데이터 사전 처리, 정리, 레이블 지정 또는 주석 추가 작업 수행<\/li><li>프로덕션 내 AI 시스템의 기술 운영 관리(예: 인프라 모니터링, 파이프라인 디버깅, 모델 성능 문제 해결)<\/li><\/ul>"]}, {"n": "4", "title": "시험 콘텐츠", "secs": ["", "<h3>문항 유형<\/h3>\n<p>시험에는 다음 문항 유형 중 1개 이상이 포함됩니다.<\/p>\n<ul><li><strong>선다형:<\/strong> 정답 1개와 오답 3개(정답 이외의 답)가 있습니다.<\/li><li><strong>복수 응답형:<\/strong> 5개 이상의 응답 중에 2개 이상의 정답이 있습니다. 문항에 배정된 점수를 받으려면 정답을 모두 선택해야 합니다.<\/li><\/ul>\n<p>답하지 않은 문항은 오답으로 채점됩니다. 추측에 따른 불이익은 없습니다.<\/p>", "<h3>시험 시간<\/h3>\n<p>130분 이내에 시험을 완료해야 합니다.<\/p>", "<h3>시험 결과<\/h3>\n<p>AWS Certified AI Business Strategist(AIB-C01) 시험은 합격 또는 불합격이 결정되는 시험입니다.¹ AWS 전문가가 자격증 분야 모범 사례 및 가이드라인에 따라 설정한 최소 표준을 기준으로 시험 점수를 매깁니다.<\/p>\n<blockquote><p>¹ 베타 테스트에 대한 추가 정보는 <a href=\"https://aws.amazon.com/certification/policies/before-testing/\" target=\"_blank\" rel=\"noopener noreferrer\">테스트 전 정책<\/a>을 확인하시기 바랍니다.<\/p><\/blockquote>\n<p>시험 결과는 100~1,000점의 변환 점수로 보고됩니다. 합격 최소 점수는 700점입니다. 응시자는 점수를 통해 전반적인 시험 성적과 합격 여부를 알 수 있습니다. 변환 점수 모델은 난이도가 조금씩 다를 수 있는 여러 시험 형식에 걸쳐 점수를 균등하게 조정하는 데 도움이 됩니다.<\/p>\n<p>점수 보고서에는 섹션 수준별로 성적 분류표가 포함될 수 있습니다. 시험은 보상 점수 모델을 사용하므로 각 섹션에서 합격 점수를 얻을 필요는 없으며, 전체 시험에만 합격하면 됩니다.<\/p>\n<p>시험의 섹션마다 특정 가중치가 적용되므로 일부 섹션은 다른 섹션보다 문항 수가 많습니다. 분류표에는 응시자의 장단점을 강조하여 보여주는 일반 정보가 포함되어 있습니다. 섹션별 피드백을 파악할 때 주의하시기 바랍니다.<\/p>"]}, {"n": "5", "title": "내용 개요", "secs": ["<p>이 시험 안내서에서는 시험의 가중치, 콘텐츠 도메인, 작업 및 기술에 관한 내용을 제공합니다. 이 안내서는 시험 내용의 전체 목록을 제공하지 않습니다.<\/p>\n<p>시험의 콘텐츠 도메인과 가중치는 다음과 같습니다.<\/p>\n<ul><li>콘텐츠 도메인 1: AI 기초 및 활용 능력(채점 대상 콘텐츠의 24%)<\/li><li>콘텐츠 도메인 2: AI 전략 및 비즈니스 가치 창출(채점 대상 콘텐츠의 28%)<\/li><li>콘텐츠 도메인 3: AI 거버넌스 및 책임 있는 AI 리더십(채점 대상 콘텐츠의 24%)<\/li><li>콘텐츠 도메인 4: 비즈니스 준비성, 리더십, AI 혁신(채점 대상 콘텐츠의 24%)<\/li><\/ul>"]}, {"n": "6", "title": "콘텐츠 도메인 1: AI 기초 및 활용 능력", "secs": ["", "<h3>작업 1.1: 핵심 AI 개념을 설명하고 용어를 정의합니다.<\/h3>\n<ul><li>기술 1.1.1: 비즈니스 컨텍스트(예: 알고리즘, 모델, 교육, 추론, 예측)에서 기본적인 AI 개념을 인식하고 설명합니다.<\/li><li>기술 1.1.2: AI, 기계 학습(ML), 생성형 AI(GenAI)를 구분합니다.<\/li><li>기술 1.1.3: 정형 데이터와 비정형 데이터를 구분하고 AI 데이터 유형의 관련성을 설명합니다.<\/li><li>기술 1.1.4: 데이터 품질이 AI 결과에 중요한 이유를 설명합니다.<\/li><li>기술 1.1.5: 과거 데이터를 사용하여 AI 모델 학습과 관련된 개념을 설명합니다.<\/li><li>기술 1.1.6: 글로벌 프레임워크 및 통합형 AI 어휘(예: ISO/IEC 23053, ISO/IEC 42001)에 대한 인식을 함양합니다.<\/li><\/ul>", "<h3>작업 1.2: 적절한 AI 솔루션 유형을 파악 및 선택합니다.<\/h3>\n<ul><li>기술 1.2.1: 규칙 기반 자동화를 사용하는 경우와 AI 솔루션을 사용하는 경우를 결정합니다.<\/li><li>기술 1.2.2: AI 에이전트를 다른 AI 솔루션과 구별하고 AI 에이전트의 핵심 기능(예: 자율성, 도구 사용, 에이전트 간 통신, 오케스트레이션 전략)을 파악합니다.<\/li><li>기술 1.2.3: 모델 드리프트 및 성능 변화를 감지하고 해결하기 위해 AI 솔루션에 지속적인 모니터링과 업데이트가 필요한 이유를 설명합니다.<\/li><li>기술 1.2.4: AI 도구의 투명한 분류(예: 승인, 차단, 평가 중)를 설정하여 섀도 AI 위험을 완화합니다.<\/li><\/ul>", "<h3>작업 1.3: GenAI 개념과 기법을 적용합니다.<\/h3>\n<ul><li>기술 1.3.1: 기본 프롬프트 엔지니어링 원칙을 적용하여 원하는 AI 출력을 달성합니다.<\/li><li>기술 1.3.2: 토큰 제한 또는 컨텍스트 윈도우 제약이 GenAI 시스템 성능에 영향을 미치는 경우를 파악합니다.<\/li><li>기술 1.3.3: 모델 적응 기법(예: 검색 증강 생성(RAG), 미세 조정)이 특정 비즈니스 요구에 대한 AI 응답을 어떻게 개선하는지 이해합니다.<\/li><\/ul>"]}, {"n": "7", "title": "콘텐츠 도메인 2: AI 전략 및 비즈니스 가치 창출", "secs": ["", "<h3>작업 2.1: 비즈니스 목표에 맞는 AI 전략을 개발합니다.<\/h3>\n<ul><li>기술 2.1.1: 비즈니스 기능(예: 고객 운영, 영업 및 마케팅, 연구 및 개발, 소프트웨어 개발) 전반에서 영향력이 큰 AI 사용 사례를 파악하고 AI 기능을 특정 비즈니스 성과에 연결합니다.<\/li><li>기술 2.1.2: 예산, 일정, 기능, 공급업체 제안, 규정 준수 요구 사항 등의 요소를 고려하여 AI 구현을 위한 구축-구매-파트너 결정을 평가합니다.<\/li><li>기술 2.1.3: 비즈니스 가치, 실현 가능성, 지속 가능성 및 전략적 조정을 기반으로 AI 이니셔티브의 우선순위를 지정합니다(이니셔티브 규모 조정, 일시 중지 또는 종료 결정).<\/li><li>기술 2.1.4: AI가 비즈니스 문제에 적합한 솔루션이 아닌 경우를 파악합니다.<\/li><li>기술 2.1.5: 비즈니스 프로세스를 AI 기반 솔루션 또는 AI 플랫폼 간 전환을 준비할 때 주요 고려 사항(예: 비즈니스 연속성, 비용 영향, 데이터 준비성, 성능 영향)을 평가합니다.<\/li><\/ul>", "<h3>작업 2.2: AI 비즈니스 가치를 측정하고 시연합니다.<\/h3>\n<ul><li>기술 2.2.1: 유형적 이점(예: 비용 절감, 수익 성장) 및 무형적 이점(예: 고객 만족도, 직원 생산성 향상)을 비롯한 AI 이니셔티브의 핵심 성과 지표(KPI)를 정의합니다.<\/li><li>기술 2.2.2: AI 솔루션을 구현하기 전에 기준 지표를 설정하여 AI 도입 효과를 정확하게 측정합니다.<\/li><li>기술 2.2.3: 포괄적인 프레임워크(예: 시간 절약, 비용 절감, 수익 성장, 생산성 향상)를 사용하여 AI 투자 수익률(ROI)을 계산합니다.<\/li><li>기술 2.2.4: AI 프로젝트 성공을 예측하는 선행 지표를 파악합니다.<\/li><li>기술 2.2.5: 비용 계획 및 최적화 전략을 포함하여 AI 구현을 위한 기본 비용 요소 제어를 구현합니다.<\/li><\/ul>", "<h3>작업 2.3: 경쟁 우위를 점할 수 있도록 AI를 포지셔닝합니다.<\/h3>\n<ul><li>기술 2.3.1: 경쟁 환경을 평가하고 AI 도입의 이점을 파악합니다.<\/li><li>기술 2.3.2: AI 솔루션을 사용하여 비즈니스 모델을 혁신할 기회를 파악합니다.<\/li><li>기술 2.3.3: AI가 지속 가능한 경쟁 우위를 확보하고 운영을 개선하는 방법을 설명합니다.<\/li><li>기술 2.3.4: 산업 성숙도와 경쟁업체 동향을 기반으로 적절한 AI 투자 수준을 결정합니다.<\/li><\/ul>"]}, {"n": "8", "title": "콘텐츠 도메인 3: AI 거버넌스 및 책임 있는 AI 리더십", "secs": ["", "<h3>작업 3.1: 책임 있는 AI 원칙을 비즈니스 의사 결정에 적용합니다.<\/h3>\n<ul><li>기술 3.1.1: 책임 있는 AI 원칙과 차원(예: 공정성, 설명 가능성, 개인정보 보호, 안전, 투명성, 견고성)을 비즈니스 시나리오에 적용합니다.<\/li><li>기술 3.1.2: 비즈니스 목표가 책임 있는 AI 원칙과 충돌할 때 절충점을 찾습니다.<\/li><li>기술 3.1.3: 설계에 따른 거버넌스를 보장하기 위해 책임 있는 AI 관행을 AI 프로젝트 계획에 통합해야 하는 경우를 파악합니다.<\/li><li>기술 3.1.4: AI 시스템이 사람의 감시를 필요로 하는 상황을 인식하고 적절한 보호 장치(예: 할루시네이션 감지, 가드레일, 에스컬레이션 기준)를 파악합니다.<\/li><\/ul>", "<h3>작업 3.2: AI 거버넌스 구조를 구축하고 규정을 준수합니다.<\/h3>\n<ul><li>기술 3.2.1: 적절한 부서 간 대표성과 명확한 책임 소재를 갖춘 AI 거버넌스 구조를 수립합니다.<\/li><li>기술 3.2.2: AI를 사용하는 비즈니스 프로세스의 규정 준수 위험을 파악 및 해결합니다.<\/li><li>기술 3.2.3: AI 시스템에 대한 적절한 액세스 제어 및 데이터 보안 조치를 파악합니다.<\/li><li>기술 3.2.4: AI 위험 분류 프레임워크를 적용하여 AI 수명 주기 전반에서 거버넌스 및 규정 준수 결정의 우선순위를 정합니다.<\/li><\/ul>", "<h3>작업 3.3: 엔터프라이즈 AI 위험과 직접적인 완화 전략을 파악합니다.<\/h3>\n<ul><li>기술 3.3.1: 프로덕션 내 AI 시스템의 위험 제어 및 모니터링 메커니즘의 필요성을 파악합니다.<\/li><li>기술 3.3.2: AI 수명 주기의 여러 단계에서 편향이 발생할 수 있음을 인식하고 바이어스 드리프트에 대한 지속적인 모니터링의 중요성을 설명합니다.<\/li><li>기술 3.3.3: AI 시스템의 유해 콘텐츠 위험과 지적 재산권(IP) 문제를 관리합니다.<\/li><li>기술 3.3.4: AI 시스템 신뢰성과 관련된 위험(예: 할루시네이션, 데이터 품질 저하, 모델 드리프트)을 파악 및 완화합니다.<\/li><\/ul>"]}, {"n": "9", "title": "콘텐츠 도메인 4: 비즈니스 준비성, 리더십, AI 혁신", "secs": ["", "<h3>작업 4.1: AI 비즈니스 준비 상태 및 성숙도를 평가합니다.<\/h3>\n<ul><li>기술 4.1.1: 중요한 차원(예: 리더십 조정, 데이터 품질, 문화적 준비, 기술 인프라, 거버넌스 프레임워크)에서 AI를 도입하기 위한 비즈니스 준비 상태를 평가합니다.<\/li><li>기술 4.1.2: AI 성숙도 모델을 적용하여 기업이 AI 여정의 어느 단계에 있는지 평가합니다(예: 실험, 엔터프라이즈 규모 배포).<\/li><li>기술 4.1.3: 성공적인 AI 전환을 방해하는 사람, 프로세스, 기술 및 거버넌스 전반의 특정 역량 격차를 파악합니다.<\/li><li>기술 4.1.4: 전략적 목표와 현재의 비즈니스 성숙도 수준에 따라 개발 투자의 우선순위를 정하고 진행 경로를 형성합니다.<\/li><\/ul>", "<h3>작업 4.2: AI를 위한 데이터 및 인프라 기반을 구축합니다.<\/h3>\n<ul><li>기술 4.2.1: 데이터 품질, 접근성, AI 이니셔티브에 대한 데이터 사일로의 영향을 포함하여 데이터 준비 상태를 평가합니다.<\/li><li>기술 4.2.2: AI의 기반을 제공하는 데이터 전략, 데이터 소유권, 데이터 공유 프레임워크의 중요성을 설명합니다.<\/li><li>기술 4.2.3: AI 이니셔티브를 지원하기 위한 기본 기술 및 인프라 요구 사항을 평가합니다.<\/li><\/ul>", "<h3>작업 4.3: 전사적 변화를 주도하고 AI 지원 인력 역량을 구축합니다.<\/h3>\n<ul><li>기술 4.3.1: 기업 전반에서 추진력을 유지할 수 있는 AI 챔피언을 식별하고 권한을 부여하기 위해 경영진 후원 및 리더십 조율 작업을 수립합니다.<\/li><li>기술 4.3.2: 다양한 전문 영역(예: 비즈니스 리더, 기술 전문가, 법률, 규정 준수)을 대표하는 부서 간 팀을 구성하고 AI 이니셔티브에 대한 명확한 책임 표준을 지정합니다.<\/li><li>기술 4.3.3: AI에 대한 직원의 우려 사항(예: 구현 일정, 성과 기대치, 직원 역할에 미치는 영향)을 해결하는 투명한 커뮤니케이션 전략을 수립합니다.<\/li><li>기술 4.3.4: AI 채택에 대한 문화적 장벽(예: 위험 회피, 변화에 대한 저항, 실패에 대한 두려움)을 인식하고 이러한 문제를 해결하기 위한 리더십 개입을 파악합니다.<\/li><li>기술 4.3.5: 전사적 AI 활용 능력을 가속화하기 위한 적절한 인력 개발 접근 방식을 결정합니다(예: 개념 증명 (POC) 프로그램, 해커톤, 교육 프로그램, 책임 있는 AI 교육).<\/li><li>기술 4.3.6: AI 시스템을 통해 인간의 역할을 수동 운영에서 인간의 감독 및 협업으로 전환할 기회를 식별하고, 인간의 강점(예: 비판적 사고, 공감, 창의성)과 AI 기능의 균형을 맞추는 전략적 결정을 내립니다.<\/li><\/ul>", "<h3>작업 4.4: 파일럿에서 전사적 배포까지 AI의 규모를 조정합니다.<\/h3>\n<ul><li>기술 4.4.1: 여러 단계(예: 구상, 실험, 시작, 규모 조정)를 통해 진행되는 반복적 변환 접근 방식을 적용합니다.<\/li><li>기술 4.4.2: 단기적인 성과로 시작하여 전사적 배포로 이어지는 스케일링 방법론을 구현합니다.<\/li><li>기술 4.4.3: AI 혁신 센터(CoE) 및 부서 간 협업 메커니즘을 구축하여 스케일링을 지원합니다.<\/li><li>기술 4.4.4: 지속적인 피드백 메커니즘과 성공 지표를 수립하여 AI 이니셔티브 진행 상황과 장기적 가치를 추적합니다.<\/li><li>기술 4.4.5: 거버넌스 및 운영 요구 사항을 포함하여 AI 이니셔티브를 실험 수준에서 프로덕션 수준으로 전환하는 문제를 해결합니다.<\/li><li>기술 4.4.6: 기업 전반의 AI 스케일링 이니셔티브 전반에서 여러 요소를 평가하여 비즈니스 연속성과 성능을 보장합니다.<\/li><\/ul>"]}, {"n": "10", "title": "시험에 출제될 수 있는 기술 및 개념", "secs": ["<p>다음 목록에는 시험에 출제될 수 있는 기술 및 개념이 포함되어 있습니다. 이 목록에 모든 사항이 포함된 것은 아니며 변경될 수 있습니다. 이 목록에 나와 있는 다음 항목의 배치와 순서가 시험에서의 상대적 가중치 또는 중요도를 의미하지는 않습니다.<\/p>\n<ul><li>AI, 기계 학습(ML), 생성형 AI(GenAI) 간의 핵심 차이점<\/li><li>AI 모델의 학습, 예측, 시간 경과에 따른 개선 방법<\/li><li>데이터 유형(예: 정형, 비정형) 및 데이터 품질이 AI에 중요한 이유<\/li><li>프롬프트 엔지니어링의 기본 사항 및 유용한 AI 출력을 얻는 방법<\/li><li>컨텍스트 윈도우 및 토큰이 GenAI 성능에 미치는 영향<\/li><li>AI 응답 개선 기법(예: 검색 증강 생성(RAG), 미세 조정)<\/li><li>AI 에이전트의 정의 및 다른 AI 도구와의 차이점<\/li><li>AI 대신 규칙 기반 자동화를 사용해야 하는 경우<\/li><li>AI 시스템에 지속적인 모니터링이 필요한 이유(예: 모델 드리프트, 성능 변경)<\/li><li>승인되지 않은 AI 도구 사용의 위험(섀도 AI) 및 위험 관리 방법<\/li><li>핵심 성과 지표(KPI), 투자 수익률(ROI), 비용 절감 및 생산성 향상을 사용하여 AI 가치 측정<\/li><li>AI 솔루션을 위한 구축-구매-파트너 결정<\/li><li>비즈니스 영향 및 실현 가능성을 기준으로 AI 이니셔티브의 우선순위 지정<\/li><li>책임 있는 AI 원칙(예: 공정성, 설명 가능성, 개인정보 보호, 안전, 투명성)<\/li><li>거버넌스 구조 및 AI 의사 결정을 담당하는 사람<\/li><li>AI 시스템의 위험 분류<\/li><li>AI에 대한 규제 및 규정 준수 고려 사항<\/li><li>인적 관리, 가드레일, 에스컬레이션 시점 파악<\/li><li>일반적인 AI 신뢰성 문제(예: 할루시네이션, 편향, 데이터 품질 저하)<\/li><li>AI 사용 시 지적 재산권(IP) 고려 사항<\/li><li>조직의 AI 준비 상태 및 성숙도 평가<\/li><li>데이터 전략, 데이터 소유권, 데이터 사일로 해체<\/li><li>AI를 위한 선도적인 변화 관리 및 인력 혁신<\/li><li>조직 전반에 AI 활용 능력 구축<\/li><li>파일럿 단계에서 전사적 도입 단계로 AI 스케일링<\/li><li>AI 혁신 센터(COE)<\/li><li><a href=\"https://docs.aws.amazon.com/ko_kr/bedrock/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Bedrock<\/a>, <a href=\"https://docs.aws.amazon.com/ko_kr/sagemaker/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon SageMaker AI<\/a>, <a href=\"https://docs.aws.amazon.com/ko_kr/quick/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Quick<\/a>(전략적 수준)<\/li><li>AWS Cloud Adoption Framework(AWS CAF)<\/li><li>AI 워크로드에 대한 AWS 공동 책임 모델<\/li><li>AWS AI 가격 책정 및 비용 최적화 전략<\/li><li>글로벌 AI 표준 및 프레임워크(예: ISO/IEC 23053, ISO/IEC 42001)<\/li><\/ul>"]}, {"n": "11", "title": "범위 내 AWS 서비스 및 기능", "secs": ["<p>다음 목록은 시험 범위에 포함되는 AWS 서비스 및 기능입니다. 이 목록은 전체 목록이 아니며 변경될 수 있습니다. AWS 제품 및 서비스는 해당 제품 및 서비스의 주요 기능에 맞는 카테고리로 표시됩니다.<\/p>", "<h3>AI 및 기계 학습(기본 애플리케이션만 해당)<\/h3>\n<ul><li><a href=\"https://docs.aws.amazon.com/ko_kr/bedrock/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Bedrock<\/a><\/li><li><a href=\"https://docs.aws.amazon.com/ko_kr/sagemaker/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon SageMaker AI<\/a><\/li><\/ul>", "<h3>비즈니스 인텔리전스(기본 애플리케이션만 해당)<\/h3>\n<ul><li><a href=\"https://docs.aws.amazon.com/ko_kr/quick/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Quick<\/a><\/li><\/ul>", "<h3>클라우드 전략 및 거버넌스<\/h3>\n<ul><li>AWS Cloud Adoption Framework(AWS CAF)<\/li><li>AWS 공동 책임 모델<\/li><\/ul>", "<h3>가격 책정 및 비용 관리<\/h3>\n<ul><li>AWS AI 서비스 가격 책정 구조(예: 사용량 기반, 인스턴스 기반, 사용자 기반)<\/li><li><a href=\"https://docs.aws.amazon.com/ko_kr/cost-management/latest/userguide/ce-what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Cost Explorer<\/a><\/li><li><a href=\"https://docs.aws.amazon.com/ko_kr/marketplace/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Marketplace<\/a><\/li><li><a href=\"https://docs.aws.amazon.com/ko_kr/pricing-calculator/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS 요금 계산기<\/a><\/li><\/ul>"]}, {"n": "12", "title": "범위 외 AWS 서비스 및 기능", "secs": ["<p>이 시험은 기술 구현보다는 AI 전략, 거버넌스 및 비즈니스 혁신에 중점을 둡니다. 시험 범위 밖의 AWS 서비스 및 기능은 다음 범주 및 서비스를 포함하되 이에 국한되지 않습니다.<\/p>\n<ul><li>인프라 및 컴퓨팅(예: <a href=\"https://docs.aws.amazon.com/ko_kr/ec2/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon EC2<\/a>, <a href=\"https://docs.aws.amazon.com/ko_kr/lambda/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Lambda<\/a>)<\/li><li>네트워킹 및 콘텐츠 전송(예: <a href=\"https://docs.aws.amazon.com/ko_kr/vpc/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon VPC<\/a>, <a href=\"https://docs.aws.amazon.com/ko_kr/cloudfront/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon CloudFront<\/a>)<\/li><li>데이터베이스 및 스토리지(예: <a href=\"https://docs.aws.amazon.com/ko_kr/rds/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon RDS<\/a>, <a href=\"https://docs.aws.amazon.com/ko_kr/s3/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon S3<\/a>)<\/li><li>컨테이너 및 오케스트레이션(예: <a href=\"https://docs.aws.amazon.com/ko_kr/ecs/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Elastic Container Service<\/a>(Amazon ECS), <a href=\"https://docs.aws.amazon.com/ko_kr/eks/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Elastic Kubernetes Service<\/a>(Amazon EKS))<\/li><li>개발자 도구 및 DevOps(예: <a href=\"https://docs.aws.amazon.com/ko_kr/codepipeline/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS CodePipeline<\/a>, <a href=\"https://docs.aws.amazon.com/ko_kr/cloudformation/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS CloudFormation<\/a>)<\/li><li>보안 구현 및 구성(예: <a href=\"https://docs.aws.amazon.com/ko_kr/iam/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Identity and Access Management<\/a>(IAM) 정책 쓰기, <a href=\"https://docs.aws.amazon.com/ko_kr/kms/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Key Management Service<\/a> (AWS KMS))<\/li><li>사물 인터넷(IoT), 미디어 및 기타 전문 서비스<\/li><\/ul>\n<p>응시자가 AWS 서비스에 대해 직접 설정, 배포, 또는 관리할 줄 알아야 하는 것은 아닙니다. 이 시험은 전략적 수준에서 AI 서비스를 이해하고 해당 애플리케이션에 대해 정보에 입각한 비즈니스 결정을 내리는 능력을 평가합니다.<\/p>"]}, {"n": "13", "title": "설문 조사", "secs": ["<p>이 시험 안내서가 도움이 되었습니까? 의견은 <a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=AI-Foundational&amp;course_id=AIB-C01&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">설문 조사에 참여하여<\/a> 알려주십시오.<\/p>"]}]}, "ja": {"title": "AWS Certified AI Business Strategist 試験ガイド (AIB-C01)", "note": ["Source: https://docs.aws.amazon.com/ja_jp/aws-certification/latest/ai-business-strategist-01/ai-business-strategist-01.html (retrieved 2026-11-06)"], "ch": [{"n": "1", "title": "AWS Certified AI Business Strategist (AIB-C01)", "secs": ["<p>AWS Certified AI Business Strategist (AIB-C01) 試験は、自社または顧客に対して、AI イニシアチブを評価・推進し、組織全体へスケーリングする役割を担う個人を対象としています。この試験では、AI の能力をビジネス成果へ結び付ける力、責任ある AI 慣行を確立する力、組織全体で AI の導入を推進する力が受験者に備わっていることを検証します。<\/p>"]}, {"n": "2", "title": "はじめに", "secs": ["<p>AWS Certified AI Business Strategist (AIB-C01) 試験は、AI の能力をビジネス成果へ結び付ける力、責任ある AI 慣行を確立する力、AI ソリューションを最適化する機会を評価する力、組織全体で AI の導入を推進する力が備わっていることを検証します。この試験では、AI に関する基礎的なリテラシーを基盤とした、AI 戦略、ガバナンス、組織変革に関する知識を扱います。この試験では、実装に関する技術的な専門知識よりも戦略的意思決定が優先されます。<\/p>\n<p>また、次のタスクについての受験者の能力も検証します。<\/p>\n<ul><li>基本的な AI の概念と用語をビジネスコンテキストに適用する。<\/li><li>ビジネス要件と制約に基づいて適切な AI ソリューションタイプを選択する。<\/li><li>プロンプトエンジニアリングやモデル適応などの生成 AI (GenAI) 手法を利用して、ビジネス成果を達成する。<\/li><li>組織の目標に沿った AI 戦略を策定し、優先順位を付ける。<\/li><li>重要業績評価指標 (KPI)、投資収益率 (ROI) フレームワーク、ベースラインメトリクスを使用して AI のビジネス価値を測定する。<\/li><li>競争優位性とビジネスモデルの変革に向けて AI イニシアチブを位置付ける。<\/li><li>トレードオフを必要とするビジネス上の意思決定を行う際に、責任ある AI の原則を適用する。<\/li><li>ガバナンス構造を確立し、AI イニシアチブの規制コンプライアンスを確保する。<\/li><li>エンタープライズ AI のリスクを特定し、適切な軽減戦略を指示する。<\/li><li>人、プロセス、テクノロジー、ガバナンス全体にわたる組織の AI 準備状況と成熟度を評価する。<\/li><li>AI イニシアチブのサポートに必要なデータ基盤とインフラストラクチャ基盤を評価する。<\/li><li>全社規模の変革管理を主導し、AI に対応するワークフォース能力を構築する。<\/li><li>反復型のアプローチを使用して、AI イニシアチブをパイロットから全社規模のデプロイまでスケーリングする。<\/li><\/ul>"]}, {"n": "3", "title": "受験対象者について", "secs": ["<p>この試験の対象者は、自社または顧客に対して、AI イニシアチブを評価・推進し、組織全体へスケーリングする役割を担うビジネス担当者です。受験対象者は技術チームと連携して業務に携わっていますが、自ら AI ソリューションを構築することはありません。一般的な職務には、プロダクトマネージャー、プログラムマネージャー、セールスプロフェッショナル、基幹業務マネージャー、コンサルタント、マーケティング担当者、ビジネスアナリストなどがあります。コーディングや実践的な AWS の実装経験は必要ありません。受験対象者は、AI の概念に関する基本的な知識を持ち、ビジネスレベルで AWS の AI サービスが提供する機能を全般的に把握している必要があります (サービスの実務経験は必要ありません)。AI を導入しているチームで、またはそのようなチームと連携して業務に携わった経験が 6 か月あることが推奨されます。これらのプロフェッショナルには、レコメンデーションエンジン、自然言語処理 (NLP)、コンピュータービジョン、文書抽出、顧客業務用の AI など、AI ツールとそのビジネスアプリケーションの一般的なカテゴリーを把握していることが期待されます。これらのソリューションを設定または構築している必要はありません。<\/p>", "<h3>推奨される AWS の知識<\/h3>\n<p>受験対象者は、ビジネスアプリケーションを含め、戦略的レベルで AWS の AI および機械学習 (ML) サービスに精通している必要があります。実装に関する技術的な専門知識は必要ありません。<\/p>\n<p>次のサービスに大まかに精通していること<\/p>\n<ul><li><a href=\"https://docs.aws.amazon.com/ja_jp/bedrock/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Bedrock<\/a> [生成 AI (GenAI) プラットフォーム、料金階層、ガードレール、ナレッジベース]<\/li><li><a href=\"https://docs.aws.amazon.com/ja_jp/sagemaker/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon SageMaker AI<\/a> (カスタム ML、マネージドソリューションまたはカスタムソリューションを使用すべき場合)<\/li><li><a href=\"https://docs.aws.amazon.com/ja_jp/quick/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Quick<\/a> (AI 搭載ビジネスアシスタント)<\/li><\/ul>\n<p>責任あるスケーラブルな AI 導入をサポートする AWS フレームワークとガイドラインに精通していること<\/p>\n<ul><li>組織全体にわたる AI イニシアチブの計画とスケーリングのための AWS Cloud Adoption Framework (AWS CAF)<\/li><li>ガバナンスレベルでのデータセキュリティとコンプライアンスを含む、AI ワークロードの AWS 責任共有モデル<\/li><li>ガバナンスのベストプラクティスのための AWS Well-Architected フレームワーク (責任ある AI Lens)<\/li><\/ul>\n<p>ビジネスケース開発と投資収益率 (ROI) 分析をサポートする AWS のツールに精通していること<\/p>\n<ul><li>AWS の AI サービスの料金体系 (使用量ベース、インスタンスベース、シートベースなど)<\/li><li>コスト最適化戦略 (<a href=\"https://docs.aws.amazon.com/ja_jp/savingsplans/\" target=\"_blank\" rel=\"noopener noreferrer\">Savings Plans<\/a> など)<\/li><li>コスト計画のための <a href=\"https://docs.aws.amazon.com/ja_jp/pricing-calculator/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS 料金見積りツール<\/a>と <a href=\"https://docs.aws.amazon.com/ja_jp/cost-management/latest/userguide/ce-what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Cost Explorer<\/a><\/li><li>ビルドバイパートナーの意思決定を評価するための <a href=\"https://docs.aws.amazon.com/ja_jp/marketplace/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Marketplace<\/a><\/li><\/ul>", "<h3>受験対象者にとって試験対象外となるジョブタスク<\/h3>\n<p>受験対象者が実施できることが想定されていないジョブタスクは、次のリストのとおりです。このリストはすべてを網羅しているわけではありません。次のタスクは、本試験の範囲外です。<\/p>\n<ul><li>AI と ML のモデルまたはアルゴリズムの開発またはコーディング<\/li><li>データエンジニアリング手法や特徴量エンジニアリング手法の実装<\/li><li>ハイパーパラメータのチューニングまたはモデル最適化の実行<\/li><li>AI と ML のパイプラインまたはインフラストラクチャの構築とデプロイ<\/li><li>AI と ML のモデルの数学的または統計的分析の実施<\/li><li>AI と ML のシステムのセキュリティまたはコンプライアンスプロトコルの実装<\/li><li>AWS のサービスまたはクラウドインフラストラクチャの設定、デプロイ、管理<\/li><li>AI ソリューション用の特定のアルゴリズム、フレームワーク、技術アーキテクチャの選択またはチューニング<\/li><li>実践的なデータの前処理、クリーニング、ラベル付け、注釈の実行<\/li><li>本番環境における AI システムの技術的運用の管理 (インフラストラクチャのモニタリング、パイプラインのデバッグ、モデルパフォーマンスのトラブルシューティングなど)<\/li><\/ul>"]}, {"n": "4", "title": "試験内容", "secs": ["", "<h3>設問の種類<\/h3>\n<p>試験には、次の出題形式が 1 つ以上含まれています。<\/p>\n<ul><li><strong>択一選択問題:<\/strong> 正しい選択肢が 1 つ、誤った選択肢 (不正解) が 3 つ提示される。<\/li><li><strong>複数選択問題:<\/strong> 5 つ以上の選択肢のうち、正解が 2 つ以上ある。設問に対する点数を得るには、正解をすべて選択する必要がある。<\/li><\/ul>\n<p>未解答の設問は不正解とみなされます。推測による解答にペナルティはありません。<\/p>", "<h3>試験時間<\/h3>\n<p>試験時間は 130 分です。<\/p>", "<h3>試験の結果<\/h3>\n<p>AWS Certified AI Business Strategist (AIB-C01) 試験は、合否判定方式です。¹ 試験の採点は、認定業界のベストプラクティスおよびガイドラインに基づいた、AWS の専門家によって定められる最低基準に照らして行われます。<\/p>\n<blockquote><p>¹ ベータテストの詳細については、 <a href=\"https://aws.amazon.com/certification/policies/before-testing/\" target=\"_blank\" rel=\"noopener noreferrer\">試験前のポリシー<\/a>をご覧ください。<\/p><\/blockquote>\n<p>試験の結果は、100～1,000 の換算スコアとして報告されます。合格スコアは 700 です。このスコアにより、試験全体の成績と合否がわかります。複数の試験間で難易度がわずかに異なる可能性があるため、スコアを均等化するために換算スコアが使用されます。<\/p>\n<p>スコアレポートには、各セクションの成績を示す分類表が含まれる場合があります。試験には補整スコアリングモデルが使用されるため、セクションごとに合否ラインは設定されておらず、試験全体のスコアで合否が判定されます。<\/p>\n<p>試験の各セクションには特定の重みが設定されているため、各セクションに割り当てられる設問数が異なる場合があります。分類表には、受験者の得意分野と不得意分野を示す全般的な情報が含まれます。セクションごとのフィードバックを解釈する際は注意してください。<\/p>"]}, {"n": "5", "title": "試験内容の概要", "secs": ["<p>この試験ガイドには、試験に設定された重み、コンテンツ分野、タスク、スキルについての説明が含まれています。本ガイドは、試験内容の包括的なリストを提供するものではありません。<\/p>\n<p>本試験のコンテンツ分野と重み設定は、次のとおりです。<\/p>\n<ul><li>コンテンツ分野 1: AI の基礎とリテラシー (採点対象コンテンツの 24%)<\/li><li>コンテンツ分野 2: AI 戦略とビジネス価値の創造 (採点対象コンテンツの 28%)<\/li><li>コンテンツ分野 3: AI ガバナンスと責任ある AI リーダーシップ (採点対象コンテンツの 24%)<\/li><li>コンテンツ分野 4: ビジネス準備状況、リーダーシップ、AI トランスフォーメーション (採点対象コンテンツの 24%)<\/li><\/ul>"]}, {"n": "6", "title": "コンテンツ分野 1: AI の基礎とリテラシー", "secs": ["", "<h3>タスク 1.1: AI の主要な概念を説明し、用語を定義する。<\/h3>\n<ul><li>スキル 1.1.1: ビジネスコンテキストにおける基本的な AI の概念 (アルゴリズム、モデル、トレーニング、推論、予測など) を認識して説明する。<\/li><li>スキル 1.1.2: AI、機械学習 (ML)、生成 AI (GenAI) を区別する。<\/li><li>スキル 1.1.3: 構造化データと非構造化データを区別し、AI におけるデータ型の関連性を説明する。<\/li><li>スキル 1.1.4: データ品質が AI の成果にとって重要である理由を説明する。<\/li><li>スキル 1.1.5: 履歴データを使用して AI モデルのトレーニングに関連する概念を説明する。<\/li><li>スキル 1.1.6: グローバルなフレームワークと統一された AI ボキャブラリー (ISO/IEC 23053、ISO/IEC 42001 など) を確実に認識する。<\/li><\/ul>", "<h3>タスク 1.2: 適切な AI ソリューションタイプを特定して選択する。<\/h3>\n<ul><li>スキル 1.2.1: ルールベースのオートメーションを使用すべき場合と AI ソリューションを使用すべき場合を判断する。<\/li><li>スキル 1.2.2: AI エージェントを他の AI ソリューションと区別し、AI エージェントのコア機能 (自律性、ツールの使用、エージェント間のコミュニケーション、オーケストレーション戦略など) を特定する。<\/li><li>スキル 1.2.3: モデルドリフトやパフォーマンスの変化を検出して修正するために、AI ソリューションが継続的なモニタリングと更新を必要とする理由を説明する。<\/li><li>スキル 1.2.4: シャドー AI のリスクを軽減するために、AI ツールの透明性の高い分類 (承認済み、ブロック済み、評価中など) を確立する。<\/li><\/ul>", "<h3>タスク 1.3: GenAI の概念と手法を適用する。<\/h3>\n<ul><li>スキル 1.3.1: プロンプトエンジニアリングの基本的な原則を適用して、目的の AI 出力を達成する。<\/li><li>スキル 1.3.2: トークンの制限やコンテキストウィンドウの制約が GenAI システムのパフォーマンスに影響を与える場合を特定する。<\/li><li>スキル 1.3.3: モデル適応手法 [検索拡張生成 (RAG)、ファインチューニングなど] が、特定のビジネスニーズに対する AI の応答をどのように改善するかを認識する。<\/li><\/ul>"]}, {"n": "7", "title": "コンテンツ分野 2: AI 戦略とビジネス価値の創造", "secs": ["", "<h3>タスク 2.1: ビジネス目標に沿った AI 戦略を策定する。<\/h3>\n<ul><li>スキル 2.1.1: ビジネス機能 (顧客業務、セールスおよびマーケティング、研究開発、ソフトウェア開発など) 全体で影響力の大きい AI ユースケースを特定し、AI の能力を個別のビジネス成果に結び付ける。<\/li><li>スキル 2.1.2: AI 実装に関するビルドバイパートナーの決定を (予算、タイムライン、機能、ベンダーの提案、規制コンプライアンス要件などの要素を考慮して) 評価する。<\/li><li>スキル 2.1.3: ビジネス価値、実現可能性、持続可能性、戦略的連携に基づいて、(スケーリング、一時停止、終了を決定することにより) AI イニシアチブに優先順位を付ける。<\/li><li>スキル 2.1.4: AI がビジネス上の問題に対する適切なソリューションではない場合を判断する。<\/li><li>スキル 2.1.5: ビジネスプロセスを AI ベースのソリューションに移行する、または AI プラットフォーム間で移行する準備をする際の主な考慮事項 (事業の継続性、コストへの影響、データ準備状況、パフォーマンスへの影響など) を評価する。<\/li><\/ul>", "<h3>タスク 2.2: AI のビジネス価値を測定して実証する。<\/h3>\n<ul><li>スキル 2.2.1: 目に見える利益 (コスト削減、収益増加など) と目に見えない利益 (顧客満足度、従業員の生産性など) を含む、AI イニシアチブの重要業績評価指標 (KPI) を定義する。<\/li><li>スキル 2.2.2: AI ソリューションを実装する前に、AI の導入効果を正確に測定するためのベースラインメトリクスを確立する。<\/li><li>スキル 2.2.3: 包括的なフレームワーク (時間短縮、コスト削減、収益増加、生産性向上など) を使用して、AI の投資収益率 (ROI) を計算する。<\/li><li>スキル 2.2.4: AI プロジェクトの成功を予測する先行指標を特定する。<\/li><li>スキル 2.2.5: コスト計画や最適化戦略を含む、AI 実装の基本的なコスト要因管理を実装する。<\/li><\/ul>", "<h3>タスク 2.3: 競争優位性の向上に向けて AI を位置付ける。<\/h3>\n<ul><li>スキル 2.3.1: 競合環境を評価し、AI 導入の利点を特定する。<\/li><li>スキル 2.3.2: AI ソリューションを使用してビジネスモデルを変革する機会を特定する。<\/li><li>スキル 2.3.3: AI が持続可能な競争優位性と業務改善をどのように実現するかを説明する。<\/li><li>スキル 2.3.4: 業界の成熟度と競争のダイナミクスに基づいて、適切な AI 投資レベルを決定する。<\/li><\/ul>"]}, {"n": "8", "title": "コンテンツ分野 3: AI ガバナンスと責任ある AI リーダーシップ", "secs": ["", "<h3>タスク 3.1: 責任ある AI の原則をビジネス上の意思決定に適用する。<\/h3>\n<ul><li>スキル 3.1.1: 責任ある AI の原則とディメンション (公平性、説明可能性、プライバシー、安全性、透明性、堅牢性など) をビジネスシナリオに適用する。<\/li><li>スキル 3.1.2: ビジネス目標が責任ある AI の原則と矛盾する場合に、トレードオフのバランスを適切に取る。<\/li><li>スキル 3.1.3: ガバナンスバイデザインを確保するために、責任ある AI の実践を AI プロジェクト計画に統合すべき場合を特定する。<\/li><li>スキル 3.1.4: AI システムが人による監視を必要とする状況を認識し、適切な保護手段 (ハルシネーションの検出、ガードレール、エスカレーション基準など) を特定する。<\/li><\/ul>", "<h3>タスク 3.2: AI ガバナンス構造を確立し、規制コンプライアンスを確保する。<\/h3>\n<ul><li>スキル 3.2.1: 部門横断的な適切な表現と明確な説明責任を備えた AI ガバナンス構造を確立する。<\/li><li>スキル 3.2.2: AI を使用するビジネスプロセスの規制コンプライアンスリスクを特定して対処する。<\/li><li>スキル 3.2.3: AI システムの適切なアクセス制御とデータセキュリティ対策を特定する。<\/li><li>スキル 3.2.4: AI リスク分類フレームワークを適用して、AI ライフサイクル全体でガバナンスとコンプライアンスに関する決定に優先順位を付ける。<\/li><\/ul>", "<h3>タスク 3.3: エンタープライズ AI のリスクと直接的な軽減戦略を特定する。<\/h3>\n<ul><li>スキル 3.3.1: 本番環境における AI システムのリスク管理とモニタリングメカニズムの必要性を特定する。<\/li><li>スキル 3.3.2: バイアスは AI ライフサイクルの複数の段階で発生する可能性があることを認識し、バイアスドリフトを継続的にモニタリングすることの重要性を説明する。<\/li><li>スキル 3.3.3: AI システムの有害なコンテンツリスクと知的財産 (IP) の懸念を管理する。<\/li><li>スキル 3.3.4: AI システムの信頼性に関連するリスク (ハルシネーション、データ品質の低下、モデルドリフトなど) を特定して軽減する。<\/li><\/ul>"]}, {"n": "9", "title": "コンテンツ分野 4: ビジネス準備状況、リーダーシップ、AI トランスフォーメーション", "secs": ["", "<h3>タスク 4.1: AI に対するビジネス準備状況と成熟度を評価する。<\/h3>\n<ul><li>スキル 4.1.1: 重要なディメンション (リーダーシップの連携、データ品質、文化的な準備、技術インフラストラクチャ、ガバナンスフレームワークなど) 全体で AI を導入するためのビジネス準備状況を評価する。<\/li><li>スキル 4.1.2: AI 成熟度モデルを適用して、企業全体が AI ジャーニーのどの段階にあるかを評価する (実験、全社規模のデプロイなど)。<\/li><li>スキル 4.1.3: AI トランスフォーメーションの成功を妨げている人、プロセス、テクノロジー、ガバナンスにおける具体的な能力ギャップを特定する。<\/li><li>スキル 4.1.4: 戦略的目標と現在のビジネス成熟度レベルに基づいて、開発投資に優先順位を付け、今後の進め方を決定する。<\/li><\/ul>", "<h3>タスク 4.2: AI のデータおよびインフラストラクチャ基盤を確立する。<\/h3>\n<ul><li>スキル 4.2.1: データ品質、アクセシビリティ、データサイロが AI イニシアチブに与える影響などの、データ準備状況を評価する。<\/li><li>スキル 4.2.2: AI の基盤となるデータ戦略、データ所有権、データ共有フレームワークの重要性を説明する。<\/li><li>スキル 4.2.3: AI イニシアチブをサポートするための基本的なテクノロジーとインフラストラクチャの要件を評価する。<\/li><\/ul>", "<h3>タスク 4.3: 全社規模の変革を主導し、AI に対応できるワークフォース能力を構築する。<\/h3>\n<ul><li>スキル 4.3.1: 経営幹部の支援を確立し、リーダーシップの足並みを揃えて、全社で勢いを維持できる AI 活用の推進役を特定し、サポートする。<\/li><li>スキル 4.3.2: さまざまな専門分野 (ビジネスリーダー、技術エキスパート、法務、コンプライアンスなど) を代表する部門横断的なチームを作り、AI イニシアチブのための明確な説明責任基準を割り当てる。<\/li><li>スキル 4.3.3: AI に関するワークフォースの懸念 (実装期限、期待される成果、ワークフォースの職務への影響など) に対処する透明性の高いコミュニケーション戦略を策定する。<\/li><li>スキル 4.3.4: AI の導入を妨げる文化的障壁 (リスク回避、変化への抵抗、失敗への恐れなど) を認識し、これらの懸念に対処するために必要なリーダーシップによる介入を特定する。<\/li><li>スキル 4.3.5: 全社規模で AI に関するリテラシーを促進するための適切なワークフォース開発アプローチ [概念実証 (POC) プログラム、ハッカソン、トレーニングプログラム、責任ある AI のトレーニングなど] を決定する。<\/li><li>スキル 4.3.6: 人の職務を手動のオペレーションから人による監督や AI システムとのコラボレーションに移行する機会を特定し、人の強み (批判的思考、共感、創造性など) と AI の能力のバランスを取る戦略的意思決定を行う。<\/li><\/ul>", "<h3>タスク 4.4: AI をパイロットから全社規模のデプロイまでスケーリングする。<\/h3>\n<ul><li>スキル 4.4.1: 各フェーズ (構想、実験、起動、スケーリングなど) を経る反復的な変革アプローチを適用する。<\/li><li>スキル 4.4.2: 短期的な成果から始め、全社規模のデプロイに向けて構築を行うスケーリング手法を実装する。<\/li><li>スキル 4.4.3: スケーリングをサポートするために、AI センターオブエクセレンス (COE) と部門横断的なコラボレーションメカニズムを確立する。<\/li><li>スキル 4.4.4: 継続的なフィードバックメカニズムと成功メトリクスを確立して、AI イニシアチブの進捗状況と長期的価値を追跡する。<\/li><li>スキル 4.4.5: ガバナンスや運用上の要件を含め、AI イニシアチブの実験段階から本番環境対応レベルへの移行に対処する。<\/li><li>スキル 4.4.6: 全社的な AI のスケーリングイニシアチブにおける多様な要素を評価して、事業の継続性とパフォーマンスを実現する。<\/li><\/ul>"]}, {"n": "10", "title": "試験に出題される可能性のあるテクノロジーと概念", "secs": ["<p>以下は、試験に出題される可能性のあるテクノロジーと概念のリストです。このリストはすべてを網羅しているわけではなく、また、変更される場合もあります。このリストにおける項目の掲載順序や配置は、その項目の相対的な重みや試験における重要性を示すものではありません。<\/p>\n<ul><li>AI、機械学習 (ML)、生成 AI (GenAI) の主な違い<\/li><li>AI モデルのトレーニング、予測、時間の経過に伴う改善の方法<\/li><li>データの種類 (構造化データ、非構造化データなど)、AI にとってデータ品質が重要な理由<\/li><li>プロンプトエンジニアリングの基礎、有用な AI 出力の取得方法<\/li><li>コンテキストウィンドウとトークンが GenAI のパフォーマンスに与える影響<\/li><li>AI 応答を改善するための手法 [検索拡張生成 (RAG)、ファインチューニングなど]<\/li><li>AI エージェントとは何か、他の AI ツールとの違い<\/li><li>AI の代わりにルールベースのオートメーションを使用すべきケース<\/li><li>AI システムに継続的なモニタリングが必要な理由 (モデルドリフト、パフォーマンスの変化など)<\/li><li>未承認 AI ツール (シャドー AI) を使用するリスク、リスクの管理方法<\/li><li>重要業績評価指標 (KPI)、投資収益率 (ROI)、コスト削減、生産性向上を使用した、AI の価値の測定<\/li><li>AI ソリューションに関するビルドバイパートナーの決定<\/li><li>ビジネスへの影響と実現可能性による AI イニシアチブの優先順位付け<\/li><li>責任ある AI の原則 (公平性、説明可能性、プライバシー、安全性、透明性など)<\/li><li>ガバナンス構造と AI に関する意思決定責任者<\/li><li>AI システムのリスク分類<\/li><li>AI における規制とコンプライアンスに関する考慮事項<\/li><li>人による監視、ガードレール、エスカレーションすべき場合の把握<\/li><li>AI の信頼性に関する一般的な問題 (ハルシネーション、バイアス、データ品質の低下など)<\/li><li>AI を使用する際の知的財産 (IP) に関する考慮事項<\/li><li>AI に対する組織の準備状況と成熟度の評価<\/li><li>データ戦略、データ所有権、データサイロの解消<\/li><li>AI のための変更管理とワークフォース変革の主導<\/li><li>組織全体での AI に関するリテラシーの構築<\/li><li>パイロットから全社規模の導入までの AI のスケーリング<\/li><li>AI センターオブエクセレンス (COE)<\/li><li><a href=\"https://docs.aws.amazon.com/ja_jp/bedrock/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Bedrock<\/a>、<a href=\"https://docs.aws.amazon.com/ja_jp/sagemaker/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon SageMaker AI<\/a>、<a href=\"https://docs.aws.amazon.com/ja_jp/quick/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Quick<\/a> (戦略的レベル)<\/li><li>AWS クラウド導入フレームワーク (AWS CAF)<\/li><li>AWS AI ワークロードの責任共有モデル<\/li><li>AWS AI の料金とコスト最適化の戦略<\/li><li>グローバルな AI 標準とフレームワーク (ISO/IEC 23053、ISO/IEC 42001 など)<\/li><\/ul>"]}, {"n": "11", "title": "対象の AWS のサービスと機能", "secs": ["<p>以下に、試験の対象となる AWS のサービスと機能のリストを示します。このリストはすべてを網羅しているわけではなく、また、変更される場合もあります。AWS のサービスは、サービスの主要機能に沿ったカテゴリに分類されています。<\/p>", "<h3>AI と機械学習 (基礎的な活用のみ)<\/h3>\n<ul><li><a href=\"https://docs.aws.amazon.com/ja_jp/bedrock/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Bedrock<\/a><\/li><li><a href=\"https://docs.aws.amazon.com/ja_jp/sagemaker/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon SageMaker AI<\/a><\/li><\/ul>", "<h3>ビジネスインテリジェンス (基礎的な活用のみ)<\/h3>\n<ul><li><a href=\"https://docs.aws.amazon.com/ja_jp/quick/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Quick<\/a><\/li><\/ul>", "<h3>クラウド戦略とガバナンス<\/h3>\n<ul><li>AWS クラウド導入フレームワーク (AWS CAF)<\/li><li>AWS の責任共有モデル<\/li><\/ul>", "<h3>料金とコスト管理<\/h3>\n<ul><li>AWS の AI サービスの料金体系 (使用量ベース、インスタンスベース、シートベースなど)<\/li><li><a href=\"https://docs.aws.amazon.com/ja_jp/cost-management/latest/userguide/ce-what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Cost Explorer<\/a><\/li><li><a href=\"https://docs.aws.amazon.com/ja_jp/marketplace/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Marketplace<\/a><\/li><li><a href=\"https://docs.aws.amazon.com/ja_jp/pricing-calculator/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS 料金見積りツール<\/a><\/li><\/ul>"]}, {"n": "12", "title": "対象外の AWS のサービスと機能", "secs": ["<p>この試験は、実装に関する技術的な専門知識ではなく、AI 戦略、ガバナンス、ビジネス変革に重点を置いています。対象リストにない AWS のサービスや機能は対象外です。これには以下のカテゴリやサービスが含まれますが、これらに限定されません。<\/p>\n<ul><li>インフラストラクチャとコンピューティング (<a href=\"https://docs.aws.amazon.com/ja_jp/ec2/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon EC2<\/a>、<a href=\"https://docs.aws.amazon.com/ja_jp/lambda/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Lambda<\/a> など)<\/li><li>ネットワークとコンテンツ配信 (<a href=\"https://docs.aws.amazon.com/ja_jp/vpc/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon VPC<\/a>、<a href=\"https://docs.aws.amazon.com/ja_jp/cloudfront/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon CloudFront<\/a> など)<\/li><li>データベースとストレージ (<a href=\"https://docs.aws.amazon.com/ja_jp/rds/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon RDS<\/a>、<a href=\"https://docs.aws.amazon.com/ja_jp/s3/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon S3<\/a> など)<\/li><li>コンテナとオーケストレーション [<a href=\"https://docs.aws.amazon.com/ja_jp/ecs/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Elastic Container Service<\/a> (Amazon ECS)、<a href=\"https://docs.aws.amazon.com/ja_jp/eks/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Elastic Kubernetes Service<\/a> (Amazon EKS) など]<\/li><li>デベロッパーツールと DevOps (<a href=\"https://docs.aws.amazon.com/ja_jp/codepipeline/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS CodePipeline<\/a>、<a href=\"https://docs.aws.amazon.com/ja_jp/cloudformation/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS CloudFormation<\/a> など)<\/li><li>セキュリティの実装と設定 [<a href=\"https://docs.aws.amazon.com/ja_jp/iam/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Identity and Access Management<\/a> (IAM) ポリシーの記述、<a href=\"https://docs.aws.amazon.com/ja_jp/kms/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Key Management Service<\/a> (AWS KMS) など]<\/li><li>モノのインターネット (IoT)、メディア、その他の専門サービス<\/li><\/ul>\n<p>受験者は、AWS のサービスの設定、デプロイ、管理の方法を知っていることは期待されていません。この試験では、AI サービスを戦略的レベルで理解し、その活用について情報に基づいたビジネス上の意思決定を行う能力を評価します。<\/p>"]}, {"n": "13", "title": "アンケート", "secs": ["<p>この試験ガイドはどの程度役に立ちましたか。ご意見をお待ちしています。<a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=AI-Foundational&amp;course_id=AIB-C01&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">アンケートへの回答<\/a>にご協力ください。<\/p>"]}]}, "en": {"title": "AWS Certified AI Business Strategist (AIB-C01) Exam Guide", "note": ["Source: https://docs.aws.amazon.com/aws-certification/latest/ai-business-strategist-01/ai-business-strategist-01.html (retrieved 2026-11-06)"], "ch": [{"n": "1", "title": "AWS Certified AI Business Strategist (AIB-C01)", "secs": ["<p>The AWS Certified AI Business Strategist (AIB-C01) exam is intended for individuals who evaluate, champion, or scale AI initiatives in their organizations or for their clients. The exam validates a candidate's ability to translate AI capabilities into business outcomes, establish responsible AI practices, and drive AI adoption at scale.<\/p>"]}, {"n": "2", "title": "Introduction", "secs": ["<p>The AWS Certified AI Business Strategist (AIB-C01) exam validates a business professional's ability to translate AI capabilities into business outcomes, establish responsible AI practices, evaluate opportunities to optimize AI solutions, and drive AI adoption at scale. The exam covers AI strategy, governance, and organizational transformation grounded in foundational AI literacy. The exam prioritizes strategic decision-making over technical implementation.<\/p>\n<p>The exam also validates a candidate's ability to complete the following tasks:<\/p>\n<ul><li>Apply foundational AI concepts and terminology to business contexts.<\/li><li>Select appropriate AI solution types based on business requirements and constraints.<\/li><li>Use generative AI (GenAI) techniques, including prompt engineering and model adaptation, to achieve business outcomes.<\/li><li>Develop and prioritize AI strategies that align with organizational objectives.<\/li><li>Measure AI business value using key performance indicators (KPIs), return on investment (ROI) frameworks, and baseline metrics.<\/li><li>Position AI initiatives for competitive advantage and business model transformation.<\/li><li>Apply responsible AI principles when making business decisions that require tradeoffs.<\/li><li>Establish governance structures and ensure regulatory compliance for AI initiatives.<\/li><li>Identify enterprise AI risks and direct appropriate mitigation strategies.<\/li><li>Assess organizational AI readiness and maturity across people, processes, technology, and governance.<\/li><li>Evaluate data and infrastructure foundations required to support AI initiatives.<\/li><li>Lead enterprise-wide change management and build AI-ready workforce capabilities.<\/li><li>Scale AI initiatives from pilots to enterprise-wide deployments by using iterative approaches.<\/li><\/ul>"]}, {"n": "3", "title": "Target candidate description", "secs": ["<p>The target candidate is a business professional who evaluates, champions, or scales AI initiatives in their organization or for their clients. The target candidate works alongside technical teams but does not build AI solutions themselves. Typical roles include product managers, program managers, sales professionals, line-of-business managers, consultants, marketers, and business analysts. No coding or hands-on AWS implementation experience is required. The target candidate should have a basic familiarity with AI concepts, and a general awareness of what AWS AI services offer at a business level (without needing hands-on experience with the services). A baseline of 6 months of experience working with or alongside teams adopting AI is recommended. These professionals are expected to recognize common categories of AI tools and their business applications, such as recommendation engines, natural language processing (NLP), computer vision, document extraction, and AI for customer operations, without needing to configure or build these solutions.<\/p>", "<h3>Recommended AWS knowledge<\/h3>\n<p>The target candidate should have familiarity with AWS AI and machine learning (ML) service offerings at a strategic level, including their business applications. Technical implementation expertise is not required.<\/p>\n<p>Familiarity with the following services at a high level:<\/p>\n<ul><li><a href=\"https://docs.aws.amazon.com/bedrock/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Bedrock<\/a> (generative AI [GenAI] platform, pricing tiers, Guardrails, Knowledge Bases)<\/li><li><a href=\"https://docs.aws.amazon.com/sagemaker/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon SageMaker AI<\/a> (custom ML and when to use managed or custom solutions)<\/li><li><a href=\"https://docs.aws.amazon.com/quick/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Quick<\/a> (AI-powered business assistants)<\/li><\/ul>\n<p>Familiarity with AWS frameworks and guidelines that support responsible, scalable AI adoption:<\/p>\n<ul><li>AWS Cloud Adoption Framework (AWS CAF) for planning and scaling AI initiatives across an organization<\/li><li>AWS shared responsibility model for AI workloads, including data security and compliance at a governance level<\/li><li>AWS Well-Architected Framework (Responsible AI Lens) for governance best practices<\/li><\/ul>\n<p>Familiarity with AWS tools that support business case development and return on investment (ROI) analysis:<\/p>\n<ul><li>AWS AI service pricing structures (for example, consumption-based, instance-based, seat-based)<\/li><li>Cost optimization strategies (for example, <a href=\"https://docs.aws.amazon.com/savingsplans/\" target=\"_blank\" rel=\"noopener noreferrer\">Savings Plans<\/a>)<\/li><li><a href=\"https://docs.aws.amazon.com/pricing-calculator/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Pricing Calculator<\/a> and <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Cost Explorer<\/a> for cost planning<\/li><li><a href=\"https://docs.aws.amazon.com/marketplace/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Marketplace<\/a> for evaluating build-buy-partner decisions<\/li><\/ul>", "<h3>Job tasks that are out of scope for the target candidate<\/h3>\n<p>The following list contains job tasks that the target candidate is not expected to be able to perform. This list is non-exhaustive. The following tasks are out of scope for the exam:<\/p>\n<ul><li>Developing or coding AI and ML models or algorithms<\/li><li>Implementing data engineering or feature engineering techniques<\/li><li>Performing hyperparameter tuning or model optimization<\/li><li>Building and deploying AI and ML pipelines or infrastructure<\/li><li>Conducting mathematical or statistical analysis of AI and ML models<\/li><li>Implementing security or compliance protocols for AI and ML systems<\/li><li>Configuring, deploying, or administering AWS services or cloud infrastructure<\/li><li>Selecting or tuning specific algorithms, frameworks, or technical architectures for AI solutions<\/li><li>Performing hands-on data pre-processing, cleaning, labeling, or annotation<\/li><li>Managing technical operations of AI systems in production (for example, monitoring infrastructure, debugging pipelines, troubleshooting model performance)<\/li><\/ul>"]}, {"n": "4", "title": "Exam content", "secs": ["", "<h3>Question types<\/h3>\n<p>The exam contains one or more of the following question types:<\/p>\n<ul><li><strong>Multiple choice:<\/strong> Has one correct response and three incorrect responses (distractors).<\/li><li><strong>Multiple response:<\/strong> Has two or more correct responses out of five or more response options. You must select all the correct responses to receive credit for the question.<\/li><\/ul>\n<p>Unanswered questions are scored as incorrect. There is no penalty for guessing.<\/p>", "<h3>Exam duration<\/h3>\n<p>You will have 130 minutes to complete your exam.<\/p>", "<h3>Exam results<\/h3>\n<p>The AWS Certified AI Business Strategist (AIB-C01) exam has a pass or fail designation.¹ The exam is scored against a minimum standard established by AWS professionals who follow certification industry best practices and guidelines.<\/p>\n<blockquote><p>¹ For additional information on beta testing, see <a href=\"https://aws.amazon.com/certification/policies/before-testing/\" target=\"_blank\" rel=\"noopener noreferrer\">Before Testing policies<\/a>.<\/p><\/blockquote>\n<p>Your results for the exam are reported as a scaled score of 100–1,000. The minimum passing score is 700. Your score shows how you performed on the exam as a whole and whether you passed. Scaled scoring models help equate scores across multiple exam forms that might have slightly different difficulty levels.<\/p>\n<p>Your score report could contain a table of classifications of your performance at each section level. The exam uses a compensatory scoring model, which means that you do not need to achieve a passing score in each section. You need to pass only the overall exam.<\/p>\n<p>Each section of the exam has a specific weighting, so some sections have more questions than other sections have. The table of classifications contains general information that highlights your strengths and weaknesses. Use caution when you interpret section-level feedback.<\/p>"]}, {"n": "5", "title": "Content outline", "secs": ["<p>This exam guide includes weightings, content domains, tasks, and skills for the exam. This guide does not provide a comprehensive list of the content on the exam.<\/p>\n<p>The exam has the following content domains and weightings:<\/p>\n<ul><li>Content Domain 1: AI Fundamentals and Literacy (24% of scored content)<\/li><li>Content Domain 2: AI Strategy and Business Value Creation (28% of scored content)<\/li><li>Content Domain 3: AI Governance and Responsible AI Leadership (24% of scored content)<\/li><li>Content Domain 4: Business Readiness, Leadership, and AI Transformation (24% of scored content)<\/li><\/ul>"]}, {"n": "6", "title": "Content Domain 1: AI Fundamentals and Literacy", "secs": ["", "<h3>Task 1.1: Describe core AI concepts and define terminology.<\/h3>\n<ul><li>Skill 1.1.1: Recognize and explain fundamental AI concepts in business contexts (for example, algorithms, models, training, inference, predictions).<\/li><li>Skill 1.1.2: Distinguish between AI, machine learning (ML), and generative AI (GenAI).<\/li><li>Skill 1.1.3: Distinguish between structured and unstructured data and explain the relevance of data types for AI.<\/li><li>Skill 1.1.4: Describe why data quality matters for AI outcomes.<\/li><li>Skill 1.1.5: Explain concepts related to training an AI model by using historical data.<\/li><li>Skill 1.1.6: Ensure awareness of global frameworks and unified AI vocabulary (for example, ISO/IEC 23053, ISO/IEC 42001).<\/li><\/ul>", "<h3>Task 1.2: Identify and select appropriate AI solution types.<\/h3>\n<ul><li>Skill 1.2.1: Determine when to use rule-based automation and when to use AI solutions.<\/li><li>Skill 1.2.2: Distinguish AI agents from other AI solutions and identify the core capabilities of AI agents (for example, autonomy, tool use, agent-to-agent communication, and orchestration strategies).<\/li><li>Skill 1.2.3: Describe why AI solutions require ongoing monitoring and updates to detect and remediate model drift and performance changes.<\/li><li>Skill 1.2.4: Establish transparent classification of AI tools (for example, approved, blocked, under evaluation) to mitigate shadow AI risks.<\/li><\/ul>", "<h3>Task 1.3: Apply GenAI concepts and techniques.<\/h3>\n<ul><li>Skill 1.3.1: Apply basic prompt engineering principles to achieve desired AI outputs.<\/li><li>Skill 1.3.2: Identify when token limits or context window constraints affect GenAI system performance.<\/li><li>Skill 1.3.3: Recognize how model adaptation techniques (for example, Retrieval Augmented Generation [RAG], fine-tuning) improve AI responses for specific business needs.<\/li><\/ul>"]}, {"n": "7", "title": "Content Domain 2: AI Strategy and Business Value Creation", "secs": ["", "<h3>Task 2.1: Develop AI strategies that align with business objectives.<\/h3>\n<ul><li>Skill 2.1.1: Identify high-impact AI use cases across business functions (for example, customer operations, sales and marketing, research and development, software development) and map AI capabilities to specific business outcomes.<\/li><li>Skill 2.1.2: Evaluate build-buy-partner decisions for AI implementations (by considering factors including budget, timelines, capabilities, vendor proposals, and regulatory compliance requirements).<\/li><li>Skill 2.1.3: Prioritize AI initiatives based on business value, feasibility, sustainability, and strategic alignment (by deciding to scale, pause, or terminate initiatives).<\/li><li>Skill 2.1.4: Determine when AI is not the appropriate solution for a business problem.<\/li><li>Skill 2.1.5: Evaluate key considerations when preparing to transition business processes to AI-based solutions or between AI platforms (for example, business continuity, cost implications, data readiness, performance impact).<\/li><\/ul>", "<h3>Task 2.2: Measure and demonstrate AI business value.<\/h3>\n<ul><li>Skill 2.2.1: Define key performance indicators (KPIs) for AI initiatives, including tangible benefits (for example, cost reduction, revenue growth) and intangible benefits (for example, customer satisfaction, employee productivity).<\/li><li>Skill 2.2.2: Establish baseline metrics before implementing AI solutions to accurately measure AI adoption effects.<\/li><li>Skill 2.2.3: Calculate AI return on investment (ROI) by using comprehensive frameworks (for example, time savings, cost reduction, revenue growth, productivity gains).<\/li><li>Skill 2.2.4: Identify leading indicators that predict AI project success.<\/li><li>Skill 2.2.5: Implement basic cost factor controls for AI implementations, including cost planning and optimization strategies.<\/li><\/ul>", "<h3>Task 2.3: Position AI for competitive advantage.<\/h3>\n<ul><li>Skill 2.3.1: Assess competitive landscapes and identify advantages to adopting AI.<\/li><li>Skill 2.3.2: Identify opportunities to transform business models by using AI solutions.<\/li><li>Skill 2.3.3: Describe how AI creates sustainable competitive advantages and operational improvements.<\/li><li>Skill 2.3.4: Determine appropriate AI investment levels based on industry maturity and competitive dynamics.<\/li><\/ul>"]}, {"n": "8", "title": "Content Domain 3: AI Governance and Responsible AI Leadership", "secs": ["", "<h3>Task 3.1: Apply responsible AI principles to business decisions.<\/h3>\n<ul><li>Skill 3.1.1: Apply responsible AI principles and dimensions (for example, fairness, explainability, privacy, safety, transparency, robustness) to business scenarios.<\/li><li>Skill 3.1.2: Navigate tradeoffs when business objectives conflict with responsible AI principles.<\/li><li>Skill 3.1.3: Identify when responsible AI practices should be integrated into AI project planning to ensure governance by design.<\/li><li>Skill 3.1.4: Recognize circumstances when AI systems require human oversight and identify appropriate safeguards (for example, hallucination detection, guardrails, escalation criteria).<\/li><\/ul>", "<h3>Task 3.2: Establish AI governance structures and ensure regulatory compliance.<\/h3>\n<ul><li>Skill 3.2.1: Establish AI governance structures that have appropriate cross-functional representation and clear accountability.<\/li><li>Skill 3.2.2: Identify and address regulatory compliance risks for business processes that use AI.<\/li><li>Skill 3.2.3: Identify appropriate access controls and data security measures for AI systems.<\/li><li>Skill 3.2.4: Apply AI risk classification frameworks to prioritize governance and compliance decisions across the AI lifecycle.<\/li><\/ul>", "<h3>Task 3.3: Identify enterprise AI risks and direct mitigation strategies.<\/h3>\n<ul><li>Skill 3.3.1: Identify the need for risk controls and monitoring mechanisms for AI systems in production.<\/li><li>Skill 3.3.2: Recognize that bias can occur at multiple stages of the AI lifecycle and explain the importance of ongoing monitoring for bias drift.<\/li><li>Skill 3.3.3: Manage harmful content risks and intellectual property (IP) concerns for AI systems.<\/li><li>Skill 3.3.4: Identify and mitigate risks related to AI system reliability (for example, hallucinations, data quality degradation, model drift).<\/li><\/ul>"]}, {"n": "9", "title": "Content Domain 4: Business Readiness, Leadership, and AI Transformation", "secs": ["", "<h3>Task 4.1: Assess AI business readiness and maturity.<\/h3>\n<ul><li>Skill 4.1.1: Assess business readiness to adopt AI across critical dimensions (for example, leadership alignment, data quality, cultural preparedness, technical infrastructure, governance frameworks).<\/li><li>Skill 4.1.2: Apply AI maturity models to evaluate where an enterprise is in its AI journey (for example, experimentation, enterprise-scale deployment).<\/li><li>Skill 4.1.3: Identify specific capability gaps across people, process, technology, and governance that prevent successful AI transformations.<\/li><li>Skill 4.1.4: Prioritize development investments and create progression pathways based on strategic objectives and the current business maturity level.<\/li><\/ul>", "<h3>Task 4.2: Establish data and infrastructure foundations for AI.<\/h3>\n<ul><li>Skill 4.2.1: Evaluate data readiness, including data quality, accessibility, and the effects of data silos on AI initiatives.<\/li><li>Skill 4.2.2: Describe the importance of data strategies, data ownership, and data sharing frameworks that provide the foundation for AI.<\/li><li>Skill 4.2.3: Assess foundational technology and infrastructure requirements to support AI initiatives.<\/li><\/ul>", "<h3>Task 4.3: Lead enterprise-wide change and build AI-ready workforce capabilities.<\/h3>\n<ul><li>Skill 4.3.1: Establish executive sponsorship and leadership alignment to identify and empower AI champions to sustain momentum across an enterprise.<\/li><li>Skill 4.3.2: Build cross-functional teams that represent diverse areas of expertise (for example, business leads, technical experts, legal, compliance) and assign clear accountability standards for AI initiatives.<\/li><li>Skill 4.3.3: Create transparent communication strategies that address workforce concerns about AI (for example, implementation timelines, outcome expectations, effects on workforce roles).<\/li><li>Skill 4.3.4: Recognize cultural barriers to AI adoption (for example, risk aversion, resistance to change, fear of failure) and identify leadership interventions to address these concerns.<\/li><li>Skill 4.3.5: Determine appropriate workforce development approaches to accelerate enterprise-wide AI literacy (for example, proof of concept [POC] programs, hackathons, training programs, responsible AI training).<\/li><li>Skill 4.3.6: Identify opportunities to transition human roles from manual operations to human oversight and collaboration with AI systems, and make strategic decisions that balance human strengths (for example, critical thinking, empathy, creativity) with AI capabilities.<\/li><\/ul>", "<h3>Task 4.4: Scale AI from pilots to enterprise-wide deployments.<\/h3>\n<ul><li>Skill 4.4.1: Apply iterative transformation approaches that progress through phases (for example, envision, experiment, launch, scale).<\/li><li>Skill 4.4.2: Implement scaling methodologies that start with short-term wins and build toward enterprise-wide deployments.<\/li><li>Skill 4.4.3: Establish AI centers of excellence (COEs) and cross-functional collaboration mechanisms to support scaling.<\/li><li>Skill 4.4.4: Establish continuous feedback mechanisms and success metrics to track AI initiative progress and long-term value.<\/li><li>Skill 4.4.5: Address the transition of AI initiatives from experimental to production-grade, including governance and operational requirements.<\/li><li>Skill 4.4.6: Evaluate multiple factors throughout AI scaling initiatives across an enterprise to ensure business continuity and performance.<\/li><\/ul>"]}, {"n": "10", "title": "Technologies and concepts that might appear on the exam", "secs": ["<p>The following list contains technologies and concepts that might appear on the exam. This list is non-exhaustive and is subject to change. The order and placement of the items in this list is no indication of their relative weight or importance on the exam:<\/p>\n<ul><li>Core differences between AI, machine learning (ML), and generative AI (GenAI)<\/li><li>How AI models are trained, make predictions, and improve over time<\/li><li>Types of data (for example, structured, unstructured) and why data quality matters for AI<\/li><li>Basics of prompt engineering and how to get useful AI outputs<\/li><li>How context windows and tokens affect GenAI performance<\/li><li>Techniques for improving AI responses (for example, Retrieval Augmented Generation [RAG], fine-tuning)<\/li><li>What AI agents are and how they differ from other AI tools<\/li><li>When to use rule-based automation instead of AI<\/li><li>Why AI systems need ongoing monitoring (for example, model drift, performance changes)<\/li><li>Risks of unapproved AI tool usage (shadow AI) and how to manage risk<\/li><li>Measuring AI value by using key performance indicators (KPIs), return on investment (ROI), cost savings, and productivity gains<\/li><li>Build-buy-partner decisions for AI solutions<\/li><li>Prioritizing AI initiatives by business impact and feasibility<\/li><li>Responsible AI principles (for example, fairness, explainability, privacy, safety, transparency)<\/li><li>Governance structures and who is accountable for AI decisions<\/li><li>Risk classification for AI systems<\/li><li>Regulatory and compliance considerations for AI<\/li><li>Human oversight, guardrails, and knowing when to escalate<\/li><li>Common AI reliability issues (for example, hallucinations, bias, data quality degradation)<\/li><li>Intellectual property (IP) considerations when using AI<\/li><li>Assessing organizational AI readiness and maturity<\/li><li>Data strategy, data ownership, and breaking down data silos<\/li><li>Leading change management and workforce transformation for AI<\/li><li>Building AI literacy across an organization<\/li><li>Scaling AI from pilots to enterprise-wide adoption<\/li><li>AI centers of excellence (COEs)<\/li><li><a href=\"https://docs.aws.amazon.com/bedrock/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Bedrock<\/a>, <a href=\"https://docs.aws.amazon.com/sagemaker/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon SageMaker AI<\/a>, and <a href=\"https://docs.aws.amazon.com/quick/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Quick<\/a> (at a strategic level)<\/li><li>AWS Cloud Adoption Framework (AWS CAF)<\/li><li>AWS shared responsibility model for AI workloads<\/li><li>AWS AI pricing and cost optimization strategies<\/li><li>Global AI standards and frameworks (for example, ISO/IEC 23053, ISO/IEC 42001)<\/li><\/ul>"]}, {"n": "11", "title": "In-scope AWS services and features", "secs": ["<p>The following list contains AWS services and features that are in scope for the exam. This list is non-exhaustive and is subject to change. AWS offerings appear in categories that align with the offerings' primary functions:<\/p>", "<h3>AI and Machine Learning (basic application only)<\/h3>\n<ul><li><a href=\"https://docs.aws.amazon.com/bedrock/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Bedrock<\/a><\/li><li><a href=\"https://docs.aws.amazon.com/sagemaker/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon SageMaker AI<\/a><\/li><\/ul>", "<h3>Business Intelligence (basic application only)<\/h3>\n<ul><li><a href=\"https://docs.aws.amazon.com/quick/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Quick<\/a><\/li><\/ul>", "<h3>Cloud Strategy and Governance<\/h3>\n<ul><li>AWS Cloud Adoption Framework (AWS CAF)<\/li><li>AWS shared responsibility model<\/li><\/ul>", "<h3>Pricing and Cost Management<\/h3>\n<ul><li>AWS AI service pricing structures (for example, consumption-based, instance-based, seat-based)<\/li><li><a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Cost Explorer<\/a><\/li><li><a href=\"https://docs.aws.amazon.com/marketplace/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Marketplace<\/a><\/li><li><a href=\"https://docs.aws.amazon.com/pricing-calculator/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Pricing Calculator<\/a><\/li><\/ul>"]}, {"n": "12", "title": "Out-of-scope AWS services and features", "secs": ["<p>This exam focuses on AI strategy, governance, and business transformation rather than technical implementation. AWS services and features outside the in-scope list are out of scope, including but not limited to the following categories and services:<\/p>\n<ul><li>Infrastructure and compute (for example, <a href=\"https://docs.aws.amazon.com/ec2/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon EC2<\/a>, <a href=\"https://docs.aws.amazon.com/lambda/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Lambda<\/a>)<\/li><li>Networking and content delivery (for example, <a href=\"https://docs.aws.amazon.com/vpc/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon VPC<\/a>, <a href=\"https://docs.aws.amazon.com/cloudfront/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon CloudFront<\/a>)<\/li><li>Databases and storage (for example, <a href=\"https://docs.aws.amazon.com/rds/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon RDS<\/a>, <a href=\"https://docs.aws.amazon.com/s3/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon S3<\/a>)<\/li><li>Containers and orchestration (for example, <a href=\"https://docs.aws.amazon.com/ecs/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Elastic Container Service<\/a> [Amazon ECS], <a href=\"https://docs.aws.amazon.com/eks/\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Elastic Kubernetes Service<\/a> [Amazon EKS])<\/li><li>Developer tools and DevOps (for example, <a href=\"https://docs.aws.amazon.com/codepipeline/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS CodePipeline<\/a>, <a href=\"https://docs.aws.amazon.com/cloudformation/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS CloudFormation<\/a>)<\/li><li>Security implementation and configuration (for example, <a href=\"https://docs.aws.amazon.com/iam/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Identity and Access Management<\/a> [IAM] policy writing, <a href=\"https://docs.aws.amazon.com/kms/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Key Management Service<\/a> [AWS KMS])<\/li><li>Internet of Things (IoT), media, and other specialized services<\/li><\/ul>\n<p>Candidates are not expected to know how to configure, deploy, or administer any AWS service. The exam assesses the ability to understand AI services at a strategic level and make informed business decisions about their application.<\/p>"]}, {"n": "13", "title": "Survey", "secs": ["<p>How useful was this exam guide? Let us know by <a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=AI-Foundational&amp;course_id=AIB-C01&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">taking our survey<\/a>.<\/p>"]}]}};

let view='ko', openAll=false;
try{const s=localStorage.getItem('aib-guide-view'); if(s&&NOTES[s]) view=s;}catch(e){}
function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');}
function prep(h){h=wrapTables(h); return openAll?h.replace(/<details class="ans">/g,'<details class="ans" open>'):h;}
function render(){
  document.body.classList.toggle('dual',view==='dual');
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  noteEl.innerHTML=NOTES[view].join('');
  let h='';
  for(let i=0;i<N;i++){
    const ko=DATA.ko.ch[i], ja=DATA.ja.ch[i], en=DATA.en.ch[i], n=ko.n;
    h+=`<section class="chap" id="c${n}">`;
    if(view==='dual'){
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1>${ko.title}<span class="sub ja" lang="ja">${ja.title}</span></h1></div>`;
      h+=`<div class="colhead"><span>한국어</span><span>日本語</span></div>`;
      ko.secs.forEach((s,j)=>{h+=`<div class="pair"><div class="sec">${prep(s)}</div><div class="sec ja" lang="ja">${prep(ja.secs[j])}</div></div>`;});
    }else{
      const L=view, c=DATA[L].ch[i];
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1 class="${L}" lang="${L}">${c.title}</h1></div>`;
      h+=`<div class="sec ${L}" lang="${L}">${c.secs.map(prep).join('')}</div>`;
    }
    h+='</section>';
  }
  out.innerHTML=h;
  const L=view==='dual'?'ko':view;
  nav.innerHTML=DATA[L].ch.map(c=>`<button data-c="${c.n}" title="${c.title}">${c.n}</button>`).join('');
  spy();
}
document.querySelector('.langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const cur=current();
  view=b.dataset.v; try{localStorage.setItem('aib-guide-view',view);}catch(e){}
  render(); jump(cur,false);
});
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) jump(b.dataset.c,true);});
function off(){return document.querySelector('header.top').getBoundingClientRect().bottom;}
function jump(n,smooth){
  const el=document.getElementById('c'+n); if(!el) return;
  window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off()-8,behavior:smooth?'smooth':'auto'});
}
function current(){
  const o=off()+20; let c=DATA.ko.ch[0].n;
  DATA.ko.ch.forEach(x=>{const el=document.getElementById('c'+x.n); if(el&&el.getBoundingClientRect().top<=o) c=x.n;}); return c;
}
function spy(){const c=current(); nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));}
addEventListener('scroll',spy,{passive:true});
render();
</script>

</body>

\/li><li>AWS Control Tower<\/li><li>AWS Health Dashboard<\/li><li>AWS License Manager<\/li><li>Amazon Managed Grafana<\/li><li>Amazon Managed Service for Prometheus<\/li><li>AWS Management Console<\/li><li>AWS Organizations<\/li><li>AWS Proton<\/li><li>AWS Service Catalog<\/li><li>AWS Systems Manager<\/li><li>AWS Well-Architected Tool<\/li><\/ul>", "<h3>Media Services<\/h3>\n<ul><li>Amazon Kinesis Video Streams<\/li><\/ul>", "<h3>Migration and Transfer<\/h3>\n<ul><li>AWS Application Discovery Service<\/li><li>AWS Application Migration Service<\/li><li>AWS DataSync<\/li><li>AWS DMS<\/li><li>AWS Snow Family<\/li><li>AWS Transfer Family<\/li><\/ul>", "<h3>Networking and Content Delivery<\/h3>\n<ul><li>AWS Client VPN<\/li><li>Amazon CloudFront<\/li><li>AWS Direct Connect<\/li><li>Elastic Load Balancing (ELB)<\/li><li>AWS Global Accelerator<\/li><li>AWS PrivateLink<\/li><li>Amazon Route 53<\/li><li>AWS Site-to-Site VPN<\/li><li>AWS Transit Gateway<\/li><li>Amazon VPC<\/li><\/ul>", "<h3>Security, Identity, and Compliance<\/h3>\n<ul><li>AWS Artifact<\/li><li>AWS Certificate Manager (ACM)<\/li><li>AWS CloudHSM<\/li><li>Amazon Cognito<\/li><li>Amazon Detective<\/li><li>AWS Directory Service<\/li><li>AWS Firewall Manager<\/li><li>Amazon GuardDuty<\/li><li>AWS IAM Identity Center<\/li><li>Amazon Inspector<\/li><li>AWS KMS<\/li><li>Amazon Macie<\/li><li>AWS Network Firewall<\/li><li>AWS Resource Access Manager (AWS RAM)<\/li><li>AWS Secrets Manager<\/li><li>AWS Security Hub<\/li><li>AWS Shield<\/li><li>AWS WAF<\/li><li>IAM<\/li><\/ul>", "<h3>Serverless<\/h3>\n<ul><li>AWS Fargate<\/li><li>AWS Lambda<\/li><\/ul>", "<h3>Storage<\/h3>\n<ul><li>AWS Backup<\/li><li>Amazon EBS<\/li><li>Amazon EFS<\/li><li>Amazon FSx (for all types)<\/li><li>Amazon S3<\/li><li>Amazon S3 Glacier<\/li><li>AWS Storage Gateway<\/li><\/ul>"]}, {"n": "14", "title": "Out-of-Scope AWS Services", "secs": ["<p>The following list contains AWS services and features that are out of scope for the exam. This list is non-exhaustive and is subject to change. AWS offerings that are entirely unrelated to the target job roles for the exam are excluded from this list:<\/p><h3>Application Integration<\/h3>\n<ul><li>Amazon Managed Workflows for Apache Airflow (Amazon MWAA)<\/li><\/ul><h3>Compute<\/h3>\n<ul><li>Amazon Lightsail<\/li><\/ul><h3>Database<\/h3>\n<ul><li>Amazon RDS on VMware<\/li><\/ul><h3>Developer Tools<\/h3>\n<ul><li>AWS CDK<\/li><li>AWS CloudShell<\/li><li>AWS CodeArtifact<\/li><li>AWS CodeBuild<\/li><li>AWS CodeCommit<\/li><li>AWS CodeDeploy<\/li><li>Amazon Corretto<\/li><li>AWS Fault Injection Simulator (AWS FIS)<\/li><li>AWS Tools and SDKs<\/li><\/ul><h3>Front-End Web and Mobile<\/h3>\n<ul><li>Amazon Location Service<\/li><\/ul><h3>Game Tech<\/h3>\n<ul><li>Amazon GameLift<\/li><\/ul><h3>Internet of Things<\/h3>\n<ul><li>All services<\/li><\/ul><h3>Machine Learning<\/h3>\n<ul><li>Apache MXNet on AWS<\/li><li>AWS Deep Learning AMIs (DLAMI)<\/li><li>AWS Deep Learning Containers<\/li><li>Amazon HealthLake<\/li><li>AWS Inferentia<\/li><li>Amazon Personalize<\/li><li>PyTorch on AWS<\/li><li>TensorFlow on AWS<\/li><\/ul><h3>Management and Governance<\/h3>\n<ul><li>AWS Console Mobile Application<\/li><li>AWS Distro for OpenTelemetry<\/li><\/ul><h3>Media Services<\/h3>\n<ul><li>AWS Elemental Appliances and Software<\/li><li>AWS Elemental MediaConnect<\/li><li>AWS Elemental MediaConvert<\/li><li>AWS Elemental MediaLive<\/li><li>AWS Elemental MediaPackage<\/li><li>AWS Elemental MediaTailor<\/li><li>Amazon Interactive Video Service (Amazon IVS)<\/li><\/ul><h3>Migration and Transfer<\/h3>\n<ul><li>Migration Evaluator<\/li><\/ul><h3>Networking and Content Delivery<\/h3>\n<ul><li>AWS Cloud Map<\/li><\/ul><h3>Quantum Technologies<\/h3>\n<ul><li>Amazon Braket<\/li><\/ul><h3>Satellite<\/h3>\n<ul><li>AWS Ground Station<\/li><\/ul>"]}, {"n": "15", "title": "Revisions", "secs": ["<p>AWS exam guides are periodically reviewed and updated to ensure that our certification exams test skills and AWS services and features that are relevant for the job role(s) that a certification is designed to target. Exam guide updates will be published approximately one month before updates will be reflected on your exam.<\/p>", "<h3>Change History<\/h3>\n<table><thead><tr><th>Version<\/th><th>Publication date<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>August 28, 2026<\/td><\/tr><tr><td>1.1<\/td><td>October 29, 2026<\/td><\/tr><\/tbody><\/table>", "<h3>Changes to in- and out-of-scope services<\/h3>", "<h4>Services removed from the in-scope list<\/h4>\n<ul><li>Amazon Elastic Transcoder<\/li><\/ul>", "<h4>Services removed from the out-of-scope list<\/h4>\n<ul><li>AWS DeepComposer<\/li><li>Amazon DevOps Guru<\/li><li>Amazon Elastic Inference<\/li><li>Amazon Managed Blockchain<\/li><li>Amazon Sumerian<\/li><\/ul>"]}, {"n": "16", "title": "Survey", "secs": ["<p>How useful was this exam guide? Let us know by <a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=SAA-Associate&amp;course_id=SAA-C03&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">taking our survey<\/a>.<\/p>"]}]}};
const out=document.getElementById('out'), nav=document.getElementById('chaps'), noteEl=document.getElementById('note');
const N=DATA.ko.ch.length;
const NOTES={
 ko:['<p><strong>한국어판</strong>: AWS 공식 한국어판 시험 안내서(SAA-C03) 본문을 그대로 옮겼습니다. 출처: docs.aws.amazon.com, 2026-11-07 확인.</p>','<p><strong>언어판 차이</strong>: 영어판은 버전 <strong>1.1</strong>(2026-10-29) 기준입니다. 한국어판·일본어판은 13장 \'범위 내 AWS 서비스\'와 14장 \'범위 외 AWS 서비스\' 목록이 영어판과 일부 다릅니다(예: 1.1에서 빠진 Amazon Elastic Transcoder 등이 아직 남아 있음). 15장 \'Revisions\'는 한국어·일본어 페이지도 영어 원문 그대로입니다.</p>'],
 ja:['<p><strong>日本語版</strong>：AWS 公式の日本語版試験ガイド (SAA-C03) の本文をそのまま転記しています。出典：docs.aws.amazon.com（2026-11-07 時点）。</p>','<p><strong>言語版の違い</strong>：英語版はバージョン <strong>1.1</strong>（2026-10-29）準拠です。日本語版・韓国語版は第13章「対象の AWS サービス」と第14章「対象外の AWS サービス」のリストが英語版と一部異なります。第15章「Revisions」は日本語ページでも英語のままです。</p>'],
 dual:['<p><strong>한·日 대조</strong>: 왼쪽은 공식 한국어판, 오른쪽은 공식 일본어판입니다. 같은 항목끼리 줄을 맞췄습니다.</p>'],
 en:['<p><strong>English</strong>: official AWS exam guide (SAA-C03), <strong>version 1.1</strong> (October 29, 2026), transcribed from docs.aws.amazon.com as of 2026-11-07. The Korean and Japanese editions differ in the in-scope (chapter 13) and out-of-scope (chapter 14) service lists.</p>']
};
let view='ko', openAll=false;
try{const s=localStorage.getItem('saa-guide-view'); if(s&&NOTES[s]) view=s;}catch(e){}
function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');}
function prep(h){h=wrapTables(h); return openAll?h.replace(/<details class="ans">/g,'<details class="ans" open>'):h;}
function render(){
  document.body.classList.toggle('dual',view==='dual');
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  noteEl.innerHTML=NOTES[view].join('');
  let h='';
  for(let i=0;i<N;i++){
    const ko=DATA.ko.ch[i], ja=DATA.ja.ch[i], en=DATA.en.ch[i], n=ko.n;
    h+=`<section class="chap" id="c${n}">`;
    if(view==='dual'){
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1>${ko.title}<span class="sub ja" lang="ja">${ja.title}</span></h1></div>`;
      h+=`<div class="colhead"><span>한국어</span><span>日本語</span></div>`;
      ko.secs.forEach((s,j)=>{h+=`<div class="pair"><div class="sec">${prep(s)}</div><div class="sec ja" lang="ja">${prep(ja.secs[j])}</div></div>`;});
    }else{
      const L=view, c=DATA[L].ch[i];
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1 class="${L}" lang="${L}">${c.title}</h1></div>`;
      h+=`<div class="sec ${L}" lang="${L}">${c.secs.map(prep).join('')}</div>`;
    }
    h+='</section>';
  }
  out.innerHTML=h;
  const L=view==='dual'?'ko':view;
  nav.innerHTML=DATA[L].ch.map(c=>`<button data-c="${c.n}" title="${c.title}">${c.n}</button>`).join('');
  spy();
}
document.querySelector('.langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const cur=current();
  view=b.dataset.v; try{localStorage.setItem('saa-guide-view',view);}catch(e){}
  render(); jump(cur,false);
});
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) jump(b.dataset.c,true);});
function off(){return document.querySelector('header.top').getBoundingClientRect().bottom;}
function jump(n,smooth){
  const el=document.getElementById('c'+n); if(!el) return;
  window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off()-8,behavior:smooth?'smooth':'auto'});
}
function current(){
  const o=off()+20; let c=DATA.ko.ch[0].n;
  DATA.ko.ch.forEach(x=>{const el=document.getElementById('c'+x.n); if(el&&el.getBoundingClientRect().top<=o) c=x.n;}); return c;
}
function spy(){const c=current(); nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));}
addEventListener('scroll',spy,{passive:true});
render();
</script>

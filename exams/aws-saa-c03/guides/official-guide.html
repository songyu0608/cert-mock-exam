<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>SAA-C03 공식 시험 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: sticky bar (language tabs + chapter chips 1–18), one reading column; "대조" view = section-aligned two-column grid */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b1f2a; --muted:#5b6475; --line:#dde1e8;
  --accent:#2f4bb8; --accent-soft:#e7ebfa; --code-bg:#eef0f5; --quote:#f0f3fb; --ok:#1d7a52; --ok-soft:#e5f4ec;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-display:"Fraunces",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ko);font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.dual .wrap{max-width:1260px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto;letter-spacing:.01em}
.brand small{font-family:var(--f-ko);color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:4px 10px;font-size:13px;line-height:1.5}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chaps button{font-family:var(--f-mono);font-size:12px;padding:1px 0;min-width:30px;text-align:center}
.chaps button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding-block:24px 80px}
.note{font-size:13px;color:var(--muted);line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:36px;background:var(--surface)}
.note p{margin:0}
.chap{margin-bottom:56px}
.chap-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:8px}
.chap-no{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.2em}
.chap-head h1{font-size:22px;line-height:1.4;margin:0;text-wrap:balance}
.chap-head .sub{font-size:13px;color:var(--muted);display:block;font-weight:400}
.sec h3{font-size:18px;margin:34px 0 8px;text-wrap:balance}
.sec a{color:var(--accent);text-underline-offset:2px}
.sec h4{font-size:15.5px;margin:28px 0 6px;color:var(--accent);line-height:1.55;text-wrap:balance}
.sec p{margin:0 0 14px}
.sec ul,.sec ol{margin:0 0 14px;padding-left:1.4em}
.sec li{margin:3px 0}
.sec ul.opts{list-style:none;padding-left:0}
.sec ul.opts li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;background:var(--surface)}
.sec blockquote{margin:16px 0;padding:10px 16px;background:var(--quote);border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.sec blockquote p:last-child{margin-bottom:0}
details.ans{margin:4px 0 26px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.ans summary{cursor:pointer;padding:7px 12px;font-size:13.5px;color:var(--ok);font-weight:600}
details.ans[open]{background:var(--ok-soft);border-color:var(--ok)}
details.ans p{margin:0;padding:0 14px 12px}
.sec code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:6px 0 18px}
.sec table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.sec th,.sec td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sec th{background:var(--code-bg)}
.ja{font-family:var(--f-ja)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0}
.pair>div{min-width:0}
.colhead{display:grid;grid-template-columns:1fr 1fr;gap:36px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:820px){.pair{grid-template-columns:1fr}.pair>div.ja{border-top:1px dotted var(--line);padding-top:4px}.colhead{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <span class="brand">SAA-C03 시험 가이드<small>AWS 공식 · 전문</small></span>
    <div class="row langs" role="group" aria-label="언어">
      <button id="v-ko" data-v="ko">한국어</button>
      <button id="v-ja" data-v="ja">日本語</button>
      <button id="v-dual" data-v="dual">한·日 대조</button>
      <button id="v-en" data-v="en">English</button>
    </div>
  </div>
  <div class="row chaps" role="group" aria-label="장 이동" id="chaps"></div>
</div></header>
<main><div class="wrap">
  <div class="note" id="note"></div>
  <div id="out"></div>
</div></main>

<script>
const DATA={"ko": {"title": "AWS Certified Solutions Architect - Associate(SAA-C03)", "note": ["Source: https://docs.aws.amazon.com/ko_kr/aws-certification/latest/solutions-architect-associate-03/solutions-architect-associate-03.html (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "AWS Certified Solutions Architect - Associate(SAA-C03)", "secs": ["<p>AWS Certified Solutions Architect - Associate(SAA-C03) 시험은 Solutions Architect 역할을 수행하는 개인을 대상으로 합니다. 이 시험에서는 응시자가 AWS Well-Architected Framework를 기반으로 솔루션을 설계할 수 있는지 확인합니다.<\/p>"]}, {"n": "2", "title": "서론", "secs": ["<p><a href=\"https://aws.amazon.com/certification/certified-solutions-architect-associate/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Certified Solutions Architect - Associate(SAA-C03)<\/a> 시험은 Solutions Architect 역할을 수행하는 개인을 대상으로 합니다. 이 시험에서는 응시자가 AWS Well-Architected Framework를 기반으로 솔루션을 설계할 수 있는지 확인합니다.<\/p>\n<p>또한 이 시험에서는 응시자의 다음 작업을 완료하는 능력을 확인합니다.<\/p>\n<ul><li>현재 비즈니스 요구 사항과 향후 예상되는 요구 사항을 충족하도록 AWS 서비스를 통합하는 솔루션 설계<\/li><li>안전하고 복원력이 뛰어나며 성능이 우수하고 비용에 최적화된 아키텍처 설계<\/li><li>기존 솔루션 검토 및 개선 사항 결정<\/li><\/ul>"]}, {"n": "3", "title": "대상 응시자 설명", "secs": ["<p>대상 응시자는 AWS 서비스를 사용하는 클라우드 솔루션을 설계한 1년 이상의 실무 경험을 보유하고 있어야 합니다.<\/p>"]}, {"n": "4", "title": "시험 콘텐츠", "secs": ["", "<h3>답안 유형<\/h3>\n<p>이 시험의 문항은 2가지 유형으로 제공됩니다.<\/p>\n<ul><li><strong>선다형:<\/strong> 정답 1개와 오답 3개(정답 이외의 답)가 있습니다.<\/li><li><strong>복수 응답형:<\/strong> 5개 이상의 응답 중에 2개 이상의 정답이 있습니다.<\/li><\/ul>\n<p>문장을 가장 잘 완성하거나 질문에 대한 답으로 가장 적합한 응답을 1개 이상 선택합니다. 정답 이외의 답 또는 오답은 지식이나 기술이 부족한 응시자가 선택할 가능성이 큰 응답입니다. 정답 이외의 답은 일반적으로 콘텐츠 영역에 부합하여 맞아 보이는 응답입니다.<\/p>\n<p>답을 하지 않은 문항은 오답으로 처리됩니다. 추측에 따른 불이익은 없습니다. 시험에는 점수에 반영되는 50개의 문항이 포함되어 있습니다.<\/p>", "<h3>채점되지 않는 콘텐츠<\/h3>\n<p>시험에는 점수에 영향을 주지 않는 15개의 채점되지 않는 문제가 포함됩니다. AWS는 채점되지 않은 문제의 성과에 대한 정보를 수집하여 나중에 채점 문제로 사용할 수 있도록 해당 문항을 평가합니다. 이러한 채점되지 않는 문항은 시험에서 식별되지 않습니다.<\/p>", "<h3>시험 결과<\/h3>\n<p>AWS Certified Solutions Architect - Associate(SAA-C03) 시험은 합격 또는 불합격이 결정되는 시험입니다. AWS 전문가가 자격증 분야 모범 사례 및 가이드라인에 따라 설정한 최소 표준을 기준으로 시험 점수를 매깁니다.<\/p>\n<p>시험 결과는 100~1,000점의 변환 점수로 보고됩니다. 합격 최소 점수는 720점입니다. 응시자는 점수를 통해 전반적인 시험 성적과 합격 여부를 알 수 있습니다. 변환 점수 모델은 난이도가 조금씩 다를 수 있는 여러 시험 형식에 걸쳐 점수를 균등하게 조정하는 데 도움이 됩니다.<\/p>\n<p>점수 보고서에는 섹션 수준별로 성적 분류표가 포함될 수 있습니다. 시험은 보상 점수 모델을 사용하므로 각 섹션에서 합격 점수를 얻을 필요는 없으며, 전체 시험에만 합격하면 됩니다.<\/p>\n<p>시험의 섹션마다 특정 가중치가 적용되므로 일부 섹션은 다른 섹션보다 문항 수가 많습니다. 분류표에는 응시자의 장단점을 강조하여 보여주는 일반 정보가 포함되어 있습니다. 섹션별 피드백을 파악할 때 주의하시기 바랍니다.<\/p>"]}, {"n": "5", "title": "내용 개요", "secs": ["<p>이 시험 안내서는 시험의 가중치, 콘텐츠 도메인 및 작업 설명을 제공합니다. 이 안내서는 시험 내용의 전체 목록을 제공하지 않습니다. 그러나 각 작업 설명에 관한 추가 맥락 정보를 사용하여 시험을 준비하는 데 참고할 수 있습니다.<\/p>\n<p>시험의 콘텐츠 도메인과 가중치는 다음과 같습니다.<\/p>\n<ul><li>콘텐츠 도메인 1: 보안 아키텍처 설계(채점되는 콘텐츠의 30%)<\/li><li>콘텐츠 도메인 2: 복원력을 갖춘 아키텍처 설계(채점되는 콘텐츠의 26%)<\/li><li>콘텐츠 도메인 3: 고성능 아키텍처 설계(채점되는 콘텐츠의 24%)<\/li><li>콘텐츠 도메인 4: 비용에 최적화된 아키텍처 설계(채점되는 콘텐츠의 20%)<\/li><\/ul>"]}, {"n": "6", "title": "서비스 참조", "secs": ["<p>다음 섹션에서는 이 자격증 시험과 관련된 AWS 서비스, 기술 및 개념에 대한 자세한 정보를 제공합니다.<\/p>\n<ul><li>기술 및 개념<\/li><li>시험에서 언급되는 AWS 서비스<\/li><li>범위 내 AWS 서비스<\/li><li>범위 외 AWS 서비스<\/li><\/ul>"]}, {"n": "7", "title": "콘텐츠 도메인 1: 보안 아키텍처 설계", "secs": ["", "<h3>작업 1.1: AWS 리소스에 대한 보안 액세스 설계<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>여러 계정에 대한 액세스 제어 및 관리<\/li><li>AWS 페더레이션된 액세스 및 ID 서비스(예: IAM, AWS IAM Identity Center)<\/li><li>AWS 글로벌 인프라(예: 가용 영역, AWS 리전)<\/li><li>AWS 보안 모범 사례(예: 최소 권한의 원칙)<\/li><li>AWS 공동 책임 모델<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>IAM 사용자 및 루트 사용자에게 AWS 보안 모범 사례 적용(예: 다중 인증(MFA))<\/li><li>IAM 사용자, 그룹, 역할 및 정책을 포함하는 유연한 권한 부여 모델 설계<\/li><li>역할 기반 액세스 제어 전략 설계(예: AWS STS, 역할 전환, 크로스 계정 액세스)<\/li><li>여러 AWS 계정에 대한 보안 전략 설계(예: AWS Control Tower, 서비스 제어 정책(SCP))<\/li><li>AWS 서비스에 적합한 리소스 정책 사용 결정<\/li><li>디렉터리 서비스를 IAM 역할과 연동할 시기 결정<\/li><\/ul>", "<h3>작업 1.2: 안전한 워크로드 및 애플리케이션 설계<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>애플리케이션 구성 및 보안 인증 정보의 보안<\/li><li>AWS 서비스 엔드포인트<\/li><li>AWS에서 포트, 프로토콜 및 네트워크 트래픽 제어<\/li><li>안전한 애플리케이션 액세스<\/li><li>보안 서비스와 적합한 사용 사례(예: Amazon Cognito, Amazon GuardDuty, Amazon Macie)<\/li><li>AWS 외부의 위협 벡터(예: DDoS, SQL 인젝션)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>보안 구성 요소(예: 보안 그룹, 라우팅 테이블, 네트워크 ACL, NAT 게이트웨이)로 VPC 아키텍처 설계<\/li><li>네트워크 분할 전략 결정(예: 퍼블릭 서브넷 및 프라이빗 서브넷 사용)<\/li><li>보안 애플리케이션에 AWS 서비스 통합(예: AWS Shield, AWS WAF, IAM Identity Center, AWS Secrets Manager)<\/li><li>AWS 클라우드와의 외부 네트워크 연결 보호(예: VPN, AWS Direct Connect)<\/li><\/ul>", "<h3>작업 1.3: 적합한 데이터 보안 제어 결정<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>데이터 액세스 및 거버넌스<\/li><li>데이터 복구<\/li><li>데이터 보존 및 분류<\/li><li>암호화 및 적합한 키 관리<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>규정 준수 요구 사항을 충족하도록 AWS 기술 조율<\/li><li>저장된 데이터 암호화(예: AWS KMS)<\/li><li>전송 중 데이터 암호화(예: TLS를 사용하는 AWS Certificate Manager(ACM))<\/li><li>암호화 키에 대한 액세스 정책 구현<\/li><li>데이터 백업 및 복제 구현<\/li><li>데이터 액세스, 수명 주기 및 보호를 위한 정책 구현<\/li><li>암호화 키 교체 및 인증서 갱신<\/li><\/ul>"]}, {"n": "8", "title": "콘텐츠 도메인 2: 복원력을 갖춘 아키텍처 설계", "secs": ["", "<h3>작업 2.1: 확장 가능하고 느슨하게 결합된 아키텍처 설계<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>API 만들기 및 관리(예: Amazon API Gateway, REST API)<\/li><li>AWS Managed Services와 적합한 사용 사례(예: AWS Transfer Family, Amazon SQS, AWS Secrets Manager)<\/li><li>캐싱 전략<\/li><li>마이크로서비스의 설계 원칙(예: 스테이트리스 워크로드와 스테이트풀 워크로드 비교)<\/li><li>이벤트 기반 아키텍처<\/li><li>수평적 스케일링 및 수직적 스케일링<\/li><li>엣지 액셀러레이터를 적절하게 사용하는 방법(예: 콘텐츠 전송 네트워크(CDN))<\/li><li>애플리케이션을 컨테이너로 마이그레이션하는 방법<\/li><li>로드 밸런싱 개념(예: Application Load Balancer(ALB))<\/li><li>멀티 티어 아키텍처<\/li><li>대기열 및 메시징 개념(예: 게시/구독)<\/li><li>서버리스 기술 및 패턴(예: AWS Fargate, AWS Lambda)<\/li><li>연관된 특성이 있는 스토리지 유형(예: 객체, 파일, 블록)<\/li><li>컨테이너의 오케스트레이션(예: Amazon ECS, Amazon EKS)<\/li><li>읽기 전용 복제본 사용 시기<\/li><li>워크플로 오케스트레이션(예: AWS Step Functions)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>요구 사항에 따라 이벤트 기반, 마이크로서비스 및/또는 멀티 티어 아키텍처 설계<\/li><li>아키텍처 설계에 사용되는 구성 요소의 스케일링 전략 결정<\/li><li>요구 사항에 따라 느슨한 결합을 달성하는 데 필요한 AWS 서비스 결정<\/li><li>컨테이너 사용 시기 결정<\/li><li>서버리스 기술 및 패턴 사용 시기 결정<\/li><li>요구 사항에 따라 적합한 컴퓨팅, 스토리지, 네트워킹 및 데이터베이스 기술 권장<\/li><li>워크로드에 맞춰 특별히 구축된 AWS 서비스 사용<\/li><\/ul>", "<h3>작업 2.2: 고가용성 및/또는 내결함성 아키텍처 설계<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>AWS 글로벌 인프라(예: 가용 영역, AWS 리전, Amazon Route 53)<\/li><li>AWS Managed Services와 적합한 사용 사례(예: Amazon Comprehend, Amazon Polly)<\/li><li>기본 네트워킹 개념(예: 라우팅 테이블)<\/li><li>재해 복구(DR) 전략(예: 백업 및 복원, 파일럿 라이트, 예열 대기 방식, 활성/활성 장애 조치, RPO(복구 시점 목표), RTO(복구 시간 목표))<\/li><li>분산 설계 패턴<\/li><li>장애 조치 전략<\/li><li>변경 불가능한 인프라<\/li><li>로드 밸런싱 개념(예: ALB)<\/li><li>프록시 개념(예: Amazon RDS Proxy)<\/li><li>Service Quotas 및 제한(예: 대기 환경에서 워크로드에 대한 Service Quotas를 구성하는 방법)<\/li><li>스토리지 옵션 및 특성(예: 내구성, 복제)<\/li><li>워크로드 가시성(예: AWS X-Ray)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>인프라 무결성을 보장하기 위한 자동화 전략 결정<\/li><li>AWS 리전 또는 가용 영역 전체에서 고가용성 및/또는 내결함성 아키텍처를 제공하는 데 필요한 AWS 서비스 결정<\/li><li>비즈니스 요구 사항에 따라 지표를 파악하여 고가용성 솔루션 제공<\/li><li>단일 실패 지점을 완화하기 위한 설계 구현<\/li><li>데이터의 내구성과 가용성을 보장하기 위한 전략 구현(예: 백업)<\/li><li>비즈니스 요구 사항을 충족하는 적합한 DR 전략 선택<\/li><li>레거시 애플리케이션과 클라우드용으로 구축되지 않은 애플리케이션의 신뢰성을 개선하는 AWS 서비스 사용(예: 애플리케이션 변경이 불가능한 경우)<\/li><li>워크로드에 맞춰 특별히 구축된 AWS 서비스 사용<\/li><\/ul>"]}, {"n": "9", "title": "콘텐츠 도메인 3: 고성능 아키텍처 설계", "secs": ["", "<h3>작업 3.1: 고성능 및/또는 확장 가능한 스토리지 솔루션 결정<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>비즈니스 요구 사항을 충족하는 하이브리드 스토리지 솔루션<\/li><li>스토리지 서비스와 적합한 사용 사례(예: Amazon S3, Amazon EFS, Amazon EBS)<\/li><li>연관된 특성이 있는 스토리지 유형(예: 객체, 파일, 블록)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>성능 요구 사항을 충족하는 스토리지 서비스 및 구성 결정<\/li><li>향후 요구 사항을 수용하도록 규모 조정 가능한 스토리지 서비스 결정<\/li><\/ul>", "<h3>작업 3.2: 고성능의 탄력적인 컴퓨팅 솔루션 설계<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>AWS 컴퓨팅 서비스와 적합한 사용 사례(예: AWS Batch, Amazon EMR, AWS Fargate)<\/li><li>AWS 글로벌 인프라 및 엣지 서비스에서 지원하는 분산 컴퓨팅 개념<\/li><li>대기열 및 메시징 개념(예: 게시/구독)<\/li><li>확장성 기능과 적합한 사용 사례(예: Amazon EC2 Auto Scaling, AWS Auto Scaling)<\/li><li>서버리스 기술 및 패턴(예: AWS Lambda, Fargate)<\/li><li>컨테이너의 오케스트레이션(예: Amazon ECS, Amazon EKS)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>구성 요소 크기를 독립적으로 규모를 조정할 수 있도록 워크로드 분리<\/li><li>스케일링 작업을 수행하기 위한 지표 및 조건 파악<\/li><li>비즈니스 요구 사항을 충족하는 적합한 컴퓨팅 옵션 및 기능 선택(예: EC2 인스턴스 유형)<\/li><li>비즈니스 요구 사항을 충족하는 적합한 리소스 유형 및 크기 선택(예: Lambda 메모리 양)<\/li><\/ul>", "<h3>작업 3.3: 고성능 데이터베이스 솔루션 결정<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>AWS 글로벌 인프라(예: 가용 영역, AWS 리전)<\/li><li>캐싱 전략 및 서비스(예: Amazon ElastiCache)<\/li><li>데이터 액세스 패턴(예: 읽기 집약적 패턴과 쓰기 집약적 패턴 비교)<\/li><li>데이터베이스 용량 계획(예: 용량 단위, 인스턴스 유형, 프로비저닝된 IOPS)<\/li><li>데이터베이스 연결 및 프록시<\/li><li>데이터베이스 엔진과 적합한 사용 사례(예: 이기종 마이그레이션, 동종 마이그레이션)<\/li><li>데이터베이스 복제(예: 읽기 전용 복제본)<\/li><li>데이터베이스 유형 및 서비스(예: 서버리스, 관계형과 비관계형 비교, 인 메모리)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>비즈니스 요구 사항을 충족하도록 읽기 전용 복제본 구성<\/li><li>데이터베이스 아키텍처 설계<\/li><li>적합한 데이터베이스 엔진 결정(예: MySQL과 PostgreSQL 비교)<\/li><li>적합한 데이터베이스 유형 결정(예: Amazon Aurora, Amazon DynamoDB)<\/li><li>비즈니스 요구 사항을 충족하도록 캐싱 통합<\/li><\/ul>", "<h3>작업 3.4: 고성능 및/또는 확장 가능한 네트워크 아키텍처 결정<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>엣지 네트워킹 서비스와 적합한 사용 사례(예: Amazon CloudFront, AWS Global Accelerator)<\/li><li>네트워크 아키텍처 설계 방법(예: 서브넷 티어, 라우팅, IP 주소 지정)<\/li><li>로드 밸런싱 개념(예: Application Load Balancer(ALB))<\/li><li>네트워크 연결 옵션(예: AWS VPN, AWS Direct Connect, AWS PrivateLink)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>다양한 아키텍처에 대한 네트워크 토폴로지 만들기(예: 글로벌, 하이브리드, 멀티 티어)<\/li><li>향후 요구 사항을 수용하도록 규모 조정 가능한 네트워크 구성 결정<\/li><li>비즈니스 요구 사항을 충족하는 적합한 리소스 배치 결정<\/li><li>적합한 로드 밸런싱 전략 선택<\/li><\/ul>", "<h3>작업 3.5: 고성능 데이터 수집 및 변환 솔루션 결정<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>데이터 분석 및 시각화 서비스와 적합한 사용 사례(예: Amazon Athena, AWS Lake Formation, Amazon Quick)<\/li><li>데이터 수집 패턴(예: 빈도)<\/li><li>데이터 전송 서비스와 적합한 사용 사례(예: AWS DataSync, AWS Storage Gateway)<\/li><li>데이터 변환 서비스와 적합한 사용 사례(예: AWS Glue)<\/li><li>수집 액세스 포인트에 대한 보안 액세스<\/li><li>비즈니스 요구 사항을 충족하는 데 필요한 크기 및 속도<\/li><li>스트리밍 데이터 서비스와 적합한 사용 사례(예: Amazon Kinesis)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>데이터 레이크 구축 및 보호<\/li><li>데이터 스트리밍 아키텍처 설계<\/li><li>데이터 전송 솔루션 설계<\/li><li>시각화 전략 구현<\/li><li>데이터 처리에 적합한 컴퓨팅 옵션 선택(예: Amazon EMR)<\/li><li>수집에 적합한 구성 선택<\/li><li>데이터 형식 변환(예: .csv에서.parquet으로 변환)<\/li><\/ul>"]}, {"n": "10", "title": "콘텐츠 도메인 4: 비용에 최적화된 아키텍처 설계", "secs": ["", "<h3>작업 4.1: 비용에 최적화된 스토리지 솔루션 설계<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>액세스 옵션(예: 요청자 지불 객체 스토리지가 포함된 S3 버킷)<\/li><li>AWS 비용 관리 서비스 기능(예: 비용 할당 태그, 다중 계정 결제)<\/li><li>AWS 비용 관리 도구와 적합한 사용 사례(예: AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)<\/li><li>AWS 스토리지 서비스와 적합한 사용 사례(예: Amazon FSx, Amazon EFS, Amazon S3, Amazon EBS)<\/li><li>백업 전략<\/li><li>블록 스토리지 옵션(예: 하드 디스크 드라이브(HDD) 볼륨 유형, 솔리드 스테이트 드라이브(SSD) 볼륨 유형)<\/li><li>데이터 수명 주기<\/li><li>하이브리드 스토리지 옵션(예: AWS DataSync, AWS Transfer Family, AWS Storage Gateway)<\/li><li>스토리지 액세스 패턴<\/li><li>스토리지 계층화(예: 객체 스토리지의 콜드 계층화)<\/li><li>연관된 특성이 있는 스토리지 유형(예: 객체, 파일, 블록)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>적합한 스토리지 전략 설계(예: Amazon S3에 배치 업로드와 개별 업로드 비교)<\/li><li>워크로드에 올바른 스토리지 크기 결정<\/li><li>워크로드에 대한 데이터를 AWS 스토리지로 전송하는 가장 저렴한 방법 결정<\/li><li>스토리지 오토 스케일링이 필요한 시점 결정<\/li><li>S3 객체 수명 주기 관리<\/li><li>적합한 백업 및/또는 아카이브 솔루션 선택<\/li><li>스토리지 서비스로의 데이터 마이그레이션에 적합한 서비스 선택<\/li><li>적합한 스토리지 티어 선택<\/li><li>스토리지에 올바른 데이터 수명 주기 선택<\/li><li>워크로드에 가장 비용 효율적인 스토리지 서비스 선택<\/li><\/ul>", "<h3>작업 4.2: 비용에 최적화된 컴퓨팅 솔루션 설계<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>AWS 비용 관리 서비스 기능(예: 비용 할당 태그, 다중 계정 결제)<\/li><li>AWS 비용 관리 도구와 적합한 사용 사례(예: AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)<\/li><li>AWS 글로벌 인프라(예: 가용 영역, AWS 리전)<\/li><li>AWS 구매 옵션(예: 스팟 인스턴스, 예약 인스턴스, 절감형 플랜)<\/li><li>분산 컴퓨팅 전략(예: 엣지 프로세싱)<\/li><li>하이브리드 컴퓨팅 옵션(예: AWS Outposts)<\/li><li>인스턴스 유형, 패밀리 및 크기(예: 메모리 최적화, 컴퓨팅 최적화, 가상화)<\/li><li>컴퓨팅 사용률 최적화(예: 컨테이너, 서버리스 컴퓨팅, 마이크로서비스)<\/li><li>크기 조정 전략(예: 오토 스케일링, 최대 절전 모드)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>적합한 로드 밸런싱 전략 결정(예: Application Load Balancer(계층 7)와 Network Load Balancer(계층 4)와 Gateway Load Balancer 비교)<\/li><li>탄력적인 워크로드에 적합한 스케일링 방법 및 전략 결정(예: 수평과 수직 비교, EC2 최대 절전 모드)<\/li><li>적합한 사용 사례로 비용 효율적인 AWS 컴퓨팅 서비스 결정(예: AWS Lambda, Amazon EC2, AWS Fargate)<\/li><li>다양한 워크로드 클래스에 필요한 가용성 결정(예: 프로덕션 워크로드, 비프로덕션 워크로드)<\/li><li>워크로드에 적합한 인스턴스 패밀리 선택<\/li><li>워크로드에 적합한 인스턴스 크기 선택<\/li><\/ul>", "<h3>작업 4.3: 비용에 최적화된 데이터베이스 솔루션 설계<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>AWS 비용 관리 서비스 기능(예: 비용 할당 태그, 다중 계정 결제)<\/li><li>AWS 비용 관리 도구와 적합한 사용 사례(예: AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)<\/li><li>캐싱 전략<\/li><li>데이터 보존 정책<\/li><li>데이터베이스 용량 계획(예: 용량 단위)<\/li><li>데이터베이스 연결 및 프록시<\/li><li>데이터베이스 엔진과 적합한 사용 사례(예: 이기종 마이그레이션, 동종 마이그레이션)<\/li><li>데이터베이스 복제(예: 읽기 전용 복제본)<\/li><li>데이터베이스 유형 및 서비스(예: 관계형과 비관계형 비교, Amazon Aurora, Amazon DynamoDB)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>적합한 백업 및 보존 정책 설계(예: 스냅샷 빈도)<\/li><li>적합한 데이터베이스 엔진 결정(예: MySQL과 PostgreSQL 비교)<\/li><li>적합한 사용 사례로 비용 효율적인 AWS 데이터베이스 서비스 결정(예: DynamoDB와 Amazon RDS 비교, 서버리스)<\/li><li>비용 효율적인 AWS 데이터베이스 유형 결정(예: 시계열 형식, 열 형식)<\/li><li>데이터베이스 스키마와 데이터를 다른 위치 및/또는 다른 데이터베이스 엔진으로 마이그레이션<\/li><\/ul>", "<h3>작업 4.4: 비용에 최적화된 네트워크 아키텍처 설계<\/h3>\n<p>관련 지식:<\/p>\n<ul><li>AWS 비용 관리 서비스 기능(예: 비용 할당 태그, 다중 계정 결제)<\/li><li>AWS 비용 관리 도구와 적합한 사용 사례(예: AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)<\/li><li>로드 밸런싱 개념(예: Application Load Balancer(ALB))<\/li><li>NAT 게이트웨이(예: NAT 인스턴스 비용과 NAT 게이트웨이 비용 비교)<\/li><li>네트워크 연결(예: 프라이빗 회선, 전용 회선, VPN)<\/li><li>네트워크 라우팅, 토폴로지 및 피어링(예: AWS Transit Gateway, VPC 피어링)<\/li><li>네트워크 서비스와 적합한 사용 사례(예: DNS)<\/li><\/ul>\n<p>관련 기술:<\/p>\n<ul><li>네트워크에 적합한 NAT 게이트웨이 유형 구성(예: 단일 공유 NAT 게이트웨이와 각 가용 영역의 NAT 게이트웨이 비교)<\/li><li>적합한 네트워크 연결 구성(예: AWS Direct Connect와 VPN과 인터넷 비교)<\/li><li>네트워크 전송 비용을 최소화하는 데 적합한 네트워크 경로 구성(예: 리전 간, 가용 영역 간, 프라이빗과 퍼블릭 간, AWS Global Accelerator, VPC 엔드포인트)<\/li><li>콘텐츠 전송 네트워크(CDN) 및 엣지 캐싱에 대한 전략적 요구 사항 결정<\/li><li>네트워크 최적화를 위한 기존 워크로드 검토<\/li><li>적합한 제한 전략 선택<\/li><li>네트워크 디바이스에 적합한 대역폭 할당 선택(예: 단일 VPN과 복수 VPN 비교, Direct Connect 속도)<\/li><\/ul>"]}, {"n": "11", "title": "기술 및 개념", "secs": ["<p>다음 목록에는 시험에 출제될 수 있는 기술 및 개념이 포함되어 있습니다. 이 목록에 모든 사항이 포함된 것은 아니며 변경될 수 있습니다. 이 목록에 나와 있는 다음 항목의 배치와 순서가 시험에서의 상대적 가중치 또는 중요도를 의미하지는 않습니다.<\/p>\n<ul><li>컴퓨팅<\/li><li>비용 관리<\/li><li>데이터베이스<\/li><li>재해 복구<\/li><li>고성능<\/li><li>AWS 관리 및 거버넌스<\/li><li>마이크로서비스 및 구성 요소 전송<\/li><li>마이그레이션 및 데이터 전송<\/li><li>네트워킹, 연결 및 콘텐츠 전송<\/li><li>복원력<\/li><li>보안<\/li><li>서버리스 및 이벤트 기반 설계 원칙<\/li><li>스토리지<\/li><\/ul>"]}, {"n": "12", "title": "시험에서 언급되는 AWS 서비스", "secs": ["<p>AWS Certification에서는 약어나 괄호 정보가 포함되어 있는 잘 알려진 AWS 서비스 이름에 대해 공식 약칭을 사용하여 이 시험에서 읽기에 대한 부담을 덜어줍니다. 예를 들면 Amazon Simple Notification Service(Amazon SNS) 는 시험에서 Amazon SNS로 표시됩니다.<\/p>\n<ul><li>시험의 도움말 기능(모든 문항에 사용 가능)에는 약칭으로 된 AWS 서비스 이름과 해당하는 전체 이름 목록이 포함되어 있습니다.<\/li><li>시험에서 약칭으로 표시되는 <a href=\"https://aws.amazon.com/certification/policies/general-information/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS 서비스 목록은<\/a> AWS Certification 웹 사이트의 서비스 이름을 참조하십시오. 목록에 있지만 시험 범위에 포함되지 않는 서비스는 시험에 표시되지 않습니다.<\/li><\/ul>\n<p><strong>참고:<\/strong> 시험에서 일부 약어는 완전히 풀어 쓰여 있지 않거나 도움말 기능에서 제공되지 않을 수 있습니다. 일부 AWS 서비스의 공식 전체 이름에는 풀어 쓰지 않는 약어가 포함되어 있습니다(예: Amazon API Gateway, Amazon EMR). 또한 시험에는 대상 응시자가 알아야 할 다른 약어가 포함될 수 있습니다.<\/p>"]}, {"n": "13", "title": "범위 내 AWS 서비스", "secs": ["<p>다음 목록은 시험 범위에 포함되는 AWS 서비스 및 기능입니다. 이 목록은 전체 목록이 아니며 변경될 수 있습니다. AWS 제품 및 서비스는 해당 제품 및 서비스의 주요 기능에 맞는 카테고리로 표시됩니다.<\/p>", "<h3>분석<\/h3>\n<ul><li>Amazon Athena<\/li><li>AWS Data Exchange<\/li><li>Amazon Data Firehose<\/li><li>Amazon EMR<\/li><li>AWS Glue<\/li><li>Amazon Kinesis<\/li><li>AWS Lake Formation<\/li><li>Amazon Managed Streaming for Apache Kafka(Amazon MSK)<\/li><li>Amazon OpenSearch Service<\/li><li>Amazon Quick<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>애플리케이션 통합<\/h3>\n<ul><li>Amazon AppFlow<\/li><li>Amazon EventBridge<\/li><li>Amazon MQ<\/li><li>Amazon SNS<\/li><li>Amazon SQS<\/li><li>AWS Step Functions<\/li><\/ul>", "<h3>AWS Cost Management<\/h3>\n<ul><li>AWS Budgets<\/li><li>AWS Cost and Usage Report<\/li><li>AWS Cost Explorer<\/li><li>절감형 플랜<\/li><\/ul>", "<h3>컴퓨팅<\/h3>\n<ul><li>AWS Batch<\/li><li>Amazon EC2<\/li><li>Amazon EC2 Auto Scaling<\/li><li>AWS Elastic Beanstalk<\/li><li>AWS Outposts<\/li><li>AWS Serverless Application Repository<\/li><li>VMware Cloud on AWS<\/li><li>AWS Wavelength<\/li><\/ul>", "<h3>컨테이너<\/h3>\n<ul><li>Amazon ECR<\/li><li>Amazon ECS<\/li><li>Amazon ECS Anywhere<\/li><li>Amazon EKS<\/li><li>Amazon EKS Anywhere<\/li><li>Amazon EKS Distro<\/li><\/ul>", "<h3>데이터베이스<\/h3>\n<ul><li>Amazon Aurora<\/li><li>Amazon Aurora Serverless<\/li><li>Amazon DocumentDB<\/li><li>Amazon DynamoDB<\/li><li>Amazon ElastiCache<\/li><li>Amazon Keyspaces<\/li><li>Amazon Neptune<\/li><li>Amazon RDS<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>개발자 도구<\/h3>\n<ul><li>AWS X-Ray<\/li><\/ul>", "<h3>프런트 엔드 웹 및 모바일<\/h3>\n<ul><li>AWS Amplify<\/li><li>Amazon API Gateway<\/li><li>AWS Device Farm<\/li><\/ul>", "<h3>기계 학습<\/h3>\n<ul><li>Amazon Comprehend<\/li><li>Amazon Lex<\/li><li>Amazon Polly<\/li><li>Amazon Rekognition<\/li><li>Amazon SageMaker AI<\/li><li>Amazon Textract<\/li><li>Amazon Transcribe<\/li><li>Amazon Translate<\/li><\/ul>", "<h3>AWS의 관리 및 거버넌스<\/h3>\n<ul><li>AWS Auto Scaling<\/li><li>AWS CLI<\/li><li>AWS CloudFormation<\/li><li>AWS CloudTrail<\/li><li>Amazon CloudWatch<\/li><li>AWS Compute Optimizer<\/li><li>AWS Config<\/li><li>AWS Control Tower<\/li><li>AWS Health Dashboard<\/li><li>AWS License Manager<\/li><li>Amazon Managed Grafana<\/li><li>Amazon Managed Service for Prometheus<\/li><li>AWS Management Console<\/li><li>AWS Organizations<\/li><li>AWS Service Catalog<\/li><li>AWS Systems Manager<\/li><li>AWS Trusted Advisor<\/li><li>AWS Well-Architected Tool<\/li><\/ul>", "<h3>미디어 서비스<\/h3>\n<ul><li>Amazon Elastic Transcoder<\/li><li>Amazon Kinesis Video Streams<\/li><\/ul>", "<h3>마이그레이션 및 전송<\/h3>\n<ul><li>AWS Application Migration Service<\/li><li>AWS DataSync<\/li><li>AWS DMS<\/li><li>AWS Snow Family<\/li><li>AWS Transfer Family<\/li><\/ul>", "<h3>네트워킹 및 콘텐츠 전송<\/h3>\n<ul><li>AWS Client VPN<\/li><li>Amazon CloudFront<\/li><li>AWS Direct Connect<\/li><li>Elastic Load Balancing(ELB)<\/li><li>AWS Global Accelerator<\/li><li>AWS PrivateLink<\/li><li>Amazon Route 53<\/li><li>AWS Site-to-Site VPN<\/li><li>AWS Transit Gateway<\/li><li>Amazon VPC<\/li><\/ul>", "<h3>보안, ID 및 규정 준수<\/h3>\n<ul><li>AWS Artifact<\/li><li>AWS Certificate Manager(ACM)<\/li><li>AWS CloudHSM<\/li><li>Amazon Cognito<\/li><li>Amazon Detective<\/li><li>AWS Directory Service<\/li><li>AWS Firewall Manager<\/li><li>Amazon GuardDuty<\/li><li>AWS IAM Identity Center<\/li><li>Amazon Inspector<\/li><li>AWS KMS<\/li><li>Amazon Macie<\/li><li>AWS Network Firewall<\/li><li>AWS Resource Access Manager(AWS RAM)<\/li><li>AWS Secrets Manager<\/li><li>AWS Security Hub<\/li><li>AWS Shield<\/li><li>AWS WAF<\/li><li>IAM<\/li><\/ul>", "<h3>서버리스<\/h3>\n<ul><li>AWS Fargate<\/li><li>AWS Lambda<\/li><\/ul>", "<h3>스토리지<\/h3>\n<ul><li>AWS Backup<\/li><li>Amazon EBS<\/li><li>Amazon EFS<\/li><li>Amazon FSx(모든 유형)<\/li><li>Amazon S3<\/li><li>Amazon S3 Glacier<\/li><li>AWS Storage Gateway<\/li><\/ul>"]}, {"n": "14", "title": "범위 외 AWS 서비스", "secs": ["<p>다음 목록은 시험 범위에 포함되지 않는 AWS 서비스 및 기능입니다. 이 목록은 전체 목록이 아니며 변경될 수 있습니다. 시험의 대상 작업 역할과 전혀 관련이 없는 AWS 제품 및 서비스는 다음 목록에서 제외됩니다.<\/p><h3>애플리케이션 통합<\/h3>\n<ul><li>Amazon Managed Workflows for Apache Airflow(Amazon MWAA)<\/li><\/ul><h3>AR 및 VR:<\/h3>\n<ul><li>Amazon Sumerian<\/li><\/ul><h3>Blockchain<\/h3>\n<ul><li>Amazon Managed Blockchain<\/li><\/ul><h3>컴퓨팅<\/h3>\n<ul><li>Amazon Lightsail<\/li><\/ul><h3>데이터베이스<\/h3>\n<ul><li>Amazon RDS on VMware<\/li><\/ul><h3>개발자 도구<\/h3>\n<ul><li>AWS CDK<\/li><li>AWS CloudShell<\/li><li>AWS CodeArtifact<\/li><li>AWS CodeBuild<\/li><li>AWS CodeCommit<\/li><li>AWS CodeDeploy<\/li><li>Amazon Corretto<\/li><li>AWS Fault Injection Simulator(AWS FIS)<\/li><li>AWS 도구 및 SDK<\/li><\/ul><h3>프런트 엔드 웹 및 모바일<\/h3>\n<ul><li>Amazon Location Service<\/li><\/ul><h3>게임 기술<\/h3>\n<ul><li>Amazon GameLift<\/li><\/ul><h3>사물 인터넷(IoT)<\/h3>\n<ul><li>모든 서비스<\/li><\/ul><h3>기계 학습<\/h3>\n<ul><li>Apache MXNet on AWS<\/li><li>AWS DeepComposer<\/li><li>AWS Deep Learning AMIs(DLAMI)<\/li><li>AWS Deep Learning Containers<\/li><li>Amazon DevOps Guru<\/li><li>Amazon Elastic Inference<\/li><li>Amazon HealthLake<\/li><li>AWS Inferentia<\/li><li>Amazon Personalize<\/li><li>PyTorch on AWS<\/li><li>TensorFlow on AWS<\/li><\/ul><h3>AWS의 관리 및 거버넌스<\/h3>\n<ul><li>AWS Console Mobile Application<\/li><li>AWS Distro for OpenTelemetry<\/li><\/ul><h3>미디어 서비스<\/h3>\n<ul><li>AWS Elemental Appliances and Software<\/li><li>AWS Elemental MediaConnect<\/li><li>AWS Elemental MediaConvert<\/li><li>AWS Elemental MediaLive<\/li><li>AWS Elemental MediaPackage<\/li><li>AWS Elemental MediaTailor<\/li><li>Amazon Interactive Video Service(Amazon IVS)<\/li><\/ul><h3>마이그레이션 및 전송<\/h3>\n<ul><li>마이그레이션 평가기<\/li><\/ul><h3>네트워킹 및 콘텐츠 전송<\/h3>\n<ul><li>AWS Cloud Map<\/li><\/ul><h3>양자 기술<\/h3>\n<ul><li>Amazon Braket<\/li><\/ul><h3>인공위성<\/h3>\n<ul><li>AWS Ground Station<\/li><\/ul>"]}, {"n": "15", "title": "Revisions", "secs": ["<p>AWS exam guides are periodically reviewed and updated to ensure that our certification exams test skills and AWS services and features that are relevant for the job role(s) that a certification is designed to target. Exam guide updates will be published approximately one month before updates will be reflected on your exam.<\/p>", "<h3>Change History<\/h3>\n<table><thead><tr><th>Version<\/th><th>Publication date<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>August 28, 2026<\/td><\/tr><tr><td>1.1<\/td><td>October 29, 2026<\/td><\/tr><\/tbody><\/table>", "<h3>Changes to in- and out-of-scope services<\/h3>", "<h4>Services removed from the in-scope list<\/h4>\n<ul><li>Amazon Elastic Transcoder<\/li><\/ul>", "<h4>Services removed from the out-of-scope list<\/h4>\n<ul><li>AWS DeepComposer<\/li><li>Amazon DevOps Guru<\/li><li>Amazon Elastic Inference<\/li><li>Amazon Managed Blockchain<\/li><li>Amazon Sumerian<\/li><\/ul>"]}, {"n": "16", "title": "설문 조사", "secs": ["<p>이 시험 안내서가 도움이 되었습니까? <a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=SAA-Associate&amp;course_id=SAA-C03&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">설문 조사<\/a>에 참여하여 알려 주시기 바랍니다.<\/p>"]}]}, "ja": {"title": "AWS Certified Solutions Architect - Associate (SAA-C03)", "note": ["Source: https://docs.aws.amazon.com/ja_jp/aws-certification/latest/solutions-architect-associate-03/solutions-architect-associate-03.html (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "AWS Certified Solutions Architect - Associate (SAA-C03)", "secs": ["<p>AWS Certified Solutions Architect - Associate (SAA-C03) 試験は、ソリューションアーキテクトの役割を担う方を対象としています。本試験では、AWS Well-Architected フレームワークに基づいてソリューションを設計する受験者の能力を検証します。<\/p>"]}, {"n": "2", "title": "はじめに", "secs": ["<p><a href=\"https://aws.amazon.com/certification/certified-solutions-architect-associate/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Certified Solutions Architect - Associate (SAA-C03)<\/a> 試験は、ソリューションアーキテクトの役割を担う方を対象としています。本試験では、AWS Well-Architected フレームワークに基づいてソリューションを設計する受験者の能力を検証します。<\/p>\n<p>また、次のタスクについての受験者の能力も検証します。<\/p>\n<ul><li>現在のビジネス要件と将来予測されるニーズを満たすように AWS のサービスを組み込んだソリューションを設計する。<\/li><li>安全性、レジリエンス、高パフォーマンス、コスト最適化を実現したアーキテクチャを設計する。<\/li><li>既存のソリューションをレビューし、改善点を判断する。<\/li><\/ul>"]}, {"n": "3", "title": "受験対象者について", "secs": ["<p>受験対象者には、AWS のサービスを使用するクラウドソリューション設計の実務経験が 1 年以上必要です。<\/p>"]}, {"n": "4", "title": "試験内容", "secs": ["", "<h3>解答タイプ<\/h3>\n<p>試験には次の 2 種類の設問があります。<\/p>\n<ul><li><strong>択一選択問題:<\/strong> 正しい選択肢が 1 つ、誤った選択肢 (不正解) が 3 つ提示される。<\/li><li><strong>複数選択問題:<\/strong> 5 つ以上の選択肢のうち、正解が 2 つ以上ある。<\/li><\/ul>\n<p>設問の記述に最もよく当てはまるもの、または正解となるものを 1 つ以上選択します。不正解の選択肢は、知識や技術が不十分な受験者が選択してしまいそうな、設問内容と一致するもっともらしい解答になっています。<\/p>\n<p>未解答の設問は不正解とみなされます。推測による解答にペナルティはありません。試験には、スコアに影響する設問が 50 問含まれています。<\/p>", "<h3>採点対象外の設問<\/h3>\n<p>試験には、スコアに影響しない採点対象外の設問が 15 問含まれています。AWS では、これら採点対象外の設問における成績情報を収集し、これらの設問を今後採点対象の設問として使用できるかどうかを評価します。試験では、どの設問が採点対象外かは受験者にわからないようになっています。<\/p>", "<h3>試験の結果<\/h3>\n<p>AWS Certified Solutions Architect - Associate (SAA-C03) 試験は、合否判定方式です。試験の採点は、認定業界のベストプラクティスおよびガイドラインに基づいた、AWS の専門家によって定められる最低基準に照らして行われます。<\/p>\n<p>試験の結果は、100～1,000 の換算スコアとして報告されます。合格スコアは 720 です。このスコアにより、試験全体の成績と合否がわかります。複数の試験間で難易度がわずかに異なる可能性があるため、スコアを均等化するために換算スコアが使用されます。<\/p>\n<p>スコアレポートには、各セクションの成績を示す分類表が含まれる場合があります。試験には補整スコアリングモデルが使用されるため、セクションごとに合否ラインは設定されておらず、試験全体のスコアで合否が判定されます。<\/p>\n<p>試験の各セクションには特定の重みが設定されているため、各セクションに割り当てられる設問数が異なる場合があります。分類表には、受験者の得意分野と不得意分野を示す全般的な情報が含まれます。セクションごとのフィードバックを解釈する際は注意してください。<\/p>"]}, {"n": "5", "title": "試験内容の概要", "secs": ["<p>この試験ガイドには、試験に設定された重み、コンテンツ分野、タスクステートメントについての説明が含まれています。本ガイドは、試験内容の包括的なリストを提供するものではありません。ただし、各タスクステートメントの追加情報を使って、試験の準備に役立てることができます。<\/p>\n<p>本試験のコンテンツ分野と重み設定は、次のとおりです。<\/p>\n<ul><li>コンテンツ分野 1: セキュアなアーキテクチャの設計 (採点対象コンテンツの 30%)<\/li><li>コンテンツ分野 2: レジリエントなアーキテクチャの設計 (採点対象コンテンツの 26%)<\/li><li>コンテンツ分野 3: 高パフォーマンスなアーキテクチャの設計 (採点対象コンテンツの 24%)<\/li><li>コンテンツ分野 4: コストを最適化したアーキテクチャの設計 (採点対象コンテンツの 20%)<\/li><\/ul>"]}, {"n": "6", "title": "サービスリファレンス", "secs": ["<p>次のセクションでは、本認定試験に関連する AWS のサービス、テクノロジー、概念について詳しく説明します。<\/p>\n<ul><li>テクノロジーと概念<\/li><li>試験での AWS サービスへの言及<\/li><li>対象の AWS サービス<\/li><li>対象外の AWS サービス<\/li><\/ul>"]}, {"n": "7", "title": "コンテンツ分野 1: セキュアなアーキテクチャの設計", "secs": ["", "<h3>タスク 1.1: AWS リソースへのセキュアなアクセスを設計する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>複数のアカウントにまたがるアクセス制御と管理<\/li><li>AWS フェデレーションアクセスとアイデンティティサービス (IAM、AWS IAM アイデンティティセンターなど)<\/li><li>AWS グローバルインフラストラクチャ (アベイラビリティーゾーン、AWS リージョンなど)<\/li><li>AWS セキュリティのベストプラクティス (最小権限の原則など)<\/li><li>AWS 責任共有モデル<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>AWS セキュリティのベストプラクティスを IAM ユーザーとルートユーザーに適用する [多要素認証 (MFA) など]。<\/li><li>IAM ユーザー、グループ、ロール、ポリシーを含む柔軟な認可モデルを設計する。<\/li><li>ロールベースのアクセスコントロール戦略 (AWS STS、ロールスイッチング、クロスアカウントアクセスなど) を設計する。<\/li><li>複数の AWS アカウント [AWS Control Tower、サービスコントロールポリシー (SCP) など] のセキュリティ戦略を設計する。<\/li><li>AWS のサービスに対するリソースポリシーの適切な使用を判断する。<\/li><li>IAM ロールを使用して Directory Service をフェデレートする場面を判断する。<\/li><\/ul>", "<h3>タスク 1.2: セキュアなワークロードとアプリケーションを設計する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>アプリケーション設定と認証情報のセキュリティ<\/li><li>AWS サービスエンドポイント<\/li><li>AWS の制御ポート、プロトコル、ネットワークトラフィック<\/li><li>セキュアなアプリケーションアクセス<\/li><li>適切なユースケースを備えたセキュリティサービス (Amazon Cognito、Amazon GuardDuty、Amazon Macie など)<\/li><li>AWS 外部の脅威ベクトル (DDoS、SQL インジェクションなど)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>セキュリティコンポーネント (セキュリティグループ、ルートテーブル、ネットワーク ACL、NAT ゲートウェイなど) を使用した VPC アーキテクチャの設計<\/li><li>ネットワークセグメンテーション戦略の決定 (パブリックサブネットとプライベートサブネットの使用など)<\/li><li>AWS のサービスとの統合によるアプリケーションの保護 (AWS Shield、AWS WAF、IAM アイデンティティセンター、AWS Secrets Manager など)<\/li><li>AWS クラウドと外部ネットワーク接続の保護 (VPN、AWS Direct Connect など)<\/li><\/ul>", "<h3>タスク 1.3: 適切なデータセキュリティ管理を判断する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>データアクセスとガバナンス<\/li><li>データ復旧<\/li><li>データ保持と分類<\/li><li>暗号化と適切なキー管理<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>コンプライアンス要件を満たすために AWS テクノロジーを調整する。<\/li><li>保管中のデータを暗号化する (AWS KMS など)。<\/li><li>転送中のデータを暗号化する [TLS を使用した AWS Certificate Manager (ACM) など]。<\/li><li>暗号化キーにアクセスポリシーを実装する。<\/li><li>データバックアップとレプリケーションを実装する。<\/li><li>データアクセス、ライフサイクル、保護に関するポリシーを実装する。<\/li><li>暗号化キーのローテーションと証明書を更新する。<\/li><\/ul>"]}, {"n": "8", "title": "コンテンツ分野 2: レジリエントなアーキテクチャの設計", "secs": ["", "<h3>タスク 2.1: スケーラブルな疎結合アーキテクチャを設計する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>API の作成と管理 (Amazon API Gateway、REST API など)<\/li><li>AWS マネージドサービスの適切なユースケース (AWS Transfer Family、Amazon SQS、AWS Secrets Manager など)<\/li><li>キャッシュ戦略<\/li><li>マイクロサービスの設計原則 (ステートレスワークロードとステートフルワークロードの比較など)<\/li><li>イベント駆動型アーキテクチャ<\/li><li>垂直スケーリングと水平スケーリング<\/li><li>エッジアクセラレーター [コンテンツ配信ネットワーク (CDN) など] を適切に使用する方法<\/li><li>アプリケーションをコンテナに移行する方法<\/li><li>ロードバランシングの概念 [Application Load Balancer (ALB) など]<\/li><li>多層アーキテクチャ<\/li><li>キューイングとメッセージングの概念 (パブリッシュ/サブスクライブなど)<\/li><li>サーバーレステクノロジーとパターン (AWS Fargate、AWS Lambda など)<\/li><li>ストレージの種類とその特性 (オブジェクト、ファイル、ブロックなど)<\/li><li>コンテナのオーケストレーション (Amazon ECS、Amazon EKS など)<\/li><li>リードレプリカを使用するタイミング<\/li><li>ワークフローオーケストレーション (AWS Step Functions など)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>要件に基づいてイベント駆動型、マイクロサービス、多層アーキテクチャを設計する。<\/li><li>アーキテクチャ設計で使用されるコンポーネントのスケーリング戦略を決定する。<\/li><li>要件に基づいて、疎結合を実現するために必要な AWS のサービスを決定する。<\/li><li>コンテナを使用する場面を判断する。<\/li><li>サーバーレステクノロジーとパターンを使用する場面を判断する。<\/li><li>要件に基づいて適切なコンピューティング、ストレージ、ネットワーク、データベーステクノロジーを推奨する。<\/li><li>ワークロードに特化した AWS のサービスを使用する。<\/li><\/ul>", "<h3>タスク 2.2: 高可用性および/または耐障害性のあるアーキテクチャを設計する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>AWS グローバルインフラストラクチャ (アベイラビリティーゾーン、AWS リージョン、Amazon Route 53 など)<\/li><li>AWS マネージドサービス (AMS) と適切なユースケース (Amazon Comprehend、Amazon Polly など)<\/li><li>ネットワークの基本概念 (ルートテーブルなど)<\/li><li>ディザスタリカバリ (DR) 戦略 [バックアップと復元、パイロットライト、ウォームスタンバイ、アクティブ/アクティブフェイルオーバー、目標復旧時点 (RPO)、目標復旧時間 (RTO) など]<\/li><li>分散型設計パターン<\/li><li>フェイルオーバー戦略<\/li><li>イミュータブルインフラストラクチャ<\/li><li>ロードバランシングの概念 (ALB など)<\/li><li>プロキシの概念 (Amazon RDS プロキシなど)<\/li><li>サービスクォータとスロットリング (スタンバイ環境でワークロードのサービスクォータを構成する方法など)<\/li><li>ストレージオプションと特性 (耐久性、レプリケーションなど)<\/li><li>ワークロードの可視性 (AWS X-Ray など)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>インフラストラクチャの整合性を確保するオートメーション戦略を決定する。<\/li><li>AWS リージョンまたはアベイラビリティーゾーン全体にわたって、高可用性および/または耐障害性のあるアーキテクチャを提供するのに必要な AWS のサービスを決定する。<\/li><li>ビジネス要件に基づいてメトリクスを特定し、可用性の高いソリューションを提供する。<\/li><li>単一障害点を軽減する設計を実装する。<\/li><li>データの耐久性と可用性を確保するための戦略 (バックアップなど) を実装する。<\/li><li>ビジネス要件を満たす適切な DR 戦略を選択する。<\/li><li>レガシーアプリケーションやクラウドに最適化されていないアプリケーション (アプリケーションの変更が不可能な場合など) の信頼性を向上させるために AWS のサービスを利用する。<\/li><li>ワークロードに特化した AWS のサービスを使用する。<\/li><\/ul>"]}, {"n": "9", "title": "コンテンツ分野 3: 高パフォーマンスなアーキテクチャの設計", "secs": ["", "<h3>タスク 3.1: 高パフォーマンスでスケーラブルなストレージソリューションを選択する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>ビジネス要件を満たすハイブリッドストレージソリューション<\/li><li>ストレージサービスの適切なユースケース (Amazon S3、Amazon EFS、Amazon EBS など)<\/li><li>ストレージの種類とその特性 (オブジェクト、ファイル、ブロックなど)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>パフォーマンス要件を満たすストレージサービスと設定を決定する。<\/li><li>将来のニーズに合わせてスケールできるストレージサービスを特定する。<\/li><\/ul>", "<h3>タスク 3.2: 高パフォーマンスで伸縮自在なコンピューティングソリューションを設計する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>AWS コンピューティングサービスの適切なユースケース (AWS Batch、Amazon EMR、AWS Fargate など)<\/li><li>AWS グローバルインフラストラクチャとエッジサービスによって提供される分散コンピューティングの概念<\/li><li>キューイングとメッセージングの概念 (パブリッシュ/サブスクライブなど)<\/li><li>適切なユースケースによるスケーラビリティ機能 (Amazon EC2 Auto Scaling、AWS Auto Scaling など)<\/li><li>サーバーレステクノロジーとパターン (AWS Lambda、Fargate など)<\/li><li>コンテナのオーケストレーション (Amazon ECS、Amazon EKS など)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>コンポーネントを個別にスケールできるようにワークロードを疎結合にする。<\/li><li>スケーリングアクションを実行するメトリクスと条件を特定する。<\/li><li>ビジネス要件を満たす適切なコンピューティングオプションと機能 (EC2 インスタンスタイプなど) を選択する。<\/li><li>ビジネス要件を満たす適切なリソースタイプとサイズ (Lambda メモリの容量など) を選択する。<\/li><\/ul>", "<h3>タスク 3.3: 高パフォーマンスなデータベースソリューションを選択する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>AWS グローバルインフラストラクチャ (アベイラビリティーゾーン、AWS リージョンなど)<\/li><li>キャッシュ戦略とサービス (Amazon ElastiCache など)<\/li><li>データアクセスパターン (読み取り集中型と書き込み集中型など)<\/li><li>データベースキャパシティープランニング (キャパシティーユニット、インスタンスタイプ、プロビジョンド IOPS など)<\/li><li>データベース接続とプロキシ<\/li><li>データベースエンジンの適切なユースケース (異種間移行、同種間移行など)<\/li><li>データベースレプリケーション (リードレプリカなど)<\/li><li>データベースタイプとサービス (サーバーレス、リレーショナルと非リレーショナルの比較、インメモリなど)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>ビジネス要件を満たすようにリードレプリカを設定する。<\/li><li>データベースアーキテクチャを設計する。<\/li><li>適切なデータベースエンジンを決定する (MySQL と PostgreSQL の比較など)。<\/li><li>適切なデータベースタイプを決定する (Amazon Aurora、Amazon DynamoDB など)。<\/li><li>ビジネス要件に合わせてキャッシングを統合する。<\/li><\/ul>", "<h3>タスク 3.4: 高パフォーマンスでスケーラブルなネットワークアーキテクチャを選択する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>エッジネットワークサービスの適切なユースケース (Amazon CloudFront、AWS Global Accelerator など)<\/li><li>ネットワークアーキテクチャの設計方法 (サブネット層、ルーティング、IP アドレス指定など)<\/li><li>ロードバランシングの概念 [Application Load Balancer (ALB) など]<\/li><li>ネットワーク接続オプション (AWS VPN、AWS Direct Connect、AWS PrivateLink など)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>さまざまなアーキテクチャ (グローバル、ハイブリッド、多層など) のネットワークトポロジを作成する。<\/li><li>将来のニーズに合わせてスケールできるネットワーク設定を決定する。<\/li><li>ビジネス要件を満たす適切なリソース配置を決定する。<\/li><li>適切なロードバランシング戦略を選択する。<\/li><\/ul>", "<h3>タスク 3.5: 高パフォーマンスなデータ取り込みと変換のソリューションを選択する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>データ分析および視覚化サービスの適切なユースケース (Amazon Athena、AWS Lake Formation、Amazon Quick など)<\/li><li>データ取り込みパターン (頻度など)<\/li><li>データ転送サービスの適切なユースケース (AWS DataSync、AWS Storage Gateway など)<\/li><li>データ変換サービスの適切なユースケース (AWS Glue など)<\/li><li>取り込みアクセスポイントへのセキュアなアクセス<\/li><li>ビジネス要件に必要なサイズと速度<\/li><li>ストリーミングデータサービスの適切なユースケース (Amazon Kinesis など)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>データレイクを構築および保護する。<\/li><li>データストリーミングアーキテクチャを設計する。<\/li><li>データ転送ソリューションを設計する。<\/li><li>可視化戦略を実装する。<\/li><li>データ処理に適したコンピューティングオプション (Amazon EMR など) を選択する。<\/li><li>取り込みに適した設定を選択する。<\/li><li>データの形式を変換する (.csv から .parquet など)。<\/li><\/ul>"]}, {"n": "10", "title": "コンテンツ分野 4: コストを最適化したアーキテクチャの設計", "secs": ["", "<h3>タスク 4.1: コストを最適化したストレージソリューションを設計する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>アクセスオプション (リクエスタ支払いのオブジェクトストレージを持つ S3 バケットなど)<\/li><li>AWS コスト管理サービスの機能 (コスト配分タグ、マルチアカウント請求など)<\/li><li>AWS コスト管理ツールの適切なユースケース (AWS Cost Explorer、AWS Budgets、AWS Cost and Usage Report など)<\/li><li>AWS ストレージサービスの適切なユースケース (Amazon FSx、Amazon EFS、Amazon S3、Amazon EBS など)<\/li><li>バックアップ戦略<\/li><li>ブロックストレージオプション [ハードディスクドライブ (HDD) ボリュームタイプ、ソリッドステートドライブ (SSD) ボリュームタイプなど]<\/li><li>データライフサイクル<\/li><li>ハイブリッドストレージオプション (AWS DataSync、AWS Transfer Family、AWS Storage Gateway など)<\/li><li>ストレージアクセスパターン<\/li><li>ストレージ階層化 (オブジェクトストレージのコールド階層化など)<\/li><li>ストレージの種類とその特性 (オブジェクト、ファイル、ブロックなど)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>適切なストレージ戦略を設計する (Amazon S3 へのバッチアップロードと個別のアップロードとの比較など)。<\/li><li>ワークロードに適したストレージサイズを決定する。<\/li><li>ワークロードのデータを AWS ストレージに転送する際に最もコストが低い方法を判断する。<\/li><li>ストレージの自動スケーリングが必要な場面を判断する。<\/li><li>S3 オブジェクトのライフサイクルを管理する。<\/li><li>適切なバックアップおよび/またはアーカイブソリューションを選択する。<\/li><li>ストレージサービスへのデータ移行に適したサービスを選択する。<\/li><li>適切なストレージ階層を選択する。<\/li><li>ストレージに適切なデータライフサイクルを選択する。<\/li><li>ワークロードに応じて最も費用対効果の高いストレージサービスを選択する。<\/li><\/ul>", "<h3>タスク 4.2: コストを最適化したコンピューティングソリューションを設計する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>AWS コスト管理サービスの機能 (コスト配分タグ、マルチアカウント請求など)<\/li><li>AWS コスト管理ツールの適切なユースケース (AWS Cost Explorer、AWS Budgets、AWS Cost and Usage Report など)<\/li><li>AWS グローバルインフラストラクチャ (アベイラビリティーゾーン、AWS リージョンなど)<\/li><li>AWS 購入オプション (スポットインスタンス、リザーブドインスタンス、Savings Plans など)<\/li><li>分散コンピューティング戦略 (エッジ処理など)<\/li><li>ハイブリッドコンピューティングオプション (AWS Outposts など)<\/li><li>インスタンスタイプ、ファミリー、サイズ (メモリ最適化、コンピューティング最適化、仮想化など)<\/li><li>コンピューティング使用率の最適化 (コンテナ、サーバーレスコンピューティング、マイクロサービスなど)<\/li><li>スケーリング戦略 (自動スケーリング、休止状態など)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>適切なロードバランシング戦略を判断する [Application Load Balancer (レイヤー 7)、Network Load Balancer (レイヤー 4)、Gateway Load Balancer の比較など]。<\/li><li>伸縮自在なワークロードのための適切なスケーリング方法と戦略を決定する (水平と垂直の比較、EC2 の休止状態など)。<\/li><li>費用対効果の高い AWS コンピューティングサービスを適切なユースケースに応じて決定する (AWS Lambda、Amazon EC2、AWS Fargate など)。<\/li><li>さまざまなクラスのワークロード (本番ワークロード、非本番ワークロードなど) に必要な可用性を判断する。<\/li><li>ワークロードに適したインスタンスファミリーを選択する。<\/li><li>ワークロードに適したインスタンスサイズを選択する。<\/li><\/ul>", "<h3>タスク 4.3: コストを最適化したデータベースソリューションを設計する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>AWS コスト管理サービスの機能 (コスト配分タグ、マルチアカウント請求など)<\/li><li>AWS コスト管理ツールの適切なユースケース (AWS Cost Explorer、AWS Budgets、AWS Cost and Usage Report など)<\/li><li>キャッシュ戦略<\/li><li>データ保持ポリシー<\/li><li>データベースキャパシティープランニング (キャパシティーユニットなど)<\/li><li>データベース接続とプロキシ<\/li><li>データベースエンジンの適切なユースケース (異種間移行、同種間移行など)<\/li><li>データベースレプリケーション (リードレプリカなど)<\/li><li>データベースタイプとサービス (リレーショナルと非リレーショナルの比較、Amazon Aurora、Amazon DynamoDB など)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>適切なバックアップポリシーと保持ポリシー (スナップショットの頻度など) を設計する。<\/li><li>適切なデータベースエンジンを決定する (MySQL と PostgreSQL の比較など)。<\/li><li>費用対効果の高い AWS データベースサービスをユースケースに応じて決定する (DynamoDB と Amazon RDS の比較、サーバーレスなど)。<\/li><li>費用対効果の高い AWS データベースタイプ (時系列形式、列指向形式など) を決定する。<\/li><li>データベーススキーマとデータを異なる場所および/または異なるデータベースエンジンに移行する。<\/li><\/ul>", "<h3>タスク 4.4: コストを最適化したネットワークアーキテクチャを設計する。<\/h3>\n<p>対象知識:<\/p>\n<ul><li>AWS コスト管理サービスの機能 (コスト配分タグ、マルチアカウント請求など)<\/li><li>AWS コスト管理ツールの適切なユースケース (AWS Cost Explorer、AWS Budgets、AWS Cost and Usage Report など)<\/li><li>ロードバランシングの概念 [Application Load Balancer (ALB) など]<\/li><li>NAT ゲートウェイ (NAT インスタンスと NAT ゲートウェイのコスト比較など)<\/li><li>ネットワーク接続 (プライベート回線、専用回線、VPN など)<\/li><li>ネットワークルーティング、トポロジ、ピアリング (AWS Transit Gateway、VPC ピアリングなど)<\/li><li>ネットワークサービスの適切なユースケース (DNS など)<\/li><\/ul>\n<p>対象スキル:<\/p>\n<ul><li>ネットワークに適切な NAT ゲートウェイタイプを設定する (1 つの共有 NAT ゲートウェイと各アベイラビリティーゾーンの NAT ゲートウェイの比較など)。<\/li><li>適切なネットワーク接続を設定する (AWS Direct Connect、VPN、インターネットの比較など)。<\/li><li>ネットワーク転送コストを最小限に抑えるために適切なネットワークルートを設定する (リージョン間、アベイラビリティーゾーン間、プライベートからパブリック、AWS Global Accelerator、VPC エンドポイントなど)。<\/li><li>コンテンツ配信ネットワーク (CDN) とエッジキャッシュに対する戦略的ニーズを判断する。<\/li><li>既存のワークロードをレビューしてネットワークを最適化する。<\/li><li>適切なスロットリング戦略を選択する。<\/li><li>ネットワークデバイスに適切な帯域幅割り当てを選択する (単一の VPN と複数の VPN の比較、Direct Connect の速度など)。<\/li><\/ul>"]}, {"n": "11", "title": "テクノロジーと概念", "secs": ["<p>以下は、試験に出題される可能性のあるテクノロジーと概念のリストです。このリストはすべてを網羅しているわけではなく、また、変更される場合もあります。このリストにおける項目の掲載順序や配置は、その項目の相対的な重みや試験における重要性を示すものではありません。<\/p>\n<ul><li>コンピューティング<\/li><li>コスト管理<\/li><li>データベース<\/li><li>ディザスタリカバリ<\/li><li>高パフォーマンス<\/li><li>マネジメントとガバナンス<\/li><li>マイクロサービスとコンポーネントの配信<\/li><li>移行とデータ転送<\/li><li>ネットワーク、接続、コンテンツ配信<\/li><li>レジリエンス<\/li><li>セキュリティ<\/li><li>サーバーレスでイベント駆動型の設計原則<\/li><li>ストレージ<\/li><\/ul>"]}, {"n": "12", "title": "試験での AWS サービスへの言及", "secs": ["<p>AWS 認定では、略語や括弧付き情報を含む周知の AWS サービス名に正式な短縮名を使用して、この試験を容易に読めるようにしています。例えば Amazon Simple Notification Service (Amazon SNS) は、試験では Amazon SNS と記載されます。<\/p>\n<ul><li>試験のヘルプ機能 (すべての問題に用意されています) には、AWS サービスの短縮名と、それに対応する正式名のリストが含まれています。<\/li><li>試験に短縮名で表示されるサービスのリストについては、AWS 認定ウェブサイトの <a href=\"https://aws.amazon.com/certification/policies/general-information/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS サービス名<\/a> を参照してください。リストに含まれているサービスのうち、試験対象外のものは試験に記載されていません。<\/li><\/ul>\n<p><strong>注記:<\/strong> 略語には、試験で正式名が記述されていないものや、ヘルプ機能に含まれていないものもあります。一部の AWS サービスの正式名には、正式名では記載されない略語が含まれています (Amazon API Gateway、Amazon EMR など) 。また、試験には、受験者が知っていると想定される略語が含まれる場合もあります。<\/p>"]}, {"n": "13", "title": "対象の AWS サービス", "secs": ["<p>以下に、試験対象の AWS のサービスと機能のリストを示します。このリストはすべてを網羅しているわけではなく、また、変更される場合もあります。AWS のサービスは、サービスの主要機能に沿ったカテゴリに分類されています。<\/p>", "<h3>分析<\/h3>\n<ul><li>Amazon Athena<\/li><li>AWS Data Exchange<\/li><li>Amazon Data Firehose<\/li><li>Amazon EMR<\/li><li>AWS Glue<\/li><li>Amazon Kinesis<\/li><li>AWS Lake Formation<\/li><li>Amazon Managed Streaming for Apache Kafka (Amazon MSK)<\/li><li>Amazon OpenSearch Service<\/li><li>Amazon Quick<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>アプリケーション統合<\/h3>\n<ul><li>Amazon AppFlow<\/li><li>Amazon EventBridge<\/li><li>Amazon MQ<\/li><li>Amazon SNS<\/li><li>Amazon SQS<\/li><li>AWS Step Functions<\/li><\/ul>", "<h3>AWS コスト管理<\/h3>\n<ul><li>AWS Budgets<\/li><li>AWS Cost and Usage Report<\/li><li>AWS Cost Explorer<\/li><li>Savings Plans<\/li><\/ul>", "<h3>コンピューティング<\/h3>\n<ul><li>AWS Batch<\/li><li>Amazon EC2<\/li><li>Amazon EC2 Auto Scaling<\/li><li>AWS Elastic Beanstalk<\/li><li>AWS Outposts<\/li><li>AWS Serverless Application Repository<\/li><li>VMware Cloud on AWS<\/li><li>AWS Wavelength<\/li><\/ul>", "<h3>コンテナ<\/h3>\n<ul><li>Amazon ECR<\/li><li>Amazon ECS<\/li><li>Amazon ECS Anywhere<\/li><li>Amazon EKS<\/li><li>Amazon EKS Anywhere<\/li><li>Amazon EKS Distro<\/li><\/ul>", "<h3>データベース<\/h3>\n<ul><li>Amazon Aurora<\/li><li>Amazon Aurora Serverless<\/li><li>Amazon DocumentDB<\/li><li>Amazon DynamoDB<\/li><li>Amazon ElastiCache<\/li><li>Amazon Keyspaces<\/li><li>Amazon Neptune<\/li><li>Amazon RDS<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>デベロッパーツール<\/h3>\n<ul><li>AWS X-Ray<\/li><\/ul>", "<h3>フロントエンドのウェブとモバイル<\/h3>\n<ul><li>AWS Amplify<\/li><li>Amazon API Gateway<\/li><li>AWS Device Farm<\/li><\/ul>", "<h3>機械学習<\/h3>\n<ul><li>Amazon Comprehend<\/li><li>Amazon Lex<\/li><li>Amazon Polly<\/li><li>Amazon Rekognition<\/li><li>Amazon SageMaker AI<\/li><li>Amazon Textract<\/li><li>Amazon Transcribe<\/li><li>Amazon Translate<\/li><\/ul>", "<h3>マネジメントとガバナンス<\/h3>\n<ul><li>AWS Auto Scaling<\/li><li>AWS CLI<\/li><li>AWS CloudFormation<\/li><li>AWS CloudTrail<\/li><li>Amazon CloudWatch<\/li><li>AWS Compute Optimizer<\/li><li>AWS Config<\/li><li>AWS Control Tower<\/li><li>AWS Health Dashboard<\/li><li>AWS License Manager<\/li><li>Amazon Managed Grafana<\/li><li>Amazon Managed Service for Prometheus<\/li><li>AWS マネジメントコンソール<\/li><li>AWS Organizations<\/li><li>AWS Service Catalog<\/li><li>AWS Systems Manager<\/li><li>AWS Trusted Advisor<\/li><li>AWS Well-Architected Tool<\/li><\/ul>", "<h3>メディアサービス<\/h3>\n<ul><li>Amazon Elastic Transcoder<\/li><li>Amazon Kinesis Video Streams<\/li><\/ul>", "<h3>移行と転送<\/h3>\n<ul><li>AWS Application Migration Service<\/li><li>AWS DataSync<\/li><li>AWS DMS<\/li><li>AWS Snow Family<\/li><li>AWS Transfer Family<\/li><\/ul>", "<h3>ネットワークとコンテンツ配信<\/h3>\n<ul><li>AWS Client VPN<\/li><li>Amazon CloudFront<\/li><li>AWS Direct Connect<\/li><li>Elastic Load Balancing (ELB)<\/li><li>AWS Global Accelerator<\/li><li>AWS PrivateLink<\/li><li>Amazon Route 53<\/li><li>AWS Site-to-Site VPN<\/li><li>AWS Transit Gateway<\/li><li>Amazon VPC<\/li><\/ul>", "<h3>セキュリティ、アイデンティティ、コンプライアンス<\/h3>\n<ul><li>AWS Artifact<\/li><li>AWS Certificate Manager (ACM)<\/li><li>AWS CloudHSM<\/li><li>Amazon Cognito<\/li><li>Amazon Detective<\/li><li>AWS Directory Service<\/li><li>AWS Firewall Manager<\/li><li>Amazon GuardDuty<\/li><li>AWS IAM アイデンティティセンター<\/li><li>Amazon Inspector<\/li><li>AWS KMS<\/li><li>Amazon Macie<\/li><li>AWS Network Firewall<\/li><li>AWS Resource Access Manager (AWS RAM)<\/li><li>AWS Secrets Manager<\/li><li>AWS Security Hub<\/li><li>AWS Shield<\/li><li>AWS WAF<\/li><li>IAM<\/li><\/ul>", "<h3>サーバーレス<\/h3>\n<ul><li>AWS Fargate<\/li><li>AWS Lambda<\/li><\/ul>", "<h3>ストレージ<\/h3>\n<ul><li>AWS Backup<\/li><li>Amazon EBS<\/li><li>Amazon EFS<\/li><li>Amazon FSx (すべてのタイプに対応)<\/li><li>Amazon S3<\/li><li>Amazon S3 Glacier<\/li><li>AWS Storage Gateway<\/li><\/ul>"]}, {"n": "14", "title": "対象外の AWS サービス", "secs": ["<p>以下に、試験対象外の AWS のサービスと機能のリストを示します。このリストはすべてを網羅しているわけではなく、また、変更される場合もあります。試験の対象となる職種内容にまったく関係のない AWS のサービスは、このリストから除外されています。<\/p><h3>アプリケーション統合<\/h3>\n<ul><li>Amazon Managed Workflows for Apache Airflow (Amazon MWAA)<\/li><\/ul><h3>AR と VR<\/h3>\n<ul><li>Amazon Sumerian<\/li><\/ul><h3>ブロックチェーン<\/h3>\n<ul><li>Amazon Managed Blockchain<\/li><\/ul><h3>コンピューティング<\/h3>\n<ul><li>Amazon Lightsail<\/li><\/ul><h3>データベース<\/h3>\n<ul><li>Amazon RDS on VMware<\/li><\/ul><h3>デベロッパーツール<\/h3>\n<ul><li>AWS CDK<\/li><li>AWS CloudShell<\/li><li>AWS CodeArtifact<\/li><li>AWS CodeBuild<\/li><li>AWS CodeCommit<\/li><li>AWS CodeDeploy<\/li><li>Amazon Corretto<\/li><li>AWS Fault Injection Simulator (AWS FIS)<\/li><li>AWS のツールと SDK<\/li><\/ul><h3>フロントエンドのウェブとモバイル<\/h3>\n<ul><li>Amazon Location Service<\/li><\/ul><h3>ゲーム関連テクノロジー<\/h3>\n<ul><li>Amazon GameLift<\/li><\/ul><h3>IoT<\/h3>\n<ul><li>すべてのサービス<\/li><\/ul><h3>機械学習<\/h3>\n<ul><li>Apache MXNet on AWS<\/li><li>AWS DeepComposer<\/li><li>AWS Deep Learning AMIs (DLAMI)<\/li><li>AWS Deep Learning Containers<\/li><li>Amazon DevOps Guru<\/li><li>Amazon Elastic Inference<\/li><li>Amazon HealthLake<\/li><li>AWS Inferentia<\/li><li>Amazon Personalize<\/li><li>PyTorch on AWS<\/li><li>TensorFlow on AWS<\/li><\/ul><h3>マネジメントとガバナンス<\/h3>\n<ul><li>AWS コンソールモバイルアプリケーション<\/li><li>AWS Distro for OpenTelemetry<\/li><\/ul><h3>メディアサービス<\/h3>\n<ul><li>AWS Elemental アプライアンスとソフトウェア<\/li><li>AWS Elemental MediaConnect<\/li><li>AWS Elemental MediaConvert<\/li><li>AWS Elemental MediaLive<\/li><li>AWS Elemental MediaPackage<\/li><li>AWS Elemental MediaTailor<\/li><li>Amazon Interactive Video Service (Amazon IVS)<\/li><\/ul><h3>移行と転送<\/h3>\n<ul><li>Migration Evaluator<\/li><\/ul><h3>ネットワークとコンテンツ配信<\/h3>\n<ul><li>AWS Cloud Map<\/li><\/ul><h3>量子テクノロジー<\/h3>\n<ul><li>Amazon Braket<\/li><\/ul><h3>人工衛星<\/h3>\n<ul><li>AWS Ground Station<\/li><\/ul>"]}, {"n": "15", "title": "Revisions", "secs": ["<p>AWS exam guides are periodically reviewed and updated to ensure that our certification exams test skills and AWS services and features that are relevant for the job role(s) that a certification is designed to target. Exam guide updates will be published approximately one month before updates will be reflected on your exam.<\/p>", "<h3>Change History<\/h3>\n<table><thead><tr><th>Version<\/th><th>Publication date<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>August 28, 2026<\/td><\/tr><tr><td>1.1<\/td><td>October 29, 2026<\/td><\/tr><\/tbody><\/table>", "<h3>Changes to in- and out-of-scope services<\/h3>", "<h4>Services removed from the in-scope list<\/h4>\n<ul><li>Amazon Elastic Transcoder<\/li><\/ul>", "<h4>Services removed from the out-of-scope list<\/h4>\n<ul><li>AWS DeepComposer<\/li><li>Amazon DevOps Guru<\/li><li>Amazon Elastic Inference<\/li><li>Amazon Managed Blockchain<\/li><li>Amazon Sumerian<\/li><\/ul>"]}, {"n": "16", "title": "アンケート", "secs": ["<p>この試験ガイドはどの程度役に立ちましたか。ご意見をお待ちしています。<a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=SAA-Associate&amp;course_id=SAA-C03&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">アンケートへの回答<\/a>にご協力ください。<\/p>"]}]}, "en": {"title": "AWS Certified Solutions Architect - Associate (SAA-C03)", "note": ["Source: https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-associate-03/solutions-architect-associate-03.html (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "AWS Certified Solutions Architect - Associate (SAA-C03)", "secs": ["<p>The AWS Certified Solutions Architect - Associate (SAA-C03) exam is intended for individuals who perform a solutions architect role. The exam validates a candidate's ability to design solutions based on the AWS Well-Architected Framework.<\/p>"]}, {"n": "2", "title": "Introduction", "secs": ["<p>The <a href=\"https://aws.amazon.com/certification/certified-solutions-architect-associate/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Certified Solutions Architect - Associate (SAA-C03)<\/a> exam is intended for individuals who perform a solutions architect role. The exam validates a candidate's ability to design solutions based on the AWS Well-Architected Framework.<\/p>\n<p>The exam also validates a candidate's ability to complete the following tasks:<\/p>\n<ul><li>Design solutions that incorporate AWS services to meet current business requirements and future projected needs<\/li><li>Design architectures that are secure, resilient, high-performing, and cost-optimized<\/li><li>Review existing solutions and determine improvements<\/li><\/ul>"]}, {"n": "3", "title": "Target candidate description", "secs": ["<p>The target candidate should have at least 1 year of hands-on experience designing cloud solutions that use AWS services.<\/p>"]}, {"n": "4", "title": "Exam content", "secs": ["", "<h3>Response types<\/h3>\n<p>There are two types of questions on the exam:<\/p>\n<ul><li><strong>Multiple choice:<\/strong> Has one correct response and three incorrect responses (distractors)<\/li><li><strong>Multiple response:<\/strong> Has two or more correct responses out of five or more response options<\/li><\/ul>\n<p>Select one or more responses that best complete the statement or answer the question. Distractors, or incorrect answers, are response options that a candidate with incomplete knowledge or skill might choose. Distractors are generally plausible responses that match the content area.<\/p>\n<p>Unanswered questions are scored as incorrect; there is no penalty for guessing. The exam includes 50 questions that affect your score.<\/p>", "<h3>Unscored content<\/h3>\n<p>The exam includes 15 unscored questions that do not affect your score. AWS collects information about performance on these unscored questions to evaluate these questions for future use as scored questions. These unscored questions are not identified on the exam.<\/p>", "<h3>Exam results<\/h3>\n<p>The AWS Certified Solutions Architect - Associate (SAA-C03) exam has a pass or fail designation. The exam is scored against a minimum standard established by AWS professionals who follow certification industry best practices and guidelines.<\/p>\n<p>Your results for the exam are reported as a scaled score of 100–1,000. The minimum passing score is 720. Your score shows how you performed on the exam as a whole and whether you passed. Scaled scoring models help equate scores across multiple exam forms that might have slightly different difficulty levels.<\/p>\n<p>Your score report could contain a table of classifications of your performance at each section level. The exam uses a compensatory scoring model, which means that you do not need to achieve a passing score in each section. You need to pass only the overall exam.<\/p>\n<p>Each section of the exam has a specific weighting, so some sections have more questions than other sections have. The table of classifications contains general information that highlights your strengths and weaknesses. Use caution when you interpret section-level feedback.<\/p>"]}, {"n": "5", "title": "Content outline", "secs": ["<p>This exam guide includes weightings, content domains, and task statements for the exam. This guide does not provide a comprehensive list of the content on the exam. However, additional context for each task statement is available to help you prepare for the exam.<\/p>\n<p>The exam has the following content domains and weightings:<\/p>\n<ul><li>Content Domain 1: Design Secure Architectures (30% of scored content)<\/li><li>Content Domain 2: Design Resilient Architectures (26% of scored content)<\/li><li>Content Domain 3: Design High-Performing Architectures (24% of scored content)<\/li><li>Content Domain 4: Design Cost-Optimized Architectures (20% of scored content)<\/li><\/ul>"]}, {"n": "6", "title": "Service References", "secs": ["<p>The following sections provide detailed information about AWS services, technologies, and concepts relevant to this certification exam:<\/p>\n<ul><li>Technologies and Concepts<\/li><li>Mentions of AWS Services on the Exam<\/li><li>In-Scope AWS Services<\/li><li>Out-of-Scope AWS Services<\/li><\/ul>"]}, {"n": "7", "title": "Content Domain 1: Design Secure Architectures", "secs": ["", "<h3>Task 1.1: Design secure access to AWS resources<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>Access controls and management across multiple accounts<\/li><li>AWS federated access and identity services (for example, IAM, AWS IAM Identity Center)<\/li><li>AWS global infrastructure (for example, Availability Zones, AWS Regions)<\/li><li>AWS security best practices (for example, the principle of least privilege)<\/li><li>The AWS shared responsibility model<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Applying AWS security best practices to IAM users and root users (for example, multi-factor authentication [MFA])<\/li><li>Designing a flexible authorization model that includes IAM users, groups, roles, and policies<\/li><li>Designing a role-based access control strategy (for example, AWS STS, role switching, cross-account access)<\/li><li>Designing a security strategy for multiple AWS accounts (for example, AWS Control Tower, service control policies [SCPs])<\/li><li>Determining the appropriate use of resource policies for AWS services<\/li><li>Determining when to federate a directory service with IAM roles<\/li><\/ul>", "<h3>Task 1.2: Design secure workloads and applications<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>Application configuration and credentials security<\/li><li>AWS service endpoints<\/li><li>Control ports, protocols, and network traffic on AWS<\/li><li>Secure application access<\/li><li>Security services with appropriate use cases (for example, Amazon Cognito, Amazon GuardDuty, Amazon Macie)<\/li><li>Threat vectors external to AWS (for example, DDoS, SQL injection)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Designing VPC architectures with security components (for example, security groups, route tables, network ACLs, NAT gateways)<\/li><li>Determining network segmentation strategies (for example, using public subnets and private subnets)<\/li><li>Integrating AWS services to secure applications (for example, AWS Shield, AWS WAF, IAM Identity Center, AWS Secrets Manager)<\/li><li>Securing external network connections to and from the AWS Cloud (for example, VPN, AWS Direct Connect)<\/li><\/ul>", "<h3>Task 1.3: Determine appropriate data security controls<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>Data access and governance<\/li><li>Data recovery<\/li><li>Data retention and classification<\/li><li>Encryption and appropriate key management<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Aligning AWS technologies to meet compliance requirements<\/li><li>Encrypting data at rest (for example, AWS KMS)<\/li><li>Encrypting data in transit (for example, AWS Certificate Manager [ACM] using TLS)<\/li><li>Implementing access policies for encryption keys<\/li><li>Implementing data backups and replications<\/li><li>Implementing policies for data access, lifecycle, and protection<\/li><li>Rotating encryption keys and renewing certificates<\/li><\/ul>"]}, {"n": "8", "title": "Content Domain 2: Design Resilient Architectures", "secs": ["", "<h3>Task 2.1: Design scalable and loosely coupled architectures<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>API creation and management (for example, Amazon API Gateway, REST API)<\/li><li>AWS managed services with appropriate use cases (for example, AWS Transfer Family, Amazon SQS, AWS Secrets Manager)<\/li><li>Caching strategies<\/li><li>Design principles for microservices (for example, stateless workloads compared with stateful workloads)<\/li><li>Event-driven architectures<\/li><li>Horizontal scaling and vertical scaling<\/li><li>How to appropriately use edge accelerators (for example, content delivery network [CDN])<\/li><li>How to migrate applications into containers<\/li><li>Load balancing concepts (for example, Application Load Balancer [ALB])<\/li><li>Multi-tier architectures<\/li><li>Queuing and messaging concepts (for example, publish/subscribe)<\/li><li>Serverless technologies and patterns (for example, AWS Fargate, AWS Lambda)<\/li><li>Storage types with associated characteristics (for example, object, file, block)<\/li><li>The orchestration of containers (for example, Amazon ECS, Amazon EKS)<\/li><li>When to use read replicas<\/li><li>Workflow orchestration (for example, AWS Step Functions)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Designing event-driven, microservice, and/or multi-tier architectures based on requirements<\/li><li>Determining scaling strategies for components used in an architecture design<\/li><li>Determining the AWS services required to achieve loose coupling based on requirements<\/li><li>Determining when to use containers<\/li><li>Determining when to use serverless technologies and patterns<\/li><li>Recommending appropriate compute, storage, networking, and database technologies based on requirements<\/li><li>Using purpose-built AWS services for workloads<\/li><\/ul>", "<h3>Task 2.2: Design highly available and/or fault-tolerant architectures<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>AWS global infrastructure (for example, Availability Zones, AWS Regions, Amazon Route 53)<\/li><li>AWS managed services with appropriate use cases (for example, Amazon Comprehend, Amazon Polly)<\/li><li>Basic networking concepts (for example, route tables)<\/li><li>Disaster recovery (DR) strategies (for example, backup and restore, pilot light, warm standby, active-active failover, recovery point objective [RPO], recovery time objective [RTO])<\/li><li>Distributed design patterns<\/li><li>Failover strategies<\/li><li>Immutable infrastructure<\/li><li>Load balancing concepts (for example, ALB)<\/li><li>Proxy concepts (for example, Amazon RDS Proxy)<\/li><li>Service quotas and throttling (for example, how to configure the service quotas for a workload in a standby environment)<\/li><li>Storage options and characteristics (for example, durability, replication)<\/li><li>Workload visibility (for example, AWS X-Ray)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Determining automation strategies to ensure infrastructure integrity<\/li><li>Determining the AWS services required to provide a highly available and/or fault-tolerant architecture across AWS Regions or Availability Zones<\/li><li>Identifying metrics based on business requirements to deliver a highly available solution<\/li><li>Implementing designs to mitigate single points of failure<\/li><li>Implementing strategies to ensure the durability and availability of data (for example, backups)<\/li><li>Selecting an appropriate DR strategy to meet business requirements<\/li><li>Using AWS services that improve the reliability of legacy applications and applications not built for the cloud (for example, when application changes are not possible)<\/li><li>Using purpose-built AWS services for workloads<\/li><\/ul>"]}, {"n": "9", "title": "Content Domain 3: Design High-Performing Architectures", "secs": ["", "<h3>Task 3.1: Determine high-performing and/or scalable storage solutions<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>Hybrid storage solutions to meet business requirements<\/li><li>Storage services with appropriate use cases (for example, Amazon S3, Amazon EFS, Amazon EBS)<\/li><li>Storage types with associated characteristics (for example, object, file, block)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Determining storage services and configurations that meet performance demands<\/li><li>Determining storage services that can scale to accommodate future needs<\/li><\/ul>", "<h3>Task 3.2: Design high-performing and elastic compute solutions<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>AWS compute services with appropriate use cases (for example, AWS Batch, Amazon EMR, AWS Fargate)<\/li><li>Distributed computing concepts supported by AWS global infrastructure and edge services<\/li><li>Queuing and messaging concepts (for example, publish/subscribe)<\/li><li>Scalability capabilities with appropriate use cases (for example, Amazon EC2 Auto Scaling, AWS Auto Scaling)<\/li><li>Serverless technologies and patterns (for example, AWS Lambda, Fargate)<\/li><li>The orchestration of containers (for example, Amazon ECS, Amazon EKS)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Decoupling workloads so that components can scale independently<\/li><li>Identifying metrics and conditions to perform scaling actions<\/li><li>Selecting the appropriate compute options and features (for example, EC2 instance types) to meet business requirements<\/li><li>Selecting the appropriate resource type and size (for example, the amount of Lambda memory) to meet business requirements<\/li><\/ul>", "<h3>Task 3.3: Determine high-performing database solutions<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>AWS global infrastructure (for example, Availability Zones, AWS Regions)<\/li><li>Caching strategies and services (for example, Amazon ElastiCache)<\/li><li>Data access patterns (for example, read-intensive compared with write-intensive)<\/li><li>Database capacity planning (for example, capacity units, instance types, Provisioned IOPS)<\/li><li>Database connections and proxies<\/li><li>Database engines with appropriate use cases (for example, heterogeneous migrations, homogeneous migrations)<\/li><li>Database replication (for example, read replicas)<\/li><li>Database types and services (for example, serverless, relational compared with non-relational, in-memory)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Configuring read replicas to meet business requirements<\/li><li>Designing database architectures<\/li><li>Determining an appropriate database engine (for example, MySQL compared with PostgreSQL)<\/li><li>Determining an appropriate database type (for example, Amazon Aurora, Amazon DynamoDB)<\/li><li>Integrating caching to meet business requirements<\/li><\/ul>", "<h3>Task 3.4: Determine high-performing and/or scalable network architectures<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>Edge networking services with appropriate use cases (for example, Amazon CloudFront, AWS Global Accelerator)<\/li><li>How to design network architecture (for example, subnet tiers, routing, IP addressing)<\/li><li>Load balancing concepts (for example, Application Load Balancer [ALB])<\/li><li>Network connection options (for example, AWS VPN, AWS Direct Connect, AWS PrivateLink)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Creating a network topology for various architectures (for example, global, hybrid, multi-tier)<\/li><li>Determining network configurations that can scale to accommodate future needs<\/li><li>Determining the appropriate placement of resources to meet business requirements<\/li><li>Selecting the appropriate load balancing strategy<\/li><\/ul>", "<h3>Task 3.5: Determine high-performing data ingestion and transformation solutions<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>Data analytics and visualization services with appropriate use cases (for example, Amazon Athena, AWS Lake Formation, Amazon Quick)<\/li><li>Data ingestion patterns (for example, frequency)<\/li><li>Data transfer services with appropriate use cases (for example, AWS DataSync, AWS Storage Gateway)<\/li><li>Data transformation services with appropriate use cases (for example, AWS Glue)<\/li><li>Secure access to ingestion access points<\/li><li>Sizes and speeds needed to meet business requirements<\/li><li>Streaming data services with appropriate use cases (for example, Amazon Kinesis)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Building and securing data lakes<\/li><li>Designing data streaming architectures<\/li><li>Designing data transfer solutions<\/li><li>Implementing visualization strategies<\/li><li>Selecting appropriate compute options for data processing (for example, Amazon EMR)<\/li><li>Selecting appropriate configurations for ingestion<\/li><li>Transforming data between formats (for example, .csv to .parquet)<\/li><\/ul>"]}, {"n": "10", "title": "Content Domain 4: Design Cost-Optimized Architectures", "secs": ["", "<h3>Task 4.1: Design cost-optimized storage solutions<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>Access options (for example, an S3 bucket with Requester Pays object storage)<\/li><li>AWS cost management service features (for example, cost allocation tags, multi-account billing)<\/li><li>AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)<\/li><li>AWS storage services with appropriate use cases (for example, Amazon FSx, Amazon EFS, Amazon S3, Amazon EBS)<\/li><li>Backup strategies<\/li><li>Block storage options (for example, hard disk drive [HDD] volume types, solid state drive [SSD] volume types)<\/li><li>Data lifecycles<\/li><li>Hybrid storage options (for example, AWS DataSync, AWS Transfer Family, AWS Storage Gateway)<\/li><li>Storage access patterns<\/li><li>Storage tiering (for example, cold tiering for object storage)<\/li><li>Storage types with associated characteristics (for example, object, file, block)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Designing appropriate storage strategies (for example, batch uploads to Amazon S3 compared with individual uploads)<\/li><li>Determining the correct storage size for a workload<\/li><li>Determining the lowest cost method of transferring data for a workload to AWS storage<\/li><li>Determining when storage auto scaling is required<\/li><li>Managing S3 object lifecycles<\/li><li>Selecting the appropriate backup and/or archival solution<\/li><li>Selecting the appropriate service for data migration to storage services<\/li><li>Selecting the appropriate storage tier<\/li><li>Selecting the correct data lifecycle for storage<\/li><li>Selecting the most cost-effective storage service for a workload<\/li><\/ul>", "<h3>Task 4.2: Design cost-optimized compute solutions<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>AWS cost management service features (for example, cost allocation tags, multi-account billing)<\/li><li>AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)<\/li><li>AWS global infrastructure (for example, Availability Zones, AWS Regions)<\/li><li>AWS purchasing options (for example, Spot Instances, Reserved Instances, Savings Plans)<\/li><li>Distributed compute strategies (for example, edge processing)<\/li><li>Hybrid compute options (for example, AWS Outposts)<\/li><li>Instance types, families, and sizes (for example, memory optimized, compute optimized, virtualization)<\/li><li>Optimization of compute utilization (for example, containers, serverless computing, microservices)<\/li><li>Scaling strategies (for example, auto scaling, hibernation)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Determining an appropriate load balancing strategy (for example, Application Load Balancer [Layer 7] compared with Network Load Balancer [Layer 4] compared with Gateway Load Balancer)<\/li><li>Determining appropriate scaling methods and strategies for elastic workloads (for example, horizontal compared with vertical, EC2 hibernation)<\/li><li>Determining cost-effective AWS compute services with appropriate use cases (for example, AWS Lambda, Amazon EC2, AWS Fargate)<\/li><li>Determining the required availability for different classes of workloads (for example, production workloads, non-production workloads)<\/li><li>Selecting the appropriate instance family for a workload<\/li><li>Selecting the appropriate instance size for a workload<\/li><\/ul>", "<h3>Task 4.3: Design cost-optimized database solutions<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>AWS cost management service features (for example, cost allocation tags, multi-account billing)<\/li><li>AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)<\/li><li>Caching strategies<\/li><li>Data retention policies<\/li><li>Database capacity planning (for example, capacity units)<\/li><li>Database connections and proxies<\/li><li>Database engines with appropriate use cases (for example, heterogeneous migrations, homogeneous migrations)<\/li><li>Database replication (for example, read replicas)<\/li><li>Database types and services (for example, relational compared with non-relational, Amazon Aurora, Amazon DynamoDB)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Designing appropriate backup and retention policies (for example, snapshot frequency)<\/li><li>Determining an appropriate database engine (for example, MySQL compared with PostgreSQL)<\/li><li>Determining cost-effective AWS database services with appropriate use cases (for example, DynamoDB compared with Amazon RDS, serverless)<\/li><li>Determining cost-effective AWS database types (for example, time series format, columnar format)<\/li><li>Migrating database schemas and data to different locations and/or different database engines<\/li><\/ul>", "<h3>Task 4.4: Design cost-optimized network architectures<\/h3>\n<p>Knowledge of:<\/p>\n<ul><li>AWS cost management service features (for example, cost allocation tags, multi-account billing)<\/li><li>AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)<\/li><li>Load balancing concepts (for example, ALB)<\/li><li>NAT gateways (for example, NAT instance costs compared with NAT gateway costs)<\/li><li>Network connectivity (for example, private lines, dedicated lines, VPNs)<\/li><li>Network routing, topology, and peering (for example, AWS Transit Gateway, VPC peering)<\/li><li>Network services with appropriate use cases (for example, DNS)<\/li><\/ul>\n<p>Skills in:<\/p>\n<ul><li>Configuring appropriate NAT gateway types for a network (for example, a single shared NAT gateway compared with NAT gateways for each Availability Zone)<\/li><li>Configuring appropriate network connections (for example, AWS Direct Connect compared with VPN compared with internet)<\/li><li>Configuring appropriate network routes to minimize network transfer costs (for example, Region to Region, Availability Zone to Availability Zone, private to public, AWS Global Accelerator, VPC endpoints)<\/li><li>Determining strategic needs for content delivery networks (CDNs) and edge caching<\/li><li>Reviewing existing workloads for network optimizations<\/li><li>Selecting an appropriate throttling strategy<\/li><li>Selecting the appropriate bandwidth allocation for a network device (for example, a single VPN compared with multiple VPNs, Direct Connect speed)<\/li><\/ul>"]}, {"n": "11", "title": "Technologies and Concepts", "secs": ["<p>The following list contains technologies and concepts that might appear on the exam. This list is non-exhaustive and is subject to change. The order and placement of the items in this list is no indication of their relative weight or importance on the exam:<\/p>\n<ul><li>Compute<\/li><li>Cost management<\/li><li>Database<\/li><li>Disaster recovery<\/li><li>High performance<\/li><li>Management and governance<\/li><li>Microservices and component delivery<\/li><li>Migration and data transfer<\/li><li>Networking, connectivity, and content delivery<\/li><li>Resiliency<\/li><li>Security<\/li><li>Serverless and event-driven design principles<\/li><li>Storage<\/li><\/ul>"]}, {"n": "12", "title": "Mentions of AWS Services on the Exam", "secs": ["<p>AWS Certification is reducing the reading load on this exam by using official short names for well-known AWS service names that contain abbreviations or parenthetical information. For example, Amazon Simple Notification Service (Amazon SNS) appears on the exam as Amazon SNS.<\/p>\n<ul><li>The Help feature in the exam (available for every question) contains the list of the short AWS service names and their corresponding full names.<\/li><li>You can consult <a href=\"https://aws.amazon.com/certification/policies/general-information/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Service Names<\/a> on the AWS Certification website for the list of services that appear as their short names on the exam. Any services that are on the list but that are out of scope for the exam will not appear on the exam.<\/li><\/ul>\n<p><strong>Note:<\/strong> Not every abbreviation is fully spelled out on the exam or available in the Help feature. The official full name for some AWS services includes an abbreviation that is never expanded (for example, Amazon API Gateway, Amazon EMR). The exam also might contain other abbreviations that the target audience is expected to know.<\/p>"]}, {"n": "13", "title": "In-Scope AWS Services", "secs": ["<p>The following list contains AWS services and features that are in scope for the exam. This list is non-exhaustive and is subject to change. AWS offerings appear in categories that align with the offerings' primary functions:<\/p>", "<h3>Analytics<\/h3>\n<ul><li>Amazon Athena<\/li><li>AWS Data Exchange<\/li><li>AWS Data Pipeline<\/li><li>Amazon EMR<\/li><li>AWS Glue<\/li><li>Amazon Kinesis<\/li><li>AWS Lake Formation<\/li><li>Amazon Managed Streaming for Apache Kafka (Amazon MSK)<\/li><li>Amazon OpenSearch Service<\/li><li>Amazon Quick<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>Application Integration<\/h3>\n<ul><li>Amazon AppFlow<\/li><li>Amazon EventBridge<\/li><li>Amazon MQ<\/li><li>Amazon SNS<\/li><li>Amazon SQS<\/li><li>AWS Step Functions<\/li><\/ul>", "<h3>AWS Cost Management<\/h3>\n<ul><li>AWS Budgets<\/li><li>AWS Cost and Usage Report<\/li><li>AWS Cost Explorer<\/li><li>Savings Plans<\/li><\/ul>", "<h3>Compute<\/h3>\n<ul><li>AWS Batch<\/li><li>Amazon EC2<\/li><li>Amazon EC2 Auto Scaling<\/li><li>AWS Elastic Beanstalk<\/li><li>AWS Outposts<\/li><li>AWS Serverless Application Repository<\/li><li>VMware Cloud on AWS<\/li><li>AWS Wavelength<\/li><\/ul>", "<h3>Containers<\/h3>\n<ul><li>Amazon ECR<\/li><li>Amazon ECS<\/li><li>Amazon ECS Anywhere<\/li><li>Amazon EKS<\/li><li>Amazon EKS Anywhere<\/li><li>Amazon EKS Distro<\/li><\/ul>", "<h3>Database<\/h3>\n<ul><li>Amazon Aurora<\/li><li>Amazon Aurora Serverless<\/li><li>Amazon DocumentDB<\/li><li>Amazon DynamoDB<\/li><li>Amazon ElastiCache<\/li><li>Amazon Keyspaces<\/li><li>Amazon Neptune<\/li><li>Amazon RDS<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>Developer Tools<\/h3>\n<ul><li>AWS X-Ray<\/li><\/ul>", "<h3>Front-End Web and Mobile<\/h3>\n<ul><li>AWS Amplify<\/li><li>Amazon API Gateway<\/li><li>AWS Device Farm<\/li><\/ul>", "<h3>Machine Learning<\/h3>\n<ul><li>Amazon Comprehend<\/li><li>Amazon Lex<\/li><li>Amazon Polly<\/li><li>Amazon Rekognition<\/li><li>Amazon SageMaker AI<\/li><li>Amazon Textract<\/li><li>Amazon Transcribe<\/li><li>Amazon Translate<\/li><\/ul>", "<h3>Management and Governance<\/h3>\n<ul><li>AWS Auto Scaling<\/li><li>AWS CLI<\/li><li>AWS CloudFormation<\/li><li>AWS CloudTrail<\/li><li>Amazon CloudWatch<\/li><li>AWS Compute Optimizer<\/li><li>AWS Config<

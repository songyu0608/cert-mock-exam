<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>CCAR-P 공식 시험 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: sticky bar (language tabs + chapter chips), one reading column; "대조" view = section-aligned two-column grid */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b1f2a; --muted:#5b6475; --line:#dde1e8;
  --accent:#2f4bb8; --accent-soft:#e7ebfa; --code-bg:#eef0f5; --quote:#f0f3fb; --ok:#1d7a52; --ok-soft:#e5f4ec;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-display:"Fraunces",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ko);font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.dual .wrap{max-width:1260px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto;letter-spacing:.01em}
.brand small{font-family:var(--f-ko);color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:4px 10px;font-size:13px;line-height:1.5}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chaps button{font-family:var(--f-mono);font-size:12px;padding:1px 0;min-width:30px;text-align:center}
.chaps button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding-block:24px 80px}
.note{font-size:13px;color:var(--muted);line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:36px;background:var(--surface)}
.note p{margin:0}
.chap{margin-bottom:56px}
.chap-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:8px}
.chap-no{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.2em}
.chap-head h1{font-size:22px;line-height:1.4;margin:0;text-wrap:balance}
.chap-head .sub{font-size:13px;color:var(--muted);display:block;font-weight:400}
.sec h3{font-size:18px;margin:34px 0 8px;text-wrap:balance}
.sec h4{font-size:15.5px;margin:28px 0 6px;color:var(--accent);line-height:1.55;text-wrap:balance}
.sec p{margin:0 0 14px}
.sec ul,.sec ol{margin:0 0 14px;padding-left:1.4em}
.sec li{margin:3px 0}
.sec ul.opts{list-style:none;padding-left:0}
.sec ul.opts li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;background:var(--surface)}
.sec blockquote{margin:16px 0;padding:10px 16px;background:var(--quote);border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.sec blockquote p:last-child{margin-bottom:0}
details.ans{margin:4px 0 26px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.ans summary{cursor:pointer;padding:7px 12px;font-size:13.5px;color:var(--ok);font-weight:600}
details.ans[open]{background:var(--ok-soft);border-color:var(--ok)}
details.ans p{margin:0;padding:0 14px 12px}
.sec code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:6px 0 18px}
.sec table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.sec th,.sec td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sec th{background:var(--code-bg)}
.ja{font-family:var(--f-ja)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0}
.pair>div{min-width:0}
.colhead{display:grid;grid-template-columns:1fr 1fr;gap:36px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:820px){.pair{grid-template-columns:1fr}.pair>div.ja{border-top:1px dotted var(--line);padding-top:4px}.colhead{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <span class="brand">CCAR-P 시험 가이드<small>v1.0 · 전문</small></span>
    <div class="row langs" role="group" aria-label="언어">
      <button id="v-ko" data-v="ko">한국어</button>
      <button id="v-ja" data-v="ja">日本語</button>
      <button id="v-dual" data-v="dual">한·日 대조</button>
    </div>
  </div>
  <div class="row chaps" role="group" aria-label="장 이동" id="chaps"></div>
</div></header>
<main><div class="wrap">
  <div class="note" id="note"></div>
  <div class="row" style="margin:-24px 0 24px"><span class="tools"><button id="openAll">샘플 문제 정답 모두 펼치기</button></span></div>
  <div id="out"></div>
</div></main>

<script>
const DATA={"ko": {"title": "Claude Certified Architect – Professional 시험 가이드 — 한국어판(비공식 번역)", "note": ["원문: Anthropic 공식 「Claude Certified Architect – Professional 試験ガイド」 일본어판 PDF(버전 1.0 · 2026년 7월 발효 · 시험 코드 CCAR-P).", "일본어 공식판을 요약 없이 옮긴 비공식 번역입니다. 해석이 갈리면 일본어 공식판이 기준입니다. 제품명·기능명·규제명은 원어를 그대로 두거나 병기했습니다.", "원문 서두 문구: 「本ガイドは予告なく変更されることがあります。」(이 가이드는 예고 없이 변경될 수 있습니다.)"], "ch": [{"n": "1", "title": "이 자격증에 대하여", "secs": ["<p>Claude Certified Architect – Professional 자격증은 Anthropic의 Claude 플랫폼을 사용해 프로덕션 수준의 AI 솔루션을 설계·구축·제공할 수 있음을 증명합니다. 대상은 아키텍트 역할을 맡는 실무자입니다. 이런 실무자는 적절한 모델, 아키텍처, API 패턴을 선택하고, 프롬프트 엔지니어링과 컨텍스트 엔지니어링을 적용하고, Claude를 엔터프라이즈 시스템에 통합하며, 평가·보안·컴플라이언스·거버넌스에 관한 고려 사항을 설계에 반영합니다.<\/p>\n<p>이 가이드는 응시를 준비하는 응시자를 위한 공식 참고 자료입니다. 자격의 목적, 대상자, 시험 형식과 콘텐츠 블루프린트, 채점, 정책, 그리고 모든 응시자가 동의하는 응시 규칙을 설명합니다. 시험을 예약하기 전에 전체를 읽어 주십시오.<\/p>"]}, {"n": "2", "title": "자격의 목적과 가치", "secs": ["<p>Claude Certified Architect – Professional 자격증의 주된 목적은 프로덕션 환경에서 Claude 기반 솔루션을 제대로 설계하는 데 필요한 지식, 기술, 능력을 독립적으로 평가하는 것입니다. 이 자격을 취득하면, 보유자가 Claude를 활용한 시스템의 라이프사이클 전체를 주도하거나 크게 기여할 수 있음을 고용주, 고객, 팀에 보여 줄 수 있습니다.<\/p>\n<p>이 자격을 취득한 응시자는 다음을 할 수 있음을 보여 줄 수 있습니다.<\/p>\n<ul><li>현실의 비즈니스 과제에 대응하는 AI 활용 솔루션을 설계하고 프로토타입을 만든다<\/li><li>특정 유스케이스에 맞는 모델, 아키텍처, API 패턴을 선택한다<\/li><li>모델 동작을 이끌기 위한 프롬프트 엔지니어링과 컨텍스트 전략을 구현한다<\/li><li>API, 오케스트레이션 도구, 데이터 파이프라인을 사용해 Claude를 프로덕션 시스템에 통합한다<\/li><li>솔루션 품질을 보장하기 위해 평가, 모니터링, 관측 가능성(observability) 기법을 적용한다<\/li><li>보안, 컴플라이언스, 거버넌스에 관한 고려 사항을 시스템 설계에 반영한다<\/li><li>부서를 넘나드는 이해관계자와 협업하고 아키텍처 결정을 효과적으로 전달한다<\/li><\/ul>"]}, {"n": "3", "title": "대상자", "secs": ["<p>이 자격증은 대규모 언어 모델, 특히 Claude를 사용해 프로덕션 수준의 AI 솔루션을 설계·구축·제공하는 중급에서 상급 수준의 기술 전문가를 대상으로 합니다. 주 대상은 비즈니스 요구 사항과 기술 구현의 접점에서 일하는 솔루션 아키텍트, AI/ML 엔지니어, 테크니컬 리드, 시니어 소프트웨어 엔지니어입니다.<\/p>\n<p>이런 전문가는 비즈니스 과제를 확장 가능한 AI 활용 솔루션으로 옮깁니다. 여기에는 모델 선택, 프롬프트 엔지니어링, 도구와 에이전트의 오케스트레이션, 컨텍스트 관리, 그리고 시스템의 안전성·컴플라이언스·거버넌스 확보가 포함됩니다. 이해관계자와의 관계 구축, 고객과 사내 팀에 대한 조언, 아키텍처 결정 주도에도 관여하는 경우가 많고, 보안·법무·경영진 관점의 논의도 맡습니다. 응시자는 보통 금융 서비스, 의료, 소매, 기술, 교육, 공공 기관 등의 업계에서 일합니다.<\/p>\n<p>이 자격증은 초급 개발자, Claude 기반 애플리케이션을 가끔 쓰기만 하는 사용자, 또는 엔드투엔드 AI 시스템을 설계해 본 경험이 없는 개인을 대상으로 하지 않습니다. 또한 순수한 비기술 역할이나, 더 넓은 시스템 설계 책임 없이 프롬프트 작성 같은 개별 작업에 한정된 역할도 대상이 아닙니다.<\/p>"]}, {"n": "4", "title": "최소 역량 응시자 프로필", "secs": ["<p>이 시험은 합격 기준을 최소한으로 충족하는 응시자상(MQC)을 기준으로 설계되었습니다. MQC는 엔지니어링 사고방식과 AI 솔루션을 배포해 본 실천적인 실무 경험을 함께 갖춘 숙련된 실무자입니다. MQC는 프로덕션 환경에서 Claude를 활용한 AI 솔루션을 설계·구현·통제하며, 비즈니스 요구 사항을 확장 가능하고 안전하며 신뢰성 높은 아키텍처로 옮깁니다.<\/p>\n<p>MQC는 프롬프트 엔지니어링과 컨텍스트 엔지니어링, 검색 증강 생성(RAG), API 통합, 오케스트레이션, 평가 프레임워크를 포함하는 엔드투엔드 AI 시스템을 설계하는 능력을 보여 주며, 비용·지연 시간·성능·안전성·유지보수성에 관한 트레이드오프를 이해합니다.<\/p>", "<h3>권장 경험<\/h3>\n<ul><li>소프트웨어 엔지니어링 모범 사례(모듈 설계, 관심사 분리, 확장성)의 기초<\/li><li>시스템 아키텍처 또는 플랫폼 엔지니어링 경력 3년 이상<\/li><li>프로덕션 환경에서 Claude 또는 그에 준하는 LLM 기반 시스템을 다룬 실무 경험 6개월 이상<\/li><li>디스커버리부터 배포, 운영화까지 엔드투엔드 시스템을 제공한 경험<\/li><\/ul>\n<p><strong>전제 조건:<\/strong> 이 시험에 응시하기 위한 필수 전제 조건이나 과정은 없습니다. 위의 경험은 권장 사항이며 필수가 아닙니다. 자격은 시험 성적만으로 수여됩니다.<\/p>"]}, {"n": "5", "title": "시험 개요", "secs": ["<table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>자격<\/td><td>Claude Certified Architect – Professional<\/td><\/tr><tr><td>시험 코드<\/td><td>CCAR-P<\/td><\/tr><tr><td>문항 수<\/td><td>63<\/td><\/tr><tr><td>출제 형식<\/td><td>단일 선택형과 복수 선택형 문제. 문제마다 골라야 할 답의 개수가 명시되어 있습니다<\/td><\/tr><tr><td>시험 시간<\/td><td>120분<\/td><\/tr><tr><td>시행 방식<\/td><td>감독 시험: 프로그램 정책에 따라 온라인 감독 또는 시험 센터, 혹은 둘 다<\/td><\/tr><tr><td>합격 점수<\/td><td>100~1,000 척도에서 환산 점수 720<\/td><\/tr><tr><td>응시료<\/td><td>$175 USD<\/td><\/tr><tr><td>유효 기간<\/td><td>자격 수여일로부터 12개월<\/td><\/tr><tr><td>결과 통지<\/td><td>합격/불합격과 환산 점수(100~1,000). 성적표에는 분야별 정답률도 표시됩니다<\/td><\/tr><\/tbody><\/table>"]}, {"n": "6", "title": "시험 내용 개요(블루프린트)", "secs": ["<p>시험 블루프린트는 측정 대상인 내용 분야와 시험에서 각 분야가 차지하는 대략적인 배점 비율을 정합니다. 배점 비율은 직무 작업 분석으로 정해진, 충분한 역량으로 업무를 수행하는 데 대한 각 분야의 상대적 중요도를 반영합니다. 백분율은 채점 대상 문제 가운데 각 분야에서 출제되는 대략적인 비율을 나타냅니다.<\/p>\n<table><thead><tr><th>분야<\/th><th>내용 분야<\/th><th>배점 비율<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>솔루션 설계와 아키텍처<\/td><td>17%<\/td><\/tr><tr><td>2<\/td><td>Claude 모델, 프롬프트 작성, 컨텍스트 엔지니어링<\/td><td>13%<\/td><\/tr><tr><td>3<\/td><td>통합<\/td><td>19%<\/td><\/tr><tr><td>4<\/td><td>평가, 테스트, 최적화<\/td><td>16%<\/td><\/tr><tr><td>5<\/td><td>거버넌스, 안전, 리스크 관리<\/td><td>14%<\/td><\/tr><tr><td>6<\/td><td>이해관계자 커뮤니케이션과 라이프사이클 관리<\/td><td>14%<\/td><\/tr><tr><td>7<\/td><td>개발자 생산성과 운영 지원<\/td><td>7%<\/td><\/tr><tr><td>합계<\/td><td><\/td><td>100%<\/td><\/tr><\/tbody><\/table>", "<h3>분야별 세부 목표<\/h3>\n<p>아래 각 분야에는 응시자가 수행할 수 있어야 하는 작업을 적었습니다. 시험 문제는 이 목표를 바탕으로 만들어집니다.<\/p>", "<h4>분야 1: 솔루션 설계와 아키텍처(17%)<\/h4>\n<ul><li>비즈니스 과제를 Claude 기반 AI 솔루션으로 옮긴다<\/li><li>엔드투엔드 아키텍처(입력 → 처리 → 출력 → 피드백 루프)를 설계한다<\/li><li>적절한 아키텍처 패턴(워크플로, 에이전트형, 증강 LLM)을 선택한다<\/li><li>멀티 에이전트 시스템과 오케스트레이션 전략을 설계한다<\/li><li>복잡한 문제 해결을 위해 분해 기법을 적용한다<\/li><li>솔루션을 비즈니스 가치의 축(효율성, 변혁, 생산성, 비용, 성능 SLA)에 맞춘다<\/li><\/ul>", "<h4>분야 2: Claude 모델, 프롬프트 작성, 컨텍스트 엔지니어링(13%)<\/h4>\n<ul><li>트레이드오프를 바탕으로 적절한 Claude 모델을 선택한다<\/li><li>시스템 프롬프트, 템플릿, 가드레일을 설계한다<\/li><li>프롬프트 엔지니어링 기법(제로샷, 퓨샷, 사고의 사슬)을 적용한다<\/li><li>컨텍스트 윈도를 최적화하고 토큰 사용량을 관리한다<\/li><li>프롬프트 재사용 전략(캐싱, 모듈형 프롬프트, 스킬)을 구현한다<\/li><\/ul>", "<h4>분야 3: 통합(19%)<\/h4>\n<ul><li>도구나 에이전트 구성을 기능 비대화의 관점에서 평가한다<\/li><li>인증과 인가 요구 사항을 분석하고 보안상의 공백을 찾아낸다<\/li><li>정확도와 지연 시간의 트레이드오프를 평가하고 구성 결정의 근거를 제시한다<\/li><li>관측 가능성 과제를 분석하고 대규모 환경의 모니터링 전략을 선택한다<\/li><li>적절한 청킹 전략과 인덱싱 전략을 갖춘 RAG 파이프라인을 설계한다<\/li><li>데이터 형태와 쿼리 패턴에 맞는 검색 전략을 적용한다<\/li><li>연결 프로토콜을 평가하고 적절한 통합 메커니즘(MCP, API/CLI, 에이전트 간)을 선택한다<\/li><li>단계적 디스커버리와 일괄형 컨텍스트 전략을 비교·평가한다<\/li><\/ul>", "<h4>분야 4: 평가, 테스트, 최적화(16%)<\/h4>\n<ul><li>평가 지표(정확도, 지연 시간, 비용, 안전성, 보안)를 정의한다<\/li><li>여러 방법론을 조합해 평가 데이터셋과 테스트 프레임워크를 설계한다<\/li><li>A/B 테스트와 반복 개선을 실시한다<\/li><li>시스템 문제(프롬프트 실패, 할루시네이션, 모델 부적합)를 진단한다<\/li><li>토큰 사용량, 지연 시간, 비용과 성능의 트레이드오프를 최적화한다<\/li><li>로깅 도구와 관측 가능성 도구로 시스템 성능을 모니터링한다<\/li><\/ul>", "<h4>분야 5: 거버넌스, 안전, 리스크 관리(14%)<\/h4>\n<ul><li>가드레일과 안전 관리 조치를 구현한다<\/li><li>LLM 시스템의 리스크, 한계, 장애 모드를 찾아낸다<\/li><li>휴먼 인 더 루프(human-in-the-loop) 검증 전략을 적용한다<\/li><li>규제(GDPR, HIPAA, FedRAMP 등) 준수를 보장한다<\/li><li>윤리적 AI에 관한 고려 사항(편향, 공정성, 투명성)을 다룬다<\/li><\/ul>", "<h4>분야 6: 이해관계자 커뮤니케이션과 라이프사이클 관리(14%)<\/h4>\n<ul><li>체계적인 디스커버리와 요구 사항 수집을 실시한다<\/li><li>아키텍처 결정과 트레이드오프를 전달한다<\/li><li>이해관계자 피드백 루프와 기대치 조정(SLA 포함)을 관리한다<\/li><li>아키텍처를 문서화하고 구현 가이드를 제공한다<\/li><li>라이프사이클의 각 단계(디스커버리, 설계, 인계, 모니터링, 반복)를 지원한다<\/li><\/ul>", "<h4>분야 7: 개발자 생산성과 운영 지원(7%)<\/h4>\n<ul><li>팀용 Claude 도구와 환경(Claude Code 등)을 구성한다<\/li><li>AI 지원 도구로 개발자 워크플로를 개선한다<\/li><li>디버깅과 운영상의 문제 해결을 지원한다<\/li><\/ul>"]}, {"n": "7", "title": "준비 방법", "secs": ["<p>필수 과정은 없습니다. Anthropic은 특정 자료가 합격을 보장한다고 약속하지 않습니다. 응시자에게는 실무 경험과 아래 자료를 함께 활용하기를 권합니다.<\/p>\n<ul><li>6장의 시험 블루프린트를 공부하고 각 목표에 비추어 자가 평가한다<\/li><li>Claude API, 모델, 프롬프트 엔지니어링, MCP, 스킬에 관한 Anthropic 공식 문서를 확인한다<\/li><li>RAG, 평가, 관측 가능성을 포함한 엔드투엔드 Claude 솔루션을 하나 이상 구축하고 운영한다<\/li><li>아키텍처 의사결정(모델 선택, 통합 프로토콜, 보안 트레이드오프)을 연습한다<\/li><li>8장의 샘플 문제를 풀며 출제 스타일에 익숙해진다<\/li><\/ul>"]}, {"n": "8", "title": "샘플 문제", "secs": ["<p>이 예제는 시험의 출제 스타일과 인지 수준을 보여 주기 위한 것입니다. 실제 시험 문제 은행에서 뽑은 것이 아닙니다. 정답과 해설은 문제 뒤에 있습니다.<\/p>", "<h3>샘플 1 · 분야 3 — 통합<\/h3>\n<p>한 팀이 티켓 열람, 답신 초안 작성, 환불 실행, 사용자 계정 삭제를 할 수 있는 고객 지원 에이전트를 공개하고 있습니다. 이 지원 업무에 필요한 것은 티켓 열람과 답신 초안 작성뿐입니다. 최소 권한 원칙을 적용할 때 리스크를 가장 효과적으로 낮추는 변경은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 환불 도구와 삭제 도구에 로깅을 추가해 부정 사용을 나중에 감사할 수 있게 한다.<\/li><li>B. 환불 도구와 삭제 도구를 에이전트 구성에서 완전히 제거한다.<\/li><li>C. 모든 도구를 남겨 둔 채 환불과 삭제 전에 확인 프롬프트를 추가한다.<\/li><li>D. 에이전트를 지시를 더 확실히 따르는 더 큰 모델로 교체한다.<\/li><\/ul>", "<h3>샘플 2 · 분야 2 — 모델, 프롬프트 작성, 컨텍스트<\/h3>\n<p>한 애플리케이션은 요청할 때마다 똑같은 8,000토큰짜리 시스템 프롬프트와 정책 문서를 보내고, 그 뒤에 짧고 내용이 바뀌는 사용자 메시지를 붙입니다. 지연 시간과 비용이 모두 우려 사항입니다. 둘 다에 가장 직접적으로 대응하는 최적화는 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 정책 문서를 처음 1,000토큰으로 잘라 낸다.<\/li><li>B. 작업 적합성과 관계없이 사용할 수 있는 가장 작은 모델로 바꾼다.<\/li><li>C. 정적인 시스템 프롬프트와 정책을 동적 콘텐츠 앞에 두고 프롬프트 캐싱을 켠다.<\/li><li>D. 정책 문서를 퓨샷 예시 블록으로 옮긴다.<\/li><\/ul>", "<h3>샘플 3 · 분야 4 — 평가와 최적화<\/h3>\n<p>한 RAG 시스템이 문서를 업데이트한 뒤 갑자기 확신에 찬 오답을 내기 시작했습니다. 지연 시간과 모델 버전은 바뀌지 않았습니다. 가장 먼저 조사해야 할 곳으로 가장 가능성이 높은 것은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 모델 가중치가 모르는 사이에 바뀌었다.<\/li><li>B. 검색/인덱싱 단계가 관련 없거나 오래된 청크를 반환하고 있다.<\/li><li>C. temperature 설정이 너무 낮다.<\/li><li>D. 컨텍스트 윈도가 줄어들었다.<\/li><\/ul>", "<h3>정답과 해설<\/h3>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>샘플 1: B.<\/strong> 최소 권한이란 그 역할에 필요 없는 기능을 제거한다는 뜻이며, 공격 표면을 감시하거나 방어하는 것이 아니라 없애는 것입니다. 로깅(A)과 확인(C)은 탐지 통제나 보완 통제일 뿐 불필요한 권한을 제거하는 것이 아닙니다. 모델 크기(D)는 인가 범위와 관계가 없습니다.<\/p><\/details>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>샘플 2: C.<\/strong> 안정적인 콘텐츠를 앞에 두고 프롬프트 캐싱을 켜면 반복되는 접두부(prefix)를 재사용할 수 있으므로, 필요한 컨텍스트를 버리지 않고도 첫 토큰까지의 시간과 요청당 비용을 모두 줄일 수 있습니다. 잘라 내기(A)는 필요한 정책을 잃습니다. 무작정 작은 모델로 바꾸는 것(B)은 품질을 해칠 위험이 있습니다. 퓨샷으로 옮기는 것(D)으로는 캐시 가능하고 재사용 가능한 접두부가 만들어지지 않습니다.<\/p><\/details>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>샘플 3: B.<\/strong> 모델과 지연 시간이 그대로인데 문서 업데이트 뒤에 확신에 찬 오답이 생겼다는 것은 검색이 모델에 질 낮은 컨텍스트를 넘기고 있음을 나타냅니다. 예를 들어 인덱스 재생성 실패나 임베딩 불일치 같은 경우입니다. 나머지 선택지는 문서 업데이트를 특별히 계기로 일어나는 일이 아닙니다.<\/p><\/details>"]}, {"n": "9", "title": "시험 채점 방식", "secs": ["<p>Claude Certified Architect – Professional 시험은 준거 참조형(基準準拠型) 평가입니다. 각 응시자는 다른 응시자와의 비교가 아니라 고정된 도달 기준에 따라 측정됩니다. 합격하려면 다른 응시자의 일정 비율을 웃도는 것이 아니라, 블루프린트에 정의된 지식과 기술을 보여 주어야 합니다.<\/p>\n<p><strong>합격 기준.<\/strong> 합격 점수는 공식적인 기준 설정 연구를 통해 정해졌습니다. 이 연구에서는 훈련받은 해당 분야 전문가들이 최소 역량을 갖춘 응시자에게 기대되는 성적 수준을 판정했습니다. 점수는 100~1,000 척도로 보고되며 합격선(컷 스코어)은 720입니다.<\/p>\n<p><strong>결과 통지.<\/strong> 결과는 합격 또는 불합격 상태와 100~1,000의 환산 점수로 보고됩니다. 성적표에는 각 내용 분야에서 정답을 맞힌 문제의 비율도 표시됩니다. 섹션별 백분율은 자신의 성적을 이해하는 데 도움을 주기 위해 제공되며, 합격 여부 판정에는 사용되지 않습니다. 합격 여부는 총 환산 점수로 판정됩니다.<\/p>"]}, {"n": "10", "title": "등록 및 일정 예약", "secs": ["<p>등록과 일정 예약은 Anthropic Partner Academy와 Pearson VUE를 통해 진행합니다.<\/p>\n<ol><li>Anthropic Partner Academy에서 응시할 시험의 자격증 페이지로 이동해 시험 정보를 확인합니다.<\/li><li>등록 전에 시험 가이드를 다운로드하고 「자격증 이용 약관」(Certification Terms and Conditions)과 「자격 시험 정책」(Certification Exam Policy)을 확인합니다.<\/li><li>시험에 등록하고 결제를 완료합니다. 결제 화면에 표시되는 응시료에는 본인의 파트너 등급에 적용되는 할인이 반영되어 있습니다.<\/li><li>확인 안내에 따라 Pearson VUE 계정을 만들고, 로그인해 시험 세션을 예약합니다.<\/li><li>가능한 날짜를 고르고 온라인 감독 또는 Pearson 시험 센터 중 하나를 선택합니다. 시험은 Pearson VUE가 시행합니다.<\/li><li>예약 시각 24시간 전까지는 취소하거나 일정을 변경할 수 있습니다. 24시간 이내에 한 변경은 응시료가 환불되지 않습니다.<\/li><\/ol>"]}, {"n": "11", "title": "시험 정책", "secs": ["", "<h3>신분증<\/h3>\n<p>시험 당일에는 유효 기간 내의 정부 발급 사진 신분증을 제시해야 합니다. 신분증의 이름은 등록할 때의 이름과 정확히 일치해야 합니다. 등록한 이름을 수정해야 하면 시험을 예약하기 전에 certifications-support@anthropic.com으로 연락하십시오.<\/p>", "<h3>응시 편의 제공<\/h3>\n<p>장애나 필요를 증명하는 서류가 있는 응시자는 관련 법률에 따라 합리적인 응시 편의를 받을 수 있습니다. 응시 편의는 시험을 예약하기 전에 신청해 Pearson VUE의 승인을 받아야 합니다. 신청이 승인될 때까지 예약하지 마십시오. 응시 편의는 pearsonvue.com/us/en/test-takers/accommodations에서 신청하십시오.<\/p>", "<h3>재응시 정책<\/h3>\n<p>합격하지 못한 응시자는 정해진 대기 기간 후에 재응시할 수 있습니다. 대기 기간은 불합격 횟수가 늘수록 길어져, 첫 번째 후 14일, 두 번째 후 30일, 세 번째 후 90일입니다. 같은 시험은 연속된 임의의 12개월 기간 안에 4회까지 응시할 수 있습니다. 상한은 시험별로 적용되므로, 한 시험에 불합격했다고 해서 다른 시험에 등록하지 못하게 되지는 않습니다. 응시료는 응시할 때마다 필요합니다.<\/p>", "<h3>미응시 및 지각<\/h3>\n<p>예약한 시험에 나타나지 않거나 허용된 지각 시간을 넘겨 도착한 응시자는 응시료가 환불되지 않으며 다시 등록해야 합니다. 취소 및 일정 변경 기한은 10장에 나와 있습니다.<\/p>"]}, {"n": "12", "title": "시험 당일 진행과 응시 규칙", "secs": ["<p>시험은 표준화되고 보안이 확보된 감독 환경에서 시행됩니다. 온라인으로 응시하든 Pearson VUE 시험 센터에서 응시하든, 자격을 보유한 모든 사람을 위해 자격의 신뢰성을 지키고자 다음 규칙이 적용됩니다.<\/p>\n<p>시험 중에는 다음을 지켜야 합니다.<\/p>\n<ul><li>온라인 응시 시, 세션 내내 감독관과 웹캠의 시야 안에 머문다<\/li><li>작업 공간에 메모, 책, 전화, 보조 모니터, 기타 물품을 두지 않는다<\/li><li>시험 중 다른 누구와도 연락하거나 대화하지 않는다<\/li><li>어떤 형태로든 시험 내용을 기록, 복사, 촬영, 복제하지 않는다<\/li><\/ul>\n<p>반입 금지 물품에는 휴대전화, 스마트워치, 헤드폰, 학습 자료, 모든 녹음·녹화 장치가 포함됩니다. 감독관이 제공하는 메모지처럼 반입이 허용되는 물품이 있다면 Pearson VUE가 지정합니다.<\/p>\n<p><strong>부정행위의 결과.<\/strong> 커닝, 금지된 자료에 접근하려는 시도, 시험 내용 공개가 있으면 결과 무효화, 자격 취소, 향후 시험 응시 금지로 이어질 수 있습니다.<\/p>"]}, {"n": "13", "title": "기밀 유지 및 비밀유지 계약", "secs": ["<p>시험이 시작되기 전에 기밀 유지 및 비밀유지 계약에 동의해야 합니다. 동의하면 문제, 선택지, 시나리오를 포함한 모든 시험 내용이 Anthropic의 기밀 정보이자 독점 재산이며, 그 어떤 부분도 공개, 복제, 배포하지 않겠다는 데 동의한 것이 됩니다. 계약에 동의하지 않으면 시험 세션이 종료되며 환불되지 않습니다.<\/p>"]}, {"n": "14", "title": "자격 유지와 재인증", "secs": ["<p>Claude Certified Architect – Professional 자격은 수여일로부터 12개월간 유효합니다. 기반 기술이 빠르게 발전하기 때문에, 자격 보유자가 최신 지식을 유지할 수 있도록 자격에 유효 기간을 두었습니다.<\/p>\n<p>기한 안에 갱신하려면 인증 이후의 변경 사항을 확인하고 Anthropic Partner Academy에서 무료 비감독 평가를 완료합니다. 기한 내 갱신에는 비용이 들지 않습니다. 자격이 만료되면 인증 상태를 되찾기 위해 정가 응시료로 전체 시험을 다시 응시해야 합니다.<\/p>\n<p>시험 내용이 크게 바뀐 경우, Anthropic은 자격 보유자에게 재인증을 위해 갱신 평가 대신 전체 시험 재응시를 요구할 수 있습니다.<\/p>\n<p>자격 보유자에게는 12장에 설명된 응시 규칙이 계속 적용됩니다.<\/p>"]}, {"n": "15", "title": "응시자 지원, 이의 제기, 개인정보", "secs": ["", "<h3>지원<\/h3>\n<p>등록한 이름을 수정하려면 certifications-support@anthropic.com으로 연락하십시오. 등록, 예약, 응시 편의, 결과 등 그 밖의 모든 문의는 Pearson VUE 지원(pearsonvue.com/us/en/anthropic.html)으로 하십시오.<\/p>", "<h3>이의 제기 및 불만<\/h3>\n<p>결정에 대해서는 통지를 받은 날로부터 14일 이내에 이의를 제기할 수 있습니다. 시험 결과에 관한 우려는 시험일로부터 14일 이내입니다. 이의 제기는 위 링크의 Pearson VUE 지원으로 제출하십시오. 이의 제기는 프로그램의 이의 제기 정책에 따라 심사됩니다. 기준 설정 결과와 개별 시험 문제의 내용은 이의 제기 대상이 아닙니다.<\/p>", "<h3>개인정보<\/h3>\n<p>등록 및 응시 과정에서 수집되는 개인 데이터는 Anthropic의 개인정보 처리방침, Pearson VUE의 개인정보 처리방침, 관련 데이터 보호 법률에 따라 처리됩니다.<\/p>"]}, {"n": "16", "title": "문서 관리", "secs": ["<table><thead><tr><th>버전<\/th><th>변경 요약<\/th><th>날짜<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>초판 발행<\/td><td>2026년 7월<\/td><\/tr><\/tbody><\/table>"]}]}, "ja": {"title": "Claude Certified Architect – Professional 試験ガイド — 日本語版（公式）", "note": ["出典：Anthropic公式「Claude Certified Architect – Professional 試験ガイド」日本語版PDF（バージョン1.0 · 発効：2026年7月 · 試験コード：CCAR-P）。PDFから本文をそのまま転記し、見出しと表のみMarkdownに整形しています。", "原文冒頭：「本ガイドは予告なく変更されることがあります。」"], "ch": [{"n": "1", "title": "この認定資格について", "secs": ["<p>Claude Certified Architect – Professional認定資格は、AnthropicのClaudeプラットフォームを使用して、本番環境レベルのAIソリューションを設計、構築、提供できることを証明するものです。対象は、アーキテクトの役割を担う実務者です。こうした実務者は、適切なモデル、アーキテクチャ、APIパターンを選択し、プロンプトエンジニアリングとコンテキストエンジニアリングを適用し、Claudeをエンタープライズシステムに統合し、評価、セキュリティ、コンプライアンス、ガバナンスに関する考慮事項を設計に組み込みます。<\/p>\n<p>本ガイドは、受験の準備をする受験者にとっての正式な参照資料です。資格の目的、対象者、試験形式とコンテンツのブループリント、採点、ポリシー、およびすべての受験者が同意する受験規則について説明します。試験を予約する前に、全文をお読みください。<\/p>"]}, {"n": "2", "title": "資格の目的と価値", "secs": ["<p>Claude Certified Architect – Professional認定資格の主な目的は、本番環境でClaudeベースのソリューションを適切に設計するために必要な知識、スキル、能力について、独立した評価を提供することです。この資格を取得することで、資格保有者がClaudeを活用したシステムのライフサイクル全体を主導できること、またはそれに大きく貢献できることを、雇用主、顧客、チームに示すことができます。<\/p>\n<p>この資格を取得した受験者は、次のことができると示せます。<\/p>\n<ul><li>現実のビジネス課題に対応するAIを活用したソリューションを設計し、プロトタイプを作成する<\/li><li>特定のユースケースに適したモデル、アーキテクチャ、APIパターンを選択する<\/li><li>モデルの動作を導くためのプロンプトエンジニアリングとコンテキスト戦略を実装する<\/li><li>API、オーケストレーションツール、データパイプラインを使用して、Claudeを本番システムに統合する<\/li><li>ソリューションの品質を確保するために、評価、モニタリング、オブザーバビリティの手法を適用する<\/li><li>セキュリティ、コンプライアンス、ガバナンスに関する考慮事項をシステム設計に組み込む<\/li><li>部門横断のステークホルダーと協働し、アーキテクチャ上の決定を効果的に伝える<\/li><\/ul>"]}, {"n": "3", "title": "対象者", "secs": ["<p>この認定資格は、大規模言語モデル、特にClaudeを使用して、本番環境レベルのAIソリューションを設計、構築、提供する、中級から上級レベルの技術専門職を対象としています。主な対象者は、ビジネス要件と技術的実装の接点で業務を行うソリューションアーキテクト、AI/MLエンジニア、テクニカルリード、シニアソフトウェアエンジニアです。<\/p>\n<p>こうした専門職は、ビジネス課題をスケーラブルなAIを活用したソリューションに落とし込みます。これには、モデルの選択、プロンプトエンジニアリング、ツールとエージェントのオーケストレーション、コンテキスト管理、およびシステムの安全性、コンプライアンス、ガバナンスの確保が含まれます。多くの場合、ステークホルダーとの関係構築、顧客や社内チームへの助言、アーキテクチャ上の決定の主導にも関与し、セキュリティ、法務、経営層の観点に関する議論も担います。受験者は通常、金融サービス、医療、小売、テクノロジー、教育、政府機関などの業界で業務を行っています。<\/p>\n<p>この認定資格は、初級レベルの開発者、Claudeベースのアプリケーションを時折利用するだけのユーザー、またはエンドツーエンドのAIシステムを設計した経験のない個人を対象としていません。また、純粋に非技術的な役割や、より広範なシステム設計の責任を伴わないプロンプト作成などの個別のタスクに限定された役割も対象外です。<\/p>"]}, {"n": "4", "title": "最低限の能力を備えた受験者のプロファイル", "secs": ["<p>この試験は、合格基準を最低限満たす受験者像（MQC）を基準に設計されています。MQCとは、エンジニアリングの考え方と、AIソリューションをデプロイした実践的な実務経験を兼ね備えた、経験豊富な実務者です。MQCは、本番環境においてClaudeを活用したAIソリューションを設計、実装、統制し、ビジネス要件をスケーラブルで安全かつ信頼性の高いアーキテクチャに落とし込みます。<\/p>\n<p>MQCは、プロンプトエンジニアリングとコンテキストエンジニアリング、検索拡張生成（RAG）、API統合、オーケストレーション、評価フレームワークを含むエンドツーエンドのAIシステムを設計する能力を示し、コスト、レイテンシ、パフォーマンス、安全性、保守性に関するトレードオフを理解しています。<\/p>", "<h3>推奨される経験<\/h3>\n<ul><li>ソフトウェアエンジニアリングのベストプラクティス（モジュール設計、関心の分離、スケーラビリティ）の基礎<\/li><li>システムアーキテクチャまたはプラットフォームエンジニアリングにおける3年以上の経験<\/li><li>本番環境でのClaudeまたは同等のLLMベースのシステムに関する6か月以上の実務経験<\/li><li>ディスカバリーからデプロイ、運用化まで、エンドツーエンドのシステムを提供した経験<\/li><\/ul>\n<p><strong>前提条件：<\/strong>この試験を受験するために必須となる前提条件やコースはありません。上記の経験は推奨されるものであり、必須ではありません。資格は試験の成績のみに基づいて授与されます。<\/p>"]}, {"n": "5", "title": "試験の概要", "secs": ["<table><thead><tr><th>項目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>資格<\/td><td>Claude Certified Architect – Professional<\/td><\/tr><tr><td>試験コード<\/td><td>CCAR-P<\/td><\/tr><tr><td>問題数<\/td><td>63<\/td><\/tr><tr><td>出題形式<\/td><td>択一式および複数選択式の問題。各問題に、選択する解答の数が明記されています<\/td><\/tr><tr><td>制限時間<\/td><td>120分<\/td><\/tr><tr><td>実施方法<\/td><td>監督付き：プログラムのポリシーに従い、オンライン監督付きまたはテストセンター、あるいはその両方<\/td><\/tr><tr><td>合格点<\/td><td>100–1,000のスケールでスケールスコア720<\/td><\/tr><tr><td>受験料<\/td><td>$175 USD<\/td><\/tr><tr><td>有効期間<\/td><td>資格が授与された日から12か月<\/td><\/tr><tr><td>結果の通知<\/td><td>合格／不合格とスケールスコア（100–1,000）。スコアレポートには分野別の正答率も記載されます<\/td><\/tr><\/tbody><\/table>"]}, {"n": "6", "title": "試験内容の概要（ブループリント）", "secs": ["<p>試験ブループリントは、測定対象となる内容分野と、試験における各分野のおおよその配点比率を定めています。配点比率は、職務タスク分析によって決定された、十分な能力での業務遂行に対する各分野の相対的な重要度を反映しています。パーセンテージは、採点対象の問題のうち各分野から出題されるおおよその割合を示します。<\/p>\n<table><thead><tr><th>分野<\/th><th>内容分野<\/th><th>配点比率<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>ソリューション設計とアーキテクチャ<\/td><td>17%<\/td><\/tr><tr><td>2<\/td><td>Claudeモデル、プロンプト作成、コンテキストエンジニアリング<\/td><td>13%<\/td><\/tr><tr><td>3<\/td><td>統合<\/td><td>19%<\/td><\/tr><tr><td>4<\/td><td>評価、テスト、最適化<\/td><td>16%<\/td><\/tr><tr><td>5<\/td><td>ガバナンス、安全性、リスク管理<\/td><td>14%<\/td><\/tr><tr><td>6<\/td><td>ステークホルダーとのコミュニケーションとライフサイクル管理<\/td><td>14%<\/td><\/tr><tr><td>7<\/td><td>開発者の生産性と運用支援<\/td><td>7%<\/td><\/tr><tr><td>合計<\/td><td><\/td><td>100%<\/td><\/tr><\/tbody><\/table>", "<h3>分野別の詳細な目標<\/h3>\n<p>以下の各分野には、受験者が実行できることを期待されるタスクを示しています。試験問題はこれらの目標に基づいて作成されます。<\/p>", "<h4>分野1：ソリューション設計とアーキテクチャ（17%）<\/h4>\n<ul><li>ビジネス課題をClaudeベースのAIソリューションに落とし込む<\/li><li>エンドツーエンドのアーキテクチャ（入力 → 処理 → 出力 → フィードバックループ）を設計する<\/li><li>適切なアーキテクチャパターン（ワークフロー、エージェント型、拡張LLM）を選択する<\/li><li>マルチエージェントシステムとオーケストレーション戦略を設計する<\/li><li>複雑な問題解決のために分解の手法を適用する<\/li><li>ソリューションをビジネス価値の柱（効率性、変革、生産性、コスト、パフォーマンスSLA）に整合させる<\/li><\/ul>", "<h4>分野2：Claudeモデル、プロンプト作成、コンテキストエンジニアリング（13%）<\/h4>\n<ul><li>トレードオフに基づいて適切なClaudeモデルを選択する<\/li><li>システムプロンプト、テンプレート、ガードレールを設計する<\/li><li>プロンプトエンジニアリングの手法（ゼロショット、few-shot、思考の連鎖）を適用する<\/li><li>コンテキストウィンドウを最適化し、トークン使用量を管理する<\/li><li>プロンプトの再利用戦略（キャッシング、モジュール型プロンプト、スキル）を実装する<\/li><\/ul>", "<h4>分野3：統合（19%）<\/h4>\n<ul><li>ツールやエージェントの構成を、機能の肥大化の観点から評価する<\/li><li>認証と認可の要件を分析し、セキュリティ上のギャップを特定する<\/li><li>精度とレイテンシのトレードオフを評価し、構成に関する決定の根拠を示す<\/li><li>オブザーバビリティの課題を分析し、大規模環境でのモニタリング戦略を選択する<\/li><li>適切なチャンキング戦略とインデックス作成戦略を備えたRAGパイプラインを設計する<\/li><li>データの形状とクエリパターンに合った検索戦略を適用する<\/li><li>接続プロトコルを評価し、適切な統合メカニズム（MCP、API/CLI、エージェント間）を選択する<\/li><li>段階的ディスカバリーと一括型コンテキスト戦略を比較評価する<\/li><\/ul>", "<h4>分野4：評価、テスト、最適化（16%）<\/h4>\n<ul><li>評価指標（精度、レイテンシ、コスト、安全性、セキュリティ）を定義する<\/li><li>複数の方法論を組み合わせて、評価データセットとテストフレームワークを設計する<\/li><li>A/Bテストと反復的な改善を実施する<\/li><li>システムの問題（プロンプトの失敗、ハルシネーション、モデルの不適合）を診断する<\/li><li>トークン使用量、レイテンシ、コストとパフォーマンスのトレードオフを最適化する<\/li><li>ロギングツールとオブザーバビリティツールを使用してシステムのパフォーマンスをモニタリングする<\/li><\/ul>", "<h4>分野5：ガバナンス、安全性、リスク管理（14%）<\/h4>\n<ul><li>ガードレールと安全管理策を実装する<\/li><li>LLMシステムのリスク、限界、障害モードを特定する<\/li><li>ヒューマン・イン・ザ・ループによる検証戦略を適用する<\/li><li>規制（GDPR、HIPAA、FedRAMPなど）へのコンプライアンスを確保する<\/li><li>倫理的なAIに関する考慮事項（バイアス、公平性、透明性）に対処する<\/li><\/ul>", "<h4>分野6：ステークホルダーとのコミュニケーションとライフサイクル管理（14%）<\/h4>\n<ul><li>体系的なディスカバリーと要件収集を実施する<\/li><li>アーキテクチャ上の決定とトレードオフを伝える<\/li><li>ステークホルダーからのフィードバックループと期待値の調整（SLAを含む）を管理する<\/li><li>アーキテクチャを文書化し、実装のガイダンスを提供する<\/li><li>ライフサイクルの各フェーズ（ディスカバリー、設計、引き継ぎ、モニタリング、反復）を支援する<\/li><\/ul>", "<h4>分野7：開発者の生産性と運用支援（7%）<\/h4>\n<ul><li>チーム向けにClaudeのツールと環境（Claude Codeなど）を構成する<\/li><li>AI支援ツールを使用して開発者のワークフローを改善する<\/li><li>デバッグと運用上の問題解決を支援する<\/li><\/ul>"]}, {"n": "7", "title": "準備の方法", "secs": ["<p>必修のコースはありません。Anthropicは、特定のリソースが合格を保証するものであるとは約束しません。受験者には、実践的な経験と以下のリソースを組み合わせることをお勧めします。<\/p>\n<ul><li>セクション6の試験ブループリントを学習し、各目標に照らして自己評価する<\/li><li>Claude API、モデル、プロンプトエンジニアリング、MCP、スキルに関するAnthropicの公式ドキュメントを確認する<\/li><li>RAG、評価、オブザーバビリティを含むエンドツーエンドのClaudeソリューションを1つ以上構築し、運用する<\/li><li>アーキテクチャ上の意思決定（モデルの選択、統合プロトコル、セキュリティのトレードオフ）を練習する<\/li><li>セクション8のサンプル問題を解き、出題スタイルに慣れる<\/li><\/ul>"]}, {"n": "8", "title": "サンプル問題", "secs": ["<p>これらの例題は、試験の出題スタイルと認知レベルを示すものです。実際の試験の問題バンクから抜粋したものではありません。正解と解説は問題の後に記載しています。<\/p>", "<h3>サンプル1 · 分野3 — 統合<\/h3>\n<p>あるチームが、チケットの閲覧、返信の下書き作成、返金の実行、ユーザーアカウントの削除ができるカスタマーサポートエージェントを公開しています。このサポート業務に必要なのは、チケットの閲覧と返信の下書き作成だけです。最小権限の原則を適用する場合、リスクを最も効果的に低減する変更はどれですか。<\/p>\n<ul class=\"opts\"><li>A. 返金ツールと削除ツールにロギングを追加し、不正使用を後から監査できるようにする。<\/li><li>B. 返金ツールと削除ツールをエージェントの構成から完全に削除する。<\/li><li>C. すべてのツールを残したまま、返金と削除の前に確認プロンプトを追加する。<\/li><li>D. エージェントを、指示により確実に従う、より大きなモデルに置き換える。<\/li><\/ul>", "<h3>サンプル2 · 分野2 — モデル、プロンプト作成、コンテキスト<\/h3>\n<p>あるアプリケーションは、リクエストのたびに同じ8,000トークンのシステムプロンプトとポリシー文書を送信し、その後に短く内容の変わるユーザーメッセージを続けています。レイテンシとコストの両方が懸念事項です。両方に最も直接的に対処できる最適化はどれですか。<\/p>\n<ul class=\"opts\"><li>A. ポリシー文書を最初の1,000トークンに切り詰める。<\/li><li>B. タスクへの適合性にかかわらず、利用可能な最小のモデルに切り替える。<\/li><li>C. 静的なシステムプロンプトとポリシーを動的なコンテンツの前に配置し、プロンプトキャッシングを有効にする。<\/li><li>D. ポリシー文書をfew-shotの例示ブロックに移動する。<\/li><\/ul>", "<h3>サンプル3 · 分野4 — 評価と最適化<\/h3>\n<p>あるRAGシステムが、文書の更新後に突然、確信に満ちた誤った回答を返すようになりました。レイテンシとモデルのバージョンは変わっていません。最初に調査すべき箇所として最も可能性が高いのはどれですか。<\/p>\n<ul class=\"opts\"><li>A. モデルの重みが気づかないうちに変更された。<\/li><li>B. 検索／インデックス作成のステップが、関連性のない、または古いチャンクを返している。<\/li><li>C. temperatureの設定が低すぎる。<\/li><li>D. コンテキストウィンドウが縮小した。<\/li><\/ul>", "<h3>正解と解説<\/h3>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>サンプル1：B。<\/strong> 最小権限とは、その役割に必要のない機能を削除することを意味し、攻撃対象領域を監視または防護するのではなく、排除します。ロギング（A）と確認（C）は発見的統制または補完的統制であり、不要な権限の削除ではありません。モデルのサイズ（D）は認可の範囲とは無関係です。<\/p><\/details>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>サンプル2：C。<\/strong> 安定したコンテンツを先に配置してプロンプトキャッシングを有効にすると、繰り返されるプレフィックスを再利用できるため、必要なコンテキストを捨てることなく、最初のトークンまでの時間とリクエストあたりのコストの両方を削減できます。切り詰め（A）では必要なポリシーが失われます。やみくもな小型化（B）は品質を損なうリスクがあります。few-shotへの移動（D）では、キャッシュ可能で再利用可能なプレフィックスは作られません。<\/p><\/details>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>サンプル3：B。<\/strong> モデルとレイテンシが変わらないまま、文書の更新後に確信に満ちた誤った回答が生じていることは、検索がモデルに質の低いコンテキストを渡していることを示しています。たとえば、インデックスの再作成の失敗や、埋め込みの不一致などです。他の選択肢は、文書の更新を特にきっかけとして起こるものではありません。<\/p><\/details>"]}, {"n": "9", "title": "試験の採点方法", "secs": ["<p>Claude Certified Architect – Professional試験は、基準準拠型の評価です。各受験者は、他の受験者との比較ではなく、固定された到達基準に照らして測定されます。合格するには、他の受験者の一定割合を上回ることではなく、ブループリントで定義された知識とスキルを示すことが必要です。<\/p>\n<p><strong>合格基準。<\/strong>合格点は、正式な基準設定調査を通じて定められました。この調査では、トレーニングを受けた対象領域の専門家が、最低限の能力を備えた受験者に期待される成績の水準を判定しました。スコアは100–1,000のスケールで報告され、カットスコアは720です。<\/p>\n<p><strong>結果の通知。<\/strong>結果は、合格または不合格のステータスと、100から1,000までのスケールスコアで報告されます。スコアレポートには、各内容分野であなたが正解した問題の割合も記載されます。セクション別のパーセンテージは、ご自身の成績を理解するために提供されるものであり、合否の判定には使用されません。合否は総合のスケールスコアに基づいて判定されます。<\/p>"]}, {"n": "10", "title": "申し込みと予約", "secs": ["<p>申し込みと予約は、Anthropic Partner AcademyとPearson VUEを通じて行います。<\/p>\n<ol><li>Anthropic Partner Academyで受験する試験の認定資格ページにアクセスし、試験の詳細を確認します。<\/li><li>申し込む前に、試験ガイドをダウンロードし、「認定資格利用規約」（Certification Terms and Conditions）と「認定試験ポリシー」（Certification Exam Policy）を確認します。<\/li><li>試験に申し込み、支払い手続きを完了します。支払い手続きの画面に表示される受験料には、ご自身のパートナーティアに適用される割引が反映されています。<\/li><li>確認の案内に従ってPearson VUEアカウントを作成し、サインインして試験セッションを予約します。<\/li><li>空いている日程を選び、オンライン監督付きまたはPearsonのテストセンターのいずれかを選択します。試験はPearson VUEによって実施されます。<\/li><li>予約時刻の24時間前までは、キャンセルまたは予約変更ができます。24時間以内に行った変更では、受験料は返金されません。<\/li><\/ol>"]}, {"n": "11", "title": "試験ポリシー", "secs": ["", "<h3>本人確認書類<\/h3>\n<p>試験当日は、有効期限内の、政府発行の有効な写真付き本人確認書類を提示する必要があります。本人確認書類の氏名は、申し込み時の氏名と完全に一致していなければなりません。申し込み時の氏名を訂正する必要がある場合は、試験を予約する前にcertifications-support@anthropic.comまでご連絡ください。<\/p>", "<h3>受験上の配慮<\/h3>\n<p>障害またはニーズを証明する書類のある受験者は、適用される法律に従い、合理的な受験上の配慮を受けられます。受験上の配慮は、試験を予約する前に申請し、Pearson VUEの承認を受ける必要があります。申請が承認されるまで、予約をしないでください。受験上の配慮はpearsonvue.com/us/en/test-takers/accommodationsで申請してください。<\/p>", "<h3>再受験ポリシー<\/h3>\n<p>合格しなかった受験者は、所定の待機期間の後に再受験できます。待機期間は不合格の回数が増えるごとに長くなり、初回の後は14日、2回目の後は30日、3回目の後は90日です。同じ試験は、任意の連続する12か月の期間内に4回まで受験できます。上限は試験ごとに適用されるため、ある試験に合格しなかったことで、別の試験に申し込めなくなることはありません。受験料は受験のたびに必要です。<\/p>", "<h3>無断欠席と遅刻<\/h3>\n<p>予約した試験に現れなかった受験者、または許容される遅刻の時間枠を過ぎて到着した受験者は、受験料が返金されず、あらためて申し込む必要があります。キャンセルと予約変更の期限はセクション10に記載されています。<\/p>"]}, {"n": "12", "title": "試験当日の流れと受験規則", "secs": ["<p>試験は、標準化され、安全が確保された、監督付きの環境で実施されます。オンラインで受験する場合も、Pearson VUEのテストセンターで受験する場合も、資格を保有するすべての人のために資格の信頼性を守る目的で、以下の規則が適用されます。<\/p>\n<p>試験中は、次のことを守る必要があります。<\/p>\n<ul><li>オンラインで受験する場合、セッションの間ずっと試験監督者とウェブカメラの視界内にとどまる<\/li><li>作業スペースにメモ、書籍、電話、サブモニター、その他の物品を置かない<\/li><li>試験中、他のいかなる人とも連絡や会話をしない<\/li><li>試験内容を、いかなる形式でも記録、複写、撮影、複製しない<\/li><\/ul>\n<p>持ち込みが禁止されている物品には、携帯電話、スマートウォッチ、ヘッドホン、学習教材、あらゆる録音・録画機器が含まれます。試験監督者が提供するメモ用紙など、持ち込みが許可される物品がある場合は、Pearson VUEが指定します。<\/p>\n<p><strong>不正行為の結果。<\/strong>カンニング、禁止されているリソースへのアクセスの試み、試験内容の開示があった場合、結果の無効化、資格の取り消し、今後の試験の受験禁止となることがあります。<\/p>"]}, {"n": "13", "title": "機密保持と秘密保持契約", "secs": ["<p>試験が始まる前に、機密保持および秘密保持契約に同意する必要があります。同意することにより、問題、解答の選択肢、シナリオを含むすべての試験内容がAnthropicの機密情報であり専有財産であること、およびそのいかなる部分も開示、複製、配布しないことに同意したことになります。契約に同意しない場合、試験セッションは終了し、返金は行われません。<\/p>"]}, {"n": "14", "title": "資格の維持と再認定", "secs": ["<p>Claude Certified Architect – Professional資格は、授与された日から12か月間有効です。基盤となる技術は急速に進化するため、資格保有者が最新の知識を維持できるよう、資格には有効期間が設けられています。<\/p>\n<p>期限内に更新するには、認定を受けてからの変更点を確認し、Anthropic Partner Academyで無料の監督なしのアセスメントを完了します。期限内の更新に費用はかかりません。資格が失効した場合、認定されたステータスを取り戻すには、正規の受験料で試験全体を再受験する必要があります。<\/p>\n<p>試験内容が大幅に変更された場合、Anthropicは資格保有者に対し、再認定のために、更新アセスメントの完了ではなく試験全体の再受験を求めることがあります。<\/p>\n<p>資格保有者には、セクション12に記載された受験規則が引き続き適用されます。<\/p>"]}, {"n": "15", "title": "受験者サポート、異議申し立て、プライバシー", "secs": ["", "<h3>サポート<\/h3>\n<p>申し込み時の氏名を訂正するには、certifications-support@anthropic.comまでご連絡ください。申し込み、予約、受験上の配慮、結果など、その他すべての質問については、Pearson VUEのサポート（pearsonvue.com/us/en/anthropic.html）にお問い合わせください。<\/p>", "<h3>異議申し立てと苦情<\/h3>\n<p>決定に対しては、その通知を受けた日から14日以内に異議申し立てができます。試験結果に関する懸念の場合は、試験日から14日以内です。異議申し立ては、上記のリンクからPearson VUEのサポートに提出してください。異議申し立ては、プログラムの異議申し立てポリシーに基づいて審査されます。基準設定の結果および個々の試験問題の内容は、異議申し立ての対象になりません。<\/p>", "<h3>プライバシー<\/h3>\n<p>申し込みおよび受験の際に収集される個人データは、Anthropicのプライバシーポリシー、Pearson VUEのプライバシーポリシー、および適用されるデータ保護法に従って取り扱われます。<\/p>"]}, {"n": "16", "title": "文書管理", "secs": ["<table><thead><tr><th>バージョン<\/th><th>変更の概要<\/th><th>日付<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>初版発行<\/td><td>2026年7月<\/td><\/tr><\/tbody><\/table>"]}]}};
const out=document.getElementById('out'), nav=document.getElementById('chaps'), noteEl=document.getElementById('note');
const N=DATA.ko.ch.length;
const NOTES={
 ko:['<p><strong>한국어판</strong>: 일본어 공식 가이드(v1.0, 2026년 7월 발효) 전문을 요약 없이 옮긴 비공식 번역입니다. 해석이 갈리면 일본어 공식판이 기준입니다.</p>'],
 ja:['<p><strong>日本語版</strong>：Anthropic公式の日本語版試験ガイドPDF（バージョン1.0）の本文をそのまま転記しています。見出しと表のみ整形しました。</p>'],
 dual:['<p><strong>한·日 대조</strong>: 왼쪽은 한국어 번역, 오른쪽은 일본어 공식판입니다. 같은 항목(분야·샘플 문제)끼리 줄을 맞췄습니다.</p>']
};
let view='ko', openAll=false;
try{const s=localStorage.getItem('ccar-p-guide-view'); if(s&&NOTES[s]) view=s;}catch(e){}
function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');}
function prep(h){h=wrapTables(h); return openAll?h.replace(/<details class="ans">/g,'<details class="ans" open>'):h;}
function render(){
  document.body.classList.toggle('dual',view==='dual');
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  noteEl.innerHTML=NOTES[view].join('');
  document.getElementById('openAll').textContent=openAll?(view==='ja'?'正解をすべて閉じる':view==='en'?'Hide all answers':'샘플 문제 정답 모두 접기'):(view==='ja'?'正解をすべて開く':view==='en'?'Show all answers':'샘플 문제 정답 모두 펼치기');
  let h='';
  for(let i=0;i<N;i++){
    const ko=DATA.ko.ch[i], ja=DATA.ja.ch[i], n=ko.n;
    h+=`<section class="chap" id="c${n}">`;
    if(view==='dual'){
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1>${ko.title}<span class="sub ja" lang="ja">${ja.title}</span></h1></div>`;
      h+=`<div class="colhead"><span>한국어</span><span>日本語</span></div>`;
      ko.secs.forEach((s,j)=>{h+=`<div class="pair"><div class="sec">${prep(s)}</div><div class="sec ja" lang="ja">${prep(ja.secs[j])}</div></div>`;});
    }else{
      const L=view, c=DATA[L].ch[i];
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1 class="${L}" lang="${L}">${c.title}</h1></div>`;
      h+=`<div class="sec ${L}" lang="${L}">${c.secs.map(prep).join('')}</div>`;
    }
    h+='</section>';
  }
  out.innerHTML=h;
  const L=view==='dual'?'ko':view;
  nav.innerHTML=DATA[L].ch.map(c=>`<button data-c="${c.n}" title="${c.title}">${c.n}</button>`).join('');
  spy();
}
document.querySelector('.langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const cur=current();
  view=b.dataset.v; try{localStorage.setItem('ccar-p-guide-view',view);}catch(e){}
  render(); jump(cur,false);
});
document.getElementById('openAll').addEventListener('click',()=>{const cur=current(); openAll=!openAll; render(); jump(cur,false);});
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) jump(b.dataset.c,true);});
function off(){return document.querySelector('header.top').getBoundingClientRect().bottom;}
function jump(n,smooth){
  const el=document.getElementById('c'+n); if(!el) return;
  window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off()-8,behavior:smooth?'smooth':'auto'});
}
function current(){
  const o=off()+20; let c=DATA.ko.ch[0].n;
  DATA.ko.ch.forEach(x=>{const el=document.getElementById('c'+x.n); if(el&&el.getBoundingClientRect().top<=o) c=x.n;}); return c;
}
function spy(){const c=current(); nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));}
addEventListener('scroll',spy,{passive:true});
render();
</script>

</body>

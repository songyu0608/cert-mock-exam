<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>CCDV-F 공식 시험 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: sticky bar (language tabs + chapter chips), one reading column; "대조" view = section-aligned two-column grid */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b1f2a; --muted:#5b6475; --line:#dde1e8;
  --accent:#2f4bb8; --accent-soft:#e7ebfa; --code-bg:#eef0f5; --quote:#f0f3fb; --ok:#1d7a52; --ok-soft:#e5f4ec;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-display:"Fraunces",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ko);font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.dual .wrap{max-width:1260px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto;letter-spacing:.01em}
.brand small{font-family:var(--f-ko);color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:4px 10px;font-size:13px;line-height:1.5}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chaps button{font-family:var(--f-mono);font-size:12px;padding:1px 0;min-width:30px;text-align:center}
.chaps button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding-block:24px 80px}
.note{font-size:13px;color:var(--muted);line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:36px;background:var(--surface)}
.note p{margin:0}
.chap{margin-bottom:56px}
.chap-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:8px}
.chap-no{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.2em}
.chap-head h1{font-size:22px;line-height:1.4;margin:0;text-wrap:balance}
.chap-head .sub{font-size:13px;color:var(--muted);display:block;font-weight:400}
.sec h3{font-size:18px;margin:34px 0 8px;text-wrap:balance}
.sec h4{font-size:15.5px;margin:28px 0 6px;color:var(--accent);line-height:1.55;text-wrap:balance}
.sec p{margin:0 0 14px}
.sec ul,.sec ol{margin:0 0 14px;padding-left:1.4em}
.sec li{margin:3px 0}
.sec ul.opts{list-style:none;padding-left:0}
.sec ul.opts li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;background:var(--surface)}
.sec blockquote{margin:16px 0;padding:10px 16px;background:var(--quote);border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.sec blockquote p:last-child{margin-bottom:0}
details.ans{margin:4px 0 26px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.ans summary{cursor:pointer;padding:7px 12px;font-size:13.5px;color:var(--ok);font-weight:600}
details.ans[open]{background:var(--ok-soft);border-color:var(--ok)}
details.ans p{margin:0;padding:0 14px 12px}
.sec code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:6px 0 18px}
.sec table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.sec th,.sec td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sec th{background:var(--code-bg)}
.ja{font-family:var(--f-ja)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0}
.pair>div{min-width:0}
.colhead{display:grid;grid-template-columns:1fr 1fr;gap:36px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:820px){.pair{grid-template-columns:1fr}.pair>div.ja{border-top:1px dotted var(--line);padding-top:4px}.colhead{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <span class="brand">CCDV-F 시험 가이드<small>v1.0 · 전문</small></span>
    <div class="row langs" role="group" aria-label="언어">
      <button id="v-ko" data-v="ko">한국어</button>
      <button id="v-ja" data-v="ja">日本語</button>
      <button id="v-dual" data-v="dual">한·日 대조</button>
    </div>
  </div>
  <div class="row chaps" role="group" aria-label="장 이동" id="chaps"></div>
</div></header>
<main><div class="wrap">
  <div class="note" id="note"></div>
  <div class="row" style="margin:-24px 0 24px"><span class="tools"><button id="openAll">샘플 문제 정답 모두 펼치기</button></span></div>
  <div id="out"></div>
</div></main>

<script>
const DATA={"ko": {"title": "Claude Certified Developer – Foundations 시험 가이드 — 한국어판(비공식 번역)", "note": ["원문: Anthropic 공식 「Claude Certified Developer – Foundations 試験ガイド」 일본어판 PDF(버전 1.0 · 2026년 7월 발효 · 시험 코드 CCDV-F).", "일본어 공식판을 요약 없이 옮긴 비공식 번역입니다. 해석이 갈리면 일본어 공식판이 기준입니다. 제품명·기능명·API 이름은 원어를 그대로 두거나 병기했습니다.", "원문 서두 문구: 「本ガイドは予告なく変更されることがあります。」(이 가이드는 예고 없이 변경될 수 있습니다.)"], "ch": [{"n": "1", "title": "이 자격증에 대하여", "secs": ["<p>Claude Certified Developer – Foundations 자격증은 Anthropic의 Claude 플랫폼을 사용해 프로덕션 수준의 애플리케이션, 에이전트, 워크플로를 기초 수준에서 구축·통합·출시할 수 있음을 증명합니다. 이 자격증은 Claude의 기능과 프로덕션에서 운용 가능한 애플리케이션 사이를 잇는 역할을 맡아, API 통합, 에이전트와 도구 구축, 프롬프트와 컨텍스트 엔지니어링, 평가, 보안, 모델 선택을 통해 기술 요구 사항을 실제로 동작하는 시스템으로 옮기는 기술 전문가를 대상으로 합니다.<\/p>\n<p>이 가이드는 응시를 준비하는 응시자를 위한 공식 참고 자료입니다. 자격의 목적, 대상자, 시험 형식과 콘텐츠 블루프린트, 채점, 정책, 그리고 모든 응시자가 동의하는 응시 규칙을 설명합니다. 시험을 예약하기 전에 전체를 읽어 주십시오.<\/p>"]}, {"n": "2", "title": "자격의 목적과 가치", "secs": ["<p>Claude Certified Developer – Foundations 자격증의 주된 목적은 Claude 기반 애플리케이션을 기초 수준에서 제대로 구축하는 데 필요한 지식, 기술, 능력을 독립적으로 평가하는 것입니다. 이 자격을 취득하면, 보유자가 Claude를 활용한 시스템의 구축·통합·출시를 직접 주도하거나 크게 기여할 수 있음을 고용주, 고객, 팀에 보여 줄 수 있습니다.<\/p>\n<p>이 자격을 취득한 응시자는 다음 영역에서 지식을 효과적으로 적용할 수 있음을 증명할 수 있습니다.<\/p>\n<ul><li>Claude Agent SDK, 에이전트 프레임워크, 커스텀 에이전트 루프를 사용한 에이전트와 워크플로 구축<\/li><li>API, 클라이언트 SDK, 서드파티 통합을 통한 애플리케이션 코드로의 Claude 통합(스트리밍, 오류 처리, 여러 형식의 입력 포함)<\/li><li>여러 인터페이스에서의 Claude Code 조작, Claude 스킬 작성, CLAUDE.md·settings.json·플러그인 설정<\/li><li>모델 동작을 제어하고 컨텍스트 드리프트를 막기 위한 효과적인 프롬프트 작성과 컨텍스트 엔지니어링 기법 적용<\/li><li>평가 설계와 실행, 트레이스 분석을 통한 장애 모드 디버깅, 구조화 출력 검증, 프로덕션 품질 모니터링<\/li><li>비용과 지연 시간을 최적화하기 위한 Claude 모델 등급(티어) 선택과 토큰·캐싱·배치 처리 관리<\/li><li>프롬프트 인젝션과 파괴적인 동작을 막기 위한 보안 중심 설계(secure by design) 원칙 적용과 훅을 이용한 가드레일 구현<\/li><li>내장 도구, 커스텀 도구, 스킬, MCP 사이의 트레이드오프를 고려한 커스텀 도구, 함수 스키마, MCP 서버 구축<\/li><\/ul>"]}, {"n": "3", "title": "대상자", "secs": ["<p>이 자격증은 대규모 언어 모델(LLM), 특히 Anthropic의 Claude 플랫폼을 사용해 프로덕션 수준의 AI 솔루션을 구축·통합·출시하는 기술 전문가를 대상으로 합니다. 주 대상은 비즈니스 요구 사항과 기술 구현이 만나는 영역에서 일하는 AI·머신러닝 엔지니어, 테크니컬 리드, 시니어 소프트웨어 엔지니어입니다.<\/p>\n<p>이런 전문가는 보통 소프트웨어 엔지니어링 경력이 1~5년이고, 여기에 더해 Claude 또는 그에 준하는 LLM 기반 시스템의 실무 경험이 6개월 이상입니다. 소프트웨어 개발에 관한 탄탄한 기초 지식과 응용 기술을 갖추고 있어, Claude Agent SDK와 에이전트 프레임워크를 사용한 에이전트·워크플로 구축, Application Programming Interface(API)와 클라이언트 Software Development Kit(SDK)를 통한 Claude 통합, 코드베이스 현대화를 위한 Claude Code 조작, 효과적인 프롬프트 작성과 컨텍스트 엔지니어링 적용, 평가 설계와 실행, 커스텀 도구와 Model Context Protocol(MCP) 서버 구축을 할 수 있습니다. 모델 선택과 도구 종류에 관한 트레이드오프를 이해하고, 기술 요구 사항을 충족하기 위해 적절한 패턴을 적용할 수 있습니다. Python, TypeScript 또는 둘 다에 능숙하고, REST API와 Command Line Interface(CLI) 도구를 능숙하게 다루며, LLM 기초, 에이전트, 컨텍스트 관리, MCP를 실무 수준으로 이해하고 있습니다.<\/p>\n<p>이 자격증은 Claude 기반 애플리케이션의 비기술 사용자나 가벼운 사용자, 또는 실무 소프트웨어 개발 경험이 없는 사람을 대상으로 하지 않습니다. 또한 애플리케이션 개발에 관한 더 넓은 책임 없이 프롬프트 작성 등 개별 작업에만 한정된 역할도 대상이 아닙니다.<\/p>"]}, {"n": "4", "title": "최소 역량 응시자 프로필", "secs": ["<p>이 시험은 합격 기준을 최소한으로 충족하는 응시자상(MQC)을 기준으로 설계되었습니다. MQC는 Claude를 활용한 애플리케이션, 에이전트, 워크플로를 구축·통합·출시하는, 실무에 종사하는 기술자입니다. Claude의 기능과 프로덕션에서 운용 가능한 애플리케이션 사이를 이어, 기술 요구 사항을 실제로 동작하는 애플리케이션으로 옮깁니다.<\/p>\n<p>MQC는 소프트웨어 개발에 관한 탄탄한 기초 지식과 응용 기술을 갖추고 있습니다. 여기에는 Claude Agent SDK와 에이전트 프레임워크를 사용한 에이전트·워크플로 구축, API와 클라이언트 SDK를 통한 Claude 통합, 코드베이스 현대화를 위한 Claude Code 조작, 효과적인 프롬프트 작성과 컨텍스트 엔지니어링 적용, 평가 설계와 실행, 커스텀 도구와 MCP 서버 구축 능력이 포함됩니다. 모델 선택(비용, 지연 시간, 성능)과 도구 종류(내장, 커스텀, 스킬, MCP)에 관한 트레이드오프를 이해하고, 기술 요구 사항을 충족하기 위해 적절한 패턴을 적용할 수 있습니다.<\/p>", "<h3>권장 경험<\/h3>\n<ul><li>소프트웨어 엔지니어링 경력 1~5년<\/li><li>Claude 또는 그에 준하는 LLM 기반 시스템의 실무 경험 6개월 이상<\/li><li>Python, TypeScript 또는 둘 다에 대한 숙련<\/li><li>REST API와 CLI 도구를 능숙하게 다룰 수 있음<\/li><li>LLM 기초, 에이전트, 컨텍스트 관리, MCP에 대한 실무 수준의 이해<\/li><\/ul>\n<p><strong>전제 조건:<\/strong> 이 시험에 응시하기 위한 필수 전제 조건이나 과정은 없습니다. 위의 경험은 권장 사항이며 필수가 아닙니다. 자격은 시험 성적만으로 수여됩니다.<\/p>"]}, {"n": "5", "title": "시험 개요", "secs": ["<table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>자격<\/td><td>Claude Certified Developer – Foundations<\/td><\/tr><tr><td>시험 코드<\/td><td>CCDV-F<\/td><\/tr><tr><td>문항 수<\/td><td>53<\/td><\/tr><tr><td>출제 형식<\/td><td>단일 선택형과 복수 선택형 문제. 문제마다 골라야 할 답의 개수가 명시되어 있습니다<\/td><\/tr><tr><td>시험 시간<\/td><td>120분<\/td><\/tr><tr><td>시행 방식<\/td><td>감독 시험: 프로그램 정책에 따라 온라인 감독 또는 시험 센터, 혹은 둘 다<\/td><\/tr><tr><td>합격 점수<\/td><td>100~1,000 척도에서 환산 점수 720<\/td><\/tr><tr><td>응시료<\/td><td>$125 USD<\/td><\/tr><tr><td>유효 기간<\/td><td>자격 수여일로부터 12개월<\/td><\/tr><tr><td>결과 통지<\/td><td>합격/불합격과 환산 점수(100~1,000). 성적표에는 분야별 정답률도 표시됩니다<\/td><\/tr><\/tbody><\/table>"]}, {"n": "6", "title": "시험 내용 개요(블루프린트)", "secs": ["<p>시험 블루프린트는 측정 대상인 콘텐츠 분야와 기술, 그리고 시험에서 각 분야가 차지하는 대략적인 배점 비율을 정한 것입니다. 배점 비율은 직무 작업 분석과 콘텐츠 타당성 조사로 판정된, 적절한 업무 수행에 대한 각 분야의 상대적 중요도를 반영합니다. 백분율은 채점 대상 문제 가운데 각 분야에서 출제되는 대략적인 비율을 나타냅니다.<\/p>\n<table><thead><tr><th>분야<\/th><th>내용 분야<\/th><th>배점 비율<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>에이전트와 워크플로<\/td><td>14.7%<\/td><\/tr><tr><td>2<\/td><td>애플리케이션과 통합<\/td><td>33.1%<\/td><\/tr><tr><td>3<\/td><td>Claude Code<\/td><td>3.1%<\/td><\/tr><tr><td>4<\/td><td>평가, 테스트, 디버깅<\/td><td>2.6%<\/td><\/tr><tr><td>5<\/td><td>모델 선택과 최적화<\/td><td>16.8%<\/td><\/tr><tr><td>6<\/td><td>프롬프트와 컨텍스트 엔지니어링<\/td><td>11.0%<\/td><\/tr><tr><td>7<\/td><td>보안과 안전<\/td><td>8.1%<\/td><\/tr><tr><td>8<\/td><td>도구와 MCP<\/td><td>10.6%<\/td><\/tr><tr><td>합계<\/td><td><\/td><td>100%<\/td><\/tr><\/tbody><\/table>", "<h3>분야별 세부 목표<\/h3>\n<p>아래 각 분야에는 시험 문제 작성의 기준이 되는 기술(스킬)을 적었습니다. 스킬 설명은 측정 대상인 지식과 능력을 정리한 것입니다. 스킬의 배점 비율은 시험 전체에서 각 스킬이 차지하는 비율을 나타냅니다.<\/p>", "<h4>분야 1: 에이전트와 워크플로(14.7%)<\/h4>\n<p><strong>에이전트 아키텍처(4.5%)<\/strong><\/p>\n<p>에이전트와 워크플로 아키텍처에 관한 원칙, 패턴, 트레이드오프. 워크플로와 에이전트 중 무엇을 쓸지의 판단 기준, 매니저/슈퍼바이저 계층 구조, 작업 수행 개선에서 서브에이전트의 역할을 포함한다.<\/p>\n<p><strong>Claude로 에이전트 구축(5.3%)<\/strong><\/p>\n<p>Claude 에이전트를 구축하기 위한 방법, 도구, 플랫폼. Claude Agent SDK, 커스텀 에이전트 루프와 하네스, 관리형 에이전트의 배포 모델(셀프 호스팅과 Anthropic 호스팅), 결정론적 동작을 위한 훅을 포함한다.<\/p>\n<p><strong>에이전트 패턴과 프레임워크(4.9%)<\/strong><\/p>\n<p>여러 단계로 이루어진 작업용 에이전트와 워크플로를 구축하기 위한 일반적인 에이전트 설계 패턴(도구 사용 루프, 서브에이전트, 메모리, 컨텍스트 윈도 관리)과 에이전트용 추상화 프레임워크(예: Strands, LangGraph, PydanticAI).<\/p>", "<h4>분야 2: 애플리케이션과 통합(33.1%)<\/h4>\n<p><strong>요구 사항 이해(3.4%)<\/strong><\/p>\n<p>비즈니스 요구 사항과 솔루션 아키텍처에 기반한 기능 요구 사항과 인프라 요구 사항.<\/p>\n<p><strong>시스템 라이프사이클(2.8%)<\/strong><\/p>\n<p>IT 시스템의 개발, 도입, 운영, 유지보수에 쓰이는 시스템 라이프사이클 관리의 개념과 프레임워크.<\/p>\n<p><strong>Claude API의 작동 방식(6.8%)<\/strong><\/p>\n<p>Claude API의 동작과 작동 방식. 메시지, 도구, 스트리밍, 비전, 사고(thinking), 캐싱, 서드파티 벤더를 통한 Claude 호출, Messages API의 데이터 접근 패턴, 배치 API 사용, 실시간 API와 배치 API 선택의 트레이드오프를 포함한다.<\/p>\n<p><strong>소프트웨어 엔지니어링 기초(7.4%)<\/strong><\/p>\n<p>소프트웨어 엔지니어링의 핵심 원칙과 실천. REST API, JSON, 비동기 프로그래밍, 버전 관리, SDLC로의 통합, 코드 리뷰, 소규모 및 대규모 리팩터링을 포함한다.<\/p>\n<p><strong>Claude 애플리케이션 설계(8.6%)<\/strong><\/p>\n<p>Claude 애플리케이션을 구축할 때의 설계상 고려 사항. 각 인터페이스(Claude Code, Desktop, claude.ai, API, SDK)에서 Claude가 지시를 어떻게 해석하는지, 콘텐츠 경계, 스키마 설계, 세션의 적절한 관리(세션 위생), 플러그인 관리를 포함한다.<\/p>\n<p><strong>구성 관리(4.1%)<\/strong><\/p>\n<p>Claude 시스템 구성 요소의 구성 관리. CLAUDE.md 파일, settings.json, 모델 버전 고정, 프롬프트 버전 관리, 플러그인 의존성을 포함한다.<\/p>", "<h4>분야 3: Claude Code(3.1%)<\/h4>\n<p><strong>Claude Code 조작(3.1%)<\/strong><\/p>\n<p>Claude Code의 핵심 구성 요소(규칙, 스킬, 명령, 에이전트, 에이전트 메모리), 기능(세션 관리, 내장 및 커스텀 슬래시 명령, 헤드리스 모드, 스트리밍 모드, 자동 모드), CLAUDE.md 계층, 저장소 초기화, settings.json 설정.<\/p>", "<h4>분야 4: 평가, 테스트, 디버깅(2.6%)<\/h4>\n<p><strong>디버깅과 오류 처리(2.6%)<\/strong><\/p>\n<p>Claude 애플리케이션의 디버깅과 오류 처리 기법. 오류 유형 식별, 복구 전략 선택, 장애 모드를 찾기 위한 트레이스 분석, 문제 원인이 통합 계층에 있는지 모델 출력에 있는지의 구분을 포함한다.<\/p>", "<h4>분야 5: 모델 선택과 최적화(16.8%)<\/h4>\n<p><strong>LLM 기초(5.2%)<\/strong><\/p>\n<p>LLM에 대한 기본 이해(토큰, 컨텍스트 윈도, 샘플링, 비결정성, 다음 토큰 생성), 모델 옵션(고속 모드, 확장 사고, 적응형 사고, 노력 수준(effort level)), 기본 프롬프트 작성 기법(제로샷, 싱글샷, 멀티샷).<\/p>\n<p><strong>기술 기초(6.1%)<\/strong><\/p>\n<p>AI 애플리케이션 개발을 뒷받침하는 기초 기술 개념. 기본적인 엔지니어링 실천(REST API를 감싸는 SDK와의 통합, WebSocket)을 포함한다.<\/p>\n<p><strong>모델 선택과 트레이드오프(2.7%)<\/strong><\/p>\n<p>작업에 쓸 모델을 고를 때의 Claude 모델 성능(Opus, Sonnet, Haiku 각각의 유스케이스, 적응형 사고 지원), 품질/지연 시간/비용 각 파라미터에 걸친 트레이드오프, 모델 출시 사이에 생기는 호환되지 않는 동작 변경.<\/p>\n<p><strong>비용과 토큰 관리(2.8%)<\/strong><\/p>\n<p>Claude 애플리케이션의 토큰 예산과 비용 관리 기법. 토큰 사용량 추적, 비용 모델링, 비용 최적화를 위한 캐싱 기법(프롬프트 캐싱, 캐시 체크포인트 설정)을 포함한다.<\/p>", "<h4>분야 6: 프롬프트와 컨텍스트 엔지니어링(11.0%)<\/h4>\n<p><strong>컨텍스트 엔지니어링(3.8%)<\/strong><\/p>\n<p>Claude 애플리케이션의 컨텍스트와 메모리 관리 기법. 컨텍스트 윈도 관리, 컨텍스트 드리프트와 비대화 방지(도구 출력 정리, 컴팩션), 서브에이전트나 여러 단계 에이전트 워크플로를 통한 컨텍스트 분리를 포함한다.<\/p>\n<p><strong>프롬프트 엔지니어링(4.6%)<\/strong><\/p>\n<p>Claude용 프롬프트를 작성하고 반복적으로 개선할 때의 프롬프트 엔지니어링 원칙과 방법(지시의 명확성, 퓨샷 예시, 시스템과 사용자 중 어디에 둘지, 출력 제약, 구성 요소 간 프롬프트와 지시의 배치, 반복 개선, 프롬프트 조정, 입력 정제(sanitize)).<\/p>\n<p><strong>출력 처리(2.6%)<\/strong><\/p>\n<p>Claude의 출력을 생성·검증·활용하기 위한 확립된 패턴과 기법. 구조화 출력 패턴, 응답 검증, 방어적 파싱, 자신감 넘치는 출력을 그대로 믿지 않는 태도를 포함한다.<\/p>", "<h4>분야 7: 보안과 안전(8.1%)<\/h4>\n<p><strong>AI 애플리케이션 보안(3.2%)<\/strong><\/p>\n<p>데이터 개인정보와 보안의 모범 사례. 프롬프트 인젝션 인식과 완화, 탈옥(jailbreak) 방어, 신뢰할 수 없는 입력 처리, 데이터 유출 방지, PII 처리, 인증, 인가, 기밀성·개인정보·무결성 확보를 포함한다.<\/p>\n<p><strong>가드레일과 안전한 배포(2.3%)<\/strong><\/p>\n<p>안전하고 책임 있는 배포 실천(콘텐츠 정책, 가드레일 다층화)과 보안 중심 설계 원칙(개인정보, ID 및 접근 관리, 최소 권한).<\/p>\n<p><strong>Claude 훅(1.0%)<\/strong><\/p>\n<p>Claude 애플리케이션 안에서 파괴적인 동작을 막기 위해 가드레일과 안전 제어에 훅을 활용하는 것.<\/p>\n<p><strong>ID, 시크릿, 키 관리(1.6%)<\/strong><\/p>\n<p>Claude 개발 환경과 프로덕션 환경에 걸친 시크릿, 자격 증명, API 키 관리. ID 검증과 인증, 접근 승인과 수준 확인, 인가된 접근의 모니터링을 포함한다.<\/p>", "<h4>분야 8: 도구와 MCP(10.6%)<\/h4>\n<p><strong>도구 구현(4.4%)<\/strong><\/p>\n<p>Claude 애플리케이션에서의 도구 구현 실천. 도구 사용과 함수 호출, 외부 시스템과 연동하기 위한 설정, 도구 설명 작성, 오류 처리, 도구 사용 패턴(에이전트 하네스를 통한 디스패치, 클라이언트 측 도구와 서버 측 도구, 승인 패턴), 도구 세트 구축의 모범 사례를 포함한다.<\/p>\n<p><strong>MCP 서버 개발(2.1%)<\/strong><\/p>\n<p>MCP 서버 개발 실천. 서버 작성, 배포, Claude 애플리케이션과의 통합, MCP의 리소스·도구·프롬프트, 통신 패턴(stdio, 소켓, 클라이언트와 서버)을 포함한다.<\/p>\n<p><strong>에이전트 커스터마이즈(4.1%)<\/strong><\/p>\n<p>특정 유스케이스에 맞는 접근 방식을 골라 적용하기 위한 내장 도구, 커스텀 도구, 스킬, MCP 사이의 트레이드오프.<\/p>"]}, {"n": "7", "title": "준비 방법", "secs": ["<p>필수 과정은 없습니다. Anthropic은 특정 자료가 합격을 보장한다고 약속하지 않습니다. 응시자에게는 실무 경험과 아래 자료를 함께 활용하기를 권합니다.<\/p>\n<ul><li>6장의 시험 블루프린트를 공부하고 각 목표에 비추어 자가 평가한다<\/li><li>Claude API, 모델, 프롬프트 엔지니어링, Claude Code, 스킬, MCP에 관한 Anthropic 공식 문서를 확인한다<\/li><li>API를 사용하고, 하나 이상의 도구를 통합하고, 기본적인 프롬프트·컨텍스트 엔지니어링을 적용하고, 간단한 보안과 평가 실천을 포함한 Claude 애플리케이션을 적어도 하나 구축해 운영한다<\/li><li>개발자에게 요구되는 능력을 실천한다: 프롬프트와 시스템 지시 작성, 에이전트와 워크플로 구축, Claude Code 설정, 토큰과 비용 관리, 가드레일 구현, 커스텀 도구나 MCP 서버 작성<\/li><li>8장의 샘플 문제를 풀며 출제 스타일에 익숙해진다<\/li><\/ul>"]}, {"n": "8", "title": "샘플 문제", "secs": ["<p>이 예제는 시험의 출제 스타일과 인지 수준을 보여 주기 위한 것입니다. 실제 시험 문제 은행에서 뽑은 것이 아닙니다. 정답과 해설은 문제 뒤에 있습니다.<\/p>", "<h3>샘플 1 · 분야 2 — 애플리케이션과 통합<\/h3>\n<p>한 개발자가 긴급하지 않은 분석 보고서를 만들기 위해 문서 10,000건을 야간에 처리해야 합니다. 가장 중요한 것은 비용이며, 결과는 다음 날 아침까지 필요하지 않습니다. 이 요구 사항에 가장 적합한 접근 방식은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 최대한 빨리 끝나도록 모든 요청을 Messages API로 동기식 병렬 전송한다.<\/li><li>B. Message Batches API를 사용한다. 이 API는 대규모 비동기 워크로드를 24시간 창 안에서 더 낮은 비용으로 처리한다.<\/li><li>C. 비용을 최소화하기 위해 동기 호출의 max_tokens를 낮춘다.<\/li><li>D. 출력 품질과 관계없이 사용할 수 있는 가장 작은 모델로 바꾼다.<\/li><\/ul>", "<h3>샘플 2 · 분야 7 — 보안과 안전<\/h3>\n<p>Claude를 활용한 에이전트가 최종 사용자가 보낸 웹 페이지를 요약합니다. 어떤 페이지에, 그때까지의 지시를 무시하고 시스템 프롬프트를 공개하라고 모델에 지시하는 숨은 텍스트가 들어 있습니다. 가장 효과적인 완화책은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 모델의 temperature를 올려 동작을 예측하기 어렵게 만든다.<\/li><li>B. 가져온 페이지의 콘텐츠를 신뢰할 수 없는 입력으로 다루어 신뢰할 수 있는 지시와 분리해 두고, 가드레일이나 훅을 사용해 주입된 지시가 민감한 동작을 일으키지 못하게 한다.<\/li><li>C. 악의적인 지시를 넣지 말라고 사용자에게 요청하는 문장을 시스템 프롬프트에 추가한다.<\/li><li>D. 지시를 더 확실히 따르는 더 큰 모델로 바꾼다.<\/li><\/ul>", "<h3>샘플 3 · 분야 8 — 도구와 MCP<\/h3>\n<p>한 팀이 REST API로 공개된 사내 재고 서비스를 Claude에서 호출할 수 있게 해야 합니다. 이 기능은 여러 Claude 애플리케이션에서 재사용할 수 있고, 특정 애플리케이션에 의존하지 않고 유지보수할 수 있기를 원합니다. 가장 적합한 접근 방식은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 각 애플리케이션의 시스템 프롬프트에 재고 로직을 하드코딩한다.<\/li><li>B. 재고 작업을 도구로 공개하는 MCP 서버를 구축해, 여러 Claude 애플리케이션이 연결할 수 있게 한다.<\/li><li>C. 요청할 때마다 현재 재고 데이터를 컨텍스트 윈도에 붙여 넣는다.<\/li><li>D. 내장 도구는 어떤 사내 REST API에도 접근할 수 있으므로 내장 도구를 사용한다.<\/li><\/ul>", "<h3>정답과 해설<\/h3>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>샘플 1: B.<\/strong> Message Batches API는 지연을 허용할 수 있는 대량 워크로드를 더 낮은 비용으로 처리하도록 설계되어, 야간에 돌리는 긴급하지 않은 작업에 적합합니다. 요청을 동기식으로 병렬 전송해도(A) 토큰당 비용은 내려가지 않습니다. max_tokens를 낮추는 것(C)이나 무작정 모델을 작게 하는 것(D)은 배치와 실시간 사이의 트레이드오프를 다루지 않습니다.<\/p><\/details>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>샘플 2: B.<\/strong> 프롬프트 인젝션에는 신뢰할 수 없는 콘텐츠를 신뢰할 수 있는 지시와 분리하고, 최소 권한 가드레일을 적용해 주입된 텍스트가 민감한 도구를 호출하지 못하게 하는 방식으로 대응합니다. temperature(A)는 인젝션과 관계가 없습니다. 정중하게 부탁하는 것(C)은 강제력 있는 통제가 아닙니다. 지시를 더 충실히 따르는 모델(D)은 영향을 덜 받기는커녕 오히려 더 받기 쉬울 수 있습니다.<\/p><\/details>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>샘플 3: B.<\/strong> MCP 서버는 여러 Claude 애플리케이션이 공유하고 독립적으로 유지보수할 수 있는 재사용 가능한 도구를 공개합니다. 로직을 프롬프트에 하드코딩하는 것(A)은 재사용도 유지보수도 할 수 없습니다. 데이터를 붙여 넣는 것(C)은 실시간 접근이 되지 않고 컨텍스트를 낭비합니다. 내장 도구(D)가 임의의 사내 API에 자동으로 접근할 수 있는 것은 아닙니다.<\/p><\/details>"]}, {"n": "9", "title": "시험 채점 방식", "secs": ["<p>Claude Certified Developer – Foundations 시험은 준거 참조형(基準準拠型) 평가입니다. 각 응시자는 다른 응시자와의 비교가 아니라 고정된 달성 기준에 따라 측정됩니다. 다른 응시자의 일정 비율을 웃도는 것이 아니라, 블루프린트에 정의된 지식과 기술을 보여 줌으로써 합격합니다.<\/p>\n<p><strong>합격 기준.<\/strong> 합격 점수는 공식적인 기준 설정 연구를 통해 정해졌습니다. 이 연구에서는 훈련받은 해당 분야 전문가들이 최소 역량을 갖춘 응시자에게 기대되는 성적 수준을 판정했습니다. 점수는 100~1,000 척도로 보고되며 합격선(컷 스코어)은 720입니다.<\/p>\n<p><strong>결과 통지.<\/strong> 결과는 합격 또는 불합격 상태와 100~1,000의 환산 점수로 보고됩니다. 성적표에는 각 내용 분야에서 정답을 맞힌 문제의 비율도 표시됩니다. 섹션별 백분율은 자신의 성적을 이해하는 데 도움을 주기 위해 제공되며, 합격 여부 판정에는 사용되지 않습니다. 합격 여부는 총 환산 점수로 판정됩니다.<\/p>"]}, {"n": "10", "title": "등록 및 일정 예약", "secs": ["<p>등록과 일정 예약은 Anthropic Partner Academy와 Pearson VUE를 통해 진행합니다.<\/p>\n<ol><li>Anthropic Partner Academy에서 응시할 시험의 자격증 페이지로 이동해 시험 정보를 확인합니다.<\/li><li>등록 전에 시험 가이드를 다운로드하고 「자격증 이용 약관」(Certification Terms and Conditions)과 「자격 시험 정책」(Certification Exam Policy)을 확인합니다.<\/li><li>시험에 등록하고 결제를 완료합니다. 결제 화면에 표시되는 응시료에는 본인의 파트너 등급에 적용되는 할인이 반영되어 있습니다.<\/li><li>확인 안내에 따라 Pearson VUE 계정을 만들고, 로그인해 시험 세션을 예약합니다.<\/li><li>가능한 날짜를 고르고 온라인 감독 또는 Pearson 시험 센터 중 하나를 선택합니다. 시험은 Pearson VUE가 시행합니다.<\/li><li>예약 시각 24시간 전까지는 취소하거나 일정을 변경할 수 있습니다. 24시간 이내에 한 변경은 응시료가 환불되지 않습니다.<\/li><\/ol>"]}, {"n": "11", "title": "시험 정책", "secs": ["", "<h3>신분증<\/h3>\n<p>시험 당일에는 유효 기간 내의 정부 발급 사진 신분증을 제시해야 합니다. 신분증의 이름은 등록할 때의 이름과 정확히 일치해야 합니다. 등록한 이름을 수정해야 하면 시험을 예약하기 전에 certifications-support@anthropic.com으로 연락하십시오.<\/p>", "<h3>응시 편의 제공<\/h3>\n<p>장애나 필요를 증명하는 서류가 있는 응시자는 관련 법률에 따라 합리적인 응시 편의를 받을 수 있습니다. 응시 편의는 시험을 예약하기 전에 신청해 Pearson VUE의 승인을 받아야 합니다. 신청이 승인될 때까지 예약하지 마십시오. 응시 편의는 pearsonvue.com/us/en/test-takers/accommodations에서 신청하십시오.<\/p>", "<h3>재응시 정책<\/h3>\n<p>합격하지 못한 응시자는 정해진 대기 기간 후에 재응시할 수 있습니다. 대기 기간은 불합격 횟수가 늘수록 길어져, 첫 번째 후 14일, 두 번째 후 30일, 세 번째 후 90일입니다. 같은 시험은 연속된 임의의 12개월 기간 안에 4회까지 응시할 수 있습니다. 상한은 시험별로 적용되므로, 한 시험에 불합격했다고 해서 다른 시험에 등록하지 못하게 되지는 않습니다. 응시료는 응시할 때마다 필요합니다.<\/p>", "<h3>미응시 및 지각<\/h3>\n<p>예약한 시험에 나타나지 않거나 허용된 지각 시간을 넘겨 도착한 응시자는 응시료가 환불되지 않으며 다시 등록해야 합니다. 취소 및 일정 변경 기한은 10장에 나와 있습니다.<\/p>"]}, {"n": "12", "title": "시험 당일 진행과 응시 규칙", "secs": ["<p>시험은 표준화되고 보안이 확보된 감독 환경에서 시행됩니다. 온라인으로 응시하든 Pearson VUE 시험 센터에서 응시하든, 자격을 보유한 모든 사람을 위해 자격의 신뢰성을 지키고자 다음 규칙이 적용됩니다.<\/p>\n<p>시험 중에는 다음을 지켜야 합니다.<\/p>\n<ul><li>온라인 응시 시, 세션 내내 감독관과 웹캠의 시야 안에 머문다<\/li><li>작업 공간에 메모, 책, 전화, 보조 모니터, 기타 물품을 두지 않는다<\/li><li>시험 중 다른 누구와도 연락하거나 대화하지 않는다<\/li><li>어떤 형태로든 시험 내용을 기록, 복사, 촬영, 복제하지 않는다<\/li><\/ul>\n<p>반입 금지 물품에는 휴대전화, 스마트워치, 헤드폰, 학습 자료, 모든 녹음·녹화 장치가 포함됩니다. 감독관이 제공하는 메모지처럼 반입이 허용되는 물품이 있다면 Pearson VUE가 지정합니다.<\/p>\n<p><strong>부정행위의 결과.<\/strong> 커닝, 금지된 자료에 접근하려는 시도, 시험 내용 공개가 있으면 결과 무효화, 자격 취소, 향후 시험 응시 금지로 이어질 수 있습니다.<\/p>"]}, {"n": "13", "title": "기밀 유지 및 비밀유지 계약", "secs": ["<p>시험이 시작되기 전에 기밀 유지 및 비밀유지 계약에 동의해야 합니다. 동의하면 문제, 선택지, 시나리오를 포함한 모든 시험 내용이 Anthropic의 기밀 정보이자 독점 재산이며, 그 어떤 부분도 공개, 복제, 배포하지 않겠다는 데 동의한 것이 됩니다. 계약에 동의하지 않으면 시험 세션이 종료되며 환불되지 않습니다.<\/p>"]}, {"n": "14", "title": "자격 유지와 재인증", "secs": ["<p>Claude Certified Developer – Foundations 자격은 수여일로부터 12개월간 유효합니다. 기반 기술이 빠르게 발전하기 때문에, 보유자가 최신 지식을 유지할 수 있도록 자격에 기한을 두었습니다.<\/p>\n<p>기한 안에 갱신하려면 인증 이후의 변경 사항을 확인하고 Anthropic Partner Academy에서 무료 비감독 평가를 완료합니다. 기한 내 갱신에는 비용이 들지 않습니다. 자격이 만료되면 인증 상태를 되찾기 위해 정가 응시료로 전체 시험을 다시 응시해야 합니다.<\/p>\n<p>시험 내용이 크게 바뀐 경우, Anthropic은 자격 보유자에게 재인증을 위해 갱신 평가 대신 전체 시험 재응시를 요구할 수 있습니다.<\/p>\n<p>자격 보유자에게는 12장에 설명된 응시 규칙이 계속 적용됩니다.<\/p>"]}, {"n": "15", "title": "응시자 지원, 이의 제기, 개인정보", "secs": ["", "<h3>지원<\/h3>\n<p>등록한 이름을 수정하려면 certifications-support@anthropic.com으로 연락하십시오. 등록, 예약, 응시 편의, 결과 등 그 밖의 모든 문의는 Pearson VUE 지원(pearsonvue.com/us/en/anthropic.html)으로 하십시오.<\/p>", "<h3>이의 제기 및 불만<\/h3>\n<p>결정에 대해서는 통지를 받은 날로부터 14일 이내에 이의를 제기할 수 있습니다. 시험 결과에 관한 우려는 시험일로부터 14일 이내입니다. 이의 제기는 위 링크의 Pearson VUE 지원으로 제출하십시오. 이의 제기는 프로그램의 이의 제기 정책에 따라 심사됩니다. 기준 설정 결과와 개별 시험 문제의 내용은 이의 제기 대상이 아닙니다.<\/p>", "<h3>개인정보<\/h3>\n<p>등록 및 응시 과정에서 수집되는 개인 데이터는 Anthropic의 개인정보 처리방침, Pearson VUE의 개인정보 처리방침, 관련 데이터 보호 법률에 따라 처리됩니다.<\/p>"]}, {"n": "16", "title": "문서 관리", "secs": ["<table><thead><tr><th>버전<\/th><th>변경 요약<\/th><th>날짜<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>초판 발행<\/td><td>2026년 7월<\/td><\/tr><\/tbody><\/table>"]}]}, "ja": {"title": "Claude Certified Developer – Foundations 試験ガイド — 日本語版（公式）", "note": ["出典：Anthropic公式「Claude Certified Developer – Foundations 試験ガイド」日本語版PDF（バージョン1.0 · 発効：2026年7月 · 試験コード：CCDV-F）。PDFから本文をそのまま転記し、見出しと表のみMarkdownに整形しています。", "原文冒頭：「本ガイドは予告なく変更されることがあります。」"], "ch": [{"n": "1", "title": "この認定資格について", "secs": ["<p>Claude Certified Developer – Foundations認定資格は、AnthropicのClaudeプラットフォームを使用して、本番環境レベルのアプリケーション、エージェント、ワークフローを基礎レベルで構築、統合、リリースできることを証明するものです。この認定資格は、Claudeの機能と本番運用可能なアプリケーションとの橋渡しを担い、API統合、エージェントとツールの構築、プロンプトとコンテキストのエンジニアリング、評価、セキュリティ、モデル選択を通じて、技術要件を実際に動作するシステムに落とし込む技術専門職を対象としています。<\/p>\n<p>本ガイドは、受験の準備をする受験者にとっての正式な参照資料です。資格の目的、対象者、試験形式とコンテンツのブループリント、採点、ポリシー、およびすべての受験者が同意する受験規則について説明します。試験を予約する前に、全文をお読みください。<\/p>"]}, {"n": "2", "title": "資格の目的と価値", "secs": ["<p>Claude Certified Developer – Foundations認定資格の主な目的は、Claudeベースのアプリケーションを基礎レベルで適切に構築するために必要な知識、スキル、能力について、独立した評価を提供することです。この資格を取得することで、保有者がClaudeを活用したシステムの構築、統合、リリースを自ら主導できること、またはそれらに大きく貢献できることを、雇用主、顧客、チームに示すことができます。<\/p>\n<p>この資格を取得した受験者は、以下の領域で知識を効果的に適用できることを証明できます。<\/p>\n<ul><li>Claude Agent SDK、エージェントフレームワーク、カスタムエージェントループを使用したエージェントとワークフローの構築<\/li><li>API、クライアントSDK、サードパーティ統合を通じた、アプリケーションコードへのClaudeの統合（ストリーミング、エラー処理、複数形式の入力を含む）<\/li><li>各種インターフェースでのClaude Codeの操作、Claudeのスキルの作成、CLAUDE.md、settings.json、プラグインの設定<\/li><li>モデルの動作を制御し、コンテキストドリフトを防ぐための、効果的なプロンプトの作成とコンテキストエンジニアリング手法の適用<\/li><li>評価の設計と実行、トレース分析による障害モードのデバッグ、構造化出力の検証、本番環境での品質の監視<\/li><li>コストとレイテンシを最適化するための、Claudeモデルのティアの選択と、トークン、キャッシング、バッチ処理の管理<\/li><li>プロンプトインジェクションや破壊的なアクションを防ぐための、セキュアバイデザインの原則の適用とフックによるガードレールの実装<\/li><li>組み込みツール、カスタムツール、スキル、MCPの間のトレードオフを考慮した、カスタムツール、関数スキーマ、MCPサーバーの構築<\/li><\/ul>"]}, {"n": "3", "title": "対象者", "secs": ["<p>この認定資格は、大規模言語モデル（LLM）、特にAnthropicのClaudeプラットフォームを使用して、本番環境レベルのAIソリューションを構築、統合、リリースする技術専門職を対象としています。主な対象者は、ビジネス要件と技術的な実装が交わる領域で業務を行う、AIおよび機械学習のエンジニア、テクニカルリード、シニアソフトウェアエンジニアです。<\/p>\n<p>こうした専門職は通常、ソフトウェアエンジニアリングで1～5年の経験を持ち、加えてClaudeまたは同等のLLMベースのシステムで6か月以上の実務経験を持っています。ソフトウェア開発に関する確かな基礎知識と応用スキルを備えており、Claude Agent SDKとエージェントフレームワークを使用したエージェントとワークフローの構築、Application Programming Interface（API）とクライアントSoftware Development Kit（SDK）によるClaudeの統合、コードベースのモダナイゼーションのためのClaude Codeの操作、効果的なプロンプトの作成とコンテキストエンジニアリングの適用、評価の設計と実行、カスタムツールとModel Context Protocol（MCP）サーバーの構築ができます。モデル選択とツールの種類に関するトレードオフを理解し、技術要件を満たすために適切なパターンを適用できます。Python、TypeScript、またはその両方に習熟し、REST APIとCommand Line Interface（CLI）ツールを使いこなし、LLMの基礎、エージェント、コンテキスト管理、MCPについて実務的な理解を持っています。<\/p>\n<p>この認定資格は、Claudeベースのアプリケーションの非技術系ユーザーやライトユーザー、または実務的なソフトウェア開発経験のない方を対象としていません。また、アプリケーション開発に関するより広い責任を伴わず、プロンプトの作成やその他の個別のタスクのみに限定された役割も対象外です。<\/p>"]}, {"n": "4", "title": "最低限の能力を備えた受験者のプロファイル", "secs": ["<p>この試験は、合格基準を最低限満たす受験者像（MQC）を基準に設計されています。MQCとは、Claudeを活用したアプリケーション、エージェント、ワークフローを構築、統合、リリースする、実務に携わる技術者です。Claudeの機能と本番運用可能なアプリケーションとの橋渡しを担い、技術要件を実際に動作するアプリケーションに落とし込みます。<\/p>\n<p>MQCは、ソフトウェア開発に関する確かな基礎知識と応用スキルを備えています。これには、Claude Agent SDKとエージェントフレームワークを使用したエージェントとワークフローの構築、APIとクライアントSDKによるClaudeの統合、コードベースのモダナイゼーションのためのClaude Codeの操作、効果的なプロンプトの作成とコンテキストエンジニアリングの適用、評価の設計と実行、カスタムツールとMCPサーバーの構築を行う能力が含まれます。モデル選択（コスト、レイテンシ、性能）とツールの種類（組み込み、カスタム、スキル、MCP）に関するトレードオフを理解し、技術要件を満たすために適切なパターンを適用できます。<\/p>", "<h3>推奨される経験<\/h3>\n<ul><li>ソフトウェアエンジニアリングでの1～5年の経験<\/li><li>Claudeまたは同等のLLMベースのシステムでの6か月以上の実務経験<\/li><li>Python、TypeScript、またはその両方の習熟<\/li><li>REST APIとCLIツールを使いこなせること<\/li><li>LLMの基礎、エージェント、コンテキスト管理、MCPについての実務的な理解<\/li><\/ul>\n<p><strong>前提条件：<\/strong>この試験を受験するために必須となる前提条件やコースはありません。上記の経験は推奨されるものであり、必須ではありません。資格は試験の成績のみに基づいて授与されます。<\/p>"]}, {"n": "5", "title": "試験の概要", "secs": ["<table><thead><tr><th>項目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>資格<\/td><td>Claude Certified Developer – Foundations<\/td><\/tr><tr><td>試験コード<\/td><td>CCDV-F<\/td><\/tr><tr><td>問題数<\/td><td>53<\/td><\/tr><tr><td>出題形式<\/td><td>択一式および複数選択式の問題。各問題に、選択する解答の数が明記されています<\/td><\/tr><tr><td>制限時間<\/td><td>120分<\/td><\/tr><tr><td>実施方法<\/td><td>監督付き：プログラムのポリシーに従い、オンライン監督付きまたはテストセンター、あるいはその両方<\/td><\/tr><tr><td>合格点<\/td><td>100–1,000のスケールでスケールスコア720<\/td><\/tr><tr><td>受験料<\/td><td>$125 USD<\/td><\/tr><tr><td>有効期間<\/td><td>資格が授与された日から12か月<\/td><\/tr><tr><td>結果の通知<\/td><td>合格／不合格とスケールスコア（100–1,000）。スコアレポートには分野別の正答率も記載されます<\/td><\/tr><\/tbody><\/table>"]}, {"n": "6", "title": "試験内容の概要（ブループリント）", "secs": ["<p>試験ブループリントは、測定対象となるコンテンツ分野とスキル、および試験における各分野のおおよその配点比率を定めたものです。配点比率は、職務タスク分析とコンテンツ妥当性調査によって判定された、適切な業務遂行に対する各分野の相対的な重要度を反映しています。パーセンテージは、採点対象の問題のうち各分野から出題されるおおよその割合を示します。<\/p>\n<table><thead><tr><th>分野<\/th><th>内容分野<\/th><th>配点比率<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>エージェントとワークフロー<\/td><td>14.7%<\/td><\/tr><tr><td>2<\/td><td>アプリケーションと統合<\/td><td>33.1%<\/td><\/tr><tr><td>3<\/td><td>Claude Code<\/td><td>3.1%<\/td><\/tr><tr><td>4<\/td><td>評価、テスト、デバッグ<\/td><td>2.6%<\/td><\/tr><tr><td>5<\/td><td>モデルの選択と最適化<\/td><td>16.8%<\/td><\/tr><tr><td>6<\/td><td>プロンプトとコンテキストのエンジニアリング<\/td><td>11.0%<\/td><\/tr><tr><td>7<\/td><td>セキュリティと安全性<\/td><td>8.1%<\/td><\/tr><tr><td>8<\/td><td>ツールとMCP<\/td><td>10.6%<\/td><\/tr><tr><td>合計<\/td><td><\/td><td>100%<\/td><\/tr><\/tbody><\/table>", "<h3>分野別の詳細な目標<\/h3>\n<p>以下の各分野には、試験問題の作成基準となるスキルを記載しています。スキルの説明は、測定対象となる知識と能力をまとめたものです。スキルの配点比率は、試験全体に占める各スキルの割合を示します。<\/p>", "<h4>分野1：エージェントとワークフロー（14.7%）<\/h4>\n<p><strong>エージェントアーキテクチャ（4.5%）<\/strong><\/p>\n<p>エージェントとワークフローのアーキテクチャに関する原則、パターン、トレードオフ。ワークフローとエージェントのどちらを使用するかの判断基準、マネージャー／スーパーバイザー階層の構造、タスク実行の改善におけるサブエージェントの役割を含む。<\/p>\n<p><strong>Claudeによるエージェントの構築（5.3%）<\/strong><\/p>\n<p>Claudeエージェントを構築するための方法、ツール、プラットフォーム。Claude Agent SDK、カスタムエージェントループとハーネス、マネージドエージェントのデプロイモデル（セルフホストとAnthropicホスト）、決定論的なアクションのためのフックを含む。<\/p>\n<p><strong>エージェントのパターンとフレームワーク（4.9%）<\/strong><\/p>\n<p>複数ステップのタスク向けのエージェントとワークフローを構築するための、一般的なエージェント設計パターン（ツール使用ループ、サブエージェント、メモリ、コンテキストウィンドウの管理）と、エージェント向け抽象化フレームワーク（例：Strands、LangGraph、PydanticAI）。<\/p>", "<h4>分野2：アプリケーションと統合（33.1%）<\/h4>\n<p><strong>要件の理解（3.4%）<\/strong><\/p>\n<p>ビジネス要件とソリューションアーキテクチャに基づく機能要件とインフラストラクチャ要件。<\/p>\n<p><strong>システムライフサイクル（2.8%）<\/strong><\/p>\n<p>ITシステムの開発、導入、運用、保守に使用されるシステムライフサイクル管理の概念とフレームワーク。<\/p>\n<p><strong>Claude APIの仕組み（6.8%）<\/strong><\/p>\n<p>Claude APIの動作と仕組み。メッセージ、ツール、ストリーミング、ビジョン、思考、キャッシング、サードパーティベンダー経由でのClaudeの呼び出し、Messages APIのデータアクセスパターン、バッチAPIの使用、リアルタイムAPIとバッチAPIの選択におけるトレードオフを含む。<\/p>\n<p><strong>ソフトウェアエンジニアリングの基礎（7.4%）<\/strong><\/p>\n<p>ソフトウェアエンジニアリングの中核となる原則と実践。REST API、JSON、非同期プログラミング、バージョン管理、SDLCへの統合、コードレビュー、小規模および大規模なリファクタリングを含む。<\/p>\n<p><strong>Claudeアプリケーションの設計（8.6%）<\/strong><\/p>\n<p>Claudeアプリケーションを構築する際の設計上の考慮事項。各インターフェース（Claude Code、Desktop、claude.ai、API、SDK）でClaudeが指示をどのように解釈するか、コンテンツの境界、スキーマ設計、セッションの適切な管理（セッションハイジーン）、プラグイン管理を含む。<\/p>\n<p><strong>構成管理（4.1%）<\/strong><\/p>\n<p>Claudeのシステムコンポーネントの構成管理。CLAUDE.mdファイル、settings.json、モデルバージョンの固定、プロンプトのバージョン管理、プラグインの依存関係を含む。<\/p>", "<h4>分野3：Claude Code（3.1%）<\/h4>\n<p><strong>Claude Codeの操作（3.1%）<\/strong><\/p>\n<p>Claude Codeのコアコンポーネント（ルール、スキル、コマンド、エージェント、エージェントメモリ）、機能（セッション管理、組み込みおよびカスタムのスラッシュコマンド、ヘッドレスモード、ストリーミングモード、自動モード）、CLAUDE.mdの階層、リポジトリの初期化、settings.jsonの設定。<\/p>", "<h4>分野4：評価、テスト、デバッグ（2.6%）<\/h4>\n<p><strong>デバッグとエラー処理（2.6%）<\/strong><\/p>\n<p>Claudeアプリケーションのデバッグとエラー処理の手法。エラーの種類の特定、復旧戦略の選択、障害モードを特定するためのトレース分析、統合レイヤーとモデル出力のどちらに問題の原因があるかの切り分けを含む。<\/p>", "<h4>分野5：モデルの選択と最適化（16.8%）<\/h4>\n<p><strong>LLM の基礎（5.2%）<\/strong><\/p>\n<p>LLMの基本的な理解（トークン、コンテキストウィンドウ、サンプリング、非決定性、次トークン生成）、モデルのオプション（高速モード、拡張思考、適応型思考、エフォートレベル）、基本的なプロンプト作成手法（ゼロショット、シングルショット、マルチショット）。<\/p>\n<p><strong>技術的な基礎（6.1%）<\/strong><\/p>\n<p>AIアプリケーション開発を支える基礎的な技術概念。基本的なエンジニアリングの実践（REST APIをラップするSDKとの統合、WebSocket）を含む。<\/p>\n<p><strong>モデルの選択とトレードオフ（2.7%）<\/strong><\/p>\n<p>タスクに使用するモデルを選択する際の、Claudeモデルの性能（Opus、Sonnet、Haikuそれぞれのユースケース、適応型思考のサポート）、品質／レイテンシ／コストの各パラメータにわたるトレードオフ、モデルのリリース間で生じる互換性のない動作変更。<\/p>\n<p><strong>コストとトークンの管理（2.8%）<\/strong><\/p>\n<p>Claudeアプリケーションのトークン予算とコスト管理の手法。トークン使用量の追跡、コストモデリング、コスト最適化のためのキャッシング手法（プロンプトキャッシング、キャッシュのチェックポイント設定）を含む。<\/p>", "<h4>分野6：プロンプトとコンテキストのエンジニアリング（11.0%）<\/h4>\n<p><strong>コンテキストエンジニアリング（3.8%）<\/strong><\/p>\n<p>Claudeアプリケーションのコンテキストとメモリの管理手法。コンテキストウィンドウの管理、コンテキストのドリフトと肥大化の防止（ツール出力の刈り込み、コンパクション）、サブエージェントまたは複数ステップのエージェントワークフローによるコンテキストの分離を含む。<\/p>\n<p><strong>プロンプトエンジニアリング（4.6%）<\/strong><\/p>\n<p>Claude向けのプロンプトを作成し、反復的に改善する際の、プロンプトエンジニアリングの原則と方法（指示の明確さ、少数ショットの例、システムとユーザーのどちらに配置するか、出力の制約、コンポーネント間でのプロンプトと指示の配置、反復的な改良、プロンプトの調整、入力のサニタイズ）。<\/p>\n<p><strong>出力の処理（2.6%）<\/strong><\/p>\n<p>Claudeの出力を生成、検証、利用するための確立されたパターンと手法。構造化出力のパターン、応答の検証、防御的なパース、自信に満ちた出力を鵜呑みにしない姿勢を含む。<\/p>", "<h4>分野7：セキュリティと安全性（8.1%）<\/h4>\n<p><strong>AIアプリケーションのセキュリティ（3.2%）<\/strong><\/p>\n<p>データのプライバシーとセキュリティのベストプラクティス。プロンプトインジェクションの認識と緩和、ジェイルブレイクへの防御、信頼できない入力の取り扱い、データ漏えいの防止、PIIの取り扱い、認証、認可、機密性、プライバシー、完全性の確保を含む。<\/p>\n<p><strong>ガードレールと安全なデプロイ（2.3%）<\/strong><\/p>\n<p>安全で責任あるデプロイの実践（コンテンツポリシー、ガードレールの多層化）と、セキュアバイデザインの原則（プライバシー、IDとアクセスの管理、最小権限）。<\/p>\n<p><strong>Claudeのフック（1.0%）<\/strong><\/p>\n<p>Claudeアプリケーション内での破壊的なアクションを防ぐための、ガードレールと安全制御へのフックの活用。<\/p>\n<p><strong>ID、シークレット、キーの管理（1.6%）<\/strong><\/p>\n<p>Claudeの開発環境と本番環境にわたるシークレット、認証情報、APIキーの管理。IDの検証と認証、アクセスの承認とレベルの確認、認可されたアクセスの監視を含む。<\/p>", "<h4>分野8：ツールとMCP（10.6%）<\/h4>\n<p><strong>ツールの実装（4.4%）<\/strong><\/p>\n<p>Claudeアプリケーションにおけるツール実装の実践。ツール使用と関数呼び出し、外部システムと連携するための設定、ツールの説明の記述、エラー処理、ツール使用のパターン（エージェントハーネスによるディスパッチ、クライアント側ツールとサーバー側ツール、承認パターン）、ツールセット構築のベストプラクティスを含む。<\/p>\n<p><strong>MCPサーバーの開発（2.1%）<\/strong><\/p>\n<p>MCPサーバー開発の実践。サーバーの作成、デプロイ、Claudeアプリケーションとの統合、MCPのリソース、ツール、プロンプト、通信パターン（stdio、ソケット、クライアントとサーバー）を含む。<\/p>\n<p><strong>エージェントのカスタマイズ（4.1%）<\/strong><\/p>\n<p>特定のユースケースに適したアプローチを選択して適用するための、組み込みツール、カスタムツール、スキル、MCPの間のトレードオフ。<\/p>"]}, {"n": "7", "title": "準備の方法", "secs": ["<p>必修のコースはありません。Anthropicは、特定のリソースが合格を保証するものであるとは約束しません。受験者には、実践的な経験と以下のリソースを組み合わせることをお勧めします。<\/p>\n<ul><li>セクション6の試験ブループリントを学習し、各目標に照らして自己評価する<\/li><li>Claude API、モデル、プロンプトエンジニアリング、Claude Code、スキル、MCPに関するAnthropicの公式ドキュメントを確認する<\/li><li>APIを利用し、1つ以上のツールを統合し、基本的なプロンプトとコンテキストのエンジニアリングを適用し、簡単なセキュリティと評価の実践を含むClaudeアプリケーションを、少なくとも1つ構築して運用する<\/li><li>デベロッパーに求められる能力を実践する：プロンプトとシステム指示の作成、エージェントとワークフローの構築、Claude Codeの設定、トークンとコストの管理、ガードレールの実装、カスタムツールまたはMCPサーバーの作成<\/li><li>セクション8のサンプル問題を解き、出題スタイルに慣れる<\/li><\/ul>"]}, {"n": "8", "title": "サンプル問題", "secs": ["<p>これらの例題は、試験の出題スタイルと認知レベルを示すものです。実際の試験の問題バンクから抜粋したものではありません。正解と解説は問題の後に記載しています。<\/p>", "<h3>サンプル1 · 分野2 — アプリケーションと統合<\/h3>\n<p>ある開発者は、緊急性のない分析レポートを作成するために、10,000件のドキュメントを夜間に処理する必要があります。最も重視するのはコストであり、結果は翌朝まで必要ありません。この要件に最も適したアプローチはどれですか。<\/p>\n<ul class=\"opts\"><li>A. できるだけ早く完了するように、すべてのリクエストをMessages API経由で同期的に並列送信する。<\/li><li>B. Message Batches APIを使用する。このAPIは、大規模な非同期ワークロードを24時間の枠内で、より低いコストで処理する。<\/li><li>C. コストを最小限に抑えるために、同期呼び出しのmax_tokensを下げる。<\/li><li>D. 出力品質にかかわらず、利用可能な最小のモデルに切り替える。<\/li><\/ul>", "<h3>サンプル2 · 分野7 — セキュリティと安全性<\/h3>\n<p>Claudeを活用したエージェントが、エンドユーザーから送信されたWebページを要約します。あるページに、それまでの指示を無視してシステムプロンプトを開示するようモデルに指示する隠しテキストが含まれています。最も効果的な緩和策はどれですか。<\/p>\n<ul class=\"opts\"><li>A. モデルのtemperatureを上げて、動作を予測しにくくする。<\/li><li>B. 取得したページのコンテンツを信頼できない入力として扱い、信頼できる指示とは分離しておき、ガードレールまたはフックを使用して、注入された指示が機密性の高いアクションを引き起こせないようにする。<\/li><li>C. 悪意のある指示を含めないようユーザーに求める一文をシステムプロンプトに追加する。<\/li><li>D. 指示により確実に従う、より大きなモデルに切り替える。<\/li><\/ul>", "<h3>サンプル3 · 分野8 — ツールとMCP<\/h3>\n<p>あるチームは、REST APIとして公開されている社内の在庫サービスをClaudeから呼び出せるようにする必要があります。この機能は複数のClaudeアプリケーションで再利用でき、特定のアプリケーションに依存せずに保守できるようにしたいと考えています。最も適したアプローチはどれですか。<\/p>\n<ul class=\"opts\"><li>A. 各アプリケーションのシステムプロンプトに在庫ロジックをハードコードする。<\/li><li>B. 在庫操作をツールとして公開するMCPサーバーを構築し、複数のClaudeアプリケーションが接続できるようにする。<\/li><li>C. リクエストのたびに、現在の在庫データをコンテキストウィンドウに貼り付ける。<\/li><li>D. 組み込みツールはどの社内REST APIにもアクセスできるため、組み込みツールを利用する。<\/li><\/ul>", "<h3>正解と解説<\/h3>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>サンプル1： B.<\/strong> Message Batches APIは、レイテンシを許容できる大量のワークロードをより低いコストで処理するために設計されており、夜間に実行する緊急性のないジョブに適しています。リクエストを同期的に並列送信しても（A）、トークンあたりのコストは下がりません。max_tokensを下げること（C）や、やみくもにモデルを小さくすること（D）は、バッチとリアルタイムのトレードオフに対処していません。<\/p><\/details>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>サンプル2： B.<\/strong> プロンプトインジェクションへの対処は、信頼できないコンテンツを信頼できる指示から分離し、最小権限のガードレールを適用して、注入されたテキストが機密性の高いツールを呼び出せないようにすることで行います。temperature（A）はインジェクションとは無関係です。丁寧に依頼すること（C）は、強制力のある制御ではありません。指示により忠実に従うモデル（D）は、影響を受けにくくなるどころか、かえって受けやすくなる可能性があります。<\/p><\/details>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>サンプル3： B.<\/strong> MCPサーバーは、複数のClaudeアプリケーションで共有でき、独立して保守できる再利用可能なツールを公開します。ロジックをプロンプトにハードコードすること（A）は、再利用も保守もできません。データを貼り付けること（C）は、ライブアクセスが得られず、コンテキストを浪費します。組み込みツール（D）は、任意の社内APIに自動的にアクセスできるわけではありません。<\/p><\/details>"]}, {"n": "9", "title": "試験の採点方法", "secs": ["<p>Claude Certified Developer – Foundations試験は、基準準拠型の評価です。各受験者は、他の受験者との比較ではなく、固定された達成基準に照らして測定されます。他の受験者の一定割合を上回ることによってではなく、ブループリントで定義された知識とスキルを示すことによって合格します。<\/p>\n<p><strong>合格基準。<\/strong>合格点は、正式な基準設定調査を通じて定められました。この調査では、トレーニングを受けた対象領域の専門家が、最低限の能力を備えた受験者に期待される成績の水準を判定しました。スコアは100–1,000のスケールで報告され、カットスコアは720です。<\/p>\n<p><strong>結果の通知。<\/strong>結果は、合格または不合格のステータスと、100から1,000までのスケールスコアで報告されます。スコアレポートには、各内容分野であなたが正解した問題の割合も記載されます。セクション別のパーセンテージは、ご自身の成績を理解するために提供されるものであり、合否の判定には使用されません。合否は総合のスケールスコアに基づいて判定されます。<\/p>"]}, {"n": "10", "title": "申し込みと予約", "secs": ["<p>申し込みと予約は、Anthropic Partner AcademyとPearson VUEを通じて行います。<\/p>\n<ol><li>Anthropic Partner Academyで受験する試験の認定資格ページにアクセスし、試験の詳細を確認します。<\/li><li>申し込む前に、試験ガイドをダウンロードし、「認定資格利用規約」（Certification Terms and Conditions）と「認定試験ポリシー」（Certification Exam Policy）を確認します。<\/li><li>試験に申し込み、支払い手続きを完了します。支払い手続きの画面に表示される受験料には、ご自身のパートナーティアに適用される割引が反映されています。<\/li><li>確認の案内に従ってPearson VUEアカウントを作成し、サインインして試験セッションを予約します。<\/li><li>空いている日程を選び、オンライン監督付きまたはPearsonのテストセンターのいずれかを選択します。試験はPearson VUEによって実施されます。<\/li><li>予約時刻の24時間前までは、キャンセルまたは予約変更ができます。24時間以内に行った変更では、受験料は返金されません。<\/li><\/ol>"]}, {"n": "11", "title": "試験ポリシー", "secs": ["", "<h3>本人確認書類<\/h3>\n<p>試験当日は、有効期限内の、政府発行の有効な写真付き本人確認書類を提示する必要があります。本人確認書類の氏名は、申し込み時の氏名と完全に一致していなければなりません。申し込み時の氏名を訂正する必要がある場合は、試験を予約する前にcertifications-support@anthropic.comまでご連絡ください。<\/p>", "<h3>受験上の配慮<\/h3>\n<p>障害またはニーズを証明する書類のある受験者は、適用される法律に従い、合理的な受験上の配慮を受けられます。受験上の配慮は、試験を予約する前に申請し、Pearson VUEの承認を受ける必要があります。申請が承認されるまで、予約をしないでください。受験上の配慮はpearsonvue.com/us/en/test-takers/accommodationsで申請してください。<\/p>", "<h3>再受験ポリシー<\/h3>\n<p>合格しなかった受験者は、所定の待機期間の後に再受験できます。待機期間は不合格の回数が増えるごとに長くなり、初回の後は14日、2回目の後は30日、3回目の後は90日です。同じ試験は、任意の連続する12か月の期間内に4回まで受験できます。上限は試験ごとに適用されるため、ある試験に合格しなかったことで、別の試験に申し込めなくなることはありません。受験料は受験のたびに必要です。<\/p>", "<h3>無断欠席と遅刻<\/h3>\n<p>予約した試験に現れなかった受験者、または許容される遅刻の時間枠を過ぎて到着した受験者は、受験料が返金されず、あらためて申し込む必要があります。キャンセルと予約変更の期限はセクション10に記載されています。<\/p>"]}, {"n": "12", "title": "試験当日の流れと受験規則", "secs": ["<p>試験は、標準化され、安全が確保された、監督付きの環境で実施されます。オンラインで受験する場合も、Pearson VUEのテストセンターで受験する場合も、資格を保有するすべての人のために資格の信頼性を守る目的で、以下の規則が適用されます。<\/p>\n<p>試験中は、次のことを守る必要があります。<\/p>\n<ul><li>オンラインで受験する場合、セッションの間ずっと試験監督者とウェブカメラの視界内にとどまる<\/li><li>作業スペースにメモ、書籍、電話、サブモニター、その他の物品を置かない<\/li><li>試験中、他のいかなる人とも連絡や会話をしない<\/li><li>試験内容を、いかなる形式でも記録、複写、撮影、複製しない<\/li><\/ul>\n<p>持ち込みが禁止されている物品には、携帯電話、スマートウォッチ、ヘッドホン、学習教材、あらゆる録音・録画機器が含まれます。試験監督者が提供するメモ用紙など、持ち込みが許可される物品がある場合は、Pearson VUEが指定します。<\/p>\n<p><strong>不正行為の結果。<\/strong>カンニング、禁止されているリソースへのアクセスの試み、試験内容の開示があった場合、結果の無効化、資格の取り消し、今後の試験の受験禁止となることがあります。<\/p>"]}, {"n": "13", "title": "機密保持と秘密保持契約", "secs": ["<p>試験が始まる前に、機密保持および秘密保持契約に同意する必要があります。同意することにより、問題、解答の選択肢、シナリオを含むすべての試験内容がAnthropicの機密情報であり専有財産であること、およびそのいかなる部分も開示、複製、配布しないことに同意したことになります。契約に同意しない場合、試験セッションは終了し、返金は行われません。<\/p>"]}, {"n": "14", "title": "資格の維持と再認定", "secs": ["<p>Claude Certified Developer – Foundations資格は、授与された日から12か月間有効です。基盤となる技術は急速に進化するため、保有者が最新の知識を維持できるよう、資格には期限が設けられています。<\/p>\n<p>期限内に更新するには、認定を受けてからの変更点を確認し、Anthropic Partner Academyで無料の監督なしのアセスメントを完了します。期限内の更新に費用はかかりません。資格が失効した場合、認定されたステータスを取り戻すには、正規の受験料で試験全体を再受験する必要があります。<\/p>\n<p>試験内容が大幅に変更された場合、Anthropicは資格保有者に対し、再認定のために、更新アセスメントの完了ではなく試験全体の再受験を求めることがあります。<\/p>\n<p>資格保有者には、セクション12に記載された受験規則が引き続き適用されます。<\/p>"]}, {"n": "15", "title": "受験者サポート、異議申し立て、プライバシー", "secs": ["", "<h3>サポート<\/h3>\n<p>申し込み時の氏名を訂正するには、certifications-support@anthropic.comまでご連絡ください。申し込み、予約、受験上の配慮、結果など、その他すべての質問については、Pearson VUEのサポート（pearsonvue.com/us/en/anthropic.html）にお問い合わせください。<\/p>", "<h3>異議申し立てと苦情<\/h3>\n<p>決定に対しては、その通知を受けた日から14日以内に異議申し立てができます。試験結果に関する懸念の場合は、試験日から14日以内です。異議申し立ては、上記のリンクからPearson VUEのサポートに提出してください。異議申し立ては、プログラムの異議申し立てポリシーに基づいて審査されます。基準設定の結果および個々の試験問題の内容は、異議申し立ての対象になりません。<\/p>", "<h3>プライバシー<\/h3>\n<p>申し込みおよび受験の際に収集される個人データは、Anthropicのプライバシーポリシー、Pearson VUEのプライバシーポリシー、および適用されるデータ保護法に従って取り扱われます。<\/p>"]}, {"n": "16", "title": "文書管理", "secs": ["<table><thead><tr><th>バージョン<\/th><th>変更の概要<\/th><th>日付<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>初版発行<\/td><td>2026年7月<\/td><\/tr><\/tbody><\/table>"]}]}};
const out=document.getElementById('out'), nav=document.getElementById('chaps'), noteEl=document.getElementById('note');
const N=DATA.ko.ch.length;
const NOTES={
 ko:['<p><strong>한국어판</strong>: 일본어 공식 가이드(v1.0, 2026년 7월 발효) 전문을 요약 없이 옮긴 비공식 번역입니다. 해석이 갈리면 일본어 공식판이 기준입니다.</p>'],
 ja:['<p><strong>日本語版</strong>：Anthropic公式の日本語版試験ガイドPDF（バージョン1.0）の本文をそのまま転記しています。見出しと表のみ整形しました。</p>'],
 dual:['<p><strong>한·日 대조</strong>: 왼쪽은 한국어 번역, 오른쪽은 일본어 공식판입니다. 같은 항목(분야·샘플 문제)끼리 줄을 맞췄습니다.</p>']
};
let view='ko', openAll=false;
try{const s=localStorage.getItem('ccdv-f-guide-view'); if(s&&NOTES[s]) view=s;}catch(e){}
function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');}
function prep(h){h=wrapTables(h); return openAll?h.replace(/<details class="ans">/g,'<details class="ans" open>'):h;}
function render(){
  document.body.classList.toggle('dual',view==='dual');
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  noteEl.innerHTML=NOTES[view].join('');
  document.getElementById('openAll').textContent=openAll?(view==='ja'?'正解をすべて閉じる':view==='en'?'Hide all answers':'샘플 문제 정답 모두 접기'):(view==='ja'?'正解をすべて開く':view==='en'?'Show all answers':'샘플 문제 정답 모두 펼치기');
  let h='';
  for(let i=0;i<N;i++){
    const ko=DATA.ko.ch[i], ja=DATA.ja.ch[i], n=ko.n;
    h+=`<section class="chap" id="c${n}">`;
    if(view==='dual'){
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1>${ko.title}<span class="sub ja" lang="ja">${ja.title}</span></h1></div>`;
      h+=`<div class="colhead"><span>한국어</span><span>日本語</span></div>`;
      ko.secs.forEach((s,j)=>{h+=`<div class="pair"><div class="sec">${prep(s)}</div><div class="sec ja" lang="ja">${prep(ja.secs[j])}</div></div>`;});
    }else{
      const L=view, c=DATA[L].ch[i];
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1 class="${L}" lang="${L}">${c.title}</h1></div>`;
      h+=`<div class="sec ${L}" lang="${L}">${c.secs.map(prep).join('')}</div>`;
    }
    h+='</section>';
  }
  out.innerHTML=h;
  const L=view==='dual'?'ko':view;
  nav.innerHTML=DATA[L].ch.map(c=>`<button data-c="${c.n}" title="${c.title}">${c.n}</button>`).join('');
  spy();
}
document.querySelector('.langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const cur=current();
  view=b.dataset.v; try{localStorage.setItem('ccdv-f-guide-view',view);}catch(e){}
  render(); jump(cur,false);
});
document.getElementById('openAll').addEventListener('click',()=>{const cur=current(); openAll=!openAll; render(); jump(cur,false);});
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) jump(b.dataset.c,true);});
function off(){return document.querySelector('header.top').getBoundingClientRect().bottom;}
function jump(n,smooth){
  const el=document.getElementById('c'+n); if(!el) return;
  window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off()-8,behavior:smooth?'smooth':'auto'});
}
function current(){
  const o=off()+20; let c=DATA.ko.ch[0].n;
  DATA.ko.ch.forEach(x=>{const el=document.getElementById('c'+x.n); if(el&&el.getBoundingClientRect().top<=o) c=x.n;}); return c;
}
function spy(){const c=current(); nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));}
addEventListener('scroll',spy,{passive:true});
render();
</script>

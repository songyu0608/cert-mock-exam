  <div id="out"></div>
</div></main>

<script>
const DATA={"ko": {"title": "AWS Certified Data Engineer - Associate(DEA-C01)", "note": ["Source: https://docs.aws.amazon.com/ko_kr/aws-certification/latest/data-engineer-associate-01/data-engineer-associate-01.html (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "AWS Certified Data Engineer - Associate(DEA-C01)", "secs": ["<p>AWS Certified Data Engineer - Associate(DEA-C01) 시험에서는 응시자가 데이터 파이프라인을 구현하고, 모범 사례에 따라 비용 및 성능 문제를 모니터링하고, 문제를 해결하며 최적화할 수 있는지를 검증합니다.<\/p>\n<p><strong>참고:<\/strong> AWS 시험 안내서는 정기적으로 검토 및 수정되어 각 자격증 시험이 해당 자격증의 대상 직무와 관련된 최신 기술, AWS 서비스 및 기능을 테스트할 수 있도록 합니다. 시험 안내서 개정은 변경 사항이 시험에 반영되기 최소 1개월 전에 게시됩니다. 변경 사항 요약은 개정 섹션을 확인하십시오.<\/p>"]}, {"n": "2", "title": "서론", "secs": ["<p><a href=\"https://aws.amazon.com/certification/certified-data-engineer-associate/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Certified Data Engineer - Associate(DEA-C01)<\/a> 이 시험에서는 응시자가 데이터 파이프라인을 구현하고, 모범 사례에 따라 비용 및 성능 문제를 모니터링하고, 문제를 해결하며 최적화할 수 있는지를 검증합니다.<\/p>\n<p>또한 이 시험에서는 응시자의 다음 작업을 완료하는 능력을 확인합니다.<\/p>\n<ul><li>프로그래밍 개념을 적용하면서 데이터를 수집 및 변환하고 데이터 파이프라인 오케스트레이션<\/li><li>최적의 데이터 스토어를 선택 및 데이터 모델을 설계하고 데이터 스키마를 카탈로그화하고 데이터 수명 주기 관리<\/li><li>데이터 파이프라인을 운영화하고 유지 관리 및 모니터링 데이터를 분석하고 데이터 품질 보장<\/li><li>적절한 인증, 권한 부여, 데이터 암호화, 프라이버시 및 거버넌스 구현 로깅 사용<\/li><\/ul>"]}, {"n": "3", "title": "대상 응시자 설명", "secs": ["<p>대상 응시자는 데이터 엔지니어링 분야에서 2~3년의 경력을 보유하고 있어야 합니다. 대상 응시자는 볼륨, 다양성 및 속도가 데이터 수집, 변환, 모델링, 보안, 거버넌스, 개인 정보 보호, 스키마 설계 및 최적의 데이터 저장소 설계에 미치는 영향을 이해해야 합니다. 또한 대상 응시자는 AWS 서비스와 관련하여 최소 1~2년의 실무 경험을 보유하고 있어야 합니다.<\/p>", "<h3>권장하는 일반 IT 지식<\/h3>\n<p>대상 응시자는 다음과 같은 일반적인 IT 지식을 보유하고 있어야 합니다.<\/p>\n<ul><li>수집에서 목적지까지 ETL (추출, 변환 및 로드) 파이프라인 설정 및 유지 관리<\/li><li>파이프라인의 필요에 따라 언어에 구애받지 않는 고수준 프로그래밍 개념 적용<\/li><li>소스 제어를 위해 Git 명령을 사용하는 방법<\/li><li>데이터 레이크를 사용하여 데이터를 저장하는 방법<\/li><li>네트워킹, 스토리지 및 컴퓨팅에 대한 일반 개념<\/li><li>벡터의 일반 개념<\/li><\/ul>", "<h3>권장하는 AWS 지식<\/h3>\n<p>대상 응시자는 다음과 같은 AWS 지식을 보유하고 있어야 합니다.<\/p>\n<ul><li>AWS 서비스를 사용하여 이 시험 안내서의 소개 섹션에 나열된 작업을 수행하는 방법<\/li><li>데이터 파이프라인의 일부인 모든 데이터의 암호화, 거버넌스, 보호 및 로깅을 수행하는 AWS 서비스에 대한 이해<\/li><li>AWS 서비스를 비교하여 서비스의 비용, 성능 및 기능적 차이를 이해할 수 있는 능력<\/li><li>SQL 쿼리를 구조화하는 방법 및 AWS 서비스에서 SQL 쿼리를 실행하는 방법<\/li><li>AWS 서비스를 사용하여 데이터를 분석하고, 데이터 품질을 확인하고, 데이터 일관성을 보장하는 방법에 대한 이해<\/li><\/ul>", "<h3>대상 응시자의 시험 범위에 해당하지 않는 작업<\/h3>\n<p>다음 목록에는 대상 응시자가 수행할 수 있을 것으로 예상되지 않는 작업이 나와 있습니다. 이 목록에 모든 사항이 포함된 것은 아닙니다. 다음 작업은 시험 범위에 해당하지 않습니다.<\/p>\n<ul><li>ML 교육 및 추론 수행<\/li><li>프로그래밍 언어별 구문에 대한 지식 입증<\/li><li>데이터 기반의 비즈니스 결론 도출<\/li><\/ul>"]}, {"n": "4", "title": "시험 콘텐츠", "secs": ["", "<h3>답안 유형<\/h3>\n<p>이 시험의 문항은 2가지 유형으로 제공됩니다.<\/p>\n<ul><li><strong>선다형:<\/strong> 정답 1개와 오답 3개(정답 이외의 답)가 있습니다.<\/li><li><strong>복수 응답형:<\/strong> 5개 이상의 응답 중에 2개 이상의 정답이 있습니다.<\/li><\/ul>\n<p>문장을 가장 잘 완성하거나 질문에 대한 답으로 가장 적합한 응답을 1개 이상 선택합니다. 정답 이외의 답 또는 오답은 지식이나 기술이 부족한 응시자가 선택할 가능성이 큰 응답입니다. 정답 이외의 답은 일반적으로 콘텐츠 영역에 부합하여 맞아 보이는 응답입니다.<\/p>\n<p>답을 하지 않은 문항은 오답으로 처리됩니다. 추측에 따른 불이익은 없습니다. 시험에는 점수에 반영되는 50개의 문항이 포함되어 있습니다.<\/p>", "<h3>채점되지 않는 콘텐츠<\/h3>\n<p>시험에는 점수에 영향을 주지 않는 15개의 채점되지 않는 문제가 포함됩니다. AWS는 채점되지 않은 문제의 성과에 대한 정보를 수집하여 나중에 채점 문제로 사용할 수 있도록 해당 문항을 평가합니다. 이러한 채점되지 않는 문항은 시험에서 식별되지 않습니다.<\/p>", "<h3>시험 결과<\/h3>\n<p>AWS Certified Data Engineer - Associate(DEA-C01) 시험은 합격 또는 불합격이 결정되는 시험입니다. AWS 전문가가 자격증 분야 모범 사례 및 가이드라인에 따라 설정한 최소 표준을 기준으로 시험 점수를 매깁니다.<\/p>\n<p>시험 결과는 100~1,000점의 변환 점수로 보고됩니다. 합격 최소 점수는 720점입니다. 응시자는 점수를 통해 전반적인 시험 성적과 합격 여부를 알 수 있습니다. 변환 점수 모델은 난이도가 조금씩 다를 수 있는 여러 시험 형식에 걸쳐 점수를 균등하게 조정하는 데 도움이 됩니다.<\/p>\n<p>점수 보고서에는 섹션 수준별로 성적 분류표가 포함될 수 있습니다. 시험은 보상 점수 모델을 사용하므로 각 섹션에서 합격 점수를 얻을 필요는 없으며, 전체 시험에만 합격하면 됩니다.<\/p>\n<p>시험의 섹션마다 특정 가중치가 적용되므로 일부 섹션은 다른 섹션보다 문항 수가 많습니다. 분류표에는 응시자의 장단점을 강조하여 보여주는 일반 정보가 포함되어 있습니다. 섹션별 피드백을 파악할 때 주의하시기 바랍니다.<\/p>"]}, {"n": "5", "title": "내용 개요", "secs": ["<p>이 시험 안내서는 시험의 가중치, 콘텐츠 도메인 및 작업 설명을 제공합니다. 이 안내서는 시험 내용의 전체 목록을 제공하지 않습니다. 그러나 각 작업 설명에 관한 추가 맥락 정보를 사용하여 시험을 준비하는 데 참고할 수 있습니다.<\/p>\n<p>시험의 콘텐츠 도메인과 가중치는 다음과 같습니다.<\/p>\n<ul><li>콘텐츠 도메인 1: 데이터 수집 및 변환(채점되는 콘텐츠의 34%)<\/li><li>콘텐츠 도메인 2: 데이터 스토어 관리(채점되는 콘텐츠의 26%)<\/li><li>콘텐츠 도메인 3: 데이터 운영 및 지원(채점되는 콘텐츠의 22%)<\/li><li>콘텐츠 도메인 4: 데이터 보안 및 거버넌스(채점되는 콘텐츠의 18%)<\/li><\/ul>"]}, {"n": "6", "title": "시험을 위한 AWS 서비스", "secs": ["<p>AWS Certified Data Engineer - Associate 시험은 데이터 엔지니어와 관련된 특정 AWS 서비스를 다룹니다. 어떤 서비스가 범위에 포함되는지 이해하면 준비 작업에 집중할 수 있습니다.<\/p>\n<p>시험에서 다루는 AWS 서비스에 대한 자세한 내용은 다음 섹션을 참조하십시오.<\/p>\n<ul><li>범위 내 AWS 서비스<\/li><\/ul>"]}, {"n": "7", "title": "콘텐츠 도메인 1: 데이터 수집 및 변환", "secs": ["", "<h3>작업 1.1: 데이터 수집 수행<\/h3>\n<ul><li>기술 1.1.1: 스트리밍 소스에서 데이터 읽기(예: Amazon Kinesis, Amazon Managed Streaming for Apache Kafka(Amazon MSK), Amazon DynamoDB Streams, AWS DMS, AWS Glue, Amazon Redshift).<\/li><li>기술 1.1.2: 배치 소스에서 데이터 읽기(예: Amazon S3, AWS Glue, Amazon EMR, AWS DMS, Amazon Redshift, AWS Lambda, Amazon AppFlow)<\/li><li>기술 1.1.3: 배치 수집을 위한 적절한 구성 옵션 구현<\/li><li>기술 1.1.4: 데이터 API 사용<\/li><li>기술 1.1.5: Amazon EventBridge, Apache Airflow 또는 작업 및 크롤러에 대한 시간 기반 일정을 사용하여 스케줄러 설정<\/li><li>기술 1.1.6: 이벤트 트리거 설정(예: Amazon S3 이벤트 알림, EventBridge)<\/li><li>기술 1.1.7: Kinesis에서 Lambda 함수 호출<\/li><li>기술 1.1.8: 데이터 소스에 연결할 수 있도록 IP 주소에 대한 허용 목록 만들기<\/li><li>기술 1.1.9: 제한 구현 및 속도 제한 극복(예: DynamoDB, Amazon RDS, Kinesis)<\/li><li>기술 1.1.10: 스트리밍 데이터 배포를 위한 팬인 및 팬아웃 관리<\/li><li>기술 1.1.11: 데이터 수집 파이프라인의 반복 재생 가능성 설명<\/li><li>기술 1.1.12: 스테이트풀 및 스테이트리스 데이터 트랜잭션 정의<\/li><\/ul>", "<h3>작업 1.2: 데이터 변환 및 처리<\/h3>\n<ul><li>기술 1.2.1: 성능 요구 사항에 맞게 컨테이너 사용 최적화(예: Amazon EKS, Amazon ECS)<\/li><li>기술 1.2.2: 다양한 데이터 소스에 연결(예: Java Database Connectivity(JDBC), Open Database Connectivity(ODBC))<\/li><li>기술 1.2.3: 여러 소스의 데이터 통합<\/li><li>기술 1.2.4: 데이터 처리 중 비용 최적화<\/li><li>기술 1.2.5: 요구 사항에 따라 데이터 변환 서비스 구현(예: Amazon EMR, AWS Glue, Lambda, Amazon Redshift)<\/li><li>기술 1.2.6: 형식 간 데이터 변환(예: .csv에서 Apache Parquet으로 변환)<\/li><li>기술 1.2.7: 일반적인 변환 실패 및 성능 문제를 해결하고 디버깅 수행<\/li><li>기술 1.2.8: AWS 서비스를 사용하여 다른 시스템에서 데이터를 사용할 수 있도록 데이터 API 만들기<\/li><li>기술 1.2.9: 데이터의 볼륨, 속도 및 다양성 정의(예: 정형 데이터, 비정형 데이터)<\/li><li>기술 1.2.10: 데이터 처리를 위한 대규모 언어 모델(LLM) 통합<\/li><\/ul>", "<h3>작업 1.3: 데이터 파이프라인 오케스트레이션<\/h3>\n<ul><li>기술 1.3.1: 오케스트레이션 서비스를 사용하여 데이터 ETL 파이프라인의 워크플로 구축(예: Lambda, EventBridge, Amazon Managed Workflows for Apache Airflow(Amazon MWAA), AWS Step Functions, AWS Glue 워크플로)<\/li><li>기술 1.3.2: 성능, 가용성, 확장성, 복원성 및 내결함성이 우수한 데이터 파이프라인 구축<\/li><li>기술 1.3.3: 서버리스 워크플로 구현 및 유지 관리<\/li><li>기술 1.3.4: 알림 서비스를 사용하여 알림을 전송(예: Amazon SNS, Amazon SQS)<\/li><\/ul>", "<h3>작업 1.4: 프로그래밍 개념 적용<\/h3>\n<ul><li>기술 1.4.1: 코드 최적화를 통해 데이터를 수집하고 변환 런타임 단축<\/li><li>기술 1.4.2: 동시성 및 성능 요구 사항을 충족하도록 Lambda 함수 구성<\/li><li>기술 1.4.3: 데이터 엔지니어링을 위한 프로그래밍 언어 및 프레임워크 사용(예: Python, SQL, Scala, R, Java, Bash, PowerShell)<\/li><li>기술 1.4.4: 데이터 엔지니어링에 소프트웨어 엔지니어링 모범 사례 사용(예: 버전 제어, 테스트, 로깅, 모니터링)<\/li><li>기술 1.4.5: 코드형 인프라(IaC)를 사용하여 데이터 엔지니어링 솔루션 배포<\/li><li>기술 1.4.6: AWS SAM을 사용하여 서버리스 데이터 파이프라인 패키징 및 배포(예: Lambda 함수, Step Functions, Amazon DynamoDB 테이블)<\/li><li>기술 1.4.7: Lambda 함수 내에서 스토리지 볼륨 사용 및 탑재<\/li><li>기술 1.4.8: 반복 가능한 리소스 배포를 위해 코드형 인프라(IaC) 사용(예: AWS CloudFormation 및 AWS CDK)<\/li><li>기술 1.4.9: 지속적 통합 및 지속적 전달(CI/CD) 설명(데이터 파이프라인의 구현, 테스트 및 배포)<\/li><li>기술 1.4.10: 분산 컴퓨팅 정의<\/li><li>기술 1.4.11: 데이터 구조 및 알고리즘 설명(예: 그래프 데이터 구조 및 트리 데이터 구조)<\/li><\/ul>"]}, {"n": "8", "title": "콘텐츠 도메인 2: 데이터 스토어 관리", "secs": ["", "<h3>작업 2.1: 데이터 스토어 선택<\/h3>\n<ul><li>기술 2.1.1: 특정 비용 및 성능 요구 사항에 따라 적합한 스토리지 서비스 구현(예: Amazon Redshift, Amazon EMR, AWS Lake Formation, Amazon RDS, Amazon DynamoDB, Amazon Kinesis Data Streams, Amazon Managed Streaming for Apache Kafka(Amazon MSK))<\/li><li>기술 2.1.2: 특정 액세스 패턴 및 요구 사항에 따라 적합한 스토리지 서비스 구성(예: Amazon Redshift, Amazon EMR, Lake Formation, Amazon RDS, DynamoDB)<\/li><li>기술 2.1.3: 스토리지 서비스를 적절한 사용 사례에 적용(예: Amazon Aurora PostgreSQL에서 HNSW(Hierarchical Navigable Small Worlds)와 같은 인덱싱 알고리즘을 사용하고, 빠른 키/값 페어 액세스를 위해 Amazon MemoryDB 사용)<\/li><li>기술 2.1.4: 마이그레이션 도구를 데이터 처리 시스템에 통합(예: AWS Transfer Family)<\/li><li>기술 2.1.5: 데이터 마이그레이션 또는 원격 액세스 방법 구현(예: Amazon Redshift 페더레이션 쿼리, Amazon Redshift 구체화된 뷰, Amazon Redshift Spectrum)<\/li><li>기술 2.1.6: 데이터 액세스 방지하기 위해 잠금 관리(예: Amazon Redshift 및 Amazon RDS)<\/li><li>기술 2.1.7: 오픈 테이블 형식 관리(예: Apache Iceberg)<\/li><li>기술 2.1.8: 벡터 인덱스 유형 설명(예: HNSW, IVF)<\/li><\/ul>", "<h3>작업 2.2: 데이터 카탈로그 시스템 이해<\/h3>\n<ul><li>기술 2.2.1: 데이터 카탈로그를 사용하여 데이터 소스의 데이터 사용<\/li><li>기술 2.2.2: 기술 데이터 카탈로그 작성 및 참조(예: AWS Glue Data Catalog, Apache Hive 메타스토어)<\/li><li>기술 2.2.3: 스키마를 검색하고 AWS Glue 크롤러를 사용하여 데이터 카탈로그 채우기<\/li><li>기술 2.2.4: 파티션을 데이터 카탈로그와 동기화<\/li><li>기술 2.2.5: 카탈로그 구축을 위한 새 소스 또는 대상 연결 만들기(예: AWS Glue)<\/li><li>기술 2.2.6: 비즈니스 데이터 카탈로그 만들기 및 관리(예: Amazon SageMaker Catalog)<\/li><\/ul>", "<h3>작업 2.3: 데이터의 수명 주기 관리<\/h3>\n<ul><li>기술 2.3.1: 로드 및 언로드 작업을 수행하여 Amazon S3와 Amazon Redshift 간에 데이터 마이그레이션<\/li><li>기술 2.3.2: S3 수명 주기 정책을 관리하여 S3 데이터의 스토리지 계층 변경<\/li><li>기술 2.3.3: S3 수명 주기 정책을 사용하여 데이터가 특정 기간에 도달하면 데이터 만료 설정<\/li><li>기술 2.3.4: S3 버전 관리 및 DynamoDB TTL 관리<\/li><li>기술 2.3.5: 비즈니스 및 법적 요구 사항을 충족하기 위해 데이터 삭제<\/li><li>기술 2.3.6: 적절한 복원성 및 가용성으로 데이터 보호<\/li><\/ul>", "<h3>작업 2.4: 데이터 모델 및 스키마 진화 설계<\/h3>\n<ul><li>기술 2.4.1: Amazon Redshift, DynamoDB, Lake Formation을 위한 스키마 설계<\/li><li>기술 2.4.2: 데이터 특성에 대한 변경 사항 해결<\/li><li>기술 2.4.3: 스키마 변환 수행(예: AWS SCT 및 AWS DMS 스키마 변환 사용)<\/li><li>기술 2.4.4: AWS 도구를 사용하여 데이터 계보 설정(예: Amazon SageMaker ML Lineage Tracking 및 Amazon SageMaker Catalog)<\/li><li>기술 2.4.5: 인덱싱, 파티셔닝 전략, 압축 및 기타 데이터 최적화 기술에 대한 모범 사례 설명<\/li><li>기술 2.4.6: 벡터화 개념 설명(예: Amazon Bedrock Knowledge Base)<\/li><\/ul>"]}, {"n": "9", "title": "콘텐츠 도메인 3: 데이터 운영 및 지원", "secs": ["", "<h3>작업 3.1: AWS 서비스를 사용하여 데이터 처리 자동화<\/h3>\n<ul><li>기술 3.1.1: 데이터 파이프라인 오케스트레이션(예: Amazon Managed Workflows for Apache Airflow(Amazon MWAA), AWS Step Functions)<\/li><li>기술 3.1.2: Amazon 관리형 워크플로 문제 해결<\/li><li>기술 3.1.3: SDK를 호출하여 코드로 Amazon 기능에 액세스<\/li><li>기술 3.1.4: AWS 서비스의 기능을 사용하여 데이터 처리(예: Amazon EMR, Amazon Redshift, AWS Glue)<\/li><li>기술 3.1.5: 데이터 API 사용 및 유지 관리<\/li><li>기술 3.1.6: 변환을 위한 데이터 준비(예: AWS Glue DataBrew 및 Amazon SageMaker Unified Studio)<\/li><li>기술 3.1.7: 데이터 쿼리(예: Amazon Athena)<\/li><li>기술 3.1.8: AWS Lambda를 사용하여 데이터 처리 자동화<\/li><li>기술 3.1.9: 이벤트 및 스케줄러 관리(예: Amazon EventBridge)<\/li><\/ul>", "<h3>작업 3.2: AWS 서비스를 사용하여 데이터 분석<\/h3>\n<ul><li>기술 3.2.1: AWS 서비스와 도구를 사용하여 데이터 시각화(예: DataBrew, Amazon QuickSight)<\/li><li>기술 3.2.2: 데이터 확인 및 정리(예: Lambda, Athena, QuickSight, Jupyter Notebooks, Amazon SageMaker Data Wrangler)<\/li><li>기술 3.2.3: Amazon Redshift와 Athena의 SQL을 사용하여 데이터 쿼리 또는 뷰 만들기<\/li><li>기술 3.2.4: Apache Spark를 사용하여 데이터를 탐색하는 Athena 노트북 사용<\/li><li>기술 3.2.5: 프로비저닝된 서비스와 서버리스 서비스 간의 절충점 설명<\/li><li>기술 3.2.6: 데이터 집계, 롤링 평균, 그룹화 및 피벗 정의<\/li><\/ul>", "<h3>작업 3.3: 데이터 파이프라인 유지 관리 및 모니터링<\/h3>\n<ul><li>기술 3.3.1: 감사를 위해 로그 추출<\/li><li>기술 3.3.2: 감사 및 추적을 지원하는 로깅 및 모니터링 솔루션 배포<\/li><li>기술 3.3.3: 모니터링 중 알림 기능을 사용하여 경고 전송<\/li><li>기술 3.3.4: 성능 문제 해결<\/li><li>기술 3.3.5: AWS CloudTrail을 사용하여 API 호출 추적<\/li><li>기술 3.3.6: 파이프라인 문제 해결 및 유지 관리(예: AWS Glue, Amazon EMR)<\/li><li>기술 3.3.7: Amazon CloudWatch Logs를 사용하여 애플리케이션 데이터 로깅(구성 및 자동화에 중점을 둠)<\/li><li>기술 3.3.8: AWS 서비스를 통해 로그 분석(예: Athena, Amazon EMR, Amazon OpenSearch Service, CloudWatch Logs Insights, 빅 데이터 애플리케이션 로그)<\/li><\/ul>", "<h3>작업 3.4: 데이터 품질 보장<\/h3>\n<ul><li>기술 3.4.1: 데이터를 처리하는 동안 데이터 품질 검사 실행(예: 빈 필드 확인)<\/li><li>기술 3.4.2: 데이터 품질 규칙 정의(예: DataBrew)<\/li><li>기술 3.4.3: 데이터 일관성 조사(예: DataBrew)<\/li><li>기술 3.4.4: 데이터 샘플링 기법 설명<\/li><li>기술 3.4.5: 데이터 스큐 메커니즘 구현<\/li><\/ul>"]}, {"n": "10", "title": "콘텐츠 도메인 4: 데이터 보안 및 거버넌스", "secs": ["", "<h3>작업 4.1: 인증 메커니즘 적용<\/h3>\n<ul><li>기술 4.1.1: VPC 보안 그룹 업데이트<\/li><li>기술 4.1.2: IAM 그룹, 역할, 엔드포인트, 서비스 생성 및 업데이트<\/li><li>기술 4.1.3: 암호 관리를 위한 자격 증명 만들기 및 회전(예: AWS Secrets Manager)<\/li><li>기술 4.1.4: 액세스를 위한 IAM 역할 설정(예: AWS Lambda, Amazon API Gateway, AWS CLI, AWS CloudFormation)<\/li><li>기술 4.1.5: 역할, 엔드포인트 및 서비스에 IAM 정책 적용(예: S3 Access Points, AWS PrivateLink)<\/li><li>기술 4.1.6: 관리형 서비스와 비관리형 서비스의 차이점 설명<\/li><li>기술 4.1.7: SageMaker Unified Studio의 도메인, 도메인 단위 및 프로젝트 사용<\/li><\/ul>", "<h3>작업 4.2: 권한 부여 메커니즘 적용<\/h3>\n<ul><li>기술 4.2.1: 관리형 정책이 요구 사항을 충족하지 못하면 사용자 지정 IAM 정책 만들기<\/li><li>기술 4.2.2: 애플리케이션 및 데이터베이스 자격 증명 저장(예: Secrets Manager 및 AWS Systems Manager Parameter Store)<\/li><li>기술 4.2.3: 데이터베이스 사용자, 그룹 및 역할에 데이터베이스 액세스와 권한 제공(예: Amazon Redshift)<\/li><li>기술 4.2.4: AWS Lake Formation을 통해 권한 관리(Amazon Redshift, Amazon EMR, Amazon Athena, Amazon S3)<\/li><li>기술 4.2.5: 비즈니스 요구 사항을 해결하는 권한 부여 방법 적용(역할 기반, 태그 기반 및 속성 기반)<\/li><li>기술 4.2.6: 최소 권한의 원칙을 충족하는 사용자 지정 정책 구성<\/li><\/ul>", "<h3>작업 4.3: 데이터 암호화 및 마스킹 보장<\/h3>\n<ul><li>기술 4.3.1: 규정 준수 법률 또는 회사 정책에 따른 데이터 마스킹 및 익명화 적용<\/li><li>기술 4.3.2: 암호화 키를 사용하여 데이터 암호화 또는 해독(예: AWS KMS)<\/li><li>기술 4.3.3: AWS 계정 경계 간에 암호화 구성<\/li><li>기술 4.3.4: 전송 중 또는 전송 전 데이터 암호화 사용<\/li><\/ul>", "<h3>작업 4.4: 감사용 로그 준비<\/h3>\n<ul><li>기술 4.4.1: AWS CloudTrail을 사용하여 API 호출 추적<\/li><li>기술 4.4.2: Amazon CloudWatch Logs를 사용하여 애플리케이션 로그 저장<\/li><li>기술 4.4.3: 중앙 집중식 로깅 쿼리에 AWS CloudTrail Lake 사용<\/li><li>기술 4.4.4: AWS 서비스를 사용하여 로그 분석(예: Athena, CloudWatch Logs Insights, Amazon OpenSearch Service)<\/li><li>기술 4.4.5: 다양한 AWS 서비스를 통합하여 로깅 수행(예: 대용량 로그 데이터의 경우 Amazon EMR)<\/li><\/ul>", "<h3>작업 4.5: 데이터 프라이버시 및 거버넌스 이해<\/h3>\n<ul><li>기술 4.5.1: 데이터 공유 권한 부여(예: Amazon Redshift의 데이터 공유)<\/li><li>기술 4.5.2: PII 식별 구현(예: Lake Formation을 사용하는 Amazon Macie)<\/li><li>기술 4.5.3: 허용되지 않는 AWS 리전으로의 데이터 백업 또는 복제를 방지하기 위해 데이터 프라이버시 전략 구현<\/li><li>기술 4.5.4: 계정에서 발생한 구성 변경 보기(예: AWS Config)<\/li><li>기술 4.5.5: 데이터 주권 유지 관리<\/li><li>기술 4.5.6: Amazon SageMaker Catalog 프로젝트를 통해 데이터 액세스 관리<\/li><li>기술 4.5.7: 거버넌스 데이터 프레임워크 및 데이터 공유 패턴 설명<\/li><\/ul>"]}, {"n": "11", "title": "범위 내 AWS 서비스", "secs": ["<p>다음 목록은 AWS Certified Data Engineer - Associate(DEA-C01) 시험 범위에 포함되는 AWS 서비스 및 기능입니다. 이 목록은 전체 목록이 아니며 변경될 수 있습니다. AWS 제품 및 서비스는 해당 제품 및 서비스의 주요 기능에 맞는 카테고리로 표시됩니다.<\/p>", "<h3>분석<\/h3>\n<ul><li>Amazon Athena<\/li><li>Amazon EMR<\/li><li>AWS Glue<\/li><li>AWS Glue DataBrew<\/li><li>AWS Lake Formation<\/li><li>Amazon Kinesis Data Firehose<\/li><li>Amazon Kinesis Data Streams<\/li><li>Amazon Managed Service for Apache Flink<\/li><li>Amazon Managed Streaming for Apache Kafka(Amazon MSK)<\/li><li>Amazon OpenSearch Service<\/li><li>Amazon Quick<\/li><li>Amazon SageMaker AI<\/li><\/ul>", "<h3>애플리케이션 통합<\/h3>\n<ul><li>Amazon AppFlow<\/li><li>Amazon EventBridge<\/li><li>Amazon Managed Workflows for Apache Airflow(Amazon MWAA)<\/li><li>Amazon SNS<\/li><li>Amazon SQS<\/li><li>AWS Step Functions<\/li><\/ul>", "<h3>클라우드 재무 관리<\/h3>\n<ul><li>AWS Budgets<\/li><li>AWS Cost Explorer<\/li><\/ul>", "<h3>컴퓨팅<\/h3>\n<ul><li>AWS Batch<\/li><li>Amazon EC2<\/li><li>AWS Lambda<\/li><li>AWS SAM<\/li><\/ul>", "<h3>컨테이너<\/h3>\n<ul><li>Amazon ECR<\/li><li>Amazon ECS<\/li><li>Amazon EKS<\/li><\/ul>", "<h3>데이터베이스<\/h3>\n<ul><li>Amazon DocumentDB<\/li><li>Amazon DynamoDB<\/li><li>Amazon Keyspaces<\/li><li>Amazon MemoryDB for Redis<\/li><li>Amazon Neptune<\/li><li>Amazon RDS<\/li><li>Amazon Aurora<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>개발자 도구<\/h3>\n<ul><li>AWS CLI<\/li><li>AWS CloudFormation<\/li><li>AWS CDK<\/li><li>AWS CodeBuild<\/li><li>AWS CodeDeploy<\/li><li>AWS CodePipeline<\/li><li>Amazon Q<\/li><\/ul>", "<h3>웹 및 모바일<\/h3>\n<ul><li>Amazon API Gateway<\/li><\/ul>", "<h3>기계 학습<\/h3>\n<ul><li>Amazon SageMaker AI<\/li><li>Amazon Bedrock<\/li><li>Amazon Kendra<\/li><\/ul>", "<h3>AWS의 관리 및 거버넌스<\/h3>\n<ul><li>AWS CloudTrail<\/li><li>Amazon CloudWatch<\/li><li>Amazon CloudWatch Logs<\/li><li>AWS Config<\/li><li>Amazon Managed Grafana<\/li><li>AWS Systems Manager<\/li><li>AWS Well-Architected Tool<\/li><li>AWS Data Exchange<\/li><\/ul>", "<h3>마이그레이션 및 전송<\/h3>\n<ul><li>AWS Application Discovery Service<\/li><li>AWS Application Migration Service<\/li><li>AWS DMS<\/li><li>AWS DataSync<\/li><li>AWS Snow Family<\/li><li>AWS Transfer Family<\/li><\/ul>", "<h3>네트워킹 및 콘텐츠 전송<\/h3>\n<ul><li>Amazon CloudFront<\/li><li>AWS PrivateLink<\/li><li>Amazon Route 53<\/li><li>Amazon VPC<\/li><\/ul>", "<h3>보안, ID 및 규정 준수<\/h3>\n<ul><li>IAM<\/li><li>AWS KMS<\/li><li>Amazon Macie<\/li><li>AWS Secrets Manager<\/li><li>AWS Shield<\/li><li>AWS WAF<\/li><\/ul>", "<h3>스토리지<\/h3>\n<ul><li>AWS Backup<\/li><li>Amazon EBS<\/li><li>Amazon EFS<\/li><li>Amazon S3<\/li><li>Amazon S3 Tables<\/li><li>Amazon S3 Glacier<\/li><li>Amazon S3 Tables<\/li><\/ul>"]}, {"n": "12", "title": "범위 외 AWS 서비스", "secs": ["<p>다음 목록은 시험 범위에 포함되지 않는 AWS 서비스 및 기능입니다. 이 목록은 전체 목록이 아니며 변경될 수 있습니다. 시험의 대상 작업 역할과 전혀 관련이 없는 AWS 제품 및 서비스는 다음 목록에서 제외됩니다.<\/p>", "<h3>분석<\/h3>\n<ul><li>Amazon FinSpace<\/li><\/ul>", "<h3>비즈니스 애플리케이션<\/h3>\n<ul><li>Alexa for Business<\/li><li>Amazon Chime<\/li><li>Amazon Connect<\/li><li>AWS IQ<\/li><li>Amazon WorkMail<\/li><\/ul>", "<h3>컴퓨팅<\/h3>\n<ul><li>AWS App Runner<\/li><li>AWS Elastic Beanstalk<\/li><li>Amazon Lightsail<\/li><li>AWS Outposts<\/li><li>AWS Serverless Application Repository<\/li><\/ul>", "<h3>컨테이너<\/h3>\n<ul><li>Red Hat OpenShift Service on AWS(ROSA)<\/li><\/ul>", "<h3>개발자 도구<\/h3>\n<ul><li>AWS Fault Injection Simulator(AWS FIS)<\/li><li>AWS X-Ray<\/li><\/ul>", "<h3>프런트엔드 웹 및 모바일<\/h3>\n<ul><li>AWS Amplify<\/li><li>AWS AppSync<\/li><li>AWS Device Farm<\/li><li>Amazon Location Service<\/li><li>Amazon Pinpoint<\/li><li>Amazon SES<\/li><\/ul>", "<h3>사물 인터넷(IoT)<\/h3>\n<ul><li>FreeRTOS<\/li><li>AWS IoT 1-Click<\/li><li>AWS IoT Device Defender<\/li><li>AWS IoT Device Management<\/li><li>AWS IoT Events<\/li><li>AWS IoT FleetWise<\/li><li>AWS IoT RoboRunner<\/li><li>AWS IoT SiteWise<\/li><li>AWS IoT TwinMaker<\/li><\/ul>", "<h3>기계 학습<\/h3>\n<ul><li>Amazon DevOps Guru<\/li><\/ul>", "<h3>AWS의 관리 및 거버넌스<\/h3>\n<ul><li>AWS Activate<\/li><li>AWS Managed Services(AMS)<\/li><\/ul>", "<h3>미디어 서비스<\/h3>\n<ul><li>Amazon Elastic Transcoder<\/li><li>AWS Elemental Appliances and Software<\/li><li>AWS Elemental MediaConnect<\/li><li>AWS Elemental MediaConvert<\/li><li>AWS Elemental MediaLive<\/li><li>AWS Elemental MediaPackage<\/li><li>AWS Elemental MediaStore<\/li><li>AWS Elemental MediaTailor<\/li><li>Amazon Interactive Video Service(Amazon IVS)<\/li><li>Amazon Nimble Studio<\/li><\/ul>", "<h3>마이그레이션 및 전송<\/h3>\n<ul><li>AWS Mainframe Modernization<\/li><li>AWS Migration Hub<\/li><\/ul>", "<h3>스토리지<\/h3>\n<ul><li>EC2 Image Builder<\/li><\/ul>"]}, {"n": "13", "title": "개정", "secs": ["<p>AWS 시험 안내서는 정기적으로 검토 및 업데이트되어 이러한 자격증 시험이 해당 자격증의 대상 직무와 관련된 AWS 서비스 및 기능을 테스트할 수 있도록 합니다. 시험 안내서 업데이트는 업데이트가 시험에 반영되기 약 1개월 전에 게시됩니다.<\/p>", "<h3>변경 기록<\/h3>\n<table><thead><tr><th>버전<\/th><th>게시 날짜<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>첫 번째 릴리스입니다.<\/td><\/tr><tr><td>1.1<\/td><td>2025년 12월 12일<\/td><\/tr><\/tbody><\/table>\n<p>시험 안내서 버전 1.0의 개별 지식과 기술은 각 과제 아래에 하나의 기술 목록으로 통합되었습니다. 버전 1.0에서 기존 기술과 중복되는 지식 항목은 버전 1.1에서 제거되었습니다.<\/p>", "<h3>지식 및 기술의 변화<\/h3>\n<table><thead><tr><th>버전 1.1<\/th><th>버전 1.0<\/th><\/tr><\/thead><tbody><tr><td>기술 1.4.8: 반복 가능한 리소스 배포를 위해 코드형 인프라(IaC) 사용(예: AWS CloudFormation 및 AWS Cloud Development Kit(AWS CDK))<\/td><td>관련 지식: 반복 가능한 배포를 위한 코드형 인프라(IaC)(예: AWS Cloud Development Kit(AWS CDK), AWS CloudFormation)<\/td><\/tr><tr><td>기술 2.1.3: 적절한 사용 사례에 스토리지 서비스 적용(예: Amazon Aurora PostgreSQL에서 HNSW와 같은 인덱싱 알고리즘을 사용하고 빠른 키/값 페어 액세스를 위해 Amazon MemoryDB를 사용)<\/td><td>관련 기술: 적절한 사용 사례에 스토리지 서비스 적용(예: Amazon S3)<\/td><\/tr><tr><td>기술 2.2.2: 기술 데이터 카탈로그 작성 및 참조(예: AWS Glue Data Catalog, Apache Hive 메타스토어)<\/td><td>관련 기술: 데이터 카탈로그 구축 및 참조(예: AWS Glue Data Catalog, Apache Hive 메타스토어)<\/td><\/tr><tr><td>기술 2.4.4: AWS 도구를 사용하여 데이터 계보 설정(예: Amazon SageMaker ML Lineage Tracking 및 Amazon SageMaker Catalog)<\/td><td>관련 기술: AWS 도구를 사용하여 데이터 계보 구축(예: Amazon SageMaker ML Lineage Tracking)<\/td><\/tr><tr><td>기술 3.1.6: 변환을 위한 데이터 준비(예: AWS Glue DataBrew 및 Amazon SageMaker Unified Studio)<\/td><td>관련 기술: 데이터 변환 준비(예: AWS Glue DataBrew)<\/td><\/tr><tr><td>기술 3.2.3: Redshift와 Athena의 SQL을 사용하여 데이터 쿼리 또는 뷰 만들기<\/td><td>관련 기술: Athena를 사용하여 데이터 쿼리 또는 뷰 만들기<\/td><\/tr><tr><td>기술 4.2.5: 비즈니스 요구 사항을 해결하는 권한 부여 방법 적용(역할 기반, 태그 기반 및 속성 기반)<\/td><td>관련 지식: 권한 부여 방법(역할 기반, 정책 기반, 태그 기반 및 속성 기반)<\/td><\/tr><tr><td>기술 4.2.6: 최소 권한의 원칙을 충족하는 사용자 지정 정책 구성<\/td><td>관련 지식: AWS 보안에 적용되는 최소 권한의 원칙<\/td><\/tr><tr><td>기술 4.3.4: 전송 중 또는 전송 전 데이터 암호화 사용<\/td><td>관련 기술: 전송 중 데이터 암호화 사용<\/td><\/tr><tr><td>기술 4.5.4: 계정에서 발생한 구성 변경 보기(예: AWS Config)<\/td><td>관련 기술: 계정에서 발생한 구성 변경 관리(예: AWS Config)<\/td><\/tr><tr><td>기술 4.5.5: 데이터 주권 유지 관리<\/td><td>관련 지식: 데이터 주권<\/td><\/tr><\/tbody><\/table>", "<h3>새로 추가된 기술<\/h3>\n<ul><li>기술 1.2.10: 데이터 처리를 위한 대규모 언어 모델(LLM) 통합<\/li><li>기술 2.1.7: 오픈 테이블 형식 관리(예: Apache Iceberg)<\/li><li>기술 2.1.8: 벡터 인덱스 유형 설명(예: HNSW, IVF)<\/li><li>기술 2.2.6: 비즈니스 데이터 카탈로그 만들기 및 관리(예: Amazon SageMaker Catalog)<\/li><li>기술 2.4.6: 벡터화 개념 설명(예: Amazon Bedrock Knowledge Base)<\/li><li>기술 4.1.7: SageMaker Unified Studio의 도메인, 도메인 단위 및 프로젝트 사용<\/li><li>기술 4.5.6: Amazon SageMaker Catalog 프로젝트를 통해 데이터 액세스 관리<\/li><li>기술 4.5.7: 거버넌스 데이터 프레임워크 및 데이터 공유 패턴 설명<\/li><\/ul>", "<h3>삭제된 기술<\/h3>\n<p>기존 기술에서 이미 다루었던 지식 항목 외에 버전 1.1에서 제거된 지식과 기술은 없습니다.<\/p>", "<h3>범위 내 및 범위 외 서비스 변경<\/h3>", "<h4>범위 내 목록에 추가된 서비스<\/h4>\n<ul><li>Amazon Aurora<\/li><li>Amazon Q<\/li><li>Amazon Bedrock<\/li><li>Amazon Kendra<\/li><li>AWS Data Exchange<\/li><li>Amazon S3 Tables<\/li><\/ul>", "<h4>범위 내 목록에서 제거된 서비스<\/h4>\n<ul><li>AWS Cloud9<\/li><li>AWS CodeCommit<\/li><li>AWS Schema Conversion Tool(AWS SCT)<\/li><\/ul>", "<h4>범위 외 목록에 추가된 서비스<\/h4>\n<p>범위 외 목록에 추가된 서비스가 없습니다.<\/p>", "<h4>범위 외 목록에서 제거된 서비스(모두 서비스 변경 또는 지원 중단에 따름)<\/h4>\n<ul><li>Amazon Honeycode<\/li><li>Amazon WorkDocs<\/li><li>Amazon Timestream<\/li><li>Amazon CodeWhisperer<\/li><\/ul>"]}, {"n": "14", "title": "설문 조사", "secs": ["<p>이 시험 안내서가 도움이 되었습니까? <a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=DE-Associate&amp;course_id=DEA-C01&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">설문 조사<\/a>에 참여하여 알려 주시기 바랍니다.<\/p>"]}]}, "ja": {"title": "AWS Certified Data Engineer - Associate (DEA-C01)", "note": ["Source: https://docs.aws.amazon.com/ja_jp/aws-certification/latest/data-engineer-associate-01/data-engineer-associate-01.html (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "AWS Certified Data Engineer - Associate (DEA-C01)", "secs": ["<p>AWS Certified Data Engineer - Associate (DEA-C01) 試験では、受験者がデータパイプラインを実装し、ベストプラクティスに従ってコストとパフォーマンスの問題をモニタリング、トラブルシューティング、最適化する能力を検証します。<\/p>\n<p><strong>注記:<\/strong> AWS 試験ガイドは、各認定試験において認定対象となる職務に関連する最新の AWS のサービスおよび機能を確認し、スキルをテストするために、定期的に見直され、改訂されています。試験ガイドの改訂版は、変更内容が試験に反映される少なくとも 1 か月前に公開されます。変更の概要については、「改訂」セクションをご確認ください。<\/p>"]}, {"n": "2", "title": "はじめに", "secs": ["<p><a href=\"https://aws.amazon.com/certification/certified-data-engineer-associate/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Certified Data Engineer - Associate (DEA-C01)<\/a> 試験では、受験者がデータパイプラインを実装し、ベストプラクティスに従ってコストとパフォーマンスの問題をモニタリング、トラブルシューティング、最適化する能力を検証します。<\/p>\n<p>また、次のタスクについての受験者の能力も検証します。<\/p>\n<ul><li>プログラミングの概念を適用しながら、データを取り込んで変換し、データパイプラインをオーケストレーションする。<\/li><li>最適なデータストアの選択、データモデルの設計、データスキーマのカタログ化、データライフサイクルの管理を行う。<\/li><li>データパイプラインの運用、保守、モニタリングを行う。データを分析し、データ品質を確保する。<\/li><li>適切な認証、認可、データ暗号化、プライバシー、ガバナンスを実装する。ログ記録を有効にする。<\/li><\/ul>"]}, {"n": "3", "title": "受験対象者について", "secs": ["<p>受験対象者は、データエンジニアリングの分野で 2～3 年相当の実務経験があり、データの取り込み、変換、モデリング、セキュリティ、ガバナンス、プライバシー、スキーマ設計における、量、多様性、速度の影響と、最適なデータストア設計を理解している必要があります。また、1～2 年以上の AWS サービスの実務経験が必要です。<\/p>", "<h3>推奨される IT 全般の知識<\/h3>\n<p>受験対象者は、次のような IT 全般の知識を有している必要があります。<\/p>\n<ul><li>取り込みからデスティネーションまでの抽出、変換、ロード (ETL) パイプラインのセットアップとメンテナンス<\/li><li>パイプラインの要求に応じた、高水準だが言語に依存しないプログラミングの概念の適用<\/li><li>ソース管理に Git コマンドを使用する方法<\/li><li>データレイクを使用してデータを保存する方法<\/li><li>ネットワーク、ストレージ、コンピューティングの一般的な概念<\/li><li>ベクトルの一般的な概念<\/li><\/ul>", "<h3>推奨される AWS の知識<\/h3>\n<p>受験対象者は、次の AWS の知識を有している必要があります。<\/p>\n<ul><li>AWS サービスを使用して、この試験ガイドの「はじめに」セクションに記載されているタスクを実行する方法<\/li><li>データパイプラインの一部であるすべてのデータの暗号化、ガバナンス、保護、ログ記録のための AWS サービスについての理解<\/li><li>AWS サービスを比較して、サービス間におけるコスト、パフォーマンス、機能の違いを理解する能力<\/li><li>SQL クエリを構造化する方法と AWS サービスで SQL クエリを実行する方法<\/li><li>AWS サービスを使用してデータを分析し、データ品質を検証し、データの一貫性を確保する方法についての理解<\/li><\/ul>", "<h3>受験対象者にとって試験対象外となるジョブタスク<\/h3>\n<p>受験対象者が実施できることが想定されていないジョブタスクは、次のリストのとおりです。このリストはすべてを網羅しているわけではありません。次のタスクは、本試験の範囲外です。<\/p>\n<ul><li>ML トレーニングおよび推論を実行する。<\/li><li>プログラミング言語固有の構文に関する知識を実証する。<\/li><li>データに基づいてビジネス上の結論を導き出す。<\/li><\/ul>"]}, {"n": "4", "title": "試験内容", "secs": ["", "<h3>解答タイプ<\/h3>\n<p>試験には次の 2 種類の設問があります。<\/p>\n<ul><li><strong>択一選択問題:<\/strong> 正しい選択肢が 1 つ、誤った選択肢 (不正解) が 3 つ提示される。<\/li><li><strong>複数選択問題:<\/strong> 5 つ以上の選択肢のうち、正解が 2 つ以上ある。<\/li><\/ul>\n<p>設問の記述に最もよく当てはまるもの、または正解となるものを 1 つ以上選択します。不正解の選択肢は、知識や技術が不十分な受験者が選択してしまいそうな、設問内容と一致するもっともらしい解答になっています。<\/p>\n<p>未解答の設問は不正解とみなされます。推測による解答にペナルティはありません。試験には、スコアに影響する設問が 50 問含まれています。<\/p>", "<h3>採点対象外の設問<\/h3>\n<p>試験には、スコアに影響しない採点対象外の設問が 15 問含まれています。AWS では、これら採点対象外の設問における成績情報を収集し、これらの設問を今後採点対象の設問として使用できるかどうかを評価します。試験では、どの設問が採点対象外かは受験者にわからないようになっています。<\/p>", "<h3>試験の結果<\/h3>\n<p>AWS Certified Data Engineer - Associate (DEA-C01) 試験は、合否判定方式です。試験の採点は、認定業界のベストプラクティスおよびガイドラインに基づいた、AWS の専門家によって定められる最低基準に照らして行われます。<\/p>\n<p>試験の結果は、100～1,000 の換算スコアとして報告されます。合格スコアは 720 です。このスコアにより、試験全体の成績と合否がわかります。複数の試験間で難易度がわずかに異なる可能性があるため、スコアを均等化するために換算スコアが使用されます。<\/p>\n<p>スコアレポートには、各セクションの成績を示す分類表が含まれる場合があります。試験には補整スコアリングモデルが使用されるため、セクションごとに合否ラインは設定されておらず、試験全体のスコアで合否が判定されます。<\/p>\n<p>試験の各セクションには特定の重みが設定されているため、各セクションに割り当てられる設問数が異なる場合があります。分類表には、受験者の得意分野と不得意分野を示す全般的な情報が含まれます。セクションごとのフィードバックを解釈する際は注意してください。<\/p>"]}, {"n": "5", "title": "試験内容の概要", "secs": ["<p>この試験ガイドには、試験に設定された重み、コンテンツ分野、タスクステートメントについての説明が含まれています。本ガイドは、試験内容の包括的なリストを提供するものではありません。ただし、各タスクステートメントの追加情報を使って、試験の準備に役立てることができます。<\/p>\n<p>本試験のコンテンツ分野と重み設定は、次のとおりです。<\/p>\n<ul><li>コンテンツ分野 1: データの取り込みと変換 (採点対象コンテンツの 34%)<\/li><li>コンテンツ分野 2: データストア管理 (採点対象コンテンツの 26%)<\/li><li>コンテンツ分野 3: データ運用とサポート (採点対象コンテンツの 22%)<\/li><li>コンテンツ分野 4: データセキュリティとガバナンス (採点対象コンテンツの 18%)<\/li><\/ul>"]}, {"n": "6", "title": "試験対象の AWS サービス", "secs": ["<p>AWS Certified Data Engineer - Associate 試験は、データエンジニアに関連する特定の AWS サービスを対象としています。どのサービスが試験対象かを理解することで、準備作業に集中しやすくなります。<\/p>\n<p>AWS 試験の対象となるサービスの詳細については、次のセクションを参照してください。<\/p>\n<ul><li>対象の AWS サービス<\/li><\/ul>"]}, {"n": "7", "title": "コンテンツ分野 1: データの取り込みと変換", "secs": ["", "<h3>タスク 1.1: データ取り込みの実行<\/h3>\n<ul><li>スキル 1.1.1: ストリーミングソースからデータを読み取る [Amazon Kinesis、Amazon Managed Streaming for Apache Kafka (Amazon MSK)、Amazon DynamoDB Streams、AWS DMS、AWS Glue、Amazon Redshift など]。<\/li><li>スキル 1.1.2: バッチソースからデータを読み取る (Amazon S3、AWS Glue、Amazon EMR、AWS DMS、Amazon Redshift、AWS Lambda、Amazon AppFlow など)。<\/li><li>スキル 1.1.3: バッチ取り込み用の適切な設定オプションを実装する。<\/li><li>スキル 1.1.4: データ API を利用する。<\/li><li>スキル 1.1.5: Amazon EventBridge、Apache Airflow、ジョブとクローラーの時間ベースのスケジュールのいずれかを使用してスケジューラをセットアップする。<\/li><li>スキル 1.1.6: イベントトリガーを設定する (Amazon S3 イベント通知、EventBridge など)。<\/li><li>スキル 1.1.7: Kinesis から Lambda 関数を呼び出す。<\/li><li>スキル 1.1.8: データソースへの接続を許可する IP アドレスの許可リストを作成する。<\/li><li>スキル 1.1.9: スロットリングを実装し、レート制限を克服する (DynamoDB、Amazon RDS、Kinesis など)。<\/li><li>スキル 1.1.10: ストリーミングデータ配信のファンイン/ファンアウトを管理する。<\/li><li>スキル 1.1.11: データ取り込みパイプラインの再現性について説明する。<\/li><li>スキル 1.1.12: ステートフルデータトランザクションとステートレスデータトランザクションを定義する。<\/li><\/ul>", "<h3>タスク 1.2: データの変換と処理<\/h3>\n<ul><li>スキル 1.2.1: パフォーマンスのニーズに合わせてコンテナの使用を最適化する (Amazon EKS、Amazon ECS など)。<\/li><li>スキル 1.2.2: さまざまなデータソースに接続する [Java Database Connectivity (JDBC)、Open Database Connectivity (ODBC) など]。<\/li><li>スキル 1.2.3: 複数のソースからデータを統合する。<\/li><li>スキル 1.2.4: データ処理時のコストを最適化する。<\/li><li>スキル 1.2.5: 要件に基づいてデータ変換サービスを実装する (Amazon EMR、AWS Glue、Lambda、Amazon Redshift など)。<\/li><li>スキル 1.2.6: データの形式を変換する (.csv から Apache Parquet など)。<\/li><li>スキル 1.2.7: 一般的な変換エラーとパフォーマンス問題のトラブルシューティングとデバッグを行う。<\/li><li>スキル 1.2.8: AWS サービスを使用して、他のシステムからデータを使用できるようにするデータ API を作成する。<\/li><li>スキル 1.2.9: データのボリューム、速度、多様性を定義する (構造化データ、非構造化データなど)。<\/li><li>スキル 1.2.10: データ処理のために大規模言語モデル (LLM) を統合する。<\/li><\/ul>", "<h3>タスク 1.3: データパイプラインのオーケストレーション<\/h3>\n<ul><li>スキル 1.3.1: オーケストレーションサービスを使用してデータ ETL パイプラインのワークフローを構築する [Lambda、EventBridge、Amazon Managed Workflows for Apache Airflow (Amazon MWAA)、AWS Step Functions、AWS Glue ワークフローなど]。<\/li><li>スキル 1.3.2: パフォーマンス、可用性、スケーラビリティ、レジリエンス、耐障害性を実現するデータパイプラインを構築する。<\/li><li>スキル 1.3.3: サーバーレスワークフローを実装および保守する。<\/li><li>スキル 1.3.4: 通知サービスを使用してアラートを送信する (Amazon SNS、Amazon SQS など)。<\/li><\/ul>", "<h3>タスク 1.4: プログラミングの概念の応用<\/h3>\n<ul><li>スキル 1.4.1: コードを最適化してデータの取り込みと変換のランタイムを短縮する。<\/li><li>スキル 1.4.2: 同時実行性とパフォーマンスのニーズを満たすための Lambda 関数を設定する。<\/li><li>スキル 1.4.3: データエンジニアリングにプログラミング言語とフレームワークを使用する (Python、SQL、Scala、R、Java、Bash、PowerShell など)。<\/li><li>スキル 1.4.4: データエンジニアリングにソフトウェアエンジニアリングのベストプラクティスを使用する (バージョン管理、テスト、ログ記録、モニタリングなど)。<\/li><li>スキル 1.4.5: Infrastructure as Code (IaC) を使用してデータエンジニアリングソリューションをデプロイする。<\/li><li>スキル 1.4.6: AWS SAM を使用してサーバーレスデータパイプラインをパッケージ化およびデプロイする (Lambda 関数、Step Functions、DynamoDB テーブルなど)。<\/li><li>スキル 1.4.7: Lambda 関数内からストレージボリュームを使用およびマウントする。<\/li><li>スキル 1.4.8: 反復可能なリソースデプロイのために Infrastructure as Code (IaC) を使用する (AWS CloudFormation、AWS CDK など)。<\/li><li>スキル 1.4.9: 継続的インテグレーションと継続的デリバリー (CI/CD) (データパイプラインの実装、テスト、デプロイ) について説明する。<\/li><li>スキル 1.4.10: 分散コンピューティングを定義する。<\/li><li>スキル 1.4.11: データ構造とアルゴリズムについて説明する (グラフデータ構造、ツリーデータ構造など)。<\/li><\/ul>"]}, {"n": "8", "title": "コンテンツ分野 2: データストア管理", "secs": ["", "<h3>タスク 2.1: データストアの選択<\/h3>\n<ul><li>スキル 2.1.1: 特定のコストとパフォーマンスの要件に適したストレージサービスを実装する [Amazon Redshift、Amazon EMR、AWS Lake Formation、Amazon RDS、Amazon DynamoDB、Amazon Kinesis Data Streams、Amazon Managed Streaming for Apache Kafka (Amazon MSK) など]。<\/li><li>スキル 2.1.2: 特定のアクセスパターンと要件に適したストレージサービスを設定する (Amazon Redshift、Amazon EMR、Lake Formation、Amazon RDS、DynamoDB など)。<\/li><li>スキル 2.1.3: ストレージサービスを適切なユースケースに適用する [Hierarchical Navigable Small Worlds (HNSW) などのインデックス作成アルゴリズムと Amazon Aurora PostgreSQL の使用、キーと値のペアに迅速にアクセスするための Amazon MemoryDB の使用など]。<\/li><li>スキル 2.1.4: データ処理システムに移行ツールを統合する (AWS Transfer Family など)。<\/li><li>スキル 2.1.5: データ移行またはリモートアクセス方法を実装する (Amazon Redshift フェデレーテッドクエリ、Amazon Redshift マテリアライズドビュー、Amazon Redshift Spectrum など)。<\/li><li>スキル 2.1.6: ロックを管理してデータへのアクセスを防ぐ (Amazon Redshift、Amazon RDS など)。<\/li><li>スキル 2.1.7: オープンテーブルフォーマットを管理する (Apache Iceberg など)。<\/li><li>スキル 2.1.8: ベクトルインデックスのタイプについて説明する (HNSW、IVF など)。<\/li><\/ul>", "<h3>タスク 2.2: データカタログシステムの理解<\/h3>\n<ul><li>スキル 2.2.1: データカタログを使用してデータソースのデータを利用する。<\/li><li>スキル 2.2.2: 技術データカタログを構築および参照する (AWSGlue Data Catalog、Apache Hive メタストアなど) 。<\/li><li>スキル 2.2.3: スキーマを検索し、AWS Glue クローラーを使用してデータカタログに入力する。<\/li><li>スキル 2.2.4: パーティションとデータカタログを同期する。<\/li><li>スキル 2.2.5: カタログ用の新しいソース接続またはターゲット接続を作成する (AWS Glue など)。<\/li><li>スキル 2.2.6: ビジネスデータカタログを作成および管理する (Amazon SageMaker Catalog など)。<\/li><\/ul>", "<h3>タスク 2.3: データのライフサイクルの管理<\/h3>\n<ul><li>スキル 2.3.1: Amazon S3 と Amazon Redshift の間でデータを移動するためのロードおよびアンロード操作を実行する。<\/li><li>スキル 2.3.2: S3 データのストレージ階層を変更するための S3 ライフサイクルポリシーを管理する。<\/li><li>スキル 2.3.3: S3 ライフサイクルポリシーを使用して特定の期限に達したデータを無効化する。<\/li><li>スキル 2.3.4: S3 バージョニングと DynamoDB TTL を管理する。<\/li><li>スキル 2.3.5: ビジネス要件および法的要件を満たすためにデータを削除する。<\/li><li>スキル 2.3.6: 適切なレジリエンスと可用性でデータを保護する。<\/li><\/ul>", "<h3>タスク 2.4: データモデルとスキーマの進化の設計<\/h3>\n<ul><li>スキル 2.4.1: Amazon Redshift、DynamoDB、Lake Formation のスキーマを設計する。<\/li><li>スキル 2.4.2: データ特性の変化に対処する。<\/li><li>スキル 2.4.3: スキーマ変換を実行する (AWS SCT や AWS DMS Schema Conversion の使用など)。<\/li><li>スキル 2.4.4: AWS ツール (Amazon SageMaker ML Lineage Tracking、Amazon SageMaker Catalog など) を使用してデータリネージュを確立する。<\/li><li>スキル 2.4.5: インデックス作成、パーティショニング戦略、圧縮、その他のデータ最適化手法のベストプラクティスについて説明する。<\/li><li>スキル 2.4.6: ベクトル化の概念 (Amazon Bedrock ナレッジベースなど) について説明する。<\/li><\/ul>"]}, {"n": "9", "title": "コンテンツ分野 3: データ運用とサポート", "secs": ["", "<h3>タスク 3.1: AWSサービスを使用したデータ処理の自動化<\/h3>\n<ul><li>スキル 3.1.1: データパイプラインをオーケストレーションする [Amazon Managed Workflows for Apache Airflow (Amazon MWAA)、AWS Step Functions など]。<\/li><li>スキル 3.1.2: Amazon マネージドワークフローをトラブルシューティングする。<\/li><li>スキル 3.1.3: SDK を呼び出してコードから Amazon の機能にアクセスする。<\/li><li>スキル 3.1.4: AWS サービスの機能を使用してデータを処理する (Amazon EMR、Amazon Redshift、AWS Glue など)。<\/li><li>スキル 3.1.5: データ API を利用および管理する。<\/li><li>スキル 3.1.6: 変換対象のデータを準備する (AWSGlue DataBrew、Amazon SageMaker Unified Studio など)。<\/li><li>スキル 3.1.7: データをクエリする (Amazon Athena など)。<\/li><li>スキル 3.1.8: AWS Lambda を使用してデータ処理を自動化する。<\/li><li>スキル 3.1.9: イベントとスケジューラを管理する (Amazon EventBridge など)。<\/li><\/ul>", "<h3>タスク 3.2: AWS サービスを使用したデータ分析<\/h3>\n<ul><li>スキル 3.2.1: AWS のサービスおよびツール (DataBrew、Amazon QuickSight など) を使用してデータを視覚化する。<\/li><li>スキル 3.2.2: データを検証およびクリーニングする (Lambda、Athena、QuickSight、Jupyter Notebook、Amazon SageMaker Data Wrangler など)。<\/li><li>スキル 3.2.3: Amazon Redshift と Athena の SQL を使用してデータのクエリやビューの作成を行う。<\/li><li>スキル 3.2.4: Apache Spark 対応の Athena ノートブックを使用してデータを探索する。<\/li><li>スキル 3.2.5: プロビジョニングされたサービスとサーバーレスサービスのトレードオフについて説明する。<\/li><li>スキル 3.2.6: データ集約、移動平均、グループ化、ピボットを定義する。<\/li><\/ul>", "<h3>タスク 3.3: データパイプラインの保守とモニタリング<\/h3>\n<ul><li>スキル 3.3.1: 監査用のログを抽出する。<\/li><li>スキル 3.3.2: 監査とトレーサビリティを促進するためのログ記録およびモニタリングソリューションをデプロイする。<\/li><li>スキル 3.3.3: モニタリング中に通知を使用してアラートを送信する。<\/li><li>スキル 3.3.4: パフォーマンスの問題をトラブルシューティングする。<\/li><li>スキル 3.3.5: AWS CloudTrail を使用して API コールを追跡する。<\/li><li>スキル 3.3.6: パイプラインのトラブルシューティングとメンテナンスを行う (AWSGlue、Amazon EMR など)。<\/li><li>スキル 3.3.7: Amazon CloudWatch Logs を使用してアプリケーションデータをログに記録する (設定とオートメーションに重点を置く)。<\/li><li>スキル 3.3.8: AWS サービスを使用してログを分析する (Athena、Amazon EMR、Amazon OpenSearch Service、CloudWatch Logs Insights、ビッグデータアプリケーションログなど)。<\/li><\/ul>", "<h3>タスク 3.4: データ品質の確保<\/h3>\n<ul><li>スキル 3.4.1: データ処理時にデータ品質チェックを実行する (空のフィールドのチェックなど)。<\/li><li>スキル 3.4.2: データ品質ルールを定義する (DataBrew など)。<\/li><li>スキル 3.4.3: データの一貫性を調査する (DataBrew など)。<\/li><li>スキル 3.4.4: データサンプリング手法を説明する。<\/li><li>スキル 3.4.5: データスキューメカニズムを実装する。<\/li><\/ul>"]}, {"n": "10", "title": "コンテンツ分野 4: データセキュリティとガバナンス", "secs": ["", "<h3>タスク 4.1: 認証メカニズムの適用<\/h3>\n<ul><li>スキル 4.1.1: VPC セキュリティグループを更新する。<\/li><li>スキル 4.1.2: IAM グループ、ロール、エンドポイント、サービスを作成および更新する。<\/li><li>スキル 4.1.3: パスワード管理用の認証情報を作成およびローテーションする (AWSSecrets Manager など)。<\/li><li>スキル 4.1.4: アクセス用の IAM ロールをセットアップする (AWS Lambda、Amazon API Gateway、AWS CLI、AWS CloudFormation など)。<\/li><li>スキル 4.1.5: ロール、エンドポイント、サービスに IAM ポリシーを適用する (S3 Access Points、AWS PrivateLink など)。<\/li><li>スキル 4.1.6: マネージドサービスとアンマネージドサービスの違いを説明する。<\/li><li>スキル 4.1.7: SageMaker Unified Studio のドメイン、ドメインユニット、プロジェクトを使用する。<\/li><\/ul>", "<h3>タスク 4.2: 認可メカニズムの適用<\/h3>\n<ul><li>スキル 4.2.1: マネージドポリシーがニーズを満たさない場合のカスタム IAM ポリシーを作成する。<\/li><li>スキル 4.2.2: アプリケーションとデータベースの認証情報を保管する (Secrets Manager、AWS Systems Manager Parameter Store など)。<\/li><li>スキル 4.2.3: データベースユーザー、グループ、ロールにデータベースへのアクセス権と権限を付与する (Amazon Redshift など)。<\/li><li>スキル 4.2.4: AWS Lake Formation を通じてアクセス許可を管理する (Amazon Redshift、Amazon EMR、Amazon Athena、Amazon S3 用)。<\/li><li>スキル 4.2.5: ビジネスニーズに対応する認可方法 (ロールベース、タグベース、属性ベース) を適用する。<\/li><li>スキル 4.2.6: 最小権限の原則を満たすカスタムポリシーを構成する。<\/li><\/ul>", "<h3>タスク 4.3: データ暗号化とマスキングの実行<\/h3>\n<ul><li>スキル 4.3.1: コンプライアンス法または企業ポリシーに従ってデータマスキングと匿名化を適用する。<\/li><li>スキル 4.3.2: 暗号化キーを使用してデータを暗号化または復号する (AWS KMS など)。<\/li><li>スキル 4.3.3: AWS アカウントの境界を越えて暗号化を設定する。<\/li><li>スキル 4.3.4: データの転送中または転送前に暗号化を有効にする。<\/li><\/ul>", "<h3>タスク 4.4: 監査用のログの準備<\/h3>\n<ul><li>スキル 4.4.1: AWS CloudTrail を使用して API コールを追跡する。<\/li><li>スキル 4.4.2: Amazon CloudWatch Logs を使用してアプリケーションログを保存する。<\/li><li>スキル 4.4.3: 一元化されたログのクエリに AWS CloudTrail Lake を使用する。<\/li><li>スキル 4.4.4: AWS サービスを使用してログを分析する (Athena、CloudWatch Logs Insights、Amazon OpenSearch Service など)。<\/li><li>スキル 4.4.5: ログの記録のためにさまざまな AWS サービスを統合する (大容量ログデータの場合に Amazon EMR を使用するなど)。<\/li><\/ul>", "<h3>タスク 4.5: データプライバシーとガバナンスの理解<\/h3>\n<ul><li>スキル 4.5.1: データ共有のアクセス許可を付与する (Amazon Redshift のデータ共有など)。<\/li><li>スキル 4.5.2: PII 識別を実装する (Amazon Macie と Lake Formation など)。<\/li><li>スキル 4.5.3: 許可されていない AWS リージョンへのデータのバックアップやレプリケーションを防ぐためのデータプライバシー戦略を実装する。<\/li><li>スキル 4.5.4: アカウントで発生した設定変更を表示する (AWS Config など)。<\/li><li>スキル 4.5.5: データ主権を維持する。<\/li><li>スキル 4.5.6: Amazon SageMaker Catalog プロジェクトを通じてデータアクセスを管理する。<\/li><li>スキル 4.5.7: ガバナンスデータフレームワークとデータ共有パターンについて説明する。<\/li><\/ul>"]}, {"n": "11", "title": "対象の AWS サービス", "secs": ["<p>以下に、AWS Certified Data Engineer - Associate (DEA-C01) 試験の対象となる AWS のサービスと機能のリストを示します。このリストはすべてを網羅しているわけではなく、また、変更される場合もあります。AWS のサービスは、サービスの主要機能に沿ったカテゴリに分類されています。<\/p>", "<h3>分析<\/h3>\n<ul><li>Amazon Athena<\/li><li>Amazon EMR<\/li><li>AWS Glue<\/li><li>AWS Glue DataBrew<\/li><li>AWS Lake Formation<\/li><li>Amazon Kinesis Data Firehose<\/li><li>Amazon Kinesis Data Streams<\/li><li>Amazon Managed Service for Apache Flink<\/li><li>Amazon Managed Streaming for Apache Kafka (Amazon MSK)<\/li><li>Amazon OpenSearch Service<\/li><li>Amazon Quick<\/li><li>Amazon SageMaker AI<\/li><\/ul>", "<h3>アプリケーション統合<\/h3>\n<ul><li>Amazon AppFlow<\/li><li>Amazon EventBridge<\/li><li>Amazon Managed Workflows for Apache Airflow (Amazon MWAA)<\/li><li>Amazon SNS<\/li><li>Amazon SQS<\/li><li>AWS Step Functions<\/li><\/ul>", "<h3>クラウド財務管理<\/h3>\n<ul><li>AWS Budgets<\/li><li>AWS Cost Explorer<\/li><\/ul>", "<h3>コンピューティング<\/h3>\n<ul><li>AWS Batch<\/li><li>Amazon EC2<\/li><li>AWS Lambda<\/li><li>AWS SAM<\/li><\/ul>", "<h3>コンテナ<\/h3>\n<ul><li>Amazon ECR<\/li><li>Amazon ECS<\/li><li>Amazon EKS<\/li><\/ul>", "<h3>データベース<\/h3>\n<ul><li>Amazon DocumentDB<\/li><li>Amazon DynamoDB<\/li><li>Amazon Keyspaces<\/li><li>Amazon MemoryDB for Redis<\/li><li>Amazon Neptune<\/li><li>Amazon RDS<\/li><li>Amazon Aurora<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>デベロッパーツール<\/h3>\n<ul><li>AWS CLI<\/li><li>AWS CloudFormation<\/li><li>AWS CDK<\/li><li>AWS CodeBuild<\/li><li>AWS CodeDeploy<\/li><li>AWS CodePipeline<\/li><li>Amazon Q<\/li><\/ul>", "<h3>ウェブとモバイル<\/h3>\n<ul><li>Amazon API Gateway<\/li><\/ul>", "<h3>機械学習<\/h3>\n<ul><li>Amazon SageMaker AI<\/li><li>Amazon Bedrock<\/li><li>Amazon Kendra<\/li><\/ul>", "<h3>マネジメントとガバナンス<\/h3>\n<ul><li>AWS CloudTrail<\/li><li>Amazon CloudWatch<\/li><li>Amazon CloudWatch Logs<\/li><li>AWS Config<\/li><li>Amazon Managed Grafana<\/li><li>AWS Systems Manager<\/li><li>AWS Well-Architected Tool<\/li><li>AWS Data Exchange<\/li><\/ul>", "<h3>移行と転送<\/h3>\n<ul><li>AWS Application Discovery Service<\/li><li>AWS Application Migration Service<\/li><li>AWS DMS<\/li><li>AWS DataSync<\/li><li>AWS Snow Family<\/li><li>AWS Transfer Family<\/li><\/ul>", "<h3>ネットワークとコンテンツ配信<\/h3>\n<ul><li>Amazon CloudFront<\/li><li>AWS PrivateLink<\/li><li>Amazon Route 53<\/li><li>Amazon VPC<\/li><\/ul>", "<h3>セキュリティ、アイデンティティ、コンプライアンス<\/h3>\n<ul><li>IAM<\/li><li>AWS KMS<\/li><li>Amazon Macie<\/li><li>AWS Secrets Manager<\/li><li>AWS Shield<\/li><li>AWS WAF<\/li><\/ul>", "<h3>ストレージ<\/h3>\n<ul><li>AWS Backup<\/li><li>Amazon EBS<\/li><li>Amazon EFS<\/li><li>Amazon S3<\/li><li>Amazon S3 Tables<\/li><li>Amazon S3 Glacier<\/li><li>Amazon S3 Tables<\/li><\/ul>"]}, {"n": "12", "title": "対象外の AWS サービス", "secs": ["<p>以下に、試験対象外の AWS のサービスと機能のリストを示します。このリストはすべてを網羅しているわけではなく、また、変更される場合もあります。試験の対象となる職種内容にまったく関係のない AWS サービスは、このリストから除外されています。<\/p>", "<h3>分析<\/h3>\n<ul><li>Amazon FinSpace<\/li><\/ul>", "<h3>ビジネスアプリケーション<\/h3>\n<ul><li>Alexa for Business<\/li><li>Amazon Chime<\/li><li>Amazon Connect<\/li><li>AWS IQ<\/li><li>Amazon WorkMail<\/li><\/ul>", "<h3>コンピューティング<\/h3>\n<ul><li>AWS App Runner<\/li><li>AWS Elastic Beanstalk<\/li><li>Amazon Lightsail<\/li><li>AWS Outposts<\/li><li>AWS Serverless Application Repository<\/li><\/ul>", "<h3>コンテナ<\/h3>\n<ul><li>Red Hat OpenShift Service on AWS (ROSA)<\/li><\/ul>", "<h3>デベロッパーツール<\/h3>\n<ul><li>AWS Fault Injection Simulator (AWS FIS)<\/li><li>AWS X-Ray<\/li><\/ul>", "<h3>フロントエンドのウェブとモバイル<\/h3>\n<ul><li>AWS Amplify<\/li><li>AWS AppSync<\/li><li>AWS Device Farm<\/li><li>Amazon Location Service<\/li><li>Amazon Pinpoint<\/li><li>Amazon SES<\/li><\/ul>", "<h3>IoT (モノのインターネット)<\/h3>\n<ul><li>FreeRTOS<\/li><li>AWS IoT 1-Click<\/li><li>AWS IoT Device Defender<\/li><li>AWS IoT Device Management<\/li><li>AWS IoT Events<\/li><li>AWS IoT FleetWise<\/li><li>AWS IoT RoboRunner<\/li><li>AWS IoT SiteWise<\/li><li>AWS IoT TwinMaker<\/li><\/ul>", "<h3>機械学習<\/h3>\n<ul><li>Amazon DevOps Guru<\/li><\/ul>", "<h3>マネジメントとガバナンス<\/h3>\n<ul><li>AWS Activate<\/li><li>AWS Managed Services (AMS)<\/li><\/ul>", "<h3>メディアサービス<\/h3>\n<ul><li>Amazon Elastic Transcoder<\/li><li>AWS Elemental アプライアンスとソフトウェア<\/li><li>AWS Elemental MediaConnect<\/li><li>AWS Elemental MediaConvert<\/li><li>AWS Elemental MediaLive<\/li><li>AWS Elemental MediaPackage<\/li><li>AWS Elemental MediaStore<\/li><li>AWS Elemental MediaTailor<\/li><li>Amazon Interactive Video Service (Amazon IVS)<\/li><li>Amazon Nimble Studio<\/li><\/ul>", "<h3>移行と転送<\/h3>\n<ul><li>AWS Mainframe Modernization<\/li><li>AWS Migration Hub<\/li><\/ul>", "<h3>ストレージ<\/h3>\n<ul><li>EC2 Image Builder<\/li><\/ul>"]}, {"n": "13", "title": "改訂", "secs": ["<p>AWS 試験ガイドは、各認定試験において認定対象となる職務に関連する AWS のサービスおよび機能を確認し、スキルをテストするために、定期的に見直され、更新されています。試験ガイドの更新版は、更新内容が試験に反映される約 1 か月前に公開されます。<\/p>", "<h3>変更履歴<\/h3>\n<table><thead><tr><th>バージョン<\/th><th>公開日<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>これは初版です。<\/td><\/tr><tr><td>1.1<\/td><td>2025 年 12 月 12 日<\/td><\/tr><\/tbody><\/table>\n<p>試験ガイドのバージョン 1.0 で別々に記載されていた知識とスキルは、タスクごとの 1 つのスキルリストにまとめられています。バージョン 1.0 で既存のスキルと重複していた知識項目は、バージョン 1.1 で削除されました。<\/p>", "<h3>知識とスキルの変更点<\/h3>\n<table><thead><tr><th>バージョン 1.1<\/th><th>バージョン 1.0<\/th><\/tr><\/thead><tbody><tr><td>スキル 1.4.8: 反復可能なリソースデプロイのために Infrastructure as Code (IaC) を使用する [AWS CloudFormation、AWSCloud Development Kit (AWS CDK) など]。<\/td><td>対象知識: 反復可能なデプロイのための Infrastructure as Code (IaC) [AWS Cloud Development Kit (AWS CDK)、AWS CloudFormation など]<\/td><\/tr><tr><td>スキル 2.1.3: ストレージサービスを適切なユースケースに適用する (HNSW などのインデックス作成アルゴリズムと Amazon Aurora PostgreSQL の使用、キーと値のペアに迅速にアクセスするための Amazon MemoryDB の使用など)。<\/td><td>対象スキル: 適切なユースケースへのストレージサービスの適用 (Amazon S3 など)<\/td><\/tr><tr><td>スキル 2.2.2: 技術データカタログを構築および参照する (AWSGlue Data Catalog、Apache Hive メタストアなど) 。<\/td><td>対象スキル: データカタログの構築と参照 (AWS Glue Data Catalog、Apache Hive メタストアなど)<\/td><\/tr><tr><td>スキル 2.4.4: AWSツール (Amazon SageMaker ML Lineage Tracking、Amazon SageMaker Catalog など) を使用してデータリネージュを確立する。<\/td><td>対象スキル: AWS ツール (Amazon SageMaker ML Lineage Tracking など) を使用したデータリネージュの確立<\/td><\/tr><tr><td>スキル 3.1.6: 変換対象のデータを準備する (AWSGlue DataBrew、Amazon SageMaker Unified Studio など)。<\/td><td>対象スキル: データ変換の準備 (AWS Glue DataBrew など)<\/td><\/tr><tr><td>スキル 3.2.3: Redshift と Athena の SQL を使用してデータのクエリやビューの作成を行う。<\/td><td>対象スキル: Athena を使用したデータのクエリやビューの作成<\/td><\/tr><tr><td>スキル 4.2.5: ビジネスニーズに対応する認可方法 (ロールベース、タグベース、属性ベース) を適用する。<\/td><td>対象知識: 認可方法 (ロールベース、ポリシーベース、タグベース、属性ベース)<\/td><\/tr><tr><td>スキル 4.2.6: 最小権限の原則を満たすカスタムポリシーを構成する。<\/td><td>対象知識: AWS セキュリティに適用される最小権限の原則<\/td><\/tr><tr><td>スキル 4.3.4: データの転送中または転送前に暗号化を有効にする。<\/td><td>対象スキル: 転送中のデータの暗号化の有効化<\/td><\/tr><tr><td>スキル 4.5.4: アカウントで発生した設定変更を表示する (AWS Config など)。<\/td><td>対象スキル: アカウントで発生した設定変更の管理 (AWS Config など)<\/td><\/tr><tr><td>スキル 4.5.5: データ主権を維持する。<\/td><td>対象知識: データ主権<\/td><\/tr><\/tbody><\/table>", "<h3>追加された新しいスキル<\/h3>\n<ul><li>スキル 1.2.10: データ処理のために大規模言語モデル (LLM) を統合する。<\/li><li>スキル 2.1.7: オープンテーブルフォーマットを管理する (Apache Iceberg など)。<\/li><li>スキル 2.1.8: ベクトルインデックスのタイプについて説明する (HNSW、IVF など)。<\/li><li>スキル 2.2.6: ビジネスデータカタログを作成および管理する (Amazon SageMaker Catalog など)。<\/li><li>スキル 2.4.6: ベクトル化の概念 (Amazon Bedrock ナレッジベースなど) について説明する。<\/li><li>スキル 4.1.7: SageMaker Unified Studio のドメイン、ドメインユニット、プロジェクトを使用する。<\/li><li>スキル 4.5.6: Amazon SageMaker Catalog プロジェクトを通じてデータアクセスを管理する。<\/li><li>スキル 4.5.7: ガバナンスデータフレームワークとデータ共有パターンについて説明する。<\/li><\/ul>", "<h3>削除されたスキル<\/h3>\n<p>バージョン 1.1 では、既存のスキルで既にカバーされていた知識項目以外に削除された知識やスキルはありません。<\/p>", "<h3>対象および対象外のサービスの変更点<\/h3>", "<h4>対象リストに追加されたサービス<\/h4>\n<ul><li>Amazon Aurora<\/li><li>Amazon Q<\/li><li>Amazon Bedrock<\/li><li>Amazon Kendra<\/li><li>AWS Data Exchange<\/li><li>Amazon S3 Tables<\/li><\/ul>", "<h4>対象リストから削除されたサービス<\/h4>\n<ul><li>AWS Cloud9<\/li><li>AWS CodeCommit<\/li><li>AWS Schema Conversion Tool (AWS SCT)<\/li><\/ul>", "<h4>対象外リストに追加されたサービス<\/h4>\n<p>対象外リストに追加されたサービスはありません。<\/p>", "<h4>対象外リストから削除されたサービス (すべてサービスの変更または廃止のため)<\/h4>\n<ul><li>Amazon Honeycode<\/li><li>Amazon WorkDocs<\/li><li>Amazon Timestream<\/li><li>Amazon CodeWhisperer<\/li><\/ul>"]}, {"n": "14", "title": "アンケート", "secs": ["<p>この試験ガイドはどの程度役に立ちましたか。ご意見をお待ちしています。<a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=DE-Associate&amp;course_id=DEA-C01&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">アンケートへの回答<\/a>にご協力ください。<\/p>"]}]}, "en": {"title": "AWS Certified Data Engineer - Associate (DEA-C01)", "note": ["Source: https://docs.aws.amazon.com/aws-certification/latest/data-engineer-associate-01/data-engineer-associate-01.html (retrieved 2026-11-07)"], "ch": [{"n": "1", "title": "AWS Certified Data Engineer - Associate (DEA-C01)", "secs": ["<p>The AWS Certified Data Engineer - Associate (DEA-C01) exam validates a candidate's ability to implement data pipelines and to monitor, troubleshoot, and optimize cost and performance issues in accordance with best practices.<\/p>\n<p><strong>Note:<\/strong> AWS exam guides are periodically reviewed and revised to ensure that each certification exam tests skills and AWS services and features that are current and relevant for the job role(s) that the certification is designed to target. Exam guide revisions will be published at least one month before changes are reflected on your exam. Check the Revisions section for a summary of changes.<\/p>"]}, {"n": "2", "title": "Introduction", "secs": ["<p>The <a href=\"https://aws.amazon.com/certification/certified-data-engineer-associate/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Certified Data Engineer - Associate (DEA-C01)<\/a> exam validates a candidate's ability to implement data pipelines and to monitor, troubleshoot, and optimize cost and performance issues in accordance with best practices.<\/p>\n<p>The exam also validates a candidate's ability to complete the following tasks:<\/p>\n<ul><li>Ingest and transform data, and orchestrate data pipelines while applying programming concepts.<\/li><li>Choose an optimal data store, design data models, catalog data schemas, and manage data lifecycles.<\/li><li>Operationalize, maintain, and monitor data pipelines. Analyze data and ensure data quality.<\/li><li>Implement appropriate authentication, authorization, data encryption, privacy, and governance. Enable logging.<\/li><\/ul>"]}, {"n": "3", "title": "Target Candidate Description", "secs": ["<p>The target candidate should have the equivalent of 2–3 years of experience in data engineering. The target candidate should understand the effects of volume, variety, and velocity on data ingestion, transformation, modeling, security, governance, privacy, schema design, and optimal data store design. Additionally, the target candidate should have at least 1–2 years of hands-on experience with AWS services.<\/p>", "<h3>Recommended general IT knowledge<\/h3>\n<p>The target candidate should have the following general IT knowledge:<\/p>\n<ul><li>Setup and maintenance of extract, transform, and load (ETL) pipelines from ingestion to destination<\/li><li>Application of high-level but language-agnostic programming concepts as required by the pipeline<\/li><li>How to use Git commands for source control<\/li><li>How to use data lakes to store data<\/li><li>General concepts for networking, storage, and compute<\/li><li>General concepts of vectors<\/li><\/ul>", "<h3>Recommended AWS knowledge<\/h3>\n<p>The target candidate should have the following AWS knowledge:<\/p>\n<ul><li>How to use AWS services to accomplish the tasks listed in the Introduction section of this exam guide<\/li><li>An understanding of the AWS services for encryption, governance, protection, and logging of all data that is part of data pipelines<\/li><li>The ability to compare AWS services to understand the cost, performance, and functional differences between services<\/li><li>How to structure SQL queries and how to run SQL queries on AWS services<\/li><li>An understanding of how to analyze data, verify data quality, and ensure data consistency by using AWS services<\/li><\/ul>", "<h3>Job tasks that are out of scope for the target candidate<\/h3>\n<p>The following list contains job tasks that the target candidate is not expected to be able to perform. This list is non-exhaustive. These tasks are out of scope for the exam:<\/p>\n<ul><li>Perform ML training and inferences.<\/li><li>Demonstrate knowledge of programming language-specific syntax.<\/li><li>Draw business conclusions based on data.<\/li><\/ul>"]}, {"n": "4", "title": "Exam content", "secs": ["", "<h3>Response types<\/h3>\n<p>There are two types of questions on the exam:<\/p>\n<ul><li><strong>Multiple choice:<\/strong> Has one correct response and three incorrect responses (distractors)<\/li><li><strong>Multiple response:<\/strong> Has two or more correct responses out of five or more response options<\/li><\/ul>\n<p>Select one or more responses that best complete the statement or answer the question. Distractors, or incorrect answers, are response options that a candidate with incomplete knowledge or skill might choose. Distractors are generally plausible responses that match the content area.<\/p>\n<p>Unanswered questions are scored as incorrect; there is no penalty for guessing. The exam includes 50 questions that affect your score.<\/p>", "<h3>Unscored content<\/h3>\n<p>The exam includes 15 unscored questions that do not affect your score. AWS collects information about performance on these unscored questions to evaluate these questions for future use as scored questions. These unscored questions are not identified on the exam.<\/p>", "<h3>Exam results<\/h3>\n<p>The AWS Certified Data Engineer - Associate (DEA-C01) exam has a pass or fail designation. The exam is scored against a minimum standard established by AWS professionals who follow certification industry best practices and guidelines.<\/p>\n<p>Your results for the exam are reported as a scaled score of 100–1,000. The minimum passing score is 720. Your score shows how you performed on the exam as a whole and whether you passed. Scaled scoring models help equate scores across multiple exam forms that might have slightly different difficulty levels.<\/p>\n<p>Your score report could contain a table of classifications of your performance at each section level. The exam uses a compensatory scoring model, which means that you do not need to achieve a passing score in each section. You need to pass only the overall exam.<\/p>\n<p>Each section of the exam has a specific weighting, so some sections have more questions than other sections have. The table of classifications contains general information that highlights your strengths and weaknesses. Use caution when you interpret section-level feedback.<\/p>"]}, {"n": "5", "title": "Content outline", "secs": ["<p>This exam guide includes weightings, content domains, and task statements for the exam. This guide does not provide a comprehensive list of the content on the exam. However, additional context for each task statement is available to help you prepare for the exam.<\/p>\n<p>The exam has the following content domains and weightings:<\/p>\n<ul><li>Content Domain 1: Data Ingestion and Transformation (34% of scored content)<\/li><li>Content Domain 2: Data Store Management (26% of scored content)<\/li><li>Content Domain 3: Data Operations and Support (22% of scored content)<\/li><li>Content Domain 4: Data Security and Governance (18% of scored content)<\/li><\/ul>"]}, {"n": "6", "title": "AWS Services for the Exam", "secs": ["<p>The AWS Certified Data Engineer - Associate exam covers specific AWS services that are relevant to data engineers. Understanding which services are in scope can help you focus your preparation efforts.<\/p>\n<p>For detailed information about the AWS services covered in the exam, see the following section:<\/p>\n<ul><li>In-Scope AWS Services<\/li><\/ul>"]}, {"n": "7", "title": "Content Domain 1: Data Ingestion and Transformation", "secs": ["", "<h3>Task 1.1: Perform data ingestion<\/h3>\n<ul><li>Skill 1.1.1: Read data from streaming sources (for example, Amazon Kinesis, Amazon Managed Streaming for Apache Kafka [Amazon MSK], Amazon DynamoDB Streams, AWS DMS, AWS Glue, Amazon Redshift).<\/li><li>Skill 1.1.2: Read data from batch sources (for example, Amazon S3, AWS Glue, Amazon EMR, AWS DMS, Amazon Redshift, AWS Lambda, Amazon AppFlow).<\/li><li>Skill 1.1.3: Implement appropriate configuration options for batch ingestion.<\/li><li>Skill 1.1.4: Consume data APIs.<\/li><li>Skill 1.1.5: Set up schedulers by using Amazon EventBridge, Apache Airflow, or time-based schedules for jobs and crawlers.<\/li><li>Skill 1.1.6: Set up event triggers (for example, Amazon S3 Event Notifications, EventBridge).<\/li><li>Skill 1.1.7: Call a Lambda function from Kinesis.<\/li><li>Skill 1.1.8: Create allowlists for IP addresses to allow connections to data sources.<\/li><li>Skill 1.1.9: Implement throttling and overcoming rate limits (for example, DynamoDB, Amazon RDS, Kinesis).<\/li><li>Skill 1.1.10: Manage fan-in and fan-out for streaming data distribution.<\/li><li>Skill 1.1.11: Describe replayability of data ingestion pipelines.<\/li><li>Skill 1.1.12: Define stateful and stateless data transactions.<\/li><\/ul>", "<h3>Task 1.2: Transform and process data<\/h3>\n<ul><li>Skill 1.2.1: Optimize container usage for performance needs (for example, Amazon EKS, Amazon ECS).<\/li><li>Skill 1.2.2: Connect to different data sources (for example, Java Database Connectivity [JDBC], Open Database Connectivity [ODBC]).<\/li><li>Skill 1.2.3: Integrate data from multiple sources.<\/li><li>Skill 1.2.4: Optimize costs while processing data.<\/li><li>Skill 1.2.5: Implement data transformation services based on requirements (for example, Amazon EMR, AWS Glue, Lambda, Amazon Redshift).<\/li><li>Skill 1.2.6: Transform data between formats (for example, from .csv to Apache Parquet).<\/li><li>Skill 1.2.7: Troubleshoot and debug common transformation failures and performance issues.<\/li><li>Skill 1.2.8: Create data APIs to make data available to other systems by using AWS services.<\/li><li>Skill 1.2.9: Define volume, velocity, and variety of data (for example, structured data, unstructured data).<\/li><li>Skill 1.2.10: Integrate large language models (LLMs) for data processing.<\/li><\/ul>", "<h3>Task 1.3: Orchestrate data pipelines<\/h3>\n<ul><li>Skill 1.3.1: Use orchestration services to build workflows for data ETL pipelines (for example, Lambda, EventBridge, Amazon Managed Workflows for Apache Airflow [Amazon MWAA], AWS Step Functions, AWS Glue workflows).<\/li><li>Skill 1.3.2: Build data pipelines for performance, availability, scalability, resiliency, and fault tolerance.<\/li><li>Skill 1.3.3: Implement and maintain serverless workflows.<\/li><li>Skill 1.3.4: Use notification services to send alerts (for example, Amazon SNS, Amazon SQS).<\/li><\/ul>", "<h3>Task 1.4: Apply programming concepts<\/h3>\n<ul><li>Skill 1.4.1: Optimize code to reduce runtime for data ingestion and transformation.<\/li><li>Skill 1.4.2: Configure Lambda functions to meet concurrency and performance needs.<\/li><li>Skill 1.4.3: Use programming languages and frameworks for data engineering (for example, Python, SQL, Scala, R, Java, Bash, PowerShell).<\/li><li>Skill 1.4.4: Use software engineering best practices for data engineering (for example, version control, testing, logging, monitoring).<\/li><li>Skill 1.4.5: Use Infrastructure as Code (IaC) to deploy data engineering solutions.<\/li><li>Skill 1.4.6: Use AWS SAM to package and deploy serverless data pipelines (for example, Lambda functions, Step Functions, DynamoDB tables).<\/li><li>Skill 1.4.7: Use and mount storage volumes from within Lambda functions.<\/li><li>Skill 1.4.8: Use infrastructure as code (IaC) for repeatable resource deployment (for example, AWS CloudFormation and AWS CDK).<\/li><li>Skill 1.4.9: Describe continuous integration and continuous delivery (CI/CD) (implementation, testing, and deployment of data pipelines).<\/li><li>Skill 1.4.10: Define distributed computing.<\/li><li>Skill 1.4.11: Describe data structures and algorithms (for example, graph data structures and tree data structures).<\/li><\/ul>"]}, {"n": "8", "title": "Content Domain 2: Data Store Management", "secs": ["", "<h3>Task 2.1: Choose a data store<\/h3>\n<ul><li>Skill 2.1.1: Implement the appropriate storage services for specific cost and performance requirements (for example, Amazon Redshift, Amazon EMR, AWS Lake Formation, Amazon RDS, Amazon DynamoDB, Amazon Kinesis Data Streams, Amazon Managed Streaming for Apache Kafka [Amazon MSK]).<\/li><li>Skill 2.1.2: Configure the appropriate storage services for specific access patterns and requirements (for example, Amazon Redshift, Amazon EMR, Lake Formation, Amazon RDS, DynamoDB).<\/li><li>Skill 2.1.3: Apply storage services to appropriate use cases (for example, using indexing algorithms like Hierarchical Navigable Small Worlds [HNSW] with Amazon Aurora PostgreSQL and using Amazon MemoryDB for fast key/value pair access).<\/li><li>Skill 2.1.4: Integrate migration tools into data processing systems (for example, AWS Transfer Family).<\/li><li>Skill 2.1.5: Implement data migration or remote access methods (for example, Amazon Redshift federated queries, Amazon Redshift materialized views, Amazon Redshift Spectrum).<\/li><li>Skill 2.1.6: Manage locks to prevent access to data (for example, Amazon Redshift, Amazon RDS).<\/li><li>Skill 2.1.7: Manage open table formats (for example Apache Iceberg).<\/li><li>Skill 2.1.8: Describe vector index types (for example, HNSW, IVF).<\/li><\/ul>", "<h3>Task 2.2: Understand data cataloging systems<\/h3>\n<ul><li>Skill 2.2.1: Use data catalogs to consume data from the data's source.<\/li><li>Skill 2.2.2: Build and reference a technical data catalog (for example, AWS Glue Data Catalog, Apache Hive metastore).<\/li><li>Skill 2.2.3: Discover schemas and use AWS Glue crawlers to populate data catalogs.<\/li><li>Skill 2.2.4: Synchronize partitions with a data catalog.<\/li><li>Skill 2.2.5: Create new source or target connections for cataloging (for example, AWS Glue).<\/li><li>Skill 2.2.6: Create and manage business data catalogs (for example, Amazon SageMaker Catalog).<\/li><\/ul>", "<h3>Task 2.3: Manage the lifecycle of data<\/h3>\n<ul><li>Skill 2.3.1: Perform load and unload operations to move data between Amazon S3 and Amazon Redshift.<\/li><li>Skill 2.3.2: Manage S3 Lifecycle policies to change the storage tier of S3 data.<\/li><li>Skill 2.3.3: Expire data when it reaches a specific age by using S3 Lifecycle policies.<\/li><li>Skill 2.3.4: Manage S3 versioning and DynamoDB TTL.<\/li><li>Skill 2.3.5: Delete data to meet business and legal requirements.<\/li><li>Skill 2.3.6: Protect data with appropriate resiliency and availability.<\/li><\/ul>", "<h3>Task 2.4: Design data models and schema evolution<\/h3>\n<ul><li>Skill 2.4.1: Design schemas for Amazon Redshift, DynamoDB, and Lake Formation.<\/li><li>Skill 2.4.2: Address changes to the characteristics of data.<\/li><li>Skill 2.4.3: Perform schema conversion (for example, by using AWS SCT and AWS DMS Schema Conversion).<\/li><li>Skill 2.4.4: Establish data lineage by using AWS tools (for example, Amazon SageMaker ML Lineage Tracking and Amazon SageMaker Catalog).<\/li><li>Skill 2.4.5: Describe best practices for indexing, partitioning strategies, compression, and other data optimization techniques.<\/li><li>Skill 2.4.6: Describe vectorization concepts (for example, Amazon Bedrock knowledge base).<\/li><\/ul>"]}, {"n": "9", "title": "Content Domain 3: Data Operations and Support", "secs": ["", "<h3>Task 3.1: Automate data processing by using AWS services<\/h3>\n<ul><li>Skill 3.1.1: Orchestrate data pipelines (for example, Amazon Managed Workflows for Apache Airflow [Amazon MWAA], AWS Step Functions).<\/li><li>Skill 3.1.2: Troubleshoot Amazon managed workflows.<\/li><li>Skill 3.1.3: Call SDKs to access Amazon features from code.<\/li><li>Skill 3.1.4: Use the features of AWS services to process data (for example, Amazon EMR, Amazon Redshift, AWS Glue).<\/li><li>Skill 3.1.5: Consume and maintain data APIs.<\/li><li>Skill 3.1.6: Prepare data for transformation (for example, AWS Glue DataBrew and Amazon SageMaker Unified Studio).<\/li><li>Skill 3.1.7: Query data (for example, Amazon Athena).<\/li><li>Skill 3.1.8: Use AWS Lambda to automate data processing.<\/li><li>Skill 3.1.9: Manage events and schedulers (for example, Amazon EventBridge).<\/li><\/ul>", "<h3>Task 3.2: Analyze data by using AWS services<\/h3>\n<ul><li>Skill 3.2.1: Visualize data by using AWS services and tools (for example, DataBrew, Amazon QuickSight).<\/li><li>Skill 3.2.2: Verify and clean data (for example, Lambda, Athena, QuickSight, Jupyter Notebooks, Amazon SageMaker Data Wrangler).<\/li><li>Skill 3.2.3: Use SQL in Amazon Redshift and Athena to query data or to create views.<\/li><li>Skill 3.2.4: Use Athena notebooks that use Apache Spark to explore data.<\/li><li>Skill 3.2.5: Describe tradeoffs between provisioned services and serverless services.<\/li><li>Skill 3.2.6: Define data aggregation, rolling average, grouping, and pivoting.<\/li><\/ul>", "<h3>Task 3.3: Maintain and monitor data pipelines<\/h3>\n<ul><li>Skill 3.3.1: Extract logs for audits.<\/li><li>Skill 3.3.2: Deploy logging and monitoring solutions to facilitate auditing and traceability.<\/li><li>Skill 3.3.3: Use notifications during monitoring to send alerts.<\/li><li>Skill 3.3.4: Troubleshoot performance issues.<\/li><li>Skill 3.3.5: Use AWS CloudTrail to track API calls.<\/li><li>Skill 3.3.6: Troubleshoot and maintain pipelines (for example, AWS Glue, Amazon EMR).<\/li><li>Skill 3.3.7: Use Amazon CloudWatch Logs to log application data (with a focus on configuration and automation).<\/li><li>Skill 3.3.8: Analyze logs with AWS services (for example, Athena, Amazon EMR, Amazon OpenSearch Service, CloudWatch Logs Insights, big data application logs).<\/li><\/ul>", "<h3>Task 3.4: Ensure data quality<\/h3>\n<ul><li>Skill 3.4.1: Run data quality checks while processing the data (for example, checking for empty fields).<\/li><li>Skill 3.4.2: Define data quality rules (for example, DataBrew).<\/li><li>Skill 3.4.3: Investigate data consistency (for example, DataBrew).<\/li><li>Skill 3.4.4: Describe data sampling techniques.<\/li><li>Skill 3.4.5: Implement data skew mechanisms.<\/li><\/ul>"]}, {"n": "10", "title": "Content Domain 4: Data Security and Governance", "secs": ["", "<h3>Task 4.1: Apply authentication mechanisms<\/h3>\n<ul><li>Skill 4.1.1: Update VPC security groups.<\/li><li>Skill 4.1.2: Create and update IAM groups, roles, endpoints, and services.<\/li><li>Skill 4.1.3: Create and rotate credentials for password management (for example, AWS Secrets Manager).<\/li><li>Skill 4.1.4: Set up IAM roles for access (for example, AWS Lambda, Amazon API Gateway, AWS CLI, AWS CloudFormation).<\/li><li>Skill 4.1.5: Apply IAM policies to roles, endpoints, and services (for example, S3 Access Points, AWS PrivateLink).<\/li><li>Skill 4.1.6: Describe the differences between managed services and unmanaged services.<\/li><li>Skill 4.1.7: Use domain, domain units, and projects for SageMaker Unified Studio.<\/li><\/ul>", "<h3>Task 4.2: Apply authorization mechanisms<\/h3>\n<ul><li>Skill 4.2.1: Create custom IAM policies when a managed policy does not meet the needs.<\/li><li>Skill 4.2.2: Store application and database credentials (for example, Secrets Manager, AWS Systems Manager Parameter Store).<\/li><li>Skill 4.2.3: Provide database users, groups, and roles access and authority in a database (for example, for Amazon Redshift).<\/li><li>Skill 4.2.4: Manage permissions through AWS Lake Formation (for Amazon Redshift, Amazon EMR, Amazon Athena, and Amazon S3).<\/li><li>Skill 4.2.5: Apply authorization methods that address business needs (role-based, tag-based, and attribute-based).<\/li><li>Skill 4.2.6: Construct custom policies that meet the principle of least privilege.<\/li><\/ul>", "<h3>Task 4.3: Ensure data encryption and masking<\/h3>\n<ul><li>Skill 4.3.1: Apply data masking and anonymization according to compliance laws or company policies.<\/li><li>Skill 4.3.2: Use encryption keys to encrypt or decrypt data (for example, AWS KMS).<\/li><li>Skill 4.3.3: Configure encryption across AWS account boundaries.<\/li><li>Skill 4.3.4: Enable encryption in transit or before transit for data.<\/li><\/ul>", "<h3>Task 4.4: Prepare logs for audit<\/h3>\n<ul><li>Skill 4.4.1: Use AWS CloudTrail to track API calls.<\/li><li>Skill 4.4.2: Use Amazon CloudWatch Logs to store application logs.<\/li><li>Skill 4.4.3: Use AWS CloudTrail Lake for centralized logging queries.<\/li><li>Skill 4.4.4: Analyze logs by using AWS services (for example, Athena, CloudWatch Logs Insights, Amazon OpenSearch Service).<\/li><li>Skill 4.4.5: Integrate various AWS services to perform logging (for example, Amazon EMR in cases of large volumes of log data).<\/li><\/ul>", "<h3>Task 4.5: Understand data privacy and governance<\/h3>\n<ul><li>Skill 4.5.1: Grant permissions for data sharing (for example, data sharing for Amazon Redshift).<\/li><li>Skill 4.5.2: Implement PII identification (for example, Amazon Macie with Lake Formation).<\/li><li>Skill 4.5.3: Implement data privacy strategies to prevent backups or replications of data to disallowed AWS Regions.<\/li><li>Skill 4.5.4: Viewing configuration changes that have occurred in an account (for example, AWS Config).<\/li><li>Skill 4.5.5: Maintain data sovereignty.<\/li><li>Skill 4.5.6: Manage data access through Amazon SageMaker Catalog projects.<\/li><li>Skill 4.5.7: Describe governance data framework and data sharing patterns.<\/li><\/ul>"]}, {"n": "11", "title": "In-Scope AWS Services", "secs": ["<p>The following list contains AWS services and features that are in scope for the AWS Certified Data Engineer - Associate (DEA-C01) exam. This list is non-exhaustive and is subject to change. AWS offerings appear in categories that align with the offerings' primary functions.<\/p>", "<h3>Analytics<\/h3>\n<ul><li>Amazon Athena<\/li><li>Amazon EMR<\/li><li>AWS Glue<\/li><li>AWS Glue DataBrew<\/li><li>AWS Lake Formation<\/li><li>Amazon Kinesis Data Firehose<\/li><li>Amazon Kinesis Data Streams<\/li><li>Amazon Managed Service for Apache Flink<\/li><li>Amazon Managed Streaming for Apache Kafka (Amazon MSK)<\/li><li>Amazon OpenSearch Service<\/li><li>Amazon Quick<\/li><li>Amazon SageMaker AI<\/li><\/ul>", "<h3>Application Integration<\/h3>\n<ul><li>Amazon AppFlow<\/li><li>Amazon EventBridge<\/li><li>Amazon Managed Workflows for Apache Airflow (Amazon MWAA)<\/li><li>Amazon SNS<\/li><li>Amazon SQS<\/li><li>AWS Step Functions<\/li><\/ul>", "<h3>Cloud Financial Management<\/h3>\n<ul><li>AWS Budgets<\/li><li>AWS Cost Explorer<\/li><\/ul>", "<h3>Compute<\/h3>\n<ul><li>AWS Batch<\/li><li>Amazon EC2<\/li><li>AWS Lambda<\/li><li>AWS SAM<\/li><\/ul>", "<h3>Containers<\/h3>\n<ul><li>Amazon ECR<\/li><li>Amazon ECS<\/li><li>Amazon EKS<\/li><\/ul>", "<h3>Database<\/h3>\n<ul><li>Amazon DocumentDB<\/li><li>Amazon DynamoDB<\/li><li>Amazon Keyspaces<\/li><li>Amazon MemoryDB for Redis<\/li><li>Amazon Neptune<\/li><li>Amazon RDS<\/li><li>Amazon Aurora<\/li><li>Amazon Redshift<\/li><\/ul>", "<h3>Developer Tools<\/h3>\n<ul><li>AWS CLI<\/li><li>AWS CloudFormation<\/li><li>AWS CDK<\/li><li>AWS CodeBuild<\/li><li>AWS CodeDeploy<\/li><li>AWS CodePipeline<\/li><li>Amazon Q<\/li><\/ul>", "<h3>Web and Mobile<\/h3>\n<ul><li>Amazon API Gateway<\/li><\/ul>", "<h3>Machine Learning<\/h3>\n<ul><li>Amazon SageMaker AI<\/li><li>Amazon Bedrock<\/li><li>Amazon Kendra<\/li><\/ul>", "<h3>Management and Governance<\/h3>\n<ul><li>AWS CloudTrail<\/li><li>Amazon CloudWatch<\/li><li>Amazon CloudWatch Logs<\/li><li>AWS Config<\/li><li>Amazon Managed Grafana<\/li><li>AWS Systems Manager<\/li><li>AWS Well-Architected Tool<\/li><li>AWS Data Exchange<\/li><\/ul>", "<h3>Migration and Transfer<\/h3>\n<ul><li>AWS Application Discovery Service<\/li><li>AWS Application Migration Service<\/li><li>AWS DMS<\/li><li>AWS DataSync<\/li><li>AWS Snow Family<\/li><li>AWS Transfer Family<\/li><\/ul>", "<h3>Networking and Content Delivery<\/h3>\n<ul><li>Amazon CloudFront<\/li><li>AWS PrivateLink<\/li><li>Amazon Route 53<\/li><li>Amazon VPC<\/li><\/ul>", "<h3>Security, Identity, and Compliance<\/h3>\n<ul><li>IAM<\/li><li>AWS KMS<\/li><li>Amazon Macie<\/li><li>AWS Secrets Manager<\/li><li>AWS Shield<\/li><li>AWS WAF<\/li><\/ul>", "<h3>Storage<\/h3>\n<ul><li>AWS Backup<\/li><li>Amazon EBS<\/li><li>Amazon EFS<\/li><li>Amazon S3<\/li><li>Amazon S3 Tables<\/li><li>Amazon S3 Glacier<\/li><li>Amazon S3 Tables<\/li><\/ul>"]}, {"n": "12", "title": "Out-of-Scope AWS Services", "secs": ["<p>The following list contains AWS services and features that are out of scope for the exam. This list is non-exhaustive and is subject to change. AWS offerings that are entirely unrelated to the target job roles for the exam are excluded from this list.<\/p>", "<h3>Analytics<\/h3>\n<ul><li>Amazon FinSpace<\/li><\/ul>", "<h3>Business Applications<\/h3>\n<ul><li>Alexa for Business<\/li><li>Amazon Chime<\/li><li>Amazon Connect<\/li><li>AWS IQ<\/li><li>Amazon WorkMail<\/li><\/ul>", "<h3>Compute<\/h3>\n<ul><li>AWS App Runner<\/li><li>AWS Elastic Beanstalk<\/li><li>Amazon Lightsail<\/li><li>AWS Outposts<\/li><li>AWS Serverless Application Repository<\/li><\/ul>", "<h3>Containers<\/h3>\n<ul><li>Red Hat OpenShift Service on AWS (ROSA)<\/li><\/ul>", "<h3>Developer Tools<\/h3>\n<ul><li>AWS Fault Injection Simulator (AWS FIS)<\/li><li>AWS X-Ray<\/li><\/ul>", "<h3>Frontend Web and Mobile<\/h3>\n<ul><li>AWS Amplify<\/li><li>AWS AppSync<\/li><li>AWS Device Farm<\/li><li>Amazon Location Service<\/li><li>Amazon Pinpoint<\/li><li>Amazon SES<\/li><\/ul>", "<h3>Internet of Things (IoT)<\/h3>\n<ul><li>FreeRTOS<\/li><li>AWS IoT 1-Click<\/li><li>AWS IoT Device Defender<\/li><li>AWS IoT Device Management<\/li><li>AWS IoT Events<\/li><li>AWS IoT FleetWise<\/li><li>AWS IoT RoboRunner<\/li><li>AWS IoT SiteWise<\/li><li>AWS IoT TwinMaker<\/li><\/ul>", "<h3>Machine Learning<\/h3>\n<ul><li>Amazon DevOps Guru<\/li><\/ul>", "<h3>Management and Governance<\/h3>\n<ul><li>AWS Activate<\/li><li>AWS Managed Services (AMS)<\/li><\/ul>", "<h3>Media Services<\/h3>\n<ul><li>Amazon Elastic Transcoder<\/li><li>AWS Elemental Appliances and Software<\/li><li>AWS Elemental MediaConnect<\/li><li>AWS Elemental MediaConvert<\/li><li>AWS Elemental MediaLive<\/li><li>AWS Elemental MediaPackage<\/li><li>AWS Elemental MediaStore<\/li><li>AWS Elemental MediaTailor<\/li><li>Amazon Interactive Video Service (Amazon IVS)<\/li><li>Amazon Nimble Studio<\/li><\/ul>", "<h3>Migration and Transfer<\/h3>\n<ul><li>AWS Mainframe Modernization<\/li><li>AWS Migration Hub<\/li><\/ul>", "<h3>Storage<\/h3>\n<ul><li>EC2 Image Builder<\/li><\/ul>"]}, {"n": "13", "title": "Revisions", "secs": ["<p>AWS exam guides are periodically reviewed and updated to ensure that our certification exams test skills and AWS services and features that are relevant for the job role(s) that a certification is designed to target. Exam guide updates will be published approximately one month before updates will be reflected on your exam.<\/p>", "<h3>Change History<\/h3>\n<table><thead><tr><th>Version<\/th><th>Publication date<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>This is the first release.<\/td><\/tr><tr><td>1.1<\/td><td>December 12, 2025<\/td><\/tr><\/tbody><\/table>\n<p>The separate knowledge and skills in Version 1.0 of the exam guide were consolidated into one list of skills under each task. Knowledge items in Version 1.0 that overlapped with existing skills were removed in Version 1.1.<\/p>", "<h3>Changes to knowledge and skills<\/h3>\n<table><thead><tr><th>Version 1.1<\/th><th>Version 1.0<\/th><\/tr><\/thead><tbody><tr><td>Skill 1.4.8: Use infrastructure as code (IaC) for repeatable resource deployment (for example AWS CloudFormation and AWS Cloud Development Kit (AWS CDK)).<\/td><td>Knowledge of: Infrastructure as code (IaC) for repeatable deployments (for example, AWS Cloud Development Kit [AWS CDK], AWS CloudFormation)<\/td><\/tr><tr><td>Skill 2.1.3: Apply storage services to appropriate use cases (for example, using indexing algorithms like HNSW with Amazon Aurora PostgreSQL and using Amazon MemoryDB for fast key/value pair access).<\/td><td>Skills in: Applying storage services to appropriate use cases (for example, Amazon S3)<\/td><\/tr><tr><td>Skill 2.2.2: Build and reference a technical data catalog (for example, AWS Glue Data Catalog, Apache Hive metastore).<\/td><td>Skills in: Building and referencing a data catalog (for example, AWS Glue Data Catalog, Apache Hive metastore)<\/td><\/tr><tr><td>Skill 2.4.4: Establish data lineage by using AWS tools (for example, Amazon SageMaker ML Lineage Tracking and Amazon SageMaker Catalog).<\/td><td>Skills in: Establishing data lineage by using AWS tools (for example, Amazon SageMaker ML Lineage Tracking)<\/td><\/tr><tr><td>Skill 3.1.6: Prepare data for transformation (for example, AWS Glue DataBrew and Amazon SageMaker Unified Studio).<\/td><td>Skills in: Preparing data transformation (for example, AWS Glue DataBrew)<\/td><\/tr><tr><td>Skill 3.2.3: Use SQL in Redshift and Athena to query data or to create views.<\/td><td>Skills in: Using Athena to query data or to create views<\/td><\/tr><tr><td>Skill 4.2.5: Apply authorization methods that address business needs (role-based, tag-based, and attribute-based).<\/td><td>Knowledge of: Authorization methods (role-based, policy-based, tag-based, and attribute based)<\/td><\/tr><tr><td>Skill 4.2.6: Construct custom policies that meet the principle of least privilege.<\/td><td>Knowledge of: Principle of least privilege as it applies to AWS security<\/td><\/tr><tr><td>Skill 4.3.4: Enable encryption in transit or before transit for data.<\/td><td>Skills in: Enabling encryption in transit for data<\/td><\/tr><tr><td>Skill 4.5.4: Viewing configuration changes that have occurred in an account (for example, AWS Config).<\/td><td>Skills in: Managing configuration changes that have occurred in an account (for example, AWS Config)<\/td><\/tr><tr><td>Skill 4.5.5: Maintain data sovereignty.<\/td><td>Knowledge of: Data sovereignty<\/td><\/tr><\/tbody><\/table>", "<h3>New skills added<\/h3>\n<ul><li>Skill 1.2.10: Integrate Large Language Models (LLM) for data processing.<\/li><li>Skill 2.1.7: Manage open table formats (for example Apache Iceberg).<\/li><li>Skill 2.1.8: Describe vector index types (for example, HNSW, IVF).<\/li><li>Skill 2.2.6: Create and manage business data catalogs (for example Amazon SageMaker Catalog).<\/li><li>Skill 2.4.6: Describe vectorization concepts (for example, Amazon Bedrock knowledge base).<\/li><li>Skill 4.1.7: Use domain, domain units, and projects for SageMaker Unified Studio.<\/li><li>Skill 4.5.6: Manage data access through Amazon SageMaker Catalog projects.<\/li><li>Skill 4.5.7: Describe governance data framework and data sharing patterns.<\/li><\/ul>", "<h3>Skills removed<\/h3>\n<p>There are no knowledge and skills removed on Version 1.1 other than knowledge items that were already covered by existing skills.<\/p>", "<h3>Changes to in- and out-of-scope services<\/h3>", "<h4>Services added to the in-scope list<\/h4>\n<ul><li>Amazon Aurora<\/li><li>Amazon Q<\/li><li>Amazon Bedrock<\/li><li>Amazon Kendra<\/li><li>AWS Data Exchange<\/li><li>Amazon S3 Tables<\/li><\/ul>", "<h4>Services removed from the in-scope list<\/h4>\n<ul><li>AWS Cloud9<\/li><li>AWS CodeCommit<\/li><li>AWS Schema Conversion Tool (AWS SCT)<\/li><\/ul>", "<h4>Services added to the out-of-scope list<\/h4>\n<p>No services were added to the out-of-scope list<\/p>", "<h4>Services removed from the out-of-scope list (all due to service changes or deprecations)<\/h4>\n<ul><li>Amazon Honeycode<\/li><li>Amazon WorkDocs<\/li><li>Amazon Timestream<\/li><li>Amazon CodeWhisperer<\/li><\/ul>"]}, {"n": "14", "title": "Survey", "secs": ["<p>How useful was this exam guide? Let us know by <a href=\"https://amazonmr.au1.qualtrics.com/jfe/form/SV_8vLR1a9uG9zu9Po?course_title=DE-Associate&amp;course_id=DEA-C01&amp;Q_Language=EN\" target=\"_blank\" rel=\"noopener noreferrer\">taking our survey<\/a>.<\/p>"]}]}};
const out=document.getElementById('out'), nav=document.getElementById('chaps'), noteEl=document.getElementById('note');
const N=DATA.ko.ch.length;
const NOTES={
 ko:['<p><strong>한국어판</strong>: AWS 공식 한국어판 시험 안내서(DEA-C01, 버전 1.1, 2025-12-12) 본문을 그대로 옮겼습니다. 출처: docs.aws.amazon.com, 2026-11-07 확인.</p>'],
 ja:['<p><strong>日本語版</strong>：AWS 公式の日本語版試験ガイド (DEA-C01、バージョン 1.1、2025-12-12) の本文をそのまま転記しています。出典：docs.aws.amazon.com（2026-11-07 時点）。</p>'],
 dual:['<p><strong>한·日 대조</strong>: 왼쪽은 공식 한국어판, 오른쪽은 공식 일본어판입니다(둘 다 버전 1.1). 같은 항목끼리 줄을 맞췄습니다.</p>'],
 en:['<p><strong>English</strong>: official AWS exam guide (DEA-C01), <strong>version 1.1</strong> (December 12, 2025), transcribed from docs.aws.amazon.com as of 2026-11-07.</p>']
};
let view='ko', openAll=false;
try{const s=localStorage.getItem('dea-guide-view'); if(s&&NOTES[s]) view=s;}catch(e){}
function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');}
function prep(h){h=wrapTables(h); return openAll?h.replace(/<details class="ans">/g,'<details class="ans" open>'):h;}
function render(){
  document.body.classList.toggle('dual',view==='dual');
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  noteEl.innerHTML=NOTES[view].join('');
  let h='';
  for(let i=0;i<N;i++){
    const ko=DATA.ko.ch[i], ja=DATA.ja.ch[i], en=DATA.en.ch[i], n=ko.n;
    h+=`<section class="chap" id="c${n}">`;
    if(view==='dual'){
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1>${ko.title}<span class="sub ja" lang="ja">${ja.title}</span></h1></div>`;
      h+=`<div class="colhead"><span>한국어</span><span>日本語</span></div>`;
      ko.secs.forEach((s,j)=>{h+=`<div class="pair"><div class="sec">${prep(s)}</div><div class="sec ja" lang="ja">${prep(ja.secs[j])}</div></div>`;});
    }else{
      const L=view, c=DATA[L].ch[i];
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1 class="${L}" lang="${L}">${c.title}</h1></div>`;
      h+=`<div class="sec ${L}" lang="${L}">${c.secs.map(prep).join('')}</div>`;
    }
    h+='</section>';
  }
  out.innerHTML=h;
  const L=view==='dual'?'ko':view;
  nav.innerHTML=DATA[L].ch.map(c=>`<button data-c="${c.n}" title="${c.title}">${c.n}</button>`).join('');
  spy();
}
document.querySelector('.langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const cur=current();
  view=b.dataset.v; try{localStorage.setItem('dea-guide-view',view);}catch(e){}
  render(); jump(cur,false);
});
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) jump(b.dataset.c,true);});
function off(){return document.querySelector('header.top').getBoundingClientRect().bottom;}
function jump(n,smooth){
  const el=document.getElementById('c'+n); if(!el) return;
  window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off()-8,behavior:smooth?'smooth':'auto'});
}
function current(){
  const o=off()+20; let c=DATA.ko.ch[0].n;
  DATA.ko.ch.forEach(x=>{const el=document.getElementById('c'+x.n); if(el&&el.getBoundingClientRect().top<=o) c=x.n;}); return c;
}
function spy(){const c=current(); nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));}
addEventListener('scroll',spy,{passive:true});
render();
</script>

</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="380" height="568" viewBox="0 0 380 568" lang="ja" role="img" aria-labelledby="title desc">
  <title id="title">サブエージェントの並列生成</title>
  <desc id="desc">複数のターンに分ける逐次実行に比べ、範囲が重複しないTaskを1つの応答で呼び出すと同時に実行され、レイテンシが短縮される。</desc>
  <style>
    svg { --ink:#172f40; --edge:#23626b; --node:#f1f7f7; --hub:#d4ece9; --line:#738890; --gray:#f0f2f3; --bad:#ac353c; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#ebf5fa; --edge:#87d4ce; --node:#24363d; --hub:#214846; --line:#91a8b0; --gray:#282f34; --bad:#ff9a9d; }
    }
    text { font:18px "IBM Plex Sans JP", sans-serif; fill:var(--ink); }
    .head,.bad { font-weight:700; }
    .mid { text-anchor:middle; font-weight:600; }
    .bad { fill:var(--bad); }
    .box,.hub,.panel { stroke-width:2; stroke:var(--edge); fill:var(--node); }
    .hub { fill:var(--hub); }
    .panel { fill:var(--gray); stroke:var(--line); }
    path { stroke-linecap:round; stroke-linejoin:round; }
    .route,.back,.guide,.brace { fill:none; stroke:var(--edge); stroke-width:2; }
    .route,.back { marker-end:url(#arrow); }
    .back { stroke-width:4; }
    .guide { stroke:var(--line); stroke-dasharray:3 5; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path fill="var(--edge)" d="M0 0 8 4 0 8Z"/></marker></defs>
  <text x="10" y="30" class="head">逐次実行</text>
  <text x="10" y="57">複数のターンに分けてTaskを呼び出す</text>
  <text x="67" y="95" class="mid">ターン1</text>
  <rect x="12" y="106" width="109" height="43" rx="9" class="box"/>
  <text x="66" y="134" class="mid">Task A</text>
  <text x="67" y="177" class="mid">A 完了</text>
  <path d="M122 128h7" class="route"/>
  <text x="186" y="95" class="mid">ターン2</text>
  <rect x="131" y="106" width="109" height="43" rx="9" class="box"/>
  <text x="185" y="134" class="mid">Task B</text>
  <text x="186" y="177" class="mid">B 完了</text>
  <path d="M241 128h7" class="route"/>
  <text x="305" y="95" class="mid">ターン3</text>
  <rect x="250" y="106" width="109" height="43" rx="9" class="box"/>
  <text x="304" y="134" class="mid">Task C</text>
  <text x="305" y="177" class="mid">C 完了</text>
  <text x="10" y="226" class="head">並列実行</text>
  <text x="10" y="253">1つの応答でTask A・B・Cを呼び出す</text>
  <path d="M359 150V413" class="guide"/>
  <path d="M121 391v22" class="guide"/>
  <rect x="12" y="268" width="109" height="36" rx="9" class="hub"/>
  <text x="66" y="293" class="mid">Task A</text>
  <rect x="12" y="312" width="109" height="36" rx="9" class="hub"/>
  <text x="66" y="337" class="mid">Task B</text>
  <rect x="12" y="356" width="109" height="36" rx="9" class="hub"/>
  <text x="66" y="381" class="mid">Task C</text>
  <path d="M121 407v9h238v-9" class="brace"/>
  <text x="243" y="446" class="mid">総所要時間の差</text>
  <rect x="4" y="467" width="372" height="96" rx="9" class="panel"/>
  <text x="15" y="496" class="head">並列化の条件</text>
  <text x="15" y="526">タスク範囲が重複しないように</text>
  <text x="15" y="550">分けておく。</text>
</svg>

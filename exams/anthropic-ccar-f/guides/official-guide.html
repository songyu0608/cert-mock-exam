<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>CCAR-F 공식 시험 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: sticky bar (language tabs + chapter chips 1–18), one reading column; "대조" view = section-aligned two-column grid */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b1f2a; --muted:#5b6475; --line:#dde1e8;
  --accent:#2f4bb8; --accent-soft:#e7ebfa; --code-bg:#eef0f5; --quote:#f0f3fb; --ok:#1d7a52; --ok-soft:#e5f4ec;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-display:"Fraunces",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --fg:#e4e7ee; --muted:#9aa3b5; --line:#2c3240;
  --accent:#8ea2ff; --accent-soft:#232b4a; --code-bg:#252a36; --quote:#1e2436; --ok:#6fd0a2; --ok-soft:#173326; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ko);font-size:16px;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.dual .wrap{max-width:1260px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto;letter-spacing:.01em}
.brand small{font-family:var(--f-ko);color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:4px 10px;font-size:13px;line-height:1.5}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chaps button{font-family:var(--f-mono);font-size:12px;padding:1px 0;min-width:30px;text-align:center}
.chaps button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
main{padding-block:24px 80px}
.note{font-size:13px;color:var(--muted);line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:36px;background:var(--surface)}
.note p{margin:0}
.chap{margin-bottom:56px}
.chap-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:8px}
.chap-no{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.2em}
.chap-head h1{font-size:22px;line-height:1.4;margin:0;text-wrap:balance}
.chap-head .sub{font-size:13px;color:var(--muted);display:block;font-weight:400}
.sec h3{font-size:18px;margin:34px 0 8px;text-wrap:balance}
.sec h4{font-size:15.5px;margin:28px 0 6px;color:var(--accent);line-height:1.55;text-wrap:balance}
.sec p{margin:0 0 14px}
.sec ul,.sec ol{margin:0 0 14px;padding-left:1.4em}
.sec li{margin:3px 0}
.sec ul.opts{list-style:none;padding-left:0}
.sec ul.opts li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;background:var(--surface)}
.sec blockquote{margin:16px 0;padding:10px 16px;background:var(--quote);border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.sec blockquote p:last-child{margin-bottom:0}
details.ans{margin:4px 0 26px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.ans summary{cursor:pointer;padding:7px 12px;font-size:13.5px;color:var(--ok);font-weight:600}
details.ans[open]{background:var(--ok-soft);border-color:var(--ok)}
details.ans p{margin:0;padding:0 14px 12px}
.sec code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:6px 0 18px}
.sec table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.sec th,.sec td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sec th{background:var(--code-bg)}
.ja{font-family:var(--f-ja)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0}
.pair>div{min-width:0}
.colhead{display:grid;grid-template-columns:1fr 1fr;gap:36px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:820px){.pair{grid-template-columns:1fr}.pair>div.ja{border-top:1px dotted var(--line);padding-top:4px}.colhead{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <span class="brand">CCAR-F 시험 가이드<small>v1.0 · 전문</small></span>
    <div class="row langs" role="group" aria-label="언어">
      <button id="v-ko" data-v="ko">한국어</button>
      <button id="v-ja" data-v="ja">日本語</button>
      <button id="v-dual" data-v="dual">한·日 대조</button>
      <button id="v-en" data-v="en">English</button>
    </div>
  </div>
  <div class="row chaps" role="group" aria-label="장 이동" id="chaps"></div>
</div></header>
<main><div class="wrap">
  <div class="note" id="note"></div>
  <div class="row" style="margin:-24px 0 24px"><span class="tools"><button id="openAll">샘플 문제 정답 모두 펼치기</button></span></div>
  <div id="out"></div>
</div></main>

<script>
const DATA={"ko": {"title": "Claude Certified Architect – Foundations 시험 가이드 — 한국어판", "note": ["원문: *Claude Certified Architect – Foundations Exam Guide*, Version 1.0 · Effective July 2026 · 시험 코드 CCAR-F (영어 공식 PDF, Anthropic Partner Academy 배포).", "요약 없이 전문 번역. 비공식 번역이며, 해석이 갈리면 영어 원문이 기준입니다. 도구명·플래그·파일 경로·도메인명은 영어 원어를 그대로 두거나 병기했습니다.", "원문 서두 문구: \"This guide is subject to change without notice.\"(이 가이드는 예고 없이 변경될 수 있습니다.)"], "ch": [{"n": "1", "title": "이 자격증에 대하여", "secs": ["<p>Claude Certified Architect – Foundations 자격증은 실무자가 Claude로 실제 솔루션을 구현할 때 트레이드오프에 관해 근거 있는 결정을 내릴 수 있음을 검증합니다. 이 시험은 Claude로 프로덕션급 애플리케이션을 구축하는 데 쓰이는 핵심 기술인 Claude Code, Claude Agent SDK, Claude API, Model Context Protocol(MCP) 전반의 기초 지식을 평가합니다.<\/p>\n<p>이 시험의 문제는 실제 고객 사용 사례에서 가져온 현실적인 시나리오에 기반합니다. 예를 들어 고객 지원용 에이전트 시스템 구축, 멀티 에이전트 리서치 파이프라인 설계, Claude Code의 CI/CD 워크플로 통합, 개발자 생산성 도구 구축, 비정형 문서에서 정형 데이터 추출 등이 있습니다. 응시자는 개념 지식뿐 아니라 프로덕션 배포에서의 아키텍처, 구성, 트레이드오프에 관한 실무적 판단력을 보여 주어야 합니다.<\/p>\n<p>이 가이드는 시험을 준비하는 응시자를 위한 공식 기준 문서입니다. 시험 내용을 설명하고, 출제되는 도메인과 과제 기술서(task statement)를 나열하며, 샘플 문제를 제공하고, 준비 전략을 권장합니다. 시험 일정을 잡기 전에 끝까지 읽으십시오.<\/p>"]}, {"n": "2", "title": "대상 응시자", "secs": ["<p>이 자격증의 이상적인 응시자는 Claude로 프로덕션 애플리케이션을 설계·구현하는 솔루션 아키텍트입니다. 이 응시자는 다음에 대한 실무 경험이 있습니다.<\/p>\n<ul><li>Claude Agent SDK로 에이전트 애플리케이션 구축: 멀티 에이전트 오케스트레이션, 서브에이전트 위임, 도구 통합, 라이프사이클 훅 포함<\/li><li>CLAUDE.md 파일, Agent Skills, MCP 서버 통합, 플랜 모드(plan mode)를 사용해 팀 워크플로에 맞게 Claude Code를 구성·커스터마이즈<\/li><li>백엔드 시스템 통합을 위한 Model Context Protocol(MCP) 도구 및 리소스 인터페이스 설계<\/li><li>JSON 스키마, few-shot 예시, 추출 패턴을 활용해 신뢰할 수 있는 정형 출력을 만드는 프롬프트 엔지니어링<\/li><li>긴 문서, 멀티턴 대화, 멀티 에이전트 핸드오프 전반에서 컨텍스트 윈도를 효과적으로 관리<\/li><li>자동 코드 리뷰, 테스트 생성, 풀 리퀘스트 피드백을 위해 Claude를 CI/CD 파이프라인에 통합<\/li><li>오류 처리, 휴먼 인 더 루프(human-in-the-loop) 워크플로, 자기 평가 패턴을 포함해 에스컬레이션과 신뢰성에 관한 타당한 결정 내리기<\/li><\/ul>\n<p>이 응시자는 일반적으로 Claude API, Agent SDK, Claude Code, MCP로 개발한 실무 경험이 6개월 이상이며, 프로덕션 환경에서 대규모 언어 모델의 능력과 한계를 모두 이해합니다.<\/p>"]}, {"n": "3", "title": "시험 개요 한눈에 보기", "secs": ["<table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>자격명<\/td><td>Claude Certified Architect – Foundations<\/td><\/tr><tr><td>시험 코드<\/td><td>CCAR-F<\/td><\/tr><tr><td>문항 수<\/td><td>60<\/td><\/tr><tr><td>문항 형식<\/td><td>단일 선택(multiple-choice) 및 복수 선택(multiple-response). 각 문항에 선택해야 할 답의 개수가 표시됨<\/td><\/tr><tr><td>시험 구성<\/td><td>6개 시나리오 뱅크에서 4개 시나리오 출제<\/td><\/tr><tr><td>제한 시간<\/td><td>120분<\/td><\/tr><tr><td>시험 방식<\/td><td>감독관 입회(proctored): 프로그램 정책에 따라 온라인 감독 및/또는 시험 센터<\/td><\/tr><tr><td>합격 점수<\/td><td>100~1,000 척도 환산 점수 720<\/td><\/tr><tr><td>응시료<\/td><td>125 USD<\/td><\/tr><tr><td>유효 기간<\/td><td>자격 취득일로부터 12개월<\/td><\/tr><tr><td>결과 통지<\/td><td>합격/불합격과 환산 점수(100~1,000), 성적표에 도메인별 정답률 표시<\/td><\/tr><\/tbody><\/table>"]}, {"n": "4", "title": "시험 내용 개요(블루프린트)", "secs": ["<p>시험 블루프린트는 측정 대상 내용 도메인과 시험에서 각 도메인이 차지하는 대략적인 비중을 정의합니다. 비중은 직무 분석(job task analysis)을 통해 판단한, 유능한 업무 수행에 대한 각 도메인의 상대적 중요도를 반영합니다. 백분율은 채점 대상 문항 중 각 도메인에서 출제되는 대략적인 비율을 나타냅니다.<\/p>\n<table><thead><tr><th>도메인<\/th><th>내용 도메인<\/th><th>비중<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>에이전트 아키텍처와 오케스트레이션 (Agentic Architecture &amp; Orchestration)<\/td><td>27%<\/td><\/tr><tr><td>2<\/td><td>도구 설계와 MCP 통합 (Tool Design &amp; MCP Integration)<\/td><td>18%<\/td><\/tr><tr><td>3<\/td><td>Claude Code 구성과 워크플로 (Claude Code Configuration &amp; Workflows)<\/td><td>20%<\/td><\/tr><tr><td>4<\/td><td>프롬프트 엔지니어링과 정형 출력 (Prompt Engineering &amp; Structured Output)<\/td><td>20%<\/td><\/tr><tr><td>5<\/td><td>컨텍스트 관리와 신뢰성 (Context Management &amp; Reliability)<\/td><td>15%<\/td><\/tr><tr><td><\/td><td>합계<\/td><td>100%<\/td><\/tr><\/tbody><\/table>"]}, {"n": "5", "title": "시험 시나리오", "secs": ["<p>이 시험은 시나리오 기반 문항을 사용합니다. 각 시나리오는 일련의 문항의 배경이 되는 현실적인 프로덕션 상황을 제시합니다. 시험 중에는 아래 6개 시나리오 전체에서 무작위로 고른 4개 시나리오가 출제됩니다.<\/p>", "<h3>시나리오 1: 고객 지원 해결 에이전트 (Customer Support Resolution Agent)<\/h3>\n<p>Claude Agent SDK로 고객 지원 해결 에이전트를 구축하고 있습니다. 이 에이전트는 반품, 청구 분쟁, 계정 문제처럼 모호성이 높은 요청을 처리합니다. 커스텀 Model Context Protocol(MCP) 도구(get_customer, lookup_order, process_refund, escalate_to_human)를 통해 백엔드 시스템에 접근합니다. 목표는 언제 에스컬레이션해야 하는지 알면서 첫 응대 해결률(first-contact resolution) 80% 이상을 달성하는 것입니다.<\/p>\n<p><strong>주요 도메인:<\/strong> 에이전트 아키텍처와 오케스트레이션, 도구 설계와 MCP 통합, 컨텍스트 관리와 신뢰성<\/p>", "<h3>시나리오 2: Claude Code를 활용한 코드 생성 (Code Generation with Claude Code)<\/h3>\n<p>소프트웨어 개발을 가속하기 위해 Claude Code를 사용하고 있습니다. 팀은 코드 생성, 리팩터링, 디버깅, 문서화에 Claude Code를 사용합니다. 커스텀 슬래시 명령과 CLAUDE.md 구성으로 개발 워크플로에 통합해야 하며, 플랜 모드와 직접 실행(direct execution)을 언제 쓸지 이해해야 합니다.<\/p>\n<p><strong>주요 도메인:<\/strong> Claude Code 구성과 워크플로, 컨텍스트 관리와 신뢰성<\/p>", "<h3>시나리오 3: 멀티 에이전트 리서치 시스템 (Multi-Agent Research System)<\/h3>\n<p>Claude Agent SDK로 멀티 에이전트 리서치 시스템을 구축하고 있습니다. 코디네이터 에이전트가 전문화된 서브에이전트에게 위임합니다. 하나는 웹을 검색하고, 하나는 문서를 분석하고, 하나는 결과를 종합하고, 하나는 보고서를 생성합니다. 이 시스템은 주제를 조사해 출처가 명시된 포괄적인 보고서를 만듭니다.<\/p>\n<p><strong>주요 도메인:<\/strong> 에이전트 아키텍처와 오케스트레이션, 도구 설계와 MCP 통합, 컨텍스트 관리와 신뢰성<\/p>", "<h3>시나리오 4: Claude를 활용한 개발자 생산성 (Developer Productivity with Claude)<\/h3>\n<p>Claude Agent SDK로 개발자 생산성 도구를 구축하고 있습니다. 이 에이전트는 엔지니어가 익숙하지 않은 코드베이스를 탐색하고, 레거시 시스템을 이해하고, 보일러플레이트 코드를 생성하고, 반복 작업을 자동화하도록 돕습니다. 내장 도구(Read, Write, Bash, Grep, Glob)를 사용하며 Model Context Protocol(MCP) 서버와 통합됩니다.<\/p>\n<p><strong>주요 도메인:<\/strong> 도구 설계와 MCP 통합, Claude Code 구성과 워크플로, 에이전트 아키텍처와 오케스트레이션<\/p>", "<h3>시나리오 5: 지속적 통합을 위한 Claude Code (Claude Code for Continuous Integration)<\/h3>\n<p>Claude Code를 지속적 통합/지속적 배포(CI/CD) 파이프라인에 통합하고 있습니다. 이 시스템은 자동 코드 리뷰를 실행하고, 테스트 케이스를 생성하고, 풀 리퀘스트에 피드백을 제공합니다. 실행 가능한(actionable) 피드백을 주고 오탐(false positive)을 최소화하는 프롬프트를 설계해야 합니다.<\/p>\n<p><strong>주요 도메인:<\/strong> Claude Code 구성과 워크플로, 프롬프트 엔지니어링과 정형 출력<\/p>", "<h3>시나리오 6: 정형 데이터 추출 (Structured Data Extraction)<\/h3>\n<p>Claude로 정형 데이터 추출 시스템을 구축하고 있습니다. 이 시스템은 비정형 문서에서 정보를 추출하고, JavaScript Object Notation(JSON) 스키마로 출력을 검증하며, 높은 정확도를 유지합니다. 엣지 케이스를 매끄럽게 처리하고 다운스트림 시스템과 통합되어야 합니다.<\/p>\n<p><strong>주요 도메인:<\/strong> 프롬프트 엔지니어링과 정형 출력, 컨텍스트 관리와 신뢰성<\/p>"]}, {"n": "6", "title": "도메인별 세부 목표", "secs": ["<p>아래 각 도메인에는 출제되는 과제 기술서와, 각 과제 기술서에 대해 측정하는 지식과 기술이 나열되어 있습니다. 시험 문항은 이 목표를 기준으로 작성됩니다.<\/p>", "<h3>도메인 1: 에이전트 아키텍처와 오케스트레이션 (Agentic Architecture &amp; Orchestration)<\/h3>", "<h4>Task Statement 1.1: 자율적 작업 수행을 위한 에이전트 루프를 설계·구현한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>에이전트 루프의 라이프사이클: Claude에 요청을 보내고, stop_reason(\"tool_use\" vs \"end_turn\")을 확인하고, 요청된 도구를 실행하고, 다음 반복을 위해 결과를 반환하는 과정<\/li><li>모델이 다음 행동을 추론할 수 있도록 도구 결과가 대화 기록에 추가되는 방식<\/li><li>모델 주도 의사결정(Claude가 컨텍스트에 근거해 다음에 호출할 도구를 추론)과 미리 구성된 의사결정 트리 또는 도구 순서의 차이<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>stop_reason이 \"tool_use\"이면 계속하고 \"end_turn\"이면 종료하는 에이전트 루프 제어 흐름 구현<\/li><li>모델이 새 정보를 추론에 반영할 수 있도록 반복 사이에 도구 결과를 대화 컨텍스트에 추가<\/li><li>안티패턴 회피: 루프 종료를 판단하려고 자연어 신호를 파싱하기, 임의의 반복 횟수 상한을 주된 종료 장치로 설정하기, 어시스턴트 텍스트 내용의 존재를 완료 지표로 확인하기<\/li><\/ul>", "<h4>Task Statement 1.2: 코디네이터-서브에이전트 패턴으로 멀티 에이전트 시스템을 오케스트레이션한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>코디네이터 에이전트가 서브에이전트 간 모든 통신, 오류 처리, 정보 라우팅을 관리하는 허브 앤 스포크(hub-and-spoke) 아키텍처<\/li><li>서브에이전트는 격리된 컨텍스트로 동작하며, 코디네이터의 대화 기록을 자동으로 상속하지 않는다는 점<\/li><li>작업 분해, 위임, 결과 집계, 쿼리 복잡도에 따라 어떤 서브에이전트를 호출할지 결정하는 코디네이터의 역할<\/li><li>코디네이터가 작업을 지나치게 좁게 분해하여 광범위한 리서치 주제를 불완전하게 다루게 되는 위험<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>항상 전체 파이프라인을 거치게 하는 대신, 쿼리 요구사항을 분석해 호출할 서브에이전트를 동적으로 선택하는 코디네이터 에이전트 설계<\/li><li>중복을 최소화하도록 서브에이전트 간 리서치 범위 분할(예: 각 에이전트에 서로 다른 하위 주제나 출처 유형 할당)<\/li><li>반복 개선 루프 구현: 코디네이터가 종합 결과의 빈틈을 평가하고, 표적 쿼리로 검색·분석 서브에이전트에 다시 위임하고, 커버리지가 충분해질 때까지 종합을 다시 호출<\/li><li>관측 가능성, 일관된 오류 처리, 통제된 정보 흐름을 위해 모든 서브에이전트 통신을 코디네이터를 통해 라우팅<\/li><\/ul>", "<h4>Task Statement 1.3: 서브에이전트 호출, 컨텍스트 전달, 생성(spawning)을 구성한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>서브에이전트를 생성하는 메커니즘인 Task 도구, 그리고 코디네이터가 서브에이전트를 호출하려면 allowedTools에 \"Task\"가 포함되어야 한다는 요건<\/li><li>서브에이전트의 컨텍스트는 프롬프트에 명시적으로 제공해야 한다는 점. 서브에이전트는 부모의 컨텍스트를 자동으로 상속하지 않으며 호출 간에 메모리를 공유하지 않음<\/li><li>각 서브에이전트 유형의 설명, 시스템 프롬프트, 도구 제한을 포함하는 AgentDefinition 구성<\/li><li>공통 분석 기준점에서 서로 다른 접근을 탐색하기 위한 포크 기반 세션 관리<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>이전 에이전트의 결과 전체를 서브에이전트의 프롬프트에 직접 포함(예: 웹 검색 결과와 문서 분석 결과를 종합 서브에이전트에 전달)<\/li><li>에이전트 간 컨텍스트를 전달할 때 출처 귀속을 보존하도록, 정형 데이터 형식으로 내용과 메타데이터(출처 URL, 문서명, 페이지 번호)를 분리<\/li><li>여러 턴에 걸치지 않고 코디네이터의 단일 응답에서 Task 도구 호출을 여러 개 내보내 병렬 서브에이전트 생성<\/li><li>서브에이전트가 적응적으로 동작할 수 있도록, 단계별 절차 지시 대신 리서치 목표와 품질 기준을 명시하는 코디네이터 프롬프트 설계<\/li><\/ul>", "<h4>Task Statement 1.4: 강제(enforcement) 및 핸드오프 패턴을 갖춘 다단계 워크플로를 구현한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>워크플로 순서에 대한 프로그래밍적 강제(훅, 사전 조건 게이트)와 프롬프트 기반 안내의 차이<\/li><li>결정적 준수가 필요한 경우(예: 금융 작업 전 신원 확인), 프롬프트 지시만으로는 실패율이 0이 아니라는 점<\/li><li>고객 정보, 근본 원인 분석, 권장 조치를 포함하는, 처리 도중 에스컬레이션을 위한 구조화된 핸드오프 프로토콜<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>사전 단계가 완료될 때까지 후속 도구 호출을 차단하는 프로그래밍적 사전 조건 구현(예: get_customer가 검증된 고객 ID를 반환할 때까지 process_refund 차단)<\/li><li>여러 사안이 섞인 고객 요청을 개별 항목으로 분해한 뒤, 공유 컨텍스트를 사용해 각 항목을 병렬로 조사하고 하나의 통합된 해결책으로 종합<\/li><li>대화 기록에 접근할 수 없는 상담원에게 에스컬레이션할 때 구조화된 핸드오프 요약(고객 ID, 근본 원인, 환불 금액, 권장 조치) 작성<\/li><\/ul>", "<h4>Task Statement 1.5: 도구 호출 가로채기와 데이터 정규화에 Agent SDK 훅을 적용한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>모델이 처리하기 전에 도구 결과를 가로채 변환하는 훅 패턴(예: PostToolUse)<\/li><li>나가는 도구 호출을 가로채 준수 규칙을 강제하는 훅 패턴(예: 기준 금액을 넘는 환불 차단)<\/li><li>결정적 보장을 위한 훅 사용과, 확률적 준수에 그치는 프롬프트 지시 의존의 차이<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>에이전트가 처리하기 전에 여러 MCP 도구에서 온 이질적인 데이터 형식(Unix 타임스탬프, ISO 8601, 숫자 상태 코드)을 정규화하는 PostToolUse 훅 구현<\/li><li>정책 위반 행동(예: 500달러 초과 환불)을 차단하고 대체 워크플로(예: 사람에게 에스컬레이션)로 돌리는 도구 호출 가로채기 훅 구현<\/li><li>비즈니스 규칙이 보장된 준수를 요구할 때 프롬프트 기반 강제 대신 훅 선택<\/li><\/ul>", "<h4>Task Statement 1.6: 복잡한 워크플로를 위한 작업 분해 전략을 설계한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>고정된 순차 파이프라인(프롬프트 체이닝)과 중간 결과에 따른 동적·적응적 분해를 각각 언제 사용할지<\/li><li>리뷰를 순차 단계로 나누는 프롬프트 체이닝 패턴(예: 각 파일을 개별 분석한 뒤 파일 간 통합 패스 실행)<\/li><li>각 단계에서 발견한 내용에 따라 하위 작업을 생성하는 적응적 조사 계획의 가치<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>워크플로에 맞는 작업 분해 패턴 선택: 예측 가능한 다측면 리뷰에는 프롬프트 체이닝, 열린 조사 작업에는 동적 분해<\/li><li>주의력 분산(attention dilution)을 피하기 위해 대규모 코드 리뷰를 파일별 로컬 분석 패스와 별도의 파일 간 통합 패스로 분할<\/li><li>열린 작업(예: \"레거시 코드베이스에 포괄적인 테스트 추가\")을 분해할 때, 먼저 구조를 파악하고 영향이 큰 영역을 식별한 다음, 의존성이 발견됨에 따라 조정되는 우선순위 계획 작성<\/li><\/ul>", "<h4>Task Statement 1.7: 세션 상태, 재개, 포크를 관리한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>특정 이전 대화를 이어 가기 위해 --resume &lt;session-name&gt;을 사용하는 이름 있는 세션 재개<\/li><li>공통 분석 기준점에서 독립적인 분기를 만들어 서로 다른 접근을 탐색하는 fork_session<\/li><li>코드 수정 후 세션을 재개할 때, 이전에 분석한 파일의 변경 사항을 에이전트에게 알리는 것의 중요성<\/li><li>오래된(stale) 도구 결과로 재개하는 것보다 구조화된 요약으로 새 세션을 시작하는 것이 더 신뢰할 수 있는 이유<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>작업 세션을 넘나들며 이름 있는 조사 세션을 이어 가기 위해 세션 이름과 함께 --resume 사용<\/li><li>fork_session으로 병렬 탐색 분기 생성(예: 공통 코드베이스 분석에서 두 가지 테스트 전략이나 리팩터링 접근 비교)<\/li><li>세션 재개(이전 컨텍스트가 대체로 유효할 때)와 요약을 주입한 새 시작(이전 도구 결과가 오래되었을 때) 중 선택<\/li><li>전체 재탐색을 요구하는 대신, 재개한 세션에 구체적인 파일 변경 사항을 알려 표적 재분석 수행<\/li><\/ul>", "<h3>도메인 2: 도구 설계와 MCP 통합 (Tool Design &amp; MCP Integration)<\/h3>", "<h4>Task Statement 2.1: 명확한 설명과 경계를 갖춘 효과적인 도구 인터페이스를 설계한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>도구 설명은 LLM이 도구를 선택하는 주된 메커니즘이며, 설명이 최소한이면 유사한 도구 사이에서 선택이 불안정해진다는 점<\/li><li>도구 설명에 입력 형식, 예시 쿼리, 엣지 케이스, 경계 설명을 포함하는 것의 중요성<\/li><li>모호하거나 겹치는 도구 설명이 잘못된 라우팅을 일으키는 방식(예: 설명이 거의 같은 analyze_content와 analyze_document)<\/li><li>시스템 프롬프트 문구가 도구 선택에 미치는 영향: 키워드에 민감한 지시가 의도하지 않은 도구 연관을 만들 수 있음<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>각 도구의 목적, 예상 입력, 출력, 유사한 대안 대신 그 도구를 써야 하는 경우를 명확히 구분하는 도구 설명 작성<\/li><li>기능 중복을 없애기 위해 도구 이름을 바꾸고 설명을 갱신(예: analyze_content를 웹 전용 설명을 가진 extract_web_results로 이름 변경)<\/li><li>범용 도구를 입출력 계약이 정의된 목적별 도구로 분할(예: 범용 analyze_document를 extract_data_points, summarize_content, verify_claim_against_source로 분할)<\/li><li>잘 작성된 도구 설명을 무력화할 수 있는 키워드 민감 지시가 시스템 프롬프트에 있는지 검토<\/li><\/ul>", "<h4>Task Statement 2.2: MCP 도구의 구조화된 오류 응답을 구현한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>도구 실패를 에이전트에 전달하기 위한 MCP isError 플래그 패턴<\/li><li>일시적 오류(타임아웃, 서비스 불가), 검증 오류(잘못된 입력), 비즈니스 오류(정책 위반), 권한 오류의 구분<\/li><li>획일적인 오류 응답(범용 \"Operation failed\")이 에이전트의 적절한 복구 결정을 막는 이유<\/li><li>재시도 가능한 오류와 재시도 불가능한 오류의 차이, 그리고 구조화된 메타데이터를 반환하면 헛된 재시도를 막을 수 있는 방식<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>errorCategory(transient/validation/permission), isRetryable 불리언, 사람이 읽을 수 있는 설명을 포함하는 구조화된 오류 메타데이터 반환<\/li><li>비즈니스 규칙 위반에는 retriable: false 플래그와 고객 친화적 설명을 포함해 에이전트가 적절히 전달할 수 있게 함<\/li><li>일시적 실패는 서브에이전트 안에서 로컬 복구를 구현하고, 로컬에서 해결할 수 없는 오류만 부분 결과 및 시도한 내용과 함께 코디네이터로 전파<\/li><li>접근 실패(재시도 결정 필요)와 유효한 빈 결과(일치 항목이 없는 성공한 쿼리)의 구분<\/li><\/ul>", "<h4>Task Statement 2.3: 에이전트 간에 도구를 적절히 배분하고 도구 선택(tool choice)을 구성한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>에이전트에게 너무 많은 도구(예: 4~5개 대신 18개)를 주면 결정 복잡도가 높아져 도구 선택 신뢰성이 떨어진다는 원칙<\/li><li>자기 전문 분야 밖의 도구를 가진 에이전트가 그 도구를 오용하기 쉬운 이유(예: 종합 에이전트가 웹 검색을 시도)<\/li><li>범위가 제한된 도구 접근: 에이전트에게 역할에 필요한 도구만 주되, 특정한 고빈도 요구에 한해 제한된 교차 역할 도구 제공<\/li><li>tool_choice 구성 옵션: \"auto\", \"any\", 강제 도구 선택({\"type\": \"tool\", \"name\": \"...\"})<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>각 서브에이전트의 도구 세트를 역할에 관련된 것으로 제한하여 전문 분야를 넘나드는 오용 방지<\/li><li>범용 도구를 제약된 대안으로 교체(예: fetch_url을 문서 URL을 검증하는 load_document로 교체)<\/li><li>고빈도 요구에는 범위가 제한된 교차 역할 도구를 제공(예: 종합 에이전트용 verify_fact 도구)하고, 복잡한 사례는 코디네이터를 통해 라우팅<\/li><li>tool_choice 강제 선택으로 특정 도구가 먼저 호출되도록 보장(예: 보강(enrichment) 도구보다 extract_metadata를 먼저 강제)한 뒤, 후속 단계는 이어지는 턴에서 처리<\/li><li>모델이 대화형 텍스트를 반환하지 않고 반드시 도구를 호출하도록 tool_choice: \"any\" 설정<\/li><\/ul>", "<h4>Task Statement 2.4: MCP 서버를 Claude Code와 에이전트 워크플로에 통합한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>MCP 서버 범위: 팀 공유 도구용 프로젝트 수준(.mcp.json) vs 개인·실험용 서버를 위한 사용자 수준(~/.claude.json)<\/li><li>비밀 정보를 커밋하지 않고 자격 증명을 관리하기 위한 .mcp.json의 환경 변수 확장(예: ${GITHUB_TOKEN})<\/li><li>구성된 모든 MCP 서버의 도구가 연결 시점에 발견되어 에이전트가 동시에 사용할 수 있다는 점<\/li><li>탐색용 도구 호출을 줄이기 위해 콘텐츠 카탈로그(예: 이슈 요약, 문서 계층 구조, 데이터베이스 스키마)를 노출하는 메커니즘인 MCP 리소스<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>인증 토큰에 환경 변수 확장을 사용하여 프로젝트 범위 .mcp.json에 공유 MCP 서버 구성<\/li><li>사용자 범위 ~/.claude.json에 개인·실험용 MCP 서버 구성<\/li><li>에이전트가 더 유능한 MCP 도구 대신 내장 도구(Grep 등)를 선호하지 않도록, MCP 도구 설명에 기능과 출력을 자세히 설명<\/li><li>표준 통합(예: Jira)에는 직접 구현보다 기존 커뮤니티 MCP 서버를 선택하고, 커스텀 서버는 팀 고유 워크플로에만 사용<\/li><li>탐색용 도구 호출 없이 사용 가능한 데이터를 에이전트가 파악할 수 있도록 콘텐츠 카탈로그를 MCP 리소스로 노출<\/li><\/ul>", "<h4>Task Statement 2.5: 내장 도구(Read, Write, Edit, Bash, Grep, Glob)를 효과적으로 선택·적용한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>내용 검색에는 Grep(함수 이름, 오류 메시지, import 문 같은 패턴으로 파일 내용 검색)<\/li><li>파일 경로 패턴 매칭에는 Glob(이름이나 확장자 패턴으로 파일 찾기)<\/li><li>파일 전체 작업에는 Read/Write, 고유한 텍스트 매칭을 이용한 부분 수정에는 Edit<\/li><li>텍스트 매치가 고유하지 않아 Edit이 실패할 때, 안정적인 파일 수정을 위한 대안으로 Read + Write 사용<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>코드베이스 전체에서 코드 내용을 검색할 때 Grep 선택(예: 함수의 모든 호출부 찾기, 오류 메시지 위치 찾기)<\/li><li>이름 패턴에 맞는 파일을 찾을 때 Glob 선택(예: **/*.test.tsx)<\/li><li>Edit이 고유한 기준 텍스트를 찾지 못할 때 Read로 파일 전체를 불러온 뒤 Write 사용<\/li><li>모든 파일을 처음부터 읽는 대신, Grep으로 진입점을 찾고 Read로 import를 따라가며 흐름을 추적하는 식으로 코드베이스 이해를 점진적으로 구축<\/li><li>래퍼 모듈을 거치는 함수 사용처를 추적할 때, 먼저 내보내진(export) 이름을 모두 파악한 뒤 각 이름을 코드베이스 전체에서 검색<\/li><\/ul>", "<h3>도메인 3: Claude Code 구성과 워크플로 (Claude Code Configuration &amp; Workflows)<\/h3>", "<h4>Task Statement 3.1: 적절한 계층, 범위, 모듈 구조로 CLAUDE.md 파일을 구성한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>CLAUDE.md 구성 계층: 사용자 수준(~/.claude/CLAUDE.md), 프로젝트 수준(.claude/CLAUDE.md 또는 루트 CLAUDE.md), 디렉터리 수준(하위 디렉터리의 CLAUDE.md 파일)<\/li><li>사용자 수준 설정은 해당 사용자에게만 적용된다는 점. ~/.claude/CLAUDE.md의 지시는 버전 관리를 통해 팀원과 공유되지 않음<\/li><li>CLAUDE.md를 모듈화하기 위해 외부 파일을 참조하는 @import 구문(예: 각 패키지에 관련된 특정 표준 파일 가져오기)<\/li><li>하나의 거대한 CLAUDE.md 대신 주제별 규칙 파일을 정리하는 .claude/rules/ 디렉터리<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>구성 계층 문제 진단(예: 지시가 프로젝트 수준이 아닌 사용자 수준 구성에 있어서 새 팀원이 지시를 받지 못하는 경우)<\/li><li>관리자의 도메인 지식에 따라 각 패키지의 CLAUDE.md에 관련 표준 파일만 선택적으로 포함하도록 @import 사용<\/li><li>큰 CLAUDE.md 파일을 .claude/rules/ 안의 주제별 파일로 분할(예: testing.md, api-conventions.md, deployment.md)<\/li><li>/memory 명령으로 어떤 메모리 파일이 로드되었는지 확인하고, 세션마다 동작이 일관되지 않은 원인 진단<\/li><\/ul>", "<h4>Task Statement 3.2: 커스텀 슬래시 명령과 스킬을 만들고 구성한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>.claude/commands/의 프로젝트 범위 명령(버전 관리로 공유) vs ~/.claude/commands/의 사용자 범위 명령(개인용)<\/li><li>.claude/skills/의 스킬과 SKILL.md 파일. SKILL.md는 context: fork, allowed-tools, argument-hint 등의 frontmatter 구성을 지원<\/li><li>스킬을 격리된 서브에이전트 컨텍스트에서 실행하여 스킬 출력이 메인 대화를 오염시키지 않게 하는 context: fork frontmatter 옵션<\/li><li>개인 스킬 커스터마이즈: 팀원에게 영향을 주지 않도록 ~/.claude/skills/에 다른 이름으로 개인용 변형 만들기<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>버전 관리를 통해 팀 전체가 사용할 수 있도록 .claude/commands/에 프로젝트 범위 슬래시 명령 생성<\/li><li>장황한 출력을 내는 스킬(예: 코드베이스 분석)이나 탐색적 컨텍스트를 만드는 스킬(예: 대안 브레인스토밍)을 context: fork로 메인 세션에서 격리<\/li><li>스킬 frontmatter의 allowed-tools로 스킬 실행 중 도구 접근 제한(예: 파괴적 동작을 막기 위해 파일 쓰기 작업으로 한정)<\/li><li>개발자가 인수 없이 스킬을 호출할 때 필요한 매개변수를 입력하도록 argument-hint frontmatter 사용<\/li><li>스킬(작업별 워크플로를 위한 필요 시 호출)과 CLAUDE.md(항상 로드되는 공통 표준) 중 선택<\/li><\/ul>", "<h4>Task Statement 3.3: 경로별 규칙을 적용하여 규약을 조건부로 로드한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>조건부 규칙 활성화를 위한 glob 패턴이 담긴 YAML frontmatter paths 필드를 가진 .claude/rules/ 파일<\/li><li>경로 범위 규칙은 일치하는 파일을 편집할 때만 로드되어 불필요한 컨텍스트와 토큰 사용을 줄인다는 점<\/li><li>여러 디렉터리에 걸친 규약(예: 코드베이스 전체에 흩어진 테스트 파일)에서 glob 패턴 규칙이 디렉터리 수준 CLAUDE.md보다 나은 점<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>일치하는 파일을 편집할 때만 규칙이 로드되도록 YAML frontmatter 경로 범위를 지정한 .claude/rules/ 파일 생성(예: paths: [\"terraform/**/*\"])<\/li><li>경로별 규칙에 glob 패턴을 사용해 디렉터리 위치와 관계없이 파일 유형별로 규약 적용(예: 모든 테스트 파일에 **/*.test.tsx)<\/li><li>규약을 코드베이스 곳곳에 흩어진 파일에 적용해야 할 때 하위 디렉터리 CLAUDE.md 대신 경로별 규칙 선택<\/li><\/ul>", "<h4>Task Statement 3.4: 플랜 모드와 직접 실행 중 무엇을 쓸지 판단한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>플랜 모드는 대규모 변경, 여러 타당한 접근, 아키텍처 결정, 다중 파일 수정이 포함된 복잡한 작업을 위해 설계됨<\/li><li>직접 실행은 단순하고 범위가 명확한 변경에 적합함(예: 한 함수에 검증 체크 하나 추가)<\/li><li>플랜 모드는 변경을 확정하기 전에 안전하게 코드베이스를 탐색하고 설계할 수 있게 하여 비용이 큰 재작업을 막음<\/li><li>장황한 탐색 출력을 격리하고 요약을 반환해 메인 대화 컨텍스트를 보존하는 Explore 서브에이전트<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>아키텍처에 영향을 주는 작업에 플랜 모드 선택(예: 마이크로서비스 재구성, 45개 이상 파일에 영향을 주는 라이브러리 마이그레이션, 인프라 요구사항이 다른 통합 방식 간 선택)<\/li><li>범위가 명확하고 잘 이해된 변경에 직접 실행 선택(예: 스택 트레이스가 명확한 단일 파일 버그 수정, 날짜 검증 조건문 추가)<\/li><li>다단계 작업 중 컨텍스트 윈도 고갈을 막기 위해 장황한 탐색 단계에 Explore 서브에이전트 사용<\/li><li>조사는 플랜 모드로, 구현은 직접 실행으로 결합(예: 라이브러리 마이그레이션을 계획한 뒤 계획한 방식대로 실행)<\/li><\/ul>", "<h4>Task Statement 3.5: 점진적 개선을 위한 반복 개선 기법을 적용한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>산문 설명이 일관되지 않게 해석될 때, 기대하는 변환을 전달하는 가장 효과적인 방법은 구체적인 입력/출력 예시라는 점<\/li><li>테스트 주도 반복: 테스트 스위트를 먼저 작성한 뒤, 테스트 실패를 공유하며 반복해 점진적 개선을 유도<\/li><li>인터뷰 패턴: 구현 전에 Claude가 질문하게 하여 개발자가 예상하지 못한 고려 사항을 드러냄<\/li><li>모든 문제를 한 메시지로 제시할 때(서로 영향을 주는 문제)와 순차적으로 수정할 때(독립적인 문제)의 구분<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>자연어 설명이 일관되지 않은 결과를 낼 때 변환 요구사항을 명확히 하기 위해 구체적인 입력/출력 예시 2~3개 제공<\/li><li>구현 전에 기대 동작, 엣지 케이스, 성능 요구사항을 다루는 테스트 스위트를 작성한 뒤, 테스트 실패를 공유하며 반복<\/li><li>익숙하지 않은 분야에서 솔루션을 구현하기 전에 인터뷰 패턴으로 설계 고려 사항(예: 캐시 무효화 전략, 장애 모드) 도출<\/li><li>엣지 케이스 처리를 고치기 위해 예시 입력과 기대 출력이 있는 구체적인 테스트 케이스 제공(예: 마이그레이션 스크립트의 null 값)<\/li><li>수정 사항이 서로 영향을 줄 때는 여러 문제를 하나의 상세한 메시지로 다루고, 독립적인 문제는 순차적으로 반복<\/li><\/ul>", "<h4>Task Statement 3.6: Claude Code를 CI/CD 파이프라인에 통합한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>자동화 파이프라인에서 Claude Code를 비대화형 모드로 실행하기 위한 -p(또는 --print) 플래그<\/li><li>CI 환경에서 정형 출력을 강제하기 위한 --output-format json 및 --json-schema CLI 플래그<\/li><li>CI에서 호출되는 Claude Code에 프로젝트 컨텍스트(테스트 표준, 픽스처 규약, 리뷰 기준)를 제공하는 메커니즘인 CLAUDE.md<\/li><li>세션 컨텍스트 격리: 코드를 생성한 바로 그 Claude 세션은 독립적인 리뷰 인스턴스보다 자신의 변경을 리뷰하는 데 덜 효과적인 이유<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>대화형 입력 대기로 멈추지 않도록 CI에서 -p 플래그로 Claude Code 실행<\/li><li>--output-format json과 --json-schema를 함께 사용해 기계가 파싱할 수 있는 정형 결과를 만들고, PR 인라인 코멘트로 자동 게시<\/li><li>새 커밋 후 리뷰를 다시 실행할 때 이전 리뷰 결과를 컨텍스트에 포함하고, 중복 코멘트를 피하도록 새로운 문제나 아직 해결되지 않은 문제만 보고하라고 지시<\/li><li>테스트 생성이 기존 테스트 스위트에서 이미 다룬 시나리오를 중복 제안하지 않도록 기존 테스트 파일을 컨텍스트로 제공<\/li><li>테스트 생성 품질을 높이고 가치가 낮은 테스트 출력을 줄이기 위해 테스트 표준, 가치 있는 테스트의 기준, 사용 가능한 픽스처를 CLAUDE.md에 문서화<\/li><\/ul>", "<h3>도메인 4: 프롬프트 엔지니어링과 정형 출력 (Prompt Engineering &amp; Structured Output)<\/h3>", "<h4>Task Statement 4.1: 명시적 기준으로 프롬프트를 설계해 정밀도를 높이고 오탐을 줄인다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>모호한 지시보다 명시적 기준이 중요한 이유(예: \"주석이 정확한지 확인하라\" vs \"주석이 주장하는 동작이 실제 코드 동작과 모순될 때만 표시하라\")<\/li><li>\"보수적으로 판단하라\"나 \"확신이 높은 결과만 보고하라\" 같은 일반적 지시는 구체적인 범주형 기준에 비해 정밀도를 높이지 못한다는 점<\/li><li>오탐률이 개발자 신뢰에 미치는 영향: 오탐이 많은 범주가 정확한 범주에 대한 신뢰까지 떨어뜨림<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>확신도 기반 필터링에 의존하지 않고, 보고할 문제(버그, 보안)와 건너뛸 문제(사소한 스타일, 로컬 패턴)를 정의하는 구체적인 리뷰 기준 작성<\/li><li>오탐이 많은 범주의 프롬프트를 개선하는 동안 개발자 신뢰를 회복하기 위해 해당 범주를 일시적으로 비활성화<\/li><li>일관된 분류를 위해 심각도 수준마다 구체적인 코드 예시를 붙인 명시적 심각도 기준 정의<\/li><\/ul>", "<h4>Task Statement 4.2: few-shot 프롬프팅으로 출력의 일관성과 품질을 높인다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>상세한 지시만으로는 결과가 일관되지 않을 때, 형식이 일관되고 실행 가능한 출력을 얻는 가장 효과적인 기법은 few-shot 예시라는 점<\/li><li>모호한 사례의 처리를 보여 주는 few-shot 예시의 역할(예: 모호한 요청에 대한 도구 선택, 분기 수준 테스트 커버리지 공백)<\/li><li>few-shot 예시가 미리 지정된 사례에만 일치시키는 것이 아니라 새로운 패턴에도 판단을 일반화하게 하는 방식<\/li><li>추출 작업에서 환각을 줄이는 few-shot 예시의 효과(예: 비공식적인 측정값, 다양한 문서 구조 처리)<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>모호한 시나리오에 대해, 그럴듯한 대안들 대신 왜 그 행동을 택했는지 추론을 보여 주는 표적 few-shot 예시 2~4개 작성<\/li><li>일관성을 위해 원하는 출력 형식(위치, 문제, 심각도, 수정 제안)을 보여 주는 few-shot 예시 포함<\/li><li>일반화를 가능하게 하면서 오탐을 줄이도록, 허용 가능한 코드 패턴과 실제 문제를 구분하는 few-shot 예시 제공<\/li><li>다양한 문서 구조(본문 내 인용 vs 참고문헌 목록, 방법론 섹션 vs 본문에 녹아 있는 세부 사항)의 올바른 처리를 보여 주는 few-shot 예시 사용<\/li><li>필수 필드가 비어 있거나 null로 추출되는 문제를 해결하기 위해, 다양한 형식의 문서에서 올바르게 추출한 사례를 보여 주는 few-shot 예시 추가<\/li><\/ul>", "<h4>Task Statement 4.3: 도구 사용과 JSON 스키마로 정형 출력을 강제한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>스키마를 준수하는 정형 출력을 보장하고 JSON 구문 오류를 없애는 가장 신뢰할 수 있는 방법은 JSON 스키마를 사용한 도구 사용(tool_use)이라는 점<\/li><li>tool_choice: \"auto\"(모델이 도구 호출 대신 텍스트를 반환할 수 있음), \"any\"(모델이 반드시 도구를 호출하되 어떤 도구인지는 선택 가능), 강제 도구 선택(모델이 지정된 특정 도구를 반드시 호출)의 구분<\/li><li>도구 사용을 통한 엄격한 JSON 스키마는 구문 오류를 없애지만 의미 오류는 막지 못한다는 점(예: 항목 합계가 총액과 맞지 않음, 값이 잘못된 필드에 들어감)<\/li><li>스키마 설계 고려 사항: 필수 vs 선택 필드, 확장 가능한 범주를 위한 \"other\" + 상세 문자열 패턴의 enum 필드<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>JSON 스키마를 입력 매개변수로 하는 추출 도구를 정의하고, tool_use 응답에서 정형 데이터 추출<\/li><li>추출 스키마가 여러 개이고 문서 유형을 알 수 없을 때 정형 출력을 보장하기 위해 tool_choice: \"any\" 설정<\/li><li>보강 단계 전에 특정 추출이 실행되도록 tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}로 특정 도구 강제<\/li><li>원본 문서에 정보가 없을 수 있는 경우 스키마 필드를 선택(nullable)으로 설계하여, 모델이 필수 필드를 채우려고 값을 지어내지 않게 함<\/li><li>모호한 사례를 위한 \"unclear\", 확장 가능한 분류를 위한 \"other\" + 상세 필드 같은 enum 값 추가<\/li><li>일관되지 않은 원본 서식을 처리하기 위해 엄격한 출력 스키마와 함께 서식 정규화 규칙을 프롬프트에 포함<\/li><\/ul>", "<h4>Task Statement 4.4: 추출 품질을 위한 검증, 재시도, 피드백 루프를 구현한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>오류 피드백을 포함한 재시도: 재시도 시 구체적인 검증 오류를 프롬프트에 덧붙여 모델이 수정하도록 유도<\/li><li>재시도의 한계: 필요한 정보가 원본 문서에 아예 없으면 재시도는 효과가 없음(서식 오류나 구조 오류와 대비됨)<\/li><li>피드백 루프 설계: 어떤 코드 구성이 지적을 유발하는지 추적(detected_pattern 필드)하여 기각 패턴을 체계적으로 분석<\/li><li>의미적 검증 오류(값의 합이 맞지 않음, 필드 배치 오류)와 스키마 구문 오류(도구 사용으로 제거됨)의 차이<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>모델의 자기 수정을 위해 원본 문서, 실패한 추출 결과, 구체적인 검증 오류를 포함하는 후속 요청 구현<\/li><li>재시도가 효과 없는 경우(예: 정보가 제공되지 않은 외부 문서에만 있음)와 성공할 경우(서식 불일치, 출력 구조 오류) 식별<\/li><li>개발자가 지적을 기각할 때 오탐 패턴을 분석할 수 있도록 정형 결과에 detected_pattern 필드 추가<\/li><li>자기 수정 검증 흐름 설계: 불일치를 표시하기 위해 \"stated_total\"과 함께 \"calculated_total\"을 추출하고, 원본 데이터가 일관되지 않을 때를 위한 \"conflict_detected\" 불리언 추가<\/li><\/ul>", "<h4>Task Statement 4.5: 효율적인 배치 처리 전략을 설계한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>Message Batches API: 비용 50% 절감, 최대 24시간 처리 창, 지연 시간 SLA 보장 없음<\/li><li>배치 처리는 대기를 막지 않고 지연을 허용하는 워크로드(야간 보고서, 주간 감사, 야간 테스트 생성)에 적합하며, 대기가 필요한 워크플로(병합 전 검사)에는 부적합<\/li><li>배치 API는 단일 요청 안에서 멀티턴 도구 호출을 지원하지 않음(요청 도중 도구를 실행하고 결과를 돌려줄 수 없음)<\/li><li>배치 요청과 응답을 짝짓는 custom_id 필드<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>워크플로의 지연 요구사항에 맞는 API 방식 선택: 대기가 필요한 병합 전 검사에는 동기 API, 야간·주간 분석에는 배치 API<\/li><li>SLA 제약에 따른 배치 제출 빈도 계산(예: 배치 처리 24시간 기준으로 30시간 SLA를 보장하려면 4시간 간격)<\/li><li>배치 실패 처리: 실패한 문서만(custom_id로 식별) 적절히 수정해 다시 제출(예: 컨텍스트 한도를 넘은 문서를 청크로 분할)<\/li><li>대량 배치 처리 전에 샘플 세트로 프롬프트를 다듬어 첫 처리 성공률을 최대화하고 반복 재제출 비용을 줄임<\/li><\/ul>", "<h4>Task Statement 4.6: 다중 인스턴스·다중 패스 리뷰 아키텍처를 설계한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>자기 리뷰의 한계: 모델은 생성 과정의 추론 컨텍스트를 유지하므로, 같은 세션에서 자신의 결정을 의심할 가능성이 낮음<\/li><li>(이전 추론 컨텍스트가 없는) 독립 리뷰 인스턴스가 자기 리뷰 지시나 확장 사고(extended thinking)보다 미묘한 문제를 더 잘 잡아냄<\/li><li>다중 패스 리뷰: 주의력 분산과 모순된 지적을 피하기 위해 대규모 리뷰를 파일별 로컬 분석 패스와 파일 간 통합 패스로 분할<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>생성자의 추론 컨텍스트 없이 생성된 코드를 리뷰하도록 두 번째 독립 Claude 인스턴스 사용<\/li><li>대규모 다중 파일 리뷰를 로컬 문제를 위한 파일별 집중 패스와 파일 간 데이터 흐름 분석을 위한 별도 통합 패스로 분할<\/li><li>보정된(calibrated) 리뷰 라우팅을 위해 모델이 각 지적과 함께 확신도를 스스로 보고하는 검증 패스 실행<\/li><\/ul>", "<h3>도메인 5: 컨텍스트 관리와 신뢰성 (Context Management &amp; Reliability)<\/h3>", "<h4>Task Statement 5.1: 긴 상호작용에서도 핵심 정보가 보존되도록 대화 컨텍스트를 관리한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>점진적 요약의 위험: 수치, 백분율, 날짜, 고객이 밝힌 기대 사항이 모호한 요약으로 뭉개짐<\/li><li>\"중간 소실(lost in the middle)\" 효과: 모델은 긴 입력의 처음과 끝 정보는 안정적으로 처리하지만 중간 부분의 결과는 누락할 수 있음<\/li><li>도구 결과가 컨텍스트에 누적되며 관련성에 비해 과도하게 토큰을 소비하는 방식(예: 주문 조회 한 번에 필드 40개 이상이지만 관련 있는 것은 5개뿐)<\/li><li>대화의 일관성을 유지하려면 후속 API 요청에 전체 대화 기록을 전달해야 한다는 점<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>거래 관련 사실(금액, 날짜, 주문 번호, 상태)을 요약된 기록 밖의 영속적인 \"사건 사실(case facts)\" 블록으로 추출해 매 프롬프트에 포함<\/li><li>여러 사안이 있는 세션에서 구조화된 사안 데이터(주문 ID, 금액, 상태)를 별도의 컨텍스트 계층으로 추출·유지<\/li><li>장황한 도구 출력이 컨텍스트에 누적되기 전에 관련 필드만 남기도록 정리(예: 주문 조회에서 반품 관련 필드만 유지)<\/li><li>위치 효과를 완화하기 위해 집계된 입력의 맨 앞에 핵심 결과 요약을 두고, 상세 결과는 명시적인 섹션 제목으로 정리<\/li><li>정확한 다운스트림 종합을 위해 서브에이전트가 정형 출력에 메타데이터(날짜, 출처 위치, 방법론적 맥락)를 포함하도록 요구<\/li><li>다운스트림 에이전트의 컨텍스트 예산이 제한적일 때, 업스트림 에이전트가 장황한 내용과 추론 과정 대신 정형 데이터(핵심 사실, 인용, 관련성 점수)를 반환하도록 수정<\/li><\/ul>", "<h4>Task Statement 5.2: 효과적인 에스컬레이션과 모호성 해소 패턴을 설계한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>적절한 에스컬레이션 트리거: 고객이 사람을 요청할 때, 정책 예외·공백이 있을 때(단지 복잡한 사례가 아니라), 의미 있는 진전을 낼 수 없을 때<\/li><li>고객이 명시적으로 요구하면 즉시 에스컬레이션하는 것과, 문제가 간단할 때 해결을 제안하는 것의 구분<\/li><li>감정 기반 에스컬레이션과 자기 보고 확신도 점수가 실제 사례 복잡도의 대리 지표로 신뢰할 수 없는 이유<\/li><li>고객 일치 항목이 여러 개일 때는 휴리스틱으로 고르지 말고 확인(추가 식별 정보 요청)이 필요하다는 점<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>에스컬레이션할 때와 자율적으로 해결할 때를 보여 주는 few-shot 예시와 함께 명시적 에스컬레이션 기준을 시스템 프롬프트에 추가<\/li><li>상담원을 요청하는 고객의 명시적 요청은 먼저 조사하려 하지 않고 즉시 수용<\/li><li>문제가 에이전트의 처리 범위 안에 있으면 불만에 공감하면서 해결을 제안하고, 고객이 다시 요구할 때만 에스컬레이션<\/li><li>고객의 특정 요청에 대해 정책이 모호하거나 언급이 없으면 에스컬레이션(예: 정책은 자사 사이트 가격 조정만 다루는데 경쟁사 가격 맞춤을 요청한 경우)<\/li><li>도구 결과가 여러 일치 항목을 반환하면 휴리스틱으로 고르지 말고 추가 식별 정보를 요청하도록 에이전트에 지시<\/li><\/ul>", "<h4>Task Statement 5.3: 멀티 에이전트 시스템 전반의 오류 전파 전략을 구현한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>코디네이터의 지능적인 복구 결정을 가능하게 하는 구조화된 오류 컨텍스트(실패 유형, 시도한 쿼리, 부분 결과, 대안 접근)<\/li><li>접근 실패(재시도 결정이 필요한 타임아웃)와 유효한 빈 결과(일치 항목이 없는 성공한 쿼리)의 구분<\/li><li>범용 오류 상태(\"search unavailable\")가 코디네이터에게서 유용한 맥락을 숨기는 이유<\/li><li>오류를 조용히 억제하는 것(빈 결과를 성공으로 반환)과 한 번의 실패로 전체 워크플로를 종료하는 것이 둘 다 안티패턴인 이유<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>코디네이터가 복구할 수 있도록 실패 유형, 시도한 내용, 부분 결과, 가능한 대안을 포함한 구조화된 오류 컨텍스트 반환<\/li><li>코디네이터가 적절히 결정할 수 있도록 오류 보고에서 접근 실패와 유효한 빈 결과를 구분<\/li><li>서브에이전트가 일시적 실패에 대해 로컬 복구를 구현하고, 해결할 수 없는 오류만 시도한 내용 및 부분 결과와 함께 전파<\/li><li>어떤 결과는 근거가 충분하고 어떤 주제 영역은 출처를 이용할 수 없어 공백이 있는지 나타내는 커버리지 주석을 붙여 종합 출력을 구성<\/li><\/ul>", "<h4>Task Statement 5.4: 대규모 코드베이스 탐색에서 컨텍스트를 효과적으로 관리한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>긴 세션에서의 컨텍스트 저하: 모델이 일관되지 않은 답을 내기 시작하고, 앞서 발견한 구체적인 클래스 대신 \"일반적인 패턴\"을 언급함<\/li><li>컨텍스트 경계를 넘어 핵심 결과를 유지하기 위한 스크래치패드 파일의 역할<\/li><li>메인 에이전트가 상위 수준의 이해를 조율하는 동안, 장황한 탐색 출력을 격리하기 위한 서브에이전트 위임<\/li><li>장애 복구를 위한 구조화된 상태 영속화: 각 에이전트가 정해진 위치에 상태를 내보내고, 코디네이터는 재개 시 매니페스트를 로드<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>메인 에이전트가 상위 수준 조율을 유지하는 동안 특정 질문을 조사할 서브에이전트 생성(예: \"모든 테스트 파일 찾기\", \"환불 흐름의 의존성 추적\")<\/li><li>컨텍스트 저하에 대응하기 위해 에이전트가 핵심 결과를 기록한 스크래치패드 파일을 유지하고 이후 질문에서 참조하게 함<\/li><li>다음 단계의 서브에이전트를 생성하기 전에 이전 탐색 단계의 핵심 결과를 요약하고, 그 요약을 초기 컨텍스트에 주입<\/li><li>코디네이터가 재개 시 로드해 에이전트 프롬프트에 주입하는 구조화된 에이전트 상태 내보내기(매니페스트)로 장애 복구 설계<\/li><li>장황한 탐색 출력으로 컨텍스트가 찰 때, 긴 탐색 세션 중 컨텍스트 사용량을 줄이기 위해 /compact 사용<\/li><\/ul>", "<h4>Task Statement 5.5: 사람의 검토 워크플로와 확신도 보정을 설계한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>전체 정확도 지표(예: 전체 97%)가 특정 문서 유형이나 필드의 낮은 성능을 가릴 수 있는 위험<\/li><li>확신도가 높은 추출의 오류율을 측정하고 새로운 오류 패턴을 감지하기 위한 층화 무작위 표본 추출(stratified random sampling)<\/li><li>검토 노력을 배분하기 위해 레이블이 있는 검증 세트로 보정한 필드 수준 확신도 점수<\/li><li>확신도가 높은 추출을 자동화하기 전에 문서 유형별·필드 구간별로 정확도를 검증하는 것의 중요성<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>지속적인 오류율 측정과 새로운 패턴 감지를 위해 확신도가 높은 추출에 대해 층화 무작위 표본 추출 구현<\/li><li>사람의 검토를 줄이기 전에 모든 구간에서 성능이 일관된지 확인하기 위해 문서 유형별·필드별 정확도 분석<\/li><li>모델이 필드 수준 확신도 점수를 출력하게 한 뒤, 레이블이 있는 검증 세트로 검토 임계값 보정<\/li><li>제한된 검토자 역량을 우선 배분하기 위해, 모델 확신도가 낮거나 원본 문서가 모호·모순되는 추출을 사람의 검토로 라우팅<\/li><\/ul>", "<h4>Task Statement 5.6: 다중 출처 종합에서 정보의 출처(provenance)를 보존하고 불확실성을 처리한다<\/h4>\n<p><strong>지식:<\/strong><\/p>\n<ul><li>주장과 출처의 대응 관계를 보존하지 않고 결과를 압축하면 요약 단계에서 출처 귀속이 사라지는 방식<\/li><li>종합 에이전트가 결과를 결합할 때 보존하고 병합해야 하는 구조화된 주장-출처 매핑의 중요성<\/li><li>신뢰할 만한 출처 간 통계가 충돌할 때의 처리: 하나의 값을 임의로 고르지 않고 출처 귀속과 함께 충돌을 주석으로 표시<\/li><li>시간 데이터: 시점 차이가 모순으로 잘못 해석되지 않도록 정형 출력에 발행일·수집일을 요구<\/li><\/ul>\n<p><strong>기술:<\/strong><\/p>\n<ul><li>서브에이전트가 구조화된 주장-출처 매핑(출처 URL, 문서명, 관련 발췌)을 출력하고, 다운스트림 에이전트가 종합 과정 내내 이를 보존하도록 요구<\/li><li>원래 출처의 서술과 방법론적 맥락을 보존하면서, 충분히 확립된 결과와 논쟁 중인 결과를 구분하는 명시적 섹션으로 보고서 구성<\/li><li>충돌하는 값을 포함하고 명시적으로 주석을 단 채 문서 분석을 완료하고, 종합으로 넘기기 전에 조정 방법은 코디네이터가 결정하게 함<\/li><li>시간적 해석이 올바르도록 서브에이전트가 정형 출력에 발행일 또는 데이터 수집일을 포함하도록 요구<\/li><li>모든 것을 하나의 형식으로 바꾸지 않고, 종합 출력에서 콘텐츠 유형별로 적절히 표현(재무 데이터는 표, 뉴스는 산문, 기술적 결과는 구조화된 목록)<\/li><\/ul>"]}, {"n": "7", "title": "준비 방법", "secs": ["<p>이 자격 시험을 준비하려면 다음을 하십시오.<\/p>\n<ul><li><strong>Claude Agent SDK로 에이전트를 구축하십시오:<\/strong> 도구 호출, 오류 처리, 세션 관리를 갖춘 완전한 에이전트 루프를 구현하십시오. 서브에이전트를 생성하고 그 사이에서 컨텍스트를 전달하는 연습을 하십시오.<\/li><li><strong>실제 프로젝트에 Claude Code를 구성하십시오:<\/strong> 구성 계층을 갖춘 CLAUDE.md를 설정하고, .claude/rules/에 경로별 규칙을 만들고, frontmatter 옵션(context: fork, allowed-tools)을 사용한 커스텀 스킬을 만들고, MCP 서버를 하나 이상 통합하십시오.<\/li><li><strong>MCP 도구를 설계하고 테스트하십시오:<\/strong> 유사한 도구를 명확히 구분하는 도구 설명을 작성하십시오. 오류 범주와 재시도 가능 플래그를 갖춘 구조화된 오류 응답을 구현하십시오. 모호한 요청으로 도구 선택의 신뢰성을 테스트하십시오.<\/li><li><strong>정형 데이터 추출 파이프라인을 구축하십시오:<\/strong> JSON 스키마와 함께 tool_use를 사용하고, 검증-재시도 루프를 구현하고, 선택/nullable 필드가 있는 스키마를 설계하고, Message Batches API로 배치 처리를 연습하십시오.<\/li><li><strong>프롬프트 엔지니어링 기법을 연습하십시오:<\/strong> 모호한 시나리오를 위한 few-shot 예시를 작성하십시오. 오탐을 줄이기 위한 명시적 리뷰 기준을 정의하십시오. 대규모 코드 리뷰를 위한 다중 패스 리뷰 아키텍처를 설계하십시오.<\/li><li><strong>컨텍스트 관리 패턴을 학습하십시오:<\/strong> 장황한 도구 출력에서 구조화된 사실을 추출하고, 긴 세션을 위한 스크래치패드 파일을 구현하고, 컨텍스트 한도를 관리하기 위한 서브에이전트 위임을 설계하는 연습을 하십시오.<\/li><li><strong>에스컬레이션과 휴먼 인 더 루프 패턴을 복습하십시오:<\/strong> 언제 에스컬레이션해야 하는지(정책 공백, 고객 요청, 진전 불가)와 언제 자율적으로 해결해야 하는지 이해하십시오. 확신도 기반 라우팅을 갖춘 사람의 검토 워크플로를 설계하는 연습을 하십시오.<\/li><\/ul>"]}, {"n": "8", "title": "준비 연습", "secs": ["<p>시험에서 다루는 주제에 실무적으로 익숙해지도록 다음 실습 연습을 완료하십시오. 각 연습은 하나 이상의 시험 도메인에 걸친 지식을 강화하도록 설계되었습니다.<\/p>", "<h3>연습 1: 에스컬레이션 로직을 갖춘 다중 도구 에이전트 구축<\/h3>\n<p><strong>목표:<\/strong> 도구 통합, 구조화된 오류 처리, 에스컬레이션 패턴을 갖춘 에이전트 루프 설계를 연습합니다.<\/p>\n<p><strong>단계:<\/strong><\/p>\n<ul><li>각 도구의 목적, 예상 입력, 경계 조건을 명확히 구분하는 상세한 설명을 가진 MCP 도구 3~4개를 정의하십시오. 선택 혼동을 피하려면 신중한 설명이 필요한, 기능이 비슷한 도구를 최소 두 개 포함하십시오.<\/li><li>stop_reason을 확인해 도구 실행을 계속할지 최종 응답을 제시할지 결정하는 에이전트 루프를 구현하십시오. \"tool_use\"와 \"end_turn\" 두 stop reason을 모두 올바르게 처리하십시오.<\/li><li>도구에 구조화된 오류 응답을 추가하십시오. errorCategory(transient/validation/permission), isRetryable 불리언, 사람이 읽을 수 있는 설명을 포함하십시오. 에이전트가 각 오류 유형을 적절히 처리하는지(일시적 오류는 재시도, 비즈니스 오류는 사용자에게 설명) 테스트하십시오.<\/li><li>도구 호출을 가로채 비즈니스 규칙을 강제하고(예: 기준 금액을 넘는 작업 차단), 발동 시 에스컬레이션 워크플로로 돌리는 프로그래밍적 훅을 구현하십시오.<\/li><li>여러 사안이 섞인 메시지(예: 여러 문제가 포함된 요청)로 테스트하여, 에이전트가 요청을 분해하고 각 사안을 처리한 뒤 하나의 통합된 응답으로 종합하는지 확인하십시오.<\/li><\/ul>\n<p><strong>강화되는 도메인:<\/strong> 도메인 1(에이전트 아키텍처와 오케스트레이션), 도메인 2(도구 설계와 MCP 통합), 도메인 5(컨텍스트 관리와 신뢰성)<\/p>", "<h3>연습 2: 팀 개발 워크플로를 위한 Claude Code 구성<\/h3>\n<p><strong>목표:<\/strong> 여러 개발자가 참여하는 프로젝트를 위해 CLAUDE.md 계층, 커스텀 슬래시 명령, 경로별 규칙, MCP 서버 통합을 구성하는 연습을 합니다.<\/p>\n<p><strong>단계:<\/strong><\/p>\n<ul><li>공통 코딩 표준과 테스트 규약을 담은 프로젝트 수준 CLAUDE.md를 만드십시오. 프로젝트 수준에 둔 지시가 모든 팀원에게 일관되게 적용되는지 확인하십시오.<\/li><li>코드 영역별로 YAML frontmatter glob 패턴을 가진 .claude/rules/ 파일을 만드십시오(예: API 규약에는 paths: [\"src/api/<strong>/*\"], 테스트 규약에는 paths: [\"<\/strong>/*.test.*\"]). 일치하는 파일을 편집할 때만 규칙이 로드되는지 테스트하십시오.<\/li><li>context: fork와 allowed-tools 제한을 둔 프로젝트 범위 스킬을 .claude/skills/에 만드십시오. 스킬이 메인 대화 컨텍스트를 오염시키지 않고 격리되어 실행되는지 확인하십시오.<\/li><li>자격 증명에 환경 변수 확장을 사용하여 .mcp.json에 MCP 서버를 구성하십시오. ~/.claude.json에 개인 실험용 MCP 서버를 추가하고 두 서버를 동시에 사용할 수 있는지 확인하십시오.<\/li><li>복잡도가 다른 작업으로 플랜 모드와 직접 실행을 테스트하십시오: 단일 파일 버그 수정, 다중 파일 라이브러리 마이그레이션, 타당한 구현 방식이 여러 개인 신규 기능. 플랜 모드가 언제 가치를 주는지 관찰하십시오.<\/li><\/ul>\n<p><strong>강화되는 도메인:<\/strong> 도메인 3(Claude Code 구성과 워크플로), 도메인 2(도구 설계와 MCP 통합)<\/p>", "<h3>연습 3: 정형 데이터 추출 파이프라인 구축<\/h3>\n<p><strong>목표:<\/strong> JSON 스키마 설계, 정형 출력을 위한 tool_use 사용, 검증-재시도 루프 구현, 배치 처리 전략 설계를 연습합니다.<\/p>\n<p><strong>단계:<\/strong><\/p>\n<ul><li>필수 및 선택 필드, \"other\" + 상세 문자열 패턴을 가진 enum, 원본 문서에 없을 수 있는 정보를 위한 nullable 필드를 포함한 JSON 스키마로 추출 도구를 정의하십시오. 일부 필드가 없는 문서를 처리하여 모델이 값을 지어내지 않고 null을 반환하는지 확인하십시오.<\/li><li>검증-재시도 루프를 구현하십시오. Pydantic 또는 JSON 스키마 검증이 실패하면 문서, 실패한 추출 결과, 구체적인 검증 오류를 포함한 후속 요청을 보내십시오. 어떤 오류가 재시도로 해결되고(서식 불일치) 어떤 오류는 해결되지 않는지(원본에 정보가 없음) 추적하십시오.<\/li><li>다양한 형식의 문서(예: 본문 내 인용 vs 참고문헌 목록, 서술형 설명 vs 구조화된 표)에서의 추출을 보여 주는 few-shot 예시를 추가하고, 구조적 다양성 처리가 개선되는지 확인하십시오.<\/li><li>배치 처리 전략을 설계하십시오. Message Batches API로 문서 100개를 배치로 제출하고, custom_id로 실패를 처리하고, 실패한 문서를 수정해 다시 제출하고(예: 너무 큰 문서를 청크로 분할), SLA 제약 대비 총 처리 시간을 계산하십시오.<\/li><li>사람의 검토 라우팅 전략을 구현하십시오. 모델이 필드 수준 확신도 점수를 출력하게 하고, 확신도가 낮은 추출을 사람의 검토로 라우팅하고, 문서 유형별·필드별 정확도를 분석하여 성능이 일관된지 확인하십시오.<\/li><\/ul>\n<p><strong>강화되는 도메인:<\/strong> 도메인 4(프롬프트 엔지니어링과 정형 출력), 도메인 5(컨텍스트 관리와 신뢰성)<\/p>", "<h3>연습 4: 멀티 에이전트 리서치 파이프라인 설계와 디버깅<\/h3>\n<p><strong>목표:<\/strong> 서브에이전트 오케스트레이션, 컨텍스트 전달 관리, 오류 전파 구현, 출처 추적을 갖춘 종합 처리를 연습합니다.<\/p>\n<p><strong>단계:<\/strong><\/p>\n<ul><li>최소 두 개의 서브에이전트(예: 웹 검색, 문서 분석)에 위임하는 코디네이터 에이전트를 구축하십시오. 코디네이터의 allowedTools에 \"Task\"가 포함되어 있는지, 각 서브에이전트가 자동 컨텍스트 상속에 의존하지 않고 프롬프트에서 직접 리서치 결과를 받는지 확인하십시오.<\/li><li>코디네이터가 단일 응답에서 Task 도구 호출을 여러 개 내보내게 하여 병렬 서브에이전트 실행을 구현하십시오. 순차 실행과 비교한 지연 시간 개선을 측정하십시오.<\/li><li>내용과 메타데이터를 분리하는 서브에이전트용 정형 출력을 설계하십시오. 각 결과에는 주장, 근거 발췌, 출처 URL/문서명, 발행일이 포함되어야 합니다. 종합 서브에이전트가 결과를 결합할 때 출처 귀속을 보존하는지 확인하십시오.<\/li><li>오류 전파를 구현하십시오. 서브에이전트 타임아웃을 시뮬레이션하고 코디네이터가 구조화된 오류 컨텍스트(실패 유형, 시도한 쿼리, 부분 결과)를 받는지 확인하십시오. 코디네이터가 부분 결과로 진행하고 최종 출력에 커버리지 공백을 주석으로 표시할 수 있는지 테스트하십시오.<\/li><li>충돌하는 원본 데이터(예: 통계가 다른 두 신뢰할 만한 출처)로 테스트하여, 종합 출력이 하나를 임의로 고르지 않고 두 값을 출처 귀속과 함께 보존하는지, 보고서가 충분히 확립된 결과와 논쟁 중인 결과를 구분하도록 구성되는지 확인하십시오.<\/li><\/ul>\n<p><strong>강화되는 도메인:<\/strong> 도메인 1(에이전트 아키텍처와 오케스트레이션), 도메인 2(도구 설계와 MCP 통합), 도메인 5(컨텍스트 관리와 신뢰성)<\/p>"]}, {"n": "9", "title": "샘플 문제", "secs": ["<p>다음 샘플 문제는 시험의 형식과 난이도를 보여 줍니다. 모의시험(practice test)에서 가져온 것이며 학습을 돕는 해설이 포함되어 있습니다.<\/p>", "<h3>시나리오: 고객 지원 해결 에이전트<\/h3>\n<p><strong>문제 1.<\/strong> 프로덕션 데이터에 따르면 사례의 12%에서 에이전트가 get_customer를 완전히 건너뛰고 고객이 말한 이름만으로 lookup_order를 호출하며, 이로 인해 가끔 계정을 잘못 식별하고 잘못된 환불이 발생합니다. 이 신뢰성 문제를 가장 효과적으로 해결할 변경은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. get_customer가 검증된 고객 ID를 반환할 때까지 lookup_order와 process_refund 호출을 차단하는 프로그래밍적 사전 조건을 추가한다.<\/li><li>B. 주문 관련 작업 전에 get_customer를 통한 고객 확인이 필수라고 시스템 프롬프트에 명시한다.<\/li><li>C. 고객이 주문 정보를 먼저 말하더라도 에이전트가 항상 get_customer를 먼저 호출하는 few-shot 예시를 추가한다.<\/li><li>D. 각 요청을 분석해 해당 요청 유형에 적합한 도구 일부만 활성화하는 라우팅 분류기를 구현한다.<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: A.<\/strong> 핵심 비즈니스 로직(환불 처리 전 고객 신원 확인 등)에 특정 도구 순서가 필요할 때, 프로그래밍적 강제는 프롬프트 기반 접근이 줄 수 없는 결정적 보장을 제공합니다. B와 C는 LLM의 확률적 준수에 의존하므로, 오류가 금전적 결과로 이어지는 상황에서는 불충분합니다. D는 도구 순서가 아니라 도구 사용 가능 여부를 다루므로 실제 문제가 아닙니다.<\/p><\/details>\n<p><strong>문제 2.<\/strong> 프로덕션 로그에 따르면 사용자가 주문에 대해 물을 때(예: \"주문 #12345 확인해 주세요\") 에이전트가 lookup_order 대신 get_customer를 자주 호출합니다. 두 도구 모두 설명이 최소한(\"Retrieves customer information\" / \"Retrieves order details\")이고 비슷한 식별자 형식을 받습니다. 도구 선택 신뢰성을 높이기 위한 가장 효과적인 첫 단계는 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 올바른 도구 선택 패턴을 보여 주는 few-shot 예시를 시스템 프롬프트에 추가한다. 주문 관련 쿼리가 lookup_order로 라우팅되는 예시 5~8개를 넣는다.<\/li><li>B. 각 도구의 설명을 확장하여 처리하는 입력 형식, 예시 쿼리, 엣지 케이스, 유사 도구 대신 그 도구를 써야 하는 경우를 설명하는 경계를 포함한다.<\/li><li>C. 매 턴 전에 사용자 입력을 파싱하고 감지된 키워드와 식별자 패턴에 따라 적절한 도구를 미리 선택하는 라우팅 계층을 구현한다.<\/li><li>D. 두 도구를 어떤 식별자든 받아 내부적으로 조회할 백엔드를 결정하는 단일 lookup_entity 도구로 통합한다.<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: B.<\/strong> 도구 설명은 LLM이 도구를 선택하는 주된 메커니즘입니다. 설명이 최소한이면 모델은 유사한 도구를 구분할 맥락이 없습니다. B는 적은 노력으로 큰 효과를 내는 수정으로 이 근본 원인을 직접 해결합니다. few-shot 예시(A)는 근본 문제를 고치지 못한 채 토큰 오버헤드만 늘립니다. 라우팅 계층(C)은 과잉 설계이며 LLM의 자연어 이해를 우회합니다. 도구 통합(D)은 타당한 아키텍처 선택이지만, 당면 문제가 부적절한 설명일 때 \"첫 단계\"로는 노력이 과합니다.<\/p><\/details>\n<p><strong>문제 3.<\/strong> 에이전트의 첫 응대 해결률이 55%로 목표인 80%에 크게 못 미칩니다. 로그를 보면 간단한 사례(사진 증거가 있는 표준 파손 교환)는 에스컬레이션하면서, 정책 예외가 필요한 복잡한 상황은 자율적으로 처리하려 합니다. 에스컬레이션 판단을 개선하는 가장 효과적인 방법은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 에스컬레이션할 때와 자율적으로 해결할 때를 보여 주는 few-shot 예시와 함께 명시적 에스컬레이션 기준을 시스템 프롬프트에 추가한다.<\/li><li>B. 에이전트가 각 응답 전에 확신도 점수(1~10)를 스스로 보고하게 하고, 확신도가 임계값 아래로 떨어지면 요청을 자동으로 사람에게 라우팅한다.<\/li><li>C. 과거 티켓으로 학습한 별도의 분류기 모델을 배치해, 메인 에이전트가 처리를 시작하기 전에 어떤 요청이 에스컬레이션이 필요한지 예측한다.<\/li><li>D. 감정 분석을 구현해 고객 불만 수준을 감지하고, 부정적 감정이 임계값을 넘으면 자동으로 에스컬레이션한다.<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: A.<\/strong> few-shot 예시와 함께 명시적 에스컬레이션 기준을 추가하면 근본 원인인 불명확한 판단 경계를 직접 해결합니다. 이것은 인프라를 추가하기 전에 취할 수 있는 비례적인 첫 대응입니다. B는 LLM의 자기 보고 확신도가 잘 보정되어 있지 않기 때문에 실패합니다. 에이전트는 이미 어려운 사례에서 잘못된 확신을 갖고 있습니다. C는 프롬프트 최적화를 시도해 보지도 않은 상태에서 레이블 데이터와 ML 인프라를 요구하는 과잉 설계입니다. D는 완전히 다른 문제를 해결합니다. 감정은 실제 문제인 사례 복잡도와 상관이 없습니다.<\/p><\/details>", "<h3>시나리오: Claude Code를 활용한 코드 생성<\/h3>\n<p><strong>문제 4.<\/strong> 팀의 표준 코드 리뷰 체크리스트를 실행하는 커스텀 /review 슬래시 명령을 만들려고 합니다. 이 명령은 모든 개발자가 저장소를 clone하거나 pull하면 사용할 수 있어야 합니다. 이 명령 파일을 어디에 만들어야 합니까?<\/p>\n<ul class=\"opts\"><li>A. 프로젝트 저장소의 .claude/commands/ 디렉터리<\/li><li>B. 각 개발자 홈 디렉터리의 ~/.claude/commands/<\/li><li>C. 프로젝트 루트의 CLAUDE.md 파일<\/li><li>D. commands 배열을 가진 .claude/config.json 파일<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: A.<\/strong> 프로젝트 범위 커스텀 슬래시 명령은 저장소 안의 .claude/commands/ 디렉터리에 저장해야 합니다. 이 명령은 버전 관리되며, 개발자가 저장소를 clone하거나 pull하면 자동으로 모두에게 제공됩니다. B(~/.claude/commands/)는 버전 관리로 공유되지 않는 개인용 명령을 위한 곳입니다. C(CLAUDE.md)는 프로젝트 지시와 컨텍스트를 위한 것이지 명령 정의를 위한 것이 아닙니다. D는 Claude Code에 존재하지 않는 구성 메커니즘을 설명합니다.<\/p><\/details>\n<p><strong>문제 5.<\/strong> 팀의 모놀리식 애플리케이션을 마이크로서비스로 재구성하는 일을 맡았습니다. 수십 개 파일에 걸친 변경이 필요하고 서비스 경계와 모듈 의존성에 관한 결정이 필요합니다. 어떤 접근을 택해야 합니까?<\/p>\n<ul class=\"opts\"><li>A. 플랜 모드로 들어가 코드베이스를 탐색하고 의존성을 이해하고 구현 방식을 설계한 뒤 변경한다.<\/li><li>B. 직접 실행으로 시작해 점진적으로 변경하면서 구현 과정에서 자연스러운 서비스 경계가 드러나게 한다.<\/li><li>C. 각 서비스를 정확히 어떻게 구성할지 상세히 적은 포괄적인 사전 지시와 함께 직접 실행을 사용한다.<\/li><li>D. 직접 실행 모드로 시작하고, 구현 중 예상치 못한 복잡성을 만나면 그때만 플랜 모드로 전환한다.<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: A.<\/strong> 플랜 모드는 대규모 변경, 여러 타당한 접근, 아키텍처 결정이 포함된 복잡한 작업을 위해 설계되었으며, 모놀리스에서 마이크로서비스로의 재구성이 바로 그런 작업입니다. 플랜 모드는 변경을 확정하기 전에 안전하게 코드베이스를 탐색하고 설계할 수 있게 합니다. B는 의존성이 늦게 발견될 때 비용이 큰 재작업 위험이 있습니다. C는 코드를 탐색하지 않고도 올바른 구조를 이미 안다고 가정합니다. D는 복잡성이 나중에 드러날지 모르는 것이 아니라 이미 요구사항에 명시되어 있다는 점을 무시합니다.<\/p><\/details>\n<p><strong>문제 6.<\/strong> 코드베이스에 코딩 규약이 서로 다른 영역이 있습니다. React 컴포넌트는 훅을 쓰는 함수형 스타일, API 핸들러는 특정 오류 처리를 갖춘 async/await, 데이터베이스 모델은 리포지토리 패턴을 따릅니다. 테스트 파일은 테스트 대상 코드 옆에 코드베이스 전체에 흩어져 있으며(예: Button.tsx 옆의 Button.test.tsx), 위치와 관계없이 모든 테스트가 같은 규약을 따르기를 원합니다. Claude가 코드를 생성할 때 올바른 규약을 자동으로 적용하게 하는 가장 유지보수하기 좋은 방법은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. .claude/rules/에 glob 패턴을 지정한 YAML frontmatter를 가진 규칙 파일을 만들어 파일 경로에 따라 규약을 조건부로 적용한다<\/li><li>B. 모든 규약을 루트 CLAUDE.md 파일에 영역별 제목 아래 모아 두고, 어느 섹션이 적용되는지는 Claude가 추론하게 한다<\/li><li>C. 코드 유형별로 .claude/skills/에 스킬을 만들고 SKILL.md 파일에 관련 규약을 포함한다<\/li><li>D. 각 하위 디렉터리에 해당 영역의 규약을 담은 별도의 CLAUDE.md 파일을 둔다<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: A.<\/strong> glob 패턴(예: **/*.test.tsx)을 쓰는 .claude/rules/는 디렉터리 위치와 관계없이 파일 경로에 따라 규약을 자동으로 적용할 수 있어, 코드베이스 전체에 흩어진 테스트 파일에 필수적이므로 A가 정답입니다. B는 명시적 매칭이 아닌 추론에 의존하므로 신뢰할 수 없습니다. C는 스킬을 수동으로 호출하거나 Claude가 로드하기로 선택하는 데 의존하므로, 파일 경로에 따른 결정적인 \"자동\" 적용이라는 요구와 맞지 않습니다. D는 CLAUDE.md 파일이 디렉터리에 묶여 있어 여러 디렉터리에 흩어진 파일을 쉽게 처리할 수 없습니다.<\/p><\/details>", "<h3>시나리오: 멀티 에이전트 리서치 시스템<\/h3>\n<p><strong>문제 7.<\/strong> \"AI가 창작 산업에 미치는 영향\"이라는 주제로 시스템을 실행한 뒤, 각 서브에이전트가 성공적으로 완료되는 것을 확인했습니다. 웹 검색 에이전트는 관련 기사를 찾고, 문서 분석 에이전트는 논문을 올바르게 요약하고, 종합 에이전트는 일관된 결과물을 만듭니다. 그런데 최종 보고서는 시각 예술만 다루고 음악, 글쓰기, 영화 제작은 완전히 빠져 있습니다. 코디네이터의 로그를 보니 주제를 \"디지털 아트 창작에서의 AI\", \"그래픽 디자인에서의 AI\", \"사진에서의 AI\"라는 세 하위 작업으로 분해했습니다. 가장 가능성 높은 근본 원인은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 종합 에이전트에 다른 에이전트로부터 받은 결과의 커버리지 공백을 식별하라는 지시가 없다.<\/li><li>B. 코디네이터 에이전트의 작업 분해가 너무 좁아서, 서브에이전트 할당이 주제의 관련 영역을 모두 다루지 못한다.<\/li><li>C. 웹 검색 에이전트의 쿼리가 충분히 포괄적이지 않으므로 더 많은 창작 산업 분야를 다루도록 확장해야 한다.<\/li><li>D. 문서 분석 에이전트가 지나치게 엄격한 관련성 기준 때문에 비시각 창작 산업 관련 출처를 걸러 내고 있다.<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: B.<\/strong> 코디네이터의 로그가 근본 원인을 직접 보여 줍니다. \"창작 산업\"을 시각 예술 하위 작업(디지털 아트, 그래픽 디자인, 사진)으로만 분해하여 음악, 글쓰기, 영화를 완전히 빠뜨렸습니다. 서브에이전트들은 할당된 작업을 올바르게 수행했으며, 문제는 무엇을 할당받았는가입니다. A, C, D는 할당된 범위 안에서 올바르게 작동하는 다운스트림 에이전트를 잘못 탓합니다.<\/p><\/details>\n<p><strong>문제 8.<\/strong> 웹 검색 서브에이전트가 복잡한 주제를 조사하다가 타임아웃되었습니다. 이 실패 정보가 코디네이터 에이전트로 어떻게 전달될지 설계해야 합니다. 지능적인 복구를 가장 잘 가능하게 하는 오류 전파 방식은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 실패 유형, 시도한 쿼리, 부분 결과, 가능한 대안 접근을 포함한 구조화된 오류 컨텍스트를 코디네이터에 반환한다.<\/li><li>B. 서브에이전트 안에 지수 백오프를 적용한 자동 재시도 로직을 구현하고, 모든 재시도가 소진된 후에만 범용 \"search unavailable\" 상태를 반환한다.<\/li><li>C. 서브에이전트 안에서 타임아웃을 잡아 성공으로 표시된 빈 결과 세트를 반환한다.<\/li><li>D. 타임아웃 예외를 최상위 핸들러로 직접 전파하여 전체 리서치 워크플로를 종료한다.<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: A.<\/strong> 구조화된 오류 컨텍스트는 코디네이터가 지능적인 복구 결정을 내리는 데 필요한 정보를 줍니다. 수정된 쿼리로 재시도할지, 대안 접근을 시도할지, 부분 결과로 진행할지 판단할 수 있습니다. B의 범용 상태는 코디네이터에게서 유용한 맥락을 숨겨 근거 있는 결정을 막습니다. C는 실패를 성공으로 표시해 오류를 억제하므로 어떤 복구도 불가능해지고 불완전한 리서치 결과의 위험이 생깁니다. D는 복구 전략이 성공할 수 있는데도 불필요하게 전체 워크플로를 종료합니다.<\/p><\/details>\n<p><strong>문제 9.<\/strong> 테스트 중, 종합 에이전트가 결과를 결합하면서 특정 주장을 검증해야 하는 일이 잦다는 것을 확인했습니다. 현재는 검증이 필요하면 종합 에이전트가 코디네이터에 제어를 넘기고, 코디네이터가 웹 검색 에이전트를 호출한 뒤 결과와 함께 종합을 다시 호출합니다. 이 때문에 작업당 왕복이 2~3회 늘고 지연 시간이 40% 증가합니다. 평가 결과 이 검증의 85%는 단순한 사실 확인(날짜, 이름, 통계)이고 15%는 더 깊은 조사가 필요합니다. 시스템 신뢰성을 유지하면서 오버헤드를 줄이는 가장 효과적인 방법은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. 종합 에이전트에 단순 조회용으로 범위가 제한된 verify_fact 도구를 주고, 복잡한 검증은 계속 코디네이터를 통해 웹 검색 에이전트에 위임한다.<\/li><li>B. 종합 에이전트가 모든 검증 요구를 모아 두었다가 패스가 끝날 때 코디네이터에 일괄 반환하고, 코디네이터가 이를 한꺼번에 웹 검색 에이전트에 보낸다.<\/li><li>C. 종합 에이전트가 코디네이터를 거치는 왕복 없이 어떤 검증 요구든 직접 처리할 수 있도록 모든 웹 검색 도구에 대한 접근 권한을 준다.<\/li><li>D. 웹 검색 에이전트가 초기 조사 중에 종합 에이전트가 검증할 만한 내용을 예상하여 각 출처 주변의 추가 맥락을 미리 캐시하게 한다.<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: A.<\/strong> A는 최소 권한 원칙을 적용하여, 종합 에이전트에 85%의 일반적인 경우(단순 사실 검증)에 필요한 것만 주고 복잡한 경우에는 기존 조율 패턴을 유지합니다. B의 일괄 처리 방식은 종합 단계가 앞서 검증된 사실에 의존할 수 있으므로 차단성 의존을 만듭니다. C는 종합 에이전트에 권한을 과하게 주어 관심사 분리를 위반합니다. D는 종합 에이전트가 무엇을 검증해야 할지 안정적으로 예측할 수 없는 추측성 캐싱에 의존합니다.<\/p><\/details>", "<h3>시나리오: 지속적 통합을 위한 Claude Code<\/h3>\n<p><strong>문제 10.<\/strong> 파이프라인 스크립트가 <code>claude \"Analyze this pull request for security issues\"<\/code>를 실행하는데 작업이 무한정 멈춰 있습니다. 로그를 보면 Claude Code가 대화형 입력을 기다리고 있습니다. 자동화 파이프라인에서 Claude Code를 실행하는 올바른 방법은 무엇입니까?<\/p>\n<ul class=\"opts\"><li>A. -p 플래그를 추가한다: <code>claude -p \"Analyze this pull request for security issues\"<\/code><\/li><li>B. 명령 실행 전에 환경 변수 CLAUDE_HEADLESS=true를 설정한다<\/li><li>C. stdin을 /dev/null로 리디렉션한다: <code>claude \"Analyze this pull request for security issues\" &lt; /dev/null<\/code><\/li><li>D. --batch 플래그를 추가한다: <code>claude --batch \"Analyze this pull request for security issues\"<\/code><\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: A.<\/strong> -p(또는 --print) 플래그는 Claude Code를 비대화형 모드로 실행하는 문서화된 방법입니다. 프롬프트를 처리하고 결과를 stdout에 출력한 뒤 사용자 입력을 기다리지 않고 종료하므로, CI/CD 파이프라인에 정확히 필요한 동작입니다. 나머지 선택지는 존재하지 않는 기능(CLAUDE_HEADLESS 환경 변수, --batch 플래그)을 언급하거나, Claude Code의 명령 구문을 제대로 다루지 못하는 Unix 우회 방법을 사용합니다.<\/p><\/details>\n<p><strong>문제 11.<\/strong> 팀이 자동 분석의 API 비용을 줄이려 합니다. 현재 실시간 Claude 호출이 두 워크플로를 지원합니다. (1) 개발자가 병합하기 전에 완료되어야 하는 차단성 병합 전 검사, (2) 다음 날 아침 검토를 위해 야간에 생성되는 기술 부채 보고서. 관리자는 50% 비용 절감을 이유로 둘 다 Message Batches API로 전환하자고 제안합니다. 이 제안을 어떻게 평가해야 합니까?<\/p>\n<ul class=\"opts\"><li>A. 기술 부채 보고서에만 배치 처리를 사용하고, 병합 전 검사는 실시간 호출을 유지한다.<\/li><li>B. 두 워크플로 모두 배치 처리로 전환하고 상태 폴링으로 완료를 확인한다.<\/li><li>C. 배치 결과 순서 문제를 피하기 위해 두 워크플로 모두 실시간 호출을 유지한다.<\/li><li>D. 둘 다 배치 처리로 전환하되, 배치가 너무 오래 걸리면 실시간으로 전환하는 타임아웃 폴백을 둔다.<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: A.<\/strong> Message Batches API는 비용을 50% 절감하지만 처리 시간이 최대 24시간이고 지연 시간 SLA 보장이 없습니다. 그래서 개발자가 결과를 기다리는 차단성 병합 전 검사에는 부적합하지만, 기술 부채 보고서 같은 야간 배치 작업에는 이상적입니다. B는 \"대개 더 빠르다\"는 완료 시간에 의존하는 것이 차단성 워크플로에서는 받아들일 수 없으므로 틀립니다. C는 오해를 반영합니다. 배치 결과는 custom_id 필드로 대응시킬 수 있습니다. D는 각 API를 적절한 용도에 맞추는 더 단순한 해법이 있는데 불필요한 복잡성을 더합니다.<\/p><\/details>\n<p><strong>문제 12.<\/strong> 한 풀 리퀘스트가 재고 추적 모듈 전반의 파일 14개를 수정합니다. 모든 파일을 한꺼번에 분석하는 단일 패스 리뷰가 일관되지 않은 결과를 냅니다. 어떤 파일에는 상세한 피드백을, 다른 파일에는 피상적인 코멘트를 남기고, 명백한 버그를 놓치며, 모순된 피드백을 줍니다. 한 파일에서는 어떤 패턴을 문제로 지적하면서 같은 PR의 다른 곳에 있는 동일한 코드는 승인합니다. 리뷰를 어떻게 재구성해야 합니까?<\/p>\n<ul class=\"opts\"><li>A. 집중 패스로 분할한다. 각 파일을 개별적으로 분석해 로컬 문제를 찾고, 파일 간 데이터 흐름을 검토하는 통합 중심 패스를 별도로 실행한다.<\/li><li>B. 자동 리뷰를 실행하기 전에 개발자가 큰 PR을 파일 3~4개 단위의 작은 제출로 나누도록 요구한다.<\/li><li>C. 더 큰 컨텍스트 윈도를 가진 상위 모델로 바꿔 한 번의 패스에서 14개 파일 모두에 충분한 주의를 기울이게 한다.<\/li><li>D. 전체 PR에 대해 독립 리뷰 패스를 세 번 실행하고, 세 번 중 최소 두 번 나타난 문제만 지적한다.<\/li><\/ul>\n<details class=\"ans\"><summary>정답과 해설 보기<\/summary><p><strong>정답: A.<\/strong> 리뷰를 집중 패스로 나누면 근본 원인인 많은 파일을 한꺼번에 처리할 때의 주의력 분산을 직접 해결합니다. 파일별 분석은 일관된 깊이를 보장하고, 별도의 통합 패스는 파일 간 문제를 잡아냅니다. B는 시스템을 개선하지 않고 부담을 개발자에게 넘깁니다. C는 더 큰 컨텍스트 윈도가 주의력의 질 문제를 해결하지 못한다는 점을 오해한 것입니다. D는 간헐적으로만 잡힐 수 있는 문제에 합의를 요구하므로 실제 버그 탐지를 오히려 억제합니다.<\/p><\/details>"]}, {"n": "10", "title": "시험 채점 방식", "secs": ["<p>Claude Certified Architect – Foundations 시험은 준거 참조(criterion-referenced) 평가입니다. 각 응시자는 다른 응시자가 아니라 고정된 수행 기준에 따라 평가됩니다. 동료 중 일정 비율보다 잘해서가 아니라, 블루프린트에 정의된 지식과 기술을 입증하여 합격합니다.<\/p>\n<p><strong>합격 기준.<\/strong> 합격 점수는 공식적인 기준 설정 연구를 통해 정해졌으며, 이 연구에서 훈련된 주제 전문가들이 최소 자격을 갖춘 응시자에게 기대되는 수행 수준을 판단했습니다. 점수는 100~1,000 환산 범위로 보고되며 합격선은 720입니다. 환산 점수 모델은 난이도가 약간 다를 수 있는 여러 시험 형태 간 점수를 동등화하는 데 도움이 됩니다.<\/p>\n<p><strong>결과 통지.<\/strong> 결과는 합격 또는 불합격 상태와 100~1,000의 환산 점수로 보고됩니다. 성적표에는 내용 도메인별 정답 비율도 표시됩니다. 섹션별 백분율은 자신의 수행을 이해하는 데 도움을 주기 위해 제공되며, 합격 여부 판단에는 사용되지 않습니다. 합격 여부는 총 환산 점수로 결정됩니다.<\/p>"]}, {"n": "11", "title": "등록 및 일정 예약", "secs": ["<p>등록과 일정 예약은 Anthropic Partner Academy와 Pearson VUE를 통해 처리됩니다.<\/p>\n<ol><li>Anthropic Partner Academy에서 해당 시험의 자격증 페이지로 이동해 시험 정보를 확인합니다.<\/li><li>등록 전에 시험 가이드를 다운로드하고 Certification Terms and Conditions(자격증 이용 약관)와 Certification Exam Policy(자격 시험 정책)를 검토합니다.<\/li><li>시험에 등록하고 결제를 완료합니다. 결제 시 표시되는 응시료에는 파트너 등급에 해당하는 할인이 반영됩니다.<\/li><li>확인 안내에 따라 Pearson VUE 계정을 만든 뒤 로그인하여 시험 일정을 예약합니다.<\/li><li>가능한 날짜를 고르고 온라인 감독 또는 Pearson 시험 센터 중 하나를 선택합니다. 시험은 Pearson VUE가 시행합니다.<\/li><li>예약 시간 24시간 전까지 취소하거나 일정을 변경할 수 있습니다. 24시간 이내의 변경은 응시료가 몰수됩니다.<\/li><\/ol>"]}, {"n": "12", "title": "시험 정책", "secs": ["", "<h3>신분증<\/h3>\n<p>시험 당일에는 유효하고 만료되지 않은 정부 발급 사진 신분증을 제시해야 합니다. 신분증의 이름은 등록한 이름과 정확히 일치해야 합니다. 등록한 이름을 수정해야 하면 시험 일정을 예약하기 전에 certifications-support@anthropic.com으로 연락하십시오.<\/p>", "<h3>편의 제공<\/h3>\n<p>관련 법률에 따라, 장애나 필요가 문서로 입증된 응시자에게 합리적인 편의가 제공됩니다. 편의는 시험 일정 예약 전에 Pearson VUE에 요청하여 승인받아야 합니다. 요청이 승인될 때까지 예약하지 마십시오. 편의 요청은 pearsonvue.com/us/en/test-takers/accommodations에서 하십시오.<\/p>", "<h3>재응시 정책<\/h3>\n<p>합격하지 못한 응시자는 필수 대기 기간 후 재응시할 수 있습니다. 대기 기간은 불합격할 때마다 늘어납니다. 첫 불합격 후 14일, 두 번째 후 30일, 세 번째 후 90일입니다. 연속된 12개월 기간 안에 최대 4회까지 응시할 수 있습니다. 제한은 시험별로 적용되므로, 한 시험에 불합격해도 다른 시험 등록에는 지장이 없습니다. 응시료는 매 응시마다 부과됩니다.<\/p>", "<h3>미응시 및 지각<\/h3>\n<p>예약한 시험에 나타나지 않거나 허용된 지각 시간 이후에 도착한 응시자는 응시료가 몰수되며 다시 등록해야 합니다. 취소 및 일정 변경 기한은 11장에 설명되어 있습니다.<\/p>"]}, {"n": "13", "title": "시험 당일 진행과 행동 규칙", "secs": ["<p>시험은 표준화되고 보안이 유지되는 감독 환경에서 시행됩니다. 온라인으로 응시하든 Pearson VUE 시험 센터에서 응시하든, 자격을 보유한 모든 사람을 위해 자격의 무결성을 보호하고자 다음 규칙이 적용됩니다.<\/p>\n<p>시험 중에는 다음을 지켜야 합니다.<\/p>\n<ul><li>온라인 응시 시, 세션 내내 감독관과 웹캠의 시야 안에 머물러야 합니다<\/li><li>작업 공간에 메모, 책, 휴대전화, 보조 모니터, 기타 자료를 두지 않아야 합니다<\/li><li>시험 중 다른 사람과 소통하지 않아야 합니다<\/li><li>어떤 형태로든 시험 내용을 캡처, 복사, 촬영, 재현하지 않아야 합니다<\/li><\/ul>\n<p>금지 물품에는 휴대전화, 스마트워치, 헤드폰, 학습 자료, 모든 녹음·녹화 장치가 포함됩니다. 허용 물품이 있다면(예: 감독관이 제공하는 메모지) Pearson VUE가 지정합니다.<\/p>\n<p><strong>부정행위의 결과.<\/strong> 부정행위, 금지된 자료에 접근하려는 시도, 시험 내용 공개는 결과 무효화, 자격 취소, 향후 시험 응시 금지로 이어질 수 있습니다.<\/p>"]}, {"n": "14", "title": "기밀 유지 및 비밀유지 계약", "secs": ["<p>시험이 시작되기 전에 기밀 유지 및 비밀유지 계약(NDA)에 동의해야 합니다. 동의하면 문제, 선택지, 시나리오를 포함한 모든 시험 내용이 Anthropic의 기밀이자 독점 재산이며, 그 어떤 부분도 공개, 복제, 배포하지 않겠다는 데 동의하는 것입니다. 계약에 동의하지 않으면 시험 세션이 종료되며 환불되지 않습니다.<\/p>"]}, {"n": "15", "title": "자격 유지와 재인증", "secs": ["<p>Claude Certified Architect – Foundations 자격은 취득일로부터 12개월 동안 유효합니다. 기반 기술이 빠르게 발전하기 때문에, 보유자가 최신 지식을 유지하도록 자격에 기한을 두었습니다.<\/p>\n<p>기한 내에 갱신하려면 인증 이후 변경된 내용을 검토하고 Anthropic Partner Academy에서 무료 비감독 평가를 완료합니다. 기한 내 갱신에는 비용이 없습니다. 자격이 만료되면 인증 상태를 되찾기 위해 정가로 전체 시험을 다시 응시해야 합니다.<\/p>\n<p>시험 내용이 크게 바뀌면, Anthropic은 보유자에게 갱신 평가 대신 전체 시험 재응시를 요구할 수 있습니다.<\/p>\n<p>보유자는 계속해서 13장에 설명된 행동 규칙을 적용받습니다.<\/p>"]}, {"n": "16", "title": "응시자 지원, 이의 제기, 개인정보", "secs": ["", "<h3>지원<\/h3>\n<p>등록한 이름을 수정하려면 certifications-support@anthropic.com으로 연락하십시오. 등록, 일정 예약, 편의 제공, 결과를 포함한 그 밖의 모든 문의는 Pearson VUE 지원(pearsonvue.com/us/en/anthropic.html)으로 하십시오.<\/p>", "<h3>이의 제기 및 불만<\/h3>\n<p>결정에 대해서는 통보받은 날로부터 14일 이내에, 시험 결과에 관한 우려는 시험일로부터 14일 이내에 이의를 제기할 수 있습니다. 이의 제기는 위 링크의 Pearson VUE 지원으로 제출하십시오. 이의 제기는 프로그램의 이의 제기 정책에 따라 검토됩니다. 기준 설정 결과와 개별 시험 문항의 내용은 이의 제기 대상이 아닙니다.<\/p>", "<h3>개인정보<\/h3>\n<p>등록 및 시험 과정에서 수집된 개인정보는 Anthropic의 개인정보 처리방침, Pearson VUE의 개인정보 처리방침, 관련 개인정보 보호 법률에 따라 처리됩니다.<\/p>"]}, {"n": "17", "title": "부록", "secs": ["", "<h3>기술과 개념<\/h3>\n<p>다음은 시험에 나올 수 있는 기술과 개념 목록입니다.<\/p>\n<ul><li><strong>Claude Agent SDK<\/strong> — 에이전트 정의, 에이전트 루프, stop_reason 처리, 훅(PostToolUse, 도구 호출 가로채기), Task 도구를 통한 서브에이전트 생성, allowedTools 구성<\/li><li><strong>Model Context Protocol (MCP)<\/strong> — MCP 서버, MCP 도구, MCP 리소스, isError 플래그, 도구 설명, 도구 배분, .mcp.json 구성, 환경 변수 확장<\/li><li><strong>Claude Code<\/strong> — CLAUDE.md 구성 계층(사용자/프로젝트/디렉터리), YAML frontmatter 경로 범위를 갖춘 .claude/rules/, 슬래시 명령용 .claude/commands/, SKILL.md frontmatter(context: fork, allowed-tools, argument-hint)를 갖춘 .claude/skills/, 플랜 모드, 직접 실행, /memory 명령, /compact, --resume, fork_session, Explore 서브에이전트<\/li><li><strong>Claude Code CLI<\/strong> — 비대화형 모드를 위한 -p / --print 플래그, CI 정형 출력을 위한 --output-format json, --json-schema<\/li><li><strong>Claude API<\/strong> — JSON 스키마를 사용한 tool_use, tool_choice 옵션(\"auto\", \"any\", 강제 도구 선택), stop_reason 값(\"tool_use\", \"end_turn\"), max_tokens, 시스템 프롬프트<\/li><li><strong>Message Batches API<\/strong> — 비용 50% 절감, 최대 24시간 처리 창, 요청/응답 대응을 위한 custom_id, 완료 확인 폴링, 멀티턴 도구 호출 미지원<\/li><li><strong>JSON Schema<\/strong> — 필수 vs 선택 필드, enum 타입, nullable 필드, \"other\" + 상세 문자열 패턴, 구문 오류 제거를 위한 strict 모드<\/li><li><strong>Pydantic<\/strong> — 스키마 검증, 의미적 검증 오류, 검증-재시도 루프<\/li><li><strong>내장 도구<\/strong> — Read, Write, Edit, Bash, Grep, Glob의 용도와 선택 기준<\/li><li><strong>Few-shot 프롬프팅<\/strong> — 모호한 시나리오를 위한 표적 예시, 형식 시연, 새로운 패턴으로의 일반화<\/li><li><strong>프롬프트 체이닝<\/strong> — 집중 패스로의 순차적 작업 분해<\/li><li><strong>컨텍스트 윈도 관리<\/strong> — 토큰 예산, 점진적 요약, 중간 소실(lost-in-the-middle) 효과, 컨텍스트 추출, 스크래치패드 파일<\/li><li><strong>세션 관리<\/strong> — 세션 재개, fork_session, 이름 있는 세션, 세션 컨텍스트 격리<\/li><li><strong>확신도 점수<\/strong> — 필드 수준 확신도, 레이블이 있는 검증 세트를 이용한 보정, 오류율 측정을 위한 층화 표본 추출<\/li><\/ul>", "<h3>출제 범위 주제<\/h3>\n<p>다음 주제는 시험에서 명시적으로 출제됩니다.<\/p>\n<ul><li><strong>에이전트 루프 구현:<\/strong> stop_reason 기반 제어 흐름, 도구 결과 처리, 루프 종료 조건<\/li><li><strong>멀티 에이전트 오케스트레이션:<\/strong> 코디네이터-서브에이전트 패턴, 작업 분해, 병렬 서브에이전트 실행, 반복 개선 루프<\/li><li><strong>서브에이전트 컨텍스트 관리:<\/strong> 명시적 컨텍스트 전달, 구조화된 상태 영속화, 매니페스트를 이용한 장애 복구<\/li><li><strong>도구 인터페이스 설계:<\/strong> 효과적인 도구 설명 작성, 도구 분할 vs 통합, 모호성을 줄이는 도구 이름 짓기<\/li><li><strong>MCP 도구 및 리소스 설계:<\/strong> 콘텐츠 카탈로그에는 리소스, 행동에는 도구, 채택을 위한 설명 품질<\/li><li><strong>MCP 서버 구성:<\/strong> 프로젝트 vs 사용자 범위, 환경 변수 확장, 여러 서버 동시 접근<\/li><li><strong>오류 처리와 전파:<\/strong> 구조화된 오류 응답, 일시적 vs 비즈니스 vs 권한 오류, 에스컬레이션 전 로컬 복구<\/li><li><strong>에스컬레이션 의사결정:<\/strong> 명시적 기준, 고객 선호 존중, 정책 공백 식별<\/li><li><strong>CLAUDE.md 구성:<\/strong> 계층(사용자/프로젝트/디렉터리), @import 패턴, glob 패턴을 갖춘 .claude/rules/<\/li><li><strong>커스텀 명령과 스킬:<\/strong> 프로젝트 vs 사용자 범위, context: fork, allowed-tools, argument-hint frontmatter<\/li><li><strong>플랜 모드 vs 직접 실행:<\/strong> 복잡도 평가, 아키텍처 결정, 단일 파일 변경<\/li><li><strong>반복 개선:<\/strong> 입력/출력 예시, 테스트 주도 반복, 인터뷰 패턴, 순차 vs 일괄 문제 해결<\/li><li><strong>tool_use를 통한 정형 출력:<\/strong> 스키마 설계, tool_choice 구성, 환각을 막는 nullable 필드<\/li><li><strong>Few-shot 프롬프팅:<\/strong> 모호한 시나리오 표적화, 형식 일관성, 오탐 감소<\/li><li><strong>배치 처리:<\/strong> Message Batches API의 적합성, 지연 허용도 평가, custom_id를 이용한 실패 처리<\/li><li><strong>컨텍스트 윈도 최적화:<\/strong> 장황한 도구 출력 정리, 구조화된 사실 추출, 위치를 고려한 입력 배치<\/li><li><strong>사람의 검토 워크플로:<\/strong> 확신도 보정, 층화 표본 추출, 문서 유형·필드별 정확도 세분화<\/li><li><strong>정보 출처(provenance):<\/strong> 주장-출처 매핑, 시간 데이터 처리, 충돌 주석, 커버리지 공백 보고<\/li><\/ul>", "<h3>출제 범위 밖 주제<\/h3>\n<p>다음 관련 주제는 시험에 나오지 않습니다.<\/p>\n<ul><li>Claude 모델 파인튜닝 또는 커스텀 모델 학습<\/li><li>Claude API 인증, 결제, 계정 관리<\/li><li>특정 프로그래밍 언어나 프레임워크의 세부 구현(도구와 스키마 구성에 필요한 범위 제외)<\/li><li>MCP 서버 배포나 호스팅(인프라, 네트워킹, 컨테이너 오케스트레이션)<\/li><li>Claude의 내부 아키텍처, 학습 과정, 모델 가중치<\/li><li>Constitutional AI, RLHF, 안전성 학습 방법론<\/li><li>임베딩 모델이나 벡터 데이터베이스 구현 세부 사항<\/li><li>컴퓨터 사용(브라우저 자동화, 데스크톱 상호작용)<\/li><li>비전/이미지 분석 기능<\/li><li>스트리밍 API 구현이나 서버 전송 이벤트(SSE)<\/li><li>속도 제한, 할당량, API 가격 계산<\/li><li>OAuth, API 키 교체, 인증 프로토콜 세부 사항<\/li><li>특정 클라우드 제공업체 구성(AWS, GCP, Azure)<\/li><li>성능 벤치마크나 모델 비교 지표<\/li><li>프롬프트 캐싱 구현 세부 사항(존재를 아는 수준 이상)<\/li><li>토큰 계산 알고리즘이나 토큰화 세부 사항<\/li><\/ul>"]}, {"n": "18", "title": "문서 관리", "secs": ["<table><thead><tr><th>버전<\/th><th>변경 요약<\/th><th>날짜<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>서식 및 레이아웃 업데이트<\/td><td>2026년 7월<\/td><\/tr><tr><td>0.2<\/td><td>초안 수정<\/td><td>2026년 6월<\/td><\/tr><tr><td>0.1<\/td><td>최초 초안<\/td><td>2026년 2월<\/td><\/tr><\/tbody><\/table>"]}]}, "ja": {"title": "Claude Certified Architect – Foundations 試験ガイド — 日本語版（公式）", "note": ["出典：Anthropic公式「Claude Certified Architect – Foundations 試験ガイド」日本語版PDF（バージョン1.0 · 発効：2026年7月 · 試験コード：CCAR-F）。PDFから本文をそのまま転記し、見出しと表のみMarkdownに整形しています。", "原文冒頭：「本ガイドは予告なく変更されることがあります。」"], "ch": [{"n": "1", "title": "この認定資格について", "secs": ["<p>Claude Certified Architect – Foundations認定資格は、実務者がClaudeを使って実世界のソリューションを実装する際に、トレードオフについて十分な情報に基づいた判断を下せることを証明するものです。本試験では、Claude Code、Claude Agent SDK、Claude API、Model Context Protocol（MCP）という、Claudeで本番環境レベルのアプリケーションを構築するために使用される中核技術に関する基礎知識を問います。<\/p>\n<p>本試験の問題は、実際の顧客ユースケースから取り上げた現実的なシナリオに基づいています。これには、カスタマーサポート向けのエージェントシステムの構築、マルチエージェントのリサーチパイプラインの設計、CI/CDワークフローへのClaude Codeの統合、開発者の生産性向上ツールの構築、非構造化ドキュメントからの構造化データの抽出が含まれます。受験者は、概念的な知識だけでなく、本番環境へのデプロイにおけるアーキテクチャ、設定、トレードオフに関する実践的な判断力を示す必要があります。<\/p>\n<p>本ガイドは、受験の準備をする受験者にとっての正式な参照資料です。試験の内容を説明し、出題される分野とタスクステートメントを一覧で示し、サンプル問題を掲載し、準備の進め方を推奨しています。試験を予約する前に、全体をお読みください。<\/p>"]}, {"n": "2", "title": "対象となる受験者", "secs": ["<p>この認定資格の理想的な受験者は、Claudeを使って本番アプリケーションを設計・実装するソリューションアーキテクトです。この受験者は、次の実務経験を有しています：<\/p>\n<ul><li>Claude Agent SDKを使用したエージェントアプリケーションの構築（マルチエージェントのオーケストレーション、サブエージェントへの委任、ツール統合、ライフサイクルフックを含む）<\/li><li>CLAUDE.mdファイル、Agent Skills、MCPサーバー統合、プランモードを使用した、チームのワークフローに合わせたClaude Codeの設定とカスタマイズ<\/li><li>バックエンドシステム統合のための、Model Context Protocol（MCP）のツールおよびリソースのインターフェースの設計<\/li><li>JSONスキーマ、few-shotの例、抽出パターンを活用した、信頼性の高い構造化出力を生成するプロンプトの設計<\/li><li>長いドキュメント、マルチターンの会話、マルチエージェント間のハンドオフにわたるコンテキストウィンドウの効果的な管理<\/li><li>自動コードレビュー、テスト生成、プルリクエストへのフィードバックのための、CI/CDパイプラインへのClaudeの統合<\/li><li>エラー処理、ヒューマン・イン・ザ・ループのワークフロー、自己評価パターンを含む、エスカレーションと信頼性に関する適切な判断<\/li><\/ul>\n<p>受験者は通常、Claude API、Agent SDK、Claude Code、MCPを使った構築の実務経験を6か月以上有しており、本番環境における大規模言語モデルの能力と限界の両方を理解しています。<\/p>"]}, {"n": "3", "title": "試験の概要", "secs": ["<table><thead><tr><th>項目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>資格<\/td><td>Claude Certified Architect – Foundations<\/td><\/tr><tr><td>試験コード<\/td><td>CCAR-F<\/td><\/tr><tr><td>問題数<\/td><td>60<\/td><\/tr><tr><td>出題形式<\/td><td>択一式および複数選択式の問題。各問題に、選択する解答の数が明記されています<\/td><\/tr><tr><td>試験の構成<\/td><td>6つのシナリオのバンクから出題される4つのシナリオ<\/td><\/tr><tr><td>制限時間<\/td><td>120分<\/td><\/tr><tr><td>実施方法<\/td><td>監督付き：プログラムのポリシーに従い、オンライン監督付きまたはテストセンター、あるいはその両方<\/td><\/tr><tr><td>合格点<\/td><td>100–1,000のスケールでスケールスコア720<\/td><\/tr><tr><td>受験料<\/td><td>$125 USD<\/td><\/tr><tr><td>有効期間<\/td><td>資格が授与された日から12か月<\/td><\/tr><tr><td>結果の通知<\/td><td>合格／不合格とスケールスコア（100–1,000）。スコアレポートには分野別の正答率も記載されます<\/td><\/tr><\/tbody><\/table>"]}, {"n": "4", "title": "試験内容の概要（ブループリント）", "secs": ["<p>試験ブループリントは、測定対象となる内容分野と、試験における各分野のおおよその配点比率を定めています。配点比率は、職務タスク分析によって決定された、十分な能力での業務遂行に対する各分野の相対的な重要度を反映しています。パーセンテージは、採点対象の問題のうち各分野から出題されるおおよその割合を示します。<\/p>\n<table><thead><tr><th>分野<\/th><th>内容分野<\/th><th>配点比率<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>エージェントアーキテクチャとオーケストレーション<\/td><td>27%<\/td><\/tr><tr><td>2<\/td><td>ツール設計とMCP統合<\/td><td>18%<\/td><\/tr><tr><td>3<\/td><td>Claude Codeの設定とワークフロー<\/td><td>20%<\/td><\/tr><tr><td>4<\/td><td>プロンプトエンジニアリングと構造化出力<\/td><td>20%<\/td><\/tr><tr><td>5<\/td><td>コンテキスト管理と信頼性<\/td><td>15%<\/td><\/tr><tr><td><\/td><td>合計<\/td><td>100%<\/td><\/tr><\/tbody><\/table>"]}, {"n": "5", "title": "試験シナリオ", "secs": ["<p>本試験ではシナリオベースの問題を使用します。各シナリオは、一連の問題の前提となる現実的な本番環境の状況を提示します。試験では、以下の6つのシナリオ全体の中から無作為に選ばれた4つのシナリオが出題されます。<\/p>", "<h3>シナリオ1：カスタマーサポート解決エージェント<\/h3>\n<p>あなたは、Claude Agent SDKを使用してカスタマーサポート解決エージェントを構築しています。このエージェントは、返品、請求に関する異議、アカウントの問題など、曖昧さの大きいリクエストを処理します。カスタムのModel Context Protocol（MCP）ツール（get_customer、lookup_order、process_refund、escalate_to_human）を通じて、バックエンドシステムにアクセスできます。目標は、エスカレーションすべきタイミングを見極めながら、初回対応での解決率80%以上を達成することです。<\/p>\n<p><strong>主な分野：<\/strong> エージェントアーキテクチャとオーケストレーション、ツール設計とMCP統合、コンテキスト管理と信頼性<\/p>", "<h3>シナリオ2：Claude Codeによるコード生成<\/h3>\n<p>あなたは、ソフトウェア開発を加速するためにClaude Codeを使用しています。チームでは、コード生成、リファクタリング、デバッグ、ドキュメント作成にClaude Codeを使っています。カスタムスラッシュコマンドやCLAUDE.mdの設定を用いて開発ワークフローに統合し、プランモードと直接実行をどのように使い分けるかを理解する必要があります。<\/p>\n<p><strong>主な分野：<\/strong> Claude Codeの設定とワークフロー、コンテキスト管理と信頼性<\/p>", "<h3>シナリオ3：マルチエージェントリサーチシステム<\/h3>\n<p>あなたは、Claude Agent SDKを使用してマルチエージェントリサーチシステムを構築しています。コーディネーターエージェントが、専門化されたサブエージェントに作業を委任します。サブエージェントには、ウェブを検索するもの、ドキュメントを分析するもの、調査結果を統合するもの、レポートを生成するものがあります。このシステムはトピックを調査し、出典を明記した包括的なレポートを作成します。<\/p>\n<p><strong>主な分野：<\/strong> エージェントアーキテクチャとオーケストレーション、ツール設計とMCP統合、コンテキスト管理と信頼性<\/p>", "<h3>シナリオ4：Claudeによる開発者の生産性向上<\/h3>\n<p>あなたは、Claude Agent SDKを使用して開発者の生産性向上ツールを構築しています。このエージェントは、エンジニアが不慣れなコードベースを探索し、レガシーシステムを理解し、ボイラープレートコードを生成し、反復的なタスクを自動化するのを支援します。組み込みツール（Read、Write、Bash、Grep、Glob）を使用し、Model Context Protocol（MCP）サーバーと統合します。<\/p>\n<p><strong>主な分野：<\/strong> ツール設計とMCP統合、Claude Codeの設定とワークフロー、エージェントアーキテクチャとオーケストレーション<\/p>", "<h3>シナリオ5：継続的インテグレーションのためのClaude Code<\/h3>\n<p>あなたは、Claude Codeを継続的インテグレーション／継続的デプロイ（CI/CD）パイプラインに統合しています。このシステムは、自動コードレビューを実行し、テストケースを生成し、プルリクエストに対するフィードバックを提供します。実行可能なフィードバックを提供し、誤検知を最小限に抑えるプロンプトを設計する必要があります。<\/p>\n<p><strong>主な分野：<\/strong> Claude Codeの設定とワークフロー、プロンプトエンジニアリングと構造化出力<\/p>", "<h3>シナリオ6：構造化データ抽出<\/h3>\n<p>あなたは、Claudeを使用して構造化データ抽出システムを構築しています。このシステムは、非構造化ドキュメントから情報を抽出し、JavaScript Object Notation（JSON）スキーマを使用して出力を検証し、高い精度を維持します。エッジケースを適切に処理し、下流のシステムと統合する必要があります。<\/p>\n<p><strong>主な分野：<\/strong> プロンプトエンジニアリングと構造化出力、コンテキスト管理と信頼性<\/p>"]}, {"n": "6", "title": "分野別の詳細な目標", "secs": ["<p>以下の各分野には、出題されるタスクステートメントと、それぞれについて測定される知識およびスキルを記載しています。試験問題は、これらの目標に基づいて作成されています。<\/p>", "<h3>分野1：エージェントアーキテクチャとオーケストレーション<\/h3>", "<h4>タスクステートメント1.1：自律的なタスク実行のためのエージェントループを設計し実装する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>エージェントループのライフサイクル：Claudeへのリクエスト送信、stop_reasonの確認（\"tool_use\"か\"end_turn\"か）、要求されたツールの実行、次の反復に向けた結果の返却<\/li><li>モデルが次のアクションについて推論できるように、ツールの結果が会話履歴に追加される仕組み<\/li><li>モデル主導の意思決定（Claudeがコンテキストに基づいて次に呼び出すツールを推論する）と、事前に設定された決定木やツールシーケンスとの違い<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>stop_reasonが\"tool_use\"の場合は継続し、\"end_turn\"の場合は終了する、エージェントループの制御フローを実装する<\/li><li>モデルが新しい情報を推論に取り込めるように、反復の間にツールの結果を会話コンテキストに追加する<\/li><li>ループ終了の判定に自然言語のシグナルを解析する、主要な停止メカニズムとして根拠のない（恣意的な）反復回数上限を設定する、完了の指標としてアシスタントのテキストコンテンツの有無を確認する、といったアンチパターンを避ける<\/li><\/ul>", "<h4>タスクステートメント1.2：コーディネーター・サブエージェントパターンでマルチエージェントシステムをオーケストレーションする<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>コーディネーターエージェントがサブエージェント間のすべての通信、エラー処理、情報のルーティングを管理する、ハブアンドスポーク型アーキテクチャ<\/li><li>サブエージェントが分離されたコンテキストで動作する仕組み（コーディネーターの会話履歴を自動的には継承しない）<\/li><li>タスクの分解、委任、結果の集約、およびクエリの複雑さに基づいて呼び出すサブエージェントを決定することにおけるコーディネーターの役割<\/li><li>コーディネーターによるタスク分解が狭すぎることで、幅広いリサーチトピックを十分にカバーできなくなるリスク<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>常にパイプライン全体を経由させるのではなく、クエリの要件を分析して呼び出すサブエージェントを動的に選択するコーディネーターエージェントを設計する<\/li><li>重複を最小限に抑えるために、リサーチの範囲をサブエージェント間で分割する（例：各エージェントに異なるサブトピックや情報源の種類を割り当てる）<\/li><li>コーディネーターが統合の出力に不足がないかを評価し、的を絞ったクエリで検索および分析のサブエージェントに再度委任し、カバー範囲が十分になるまで統合を再度呼び出す、反復的な改善ループを実装する<\/li><li>可観測性、一貫したエラー処理、制御された情報フローのために、サブエージェントのすべての通信をコーディネーター経由でルーティングする<\/li><\/ul>", "<h4>タスクステートメント1.3：サブエージェントの呼び出し、コンテキストの受け渡し、生成を設定する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>サブエージェントを生成する仕組みとしてのTaskツール、およびコーディネーターがサブエージェントを呼び出すにはallowedToolsに\"Task\"を含める必要があるという要件<\/li><li>サブエージェントのコンテキストはプロンプトで明示的に提供する必要があること（サブエージェントは親のコンテキストを自動的に継承せず、呼び出し間でメモリを共有しない）<\/li><li>各サブエージェントタイプの説明、システムプロンプト、ツール制限を含むAgentDefinitionの設定<\/li><li>共通の分析ベースラインから異なるアプローチを探るための、フォークベースのセッション管理<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>先行するエージェントの調査結果全体をサブエージェントのプロンプトに直接含める（例：ウェブ検索結果とドキュメント分析の出力を統合サブエージェントに渡す）<\/li><li>エージェント間でコンテキストを渡す際に、情報源の帰属を保持するため、構造化データ形式を使用してコンテンツとメタデータ（ソースURL、ドキュメント名、ページ番号）を分離する<\/li><li>別々のターンに分けるのではなく、コーディネーターの単一の応答で複数のTaskツール呼び出しを出力することで、サブエージェントを並列に生成する<\/li><li>サブエージェントが適応できるように、段階的な手順の指示ではなく、リサーチの目標と品質基準を指定するコーディネータープロンプトを設計する<\/li><\/ul>", "<h4>タスクステートメント1.4：強制とハンドオフのパターンを用いて複数ステップのワークフローを実装する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>ワークフローの順序付けにおける、プログラムによる強制（フック、前提条件ゲート）とプロンプトベースのガイダンスの違い<\/li><li>決定論的な遵守が求められる場合（例：金銭に関わる操作の前の本人確認）、プロンプトの指示だけでは失敗率がゼロにならないこと<\/li><li>プロセス途中でのエスカレーションのための、顧客の詳細、根本原因の分析、推奨アクションを含む構造化されたハンドオフプロトコル<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>前提となるステップが完了するまで下流のツール呼び出しをブロックする、プログラムによる前提条件を実装する（例：get_customerが検証済みの顧客IDを返すまでprocess_refundをブロックする）<\/li><li>複数の懸案を含む顧客リクエストを個別の項目に分解し、共有コンテキストを使ってそれぞれを並列に調査したうえで、統一された解決策にまとめる<\/li><li>会話の記録にアクセスできない人間の担当者にエスカレーションする際に、構造化されたハンドオフサマリー（顧客ID、根本原因、返金額、推奨アクション）を作成する<\/li><\/ul>", "<h4>タスクステートメント1.5：ツール呼び出しのインターセプトとデータ正規化のためにAgent SDKのフックを適用する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>モデルが処理する前にツールの結果をインターセプトして変換するフックパターン（例：PostToolUse）<\/li><li>送信されるツール呼び出しをインターセプトしてコンプライアンスルールを強制するフックパターン（例：しきい値を超える返金のブロック）<\/li><li>決定論的な保証のためにフックを使用することと、確率的な遵守のためにプロンプトの指示に頼ることの違い<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>エージェントが処理する前に、異なるMCPツールから返される不均一なデータ形式（Unixタイムスタンプ、ISO 8601、数値のステータスコード）を正規化するPostToolUseフックを実装する<\/li><li>ポリシーに違反するアクション（例：$500を超える返金）をブロックし、代替のワークフロー（例：人間へのエスカレーション）にリダイレクトする、ツール呼び出しインターセプトフックを実装する<\/li><li>ビジネスルールで確実な遵守が求められる場合に、プロンプトベースの強制ではなくフックを選択する<\/li><\/ul>", "<h4>タスクステートメント1.6：複雑なワークフローのためのタスク分解戦略を設計する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>固定の逐次パイプライン（プロンプトチェーン）と、中間的な発見に基づく動的で適応的な分解を、どのような場合に使い分けるか<\/li><li>レビューを逐次的なステップに分割するプロンプトチェーンのパターン（例：各ファイルを個別に分析してから、ファイル横断の統合パスを実行する）<\/li><li>各ステップで発見された内容に基づいてサブタスクを生成する、適応的な調査計画の価値<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>ワークフローに適したタスク分解パターンを選択する：予測可能な多面的レビューにはプロンプトチェーン、オープンエンドな調査タスクには動的な分解<\/li><li>注意の分散を避けるために、大規模なコードレビューを、ファイルごとのローカル分析パスと、別途実施するファイル横断の統合パスに分割する<\/li><li>オープンエンドなタスク（例：「レガシーコードベースに包括的なテストを追加する」）を、まず構造を把握し、影響の大きい領域を特定したうえで、依存関係が見つかるたびに適応する優先順位付きの計画を作成することで分解する<\/li><\/ul>", "<h4>タスクステートメント1.7：セッションの状態、再開、フォークを管理する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>特定の過去の会話を続行するための、--resume &lt;session-name&gt;を使用した名前付きセッションの再開<\/li><li>共通の分析ベースラインから独立したブランチを作成し、異なるアプローチを探るためのfork_session<\/li><li>コード変更後にセッションを再開する際、以前に分析したファイルへの変更をエージェントに伝えることの重要性<\/li><li>古くなったツール結果を抱えたまま再開するよりも、構造化されたサマリーを使って新しいセッションを開始するほうが信頼性が高い理由<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>セッション名を指定して--resumeを使用し、複数の作業セッションにまたがって名前付きの調査セッションを続行する<\/li><li>fork_sessionを使用して並列の探索ブランチを作成する（例：共通のコードベース分析から、2つのテスト戦略やリファクタリングのアプローチを比較する）<\/li><li>セッションの再開（以前のコンテキストがおおむね有効な場合）と、サマリーを注入して新たに開始すること（以前のツール結果が古くなっている場合）のいずれかを選択する<\/li><li>全体を再探索させるのではなく、的を絞った再分析のために、再開したセッションに具体的なファイル変更を伝える<\/li><\/ul>", "<h3>分野2：ツール設計とMCP統合<\/h3>", "<h4>タスクステートメント2.1：明確な説明と境界を備えた効果的なツールインターフェースを設計する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>LLMがツール選択に用いる主要な仕組みとしてのツールの説明。最小限の説明では、類似したツール間での選択の信頼性が低下する<\/li><li>ツールの説明に、入力形式、クエリの例、エッジケース、境界の説明を含めることの重要性<\/li><li>曖昧な、または重複するツールの説明が誤ったルーティングを引き起こす仕組み（例：ほぼ同一の説明を持つanalyze_contentとanalyze_document）<\/li><li>システムプロンプトの文言がツール選択に与える影響：キーワードに敏感な指示が、意図しないツールの関連付けを生む可能性がある<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>各ツールの目的、想定される入力、出力、および類似の代替ツールではなくそのツールを使うべき場面を明確に区別するツールの説明を作成する<\/li><li>機能の重複をなくすために、ツールの名前を変更し説明を更新する（例：analyze_contentをextract_web_resultsに名前変更し、ウェブに特化した説明を付ける）<\/li><li>汎用的なツールを、入出力の契約が定義された目的別のツールに分割する（例：汎用的なanalyze_documentを、extract_data_points、summarize_content、verify_claim_against_sourceに分割する）<\/li><li>適切に書かれたツールの説明を上書きしてしまう可能性のある、キーワードに敏感な指示がないかシステムプロンプトをレビューする<\/li><\/ul>", "<h4>タスクステートメント2.2：MCPツールの構造化されたエラーレスポンスを実装する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>ツールの失敗をエージェントに伝えるための、MCPのisErrorフラグパターン<\/li><li>一時的なエラー（タイムアウト、サービスの利用不可）、検証エラー（無効な入力）、ビジネスエラー（ポリシー違反）、権限エラーの違い<\/li><li>一律のエラーレスポンス（汎用的な\"Operation failed\"）では、エージェントが適切な復旧の判断を下せなくなる理由<\/li><li>リトライ可能なエラーとリトライ不可能なエラーの違い、および構造化されたメタデータを返すことで無駄なリトライを防ぐ仕組み<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>errorCategory（transient/validation/permission）、ブール値のisRetryable、人間が読める説明を含む、構造化されたエラーメタデータを返す<\/li><li>エージェントが適切に伝えられるように、ビジネスルール違反に対してretriable: falseフラグと顧客にわかりやすい説明を含める<\/li><li>一時的な失敗についてはサブエージェント内でローカルにエラー復旧を実装し、ローカルで解決できないエラーのみを、部分的な結果および試行した内容とともにコーディネーターに伝播する<\/li><li>アクセスの失敗（リトライの判断が必要）と、有効な空の結果（一致するものがなかった成功したクエリを表す）を区別する<\/li><\/ul>", "<h4>タスクステートメント2.3：エージェント間でツールを適切に配分し、ツール選択を設定する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>エージェントに多すぎるツール（例：4-5個ではなく18個）へのアクセスを与えると、判断の複雑さが増し、ツール選択の信頼性が低下するという原則<\/li><li>専門外のツールを持つエージェントが、それらを誤用しがちである理由（例：統合エージェントがウェブ検索を試みる）<\/li><li>スコープを限定したツールアクセス：エージェントにはその役割に必要なツールのみを与え、頻度の高い特定のニーズに対しては役割横断のツールを限定的に与える<\/li><li>tool_choiceの設定オプション：\"auto\"、\"any\"、強制的なツール選択（{\"type\": \"tool\", \"name\": \"...\"}）<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>各サブエージェントのツールセットをその役割に関連するものに制限し、専門外のツールの誤用を防ぐ<\/li><li>汎用的なツールを制約付きの代替ツールに置き換える（例：fetch_urlを、ドキュメントURLを検証するload_documentに置き換える）<\/li><li>複雑なケースはコーディネーター経由でルーティングしつつ、頻度の高いニーズに対してはスコープを限定した役割横断のツールを提供する（例：統合エージェント向けのverify_factツール）<\/li><li>tool_choiceの強制選択を使用して特定のツールが最初に呼び出されるようにし（例：エンリッチメントツールの前にextract_metadataを強制する）、後続のステップはフォローアップのターンで処理する<\/li><li>モデルが会話テキストを返すのではなく確実にツールを呼び出すように、tool_choice: \"any\"を設定する<\/li><\/ul>", "<h4>タスクステートメント2.4：MCPサーバーをClaude Codeとエージェントワークフローに統合する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>MCPサーバーのスコープ設定：チームで共有するツール向けのプロジェクトレベル（.mcp.json）と、個人用／実験的なサーバー向けのユーザーレベル（~/.claude.json）<\/li><li>シークレットをコミットせずに認証情報を管理するための、.mcp.jsonでの環境変数の展開（例：${GITHUB_TOKEN}）<\/li><li>設定されたすべてのMCPサーバーのツールが接続時に検出され、エージェントから同時に利用可能になること<\/li><li>探索的なツール呼び出しを減らすために、コンテンツカタログ（例：課題のサマリー、ドキュメントの階層、データベーススキーマ）を公開する仕組みとしてのMCPリソース<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>認証トークン用の環境変数の展開を使用して、プロジェクトスコープの.mcp.jsonで共有MCPサーバーを設定する<\/li><li>ユーザースコープの~/.claude.jsonで個人用／実験的なMCPサーバーを設定する<\/li><li>MCPツールの説明を拡充して機能と出力を詳しく説明し、エージェントがより高機能なMCPツールよりも組み込みツール（Grepなど）を優先してしまうのを防ぐ<\/li><li>標準的な統合（例：Jira）には、カスタム実装ではなく既存のコミュニティ製MCPサーバーを選択し、カスタムサーバーはチーム固有のワークフローのために取っておく<\/li><li>探索的なツール呼び出しを必要とせずにエージェントが利用可能なデータを把握できるように、コンテンツカタログをMCPリソースとして公開する<\/li><\/ul>", "<h4>タスクステートメント2.5：組み込みツール（Read、Write、Edit、Bash、Grep、Glob）を効果的に選択し適用する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>コンテンツ検索のためのGrep（関数名、エラーメッセージ、import文などのパターンをファイルの内容から検索する）<\/li><li>ファイルパスのパターンマッチングのためのGlob（名前や拡張子のパターンでファイルを見つける）<\/li><li>ファイル全体の操作のためのRead/Write。一意のテキストマッチングを使用した的を絞った変更のためのEdit<\/li><li>テキストの一致が一意でないためにEditが失敗した場合に、確実なファイル変更のためのフォールバックとしてRead + Writeを使用すること<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>コードベース全体でコードの内容を検索するためにGrepを選択する（例：ある関数のすべての呼び出し元を見つける、エラーメッセージの場所を特定する）<\/li><li>命名パターンに一致するファイルを見つけるためにGlobを選択する（例：**/*.test.tsx）<\/li><li>Editが一意のアンカーテキストを見つけられない場合に、Readでファイルの内容全体を読み込んでからWriteを使用する<\/li><li>最初にすべてのファイルを読むのではなく、Grepでエントリーポイントを見つけることから始め、次にReadでimportをたどってフローを追跡することで、コードベースの理解を段階的に構築する<\/li><li>まずエクスポートされたすべての名前を特定し、次にコードベース全体で各名前を検索することで、ラッパーモジュールをまたぐ関数の使用箇所を追跡する<\/li><\/ul>", "<h3>分野3：Claude Codeの設定とワークフロー<\/h3>", "<h4>タスクステートメント3.1：適切な階層、スコープ設定、モジュール構成でCLAUDE.mdファイルを設定する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>CLAUDE.mdの設定階層：ユーザーレベル（~/.claude/CLAUDE.md）、プロジェクトレベル（.claude/CLAUDE.mdまたはルートのCLAUDE.md）、ディレクトリレベル（サブディレクトリのCLAUDE.mdファイル）<\/li><li>ユーザーレベルの設定はそのユーザーにのみ適用されること（~/.claude/CLAUDE.md内の指示は、バージョン管理を通じてチームメイトと共有されない）<\/li><li>外部ファイルを参照してCLAUDE.mdをモジュール化しておくための@import構文（例：各パッケージに関連する特定の標準ファイルをインポートする）<\/li><li>単一の巨大なCLAUDE.mdの代替として、トピック別のルールファイルを整理するための.claude/rules/ディレクトリ<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>設定階層の問題を診断する（例：指示がプロジェクトレベルではなくユーザーレベルの設定にあるために、新しいチームメンバーに指示が届いていない）<\/li><li>@importを使用し、メンテナーのドメイン知識に基づいて、関連する標準ファイルを各パッケージのCLAUDE.mdに選択的に取り込む<\/li><li>大きなCLAUDE.mdファイルを、.claude/rules/内の焦点を絞ったトピック別ファイルに分割する（例：testing.md、api-conventions.md、deployment.md）コマンドを使用して、どのメモリファイルが読み込まれているかを確認し、セッション間で一<\/li><li>/memory貫しない動作を診断する<\/li><\/ul>", "<h4>タスクステートメント3.2：カスタムスラッシュコマンドとスキルを作成し設定する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>.claude/commands/  内のプロジェクトスコープのコマンド（バージョン管理を通じて共有）と、~/.claude/commands/ 内のユーザースコープのコマンド（個人用）の違い<\/li><li>context: fork、allowed-tools、argument-hintなどのフロントマター設定をサポートするSKILL.mdファイルを備えた、.claude/skills/内のスキル<\/li><li>スキルを分離されたサブエージェントのコンテキストで実行し、スキルの出力がメインの会話を汚染するのを防ぐためのcontext: forkフロントマターオプション<\/li><li>個人用のスキルのカスタマイズ：チームメイトに影響を与えないように、~/.claude/skills/内に別の名前で個人用のバリエーションを作成すること<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>バージョン管理を通じてチーム全体で利用できるように、.claude/commands/内にプロジェクトスコープのスラッシュコマンドを作成する<\/li><li>context: forkを使用して、冗長な出力（例：コードベース分析）や探索的なコンテキスト（例：代替案のブレインストーミング）を生成するスキルをメインセッションから分離する<\/li><li>スキルのフロントマターでallowed-toolsを設定し、スキル実行中のツールアクセスを制限する（例：破壊的な操作を防ぐためにファイル書き込み操作に限定する）<\/li><li>argument-hintフロントマターを使用して、開発者が引数なしでスキルを呼び出したときに必須パラメータの入力を促す<\/li><li>スキル（タスク固有のワークフローのためのオンデマンド呼び出し）とCLAUDE.md（常に読み込まれる全体共通の標準）のどちらを使用するかを選択する<\/li><\/ul>", "<h4>タスクステートメント3.3：規約を条件付きで読み込むためにパス固有のルールを適用する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>条件付きでルールを有効化するためのglobパターンを含むpathsフィールドをYAMLフロントマターに持つ.claude/rules/ファイル<\/li><li>パススコープのルールが、一致するファイルを編集するときにのみ読み込まれ、無関係なコンテキストとトークン使用量を削減する仕組み<\/li><li>複数のディレクトリにまたがる規約（例：コードベース全体に散在するテストファイル）において、ディレクトリレベルのCLAUDE.mdファイルよりもglobパターンのルールが優れている点<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>YAMLフロントマターでパスのスコープを指定した.claude/rules/ファイルを作成し（例：paths:[\"terraform/**/*\"]）、一致するファイルを編集するときにのみルールが読み込まれるようにする<\/li><li>パス固有のルールでglobパターンを使用し、ディレクトリの場所に関係なくファイルの種類ごとに規約を適用する（例：すべてのテストファイルに**/*.test.tsx）<\/li><li>コードベース全体に散在するファイルに規約を適用する必要がある場合に、サブディレクトリのCLAUDE.mdファイルではなくパス固有のルールを選択する<\/li><\/ul>", "<h4>タスクステートメント3.4：プランモードと直接実行のどちらを使用するかを判断する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>プランモードは、大規模な変更、複数の有効なアプローチ、アーキテクチャ上の決定、複数ファイルの修正を伴う複雑なタスク向けに設計されていること<\/li><li>直接実行は、単純で範囲が明確な変更に適していること（例：ある関数に単一のバリデーションチェックを追加する）<\/li><li>プランモードでは、変更を確定する前にコードベースの探索と設計を安全に行うことができ、コストのかかる手戻りを防げること<\/li><l

raightforward<\/li><li>Why sentiment-based escalation and self-reported confidence scores are unreliable proxies for actual case complexity<\/li><li>How multiple customer matches require clarification (requesting additional identifiers) rather than heuristic selection<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Adding explicit escalation criteria with few-shot examples to the system prompt demonstrating when to escalate versus resolve autonomously<\/li><li>Honoring explicit customer requests for human agents immediately without first attempting investigation<\/li><li>Acknowledging frustration while offering resolution when the issue is within the agent's capability, escalating only if the customer reiterates their preference<\/li><li>Escalating when policy is ambiguous or silent on the customer's specific request (e.g., competitor price matching when policy only addresses own-site adjustments)<\/li><li>Instructing the agent to ask for additional identifiers when tool results return multiple matches, rather than selecting based on heuristics<\/li><\/ul>", "<h4>Task Statement 5.3: Implement error propagation strategies across multi-agent systems<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Structured error context (failure type, attempted query, partial results, alternative approaches) as enabling intelligent coordinator recovery decisions<\/li><li>The distinction between access failures (timeouts needing retry decisions) and valid empty results (successful queries with no matches)<\/li><li>Why generic error statuses (\"search unavailable\") hide valuable context from the coordinator<\/li><li>Why silently suppressing errors (returning empty results as success) or terminating entire workflows on single failures are both anti-patterns<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Returning structured error context including failure type, what was attempted, partial results, and potential alternatives to enable coordinator recovery<\/li><li>Distinguishing access failures from valid empty results in error reporting so the coordinator can make appropriate decisions<\/li><li>Having subagents implement local recovery for transient failures and only propagate errors they cannot resolve, including what was attempted and partial results<\/li><li>Structuring synthesis output with coverage annotations indicating which findings are well-supported versus which topic areas have gaps due to unavailable sources<\/li><\/ul>", "<h4>Task Statement 5.4: Manage context effectively in large codebase exploration<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Context degradation in extended sessions: models start giving inconsistent answers and referencing \"typical patterns\" rather than specific classes discovered earlier<\/li><li>The role of scratchpad files for persisting key findings across context boundaries<\/li><li>Subagent delegation for isolating verbose exploration output while the main agent coordinates high-level understanding<\/li><li>Structured state persistence for crash recovery: each agent exports state to a known location, and the coordinator loads a manifest on resume<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Spawning subagents to investigate specific questions (e.g., \"find all test files,\" \"trace refund flow dependencies\") while the main agent preserves high-level coordination<\/li><li>Having agents maintain scratchpad files recording key findings, referencing them for subsequent questions to counteract context degradation<\/li><li>Summarizing key findings from one exploration phase before spawning sub-agents for the next phase, injecting summaries into initial context<\/li><li>Designing crash recovery using structured agent state exports (manifests) that the coordinator loads on resume and injects into agent prompts<\/li><li>Using /compact to reduce context usage during extended exploration sessions when context fills with verbose discovery output<\/li><\/ul>", "<h4>Task Statement 5.5: Design human review workflows and confidence calibration<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>The risk that aggregate accuracy metrics (e.g., 97% overall) may mask poor performance on specific document types or fields<\/li><li>Stratified random sampling for measuring error rates in high-confidence extractions and detecting novel error patterns<\/li><li>Field-level confidence scores calibrated using labeled validation sets for routing review attention<\/li><li>The importance of validating accuracy by document type and field segment before automating high-confidence extractions<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Implementing stratified random sampling of high-confidence extractions for ongoing error rate measurement and novel pattern detection<\/li><li>Analyzing accuracy by document type and field to verify consistent performance across all segments before reducing human review<\/li><li>Having models output field-level confidence scores, then calibrating review thresholds using labeled validation sets<\/li><li>Routing extractions with low model confidence or ambiguous/contradictory source documents to human review, prioritizing limited reviewer capacity<\/li><\/ul>", "<h4>Task Statement 5.6: Preserve information provenance and handle uncertainty in multi-source synthesis<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>How source attribution is lost during summarization steps when findings are compressed without preserving claim-source mappings<\/li><li>The importance of structured claim-source mappings that the synthesis agent must preserve and merge when combining findings<\/li><li>How to handle conflicting statistics from credible sources: annotating conflicts with source attribution rather than arbitrarily selecting one value<\/li><li>Temporal data: requiring publication/collection dates in structured outputs to prevent temporal differences from being misinterpreted as contradictions<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Requiring subagents to output structured claim-source mappings (source URLs, document names, relevant excerpts) that downstream agents preserve through synthesis<\/li><li>Structuring reports with explicit sections distinguishing well-established findings from contested ones, preserving original source characterizations and methodological context<\/li><li>Completing document analysis with conflicting values included and explicitly annotated, letting the coordinator decide how to reconcile before passing to synthesis<\/li><li>Requiring subagents to include publication or data collection dates in structured outputs to enable correct temporal interpretation<\/li><li>Rendering different content types appropriately in synthesis outputs—financial data as tables, news as prose, technical findings as structured lists—rather than converting everything to a uniform format<\/li><\/ul>"]}, {"n": "7", "title": "How to Prepare", "secs": ["<p>To prepare for this certification exam:<\/p>\n<ul><li>Build an agent with the Claude Agent SDK: implement a complete agentic loop with tool calling, error handling, and session management. Practice spawning subagents and passing context between them.<\/li><li>Configure Claude Code for a real project: set up CLAUDE.md with a configuration hierarchy, create path-specific rules in .claude/rules/, build custom skills with frontmatter options (context: fork, allowed-tools), and integrate at least one MCP server.<\/li><li>Design and test MCP tools: write tool descriptions that clearly differentiate similar tools. Implement structured error responses with error categories and retryable flags. Test tool selection reliability with ambiguous requests.<\/li><li>Build a structured data extraction pipeline: use tool_use with JSON schemas, implement validation-retry loops, design schemas with optional/nullable fields, and practice batch processing with the Message Batches API.<\/li><li>Practice prompt engineering techniques: write few-shot examples for ambiguous scenarios. Define explicit review criteria to reduce false positives. Design multi-pass review architectures for large code reviews.<\/li><li>Study context management patterns: practice extracting structured facts from verbose tool outputs, implementing scratchpad files for long sessions, and designing subagent delegation to manage context limits.<\/li><li>Review escalation and human-in-the-loop patterns: understand when to escalate (policy gaps, customer requests, inability to progress) versus resolve autonomously. Practice designing human review workflows with confidence-based routing.<\/li><\/ul>"]}, {"n": "8", "title": "Preparation Exercises", "secs": ["<p>Complete these hands-on exercises to build practical familiarity with the topics covered on the exam. Each exercise is designed to reinforce knowledge across one or more exam domains.<\/p>", "<h3>Exercise 1: Build a Multi-Tool Agent with Escalation Logic<\/h3>\n<p><strong>Objective:<\/strong> Practice designing an agentic loop with tool integration, structured error handling, and escalation patterns.<\/p>\n<p><strong>Steps:<\/strong><\/p>\n<ul><li>Define 3-4 MCP tools with detailed descriptions that clearly differentiate each tool's purpose, expected inputs, and boundary conditions. Include at least two tools with similar functionality that require careful description to avoid selection confusion.<\/li><li>Implement an agentic loop that checks stop_reason to determine whether to continue tool execution or present the final response. Handle both \"tool_use\" and \"end_turn\" stop reasons correctly.<\/li><li>Add structured error responses to your tools: include errorCategory (transient/validation/permission), isRetryable boolean, and human-readable descriptions. Test that the agent handles each error type appropriately (retrying transient errors, explaining business errors to the user).<\/li><li>Implement a programmatic hook that intercepts tool calls to enforce a business rule (e.g., blocking operations above a threshold amount), redirecting to an escalation workflow when triggered.<\/li><li>Test with multi-concern messages (e.g., requests involving multiple issues) and verify the agent decomposes the request, handles each concern, and synthesizes a unified response.<\/li><\/ul>\n<p><strong>Domains reinforced:<\/strong> Domain 1 (Agentic Architecture &amp; Orchestration), Domain 2 (Tool Design &amp; MCP Integration), Domain 5 (Context Management &amp; Reliability)<\/p>", "<h3>Exercise 2: Configure Claude Code for a Team Development Workflow<\/h3>\n<p><strong>Objective:<\/strong> Practice configuring CLAUDE.md hierarchies, custom slash commands, path-specific rules, and MCP server integration for a multi-developer project.<\/p>\n<p><strong>Steps:<\/strong><\/p>\n<ul><li>Create a project-level CLAUDE.md with universal coding standards and testing conventions. Verify that instructions placed at the project level are consistently applied across all team members.<\/li><li>Create .claude/rules/ files with YAML frontmatter glob patterns for different code areas (e.g., paths: [\"src/api/<strong>/*\"] for API conventions, paths: [\"<\/strong>/*.test.*\"] for testing conventions). Test that rules load only when editing matching files.<\/li><li>Create a project-scoped skill in .claude/skills/ with context: fork and allowed-tools restrictions. Verify the skill runs in isolation without polluting the main conversation context.<\/li><li>Configure an MCP server in .mcp.json with environment variable expansion for credentials. Add a personal experimental MCP server in ~/.claude.json and verify both are available simultaneously.<\/li><li>Test plan mode versus direct execution on tasks of varying complexity: a single-file bug fix, a multi-file library migration, and a new feature with multiple valid implementation approaches. Observe when plan mode provides value.<\/li><\/ul>\n<p><strong>Domains reinforced:<\/strong> Domain 3 (Claude Code Configuration &amp; Workflows), Domain 2 (Tool Design &amp; MCP Integration)<\/p>", "<h3>Exercise 3: Build a Structured Data Extraction Pipeline<\/h3>\n<p><strong>Objective:<\/strong> Practice designing JSON schemas, using tool_use for structured output, implementing validation-retry loops, and designing batch processing strategies.<\/p>\n<p><strong>Steps:<\/strong><\/p>\n<ul><li>Define an extraction tool with a JSON schema containing required and optional fields, an enum with an \"other\" + detail string pattern, and nullable fields for information that may not exist in source documents. Process documents where some fields are absent and verify the model returns null rather than fabricating values.<\/li><li>Implement a validation-retry loop: when Pydantic or JSON schema validation fails, send a follow-up request including the document, the failed extraction, and the specific validation error. Track which errors are resolvable via retry (format mismatches) versus which are not (information absent from source).<\/li><li>Add few-shot examples demonstrating extraction from documents with varied formats (e.g., inline citations vs bibliographies, narrative descriptions vs structured tables) and verify improved handling of structural variety.<\/li><li>Design a batch processing strategy: submit a batch of 100 documents using the Message Batches API, handle failures by custom_id, resubmit failed documents with modifications (e.g., chunking oversized documents), and calculate total processing time relative to SLA constraints.<\/li><li>Implement a human review routing strategy: have the model output field-level confidence scores, route low-confidence extractions to human review, and analyze accuracy by document type and field to verify consistent performance.<\/li><\/ul>\n<p><strong>Domains reinforced:<\/strong> Domain 4 (Prompt Engineering &amp; Structured Output), Domain 5 (Context Management &amp; Reliability)<\/p>", "<h3>Exercise 4: Design and Debug a Multi-Agent Research Pipeline<\/h3>\n<p><strong>Objective:<\/strong> Practice orchestrating subagents, managing context passing, implementing error propagation, and handling synthesis with provenance tracking.<\/p>\n<p><strong>Steps:<\/strong><\/p>\n<ul><li>Build a coordinator agent that delegates to at least two subagents (e.g., web search and document analysis). Ensure the coordinator's allowedTools includes \"Task\" and that each subagent receives its research findings directly in its prompt rather than relying on automatic context inheritance.<\/li><li>Implement parallel subagent execution by having the coordinator emit multiple Task tool calls in a single response. Measure the latency improvement compared to sequential execution.<\/li><li>Design structured output for subagents that separates content from metadata: each finding should include a claim, evidence excerpt, source URL/document name, and publication date. Verify that the synthesis subagent preserves source attribution when combining findings.<\/li><li>Implement error propagation: simulate a subagent timeout and verify the coordinator receives structured error context (failure type, attempted query, partial results). Test that the coordinator can proceed with partial results and annotate the final output with coverage gaps.<\/li><li>Test with conflicting source data (e.g., two credible sources with different statistics) and verify the synthesis output preserves both values with source attribution rather than arbitrarily selecting one, and structures the report to distinguish well-established from contested findings.<\/li><\/ul>\n<p><strong>Domains reinforced:<\/strong> Domain 1 (Agentic Architecture &amp; Orchestration), Domain 2 (Tool Design &amp; MCP Integration), Domain 5 (Context Management &amp; Reliability)<\/p>"]}, {"n": "9", "title": "Sample Questions", "secs": ["<p>The following sample questions illustrate the format and difficulty level of the exam. These are drawn from the practice test and include explanations to aid learning.<\/p>", "<h3>Scenario: Customer Support Resolution Agent<\/h3>\n<p><strong>Question 1:<\/strong> Production data shows that in 12% of cases, your agent skips get_customer entirely and calls lookup_order using only the customer's stated name, occasionally leading to misidentified accounts and incorrect refunds. What change would most effectively address this reliability issue?<\/p>\n<ul class=\"opts\"><li>A. Add a programmatic prerequisite that blocks lookup_order and process_refund calls until get_customer has returned a verified customer ID.<\/li><li>B. Enhance the system prompt to state that customer verification via get_customer is mandatory before any order operations.<\/li><li>C. Add few-shot examples showing the agent always calling get_customer first, even when customers volunteer order details.<\/li><li>D. Implement a routing classifier that analyzes each request and enables only the subset of tools appropriate for that request type.<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: A.<\/strong> When a specific tool sequence is required for critical business logic (like verifying customer identity before processing refunds), programmatic enforcement provides deterministic guarantees that prompt-based approaches cannot. Options B and C rely on probabilistic LLM compliance, which is insufficient when errors have financial consequences. Option D addresses tool availability rather than tool ordering, which is not the actual problem.<\/p><\/details>\n<p><strong>Question 2:<\/strong> Production logs show the agent frequently calls get_customer when users ask about orders (e.g., \"check my order #12345\"), instead of calling lookup_order. Both tools have minimal descriptions (\"Retrieves customer information\" / \"Retrieves order details\") and accept similar identifier formats. What's the most effective first step to improve tool selection reliability?<\/p>\n<ul class=\"opts\"><li>A. Add few-shot examples to the system prompt demonstrating correct tool selection patterns, with 5-8 examples showing order-related queries routing to lookup_order.<\/li><li>B. Expand each tool's description to include input formats it handles, example queries, edge cases, and boundaries explaining when to use it versus similar tools.<\/li><li>C. Implement a routing layer that parses user input before each turn and pre-selects the appropriate tool based on detected keywords and identifier patterns.<\/li><li>D. Consolidate both tools into a single lookup_entity tool that accepts any identifier and internally determines which backend to query.<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: B.<\/strong> Tool descriptions are the primary mechanism LLMs use for tool selection. When descriptions are minimal, models lack the context to differentiate between similar tools. Option B directly addresses this root cause with a low-effort, high-leverage fix. Few-shot examples (A) add token overhead without fixing the underlying issue. A routing layer (C) is over-engineered and bypasses the LLM's natural language understanding. Consolidating tools (D) is a valid architectural choice but requires more effort than a \"first step\" warrants when the immediate problem is inadequate descriptions.<\/p><\/details>\n<p><strong>Question 3:<\/strong> Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates straightforward cases (standard damage replacements with photo evidence) while attempting to autonomously handle complex situations requiring policy exceptions. What's the most effective way to improve escalation calibration?<\/p>\n<ul class=\"opts\"><li>A. Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously.<\/li><li>B. Have the agent self-report a confidence score (1-10) before each response and automatically route requests to humans when confidence falls below a threshold.<\/li><li>C. Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent begins processing.<\/li><li>D. Implement sentiment analysis to detect customer frustration levels and automatically escalate when negative sentiment exceeds a threshold.<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: A.<\/strong> Adding explicit escalation criteria with few-shot examples directly addresses the root cause: unclear decision boundaries. This is the proportionate first response before adding infrastructure. Option B fails because LLM self-reported confidence is poorly calibrated—the agent is already incorrectly confident on hard cases. Option C is over-engineered, requiring labeled data and ML infrastructure when prompt optimization hasn't been tried. Option D solves a different problem entirely; sentiment doesn't correlate with case complexity, which is the actual issue.<\/p><\/details>", "<h3>Scenario: Code Generation with Claude Code<\/h3>\n<p><strong>Question 4:<\/strong> You want to create a custom /review slash command that runs your team's standard code review checklist. This command should be available to every developer when they clone or pull the repository. Where should you create this command file?<\/p>\n<ul class=\"opts\"><li>A. In the .claude/commands/ directory in the project repository<\/li><li>B. In ~/.claude/commands/ in each developer's home directory<\/li><li>C. In the CLAUDE.md file at the project root<\/li><li>D. In a .claude/config.json file with a commands array<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: A.<\/strong> Project-scoped custom slash commands should be stored in the .claude/commands/ directory within the repository. These commands are version-controlled and automatically available to all developers when they clone or pull the repo. Option B (~/.claude/commands/) is for personal commands that aren't shared via version control. Option C (CLAUDE.md) is for project instructions and context, not command definitions. Option D describes a configuration mechanism that doesn't exist in Claude Code.<\/p><\/details>\n<p><strong>Question 5:<\/strong> You've been assigned to restructure the team's monolithic application into microservices. This will involve changes across dozens of files and requires decisions about service boundaries and module dependencies. Which approach should you take?<\/p>\n<ul class=\"opts\"><li>A. Enter plan mode to explore the codebase, understand dependencies, and design an implementation approach before making changes.<\/li><li>B. Start with direct execution and make changes incrementally, letting the implementation reveal the natural service boundaries.<\/li><li>C. Use direct execution with comprehensive upfront instructions detailing exactly how each service should be structured.<\/li><li>D. Begin in direct execution mode and only switch to plan mode if you encounter unexpected complexity during implementation.<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: A.<\/strong> Plan mode is designed for complex tasks involving large-scale changes, multiple valid approaches, and architectural decisions—exactly what monolith-to-microservices restructuring requires. It enables safe codebase exploration and design before committing to changes. Option B risks costly rework when dependencies are discovered late. Option C assumes you already know the right structure without exploring the code. Option D ignores that the complexity is already stated in the requirements, not something that might emerge later.<\/p><\/details>\n<p><strong>Question 6:<\/strong> Your codebase has distinct areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow a repository pattern. Test files are spread throughout the codebase alongside the code they test (e.g., Button.test.tsx next to Button.tsx), and you want all tests to follow the same conventions regardless of location. What's the most maintainable way to ensure Claude automatically applies the correct conventions when generating code?<\/p>\n<ul class=\"opts\"><li>A. Create rule files in .claude/rules/ with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths<\/li><li>B. Consolidate all conventions in the root CLAUDE.md file under headers for each area, relying on Claude to infer which section applies<\/li><li>C. Create skills in .claude/skills/ for each code type that include the relevant conventions in their SKILL.md files<\/li><li>D. Place a separate CLAUDE.md file in each subdirectory containing that area's specific conventions<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: A.<\/strong> Option A is correct because .claude/rules/ with glob patterns (e.g., **/*.test.tsx) allows conventions to be automatically applied based on file paths regardless of directory location, essential for test files spread throughout the codebase. Option B relies on inference rather than explicit matching, making it unreliable. Option C requires manual skill invocation or relies on Claude choosing to load them, contradicting the need for deterministic \"automatic\" application based on file paths. Option D can't easily handle files spread across many directories since CLAUDE.md files are directory-bound.<\/p><\/details>", "<h3>Scenario: Multi-Agent Research System<\/h3>\n<p><strong>Question 7:<\/strong> After running the system on the topic \"impact of AI on creative industries,\" you observe that each subagent completes successfully: the web search agent finds relevant articles, the document analysis agent summarizes papers correctly, and the synthesis agent produces coherent output. However, the final reports cover only visual arts, completely missing music, writing, and film production. When you examine the coordinator's logs, you see it decomposed the topic into three subtasks: \"AI in digital art creation,\" \"AI in graphic design,\" and \"AI in photography.\" What is the most likely root cause?<\/p>\n<ul class=\"opts\"><li>A. The synthesis agent lacks instructions for identifying coverage gaps in the findings it receives from other agents.<\/li><li>B. The coordinator agent's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains of the topic.<\/li><li>C. The web search agent's queries are not comprehensive enough and need to be expanded to cover more creative industry sectors.<\/li><li>D. The document analysis agent is filtering out sources related to non-visual creative industries due to overly restrictive relevance criteria.<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: B.<\/strong> The coordinator's logs reveal the root cause directly: it decomposed \"creative industries\" into only visual arts subtasks (digital art, graphic design, photography), completely omitting music, writing, and film. The subagents executed their assigned tasks correctly—the problem is what they were assigned. Options A, C, and D incorrectly blame downstream agents that are working correctly within their assigned scope.<\/p><\/details>\n<p><strong>Question 8:<\/strong> The web search subagent times out while researching a complex topic. You need to design how this failure information flows back to the coordinator agent. Which error propagation approach best enables intelligent recovery?<\/p>\n<ul class=\"opts\"><li>A. Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches.<\/li><li>B. Implement automatic retry logic with exponential backoff within the subagent, returning a generic \"search unavailable\" status only after all retries are exhausted.<\/li><li>C. Catch the timeout within the subagent and return an empty result set marked as successful.<\/li><li>D. Propagate the timeout exception directly to a top-level handler that terminates the entire research workflow.<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: A.<\/strong> Structured error context gives the coordinator the information it needs to make intelligent recovery decisions—whether to retry with a modified query, try an alternative approach, or proceed with partial results. Option B's generic status hides valuable context from the coordinator, preventing informed decisions. Option C suppresses the error by marking failure as success, which prevents any recovery and risks incomplete research outputs. Option D terminates the entire workflow unnecessarily when recovery strategies could succeed.<\/p><\/details>\n<p><strong>Question 9:<\/strong> During testing, you observe that the synthesis agent frequently needs to verify specific claims while combining findings. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which invokes the web search agent, then re-invokes synthesis with results. This adds 2-3 round trips per task and increases latency by 40%. Your evaluation shows that 85% of these verifications are simple fact-checks (dates, names, statistics) while 15% require deeper investigation. What's the most effective approach to reduce overhead while maintaining system reliability?<\/p>\n<ul class=\"opts\"><li>A. Give the synthesis agent a scoped verify_fact tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator.<\/li><li>B. Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end of its pass, which then sends them all to the web search agent at once.<\/li><li>C. Give the synthesis agent access to all web search tools so it can handle any verification need directly without round-trips through the coordinator.<\/li><li>D. Have the web search agent proactively cache extra context around each source during initial research, anticipating what the synthesis agent might need to verify.<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: A.<\/strong> Option A applies the principle of least privilege by giving the synthesis agent only what it needs for the 85% common case (simple fact verification) while preserving the existing coordination pattern for complex cases. Option B's batching approach creates blocking dependencies since synthesis steps may depend on earlier verified facts. Option C over-provisions the synthesis agent, violating separation of concerns. Option D relies on speculative caching that cannot reliably predict what the synthesis agent will need to verify.<\/p><\/details>", "<h3>Scenario: Claude Code for Continuous Integration<\/h3>\n<p><strong>Question 10:<\/strong> Your pipeline script runs claude \"Analyze this pull request for security issues\" but the job hangs indefinitely. Logs indicate Claude Code is waiting for interactive input. What's the correct approach to run Claude Code in an automated pipeline?<\/p>\n<ul class=\"opts\"><li>A. Add the -p flag: claude -p \"Analyze this pull request for security issues\"<\/li><li>B. Set the environment variable CLAUDE_HEADLESS=true before running the command<\/li><li>C. Redirect stdin from /dev/null: claude \"Analyze this pull request for security issues\" &lt; /dev/null<\/li><li>D. Add the --batch flag: claude --batch \"Analyze this pull request for security issues\"<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: A.<\/strong> The -p (or --print) flag is the documented way to run Claude Code in non-interactive mode. It processes the prompt, outputs the result to stdout, and exits without waiting for user input—exactly what CI/CD pipelines require. The other options reference non-existent features (CLAUDE_HEADLESS environment variable, --batch flag) or use Unix workarounds that don't properly address Claude Code's command syntax.<\/p><\/details>\n<p><strong>Question 11:<\/strong> Your team wants to reduce API costs for automated analysis. Currently, real-time Claude calls power two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes switching both to the Message Batches API for its 50% cost savings. How should you evaluate this proposal?<\/p>\n<ul class=\"opts\"><li>A. Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks.<\/li><li>B. Switch both workflows to batch processing with status polling to check for completion.<\/li><li>C. Keep real-time calls for both workflows to avoid batch result ordering issues.<\/li><li>D. Switch both to batch processing with a timeout fallback to real-time if batches take too long.<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: A.<\/strong> The Message Batches API offers 50% cost savings but has processing times up to 24 hours with no guaranteed latency SLA. This makes it unsuitable for blocking pre-merge checks where developers wait for results, but ideal for overnight batch jobs like technical debt reports. Option B is wrong because relying on \"often faster\" completion isn't acceptable for blocking workflows. Option C reflects a misconception—batch results can be correlated using custom_id fields. Option D adds unnecessary complexity when the simpler solution is matching each API to its appropriate use case.<\/p><\/details>\n<p><strong>Question 12:<\/strong> A pull request modifies 14 files across the stock tracking module. Your single-pass review analyzing all files together produces inconsistent results: detailed feedback for some files but superficial comments for others, obvious bugs missed, and contradictory feedback—flagging a pattern as problematic in one file while approving identical code elsewhere in the same PR. How should you restructure the review?<\/p>\n<ul class=\"opts\"><li>A. Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow.<\/li><li>B. Require developers to split large PRs into smaller submissions of 3-4 files before the automated review runs.<\/li><li>C. Switch to a higher-tier model with a larger context window to give all 14 files adequate attention in one pass.<\/li><li>D. Run three independent review passes on the full PR and only flag issues that appear in at least two of the three runs.<\/li><\/ul>\n<details class=\"ans\"><summary>Show answer<\/summary><p><strong>Correct Answer: A.<\/strong> Splitting reviews into focused passes directly addresses the root cause: attention dilution when processing many files at once. File-by-file analysis ensures consistent depth, while a separate integration pass catches cross-file issues. Option B shifts burden to developers without improving the system. Option C misunderstands that larger context windows don't solve attention quality issues. Option D would actually suppress detection of real bugs by requiring consensus on issues that may only be caught intermittently.<\/p><\/details>"]}, {"n": "10", "title": "How the Exam Is Scored", "secs": ["<p>The Claude Certified Architect – Foundations exam is a criterion-referenced assessment: each candidate is measured against a fixed performance standard, not against other candidates. You pass by demonstrating the knowledge and skills defined in the blueprint, not by outperforming a percentage of peers.<\/p>\n<p><strong>Passing standard.<\/strong> The passing score was established through a formal standard-setting study in which trained subject matter experts judged the level of performance expected of a minimally qualified candidate. The score is reported on a scaled range of 100–1,000, and the cut score is 720. Scaled scoring models help equate scores across multiple exam forms that might have slightly different difficulty levels.<\/p>\n<p><strong>Result reporting.<\/strong> Your result is reported as a pass or fail status with a scaled score from 100 to 1,000. Your score report also shows the percentage of items you answered correctly within each content domain. Section-level percentages are provided to help you understand your performance and are not used to determine your pass or fail result, which is based on your total scaled score.<\/p>"]}, {"n": "11", "title": "Registration and Scheduling", "secs": ["<p>Registration and scheduling are handled through the Anthropic Partner Academy and Pearson VUE:<\/p>\n<ol><li>Go to the certification page for your exam on the Anthropic Partner Academy and review the exam details.<\/li><li>Download the Exam Guide and review the Certification Terms and Conditions and the Certification Exam Policy before registering.<\/li><li>Register for the exam and complete checkout. The fee shown at checkout reflects any discount that applies to your partner tier.<\/li><li>Follow the confirmation instructions to create your Pearson VUE account, then sign in to schedule your exam session.<\/li><li>Choose an available date and select either online proctoring or a Pearson test center. The exam is delivered by Pearson VUE.<\/li><li>You may cancel or reschedule up to 24 hours before your appointment. Changes made within 24 hours forfeit the exam fee.<\/li><\/ol>"]}, {"n": "12", "title": "Exam Policies", "secs": ["", "<h3>Identification<\/h3>\n<p>On exam day you must present a valid, unexpired, government-issued photo identification. The name on your ID must match the name on your registration exactly. If you need to correct the name on your registration, contact certifications-support@anthropic.com before scheduling your exam.<\/p>", "<h3>Accommodations<\/h3>\n<p>Reasonable accommodations are available for candidates with documented disabilities or needs, in accordance with applicable law. Accommodations must be requested and approved by Pearson VUE before you schedule your exam. Do not schedule your appointment until your request has been approved. Request accommodations at pearsonvue.com/us/en/test-takers/accommodations.<\/p>", "<h3>Retake policy<\/h3>\n<p>Candidates who do not pass may retake the exam after a required waiting period. Waiting periods increase with each failed attempt: 14 days after the first, 30 days after the second, and 90 days after the third. You may take an exam up to four times within a rolling twelve-month period. Limits apply per exam, so not passing one exam does not prevent you from registering for a different one. The exam fee applies to each attempt.<\/p>", "<h3>No-show and late arrival<\/h3>\n<p>Candidates who fail to appear for a scheduled exam, or who arrive after the permitted late-arrival window, forfeit the exam fee and must re-register. Cancellation and rescheduling deadlines are described in Section 11.<\/p>"]}, {"n": "13", "title": "Exam-Day Experience and Rules of Conduct", "secs": ["<p>The exam is administered in a standardized, secure, proctored environment. Whether you test online or at a Pearson VUE test center, the following rules apply to protect the integrity of the credential for everyone who holds it.<\/p>\n<p>During the exam you must:<\/p>\n<ul><li>Remain within view of the proctor and webcam for the entire session, if testing online<\/li><li>Keep your workspace clear of notes, books, phones, secondary monitors, and other materials<\/li><li>Refrain from communicating with any other person during the exam<\/li><li>Not capture, copy, photograph, or reproduce any exam content in any form<\/li><\/ul>\n<p>Prohibited items include mobile phones, smart watches, headphones, study materials, and any recording device. Permitted items, if any, such as scratch paper provided by the proctor, are specified by Pearson VUE.<\/p>\n<p><strong>Consequences of misconduct.<\/strong> Cheating, attempting to access prohibited resources, or disclosing exam content may result in invalidation of your result, revocation of your credential, and a ban from future exams.<\/p>"]}, {"n": "14", "title": "Confidentiality and Non-Disclosure Agreement", "secs": ["<p>Before the exam begins you must accept a confidentiality and non-disclosure agreement. By accepting, you agree that all exam content, including questions, answer options, and scenarios, is the confidential and proprietary property of Anthropic, and that you will not disclose, reproduce, or distribute any portion of it. If you do not accept the agreement, the exam session ends and no refund is issued.<\/p>"]}, {"n": "15", "title": "Credential Maintenance and Recertification", "secs": ["<p>The Claude Certified Architect – Foundations credential is valid for 12 months from the date it is awarded. Because the underlying technology evolves rapidly, the credential is time-limited so that holders maintain current knowledge.<\/p>\n<p>To renew on time, you review what has changed since you certified and complete a free, non-proctored assessment on the Anthropic Partner Academy. There is no fee for on-time renewal. If your credential lapses, you must retake the full exam at the full fee to regain certified status.<\/p>\n<p>If exam content changes significantly, Anthropic may require holders to retake the full exam to recertify rather than complete the renewal assessment.<\/p>\n<p>Holders remain subject to the rules of conduct described in Section 13.<\/p>"]}, {"n": "16", "title": "Candidate Support, Appeals, and Privacy", "secs": ["", "<h3>Support<\/h3>\n<p>To correct the name on your registration, contact certifications-support@anthropic.com. For all other questions, including registration, scheduling, accommodations, and results, contact Pearson VUE support at pearsonvue.com/us/en/anthropic.html.<\/p>", "<h3>Appeals and complaints<\/h3>\n<p>You may appeal a decision within 14 days of the date you are notified of it, or, for a concern about your exam result, within 14 days of your exam date. Submit your appeal to Pearson VUE support at the link above. Appeals are reviewed under the program’s appeals policy. The standard-setting outcome and the content of individual exam items are not subject to appeal.<\/p>", "<h3>Privacy<\/h3>\n<p>Personal data collected during registration and testing is handled in accordance with Anthropic’s privacy policy, Pearson VUE’s privacy policy, and applicable data-protection law.<\/p>"]}, {"n": "17", "title": "Appendix", "secs": ["", "<h3>Technologies and Concepts<\/h3>\n<p>The following list contains technologies and concepts that might appear on the exam:<\/p>\n<ul><li>Claude Agent SDK — agent definitions, agentic loops, stop_reason handling, hooks (PostToolUse, tool call interception), subagent spawning via Task tool, allowedTools configuration<\/li><li>Model Context Protocol (MCP) — MCP servers, MCP tools, MCP resources, isError flag, tool descriptions, tool distribution, .mcp.json configuration, environment variable expansion<\/li><li>Claude Code — CLAUDE.md configuration hierarchy (user/project/directory), .claude/rules/ with YAML frontmatter path-scoping, .claude/commands/ for slash commands, .claude/skills/ with SKILL.md frontmatter (context: fork, allowed-tools, argument-hint), plan mode, direct execution, /memory command, /compact, --resume, fork_session, Explore subagent<\/li><li>Claude Code CLI — -p / --print flag for non-interactive mode, --output-format json, --json-schema for structured CI output<\/li><li>Claude API — tool_use with JSON schemas, tool_choice options (\"auto\", \"any\", forced tool selection), stop_reason values (\"tool_use\", \"end_turn\"), max_tokens, system prompts<\/li><li>Message Batches API — 50% cost savings, up to 24-hour processing window, custom_id for request/response correlation, polling for completion, no multi-turn tool calling support<\/li><li>JSON Schema — required vs optional fields, enum types, nullable fields, \"other\" + detail string patterns, strict mode for syntax error elimination<\/li><li>Pydantic — schema validation, semantic validation errors, validation-retry loops<\/li><li>Built-in tools — Read, Write, Edit, Bash, Grep, Glob — their purposes and selection criteria<\/li><li>Few-shot prompting — targeted examples for ambiguous scenarios, format demonstration, generalization to novel patterns<\/li><li>Prompt chaining — sequential task decomposition into focused passes<\/li><li>Context window management — token budgets, progressive summarization, lost-in-the-middle effects, context extraction, scratchpad files<\/li><li>Session management — session resumption, fork_session, named sessions, session context isolation<\/li><li>Confidence scoring — field-level confidence, calibration with labeled validation sets, stratified sampling for error rate measurement<\/li><\/ul>", "<h3>In-Scope Topics<\/h3>\n<p>The following topics are explicitly tested on the exam:<\/p>\n<ul><li>Agentic loop implementation: control flow based on stop_reason, tool result handling, loop termination conditions<\/li><li>Multi-agent orchestration: coordinator-subagent patterns, task decomposition, parallel subagent execution, iterative refinement loops<\/li><li>Subagent context management: explicit context passing, structured state persistence, crash recovery using manifests<\/li><li>Tool interface design: writing effective tool descriptions, splitting vs consolidating tools, tool naming to reduce ambiguity<\/li><li>MCP tool and resource design: resources for content catalogs, tools for actions, description quality for adoption<\/li><li>MCP server configuration: project vs user scope, environment variable expansion, multi-server simultaneous access<\/li><li>Error handling and propagation: structured error responses, transient vs business vs permission errors, local recovery before escalation<\/li><li>Escalation decision-making: explicit criteria, honoring customer preferences, policy gap identification<\/li><li>CLAUDE.md configuration: hierarchy (user/project/directory), @import patterns, .claude/rules/ with glob patterns<\/li><li>Custom commands and skills: project vs user scope, context: fork, allowed-tools, argument-hint frontmatter<\/li><li>Plan mode vs direct execution: complexity assessment, architectural decisions, single-file changes<\/li><li>Iterative refinement: input/output examples, test-driven iteration, interview pattern, sequential vs parallel issue resolution<\/li><li>Structured output via tool_use: schema design, tool_choice configuration, nullable fields to prevent hallucination<\/li><li>Few-shot prompting: ambiguous scenario targeting, format consistency, false positive reduction<\/li><li>Batch processing: Message Batches API appropriateness, latency tolerance assessment, failure handling by custom_id<\/li><li>Context window optimization: trimming verbose tool outputs, structured fact extraction, position-aware input ordering<\/li><li>Human review workflows: confidence calibration, stratified sampling, accuracy segmentation by document type and field<\/li><li>Information provenance: claim-source mappings, temporal data handling, conflict annotation, coverage gap reporting<\/li><\/ul>", "<h3>Out-of-Scope Topics<\/h3>\n<p>The following related topics will not appear on the exam:<\/p>\n<ul><li>Fine-tuning Claude models or training custom models<\/li><li>Claude API authentication, billing, or account management<\/li><li>Detailed implementation of specific programming languages or frameworks (beyond what's needed for tool and schema configuration)<\/li><li>Deploying or hosting MCP servers (infrastructure, networking, container orchestration)<\/li><li>Claude's internal architecture, training process, or model weights<\/li><li>Constitutional AI, RLHF, or safety training methodologies<\/li><li>Embedding models or vector database implementation details<\/li><li>Computer use (browser automation, desktop interaction)<\/li><li>Vision/image analysis capabilities<\/li><li>Streaming API implementation or server-sent events<\/li><li>Rate limiting, quotas, or API pricing calculations<\/li><li>OAuth, API key rotation, or authentication protocol details<\/li><li>Specific cloud provider configurations (AWS, GCP, Azure)<\/li><li>Performance benchmarking or model comparison metrics<\/li><li>Prompt caching implementation details (beyond knowing it exists)<\/li><li>Token counting algorithms or tokenization specifics<\/li><\/ul>"]}, {"n": "18", "title": "Document Control", "secs": ["<table><thead><tr><th>Version<\/th><th>Summary of change<\/th><th>Date<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>Formatting and layout updates<\/td><td>July 2026<\/td><\/tr><tr><td>0.2<\/td><td>Draft revision<\/td><td>June 2026<\/td><\/tr><tr><td>0.1<\/td><td>Initial draft<\/td><td>February 2026<\/td><\/tr><\/tbody><\/table>"]}]}};

try{const s=localStorage.getItem('ccarf-guide-view'); if(s&&NOTES[s]) view=s;}catch(e){}
function wrapTables(h){return h.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');}
function prep(h){h=wrapTables(h); return openAll?h.replace(/<details class="ans">/g,'<details class="ans" open>'):h;}
function render(){
  document.body.classList.toggle('dual',view==='dual');
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  noteEl.innerHTML=NOTES[view].join('');
  document.getElementById('openAll').textContent=openAll?(view==='ja'?'正解をすべて閉じる':view==='en'?'Hide all answers':'샘플 문제 정답 모두 접기'):(view==='ja'?'正解をすべて開く':view==='en'?'Show all answers':'샘플 문제 정답 모두 펼치기');
  let h='';
  for(let i=0;i<N;i++){
    const ko=DATA.ko.ch[i], ja=DATA.ja.ch[i], en=DATA.en.ch[i], n=ko.n;
    h+=`<section class="chap" id="c${n}">`;
    if(view==='dual'){
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1>${ko.title}<span class="sub ja" lang="ja">${ja.title}</span></h1></div>`;
      h+=`<div class="colhead"><span>한국어</span><span>日本語</span></div>`;
      ko.secs.forEach((s,j)=>{h+=`<div class="pair"><div class="sec">${prep(s)}</div><div class="sec ja" lang="ja">${prep(ja.secs[j])}</div></div>`;});
    }else{
      const L=view, c=DATA[L].ch[i];
      h+=`<div class="chap-head"><span class="chap-no">${n}</span><h1 class="${L}" lang="${L}">${c.title}</h1></div>`;
      h+=`<div class="sec ${L}" lang="${L}">${c.secs.map(prep).join('')}</div>`;
    }
    h+='</section>';
  }
  out.innerHTML=h;
  const L=view==='dual'?'ko':view;
  nav.innerHTML=DATA[L].ch.map(c=>`<button data-c="${c.n}" title="${c.title}">${c.n}</button>`).join('');
  spy();
}
document.querySelector('.langs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const cur=current();
  view=b.dataset.v; try{localStorage.setItem('ccarf-guide-view',view);}catch(e){}
  render(); jump(cur,false);
});
document.getElementById('openAll').addEventListener('click',()=>{const cur=current(); openAll=!openAll; render(); jump(cur,false);});
nav.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) jump(b.dataset.c,true);});
function off(){return document.querySelector('header.top').getBoundingClientRect().bottom;}
function jump(n,smooth){
  const el=document.getElementById('c'+n); if(!el) return;
  window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off()-8,behavior:smooth?'smooth':'auto'});
}
function current(){
  const o=off()+20; let c=DATA.ko.ch[0].n;
  DATA.ko.ch.forEach(x=>{const el=document.getElementById('c'+x.n); if(el&&el.getBoundingClientRect().top<=o) c=x.n;}); return c;
}
function spy(){const c=current(); nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));}
addEventListener('scroll',spy,{passive:true});
render();
</script>

</body>
</html>

i>冗長な調査出力を分離し、要約を返すことでメインの会話のコンテキストを保全するExploreサブエージェント<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>アーキテクチャに影響するタスクにプランモードを選択する（例：マイクロサービスの再構成、45+ファイルに影響するライブラリ移行、インフラストラクチャ要件が異なる統合アプローチの選択）<\/li><li>内容が十分に理解されていて範囲が明確な変更に直接実行を選択する（例：スタックトレースが明確な単一ファイルのバグ修正、日付バリデーションの条件分岐の追加）<\/li><li>冗長な調査フェーズにExploreサブエージェントを使用し、複数フェーズのタスクでコンテキストウィンドウが枯渇するのを防ぐ<\/li><li>調査のためのプランモードと実装のための直接実行を組み合わせる（例：ライブラリ移行を計画し、その後、計画したアプローチを実行する）<\/li><\/ul>", "<h4>タスクステートメント3.5：段階的な改善のために反復的な改良手法を適用する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>文章による説明が一貫性なく解釈される場合に、期待する変換を伝える最も効果的な方法としての具体的な入出力の例<\/li><li>テスト駆動の反復：先にテストスイートを作成し、テストの失敗を共有しながら反復して段階的な改善を導くこと<\/li><li>インタビューパターン：実装の前に、開発者が想定していなかった可能性のある考慮事項を洗い出すために、Claudeに質問させること<\/li><li>すべての問題を単一のメッセージで提示すべき場合（相互に影響する問題）と、順番に修正すべき場合（独立した問題）の見極め<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>自然言語による説明では一貫しない結果になる場合に、2-3個の具体的な入出力の例を提示して変換の要件を明確にする<\/li><li>実装の前に、期待される動作、エッジケース、パフォーマンス要件をカバーするテストスイートを作成し、その後テストの失敗を共有しながら反復する<\/li><li>インタビューパターンを使用して、不慣れな領域でソリューションを実装する前に、設計上の考慮事項（例：キャッシュの無効化戦略、障害モード）を洗い出す<\/li><li>入力例と期待される出力を伴う具体的なテストケースを提示して、エッジケースの処理を修正する（例：移行スクリプトにおけるnull値）<\/li><li>修正が相互に影響する場合は、複数の相互に影響する問題を単一の詳細なメッセージで扱い、独立した問題の場合は順番に反復する<\/li><\/ul>", "<h4>タスクステートメント3.6：Claude CodeをCI/CDパイプラインに統合する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>自動化されたパイプラインでClaude Codeを非対話モードで実行するための-p（または--print）フラグ<\/li><li>CIのコンテキストで構造化出力を強制するための--output-format jsonおよび--json-schemaのCLIフラグ<\/li><li>CIから呼び出されるClaude Codeにプロジェクトのコンテキスト（テスト標準、フィクスチャの規約、レビュー基準）を提供する仕組みとしてのCLAUDE.md<\/li><li>セッションコンテキストの分離：コードを生成したのと同じClaudeセッションは、独立したレビューインスタンスと比べて、自身の変更をレビューする効果が低い理由<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>CIで-pフラグを付けてClaude Codeを実行し、対話的な入力待ちによるハングを防ぐ<\/li><li>--output-format jsonを--json-schemaとともに使用し、PRのインラインコメントとして自動投稿するための、機械で解析可能な構造化された指摘事項を生成する<\/li><li>新しいコミットの後にレビューを再実行する際に、以前のレビューの指摘事項をコンテキストに含め、重複コメントを避けるために新規または未対応の問題のみを報告するようClaudeに指示する<\/li><li>既存のテストファイルをコンテキストに提供し、テスト生成において、テストスイートですでにカバーされている重複シナリオが提案されないようにする<\/li><li>テスト標準、価値のあるテストの基準、利用可能なフィクスチャをCLAUDE.mdに文書化し、テスト生成の品質を高め、価値の低いテスト出力を減らす<\/li><\/ul>", "<h3>分野4：プロンプトエンジニアリングと構造化出力<\/h3>", "<h4>タスクステートメント4.1：精度を高め誤検知を減らすために、明示的な基準を備えたプロンプトを設計する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>曖昧な指示よりも明示的な基準が重要であること（例：「コメントの正確性を確認する」ではなく「主張されている動作が実際のコードの動作と矛盾する場合にのみコメントを指摘する」）<\/li><li>「保守的に判断する」や「確信度の高い指摘事項のみを報告する」といった一般的な指示が、具体的なカテゴリ別の基準と比べて精度の向上につながらない理由<\/li><li>誤検知率が開発者の信頼に与える影響：誤検知の多いカテゴリが、正確なカテゴリへの信頼まで損なうこと<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>確信度に基づくフィルタリングに頼るのではなく、報告すべき問題（バグ、セキュリティ）とスキップすべき問題（軽微なスタイル、局所的なパターン）を定義する具体的なレビュー基準を記述する<\/li><li>誤検知の多いカテゴリを一時的に無効化し、それらのカテゴリのプロンプトを改善する間に開発者の信頼を回復する<\/li><li>一貫した分類を実現するために、重大度レベルごとに具体的なコード例を伴う明示的な重大度基準を定義する<\/li><\/ul>", "<h4>タスクステートメント4.2：出力の一貫性と品質を高めるためにfew-shotプロンプティングを適用する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>詳細な指示だけでは一貫しない結果になる場合に、一貫した形式で実用的な出力を得るための最も効果的な手法としてのfew-shotの例<\/li><li>曖昧なケースの扱い方を示すうえでのfew-shotの例の役割（例：曖昧なリクエストに対するツール選択、ブランチレベルのテストカバレッジの不足）<\/li><li>few-shotの例によって、モデルが事前に指定されたケースにのみ一致させるのではなく、新しいパターンに判断を一般化できるようになる仕組み<\/li><li>抽出タスクにおけるハルシネーションの低減に対するfew-shotの例の有効性（例：非公式な計量表現や多様な文書構造の処理）<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>曖昧なシナリオ向けに、妥当と思われる代替案ではなくあるアクションが選ばれた理由の推論を示す、的を絞ったfew-shotの例を2-4個作成する<\/li><li>一貫性を実現するために、求める具体的な出力形式（場所、問題、重大度、修正案）を示すfew-shotの例を含める<\/li><li>許容されるコードパターンと真の問題を区別するfew-shotの例を提示し、一般化を可能にしながら誤検知を減らす<\/li><li>few-shotの例を使用して、多様な文書構造（インライン引用と参考文献リスト、方法論のセクションと本文に埋め込まれた詳細）の正しい扱い方を示す<\/li><li>多様な形式の文書からの正しい抽出を示すfew-shotの例を追加し、必須フィールドが空またはnullで抽出される問題に対処する<\/li><\/ul>", "<h4>タスクステートメント4.3：ツール使用とJSONスキーマを用いて構造化出力を強制する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>スキーマに準拠した構造化出力を保証し、JSON構文エラーを排除する最も信頼性の高いアプローチとしての、JSONスキーマを用いたツール使用（tool_use）<\/li><li>tool_choice: \"auto\"（モデルはツールを呼び出さずにテキストを返す場合がある）、\"any\"（モデルは必ずツールを呼び出すが、どのツールかは選択できる）、強制的なツール選択（モデルは指定された名前の特定のツールを必ず呼び出す）の違い<\/li><li>ツール使用による厳密なJSONスキーマは構文エラーを排除するが、意味的なエラー（例：合計と一致しない明細項目、誤ったフィールドに入った値）は防げないこと<\/li><li>スキーマ設計上の考慮事項：必須フィールドと任意フィールド、拡張可能なカテゴリのための\"other\"＋詳細文字列パターンを伴うenumフィールド<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>JSONスキーマを入力パラメータとする抽出ツールを定義し、tool_useレスポンスから構造化データを抽出する<\/li><li>複数の抽出スキーマが存在し文書の種類が不明な場合に、tool_choice: \"any\"を設定して構造化出力を保証する<\/li><li>tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}で特定のツールを強制し、エンリッチメントのステップの前に特定の抽出が確実に実行されるようにする<\/li><li>ソース文書に情報が含まれていない可能性がある場合にスキーマのフィールドを任意（null許容）として設計し、モデルが必須フィールドを満たすために値を捏造するのを防ぐ<\/li><li>曖昧なケース用の\"unclear\"などのenum値や、拡張可能な分類のための\"other\"＋詳細フィールドを追加する<\/li><li>一貫しないソースの書式に対処するために、厳密な出力スキーマとあわせて形式の正規化ルールをプロンプトに含める<\/li><\/ul>", "<h4>タスクステートメント4.4：抽出品質のための検証、リトライ、フィードバックループを実装する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>エラーフィードバック付きリトライ：リトライ時に具体的な検証エラーをプロンプトに追加し、モデルを修正へと導くこと<\/li><li>リトライの限界：必要な情報がそもそもソース文書に存在しない場合（形式や構造のエラーの場合とは異なり）、リトライは効果がないこと<\/li><li>フィードバックループの設計：どのコード構造が指摘事項を引き起こすかを追跡し（detected_patternフィールド）、却下パターンの体系的な分析を可能にすること<\/li><li>意味的な検証エラー（値の合計が合わない、フィールドの配置が誤っている）とスキーマ構文エラー（ツール使用によって排除される）の違い<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>モデルが自己修正できるように、元の文書、失敗した抽出結果、具体的な検証エラーを含むフォローアップリクエストを実装する<\/li><li>リトライが効果を持たない場合（例：提供されていない外部文書にしか情報が存在しない）と成功する場合（形式の不一致、構造的な出力エラー）を見極める<\/li><li>構造化された指摘事項にdetected_patternフィールドを追加し、開発者が指摘事項を却下した際の誤検知パターンの分析を可能にする<\/li><li>自己修正のための検証フローを設計する：不一致を検出するために\"stated_total\"とあわせて\"calculated_total\"を抽出し、整合しないソースデータに対して\"conflict_detected\"ブール値を追加する<\/li><\/ul>", "<h4>タスクステートメント4.5：効率的なバッチ処理戦略を設計する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<p>：<\/p>\n<ul><li>Message Batches API 50%のコスト削減、最大24時間の処理ウィンドウ、レイテンシSLAの保証なし<\/li><li>バッチ処理は、ノンブロッキングでレイテンシを許容できるワークロード（夜間レポート、週次監査、夜間のテスト生成）に適しており、ブロッキングなワークフロー（マージ前チェック）には適していないこと<\/li><li>バッチAPIは、単一のリクエスト内でのマルチターンのツール呼び出しをサポートしていないこと（リクエストの途中でツールを実行して結果を返すことはできない）<\/li><li>バッチのリクエストとレスポンスのペアを対応付けるためのcustom_idフィールド<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>ワークフローのレイテンシ要件にAPIのアプローチを合わせる：ブロッキングなマージ前チェックには同期API、夜間や週次の分析にはバッチAPI<\/li><li>SLAの制約に基づいてバッチ送信の頻度を計算する（例：24時間のバッチ処理で30時間のSLAを保証するための4時間のウィンドウ）<\/li><li>バッチの失敗に対処する：失敗した文書（custom_idで特定）のみを、適切な修正（例：コンテキスト制限を超えた文書のチャンク分割）を加えて再送信する<\/li><li>大量のバッチ処理を行う前にサンプルセットでプロンプトを改良し、初回の成功率を最大化して、反復的な再送信のコストを削減する<\/li><\/ul>", "<h4>タスクステートメント4.6：マルチインスタンスおよびマルチパスのレビューアーキテクチャを設計する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>セルフレビューの限界：モデルは生成時の推論コンテキストを保持しているため、同じセッション内では自身の判断を疑いにくくなること<\/li><li>独立したレビューインスタンス（以前の推論コンテキストを持たない）は、セルフレビューの指示や拡張思考よりも、微妙な問題を見つけるうえで効果的であること<\/li><li>マルチパスレビュー：注意の分散や矛盾した指摘事項を避けるために、大規模なレビューをファイル単位の局所的な分析パスとファイル横断の統合パスに分割すること<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>生成側の推論コンテキストを持たない、別の独立したClaudeインスタンスを使用して、生成されたコードをレビューする<\/li><li>大規模な複数ファイルのレビューを、局所的な問題に焦点を絞ったファイル単位のパスと、ファイル横断のデータフロー分析のための別個の統合パスに分割する<\/li><li>モデルが各指摘事項とあわせて確信度を自己申告する検証パスを実行し、キャリブレーションされたレビューのルーティングを可能にする<\/li><\/ul>", "<h3>分野5：コンテキスト管理と信頼性<\/h3>", "<h4>タスクステートメント5.1：長いやり取りを通じて重要な情報を保持するために会話コンテキストを管理する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>段階的な要約のリスク：数値、パーセンテージ、日付、顧客が述べた期待が曖昧な要約に圧縮されてしまうこと<\/li><li>「lost in the middle」効果：モデルは長い入力の冒頭と末尾の情報は確実に処理するが、中間部分の指摘事項を見落とす場合があること<\/li><li>ツールの結果がコンテキストに蓄積し、関連性に見合わない量のトークンを消費する仕組み（例：関連するのは5個だけなのに、注文照会ごとに40+個のフィールドが返される）<\/li><li>会話の一貫性を維持するために、後続のAPIリクエストで完全な会話履歴を渡すことの重要性<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>取引に関する事実（金額、日付、注文番号、ステータス）を、要約された履歴の外に置かれ各プロンプトに含まれる永続的な「ケースの事実情報」ブロックに抽出する<\/li><li>複数の問題を扱うセッションのために、構造化された問題データ（注文ID、金額、ステータス）を抽出して別のコンテキストレイヤーに永続化する<\/li><li>冗長なツール出力がコンテキストに蓄積する前に、関連するフィールドのみに切り詰める（例：注文照会から返品に関連するフィールドのみを残す）<\/li><li>位置による影響を軽減するために、集約した入力の冒頭に主要な指摘事項の要約を配置し、詳細な結果を明示的なセクション見出しで整理する<\/li><li>下流での正確な統合を支えるために、サブエージェントに対して構造化出力にメタデータ（日付、情報源の場所、方法論上のコンテキスト）を含めることを要求する<\/li><li>下流のエージェントのコンテキスト予算が限られている場合に、冗長なコンテンツや推論チェーンではなく構造化データ（主要な事実、引用、関連性スコア）を返すように上流のエージェントを変更する<\/li><\/ul>", "<h4>タスクステートメント5.2：効果的なエスカレーションと曖昧さの解消のパターンを設計する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>適切なエスカレーションのトリガー：顧客による人間の担当者への要求、ポリシーの例外や空白（複雑なケースだけではない）、有意義な進展が得られない状況<\/li><li>顧客が明示的に要求した場合に直ちにエスカレーションすることと、問題が単純な場合に解決を申し出ることの違い<\/li><li>感情に基づくエスカレーションや自己申告の確信度スコアが、実際のケースの複雑さを示す指標として信頼できない理由<\/li><li>複数の顧客が一致した場合に、ヒューリスティックによる選択ではなく、確認（追加の識別情報の要求）が必要となること<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>エスカレーションすべき場合と自律的に解決すべき場合を示すfew-shotの例を伴う明示的なエスカレーション基準を、システムプロンプトに追加する<\/li><li>人間の担当者を求める顧客の明示的な要求には、先に調査を試みることなく直ちに応じる<\/li><li>問題がエージェントの対応可能な範囲内である場合は、不満を受け止めつつ解決を申し出て、顧客が希望を重ねて伝えた場合にのみエスカレーションする<\/li><li>顧客の具体的な要求についてポリシーが曖昧であるか何も定めていない場合にエスカレーションする（例：ポリシーが自社サイトでの価格調整のみを扱っている場合の、競合他社との価格マッチング）<\/li><li>ツールの結果が複数の一致を返した場合に、ヒューリスティックに基づいて選択するのではなく、追加の識別情報を尋ねるようエージェントに指示する<\/li><\/ul>", "<h4>タスクステートメント5.3：マルチエージェントシステム全体でのエラー伝播戦略を実装する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>コーディネーターによる賢明な復旧判断を可能にするものとしての、構造化されたエラーコンテキスト（失敗の種類、試行したクエリ、部分的な結果、代替アプローチ）<\/li><li>アクセスの失敗（リトライの判断が必要なタイムアウト）と有効な空の結果（一致するものがなかった成功したクエリ）の違い<\/li><li>汎用的なエラーステータス（「検索を利用できません」）が、コーディネーターから有用なコンテキストを隠してしまう理由<\/li><li>エラーを黙って握りつぶすこと（空の結果を成功として返す）も、単一の失敗でワークフロー全体を終了させることも、いずれもアンチパターンである理由<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>コーディネーターによる復旧を可能にするために、失敗の種類、試行した内容、部分的な結果、考えられる代替案を含む構造化されたエラーコンテキストを返す<\/li><li>コーディネーターが適切な判断を下せるように、エラー報告においてアクセスの失敗と有効な空の結果を区別する<\/li><li>サブエージェントに一時的な障害に対するローカルでの復旧を実装させ、解決できないエラーのみを、試行した内容と部分的な結果を含めて伝播させる<\/li><li>どの指摘事項が十分に裏付けられているか、どのトピック領域に情報源が利用できなかったことによる不足があるかを示すカバレッジの注記を付けて、統合の出力を構造化する<\/li><\/ul>", "<h4>タスクステートメント5.4：大規模なコードベースの探索においてコンテキストを効果的に管理する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>長時間のセッションにおけるコンテキストの劣化：モデルが一貫しない回答を返し始め、以前に発見した具体的なクラスではなく「典型的なパターン」に言及するようになること<\/li><li>コンテキストの境界を越えて主要な発見事項を保持するためのスクラッチパッドファイルの役割<\/li><li>メインエージェントが高レベルの理解を調整する一方で、冗長な探索出力を分離するためのサブエージェントへの委任<\/li><li>クラッシュからの復旧のための構造化された状態の永続化：各エージェントが既知の場所に状態をエクスポートし、コーディネーターが再開時にマニフェストを読み込むこと<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>メインエージェントが高レベルの調整を維持する一方で、特定の問い（例：「すべてのテストファイルを見つける」、「返金フローの依存関係をたどる」）を調査するサブエージェントを起動する<\/li><li>エージェントに主要な発見事項を記録するスクラッチパッドファイルを維持させ、以降の質問でそれを参照させて、コンテキストの劣化に対抗する<\/li><li>次のフェーズのサブエージェントを起動する前に、ある探索フェーズの主要な発見事項を要約し、その要約を初期コンテキストに注入する<\/li><li>コーディネーターが再開時に読み込んでエージェントのプロンプトに注入する、構造化されたエージェント状態のエクスポート（マニフェスト）を用いて、クラッシュからの復旧を設計する<\/li><li>長時間の探索セッション中に冗長な調査出力でコンテキストが埋まった場合に、/compactを使用してコンテキスト使用量を削減する<\/li><\/ul>", "<h4>タスクステートメント5.5：人間によるレビューのワークフローと確信度のキャリブレーションを設計する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>集計された精度指標（例：全体で97%）が、特定の文書の種類やフィールドにおける低いパフォーマンスを覆い隠す可能性があるというリスク<\/li><li>確信度の高い抽出におけるエラー率を測定し、新しいエラーパターンを検出するための層化無作為抽出<\/li><li>レビューの注意を振り分けるための、ラベル付き検証セットを用いてキャリブレーションされたフィールドレベルの確信度スコア<\/li><li>確信度の高い抽出を自動化する前に、文書の種類およびフィールドのセグメントごとに精度を検証することの重要性<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>継続的なエラー率の測定と新しいパターンの検出のために、確信度の高い抽出に対する層化無作為抽出を実装する<\/li><li>人間によるレビューを減らす前に、文書の種類およびフィールドごとに精度を分析し、すべてのセグメントで一貫したパフォーマンスが得られていることを確認する<\/li><li>モデルにフィールドレベルの確信度スコアを出力させ、その後、ラベル付き検証セットを用いてレビューのしきい値をキャリブレーションする<\/li><li>モデルの確信度が低い抽出や、ソース文書が曖昧または矛盾している抽出を人間によるレビューに回し、限られたレビュー担当者のキャパシティに優先順位を付ける<\/li><\/ul>", "<h4>タスクステートメント5.6：複数の情報源の統合において情報の出所を保持し不確実性に対処する<\/h4>\n<p><strong>以下に関する知識：<\/strong><\/p>\n<ul><li>主張と情報源の対応付けを保持せずに発見事項が圧縮されると、要約のステップで情報源の帰属が失われる仕組み<\/li><li>発見事項を統合する際に統合エージェントが保持しマージしなければならない、構造化された主張と情報源の対応付けの重要性<\/li><li>信頼できる情報源の間で矛盾する統計の扱い方：一方の値を恣意的に選ぶのではなく、情報源の帰属を付けて矛盾に注記すること<\/li><li>時間に関するデータ：時間的な差異が矛盾として誤って解釈されるのを防ぐために、構造化出力に公開日や収集日を要求すること<\/li><\/ul>\n<p><strong>以下を実行できること：<\/strong><\/p>\n<ul><li>サブエージェントに対して、下流のエージェントが統合を通じて保持する、構造化された主張と情報源の対応付け（情報源のURL、文書名、関連する抜粋）を出力することを要求する<\/li><li>十分に確立された発見事項と異論のある発見事項を区別する明示的なセクションでレポートを構造化し、元の情報源での特徴付けと方法論上のコンテキストを保持する<\/li><li>矛盾する値を含めて明示的に注記したうえで文書の分析を完了し、統合に渡す前にどのように整合させるかをコーディネーターに判断させる<\/li><li>時間的に正しい解釈を可能にするために、サブエージェントに対して構造化出力に公開日またはデータ収集日を含めることを要求する<\/li><li>すべてを画一的な形式に変換するのではなく、統合の出力においてコンテンツの種類ごとに適切な表現を用いる（財務データは表、ニュースは文章、技術的な発見事項は構造化されたリスト）<\/li><\/ul>"]}, {"n": "7", "title": "準備の方法", "secs": ["<p>この認定資格試験の準備として、以下に取り組んでください。<\/p>\n<ul><li>Claude Agent SDKでエージェントを構築する：ツール呼び出し、エラー処理、セッション管理を備えた完全なエージェントループを実装します。サブエージェントの起動と、サブエージェント間でのコンテキストの受け渡しを練習します。<\/li><li>実際のプロジェクト向けにClaude Codeを設定する：設定階層を持つCLAUDE.mdをセットアップし、.claude/rules/にパス固有のルールを作成し、フロントマターオプション（context: fork、allowed-tools）を使用したカスタムスキルを構築し、少なくとも1つのMCPサーバーを統合します。<\/li><li>MCPツールを設計しテストする：類似したツールを明確に区別するツールの説明を記述します。エラーカテゴリとリトライ可否のフラグを備えた構造化されたエラーレスポンスを実装します。曖昧なリクエストでツール選択の信頼性をテストします。<\/li><li>構造化データの抽出パイプラインを構築する：JSONスキーマとともにtool_useを使用し、検証とリトライのループを実装し、任意（null許容）フィールドを持つスキーマを設計し、Message Batches APIでバッチ処理を練習します。<\/li><li>プロンプトエンジニアリングの手法を練習する：曖昧なシナリオ向けのfew-shotの例を記述します。誤検知を減らすための明示的なレビュー基準を定義します。大規模なコードレビュー向けのマルチパスのレビューアーキテクチャを設計します。<\/li><li>コンテキスト管理のパターンを学習する：冗長なツール出力からの構造化された事実の抽出、長時間のセッション向けのスクラッチパッドファイルの実装、コンテキスト制限に対処するためのサブエージェントへの委任の設計を練習します。<\/li><li>エスカレーションとヒューマン・イン・ザ・ループのパターンを復習する：エスカレーションすべき場合（ポリシーの空白、顧客の要求、進展が得られない状況）と自律的に解決すべき場合を理解します。確信度に基づくルーティングを備えた人間によるレビューのワークフローの設計を練習します。<\/li><\/ul>"]}, {"n": "8", "title": "準備のための演習", "secs": ["<p>以下の実践的な演習に取り組み、試験で扱われるトピックへの実践的な理解を深めてください。各演習は、1つ以上の試験分野にわたる知識を強化するように設計されています。<\/p>", "<h3>演習1：エスカレーションロジックを備えたマルチツールエージェントの構築<\/h3>\n<p><strong>目的：<\/strong> ツール統合、構造化されたエラー処理、エスカレーションパターンを備えたエージェントループの設計を練習する。<\/p>\n<p><strong>手順：<\/strong><\/p>\n<ul><li>各ツールの目的、想定される入力、境界条件を明確に区別する詳細な説明を備えたMCPツールを3-4個定義する。選択時の混同を避けるために慎重な説明が必要となる、機能が類似したツールを少なくとも2つ含める。<\/li><li>stop_reasonを確認して、ツールの実行を続けるか最終的な応答を提示するかを判断するエージェントループを実装する。\"tool_use\"と\"end_turn\"の両方の停止理由を正しく処理する。<\/li><li>ツールに構造化されたエラーレスポンスを追加する：errorCategory（transient/validation/permission）、isRetryableブール値、人間が読める説明を含める。エージェントが各エラーの種類を適切に処理すること（一時的なエラーのリトライ、ビジネスエラーのユーザーへの説明）をテストする。<\/li><li>プログラムによるフックを実装し、ツール呼び出しをインターセプトしてビジネスルールを適用する（例：しきい値の金額を超える操作をブロックする）。フックが作動した場合はエスカレーションワークフローにリダイレクトする。<\/li><li>複数の用件を含むメッセージ（例：複数の問題にまたがるリクエスト）でテストし、エージェントがリクエストを分解して各用件に対応し、1つにまとまった応答に統合することを確認する。<\/li><\/ul>\n<p><strong>強化される分野：<\/strong> 分野1（エージェントアーキテクチャとオーケストレーション）、分野2（ツール設計とMCP統合）、分野5（コンテキスト管理と信頼性）<\/p>", "<h3>演習2：チーム開発ワークフロー向けのClaude Codeの設定<\/h3>\n<p><strong>目的：<\/strong> 複数の開発者が参加するプロジェクトを想定し、CLAUDE.mdの階層、カスタムスラッシュコマンド、パス固有のルール、MCPサーバー統合の設定を練習する。<\/p>\n<p><strong>手順：<\/strong><\/p>\n<ul><li>汎用的なコーディング規約とテスト規約を含むプロジェクトレベルのCLAUDE.mdを作成する。プロジェクトレベルに置いた指示が、チームメンバー全員に一貫して適用されることを確認する。<\/li><li>コード領域ごとに、YAMLフロントマターのglobパターンを指定した.claude/rules/ファイルを作成する（例：API規約にはpaths: [\"src/api/<strong>/*\"]、テスト規約にはpaths: [\"<\/strong>/*.test.*\"]）。一致するファイルを編集するときにだけルールが読み込まれることをテストする。<\/li><li>.claude/skills/に、context: forkとallowed-toolsの制限を指定したプロジェクトスコープのスキルを作成する。スキルが分離された状態で実行され、メインの会話コンテキストを汚さないことを確認する。<\/li><li>.mcp.jsonで、認証情報に環境変数展開を使用するMCPサーバーを設定する。~/.claude.jsonに個人用の実験的なMCPサーバーを追加し、両方が同時に利用できることを確認する。<\/li><li>複雑さの異なるタスクで、プランモードと直接実行を比較してテストする：単一ファイルのバグ修正、複数ファイルにまたがるライブラリ移行、有効な実装アプローチが複数ある新機能。プランモードが効果を発揮する場面を観察する。<\/li><\/ul>\n<p><strong>強化される分野：<\/strong> 分野3（Claude Codeの設定とワークフロー）、分野2（ツール設計とMCP統合）<\/p>", "<h3>演習3：構造化データ抽出パイプラインの構築<\/h3>\n<p><strong>目的：<\/strong> JSONスキーマの設計、構造化出力のためのtool_useの使用、検証・リトライループの実装、バッチ処理戦略の設計を練習する。<\/p>\n<p><strong>手順：<\/strong><\/p>\n<ul><li>抽出ツールを定義する。そのJSONスキーマには、必須フィールドと任意フィールド、\"other\"+詳細文字列のパターンを持つenum、ソース文書に存在しない可能性のある情報のためのnullableフィールドを含める。一部のフィールドが欠けている文書を処理し、モデルが値を捏造せずにnullを返すことを確認する。<\/li><li>検証・リトライループを実装する：PydanticまたはJSONスキーマの検証が失敗した場合、文書、失敗した抽出結果、具体的な検証エラーを含むフォローアップリクエストを送信する。リトライで解決できるエラー（形式の不一致）と解決できないエラー（ソースに情報が存在しない）を区別して記録する。<\/li><li>さまざまな形式の文書（例：本文中の引用と参考文献リスト、文章による説明と構造化された表）からの抽出を示すfew-shotの例を追加し、構造のばらつきへの対応が改善されることを確認する。<\/li><li>バッチ処理戦略を設計する：Message Batches APIを使用して100件の文書をバッチで送信し、custom_idごとに失敗を処理し、失敗した文書を修正して再送信する（例：サイズ超過の文書をチャンクに分割する）。さらに、SLAの制約に照らして合計処理時間を算出する。<\/li><li>人間によるレビューへのルーティング戦略を実装する：モデルにフィールド単位の確信度スコアを出力させ、確信度の低い抽出結果を人間によるレビューに回し、文書タイプ別・フィールド別に精度を分析して、性能が一貫していることを確認する。<\/li><\/ul>\n<p><strong>強化される分野：<\/strong> 分野4（プロンプトエンジニアリングと構造化出力）、分野5（コンテキスト管理と信頼性）<\/p>", "<h3>演習4：マルチエージェントリサーチパイプラインの設計とデバッグ<\/h3>\n<p><strong>目的：<\/strong> サブエージェントのオーケストレーション、コンテキスト受け渡しの管理、エラー伝播の実装、出所の追跡を伴う統合処理を練習する。<\/p>\n<p><strong>手順：<\/strong><\/p>\n<ul><li>少なくとも2つのサブエージェント（例：ウェブ検索と文書分析）に委任するコーディネーターエージェントを構築する。コーディネーターのallowedToolsに\"Task\"が含まれていること、および各サブエージェントが自動的なコンテキスト継承に頼らず、プロンプト内で調査結果を直接受け取ることを確認する。<\/li><li>コーディネーターが1つの応答で複数のTaskツール呼び出しを発行するようにして、サブエージェントの並列実行を実装する。逐次実行と比較したレイテンシの改善を測定する。<\/li><li>コンテンツとメタデータを分離する、サブエージェント用の構造化出力を設計する：各調査結果には、主張、根拠となる抜粋、ソースURL/文書名、公開日を含める。統合サブエージェントが調査結果をまとめる際に、情報源の帰属を保持することを確認する。<\/li><li>エラー伝播を実装する：サブエージェントのタイムアウトをシミュレートし、コーディネーターが構造化されたエラーコンテキスト（失敗の種類、試行したクエリ、部分的な結果）を受け取ることを確認する。コーディネーターが部分的な結果で処理を続行し、最終出力にカバレッジの欠落を注記できることをテストする。<\/li><li>矛盾するソースデータ（例：信頼できる2つの情報源で統計値が異なる場合）でテストする。統合出力が、どちらか一方を恣意的に選ばずに両方の値を情報源の帰属とともに保持していること、また確立された調査結果と見解の分かれる調査結果を区別できるようにレポートが構成されていることを確認する。<\/li><\/ul>\n<p><strong>強化される分野：<\/strong> 分野1（エージェントアーキテクチャとオーケストレーション）、分野2（ツール設計とMCP統合）、分野5（コンテキスト管理と信頼性）<\/p>"]}, {"n": "9", "title": "サンプル問題", "secs": ["<p>以下のサンプル問題は、試験の形式と難易度を示すものです。これらは模擬試験から抜粋したもので、学習に役立つよう解説が付いています。<\/p>", "<h3>シナリオ：カスタマーサポート解決エージェント<\/h3>\n<p><strong>問題1：<\/strong> 本番環境のデータによると、12%のケースでエージェントがget_customerを完全にスキップし、顧客が申告した名前だけを使ってlookup_orderを呼び出しており、その結果、アカウントの誤認や誤った返金がときどき発生しています。この信頼性の問題に最も効果的に対処できる変更はどれですか。<\/p>\n<ul class=\"opts\"><li>A. get_customerが検証済みの顧客IDを返すまで、lookup_orderとprocess_refundの呼び出しをブロックする、プログラムによる前提条件を追加する。<\/li><li>B. システムプロンプトを強化し、あらゆる注文操作の前にget_customerによる顧客確認が必須であることを明記する。<\/li><li>C. 顧客が自分から注文の詳細を伝えてきた場合でも、エージェントが常に最初にget_customerを呼び出す様子を示すfew-shotの例を追加する。<\/li><li>D. 各リクエストを分析し、そのリクエストタイプに適したツールのサブセットだけを有効にするルーティング分類器を実装する。<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：A。<\/strong> 重要なビジネスロジックのために特定のツール実行順序が必要な場合（返金処理の前に顧客の本人確認を行うなど）、プログラムによる強制は、プロンプトベースのアプローチでは得られない決定論的な保証を提供します。選択肢BとCは、LLMが確率的に指示に従うことに依存しており、エラーが金銭的な影響をもたらす場合には不十分です。選択肢Dはツールの順序ではなくツールの利用可否に対処するもので、実際の問題とは異なります。<\/p><\/details>\n<p><strong>問題2：<\/strong> 本番環境のログによると、ユーザーが注文について尋ねたとき（例：「注文#12345を確認して」）、エージェントはlookup_orderではなくget_customerを頻繁に呼び出しています。どちらのツールも説明が最小限で（「顧客情報を取得する」／「注文の詳細を取得する」）、似た形式の識別子を受け付けます。ツール選択の信頼性を高めるための、最も効果的な最初の一手はどれですか。<\/p>\n<ul class=\"opts\"><li>A. システムプロンプトに、正しいツール選択パターンを示すfew-shotの例を追加する。注文関連のクエリがlookup_orderにルーティングされる例を5-8件含める。<\/li><li>B. 各ツールの説明を拡充し、対応する入力形式、クエリの例、エッジケース、類似ツールとの使い分けを説明する境界を含める。<\/li><li>C. 各ターンの前にユーザー入力を解析し、検出したキーワードと識別子のパターンに基づいて適切なツールを事前に選択するルーティング層を実装する。<\/li><li>D. 2つのツールを、任意の識別子を受け付けて問い合わせ先のバックエンドを内部で判断する単一のlookup_entityツールに統合する。<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：B。<\/strong> ツールの説明は、LLMがツールを選択する際に用いる主要な仕組みです。説明が最小限だと、モデルは類似したツールを区別するためのコンテキストを得られません。選択肢Bは、少ない労力で大きな効果が得られる修正によって、この根本原因に直接対処します。few-shotの例（A）は、根本的な問題を解決しないままトークンのオーバーヘッドを増やします。ルーティング層（C）は過剰な設計であり、LLMの自然言語理解を迂回してしまいます。ツールの統合（D）はアーキテクチャ上の選択として妥当ですが、当面の問題が不十分な説明である以上、「最初の一手」に見合う以上の労力がかかります。<\/p><\/details>\n<p><strong>問題3：<\/strong> エージェントの初回解決率は55%で、目標の80%を大きく下回っています。ログによると、エージェントは単純なケース（写真の証拠がある標準的な破損品交換）をエスカレーションする一方で、ポリシーの例外対応が必要な複雑な状況を自律的に処理しようとしています。エスカレーションの判断精度を改善する最も効果的な方法はどれですか。<\/p>\n<ul class=\"opts\"><li>A. システムプロンプトに明示的なエスカレーション基準を追加し、エスカレーションすべき場合と自律的に解決すべき場合を示すfew-shotの例を添える。<\/li><li>B. 各応答の前にエージェントに確信度スコア（1-10）を自己申告させ、確信度がしきい値を下回った場合はリクエストを自動的に人間に回す。<\/li><li>C. 過去のチケットで学習させた別の分類器モデルをデプロイし、メインのエージェントが処理を始める前に、どのリクエストにエスカレーションが必要かを予測する。<\/li><li>D. 感情分析を実装して顧客の不満の度合いを検出し、否定的な感情がしきい値を超えた場合に自動的にエスカレーションする。<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：A。<\/strong> few-shotの例を添えて明示的なエスカレーション基準を追加することは、判断の境界が不明確であるという根本原因に直接対処します。これは、インフラストラクチャを追加する前に取るべき、問題に見合った最初の対応です。選択肢Bは、LLMが自己申告する確信度のキャリブレーションが不十分であるため、うまくいきません。エージェントはすでに、難しいケースで誤って自信を持っているからです。選択肢<\/p><\/details>\n<p>Cは過剰な設計であり、プロンプトの最適化をまだ試していない段階で、ラベル付きデータとMLインフラストラクチャを必要とします。選択肢Dはまったく別の問題を解決するものです。感情は、実際の課題であるケースの複雑さとは相関しません。<\/p>", "<h3>シナリオ：Claude Codeによるコード生成<\/h3>\n<p><strong>問題4：<\/strong> チームの標準的なコードレビューチェックリストを実行する、カスタムの/reviewスラッシュコマンドを作成したいと考えています。このコマンドは、開発者がリポジトリをクローンまたはプルした時点で全員が利用できる必要があります。このコマンドファイルはどこに作成すべきですか。<\/p>\n<ul class=\"opts\"><li>A. プロジェクトリポジトリ内の.claude/commands/ディレクトリ<\/li><li>B. 各開発者のホームディレクトリにある~/.claude/commands/<\/li><li>C. プロジェクトルートのCLAUDE.mdファイル<\/li><li>D. commands配列を持つ.claude/config.jsonファイル<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：A。<\/strong> プロジェクトスコープのカスタムスラッシュコマンドは、リポジトリ内の.claude/commands/ディレクトリに保存します。これらのコマンドはバージョン管理され、開発者がリポジトリをクローンまたはプルすると、全員が自動的に利用できるようになります。選択肢B（~/.claude/commands/）は、バージョン管理で共有されない個人用コマンドのためのものです。選択肢C（CLAUDE.md）は、コマンド定義ではなく、プロジェクトの指示とコンテキストのためのものです。選択肢Dは、Claude Codeに存在しない設定の仕組みを説明しています。<\/p><\/details>\n<p><strong>問題5：<\/strong> チームのモノリシックなアプリケーションをマイクロサービスに再構築する担当になりました。これには数十のファイルにわたる変更が伴い、サービスの境界とモジュールの依存関係についての判断が必要です。どのアプローチを取るべきですか。<\/p>\n<ul class=\"opts\"><li>A. プランモードに入り、変更を加える前にコードベースを調査して依存関係を把握し、実装アプローチを設計する。<\/li><li>B. 直接実行で開始して段階的に変更を加え、実装を進める中で自然なサービス境界が見えてくるようにする。<\/li><li>C. 各サービスをどのように構成すべきかを正確に記した包括的な事前指示を与えたうえで、直接実行を使用する。<\/li><li>D. 直接実行モードで開始し、実装中に予期しない複雑さに直面した場合にのみプランモードに切り替える。<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：A。<\/strong> プランモードは、大規模な変更、複数の有効なアプローチ、アーキテクチャ上の判断を伴う複雑なタスクのために設計されています。これはまさに、モノリスからマイクロサービスへの再構築に必要なものです。変更に踏み切る前に、コードベースの調査と設計を安全に行えます。選択肢Bは、依存関係の発見が遅れた場合に、コストのかかる手戻りが生じるリスクがあります。選択肢Cは、コードを調査せずに正しい構成をすでに知っていることを前提としています。選択肢Dは、複雑さが後から現れるかもしれないものではなく、要件の時点ですでに明示されていることを無視しています。<\/p><\/details>\n<p><strong>問題6：<\/strong> コードベースには、コーディング規約の異なる複数の領域があります。Reactコンポーネントはフックを用いた関数型スタイル、APIハンドラーは特定のエラー処理を伴うasync/await、データベースモデルはリポジトリパターンに従います。テストファイルはテスト対象のコードと並べてコードベース全体に分散しており（例：Button.tsxの隣にButton.test.tsx）、場所に関係なくすべてのテストを同じ規約に従わせたいと考えています。Claudeがコード生成時に正しい規約を自動的に適用するようにする、最も保守しやすい方法はどれですか。<\/p>\n<ul class=\"opts\"><li>A. .claude/rules/に、globパターンを指定するYAMLフロントマター付きのルールファイルを作成し、ファイルパスに基づいて規約を条件付きで適用する<\/li><li>B. すべての規約をルートのCLAUDE.mdファイルに領域ごとの見出しを付けて集約し、どのセクションが該当するかの推測をClaudeに任せる<\/li><li>C. コードの種類ごとに.claude/skills/にスキルを作成し、そのSKILL.mdファイルに該当する規約を含める<\/li><li>D. 各サブディレクトリに、その領域固有の規約を記した個別のCLAUDE.mdファイルを配置する<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：A。<\/strong> 選択肢Aが正解である理由は、globパターン（例：**/*.test.tsx）を指定した.claude/rules/を使うと、ディレクトリの場所に関係なく、ファイルパスに基づいて規約を自動的に適用できるためです。これは、コードベース全体に分散したテストファイルには不可欠です。選択肢Bは明示的なマッチングではなく推測に頼るため、信頼性に欠けます。選択肢Cは、スキルを手動で呼び出すか、Claudeがスキルの読み込みを選択することに頼る必要があり、ファイルパスに基づく決定論的な「自動」適用という要件と矛盾します。選択肢Dは、CLAUDE.mdファイルがディレクトリに紐づくため、多数のディレクトリに分散したファイルを容易には扱えません。<\/p><\/details>", "<h3>シナリオ：マルチエージェントリサーチシステム<\/h3>\n<p><strong>問題7：<\/strong> 「AIがクリエイティブ産業に与える影響」というトピックでシステムを実行したところ、各サブエージェントは正常に完了していることがわかりました。ウェブ検索エージェントは関連する記事を見つけ、文書分析エージェントは論文を正しく要約し、統合エージェントは一貫性のある出力を生成しています。しかし、最終レポートはビジュアルアートしか扱っておらず、音楽、執筆、映画制作が完全に抜け落ちています。コーディネーターのログを調べると、トピックが「デジタルアート制作におけるAI」「グラフィックデザインにおけるAI」「写真におけるAI」という3つのサブタスクに分解されていました。最も可能性の高い根本原因はどれですか。<\/p>\n<ul class=\"opts\"><li>A. 統合エージェントに、他のエージェントから受け取った調査結果のカバレッジの欠落を特定するための指示が不足している。<\/li><li>B. コーディネーターエージェントのタスク分解が狭すぎるため、サブエージェントへの割り当てがトピックの関連領域をすべてカバーできていない。<\/li><li>C. ウェブ検索エージェントのクエリが十分に網羅的ではなく、クリエイティブ産業のより多くのセクターをカバーするよう拡張する必要がある。<\/li><li>D. 文書分析エージェントが、過度に厳しい関連性基準のために、ビジュアル以外のクリエイティブ産業に関するソースを除外している。<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：B。<\/strong> コーディネーターのログが根本原因を直接示しています。「クリエイティブ産業」をビジュアルアートのサブタスク（デジタルアート、グラフィックデザイン、写真）だけに分解し、音楽、執筆、映画を完全に省いています。サブエージェントは割り当てられたタスクを正しく実行しており、問題は割り当てられた内容にあります。選択肢A、C、Dは、割り当てられた範囲内で正しく動作している下流のエージェントに誤って原因を求めています。<\/p><\/details>\n<p><strong>問題8：<\/strong> ウェブ検索サブエージェントが、複雑なトピックの調査中にタイムアウトします。この失敗の情報をコーディネーターエージェントにどのように戻すかを設計する必要があります。インテリジェントな復旧を最もよく可能にするエラー伝播のアプローチはどれですか。<\/p>\n<ul class=\"opts\"><li>A. 失敗の種類、試行したクエリ、部分的な結果、考えられる代替アプローチを含む構造化されたエラーコンテキストをコーディネーターに返す。<\/li><li>B. サブエージェント内に指数バックオフによる自動リトライロジックを実装し、すべてのリトライを使い切った後にのみ、汎用的な「検索を利用できません」というステータスを返す。<\/li><li>C. サブエージェント内でタイムアウトをキャッチし、成功とマークした空の結果セットを返す。<\/li><li>D. タイムアウト例外を、リサーチワークフロー全体を終了させるトップレベルのハンドラーにそのまま伝播させる。<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：A。<\/strong> 構造化されたエラーコンテキストは、修正したクエリでリトライするか、代替アプローチを試すか、部分的な結果で続行するかといった、インテリジェントな復旧の判断に必要な情報をコーディネーターに与えます。選択肢Bの汎用的なステータスは、価値のあるコンテキストをコーディネーターから隠し、十分な情報に基づく判断を妨げます。選択肢Cは、失敗を成功としてマークすることでエラーを握りつぶし、復旧を一切できなくするうえ、リサーチの出力が不完全になるリスクがあります。選択肢Dは、復旧戦略が成功する可能性があるにもかかわらず、ワークフロー全体を不必要に終了させます。<\/p><\/details>\n<p><strong>問題9：<\/strong> テスト中に、統合エージェントが調査結果をまとめる際、特定の主張を検証する必要が頻繁に生じることがわかりました。現在は、検証が必要になると統合エージェントがコーディネーターに制御を戻し、コーディネーターがウェブ検索エージェントを呼び出し、その結果を添えて統合を再度呼び出します。これによりタスクごとに2-3回のラウンドトリップが追加され、レイテンシが40%増加します。評価によると、これらの検証の85%は単純なファクトチェック（日付、名前、統計）で、15%はより深い調査が必要です。システムの信頼性を維持しながらオーバーヘッドを削減する最も効果的なアプローチはどれですか。<\/p>\n<ul class=\"opts\"><li>A. 統合エージェントに、単純な照会用にスコープを限定したverify_factツールを与え、複雑な検証は引き続きコーディネーター経由でウェブ検索エージェントに委任する。<\/li><li>B. 統合エージェントに検証の必要事項をすべて蓄積させ、処理パスの最後にまとめてコーディネーターに返させる。コーディネーターはそれらを一括でウェブ検索エージェントに送る。<\/li><li>C. 統合エージェントにすべてのウェブ検索ツールへのアクセスを与え、コーディネーターを経由するラウンドトリップなしに、あらゆる検証の必要に直接対応できるようにする。<\/li><li>D. ウェブ検索エージェントに、統合エージェントが検証を必要としそうな内容を見越して、最初の調査中に各ソースの周辺コンテキストを余分に先回りしてキャッシュさせる。<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：A。<\/strong> 選択肢Aは最小権限の原則を適用し、85%を占める一般的なケース（単純な事実確認）に必要なものだけを統合エージェントに与えつつ、複雑なケースについては既存の連携パターンを維持します。選択肢Bのバッチ化のアプローチは、統合のステップがそれ以前に検証された事実に依存する場合があるため、ブロッキングの依存関係を生みます。選択肢Cは統合エージェントに過剰な権限を与え、関心の分離に反します。選択肢Dは投機的なキャッシュに頼っており、統合エージェントが何を検証する必要があるかを確実には予測できません。<\/p><\/details>", "<h3>シナリオ：継続的インテグレーションのためのClaude Code<\/h3>\n<p><strong>問題10：<\/strong> パイプラインスクリプトでclaude \"Analyze this pull request for security issues\"を実行していますが、ジョブがいつまでも応答しません。ログによると、Claude Codeは対話的な入力を待っています。自動化されたパイプラインでClaude Codeを実行する正しいアプローチはどれですか。<\/p>\n<ul class=\"opts\"><li>A. -pフラグを追加する：claude -p \"Analyze this pull request for security issues\"<\/li><li>B. コマンドを実行する前に環境変数CLAUDE_HEADLESS=trueを設定する<\/li><li>C. stdinを/dev/nullからリダイレクトする：claude \"Analyze this pull request for security issues\" &lt;/dev/nullフラグを追加する：claude --batch \"Analyze this pull request for security issues\"<\/li><li>D. --batch<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：A。<\/strong> -p（または--print）フラグは、Claude Codeを非対話モードで実行するための、ドキュメントに記載された方法です。プロンプトを処理して結果をstdoutに出力し、ユーザー入力を待たずに終了します。これはまさにCI/CDパイプラインに必要な動作です。その他の選択肢は、存在しない機能（CLAUDE_HEADLESS環境変数、--batchフラグ）を参照しているか、Claude Codeのコマンド構文に適切に対応していないUnixの回避策を使用しています。<\/p><\/details>\n<p><strong>問題11：<\/strong> チームは自動分析のAPIコストを削減したいと考えています。現在、リアルタイムのClaude呼び出しが2つのワークフローを支えています。(1)開発者がマージする前に完了しなければならない、ブロッキングのマージ前チェック、(2)翌朝のレビューのために夜間に生成される技術的負債レポートです。マネージャーは、50%のコスト削減を理由に、両方をMessage Batches APIに切り替えることを提案しています。この提案をどのように評価すべきですか。<\/p>\n<ul class=\"opts\"><li>A. 技術的負債レポートにのみバッチ処理を使用し、マージ前チェックにはリアルタイム呼び出しを維持する。<\/li><li>B. 両方のワークフローをバッチ処理に切り替え、ステータスのポーリングで完了を確認する。<\/li><li>C. バッチ結果の順序の問題を避けるため、両方のワークフローでリアルタイム呼び出しを維持する。<\/li><li>D. 両方をバッチ処理に切り替え、バッチに時間がかかりすぎる場合はリアルタイムにフォールバックするタイムアウトを設ける。<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：A。<\/strong> Message Batches APIは50%のコスト削減をもたらしますが、処理時間は最大24時間で、レイテンシのSLAは保証されていません。そのため、開発者が結果を待つブロッキングのマージ前チェックには適しませんが、技術的負債レポートのような夜間のバッチジョブには最適です。選択肢Bは誤りです。「多く<\/p><\/details>\n<p>の場合はもっと早く」完了することに頼るのは、ブロッキングのワークフローでは許容できないためです。選択肢Cは誤解を反映しています。バッチの結果は、custom_idフィールドを使って対応付けることができます。選択肢Dは、それぞれのAPIを適切なユースケースに合わせるという、より単純な解決策があるにもかかわらず、不必要な複雑さを加えます。<\/p>\n<p><strong>問題12：<\/strong> あるプルリクエストが、在庫追跡モジュール全体で14ファイルを変更しています。すべてのファイルをまとめて分析する単一パスのレビューでは、結果に一貫性がありません。一部のファイルには詳細なフィードバックがある一方で他のファイルには表面的なコメントしかなく、明らかなバグが見逃され、あるファイルではあるパターンを問題として指摘しながら同じPR内の別の箇所では同一のコードを承認するといった、矛盾したフィードバックも見られます。レビューをどのように再構成すべきですか。<\/p>\n<ul class=\"opts\"><li>A. 焦点を絞ったパスに分割する：各ファイルを個別に分析してローカルな問題を調べ、その後、ファイル間のデータフローを調べる、統合に焦点を当てた別のパスを実行する。<\/li><li>B. 自動レビューを実行する前に、大きなPRを3-4ファイルの小さな提出単位に分割することを開発者に義務付ける。<\/li><li>C. コンテキストウィンドウの大きい上位のモデルに切り替え、1回のパスで14ファイルすべてに十分な注意が行き届くようにする。<\/li><li>D. PR全体に対して独立したレビューパスを3回実行し、3回のうち少なくとも2回で現れた問題だけを指摘する。<\/li><\/ul>\n<details class=\"ans\"><summary>正解と解説を見る<\/summary><p><strong>正解：A。<\/strong> レビューを焦点を絞ったパスに分割することは、多数のファイルを一度に処理する際の注意力の希薄化という根本原因に直接対処します。ファイル単位の分析によって一貫した深さが確保され、別個の統合パスによってファイル間の問題が検出されます。選択肢Bは、システムを改善せずに開発者に負担を転嫁します。選択肢Cは、コンテキストウィンドウを大きくしても注意の質の問題は解決しないことを誤解しています。選択肢Dは、断続的にしか検出されない可能性のある問題について合意を求めることで、実際のバグの検出をかえって抑制してしまいます。<\/p><\/details>"]}, {"n": "10", "title": "試験の採点方法", "secs": ["<p>Claude Certified Architect – Foundations試験は、基準準拠型の評価です。各受験者は、他の受験者との比較ではなく、固定された能力基準に照らして測定されます。合格するには、一定割合の他の受験者を上回ることではなく、ブループリントで定義された知識とスキルを示すことが必要です。<\/p>\n<p><strong>合格基準。<\/strong>合格点は、訓練を受けた対象分野の専門家が、最低限の能力を備えた受験者に期待される能力水準を判定する、正式な基準設定調査を通じて設定されました。スコアは100–1,000のスケール範囲で報告され、カットスコアは720です。スケールスコア方式は、難易度がわずかに異なる可能性のある複数の試験フォーム間でスコアを等化するのに役立ちます。<\/p>\n<p><strong>結果の通知。<\/strong>結果は、合格または不合格のステータスと、100から1,000までのスケールスコアで報告されます。スコアレポートには、各内容分野であなたが正解した問題の割合も記載されます。セクション別のパーセンテージは、ご自身の成績を理解するために提供されるものであり、合否の判定には使用されません。合否は総合のスケールスコアに基づいて判定されます。<\/p>"]}, {"n": "11", "title": "申し込みと予約", "secs": ["<p>申し込みと予約は、Anthropic Partner AcademyとPearson VUEを通じて行います。<\/p>\n<ol><li>Anthropic Partner Academyで受験する試験の認定資格ページにアクセスし、試験の詳細を確認します。<\/li><li>申し込む前に、試験ガイドをダウンロードし、「認定資格利用規約」（Certification Terms and Conditions）と「認定試験ポリシー」（Certification Exam Policy）を確認します。<\/li><li>試験に申し込み、支払い手続きを完了します。支払い手続きの画面に表示される受験料には、ご自身のパートナーティアに適用される割引が反映されています。<\/li><li>確認の案内に従ってPearson VUEアカウントを作成し、サインインして試験セッションを予約します。<\/li><li>空いている日程を選び、オンライン監督付きまたはPearsonのテストセンターのいずれかを選択します。試験はPearson VUEによって実施されます。<\/li><li>予約時刻の24時間前までは、キャンセルまたは予約変更ができます。24時間以内に行った変更では、受験料は返金されません。<\/li><\/ol>"]}, {"n": "12", "title": "試験ポリシー", "secs": ["", "<h3>本人確認書類<\/h3>\n<p>試験当日は、有効期限内の、政府発行の有効な写真付き本人確認書類を提示する必要があります。本人確認書類の氏名は、申し込み時の氏名と完全に一致していなければなりません。申し込み時の氏名を訂正する必要がある場合は、試験を予約する前にcertifications-support@anthropic.comまでご連絡ください。<\/p>", "<h3>受験上の配慮<\/h3>\n<p>障害またはニーズを証明する書類のある受験者は、適用される法律に従い、合理的な受験上の配慮を受けられます。受験上の配慮は、試験を予約する前に申請し、Pearson VUEの承認を受ける必要があります。申請が承認されるまで、予約をしないでください。受験上の配慮はpearsonvue.com/us/en/test-takers/accommodationsで申請してください。<\/p>", "<h3>再受験ポリシー<\/h3>\n<p>合格しなかった受験者は、所定の待機期間の後に再受験できます。待機期間は不合格の回数が増えるごとに長くなり、初回の後は14日、2回目の後は30日、3回目の後は90日です。同じ試験は、任意の連続する12か月の期間内に4回まで受験できます。上限は試験ごとに適用されるため、ある試験に合格しなかったことで、別の試験に申し込めなくなることはありません。受験料は受験のたびに必要です。<\/p>", "<h3>無断欠席と遅刻<\/h3>\n<p>予約した試験に現れなかった受験者、または認められた遅刻許容時間を過ぎて到着した受験者は、受験料が返金されず、あらためて申し込む必要があります。キャンセルと予約変更の期限は、セクション11に記載されています。<\/p>"]}, {"n": "13", "title": "試験当日の流れと受験規則", "secs": ["<p>試験は、標準化され、安全が確保された、監督付きの環境で実施されます。オンラインで受験する場合も、Pearson VUEのテストセンターで受験する場合も、資格を保有するすべての人のために資格の信頼性を守る目的で、以下の規則が適用されます。<\/p>\n<p>試験中は、次のことを守る必要があります。<\/p>\n<ul><li>オンラインで受験する場合、セッションの間ずっと試験監督者とウェブカメラの視界内にとどまる<\/li><li>作業スペースにメモ、書籍、電話、サブモニター、その他の物品を置かない<\/li><li>試験中、他のいかなる人とも連絡や会話をしない<\/li><li>試験内容を、いかなる形式でも記録、複写、撮影、複製しない<\/li><\/ul>\n<p>持ち込みが禁止されている物品には、携帯電話、スマートウォッチ、ヘッドホン、学習教材、あらゆる録音・録画機器が含まれます。試験監督者が提供するメモ用紙など、持ち込みが許可される物品がある場合は、Pearson VUEが指定します。<\/p>\n<p><strong>不正行為の結果。<\/strong>カンニング、禁止されているリソースへのアクセスの試み、試験内容の開示があった場合、結果の無効化、資格の取り消し、今後の試験の受験禁止となることがあります。<\/p>"]}, {"n": "14", "title": "機密保持および秘密保持契約", "secs": ["<p>試験が始まる前に、機密保持および秘密保持契約に同意する必要があります。同意することにより、問題、解答の選択肢、シナリオを含むすべての試験内容がAnthropicの機密情報であり専有財産であること、およびそのいかなる部分も開示、複製、配布しないことに同意したことになります。契約に同意しない場合、試験セッションは終了し、返金は行われません。<\/p>"]}, {"n": "15", "title": "資格の維持と再認定", "secs": ["<p>Claude Certified Architect – Foundationsの資格は、授与された日から12か月間有効です。基盤となる技術は急速に進化するため、資格保有者が最新の知識を維持できるよう、この資格には有効期間が設けられています。<\/p>\n<p>期限内に更新するには、認定を受けてからの変更点を確認し、Anthropic Partner Academyで無料の監督なしのアセスメントを完了します。期限内の更新に費用はかかりません。資格が失効した場合、認定されたステータスを取り戻すには、正規の受験料で試験全体を再受験する必要があります。<\/p>\n<p>試験内容が大幅に変更された場合、Anthropicは資格保有者に対し、再認定のために、更新アセスメントの完了ではなく試験全体の再受験を求めることがあります。<\/p>\n<p>資格保有者には、セクション13に記載された受験規則が引き続き適用されます。<\/p>"]}, {"n": "16", "title": "受験者サポート、異議申し立て、プライバシー", "secs": ["", "<h3>サポート<\/h3>\n<p>申し込み時の氏名を訂正するには、certifications-support@anthropic.comまでご連絡ください。申し込み、予約、受験上の配慮、結果など、その他すべての質問については、Pearson VUEのサポート（pearsonvue.com/us/en/anthropic.html）にお問い合わせください。<\/p>", "<h3>異議申し立てと苦情<\/h3>\n<p>決定に対しては、その通知を受けた日から14日以内に異議申し立てができます。試験結果に関する懸念の場合は、試験日から14日以内です。異議申し立ては、上記のリンクからPearson VUEのサポートに提出してください。異議申し立ては、プログラムの異議申し立てポリシーに基づいて審査されます。基準設定の結果および個々の試験問題の内容は、異議申し立ての対象になりません。<\/p>", "<h3>プライバシー<\/h3>\n<p>申し込みおよび受験の際に収集される個人データは、Anthropicのプライバシーポリシー、Pearson VUEのプライバシーポリシー、および適用されるデータ保護法に従って取り扱われます。<\/p>"]}, {"n": "17", "title": "付録", "secs": ["", "<h3>テクノロジーと概念<\/h3>\n<p>試験に出題される可能性のあるテクノロジーと概念は、以下のとおりです：<\/p>\n<ul><li>Claude Agent SDK — エージェント定義、エージェントループ、stop_reasonの処理、フック（PostToolUse、ツール呼び出しのインターセプト）、Taskツールによるサブエージェントの生成、allowedToolsの設定<\/li><li>Model Context Protocol（MCP） — MCPサーバー、MCPツール、MCPリソース、isErrorフラグ、ツールの説明、ツールの配分、.mcp.jsonの設定、環境変数展開<\/li><li>Claude Code — CLAUDE.mdの設定階層（ユーザー/プロジェクト/ディレクトリ）、YAMLフロントマターによるパススコープ指定を用いた.claude/rules/、スラッシュコマンド用の.claude/commands/、SKILL.mdフロントマター（context: fork、allowed-tools、argument-hint）を用いた.claude/skills/、プランモード、直接実行、/memoryコマンド、/compact、--resume、fork_session、Exploreサブエージェント<\/li><li>Claude Code CLI — 非対話モード用の-p / --printフラグ、--output-format json、構造化されたCI出力用の--json-schema<\/li><li>Claude API — JSONスキーマを用いたtool_use、tool_choiceのオプション（\"auto\"、\"any\"、強制的なツール選択）、stop_reasonの値（\"tool_use\"、\"end_turn\"）、max_tokens、システムプロンプト<\/li><li>Message Batches API — 50%のコスト削減、最大24時間の処理ウィンドウ、リクエストとレスポンスを対応付けるためのcustom_id、完了確認のためのポーリング、マルチターンのツール呼び出しは非対応<\/li><li>JSON Schema — 必須フィールドと任意フィールド、enum型、nullableフィールド、\"other\"+詳細文字列のパターン、構文エラーを排除するstrictモード<\/li><li>Pydantic — スキーマ検証、意味的な検証エラー、検証・リトライループ<\/li><li>組み込みツール — Read、Write、Edit、Bash、Grep、Glob — それぞれの目的と選択基準<\/li><li>few-shotプロンプティング — 曖昧なシナリオに的を絞った例、形式の提示、新しいパターンへの汎化<\/li><li>プロンプトチェーン — 焦点を絞ったパスへの逐次的なタスク分解<\/li><li>コンテキストウィンドウの管理 — トークン予算、段階的な要約、lost-in-the-middle効果、コンテキスト抽出、スクラッチパッドファイル<\/li><li>セッション管理 — セッションの再開、fork_session、名前付きセッション、セッションコンテキストの分離<\/li><li>確信度スコアリング — フィールド単位の確信度、ラベル付き検証セットによるキャリブレーション、エラー率測定のための層化サンプリング出題範囲のトピック以下のトピックは、試験で明示的に出題されます：<\/li><\/ul>", "<h3>出題範囲のトピック<\/h3>\n<p>以下のトピックは、試験で明示的に出題されます：<\/p>\n<ul><li>エージェントループの実装：stop_reasonに基づく制御フロー、ツール結果の処理、ループの終了条件<\/li><li>マルチエージェントオーケストレーション：コーディネーターとサブエージェントのパターン、タスク分解、サブエージェントの並列実行、反復的な改善ループ<\/li><li>サブエージェントのコンテキスト管理：明示的なコンテキスト受け渡し、構造化された状態の永続化、マニフェストを用いたクラッシュからの復旧<\/li><li>ツールインターフェース設計：効果的なツール説明の記述、ツールの分割と統合、曖昧さを減らすツールの命名<\/li><li>MCPツールとリソースの設計：コンテンツカタログにはリソース、アクションにはツール、採用を促す説明の品質<\/li><li>MCPサーバーの設定：プロジェクトスコープとユーザースコープ、環境変数展開、複数サーバーへの同時アクセス<\/li><li>エラー処理と伝播：構造化されたエラーレスポンス、一時的エラー・ビジネスエラー・権限エラーの区別、エスカレーション前のローカルでの復旧<\/li><li>エスカレーションの意思決定：明示的な基準、顧客の希望の尊重、ポリシーの欠落の特定<\/li><li>CLAUDE.mdの設定：階層（ユーザー/プロジェクト/ディレクトリ）、@importパターン、globパターンを用いた.claude/rules/<\/li><li>カスタムコマンドとスキル：プロジェクトスコープとユーザースコープ、context: fork、allowed-tools、argument-hintのフロントマター<\/li><li>プランモードと直接実行：複雑さの評価、アーキテクチャ上の判断、単一ファイルの変更<\/li><li>反復的な改善：入出力の例、テスト駆動の反復、インタビューパターン、問題の逐次的な解決と並列的な解決<\/li><li>tool_useによる構造化出力：スキーマ設計、tool_choiceの設定、ハルシネーションを防ぐためのnullableフィールド<\/li><li>few-shotプロンプティング：曖昧なシナリオへの的の絞り込み、形式の一貫性、誤検知の削減<\/li><li>バッチ処理：Message Batches APIの適否、レイテンシ許容度の評価、custom_idによる失敗の処理<\/li><li>コンテキストウィンドウの最適化：冗長なツール出力の切り詰め、構造化された事実の抽出、位置を考慮した入力の順序付け<\/li><li>人間によるレビューのワークフロー：確信度のキャリブレーション、層化サンプリング、文書タイプ別・フィールド別の精度の分析<\/li><li>情報の出所：主張と情報源の対応付け、時間的データの扱い、矛盾の注記、カバレッジの欠落の報告出題範囲外のトピック以下の関連トピックは、試験には出題されません：<\/li><\/ul>", "<h3>出題範囲外のトピック<\/h3>\n<p>以下の関連トピックは、試験には出題されません：<\/p>\n<ul><li>Claudeモデルのファインチューニングまたはカスタムモデルのトレーニング<\/li><li>Claude APIの認証、請求、アカウント管理<\/li><li>特定のプログラミング言語やフレームワークの詳細な実装（ツールとスキーマの設定に必要な範囲を超えるもの）<\/li><li>MCPサーバーのデプロイまたはホスティング（インフラストラクチャ、ネットワーク、コンテナオーケストレーション）<\/li><li>Claudeの内部アーキテクチャ、トレーニングプロセス、モデルの重み<\/li><li>Constitutional AI、RLHF、安全性トレーニングの方法論<\/li><li>埋め込みモデルまたはベクトルデータベースの実装の詳細<\/li><li>コンピュータ使用（ブラウザ自動化、デスクトップ操作）<\/li><li>ビジョン/画像分析機能<\/li><li>ストリーミングAPIの実装またはサーバー送信イベント<\/li><li>レート制限、クォータ、API料金の計算<\/li><li>OAuth、APIキーのローテーション、認証プロトコルの詳細<\/li><li>特定のクラウドプロバイダーの設定（AWS、GCP、Azure）<\/li><li>パフォーマンスベンチマークまたはモデル比較の指標<\/li><li>プロンプトキャッシングの実装の詳細（存在を知っていること以上の内容）<\/li><li>トークンカウントのアルゴリズムまたはトークン化の詳細<\/li><\/ul>"]}, {"n": "18", "title": "文書管理", "secs": ["<table><thead><tr><th>バージョン<\/th><th>変更の概要<\/th><th>日付<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>書式とレイアウトの更新<\/td><td>2026年7月<\/td><\/tr><tr><td>0.2<\/td><td>ドラフトの改訂<\/td><td>2026年6月<\/td><\/tr><tr><td>0.1<\/td><td>初版ドラフト<\/td><td>2026年2月<\/td><\/tr><\/tbody><\/table>"]}]}, "en": {"title": "Claude Certified Architect – Foundations Exam Guide — English (official)", "note": ["Source: official English PDF, Version 1.0 · Effective July 2026 · Exam code: CCAR-F. Text transcribed from the PDF; only headings and tables reformatted.", "\"This guide is subject to change without notice.\""], "ch": [{"n": "1", "title": "About This Certification", "secs": ["<p>The Claude Certified Architect – Foundations certification validates that practitioners can make informed decisions about tradeoffs when implementing real-world solutions with Claude. This exam tests foundational knowledge across Claude Code, the Claude Agent SDK, the Claude API, and Model Context Protocol (MCP), the core technologies used to build production-grade applications with Claude.<\/p>\n<p>Questions on this exam are grounded in realistic scenarios drawn from actual customer use cases, including building agentic systems for customer support, designing multi-agent research pipelines, integrating Claude Code into CI/CD workflows, building developer productivity tools, and extracting structured data from unstructured documents. Candidates must demonstrate not only conceptual knowledge but practical judgment about architecture, configuration, and tradeoffs in production deployments.<\/p>\n<p>This guide is the authoritative reference for candidates preparing to sit the exam. It describes the exam content, lists the domains and task statements tested, provides sample questions, and recommends preparation strategies. Read it in full before scheduling your exam.<\/p>"]}, {"n": "2", "title": "Intended Audience", "secs": ["<p>The ideal candidate for this certification is a solution architect who designs and implements production applications with Claude. This candidate has hands-on experience with:<\/p>\n<ul><li>Building agentic applications using the Claude Agent SDK, including multi-agent orchestration, subagent delegation, tool integration, and lifecycle hooks<\/li><li>Configuring and customizing Claude Code for team workflows using CLAUDE.md files, Agent Skills, MCP server integrations, and plan mode<\/li><li>Designing Model Context Protocol (MCP) tool and resource interfaces for backend system integration<\/li><li>Engineering prompts that produce reliable structured output, leveraging JSON schemas, few-shot examples, and extraction patterns<\/li><li>Managing context windows effectively across long documents, multi-turn conversations, and multi-agent handoffs<\/li><li>Integrating Claude into CI/CD pipelines for automated code review, test generation, and pull request feedback<\/li><li>Making sound escalation and reliability decisions, including error handling, human-in-the-loop workflows, and self-evaluation patterns<\/li><\/ul>\n<p>The candidate typically has 6+ months of practical experience building with Claude APIs, Agent SDK, Claude Code, and MCP, understanding both the capabilities and limitations of large language models in production environments.<\/p>"]}, {"n": "3", "title": "Exam Details at a Glance", "secs": ["<table><thead><tr><th>Item<\/th><th>Detail<\/th><\/tr><\/thead><tbody><tr><td>Credential<\/td><td>Claude Certified Architect – Foundations<\/td><\/tr><tr><td>Exam code<\/td><td>CCAR-F<\/td><\/tr><tr><td>Number of items<\/td><td>60<\/td><\/tr><tr><td>Item format<\/td><td>Multiple-choice and multiple-response items; each item states how many responses to select<\/td><\/tr><tr><td>Exam structure<\/td><td>4 scenarios drawn from a bank of 6<\/td><\/tr><tr><td>Time limit<\/td><td>120 minutes<\/td><\/tr><tr><td>Delivery<\/td><td>Proctored: online proctored and/or test center, per program policy<\/td><\/tr><tr><td>Passing score<\/td><td>Scaled score of 720 on a scale of 100–1,000<\/td><\/tr><tr><td>Exam fee<\/td><td>$125 USD<\/td><\/tr><tr><td>Validity period<\/td><td>12 months from the date the credential is awarded<\/td><\/tr><tr><td>Result reporting<\/td><td>Pass/fail with scaled score (100–1,000), plus percent-correct by domain on the score report<\/td><\/tr><\/tbody><\/table>"]}, {"n": "4", "title": "Exam Content Outline (Blueprint)", "secs": ["<p>The exam blueprint defines the content domains measured and the approximate weight of each domain on the exam. Weights reflect the relative importance of each domain to competent performance as determined through the job task analysis. The percentages indicate the approximate proportion of scored items drawn from each domain.<\/p>\n<table><thead><tr><th>Domain<\/th><th>Content Domain<\/th><th>Weight<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Agentic Architecture &amp; Orchestration<\/td><td>27%<\/td><\/tr><tr><td>2<\/td><td>Tool Design &amp; MCP Integration<\/td><td>18%<\/td><\/tr><tr><td>3<\/td><td>Claude Code Configuration &amp; Workflows<\/td><td>20%<\/td><\/tr><tr><td>4<\/td><td>Prompt Engineering &amp; Structured Output<\/td><td>20%<\/td><\/tr><tr><td>5<\/td><td>Context Management &amp; Reliability<\/td><td>15%<\/td><\/tr><tr><td><\/td><td>Total<\/td><td>100%<\/td><\/tr><\/tbody><\/table>"]}, {"n": "5", "title": "Exam Scenarios", "secs": ["<p>The exam uses scenario-based questions. Each scenario presents a realistic production context that frames a set of questions. During the exam, 4 scenarios are presented and picked at random from the full set of the 6 scenarios below.<\/p>", "<h3>Scenario 1: Customer Support Resolution Agent<\/h3>\n<p>You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests like returns, billing disputes, and account issues. It has access to your backend systems through custom Model Context Protocol (MCP) tools (get_customer, lookup_order, process_refund, escalate_to_human). Your target is 80%+ first-contact resolution while knowing when to escalate.<\/p>\n<p><strong>Primary domains:<\/strong> Agentic Architecture &amp; Orchestration, Tool Design &amp; MCP Integration, Context Management &amp; Reliability<\/p>", "<h3>Scenario 2: Code Generation with Claude Code<\/h3>\n<p>You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, CLAUDE.md configurations, and understand when to use plan mode vs direct execution.<\/p>\n<p><strong>Primary domains:<\/strong> Claude Code Configuration &amp; Workflows, Context Management &amp; Reliability<\/p>", "<h3>Scenario 3: Multi-Agent Research System<\/h3>\n<p>You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.<\/p>\n<p><strong>Primary domains:<\/strong> Agentic Architecture &amp; Orchestration, Tool Design &amp; MCP Integration, Context Management &amp; Reliability<\/p>", "<h3>Scenario 4: Developer Productivity with Claude<\/h3>\n<p>You are building developer productivity tools using the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate code, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and integrates with Model Context Protocol (MCP) servers.<\/p>\n<p><strong>Primary domains:<\/strong> Tool Design &amp; MCP Integration, Claude Code Configuration &amp; Workflows, Agentic Architecture &amp; Orchestration<\/p>", "<h3>Scenario 5: Claude Code for Continuous Integration<\/h3>\n<p>You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.<\/p>\n<p><strong>Primary domains:<\/strong> Claude Code Configuration &amp; Workflows, Prompt Engineering &amp; Structured Output<\/p>", "<h3>Scenario 6: Structured Data Extraction<\/h3>\n<p>You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JavaScript Object Notation (JSON) schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.<\/p>\n<p><strong>Primary domains:<\/strong> Prompt Engineering &amp; Structured Output, Context Management &amp; Reliability<\/p>"]}, {"n": "6", "title": "Detailed Objectives by Domain", "secs": ["<p>Each domain below lists the task statements tested, with the knowledge and skills measured against each. Exam items are written against these objectives.<\/p>", "<h3>Domain 1: Agentic Architecture &amp; Orchestration<\/h3>", "<h4>Task Statement 1.1: Design and implement agentic loops for autonomous task execution<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>The agentic loop lifecycle: sending requests to Claude, inspecting stop_reason (\"tool_use\" vs \"end_turn\"), executing requested tools, and returning results for the next iteration<\/li><li>How tool results are appended to conversation history so the model can reason about the next action<\/li><li>The distinction between model-driven decision-making (Claude reasons about which tool to call next based on context) and pre-configured decision trees or tool sequences<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Implementing agentic loop control flow that continues when stop_reason is \"tool_use\" and terminates when stop_reason is \"end_turn\"<\/li><li>Adding tool results to conversation context between iterations so the model can incorporate new information into its reasoning<\/li><li>Avoiding anti-patterns such as parsing natural language signals to determine loop termination, setting arbitrary iteration caps as the primary stopping mechanism, or checking for assistant text content as a completion indicator<\/li><\/ul>", "<h4>Task Statement 1.2: Orchestrate multi-agent systems with coordinator-subagent patterns<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Hub-and-spoke architecture where a coordinator agent manages all inter-subagent communication, error handling, and information routing<\/li><li>How subagents operate with isolated context—they do not inherit the coordinator's conversation history automatically<\/li><li>The role of the coordinator in task decomposition, delegation, result aggregation, and deciding which subagents to invoke based on query complexity<\/li><li>Risks of overly narrow task decomposition by the coordinator, leading to incomplete coverage of broad research topics<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Designing coordinator agents that analyze query requirements and dynamically select which subagents to invoke rather than always routing through the full pipeline<\/li><li>Partitioning research scope across subagents to minimize duplication (e.g., assigning distinct subtopics or source types to each agent)<\/li><li>Implementing iterative refinement loops where the coordinator evaluates synthesis output for gaps, re-delegates to search and analysis subagents with targeted queries, and re-invokes synthesis until coverage is sufficient<\/li><li>Routing all subagent communication through the coordinator for observability, consistent error handling, and controlled information flow<\/li><\/ul>", "<h4>Task Statement 1.3: Configure subagent invocation, context passing, and spawning<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>The Task tool as the mechanism for spawning subagents, and the requirement that allowedTools must include \"Task\" for a coordinator to invoke subagents<\/li><li>That subagent context must be explicitly provided in the prompt—subagents do not automatically inherit parent context or share memory between invocations<\/li><li>The AgentDefinition configuration including descriptions, system prompts, and tool restrictions for each subagent type<\/li><li>Fork-based session management for exploring divergent approaches from a shared analysis baseline<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Including complete findings from prior agents directly in the subagent's prompt (e.g., passing web search results and document analysis outputs to the synthesis subagent)<\/li><li>Using structured data formats to separate content from metadata (source URLs, document names, page numbers) when passing context between agents to preserve attribution<\/li><li>Spawning parallel subagents by emitting multiple Task tool calls in a single coordinator response rather than across separate turns<\/li><li>Designing coordinator prompts that specify research goals and quality criteria rather than step-by-step procedural instructions, to enable subagent adaptability<\/li><\/ul>", "<h4>Task Statement 1.4: Implement multi-step workflows with enforcement and handoff patterns<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>The difference between programmatic enforcement (hooks, prerequisite gates) and prompt-based guidance for workflow ordering<\/li><li>When deterministic compliance is required (e.g., identity verification before financial operations), prompt instructions alone have a non-zero failure rate<\/li><li>Structured handoff protocols for mid-process escalation that include customer details, root cause analysis, and recommended actions<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Implementing programmatic prerequisites that block downstream tool calls until prerequisite steps have completed (e.g., blocking process_refund until get_customer has returned a verified customer ID)<\/li><li>Decomposing multi-concern customer requests into distinct items, then investigating each in parallel using shared context before synthesizing a unified resolution<\/li><li>Compiling structured handoff summaries (customer ID, root cause, refund amount, recommended action) when escalating to human agents who lack access to the conversation transcript<\/li><\/ul>", "<h4>Task Statement 1.5: Apply Agent SDK hooks for tool call interception and data normalization<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Hook patterns (e.g., PostToolUse) that intercept tool results for transformation before the model processes them<\/li><li>Hook patterns that intercept outgoing tool calls to enforce compliance rules (e.g., blocking refunds above a threshold)<\/li><li>The distinction between using hooks for deterministic guarantees versus relying on prompt instructions for probabilistic compliance<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Implementing PostToolUse hooks to normalize heterogeneous data formats (Unix timestamps, ISO 8601, numeric status codes) from different MCP tools before the agent processes them<\/li><li>Implementing tool call interception hooks that block policy-violating actions (e.g., refunds exceeding $500) and redirect to alternative workflows (e.g., human escalation)<\/li><li>Choosing hooks over prompt-based enforcement when business rules require guaranteed compliance<\/li><\/ul>", "<h4>Task Statement 1.6: Design task decomposition strategies for complex workflows<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>When to use fixed sequential pipelines (prompt chaining) versus dynamic adaptive decomposition based on intermediate findings<\/li><li>Prompt chaining patterns that break reviews into sequential steps (e.g., analyze each file individually, then run a cross-file integration pass)<\/li><li>The value of adaptive investigation plans that generate subtasks based on what is discovered at each step<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Selecting task decomposition patterns appropriate to the workflow: prompt chaining for predictable multi-aspect reviews, dynamic decomposition for open-ended investigation tasks<\/li><li>Splitting large code reviews into per-file local analysis passes plus a separate cross-file integration pass to avoid attention dilution<\/li><li>Decomposing open-ended tasks (e.g., \"add comprehensive tests to a legacy codebase\") by first mapping structure, identifying high-impact areas, then creating a prioritized plan that adapts as dependencies are discovered<\/li><\/ul>", "<h4>Task Statement 1.7: Manage session state, resumption, and forking<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Named session resumption using --resume &lt;session-name&gt; to continue a specific prior conversation<\/li><li>fork_session for creating independent branches from a shared analysis baseline to explore divergent approaches<\/li><li>The importance of informing the agent about changes to previously analyzed files when resuming sessions after code modifications<\/li><li>Why starting a new session with a structured summary is more reliable than resuming with stale tool results<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Using --resume with session names to continue named investigation sessions across work sessions<\/li><li>Using fork_session to create parallel exploration branches (e.g., comparing two testing strategies or refactoring approaches from a shared codebase analysis)<\/li><li>Choosing between session resumption (when prior context is mostly valid) and starting fresh with injected summaries (when prior tool results are stale)<\/li><li>Informing a resumed session about specific file changes for targeted re-analysis rather than requiring full re-exploration<\/li><\/ul>", "<h3>Domain 2: Tool Design &amp; MCP Integration<\/h3>", "<h4>Task Statement 2.1: Design effective tool interfaces with clear descriptions and boundaries<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Tool descriptions as the primary mechanism LLMs use for tool selection; minimal descriptions lead to unreliable selection among similar tools<\/li><li>The importance of including input formats, example queries, edge cases, and boundary explanations in tool descriptions<\/li><li>How ambiguous or overlapping tool descriptions cause misrouting (e.g., analyze_content vs analyze_document with near-identical descriptions)<\/li><li>The impact of system prompt wording on tool selection: keyword-sensitive instructions can create unintended tool associations<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Writing tool descriptions that clearly differentiate each tool's purpose, expected inputs, outputs, and when to use it versus similar alternatives<\/li><li>Renaming tools and updating descriptions to eliminate functional overlap (e.g., renaming analyze_content to extract_web_results with a web-specific description)<\/li><li>Splitting generic tools into purpose-specific tools with defined input/output contracts (e.g., splitting a generic analyze_document into extract_data_points, summarize_content, and verify_claim_against_source)<\/li><li>Reviewing system prompts for keyword-sensitive instructions that might override well-written tool descriptions<\/li><\/ul>", "<h4>Task Statement 2.2: Implement structured error responses for MCP tools<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>The MCP isError flag pattern for communicating tool failures back to the agent<\/li><li>The distinction between transient errors (timeouts, service unavailability), validation errors (invalid input), business errors (policy violations), and permission errors<\/li><li>Why uniform error responses (generic \"Operation failed\") prevent the agent from making appropriate recovery decisions<\/li><li>The difference between retryable and non-retryable errors, and how returning structured metadata prevents wasted retry attempts<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Returning structured error metadata including errorCategory (transient/validation/permission), isRetryable boolean, and human-readable descriptions<\/li><li>Including retriable: false flags and customer-friendly explanations for business rule violations so the agent can communicate appropriately<\/li><li>Implementing local error recovery within subagents for transient failures, propagating to the coordinator only errors that cannot be resolved locally along with partial results and what was attempted<\/li><li>Distinguishing between access failures (needing retry decisions) and valid empty results (representing successful queries with no matches)<\/li><\/ul>", "<h4>Task Statement 2.3: Distribute tools appropriately across agents and configure tool choice<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>The principle that giving an agent access to too many tools (e.g., 18 instead of 4-5) degrades tool selection reliability by increasing decision complexity<\/li><li>Why agents with tools outside their specialization tend to misuse them (e.g., a synthesis agent attempting web searches)<\/li><li>Scoped tool access: giving agents only the tools needed for their role, with limited cross-role tools for specific high-frequency needs<\/li><li>tool_choice configuration options: \"auto\", \"any\", and forced tool selection ({\"type\": \"tool\", \"name\": \"...\"})<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Restricting each subagent's tool set to those relevant to its role, preventing cross-specialization misuse<\/li><li>Replacing generic tools with constrained alternatives (e.g., replacing fetch_url with load_document that validates document URLs)<\/li><li>Providing scoped cross-role tools for high-frequency needs (e.g., a verify_fact tool for the synthesis agent) while routing complex cases through the coordinator<\/li><li>Using tool_choice forced selection to ensure a specific tool is called first (e.g., forcing extract_metadata before enrichment tools), then processing subsequent steps in follow-up turns<\/li><li>Setting tool_choice: \"any\" to guarantee the model calls a tool rather than returning conversational text<\/li><\/ul>", "<h4>Task Statement 2.4: Integrate MCP servers into Claude Code and agent workflows<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>MCP server scoping: project-level (.mcp.json) for shared team tooling vs user-level (~/.claude.json) for personal/experimental servers<\/li><li>Environment variable expansion in .mcp.json (e.g., ${GITHUB_TOKEN}) for credential management without committing secrets<\/li><li>That tools from all configured MCP servers are discovered at connection time and available simultaneously to the agent<\/li><li>MCP resources as a mechanism for exposing content catalogs (e.g., issue summaries, documentation hierarchies, database schemas) to reduce exploratory tool calls<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Configuring shared MCP servers in project-scoped .mcp.json with environment variable expansion for authentication tokens<\/li><li>Configuring personal/experimental MCP servers in user-scoped ~/.claude.json<\/li><li>Enhancing MCP tool descriptions to explain capabilities and outputs in detail, preventing the agent from preferring built-in tools (like Grep) over more capable MCP tools<\/li><li>Choosing existing community MCP servers over custom implementations for standard integrations (e.g., Jira), reserving custom servers for team-specific workflows<\/li><li>Exposing content catalogs as MCP resources to give agents visibility into available data without requiring exploratory tool calls<\/li><\/ul>", "<h4>Task Statement 2.5: Select and apply built-in tools (Read, Write, Edit, Bash, Grep, Glob) effectively<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Grep for content search (searching file contents for patterns like function names, error messages, or import statements)<\/li><li>Glob for file path pattern matching (finding files by name or extension patterns)<\/li><li>Read/Write for full file operations; Edit for targeted modifications using unique text matching<\/li><li>When Edit fails due to non-unique text matches, using Read + Write as a fallback for reliable file modifications<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Selecting Grep for searching code content across a codebase (e.g., finding all callers of a function, locating error messages)<\/li><li>Selecting Glob for finding files matching naming patterns (e.g., **/*.test.tsx)<\/li><li>Using Read to load full file contents followed by Write when Edit cannot find unique anchor text<\/li><li>Building codebase understanding incrementally: starting with Grep to find entry points, then using Read to follow imports and trace flows, rather than reading all files upfront<\/li><li>Tracing function usage across wrapper modules by first identifying all exported names, then searching for each name across the codebase<\/li><\/ul>", "<h3>Domain 3: Claude Code Configuration &amp; Workflows<\/h3>", "<h4>Task Statement 3.1: Configure CLAUDE.md files with appropriate hierarchy, scoping, and modular organization<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>The CLAUDE.md configuration hierarchy: user-level (~/.claude/CLAUDE.md), project-level (.claude/CLAUDE.md or root CLAUDE.md), and directory-level (subdirectory CLAUDE.md files)<\/li><li>That user-level settings apply only to that user—instructions in ~/.claude/CLAUDE.md are not shared with teammates via version control<\/li><li>The @import syntax for referencing external files to keep CLAUDE.md modular (e.g., importing specific standards files relevant to each package)<\/li><li>.claude/rules/ directory for organizing topic-specific rule files as an alternative to a monolithic CLAUDE.md<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Diagnosing configuration hierarchy issues (e.g., a new team member not receiving instructions because they're in user-level rather than project-level configuration)<\/li><li>Using @import to selectively include relevant standards files in each package's CLAUDE.md based on maintainer domain knowledge<\/li><li>Splitting large CLAUDE.md files into focused topic-specific files in .claude/rules/ (e.g., testing.md, api-conventions.md, deployment.md)<\/li><li>Using the /memory command to verify which memory files are loaded and diagnose inconsistent behavior across sessions<\/li><\/ul>", "<h4>Task Statement 3.2: Create and configure custom slash commands and skills<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Project-scoped commands in .claude/commands/ (shared via version control) vs user-scoped commands in ~/.claude/commands/ (personal)<\/li><li>Skills in .claude/skills/ with SKILL.md files that support frontmatter configuration including context: fork, allowed-tools, and argument-hint<\/li><li>The context: fork frontmatter option for running skills in an isolated sub-agent context, preventing skill outputs from polluting the main conversation<\/li><li>Personal skill customization: creating personal variants in ~/.claude/skills/ with different names to avoid affecting teammates<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Creating project-scoped slash commands in .claude/commands/ for team-wide availability via version control<\/li><li>Using context: fork to isolate skills that produce verbose output (e.g., codebase analysis) or exploratory context (e.g., brainstorming alternatives) from the main session<\/li><li>Configuring allowed-tools in skill frontmatter to restrict tool access during skill execution (e.g., limiting to file write operations to prevent destructive actions)<\/li><li>Using argument-hint frontmatter to prompt developers for required parameters when they invoke the skill without arguments<\/li><li>Choosing between skills (on-demand invocation for task-specific workflows) and CLAUDE.md (always-loaded universal standards)<\/li><\/ul>", "<h4>Task Statement 3.3: Apply path-specific rules for conditional convention loading<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>.claude/rules/ files with YAML frontmatter paths fields containing glob patterns for conditional rule activation<\/li><li>How path-scoped rules load only when editing matching files, reducing irrelevant context and token usage<\/li><li>The advantage of glob-pattern rules over directory-level CLAUDE.md files for conventions that span multiple directories (e.g., test files spread throughout a codebase)<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Creating .claude/rules/ files with YAML frontmatter path scoping (e.g., paths: [\"terraform/**/*\"]) so rules load only when editing matching files<\/li><li>Using glob patterns in path-specific rules to apply conventions to files by type regardless of directory location (e.g., **/*.test.tsx for all test files)<\/li><li>Choosing path-specific rules over subdirectory CLAUDE.md files when conventions must apply to files spread across the codebase<\/li><\/ul>", "<h4>Task Statement 3.4: Determine when to use plan mode vs direct execution<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Plan mode is designed for complex tasks involving large-scale changes, multiple valid approaches, architectural decisions, and multi-file modifications<\/li><li>Direct execution is appropriate for simple, well-scoped changes (e.g., adding a single validation check to one function)<\/li><li>Plan mode enables safe codebase exploration and design before committing to changes, preventing costly rework<\/li><li>The Explore subagent for isolating verbose discovery output and returning summaries to preserve main conversation context<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Selecting plan mode for tasks with architectural implications (e.g., microservice restructuring, library migrations affecting 45+ files, choosing between integration approaches with different infrastructure requirements)<\/li><li>Selecting direct execution for well-understood changes with clear scope (e.g., a single-file bug fix with a clear stack trace, adding a date validation conditional)<\/li><li>Using the Explore subagent for verbose discovery phases to prevent context window exhaustion during multi-phase tasks<\/li><li>Combining plan mode for investigation with direct execution for implementation (e.g., planning a library migration, then executing the planned approach)<\/li><\/ul>", "<h4>Task Statement 3.5: Apply iterative refinement techniques for progressive improvement<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Concrete input/output examples as the most effective way to communicate expected transformations when prose descriptions are interpreted inconsistently<\/li><li>Test-driven iteration: writing test suites first, then iterating by sharing test failures to guide progressive improvement<\/li><li>The interview pattern: having Claude ask questions to surface considerations the developer may not have anticipated before implementing<\/li><li>When to provide all issues in a single message (interacting problems) versus fixing them sequentially (independent problems)<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Providing 2-3 concrete input/output examples to clarify transformation requirements when natural language descriptions produce inconsistent results<\/li><li>Writing test suites covering expected behavior, edge cases, and performance requirements before implementation, then iterating by sharing test failures<\/li><li>Using the interview pattern to surface design considerations (e.g., cache invalidation strategies, failure modes) before implementing solutions in unfamiliar domains<\/li><li>Providing specific test cases with example input and expected output to fix edge case handling (e.g., null values in migration scripts)<\/li><li>Addressing multiple interacting issues in a single detailed message when fixes interact, versus sequential iteration for independent issues<\/li><\/ul>", "<h4>Task Statement 3.6: Integrate Claude Code into CI/CD pipelines<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>The -p (or --print) flag for running Claude Code in non-interactive mode in automated pipelines<\/li><li>--output-format json and --json-schema CLI flags for enforcing structured output in CI contexts<\/li><li>CLAUDE.md as the mechanism for providing project context (testing standards, fixture conventions, review criteria) to CI-invoked Claude Code<\/li><li>Session context isolation: why the same Claude session that generated code is less effective at reviewing its own changes compared to an independent review instance<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Running Claude Code in CI with the -p flag to prevent interactive input hangs<\/li><li>Using --output-format json with --json-schema to produce machine-parseable structured findings for automated posting as inline PR comments<\/li><li>Including prior review findings in context when re-running reviews after new commits, instructing Claude to report only new or still-unaddressed issues to avoid duplicate comments<\/li><li>Providing existing test files in context so test generation avoids suggesting duplicate scenarios already covered by the test suite<\/li><li>Documenting testing standards, valuable test criteria, and available fixtures in CLAUDE.md to improve test generation quality and reduce low-value test output<\/li><\/ul>", "<h3>Domain 4: Prompt Engineering &amp; Structured Output<\/h3>", "<h4>Task Statement 4.1: Design prompts with explicit criteria to improve precision and reduce false positives<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>The importance of explicit criteria over vague instructions (e.g., \"flag comments only when claimed behavior contradicts actual code behavior\" vs \"check that comments are accurate\")<\/li><li>How general instructions like \"be conservative\" or \"only report high-confidence findings\" fail to improve precision compared to specific categorical criteria<\/li><li>The impact of false positive rates on developer trust: high false positive categories undermine confidence in accurate categories<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Writing specific review criteria that define which issues to report (bugs, security) versus skip (minor style, local patterns) rather than relying on confidence-based filtering<\/li><li>Temporarily disabling high false-positive categories to restore developer trust while improving prompts for those categories<\/li><li>Defining explicit severity criteria with concrete code examples for each severity level to achieve consistent classification<\/li><\/ul>", "<h4>Task Statement 4.2: Apply few-shot prompting to improve output consistency and quality<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Few-shot examples as the most effective technique for achieving consistently formatted, actionable output when detailed instructions alone produce inconsistent results<\/li><li>The role of few-shot examples in demonstrating ambiguous-case handling (e.g., tool selection for ambiguous requests, branch-level test coverage gaps)<\/li><li>How few-shot examples enable the model to generalize judgment to novel patterns rather than matching only pre-specified cases<\/li><li>The effectiveness of few-shot examples for reducing hallucination in extraction tasks (e.g., handling informal measurements, varied document structures)<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Creating 2-4 targeted few-shot examples for ambiguous scenarios that show reasoning for why one action was chosen over plausible alternatives<\/li><li>Including few-shot examples that demonstrate specific desired output format (location, issue, severity, suggested fix) to achieve consistency<\/li><li>Providing few-shot examples distinguishing acceptable code patterns from genuine issues to reduce false positives while enabling generalization<\/li><li>Using few-shot examples to demonstrate correct handling of varied document structures (inline citations vs bibliographies, methodology sections vs embedded details)<\/li><li>Adding few-shot examples showing correct extraction from documents with varied formats to address empty/null extraction of required fields<\/li><\/ul>", "<h4>Task Statement 4.3: Enforce structured output using tool use and JSON schemas<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Tool use (tool_use) with JSON schemas as the most reliable approach for guaranteed schema-compliant structured output, eliminating JSON syntax errors<\/li><li>The distinction between tool_choice: \"auto\" (model may return text instead of calling a tool), \"any\" (model must call a tool but can choose which), and forced tool selection (model must call a specific named tool)<\/li><li>That strict JSON schemas via tool use eliminate syntax errors but do not prevent semantic errors (e.g., line items that don't sum to total, values in wrong fields)<\/li><li>Schema design considerations: required vs optional fields, enum fields with \"other\" + detail string patterns for extensible categories<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Defining extraction tools with JSON schemas as input parameters and extracting structured data from the tool_use response<\/li><li>Setting tool_choice: \"any\" to guarantee structured output when multiple extraction schemas exist and the document type is unknown<\/li><li>Forcing a specific tool with tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"} to ensure a particular extraction runs before enrichment steps<\/li><li>Designing schema fields as optional (nullable) when source documents may not contain the information, preventing the model from fabricating values to satisfy required fields<\/li><li>Adding enum values like \"unclear\" for ambiguous cases and \"other\" + detail fields for extensible categorization<\/li><li>Including format normalization rules in prompts alongside strict output schemas to handle inconsistent source formatting<\/li><\/ul>", "<h4>Task Statement 4.4: Implement validation, retry, and feedback loops for extraction quality<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Retry-with-error-feedback: appending specific validation errors to the prompt on retry to guide the model toward correction<\/li><li>The limits of retry: retries are ineffective when the required information is simply absent from the source document (vs format or structural errors)<\/li><li>Feedback loop design: tracking which code constructs trigger findings (detected_pattern field) to enable systematic analysis of dismissal patterns<\/li><li>The difference between semantic validation errors (values don't sum, wrong field placement) and schema syntax errors (eliminated by tool use)<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Implementing follow-up requests that include the original document, the failed extraction, and specific validation errors for model self-correction<\/li><li>Identifying when retries will be ineffective (e.g., information exists only in an external document not provided) versus when they will succeed (format mismatches, structural output errors)<\/li><li>Adding detected_pattern fields to structured findings to enable analysis of false positive patterns when developers dismiss findings<\/li><li>Designing self-correction validation flows: extracting \"calculated_total\" alongside \"stated_total\" to flag discrepancies, adding \"conflict_detected\" booleans for inconsistent source data<\/li><\/ul>", "<h4>Task Statement 4.5: Design efficient batch processing strategies<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>The Message Batches API: 50% cost savings, up to 24-hour processing window, no guaranteed latency SLA<\/li><li>Batch processing is appropriate for non-blocking, latency-tolerant workloads (overnight reports, weekly audits, nightly test generation) and inappropriate for blocking workflows (pre-merge checks)<\/li><li>The batch API does not support multi-turn tool calling within a single request (cannot execute tools mid-request and return results)<\/li><li>custom_id fields for correlating batch request/response pairs<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Matching API approach to workflow latency requirements: synchronous API for blocking pre-merge checks, batch API for overnight/weekly analysis<\/li><li>Calculating batch submission frequency based on SLA constraints (e.g., 4-hour windows to guarantee 30-hour SLA with 24-hour batch processing)<\/li><li>Handling batch failures: resubmitting only failed documents (identified by custom_id) with appropriate modifications (e.g., chunking documents that exceeded context limits)<\/li><li>Using prompt refinement on a sample set before batch-processing large volumes to maximize first-pass success rates and reduce iterative resubmission costs<\/li><\/ul>", "<h4>Task Statement 4.6: Design multi-instance and multi-pass review architectures<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Self-review limitations: a model retains reasoning context from generation, making it less likely to question its own decisions in the same session<\/li><li>Independent review instances (without prior reasoning context) are more effective at catching subtle issues than self-review instructions or extended thinking<\/li><li>Multi-pass review: splitting large reviews into per-file local analysis passes plus cross-file integration passes to avoid attention dilution and contradictory findings<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Using a second independent Claude instance to review generated code without the generator's reasoning context<\/li><li>Splitting large multi-file reviews into focused per-file passes for local issues plus separate integration passes for cross-file data flow analysis<\/li><li>Running verification passes where the model self-reports confidence alongside each finding to enable calibrated review routing<\/li><\/ul>", "<h3>Domain 5: Context Management &amp; Reliability<\/h3>", "<h4>Task Statement 5.1: Manage conversation context to preserve critical information across long interactions<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Progressive summarization risks: condensing numerical values, percentages, dates, and customer-stated expectations into vague summaries<\/li><li>The \"lost in the middle\" effect: models reliably process information at the beginning and end of long inputs but may omit findings from middle sections<\/li><li>How tool results accumulate in context and consume tokens disproportionately to their relevance (e.g., 40+ fields per order lookup when only 5 are relevant)<\/li><li>The importance of passing complete conversation history in subsequent API requests to maintain conversational coherence<\/li><\/ul>\n<p><strong>Skills in:<\/strong><\/p>\n<ul><li>Extracting transactional facts (amounts, dates, order numbers, statuses) into a persistent \"case facts\" block included in each prompt, outside summarized history<\/li><li>Extracting and persisting structured issue data (order IDs, amounts, statuses) into a separate context layer for multi-issue sessions<\/li><li>Trimming verbose tool outputs to only relevant fields before they accumulate in context (e.g., keeping only return-relevant fields from order lookups)<\/li><li>Placing key findings summaries at the beginning of aggregated inputs and organizing detailed results with explicit section headers to mitigate position effects<\/li><li>Requiring subagents to include metadata (dates, source locations, methodological context) in structured outputs to support accurate downstream synthesis<\/li><li>Modifying upstream agents to return structured data (key facts, citations, relevance scores) instead of verbose content and reasoning chains when downstream agents have limited context budgets<\/li><\/ul>", "<h4>Task Statement 5.2: Design effective escalation and ambiguity resolution patterns<\/h4>\n<p><strong>Knowledge of:<\/strong><\/p>\n<ul><li>Appropriate escalation triggers: customer requests for a human, policy exceptions/gaps (not just complex cases), and inability to make meaningful progress<\/li><li>The distinction between escalating immediately when a customer explicitly demands it versus offering to resolve when the issue is st
